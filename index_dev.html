    // 開きっぱなしのタブが旧コードのまま動き続けるのを防ぐ。画面復帰時と定期に自分自身を
    // no-store+クエリ付きで取得し、__APP_BUILD が変わっていれば「更新」バナーを表示する。
    // 本番デプロイ時は port_to_main.js が __APP_BUILD を自動更新する（手動更新不要）。
    window.__APP_BUILD='build-1790644461671';
    (function(){
      var RUNNING=window.__APP_BUILD, shown=false, checking=false;
      function runningVer(){
        try{ var s=document.querySelectorAll('script');   /* モバイルは変換結果を別scriptに入れ直すので、種類を問わず全部見る */
          for(var i=0;i<s.length;i++){ var mm=s[i].textContent.match(/(?:APP_VERSION|MOBILE_VERSION)\s*=\s*'([^']+)'/); if(mm)return mm[1]; } }catch(e){}
        return '';
      }
      function banner(){
        if(shown)return; if(!document.body){setTimeout(banner,500);return;} shown=true;   // 本文がまだ無い（CDNの読み込み待ち）なら少し待って出す。以前はここで諦めて帯が出なかった
        var b=document.createElement('div');
        b.textContent='🔄 新しいバージョンがあります（タップして更新）';
        b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#1d4ed8;color:#fff;text-align:center;padding:14px 12px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 -2px 12px rgba(0,0,0,.35)';
        // ★保存がまだGASに着地していない状態でリロードすると、その保存は失われる
        //   （GASへの書き込みは10〜27秒かかる）。書き込みが残っている間は待ってから更新する。
        b.onclick=function(){
          var waited=0;
          (function go(){
            if((window.__hubWriteBusy||0)>0&&waited<180000){
              b.textContent='保存中です… 完了までお待ちください（'+Math.round(waited/1000)+'秒）';
              waited+=1000;setTimeout(go,1000);return;
            }
            b.textContent='更新中…';location.reload();
          })();
        };
        window.addEventListener('beforeunload',function(ev){
          if((window.__hubWriteBusy||0)>0){ev.preventDefault();ev.returnValue='';return '';}
        });
        document.body.appendChild(b);
      }
      async function check(){
        if(shown||checking||navigator.onLine===false)return; checking=true;
        try{
          var res=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
          if(res&&res.ok){
            var t=await res.text();
            var m=t.match(/__APP_BUILD='(build-\d+)'/);
            // ★ビルド識別子だけでなく、バージョン番号（APP_VERSION / MOBILE_VERSION）の違いでも出す。
            //   識別子の更新を忘れると帯が出ず、スタッフが古い画面を使い続けていた（2026-09-12）。
            var mv=t.match(/(?:APP_VERSION|MOBILE_VERSION)\s*=\s*'([^']+)'/), rv=runningVer();
            if((m&&m[1]!==RUNNING)||(mv&&rv&&mv[1]!==rv))banner();
          }
        }catch(e){}
        checking=false;
      }
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
      setTimeout(check,8000);   // 開いてすぐ（8秒）に1回。古い画面のまま使い始めないように
      setInterval(check,15*60*1000);
    })();

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return{error:e};}
  render(){
    if(this.state.error)return(
      <div style={{padding:32,background:'#fef2f2',minHeight:'100vh',fontFamily:'monospace'}}>
        <h2 style={{color:'#dc2626'}}>レンダリングエラー（開発用表示）</h2>
        <pre style={{color:'#991b1b',fontSize:12,whiteSpace:'pre-wrap'}}>{this.state.error?.message}\n{this.state.error?.stack}</pre>
        <button onClick={()=>this.setState({error:null})} style={{marginTop:16,padding:'8px 16px',background:'#c2410c',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}>リセット</button>
      </div>
    );
    return this.props.children;
  }
}

//   ★A案（2026-09-21 ユーザー決定）：繰り越した日数は翌月の一番早い休日から順に「○月繰り越し分」として充てる（carried）。
//     画面は「枠」を見せず、集計に「うち店休日N＋繰り越し休日M」、右のバッジは翌月へ回る分だけ「繰り越しN日」と出す。
//   数字の無い月で繰越は途切れる（連続して設定した月の間だけ流れる）。
//   PC のスタッフ休日カレンダー・閲覧カレンダー・スマホの休日タブで同じ計算を使う。
const calcHolidayCarry=(name,cy,cm,dayOff,isClosed,mhol)=>{
  const num=k=>{const v=(mhol||{})[k];return (v==null||v===''||isNaN(Number(v)))?null:Number(v);};
  const months=Object.keys(mhol||{}).map(k=>{const p=k.split('-').map(Number);return (p.length===2&&p[0]>2000&&p[1]>=1&&p[1]<=12&&num(k)!=null)?{y:p[0],m:p[1]-1}:null;}).filter(Boolean).sort((a,b)=>a.y-b.y||a.m-b.m);
  if(!months.length)return null;
  const taken=(y,m)=>{const dim=new Date(y,m+1,0).getDate();let o=0;for(let d=1;d<=dim;d++){if(isClosed(y,m,d)){o++;continue;}if(((dayOff||{})[`${y}-${m+1}-${d}`]||[]).includes(name))o++;}return o;};
  let carry=0,y=months[0].y,m=months[0].m,guard=0;
  while((y<cy||(y===cy&&m<cm))&&guard++<240){
    const c=num(`${y}-${m+1}`); carry=(c==null)?0:Math.max(0,carry+c-taken(y,m));   // 未設定の月で途切れる。超過はマイナスで持ち越さない（有給扱い）
    m++; if(m>11){m=0;y++;}
  }
  const company=num(`${cy}-${cm+1}`);
  const t=taken(cy,cm);
  const quota=company==null?null:company+carry;
  const over=quota==null?0:Math.max(0,t-quota);   // 枠を超えた休日の数（集計では有給に数える）
  // 繰り越し分を充てた日：この月の本人の休日（店休日を除く）を日付順に、繰越の日数だけ
  const days=[];{const dim=new Date(cy,cm+1,0).getDate();for(let d=1;d<=dim;d++){if(!isClosed(cy,cm,d)&&((dayOff||{})[`${cy}-${cm+1}-${d}`]||[]).includes(name))days.push(d);}}
  const carried=days.slice(0,Math.min(carry,days.length));
  return {carryIn:carry,company,taken:t,quota,remain:quota==null?null:Math.max(0,quota-t),over,carried,carriedN:carried.length,fromM:cm===0?12:cm};
};
// バッジの文言：翌月へ回る分だけ「繰り越しN日」。使い切っていれば何も出さない（空文字）。枠を超えた分は有給扱いと出す
const carryLabel=(c,long)=>{
  if(!c||c.quota==null)return '';
  if(c.remain>0)return long?`繰り越し${c.remain}日 →翌月へ`:`繰越${c.remain}日`;
  if(c.over>0)return `${c.over}日超過→有給扱い`;
  return '';
};
// 集計の内訳「（うち店休日N＋繰り越し休日M）」
const offBreakdown=(closedN,c)=>{const p=[];if(closedN>0)p.push(`店休日 ${closedN}`);if(c&&c.carriedN>0)p.push(`繰り越し休日 ${c.carriedN}`);return p.length?`（うち${p.join('＋')}）`:'';};
const carriedLabel=c=>c?`${c.fromM}月繰り越し分`:'';
const carryTitle=c=>c&&c.quota!=null?`会社の休日数 ${c.company}日 ＋ 前月からの繰り越し ${c.carryIn}日 ＝ ${c.quota}日。取得 ${c.taken}日（店休日を含む・有給は数えない）。繰り越し分は今月の一番早い休日から充てます。使い切った後の休日は自動で有給になります`:'';
// ============================================
//  マイスケジュール（2026-09-20・アイデア仕様書③）— PC と mobile で同じコードを置く
//   ・公開予定：kv の ${STOR}mysched = { id: {dk, time, title, memo, owner(氏名), uid(スタッフuid), at} }。全員が読める。編集・削除は本人だけ
//   ・シークレット予定：kv の ${STOR}mysec-{スタッフuid} に **暗号化して** 保存（C案・ユーザー決定）。
//       { hint, salt, iter, checkIv, check, iv, data, u }。data = AES-GCM で暗号化した { id: {dk,time,title,memo,at} }。
//       鍵は「ヒントに対する答え」から PBKDF2 で作る。答えは正規化（全角→半角・空白除去・小文字）してから使う。
//       サーバーには暗号文とヒントだけが残るので、他のスタッフ・管理者・運営（サービスアカウント鍵を持つ人）も中身は読めない。
//       ★答えを忘れると誰にも復元できない（リセット＝シークレット予定を全部消して作り直す）。
//   ・開いた鍵は「自分専用の端末」ならそのタブの sessionStorage に置く（タブを閉じれば消える。リロードでは聞き直さない）。
//     共有端末（店のPC・タブレット）では覚えない＝毎回答えを入れる。人が変わった時（ログアウト・別の人でログイン）は
//     タブに残っている鍵を全部捨てる。→ 共有PCで他人が自分の名前でログインしてもシークレット予定は開けない（2026-09-20 ユーザー要望）。
//   ・書庫は購読する（別端末で消した・足した予定がすぐ反映される）。
// ============================================
const HubSecret={
  ITER:150000,
  norm:a=>String(a||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase(),
  b64:u8=>{let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);},
  unb64:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
  ok:()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues),
  async derive(answer,saltB64,iter){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(HubSecret.norm(answer)),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:HubSecret.unb64(saltB64),iterations:iter||HubSecret.ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  },
  async encrypt(key,obj){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
    return {iv:HubSecret.b64(iv),data:HubSecret.b64(new Uint8Array(ct))};
  },
  async decrypt(key,ivB64,dataB64){
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:HubSecret.unb64(ivB64)},key,HubSecret.unb64(dataB64));
    return JSON.parse(new TextDecoder().decode(pt));
  },
  async exportKey(key){return HubSecret.b64(new Uint8Array(await crypto.subtle.exportKey('raw',key)));},
  async importKey(b64){return crypto.subtle.importKey('raw',HubSecret.unb64(b64),{name:'AES-GCM'},true,['encrypt','decrypt']);},
  // 新しいヒント・答えで書庫を作る（items を暗号化して入れる）
  async makeDoc(hint,answer,items){
    const salt=HubSecret.b64(crypto.getRandomValues(new Uint8Array(16)));
    const key=await HubSecret.derive(answer,salt,HubSecret.ITER);
    const chk=await HubSecret.encrypt(key,{ok:1});
    const enc=await HubSecret.encrypt(key,items||{});
    return {key,doc:{hint:String(hint||'').slice(0,60),salt,iter:HubSecret.ITER,checkIv:chk.iv,check:chk.data,iv:enc.iv,data:enc.data,u:Date.now()}};
  },
  sessKey:uid=>STOR+'mysec-key-'+uid,
  canRemember:()=>{try{return localStorage.getItem(STOR+'auth-kind')==='own';}catch(e){return false;}},   // 自分専用の端末だけ
  forgetOthers:uid=>{try{for(let i=sessionStorage.length-1;i>=0;i--){const k=sessionStorage.key(i);if(k&&k.indexOf(STOR+'mysec-key-')===0&&(!uid||k!==HubSecret.sessKey(uid)))sessionStorage.removeItem(k);}}catch(e){}},   // 今の人以外の鍵を捨てる（uid 無し＝全部）
  // 書庫の購読（PC・mobile 共通。Firestore の onSnapshot。手元キャッシュ由来の値は使わない）
  subscribe:(k,cb)=>{
    if(typeof FB_ON==='undefined'||!FB_ON)return ()=>{};
    let un=null,dead=false;
    const start=()=>{ if(dead||un)return; try{ un=fbDoc(k).onSnapshot({includeMetadataChanges:false},snap=>{ if(snap.metadata&&snap.metadata.fromCache&&!snap.exists)return; try{cb(fbParse(snap));}catch(e){} },err=>{ console.warn('[mysec] 購読に失敗',k,err&&err.message); }); }catch(e){} };
    if(typeof fbAuth!=='undefined'&&fbAuth)fbWhenUser(start); else start();
    return ()=>{dead=true;try{un&&un();}catch(e){}};
  },
};
// 予定の並び（時刻→作成順）
const hubSchedSort=(a,b)=>((a.time||'99:99')<(b.time||'99:99')?-1:(a.time||'99:99')>(b.time||'99:99')?1:(a.at||0)-(b.at||0));
const hubSchedId=()=>'ms'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ── シークレット書庫のフック。sGet/saveKv は各画面のデータ層（PC: sGet/writeVerified、mobile: sGet/writeShared）──
function useHubSecret(staffUid,sGetFn,saveKv){
  const key=staffUid?STOR+'mysec-'+staffUid:null;
  const [doc,setDoc]=useState(undefined);       // undefined=読込中 / null=未設定 / {..}=設定済み
  const [ckey,setCkey]=useState(null);           // 開いた鍵（CryptoKey）
  const [items,setItems]=useState(null);         // 復号した予定
  const [busy,setBusy]=useState(false);
  const reload=useCallback(async()=>{
    if(!key)return;
    try{const v=await sGetFn(key);setDoc(v&&typeof v==='object'&&v.salt?v:null);}catch(e){setDoc(null);}
  },[key]);
  useEffect(()=>{setDoc(undefined);setCkey(null);setItems(null);HubSecret.forgetOthers(staffUid);reload();},[key]);   // 人が変わったら鍵を全部捨てる
  // 書庫を購読：別端末で足した・消した予定がすぐ反映される（読込済みの値だけ。読込前の初回は reload が担当）
  useEffect(()=>{
    if(!key)return;
    const un=HubSecret.subscribe(key,v=>{setDoc(v&&typeof v==='object'&&v.salt?v:null);});
    return un;
  },[key]);
  // 開いた鍵をタブ内から戻す（自分専用の端末だけ）
  useEffect(()=>{(async()=>{
    if(!staffUid||!HubSecret.ok()||!HubSecret.canRemember())return;
    let raw=null;try{raw=sessionStorage.getItem(HubSecret.sessKey(staffUid));}catch(e){}
    if(raw){try{setCkey(await HubSecret.importKey(raw));}catch(e){}}
  })();},[staffUid]);
  // 鍵と書庫が揃ったら復号
  useEffect(()=>{(async()=>{
    if(!ckey||!doc){setItems(null);return;}
    try{const v=await HubSecret.decrypt(ckey,doc.iv,doc.data);setItems(v&&typeof v==='object'?v:{});}
    catch(e){ // 答えが変えられた（別端末）等：鍵を捨てて聞き直す
      setItems(null);setCkey(null);try{sessionStorage.removeItem(HubSecret.sessKey(staffUid));}catch(x){}
    }
  })();},[ckey,doc]);
  const remember=async k=>{if(!HubSecret.canRemember())return;try{sessionStorage.setItem(HubSecret.sessKey(staffUid),await HubSecret.exportKey(k));}catch(e){}};
  const status=!HubSecret.ok()?'unsupported':doc===undefined?'loading':!doc?'none':(ckey&&items)?'open':'locked';
  const unlock=async answer=>{
    if(!doc)return false;
    setBusy(true);
    try{
      const k=await HubSecret.derive(answer,doc.salt,doc.iter);
      try{await HubSecret.decrypt(k,doc.checkIv,doc.check);}catch(e){return false;}
      await remember(k);setCkey(k);return true;
    }finally{setBusy(false);}
  };
  // 初回設定／リセット（リセットは予定を全部消す）
  const setup=async(hint,answer)=>{
    setBusy(true);
    try{
      const {key:k,doc:d}=await HubSecret.makeDoc(hint,answer,{});
      const ok=await saveKv(key,()=>d); if(!ok)return false;
      setDoc(d);await remember(k);setCkey(k);return true;
    }finally{setBusy(false);}
  };
  // ヒント・答えを変える（今の答えで開けている時だけ。予定は引き継ぐ）
  const change=async(hint,answer)=>{
    if(!items)return false;
    setBusy(true);
    try{
      const {key:k,doc:d}=await HubSecret.makeDoc(hint,answer,items);
      const ok=await saveKv(key,()=>d); if(!ok)return false;
      setDoc(d);await remember(k);setCkey(k);return true;
    }finally{setBusy(false);}
  };
  const save=async next=>{
    if(!ckey||!doc)return false;
    setBusy(true);
    try{
      const enc=await HubSecret.encrypt(ckey,next);
      const d={...doc,iv:enc.iv,data:enc.data,u:Date.now()};
      const ok=await saveKv(key,()=>d); if(!ok)return false;
      setDoc(d);setItems(next);return true;
    }finally{setBusy(false);}
  };
  const lock=()=>{setCkey(null);setItems(null);try{sessionStorage.removeItem(HubSecret.sessKey(staffUid));}catch(e){}};
  return {status,hint:doc&&doc.hint||'',items:items||{},busy,unlock,setup,change,save,lock,reload};
}

// ── 公開予定（mysched）の読み：サーバー値をそのまま使う小さなフック（PC 用）──
//   useShared は {車:{日:予約}} 向けの「手元の新しい行を残す」マージをするため、{id:予定} の形だと
//   消した予定が手元から復活する（削除できない・公開⇄🔒の切替で2つになる：2026-09-20 の不具合）。
//   予定の書き込みは writeVerified（トランザクション）で、購読がその結果を運ぶので手元マージは要らない。
function useHubKv(key,sGetFn){
  const [val,setVal]=useState({});
  useEffect(()=>{
    if(!key)return;
    let alive=true,got=false;
    sGetFn(key).then(v=>{ if(alive&&!got&&v&&typeof v==='object')setVal(v); }).catch(()=>{});
    const un=HubSecret.subscribe(key,v=>{ if(!alive)return; got=true; setVal(v&&typeof v==='object'?v:{}); });
    return ()=>{alive=false;un();};
  },[key]);
  return val;
}

        if(ok===false){setMsg('保存できませんでした。もう一度お試しください');return;}

      <span style={{fontSize:11,fontWeight:800,color:it.secret?'#6d28d9':'#1d4ed8',width:42,flexShrink:0,marginTop:1}}>{it.time||'—'}</span>

const MySchedCalendar=({cy,cm,user,pub,secret,isClosedDay,onPickDay,storeLabelOf,myOff})=>{   // myOff(day) → {kind:'dayoff'|'leave', note, carried}｜null（自分の休日。スタッフ休日と同期）
  const today=new Date();
  const dim=new Date(cy,cm+1,0).getDate();
  const first=new Date(cy,cm,1).getDay();
  const byDay={};
  const add=(it)=>{const p=String(it.dk||'').split('-').map(Number);if(p[0]!==cy||p[1]!==cm+1)return;(byDay[p[2]]=byDay[p[2]]||[]).push(it);};
  Object.entries(pub||{}).forEach(([id,v])=>{if(v&&v.dk)add({...v,id});});
  Object.entries(secret.items||{}).forEach(([id,v])=>{if(v&&v.dk)add({...v,id,secret:true});});
  const weeks=[];let wk=Array(7).fill(null);
  for(let d=1;d<=dim;d++){const dow=(first+d-1)%7;wk[dow]=d;if(dow===6||d===dim){weeks.push([...wk]);wk=Array(7).fill(null);}}
  const DOWS=['日','月','火','水','木','金','土'];
  return(
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,overflow:'hidden',margin:'0 18px 18px',border:'2px solid #e5e7eb',borderRadius:9}}>
      <div style={{overflowY:'auto',flex:1}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'linear-gradient(90deg,#eff6ff,#f5f3ff)',borderBottom:'2px solid #c7d2fe'}}>
          {DOWS.map((d,i)=><div key={i} style={{padding:'8px 0',textAlign:'center',fontWeight:700,fontSize:13,color:i===0?'#dc2626':i===6?'#1d4ed8':'#374151'}}>{d}</div>)}
        </div>
        {weeks.map((week,wi)=>(
          <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
            {week.map((day,di)=>{
              if(!day)return <div key={di} style={{minHeight:110,borderTop:'1px solid #e5e7eb',borderLeft:di>0?'1px solid #e5e7eb':'none',background:'#f9fafb'}}/>;
              const dkk=`${cy}-${cm+1}-${day}`;
              const isToday=day===today.getDate()&&cm===today.getMonth()&&cy===today.getFullYear();
              const isCl=isClosedDay?isClosedDay(cy,cm,day):false;
              const list=(byDay[day]||[]).sort(hubSchedSort);
              const dow=new Date(cy,cm,day).getDay();
              const off=(!isCl&&myOff)?myOff(day):null;   // 自分の休日／有給
              const baseBg=isCl?(typeof CLOSED_BG!=='undefined'?CLOSED_BG:'#f3f4f6'):off?(off.kind==='leave'?'#f0fdf4':'#fff7ed'):'white';
              return(
                <div key={di} onClick={()=>onPickDay(dkk)}
                  style={{minHeight:110,padding:'5px 4px',borderTop:'1px solid #e5e7eb',borderLeft:di>0?'1px solid #e5e7eb':'none',background:baseBg,boxShadow:off?`inset 3px 0 0 ${off.kind==='leave'?'#10b981':'#f97316'}`:'none',cursor:'pointer',position:'relative',...(isToday?TODAY_CELL:{})}}
                  onMouseEnter={e=>{e.currentTarget.style.background=isCl?'#e5e7eb':off?(off.kind==='leave'?'#dcfce7':'#ffedd5'):'#f8fafc';}} onMouseLeave={e=>{e.currentTarget.style.background=baseBg;}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:3}}>
                    <span style={isToday?{fontWeight:900,fontSize:14,...TODAY_NUM}:{fontWeight:800,fontSize:14,color:dow===0?'#dc2626':dow===6?'#1d4ed8':'#111'}}>{day}</span>
                    {isCl&&<span style={{fontSize:11,color:'#9ca3af',fontWeight:800}}>休業日</span>}
                    {off&&<span title={`${user.name}の${off.kind==='leave'?'有給':'休日'}${off.carried?'（'+off.carried+'）':''}${off.note?'：'+off.note:''}`} style={{fontSize:10,fontWeight:800,color:off.kind==='leave'?'#059669':'#ea580c',background:'white',border:`1px solid ${off.kind==='leave'?'#6ee7b7':'#fdba74'}`,borderRadius:4,padding:'0 5px',whiteSpace:'nowrap'}}>{off.kind==='leave'?'📋 有給':'🏖 休日'}</span>}
                  </div>
                  {off&&(off.carried||off.note)&&<div style={{fontSize:9.5,color:off.kind==='leave'?'#047857':'#9a3412',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{off.carried?'↩'+off.carried+' ':''}{off.note?'📝'+off.note:''}</div>}
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    {list.slice(0,4).map(it=>{
                      const mine=it.secret||it.uid===user.uid;
                      return(
                        <div key={it.id} title={`${it.time?it.time+' ':''}${it.title}${it.secret?'（シークレット）':'（'+(it.owner||'')+'）'}${it.memo?'\n'+it.memo:''}`}
                          style={{fontSize:10.5,padding:'2px 5px',borderRadius:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                            background:it.secret?'#f5f3ff':mine?'#eff6ff':'#f3f4f6',border:`1px solid ${it.secret?'#c4b5fd':mine?'#93c5fd':'#e5e7eb'}`,color:it.secret?'#5b21b6':mine?'#1e40af':'#374151',fontWeight:mine?700:500}}>
                          {it.secret?'🔒':''}{it.time&&<span style={{fontWeight:800,marginRight:3}}>{it.time}</span>}{it.title}{!it.secret&&!mine&&<span style={{color:'#9ca3af',marginLeft:3}}>{String(it.owner||'').slice(0,2)}</span>}
                        </div>
                      );
                    })}
                    {list.length>4&&<div style={{fontSize:10,color:'#6b7280'}}>＋{list.length-4}件</div>}
                  </div>

// ── 月間休日数バッジ（スタッフ休日カレンダーの上部）──
//   会社が月ごとに決める休日数を出すだけの表示。スタッフが自分で数えなくて済むようにするもので、
//   休業日データや集計には影響しない。鉛筆が出るのは編集権限のある4人だけ。
const MonthlyHolidayBadge = ({y,m,value,canEdit,onSave})=>{
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState('');
  const [busy,setBusy]=useState(false);
  useEffect(()=>{setEditing(false);},[y,m]);
  const commit=async()=>{
    const s=String(val).trim();
    const n=s===''?null:Math.max(0,Math.min(31,Math.round(Number(s))));
    if(s!==''&&!Number.isFinite(n)){setEditing(false);return;}
    setBusy(true);
    await onSave(y,m,n);
    setBusy(false);setEditing(false);
  };
  const box={display:'flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:7,
    background:'#eef2ff',border:'2px solid #c7d2fe',fontSize:11,color:'#3730a3',whiteSpace:'nowrap'};
  if(editing){
    return (
      <span style={{...box,background:'white',borderColor:'#6366f1'}}>
        <span style={{fontWeight:700}}>{m+1}月の休日</span>
        <input autoFocus type="number" min="0" max="31" value={val} disabled={busy}
          onChange={e=>setVal(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter')commit();if(e.key==='Escape')setEditing(false);}}
          style={{width:52,padding:'2px 6px',border:'2px solid #c7d2fe',borderRadius:5,fontSize:12,fontWeight:800,textAlign:'center'}}/>
        <span style={{fontWeight:700}}>日</span>
        <button onClick={commit} disabled={busy}
          style={{padding:'2px 9px',borderRadius:5,border:'none',background:'#4f46e5',color:'white',fontWeight:800,fontSize:11,cursor:busy?'wait':'pointer'}}>
          {busy?'保存中…':'保存'}
        </button>
        <button onClick={()=>setEditing(false)} disabled={busy}
          style={{padding:'2px 7px',borderRadius:5,border:'1px solid #d1d5db',background:'white',color:'#6b7280',fontSize:11,cursor:'pointer'}}>やめる</button>
      </span>
    );
  }
  return (
    <span style={box} title={canEdit?'クリックで今月の休日数を入力（管理者のみ）':'会社が決めた今月の休日数'}>
      <span style={{fontWeight:700}}>{m+1}月の休日</span>
      <span style={{fontWeight:900,fontSize:14}}>{value!=null?`${value}日`:'未設定'}</span>
      {canEdit&&(
        <button onClick={()=>{setVal(value!=null?String(value):'');setEditing(true);}}
          style={{padding:'1px 7px',borderRadius:5,border:'1px solid #c7d2fe',background:'white',color:'#4f46e5',fontSize:10,fontWeight:800,cursor:'pointer'}}>
          {value!=null?'変更':'入力'}
        </button>
      )}
    </span>
  );
};

// スロットのサブキー（複数行）ユーティリティ
// 基本スロット: '09:00'  追加行: '09:00__1', '09:00__2', ...
const parseSlotKey = (key) => {
  const m = key.match(/^(.+)__(\d+)$/);
  return m ? {base: m[1], sub: parseInt(m[2])} : {base: key, sub: 0};
};
const makeSlotKey = (base, sub) => sub === 0 ? base : `${base}__${sub}`;
const getBaseSlot = (key) => parseSlotKey(key).base;
// 指定日・指定baseSlotの全サブキーを取得（存在するもののみ）
const getSlotSubKeys = (dayData, base) => {
  if(!dayData) return [base];
  const keys = [base, ...Object.keys(dayData).filter(k => k.startsWith(base+'__')).sort()];
  return keys;
};

const TIME_SLOTS = (()=>{

// 法人格（前置・後置）を落として固有名だけ返す。代車管理のセルのように幅が狭い場所だけで使う。

const shortenCorpName=(name)=>{
  const orig=String(name==null?'':name).trim();
  let s=orig;
  for(const t of CORP_TOKENS){
    if(s.startsWith(t)){s=s.slice(t.length);break;}
    if(s.endsWith(t)){s=s.slice(0,s.length-t.length);break;}
  }
  s=s.replace(/^[\s　()（）・]+/,'').replace(/[\s　()（）・]+$/,'');
  return s||orig; // 法人格だけの名前など、削ると空になる場合は元のまま
};

// 予約バーの配色。白文字が読める濃さで、薄い同系色を隣り合わせにしないよう暖色/寒色を交互に並べた12色。
const RES_COLORS=['#2563eb','#c2410c','#059669','#7c3aed','#be123c','#0e7490','#b45309','#be185d','#4d7c0f','#4338ca','#0f766e','#9a3412'];
// 代車・レンタカー予約の表示色。利用者（custId または名前）から決める＝同じお客様は常に同じ色、違うお客様は違う色。
//   記録された color は「名前を入れる前（未入力）」の時点で決まっていて、同じ日の予約が全部同じ色になっていた
//   （2026-09-17 報告）。表示はここで決め直すので、過去の予約もそのまま色分けされる。
const resColorOf=res=>{
  if(!res) return RES_COLORS[0];
  const key=String(res.custId||res.user||'').trim();
  if(!key||key==='（未入力）'||key==='（予約中）') return res.color||RES_COLORS[0];
  let h=5381; for(const c of key){ h=((h*33)^c.charCodeAt(0))>>>0; }   // djb2：文字の並びが違えば別の値になりやすい
  return RES_COLORS[h%RES_COLORS.length];
};
// 期間が重なる予約どうしは必ず違う色にする（12色まで）。表示のたびに全予約から決める純関数。
//   まず本人の色（resColorOf）を使い、期間の重なる予約と同じ色なら、重なる予約が使っていない次の色を選ぶ。
//   同じお客様の別の予約（同じ名前）は同じ色のまま。戻り値は { 予約id: 色 }。
const assignResColors=resMap=>{
  const all=[];
  for(const cid of Object.keys(resMap||{})){
    const days=resMap[cid]; if(!days||typeof days!=='object'||Array.isArray(days))continue;
    for(const r of Object.values(days)){ if(r&&r.id!=null&&r.fy!=null) all.push(r); }
  }
  const num=(y,m,d)=>y*10000+m*100+d;
  all.sort((a,b)=>(num(a.fy,a.fm,a.fd)-num(b.fy,b.fm,b.fd))||(String(a.id)>String(b.id)?1:-1));
  const out={}, placed=[];
  for(const r of all){
    const s=num(r.fy,r.fm,r.fd), e=num(r.ty,r.tm,r.td);
    const key=String(r.custId||r.user||'').trim();
    const used=new Set();
    for(const p of placed){
      if(p.e<s||p.s>e)continue;                       // 期間が重ならない
      if(key&&p.key===key)continue;                   // 同じお客様は同じ色でよい
      used.add(out[p.id]);
    }
    let c=resColorOf(r);
    if(used.has(c)){ const alt=RES_COLORS.find(x=>!used.has(x)); if(alt)c=alt; }
    out[r.id]=c; placed.push({id:r.id,s,e,key});
  }
  return out;
};

const excelDateToStr = (v) => {
  if(!v) return '';
  if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    d.setMinutes(d.getMinutes() + d.getTimezoneOffset());
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return String(v);
};
const dateStrToLabel = (s) => {
  if(!s) return '';
  const str = String(s).trim();
  // YYYY-MM-DD / YYYY/MM/DD / YYYY年M月D日
  const mt = str.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
  if(mt) return `${mt[2].padStart(2,'0')}/${mt[3].padStart(2,'0')}`;
  // すでに MM/DD 形式
  const mt2 = str.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(mt2) return `${mt2[1].padStart(2,'0')}/${mt2[2].padStart(2,'0')}`;
  return '';
};

const normalizeStore = (s) => {
  const t = String(s||'').trim();

  if(/^(honten|本店|H|h)$/.test(t)) return '本店';
  if(/^(sanda|三田|三田店|S|s)$/.test(t)) return '三田店';

// ExcelセルARGB→CSS hex（背景色取得）
const cellArgbToHex = (ws, col, row) => {
  try {
    const addr = XLSX.utils.encode_cell({r:row, c:col});
    const cell = ws[addr];
    if(!cell||!cell.s) return null;
    const fg = cell.s.fgColor || cell.s.patternFgColor || cell.s.bgColor;
    if(!fg) return null;
    const argb = fg.argb || fg.rgb || '';
    if(!argb || argb==='00000000' || argb==='FFFFFFFF' || argb.toLowerCase()==='ffffff' || argb==='FF000000') return null;
    const rgb = argb.length===8 ? argb.slice(2) : argb;
    return '#'+rgb;
  } catch(e){ return null; }
};

const parseCustExcel = (wb) => {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const allRows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:false});
  if(!allRows||!allRows.length) return [];

  const norm = s => String(s||'').replace(/[　\s]/g,'').toLowerCase();

  // ヘッダー行を先頭10行で自動検出
  let headerIdx = -1, colMap = {};
  for(let ri=0; ri<Math.min(10,allRows.length); ri++){
    const row = allRows[ri]; if(!row) continue;
    let hits=0; const cand={};
    for(let ci=0; ci<row.length; ci++){
      const cell = norm(row[ci]); if(!cell) continue;
      for(const [fld,kws] of Object.entries(COL_KEYWORDS)){
        if(!cand[fld] && kws.some(kw=>cell.includes(kw)||kw.includes(cell))){
          cand[fld]=ci; hits++;
        }
      }
    }
    if(hits>=2 && (cand.name!=null||cand.inspDate!=null)){ headerIdx=ri; colMap=cand; break; }
  }
  // フォールバック：スクリーンショット準拠（点検満了日=0列目）
  if(headerIdx<0){
    colMap={inspDate:0,name:1,no:2,carModel:3,
      mailing1:4,reserve1:5,mailing2:6,reserve2:7,
      arrivalDate:8,tokuten:9,course:10,store:11,staff:12,note:13};
    headerIdx=0;
  }

  const toDate = v => {
    if(!v||v==='') return '';
    if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
    if(typeof v==='number'){
      const d=new Date(Math.round((v-25569)*86400*1000));
      d.setMinutes(d.getMinutes()+d.getTimezoneOffset());
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    const s=String(v);
    const m=s.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    // M/D/YY 形式 (例: 6/1/26 → 2026-06-01)
    const m2=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
    if(m2) return `20${m2[3]}-${m2[1].padStart(2,'0')}-${m2[2].padStart(2,'0')}`;
    return s;
  };

  const g = (row,fld) => row[colMap[fld]??-1] ?? null;

  const result = [];
  for(let ri=headerIdx+1; ri<allRows.length; ri++){
    const r = allRows[ri]; if(!r) continue;
    const nameVal = g(r,'name');
    if(!nameVal||String(nameVal).trim()==='') continue;
    // 名前列のセル背景色を行代表色として取得
    const cellBg = cellArgbToHex(ws, colMap.name??4, ri);
    result.push({
      inspDate:   toDate(g(r,'inspDate')),
      name:       String(nameVal).replace(/　/g,' ').trim(),
      no:         g(r,'no')??'',
      carModel:   String(g(r,'carModel')||'').trim(),
      phoneHome:  String(g(r,'phoneHome')||'').trim(),
      phoneMobile:String(g(r,'phoneMobile')||'').trim(),
      mailing1:   toDate(g(r,'mailing1')),
      reserve1:   toDate(g(r,'reserve1')),
      mailing2:   toDate(g(r,'mailing2')),
      reserve2:   toDate(g(r,'reserve2')),
      arrivalDate:toDate(g(r,'arrivalDate')),
      tokuten:    g(r,'tokuten')??'',
      course:     String(g(r,'course')||'').trim(),
      store:      normalizeStore(g(r,'store')),
      staff:      String(g(r,'staff')||'').trim(),
      note:       String(g(r,'note')||'').trim(),
      cellBg:     cellBg||null,
      _idx: ri,
    });
  }
  return result;
};

const CustLoanerDatePicker = ({isOpen, onClose, initFrom, initTo, selectedId, loanerRes, storeLoaners, onSelect}) => {
  const CARS = (storeLoaners&&storeLoaners.length)?storeLoaners:LOANERS;
  const DOW = ['日','月','火','水','木','金','土'];
  const [drag, setDrag] = useState(null);
  const [confirmed, setConfirmed] = useState(null);
  const isDragging = useRef(false);
  const gridRef = useRef(null);

  const dateRange = useMemo(()=>{
    const base = initFrom?(()=>{const[y,m,d]=initFrom.split('-').map(Number);return new Date(y,m-1,d);})():new Date();
    const start=new Date(base);start.setDate(start.getDate()-1);
    const end=new Date(base);end.setDate(end.getDate()+45);
    const range=[];const cur=new Date(start);
    while(cur<=end){range.push({year:cur.getFullYear(),month:cur.getMonth(),day:cur.getDate(),date:new Date(cur)});cur.setDate(cur.getDate()+1);}
    return range;
  },[initFrom]);

  useEffect(()=>{
    if(!isOpen){setDrag(null);setConfirmed(null);isDragging.current=false;return;}
    if(initFrom&&initTo&&selectedId){
      const[fy,fm,fd]=initFrom.split('-').map(Number);
      const[ty,tm,td]=initTo.split('-').map(Number);
      setConfirmed({carId:selectedId,start:{year:fy,month:fm-1,day:fd},end:{year:ty,month:tm-1,day:td}});
    }else{setConfirmed(null);}
    setDrag(null);isDragging.current=false;
  },[isOpen,initFrom,initTo,selectedId]);

  useEffect(()=>{
    if(!isOpen||!gridRef.current)return;
    setTimeout(()=>{
      if(!gridRef.current)return;
      const today=new Date();
      const idx=dateRange.findIndex(d=>d.year===today.getFullYear()&&d.month===today.getMonth()&&d.day===today.getDate());
      if(idx>=0)gridRef.current.scrollLeft=88+idx*26-gridRef.current.clientWidth/2+13;

  const getCellState=(cid,d)=>{
    const{year:y,month:m,day:dd}=d;

    if(confirmed&&confirmed.carId===cid){const cs=new Date(confirmed.start.year,confirmed.start.month,confirmed.start.day),ce=new Date(confirmed.end.year,confirmed.end.month,confirmed.end.day),c=new Date(y,m,dd);if(c>=cs&&c<=ce)return'sel';}
    return getRes(cid,y,m,dd)||null;
  };

  const handleMD=(cid,d)=>{if(getRes(cid,d.year,d.month,d.day))return;isDragging.current=true;setDrag({carId:cid,start:d,end:d});setConfirmed(null);};
  const handleME=(cid,d)=>{if(!isDragging.current||!drag||drag.carId!==cid)return;if(getRes(cid,d.year,d.month,d.day))return;const ds=new Date(drag.start.year,drag.start.month,drag.start.day),dc=new Date(d.year,d.month,d.day);if(dc>=ds)setDrag(p=>({...p,end:d}));};
  const handleMU=()=>{
    if(!isDragging.current||!drag)return;
    isDragging.current=false;
    const{carId,start,end}=drag;
    if(hasConflict(carId,start.year,start.month,start.day,end.year,end.month,end.day)){setDrag(null);alert('その期間に使用中の代車があります');return;}
    setConfirmed({carId,start,end});setDrag(null);

    const car=CARS.find(c=>String(c.id)===String(carId));if(!car)return;
    const pad=n=>String(n).padStart(2,'0');
    onSelect(car,`${start.year}-${pad(start.month+1)}-${pad(start.day)}`,`${end.year}-${pad(end.month+1)}-${pad(end.day)}`);

  const today=new Date();

              const f=`${confirmed.start.year}/${pad(confirmed.start.month+1)}/${pad(confirmed.start.day)}`;
              const t=`${confirmed.end.year}/${pad(confirmed.end.month+1)}/${pad(confirmed.end.day)}`;
              const days=Math.round((new Date(confirmed.end.year,confirmed.end.month,confirmed.end.day)-new Date(confirmed.start.year,confirmed.start.month,confirmed.start.day))/(1000*60*60*24))+1;

// CustListModal: 顧客リスト専用 仮予約/本予約モーダル（v85）

const _toCourseId = (t) => {
  const s = String(t||'').trim();
  if(s.includes('マッハ')||s==='1') return 1;
  if(s.includes('クイック')||s==='2') return 2;
  if(s.includes('レギュラー')||s==='3') return 3;
  return 0;
};
const resolveOrderSlot = (orderDate, mailing2) => {
  if(!orderDate) return null;
  if(mailing2 && orderDate >= mailing2) return 'reserve2';
  return 'reserve1';
};

                style={{flex:1,padding:'11px 0',background:'#f3f4f6',border:'none',borderRadius:9,
                  fontWeight:700,fontSize:13,cursor:'pointer',color:'#374151'}}>
                閉じる
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
});

const CustomerListView = memo(({custFiles, setCustFiles, currentUser}) => {
  const [selMonth, setSelMonth] = useState(null);
  const [filter, setFilter]     = useState('');
  const [storeFilter, setStoreFilter] = useState('all');
  const [importing, setImporting] = useState(false);
  const [importOk, setImportOk]   = useState(null);
  const [archivedFiles, setArchivedFiles] = useState(()=>{
    try{const v=localStorage.getItem('hub_cust_archived');return v?JSON.parse(v):{}}catch{return{};}
  });
  const [showArchive, setShowArchive] = useState(false);

  const saveAndSet = useCallback((updater)=>{
    setCustFiles(prev=>{
      const next=typeof updater==='function'?updater(prev):updater;
      try{localStorage.setItem('hub_cust_files',JSON.stringify(next));}catch{}
      return next;
    });
  },[setCustFiles]);

  const saveArchivedFiles = (data)=>{
    setArchivedFiles(data);
    try{localStorage.setItem('hub_cust_archived',JSON.stringify(data));}catch{}
  };

  const months = useMemo(()=>Object.keys(custFiles).sort(),[custFiles]);

  useEffect(()=>{
    if(months.length===0){setSelMonth(null);return;}
    if(!selMonth||!months.includes(selMonth)) setSelMonth(months[months.length-1]);
  },[months]);

  // 月自動検出
  const detectMonthFromRows = (rows) => {
    const counts={};
    ['inspDate','mailing1','mailing2','arrivalDate'].forEach(fld=>{
      rows.forEach(r=>{const m=(r[fld]||'').slice(0,7);if(m.match(/^\d{4}-\d{2}$/))counts[m]=(counts[m]||0)+1;});
    });
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    return sorted.length>0?sorted[0][0]:null;
  };

  // ファイル読み込み
  const processFiles = async(files)=>{
    if(!files||files.length===0)return;
    setImporting(true);
    for(const file of Array.from(files)){
      if(!file.name.match(/\.(xlsx|xls)$/i)){alert(`「${file.name}」は.xlsxまたは.xlsファイルではありません`);continue;}
      try{
        const buf=await file.arrayBuffer();
        const wb=XLSX.read(buf,{type:'array',cellDates:true});
        const rows=parseCustExcel(wb);
        let mk=detectMonthFromRows(rows);
        if(!mk){
          const nm=file.name.replace(/\.[^.]+$/,'');
          const m1=nm.match(/(\d{4})[_\-]?(\d{2})/);
          if(m1) mk=`${m1[1]}-${m1[2]}`;
        }
        if(!mk){
          const now=new Date();
          const def=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
          const input=prompt(`「${file.name}」の月を入力してください（例: 2026-06）`,def);
          if(!input||!input.match(/^\d{4}-\d{2}$/)){alert('スキップしました');continue;}
          mk=input;
        }
        saveAndSet(prev=>({...prev,[mk]:rows}));
        setImportOk(mk);
        setSelMonth(mk);
        setTimeout(()=>setImportOk(null),3000);
      }catch(e){alert(`「${file.name}」読み込みエラー: `+e.message);}
    }
    setImporting(false);
  };

  const handleDeleteMonth=(mk,e)=>{
    e&&e.stopPropagation();
    if(!confirm(mk+'のデータを削除しますか？'))return;
    saveAndSet(prev=>{const u={...prev};delete u[mk];return u;});
    if(selMonth===mk)setSelMonth(null);
  };

  const handleArchiveMonth=(mk,e)=>{
    e&&e.stopPropagation();
    if(!confirm(`「${mk}」をアーカイブしますか？`))return;
    saveAndSet(prev=>{
      const rows=prev[mk]||[];
      saveArchivedFiles({...archivedFiles,[mk]:{rows,archivedAt:new Date().toISOString()}});
      const u={...prev};delete u[mk];return u;
    });
    if(selMonth===mk)setSelMonth(null);
  };

  const selRows = useMemo(()=>(custFiles[selMonth]||[]).map((r,i)=>({...r,_month:selMonth,_idx:i})),[custFiles,selMonth]);

  const displayRows = useMemo(()=>selRows.filter(c=>{
    if(storeFilter!=='all'&&c.store!==storeFilter)return false;
    const q=filter.toLowerCase();
    if(q&&![c.name,c.carModel,String(c.no),c.staff,c.note,c.course,c.inspDate].some(v=>v&&String(v).toLowerCase().includes(q)))return false;
    return true;
  }),[selRows,filter,storeFilter]);

  const now=new Date();
  const oldThreshold=`${now.getFullYear()}-${String(now.getMonth()-2<1?now.getMonth()+10:now.getMonth()-2).padStart(2,'0')}`;
  const arcCount=Object.keys(archivedFiles).length;

  // 点検満了日から特典を判定（1ヶ月前・2ヶ月前）
  const getTokuten=(inspDate, mailing2)=>{
    if(!inspDate) return '';
    const insp=new Date(inspDate);
    const oneMonthBefore=new Date(insp); oneMonthBefore.setMonth(oneMonthBefore.getMonth()-1);
    const twoMonthBefore=new Date(insp); twoMonthBefore.setMonth(twoMonthBefore.getMonth()-2);
    const today=new Date();
    if(mailing2){
      const m2=new Date(mailing2);
      if(today>=m2) return '②';
    }
    if(today>=twoMonthBefore && today<oneMonthBefore) return '②';
    if(today>=oneMonthBefore) return '①';
    return '';
  };

  return(
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 120px)',minHeight:400}}>

      {/* ── ① ヘッダー ── */}
      <div style={{flexShrink:0,background:'white',borderRadius:13,padding:'10px 14px',marginBottom:8,boxShadow:'0 2px 10px rgba(0,0,0,.1)'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}}>
          <h3 style={{margin:0,fontSize:13,fontWeight:900,color:'#1e293b'}}>📋 顧客リスト</h3>
          <label style={{cursor:'pointer',display:'inline-flex',alignItems:'center',gap:5,
            padding:'6px 14px',background:importing?'#64748b':(importOk?'#16a34a':'#f59e0b'),
            color:'white',borderRadius:7,fontWeight:800,fontSize:12,boxShadow:'0 2px 6px rgba(0,0,0,.15)'}}>
            📂 {importing?'読込中...':(importOk?'読込完了':'Excelファイルを選択')}
            <input type="file" accept=".xlsx,.xls" multiple style={{display:'none'}}
              onChange={e=>{if(e.target.files.length)processFiles(e.target.files);e.target.value='';}}/>
          </label>
          <button onClick={()=>setShowArchive(v=>!v)}
            style={{width:28,height:28,borderRadius:'50%',background:showArchive?'#7c3aed':'#ede9fe',
              color:showArchive?'white':'#7c3aed',border:`2px solid ${showArchive?'#7c3aed':'#c4b5fd'}`,
              fontWeight:800,fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>
            📦
          </button>
        </div>

        {/* 月タブ */}
        <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'flex-start'}}>
          {months.length===0&&<span style={{color:'#9ca3af',fontSize:12,padding:'4px 0'}}>「📂 Excelファイルを選択」でExcelを読み込むと月タブが自動作成されます</span>}
          {months.map(m=>{
            const rows=custFiles[m]||[];
            const isOld=m<oldThreshold;
            const isSel=selMonth===m;
            return(
              <div key={m} onClick={()=>setSelMonth(m)}
                style={{cursor:'pointer',border:`2px solid ${isSel?'#2563eb':isOld?'#f59e0b':'#cbd5e1'}`,
                  borderRadius:9,padding:'6px 10px',background:isSel?'#eff6ff':isOld?'#fffbeb':'#f8fafc',minWidth:110,transition:'all .12s'}}>
                <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:3}}>
                  <span style={{fontWeight:900,fontSize:12,color:isSel?'#1d4ed8':'#1e293b'}}>{m}</span>
                  {isOld&&<span style={{fontSize:9,color:'#d97706',fontWeight:800}}>⚠古</span>}
                </div>
                <div style={{display:'flex',gap:2,flexWrap:'wrap',marginBottom:5}}>
                  <span style={{background:'#e2e8f0',color:'#475569',borderRadius:3,padding:'0 4px',fontSize:9,fontWeight:700}}>{rows.length}件</span>
                </div>
                <div onClick={e=>e.stopPropagation()} style={{display:'flex',gap:2,alignItems:'center'}}>
                  <label style={{cursor:'pointer',padding:'2px 6px',background:importOk===m?'#16a34a':importing?'#64748b':'#f59e0b',
                    color:'white',borderRadius:4,fontSize:9,fontWeight:800,display:'inline-flex',alignItems:'center',gap:2}}>
                    {importing?' ⏳':(importOk===m?' ✅':' 📂')} 更新
                    <input type="file" accept=".xlsx,.xls" style={{display:'none'}}
                      onChange={e=>{if(e.target.files[0])processFiles([e.target.files[0]]);e.target.value='';}}/>
                  </label>
                  <button onClick={(e)=>handleArchiveMonth(m,e)}
                    style={{width:20,height:20,borderRadius:'50%',padding:0,fontSize:10,color:'white',background:'#94a3b8',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>📦</button>
                  <button onClick={(e)=>handleDeleteMonth(m,e)}
                    style={{width:20,height:20,borderRadius:'50%',padding:0,fontSize:11,fontWeight:900,color:'white',background:'#ef4444',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
                </div>
              </div>
            );
          })}
        </div>

        {/* アーカイブ */}
        {showArchive&&(
          <div style={{marginTop:10,padding:10,background:'#f5f3ff',border:'2px solid #c4b5fd',borderRadius:9}}>
            <div style={{fontWeight:800,fontSize:12,color:'#5b21b6',marginBottom:7}}>📦 アーカイブ</div>
            {arcCount===0?<div style={{color:'#9ca3af',fontSize:11}}>なし</div>:(
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {Object.keys(archivedFiles).sort().map(m=>{
                  const arc=archivedFiles[m];
                  return(
                    <div key={m} style={{border:'2px solid #a78bfa',borderRadius:7,padding:'7px 10px',background:'white',minWidth:120}}>
                      <div style={{fontWeight:800,fontSize:11,color:'#5b21b6',marginBottom:4}}>🔒 {m} ({arc.rows?.length||0}件)</div>
                      <div style={{display:'flex',gap:3}}>
                        <button onClick={()=>{if(!confirm(`「${m}」を戻しますか？`))return;const rows=arc.rows||[];saveAndSet(prev=>({...prev,[m]:rows}));const na={...archivedFiles};delete na[m];saveArchivedFiles(na);}}
                          style={{flex:1,padding:'2px 0',fontSize:9,color:'white',background:'#2563eb',border:'none',borderRadius:3,cursor:'pointer',fontWeight:700}}>↩ 戻す</button>
                        <button onClick={()=>{if(!confirm('完全削除？'))return;const na={...archivedFiles};delete na[m];saveArchivedFiles(na);}}
                          style={{padding:'2px 6px',fontSize:9,color:'white',background:'#dc2626',border:'none',borderRadius:3,cursor:'pointer',fontWeight:700}}>削除</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── ② フィルターバー ── */}
      {selMonth&&(
        <div style={{flexShrink:0,background:'white',borderRadius:9,padding:'7px 12px',marginBottom:6,
          boxShadow:'0 1px 6px rgba(0,0,0,.07)',display:'flex',gap:7,alignItems:'center',flexWrap:'wrap'}}>
          <span style={{fontWeight:900,fontSize:13,color:'#1e293b'}}>{selMonth}</span>
          <span style={{background:'#e2e8f0',color:'#374151',borderRadius:4,padding:'2px 9px',fontSize:11,fontWeight:700}}>{selRows.length}件</span>
          <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
            <div style={{display:'flex',alignItems:'center',gap:4,border:'1px solid #e2e8f0',borderRadius:6,padding:'4px 9px',background:'#f8fafc'}}>
              <span style={{color:'#94a3b8',fontSize:12}}>🔍</span>
              <input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="名前・車種・担当"
                style={{border:'none',background:'transparent',fontSize:11,outline:'none',width:110}}/>
            </div>
            <select value={storeFilter} onChange={e=>setStoreFilter(e.target.value)}
              style={{padding:'5px 8px',border:'1px solid #e2e8f0',borderRadius:6,fontSize:11,background:'white'}}>
              <option value="all">全店舗</option><option value="本店">本店</option><option value="三田店">三田店</option>
            </select>
            {(filter||storeFilter!=='all')&&
              <span style={{fontWeight:800,fontSize:11,color:'#374151',background:'#f1f5f9',borderRadius:5,padding:'2px 8px'}}>{displayRows.length}件</span>}
          </div>
        </div>
      )}

      {/* ── ③ テーブル ── */}
      <div style={{flex:1,overflow:'auto',borderRadius:11,boxShadow:'0 2px 12px rgba(0,0,0,.09)',border:'1.5px solid #e2e8f0',background:'white'}}>
        {!selMonth?(
          <div style={{padding:'40px 24px',textAlign:'center',color:'#9ca3af',fontSize:13}}>上の月タブをクリックして顧客リストを表示してください</div>
        ):displayRows.length===0&&selRows.length===0?(
          <div style={{padding:'40px 24px',textAlign:'center',color:'#9ca3af',fontSize:13}}>「📂 Excelファイルを選択」でExcelファイルを読み込んでください</div>
        ):(
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:900}}>
            <thead>
              <tr>
                {[
                  {h:'点検満了日',bg:'#1e40af'},{h:'名称',bg:'#1e293b'},{h:'NO',bg:'#374151'},{h:'車種名',bg:'#374151'},
                  {h:'投函日①',bg:'#78350f'},{h:'予約①',bg:'#1e3a8a'},
                  {h:'投函日②',bg:'#78350f'},{h:'予約②',bg:'#1e3a8a'},
                  {h:'入庫日',bg:'#14532d'},{h:'特典',bg:'#374151'},
                  {h:'種類',bg:'#374151'},{h:'入庫店舗',bg:'#374151'},{h:'担当',bg:'#374151'},{h:'備考',bg:'#374151'},
                ].map(({h,bg},i)=>(
                  <th key={i} style={{padding:'8px 7px',fontWeight:800,fontSize:10,whiteSpace:'nowrap',color:'white',
                    background:bg,borderBottom:'2px solid #0f172a',borderRight:'1px solid rgba(255,255,255,.1)',
                    textAlign:'center',position:'sticky',top:0,zIndex:2}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {displayRows.length===0?(
                <tr><td colSpan={14} style={{padding:20,textAlign:'center',color:'#9ca3af'}}>該当なし</td></tr>
              ):displayRows.map((c,i)=>{
                const TD2={padding:'5px 7px',fontSize:11,borderBottom:'1px solid #f1f5f9',borderRight:'1px solid #f1f5f9',verticalAlign:'middle',whiteSpace:'nowrap'};
                const rowBg=c.cellBg?c.cellBg+'44':(i%2===0?'#ffffff':'#f8fafc');
                const dispStore=(c.store==='honten'?'本店':c.store==='sanda'?'三田店':c.store)||'';
                const tokuten=c.tokuten||getTokuten(c.inspDate, c.mailing2);
                return(
                  <tr key={`${c._month}-${c._idx}`} style={{background:rowBg,transition:'filter .1s'}}
                    onMouseEnter={e=>e.currentTarget.style.filter='brightness(0.95)'}
                    onMouseLeave={e=>e.currentTarget.style.filter=''}>
                    <td style={{...TD2,textAlign:'center',fontWeight:700,color:'#1e40af'}}><DateTip dateStr={c.inspDate}/></td>
                    <td style={{...TD2,fontWeight:800,color:'#111827',maxWidth:140}}>{c.name||'—'}</td>
                    <td style={{...TD2,textAlign:'center',color:'#6b7280',fontSize:10}}>{c.no||'—'}</td>
                    <td style={{...TD2,maxWidth:100}}>{c.carModel||'—'}</td>
                    <td style={{...TD2,background:'rgba(254,243,199,.55)',textAlign:'center',fontWeight:700,color:'#92400e'}}><DateTip dateStr={c.mailing1}/></td>
                    <td style={{...TD2,background:'rgba(219,234,254,.55)',textAlign:'center'}}>
                      {c.reserve1?<span style={{fontWeight:800,color:'#1e40af'}}><DateTip dateStr={c.reserve1}/></span>:<span style={{color:'#cbd5e1'}}>—</span>}
                    </td>
                    <td style={{...TD2,background:'rgba(254,243,199,.55)',textAlign:'center',fontWeight:700,color:'#92400e'}}><DateTip dateStr={c.mailing2}/></td>
                    <td style={{...TD2,background:'rgba(219,234,254,.55)',textAlign:'center'}}>
                      {c.reserve2?<span style={{fontWeight:800,color:'#1e40af'}}><DateTip dateStr={c.reserve2}/></span>:<span style={{color:'#cbd5e1'}}>—</span>}
                    </td>
                    <td style={{...TD2,textAlign:'center'}}>
                      {c.arrivalDate?<span style={{background:'#3b82f6',color:'white',padding:'2px 8px',borderRadius:5,fontWeight:800,fontSize:11}}><DateTip dateStr={c.arrivalDate} style={{color:'white'}}/></span>:<span style={{color:'#94a3b8',fontSize:10}}>未設定</span>}
                    </td>
                    <td style={{...TD2,textAlign:'center',fontWeight:700,color:'#374151'}}>{tokuten||'—'}</td>
                    <td style={{...TD2,textAlign:'center'}}>
                      {c.course?<span style={{background:'#f1f5f9',color:'#374151',borderRadius:4,padding:'2px 7px',fontSize:10,fontWeight:700}}>{c.course}</span>:<span style={{color:'#cbd5e1'}}>—</span>}
                    </td>
                    <td style={{...TD2,textAlign:'center'}}>
                      {dispStore?<span style={{background:dispStore==='本店'?'#2563eb':'#dc2626',color:'white',borderRadius:4,padding:'2px 7px',fontSize:10,fontWeight:700}}>{dispStore}</span>:<span style={{color:'#cbd5e1'}}>—</span>}
                    </td>
                    <td style={{...TD2,fontWeight:600,color:'#1e293b',maxWidth:70}}>{c.staff||'—'}</td>
                    <td style={{...TD2,color:'#374151',maxWidth:110,overflow:'hidden',textOverflow:'ellipsis'}} title={c.note||''}>{c.note||''}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
});


const blankInsp  = () => ({name:'',staff:'',carType:'',phone:'',address:'',course:0,loaner:'',loanerId:null,rentalLabel:'',rentalCarId:null,tokuten:'-',time:'',note:'',bookingStatus:'provisional',entryDate:'',deliveryDate:'',deliveryTime:''});

// ── 「この保存で日付が変わったか」の判定（必ずこれを使う）──────────────
//   モーダルは日付を触らないと _targetDk を【空文字】で返す。生の値のまま
//   `origDk !== formData._targetDk` と比べると、日付を変えていない編集でも
//   '2026-8-29' !== '' が成立して【日付変更】と誤判定する。
//   予約本体の保存はフォールバック付きの値で比べていたので正しく、
//   代車の削除だけが生の値で比べていたため、編集して保存するたびに
//   代車予約が消えていた（2026-09-03 ユーザー報告：8/29 車検 No.②③で再現）。
//   判定を1か所に集約し、二度と食い違わせない。targetDk が空なら「変更なし」。
const isDateChanged = (origDk, targetDk) => !!(origDk && targetDk && String(origDk) !== String(targetDk));

// ── 予約順(seq)ベースの承認状態 再計算（純粋関数）─────────────────────────
// 各insp行の seq（予約順。新規予約時に Date.now() で付与）で昇順に並べ、
//   先着 limit 台 = 確定 / 超過分 = 承認待ち(pendingApproval=true)。
//   レギュラー車検(course=3) は別途1日3台まで（超過分は承認待ち）。
// 承認は「予約に固定されず枠に紐づく」: 先着枠内に入った行は承認待ち・手動承認(approved)とも
//   外して通常確定にする（キャンセル等で6台以内に繰り上がれば承認バッジは消える）。
//   枠外でも本店が手動承認(approved)した行だけは確定維持（承認済みバッジ）。
// seq の無い旧データは配列インデックス順（＝従来の並び）にフォールバックするので、
// 既存予約の並び・確定状態は変わらない。表示順(店舗優先・入庫時間)とは独立。
const recomputeInspApproval = (rows, limit) => {
  const lim = (limit!=null) ? limit : 6;
  const out = rows.map(r => (r ? {...r} : r));
  const active = out
    .map((r, i) => ({ r, i }))
    .filter(x => x.r && x.r.name && x.r.course && x.r.bookingStatus !== 'cancelled');
  active.sort((a, b) => {
    const sa = (a.r.seq != null) ? a.r.seq : a.i;
    const sb = (b.r.seq != null) ? b.r.seq : b.i;
    return sa - sb;
  });
  let conf = 0, reg = 0;
  for (const { r } of active) {
    const isReg = Number(r.course) === 3;
    // seq順で先着枠（通常lim台・レギュラー3台）に入れるかを純粋に位置で判定
    const eligible = (conf < lim) && (!isReg || reg < 3);
    if (eligible) {
      delete r.pendingApproval;       // 先着枠内 → 確定
      delete r.approved;              // 枠内に繰り上がった → 手動承認も解除（承認バッジを消す）
      conf++; if (isReg) reg++;
    } else if (r.approved) {
      delete r.pendingApproval;       // 枠外だが手動承認済み → 確定維持（枠を消費）
      conf++; if (isReg) reg++;
    } else {
      r.pendingApproval = true;       // 枠外・未承認 → 承認待ち
    }
  }
  return out;
};
// confirmed=車検日確定(スカイブルー)  provisional/new=仮予約(ライトグリーン)  cancelled=キャンセル(レッド)

const blankSched = () => ({name:'',staff:'',carType:'',phone:'',work:'',loaner:'',loanerId:null,rentalLabel:'',rentalCarId:null,shimi:'',content:'',entryDate:'',deliveryDate:'',deliveryTime:''});
const blankMemo  = () => ({content:''});
const dateKey    = (y,m,d) => `${y}-${m+1}-${d}`;
const toNum      = (y,m,d) => y*10000+(m+1)*100+d;

// ── 予定の入出庫期間を求める（代車期間チェック用・純関数）─────────────────
//   inspDk       … 車検日（スケジュール上の行が乗っている日）"YYYY-M-D"
//   entryDate    … 期日前入庫日。未設定なら車検日から
//   deliveryDate … 納車日。未設定ならコース既定（レギュラー車検=車検日の翌日／他=当日）
//   ★レギュラー車検(course=3)は1泊2日が既定。翌日の起点は「入庫日」ではなく必ず「車検日」。
//     事前入庫を設定した時に入庫日基準で翌日を出すと、実際の納車日より1日早くなり、
//     正しく取った3日間の代車が「期間が一致しません」と警告されていた（2026-08-25 報告）。
//   ★事前入庫・納車日を設定した分はそのまま期間に反映される＝設定と代車日数が合っていれば警告は出ない。
const _normDkStr = s=>{const p=String(s||'').split('-');return (p.length===3&&p.every(v=>v!==''&&!isNaN(v)))?`${+p[0]}-${+p[1]}-${+p[2]}`:'';};
const _dkToNum   = s=>{const t=_normDkStr(s);if(!t)return null;const p=t.split('-').map(Number);return toNum(p[0],p[1]-1,p[2]);};
const _numAddDay = (n,add)=>{
  if(n==null)return null;
  const y=Math.floor(n/10000), m=Math.floor(n/100)%100, d=n%100;
  const dt=new Date(y,m-1,d+add);
  return toNum(dt.getFullYear(),dt.getMonth(),dt.getDate());
};
const REGULAR_COURSE_ID = 3;      // レギュラー車検＝1泊2日
const schedSpan = ({inspDk, entryDate, deliveryDate, course})=>{
  const inspNum = _dkToNum(inspDk);
  const from = _dkToNum(entryDate) ?? inspNum;
  const defaultTo = String(course)===String(REGULAR_COURSE_ID) ? _numAddDay(inspNum,1) : inspNum;
  const to = _dkToNum(deliveryDate) ?? defaultTo;
  return {from,to};
};
// 期間の日数（両端含む）
const spanDays = (from,to)=>{
  if(from==null||to==null)return null;
  const d=n=>new Date(Math.floor(n/10000),Math.floor(n/100)%100-1,n%100);
  return Math.max(1,Math.round((d(to)-d(from))/864e5)+1);
};

// loanerResからbookingKeyで代車を動的に取得
// bookingKey = "insp-dk-idx" または "sched-dk-slot"
// 名前一致ではなくキー一致で確実に紐付け
// ★rowName を渡すと「氏名も一致すること」を条件に加える。
//   bookingKey は "insp-日付-行番号" ＝ 行の位置で作られるため、他端末との衝突で
//   行がずれると、代車だけが別の行（多くは空き行）に付いて見える。実例として
//   2026-08-28に「9/1 岩田の下にN-BOX(9012)だけの行が出る」報告があった。
//   （岩田の代車は insp-2026-9-1-0 を指していたが、岩田本人は行2に配置されていた）
const getLoanerByKey = (loanerRes, bookingKey, rowName) => {
  if(!bookingKey) return null;
  for(const cid of Object.keys(loanerRes)){
    for(const r of Object.values(loanerRes[cid]||{})){
      if(r.bookingKey===bookingKey&&(!rowName||!r.user||r.user===rowName)){
        if(r.carName) return {label:`${r.carName}${r.carNum?` (${r.carNum})`:''}`,id:cid};
        const car=LOANERS.find(c=>c.id===Number(cid));
        return car?{label:`${car.name} (${car.num})`,id:Number(cid)}:null;
      }
    }
  }
  return null;
};
// 旧データ互換：bookingKeyなし(旧版保存データ)は名前マッチにフォールバック
// ★その予約の代車が「限定（＝最適化で動かさない）」かどうか。表示用。
//   探し方は getLoanerLabel と同じ（bookingKey優先 → 名前＋日付のフォールバック）。
const getLoanerLocked = (loanerRes, dk, rowName, bookingKey) => {
  if(!dk||!loanerRes)return false;
  if(!rowName)return false; // 氏名の無い行は代車を持てない
  if(bookingKey){
    for(const cid of Object.keys(loanerRes)){
      for(const r of Object.values(loanerRes[cid]||{})){
        if(r&&r.bookingKey===bookingKey&&(!r.user||r.user===rowName))return !!r.locked;
      }
    }
  }
  const parts=dk.split('-').map(Number);
  const dateNum=toNum(parts[0],parts[1]-1,parts[2]);
  for(const cid of Object.keys(loanerRes)){
    for(const r of Object.values(loanerRes[cid]||{})){
      if(r&&dateNum>=toNum(r.fy,r.fm,r.fd)&&dateNum<=toNum(r.ty,r.tm,r.td)&&r.user===rowName)return !!r.locked;
    }
  }
  return false;
};
const getLoanerLabel = (loanerRes, dk, rowName, bookingKey) => {
  if(!dk)return'';
  // ★氏名の無い行（空き枠）は代車を持てない。ここを通していたため、行がずれた時に
  //   空き行へ代車だけが表示されていた（2026-08-28にユーザーが報告）。
  if(!rowName)return'';
  // まずbookingKeyで検索（氏名も一致すること）
  if(bookingKey){
    const found=getLoanerByKey(loanerRes,bookingKey,rowName);
    if(found)return found.label;
  }
  // フォールバック：名前一致（旧データ互換）
  const parts=dk.split('-').map(Number);
  const [y,m,d]=[parts[0],parts[1]-1,parts[2]];
  const dateNum=toNum(y,m,d);
  for(const cid of Object.keys(loanerRes)){
    for(const r of Object.values(loanerRes[cid]||{})){
      if(dateNum>=toNum(r.fy,r.fm,r.fd)&&dateNum<=toNum(r.ty,r.tm,r.td)&&r.user===rowName){
        if(r.carName) return `${r.carName}${r.carNum?` (${r.carNum})`:''}`;
        const car=LOANERS.find(c=>c.id===Number(cid));
        return car?`${car.name} (${car.num})`:'';
      }
    }
  }
  return'';
};
const getLoanerIdForRow = (loanerRes, dk, rowName, bookingKey) => {
  if(!dk)return null;
  if(!rowName)return null; // 氏名の無い行は代車を持てない
  if(bookingKey){
    const found=getLoanerByKey(loanerRes,bookingKey,rowName);
    if(found)return found.id;
  }

const formatTime = (raw) => {
  const d=raw.replace(/\D/g,'');
  if(!d) return raw;
  if(d.length===3) return `${d[0]}:${d.slice(1)}`;
  if(d.length===4) return `${d.slice(0,2)}:${d.slice(2)}`;
  return raw;
};

const STOR = 'hub-v8-dev-';
const storKey = (base, storeId) => `${STOR}${storeId}-${base}`;

// ── 未反映の予約控え（端末が落ちても未反映を見失わない。customers.html の list-pending と同じ仕組みの insp 版）──
//   保存を始める前に控えを積み、insp への反映が確認できたら消す。残っていれば起動時に棚卸しする。
//   ※スケジュール側専用キー。顧客リストの STOR+'list-pending' とは別（衝突しない）。localStorageのみでGAS通信ではない。
const INSP_PEND_KEY = STOR+'insp-pending';
const inspPendLoad = ()=>{try{const v=JSON.parse(localStorage.getItem(INSP_PEND_KEY)||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}};
const inspPendSave = list=>{try{localStorage.setItem(INSP_PEND_KEY,JSON.stringify(list.slice(-30)));}catch(e){}};
const inspPendAdd  = p=>{const l=inspPendLoad();l.push(p);inspPendSave(l);};
const inspPendDrop = pid=>inspPendSave(inspPendLoad().filter(p=>p.pid!==pid));

// ── 保存する予約1件を「渡されたベース」に適用して insp 全体を組み立てる純関数（第2層）──
//   （blankInsp / recomputeInspApproval は後方で定義されるが、本関数は実行時にのみ呼ぶので順序問題なし。）
//   ★base にサーバー最新値を渡すのが基本。ローカルstateを丸ごと書き戻すと、直近のポーリング
//     以降に他端末が入れた予約（別の日付・同じ日の別の行）を巻き添えで消すため。
//   p = {targetDk, origDk, isDateChange, dcPlaceIdx, modalIdx, row, limits, wasEditing, seq}
//   戻り値 = {result, idxPlace, relocated, pendingNow}
//     relocated … 配置先が他端末の予約で埋まっていたので空き行へ逃がした（bookingKeyも振り直し済み）
//     pendingNow … 今回の保存で「承認待ち」に転じた（呼び出し側で1回だけ通知する）
const buildInspSave = (base, p)=>{
  const data=(base&&typeof base==='object'&&!Array.isArray(base))?{...base}:{};
  const prevRows=(data[p.targetDk]||[]).map(r=>r||blankInsp());
  let rows=[...prevRows];
  const occupied=r=>!!(r&&r.name&&r.bookingStatus!=='cancelled');
  // ★この保存自身が書いた行かどうかの判定（Kyoshi承認のBLOCK-B変更・2026-08-31）。
  //   seq は保存1回につき1つのスナップショット(_saveParams.seq)で、writeVerified が再送しても
  //   同じ値のままなので、自分が1回目に書いた行を確実に見分けられる。
  //   氏名+No では別人と衝突しうるため使わない（上書き消失を防ぐ従来の保証を弱めないため）。
  const isSelfSeq=r=>!!(r&&p.seq!=null&&r.seq!=null&&r.seq===p.seq);
  let idxPlace=p.isDateChange?p.dcPlaceIdx:p.modalIdx;
  let relocated=false;
  // 新規予約または日付変更で配置先が埋まっているとき＝他端末が先にその行を使った（or 移動先が衝突）。
  // 上書き消失だけは絶対に起こさないので空き行へ逃がす。既存予約の編集(wasEditing)はその行が
  // 自分の予約なのでそのまま上書きする（従来どおりの挙動）。
  // ★ただし配置先に居るのが「自分が1回目に書いた行」なら逃がさない。writeVerified は着地を
  //   確認できないと再送するが、GASの読み取りキャッシュ(60秒)で古い値が返ると未反映と誤判定する。
  //   その2回目ではサーバー最新値に自分の行が入っており、これを他端末の予約と誤認して空き行へ
  //   逃がすため、同じ予約が2行に増えていた
  //   （2026-08-31 ユーザー報告：9/1で3行目に保存すると4行目にも同じ人が一瞬出る）。
  if((!p.wasEditing||p.isDateChange)&&occupied(rows[idxPlace])&&!isSelfSeq(rows[idxPlace])){
    const fb=rows.findIndex(r=>!occupied(r));
    idxPlace=fb>=0?fb:rows.length;
    relocated=true;
  }
  while(rows.length<=idxPlace)rows.push(blankInsp());
  const prevRow=prevRows[idxPlace];
  // 同一のアクティブ予約を編集している時だけ既存のseq・状態を引き継ぐ。
  // 空き／キャンセル済みスロットへの新規予約は必ず新しいseqを付与（予約順の最後に並ぶ）。
  const editingActive=!!(p.wasEditing&&!relocated&&occupied(prevRow));
  const wasPending=editingActive&&!!prevRow.pendingApproval;
  const dayLimit=p.limits[p.targetDk]??6;
  const newRow={...p.row,seq:(editingActive&&prevRow.seq)?prevRow.seq:(p.seq||Date.now()),bookingStatus:'confirmed'};
  if(p.isDateChange||relocated){
    // 日付変更／行移動＝移動先で承認状態を再評価する。元の承認/承認待ちフラグは引き継がない。
    delete newRow.approved;
    delete newRow.pendingApproval;
    if(p.isDateChange)newRow.seq=p.seq||Date.now();
    // 行が新しい位置に移るため、代車紐付け用bookingKeyも新位置で振り直す
    newRow.bookingKey=`insp-${p.targetDk}-${idxPlace}`;
  }
  rows[idxPlace]=newRow;
  // ★同じ保存(seq)の行が他の位置にも残っていたら空きに戻す＝再送で増えた重複の自己修復
  //   （Kyoshi承認のBLOCK-B変更・2026-08-31）。既に重複しているデータも、その予約を保存し直せば直る。
  //   位置は splice で詰めず blankInsp にする（後続行の bookingKey＝代車紐付けを壊さない）。
  //   同じお客様が同じ日に2台入れる場合は保存操作が別＝seq が違うので巻き添えにしない。
  if(newRow.seq!=null){
    for(let i=0;i<rows.length;i++){
      if(i===idxPlace)continue;
      if(occupied(rows[i])&&rows[i].seq===newRow.seq)rows[i]=blankInsp();
    }
  }
  // 予約順(seq)で承認状態を再計算（既存の確定行は確定のまま＝編集で承認を再要求しない）
  rows=recomputeInspApproval(rows,dayLimit);
  const result={...data,[p.targetDk]:rows};
  if(p.origDk&&p.origDk!==p.targetDk&&data[p.origDk]){
    let oldRows=[...(data[p.origDk]||[])];
    if(oldRows[p.modalIdx])oldRows[p.modalIdx]=blankInsp();
    // 日付変更で空いた旧日の枠も再計算（空いた分だけ承認待ちを昇格）
    oldRows=recomputeInspApproval(oldRows,p.limits[p.origDk]??6);
    result[p.origDk]=oldRows;
  }
  return {result, idxPlace, relocated, pendingNow:!!(rows[idxPlace]&&rows[idxPlace].pendingApproval&&!wasPending)};
};

// ── 予約1件を特定する述語（削除・状態変更の対象判定）。位置(idx)ではなく本人性で照合する ──
//   custId → seq（行ごとに一意）→ 氏名+no の順（handleDeleteModal の _delVerify と同じ規約）。
//   これにより、サーバー最新値で行の並びがズレていても取り違えない。
const _inspMatcher = target => {
  const cust=target.custId, seq=(target.seq!=null)?target.seq:null, name=target.name, no=target.no;
  return r=>{
    if(!r||r.bookingStatus==='cancelled')return false;
    if(cust)return r.custId===cust;
    if(seq!=null)return r.seq===seq;
    return r.name===name && String(r.no||'')===String(no||'');
  };
};
// insp から予約1件を「サーバー最新値ベースでも安全に」取り除く純関数。
//   氏名しか手掛かりが無い時は idx の行を優先、無ければ最初の一致1件だけ消す（同名の巻き添え防止）。
//   位置は splice で詰めず blankInsp で空きに戻す＝後続行の bookingKey（代車紐付け insp-dk-idx）を壊さない。
const removeInspBooking = (base, dk, target)=>{
  const data=(base&&typeof base==='object'&&!Array.isArray(base))?{...base}:{};
  let rows=(data[dk]||[]).map(r=>r||blankInsp());
  const isT=_inspMatcher(target);
  const nameOnly=!target.custId && target.seq==null;
  if(nameOnly){
    const j=(target.idx!=null&&rows[target.idx]&&isT(rows[target.idx]))?target.idx:rows.findIndex(isT);
    if(j>=0)rows[j]=blankInsp();
  }else{
    rows=rows.map(r=>isT(r)?blankInsp():r);
  }
  while(rows.length>0 && !(rows[rows.length-1]&&rows[rows.length-1].name))rows.pop();
  data[dk]=recomputeInspApproval(rows,(target.limit!=null)?target.limit:6);
  return data;
};
// 予約が「まだ居るか」（削除の着地確認用）。氏名照合時は others（削除対象を除く同名件数）と比較。
const inspBookingPresent = (base, dk, target)=>{
  const rows=(base&&base[dk])||[];
  const hits=rows.filter(_inspMatcher(target)).length;
  if(!target.custId && target.seq==null) return hits>(target.others||0);
  return hits>0;
};
// insp の予約1件のフィールドを差し替える純関数（状態変更・承認など）。対象は本人性で特定し、
//   patch を当てて承認状態を再計算する。base のほかの日付・ほかの行には触らない。
const patchInspBooking = (base, dk, target, patch)=>{
  const data=(base&&typeof base==='object'&&!Array.isArray(base))?{...base}:{};
  let rows=(data[dk]||[]).map(r=>r||blankInsp());
  const isT=_inspMatcher(target);
  let j=(target.idx!=null&&rows[target.idx]&&isT(rows[target.idx]))?target.idx:rows.findIndex(isT);
  if(j>=0)rows[j]={...rows[j],...patch};
  data[dk]=recomputeInspApproval(rows,(target.limit!=null)?target.limit:6);
  return data;
};

// ── 代車(lres)/レンタカー(rres)予約をサーバー最新値ベースで変更する純関数群 ──

// ── 重要キーを「サーバー最新値ベース」で確実に書く（customers.html の同名関数と同じ仕組み）──
//   mutate(サーバー最新値)→保存する値 を返す。書く→少し待つ→読み返して check(読み返し値)=true なら成功。
//   未反映なら最新値を読み直して mutate からやり直す（最大 tries 回）。sSet は no-cors で
//   lock_timeout 等を検知できないため、この読み返しループが唯一の成否判定手段。
//   ※sGet/sSet を呼ぶだけで BLOCK-B（データ層）自体は改変しない。
const writeVerified=async(key,mutate,check,tries=3,opts)=>{
  const _o=opts||{};
  if(FB_ON){
    // ★Firestore：トランザクション1回で「サーバー最新値を読む→変更→書く」が済む（他端末と衝突すれば自動やり直し）。
    //   書けたら Firestore がその内容を保持した証拠なので読み返し検算は不要（GAS の 'ok' と違い、内容ごと確定する）。
    //   失敗（回線断など）は GAS 版と同じく少し待って tries 回まで試す。
    for(let i=0;i<tries;i++){
      const r=await fbTxn(key,mutate,{requireBase:_o.requireBase});
      if(r==='ok'||r==='nochange')return true;
      if(i<tries-1)await new Promise(r=>setTimeout(r,1500+1500*i));
    }
    console.error('[WRITE] Firestoreに反映できませんでした:',key);
    return false;
  }
  for(let i=0;i<tries;i++){
    let base=null;
    try{base=await sGet(key);}catch(e){}
    // ★サーバー値を読めなかった時（GASの一時的な失敗・混雑。sGetはエラーもnullで返す）に
    //   「空っぽ」とみなして書くと、その1回で全予約を消してしまう。requireBase 指定時は
    //   書かずに次の試行へ回し、3回とも読めなければ失敗として呼び出し側に返す。
    //   （2026-07-30 DEV実機の検証中に実際に読み取り失敗を踏んで判明）
    if(_o.requireBase&&!(base&&typeof base==='object')){
      console.warn('[WRITE] サーバー値を読めないため書き込みを見送り',key,'attempt',i+1);
      await new Promise(r=>setTimeout(r,1500+1500*i));
      continue;
    }
    let val;
    try{val=mutate(base);}catch(e){return false;}
    if(val===undefined)return true; // 変更不要
    // ★GASが 'ok' を返したら、シートに書き終えた確証なので読み返さない。
    //   読み返しはGASの読み取りキャッシュに引っかかって「まだ入っていない古い値」を返すことがあり、
    //   それを未反映と誤判定して同じ内容を何度も書き直していた（2026-08-26に実測。代車を1件
    //   付けただけで3回書いていた）。無駄な書き込みが減り、画面の揺れも止まる。
    //   応答が読めない環境('unknown')だけ従来どおり読み返して確認する。
    const _res=await sSet(key,val);
    // ★alwaysVerify を指定したキー（車検予約）は 'ok' でも必ず読み返して中身を確かめる。
    //   'ok' は「送った内容をGASが書き終えた」証拠にすぎず、「送った内容が正しい」保証ではない。
    //   日付変更のように行を別の日へ動かす保存は組み立てを誤っても ok が返るので、
    //   検算を省くと間違ったまま成功として扱ってしまう（2026-08-27の日付変更の件で判明）。
    //   予約そのものは取り返しがつかないため、1回の読み取り（約1秒）を惜しまない。
    if(_res==='ok'&&!_o.alwaysVerify)return true;
    await new Promise(r=>setTimeout(r,1500+1500*i));
    try{ const back=await sGet(key); if(check(back))return true; }catch(e){}
    console.warn('[WRITE] 未反映→再送',key,'attempt',i+1);
  }
  console.error('[WRITE] GASに反映できませんでした:',key);
  return false;
};

    if (BACKEND !== 'firebase' || typeof firebase === 'undefined' || !firebase.firestore || typeof HUB_FIREBASE_CONFIG === 'undefined') return false;

const FB_TIMEOUT_MS = 25000;   // 回線が切れている時に無限に待たない（Firestore は繋がり次第あとで書くが、画面は「失敗」として扱う）
// ドキュメントID。'/' は使えない。STOR で始まらないキー（'schedRestrictions' や 'hub-v8-gasping'）は STOR を前置して
//   この環境のものとして扱う（DEV と本番で同じ行を共有していた古い作りを、ここで環境ごとに分ける）。
const fbDocId = k => { k = String(k); if (k.indexOf(STOR) !== 0) k = STOR + k; return k.replace(/\//g, '%2F'); };   // ドキュメントIDに '/' は使えない
const fbDoc = k => fbDb.collection('kv').doc(fbDocId(k));
const fbParse = snap => {
  if (!snap || !snap.exists) return null;

  if (typeof d.v !== 'string' || d.v === '' || d.v === 'null') return null;
  try { const p = JSON.parse(d.v); return (p && typeof p === 'object' && p.error) ? null : p; } catch (e) { return null; }
};
const fbWithTimeout = (p, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout: ' + label)), FB_TIMEOUT_MS))]);

  catch (e) { console.error('[FB] 書けません', k, e && e.message); markGasDown(); return false; }
};
// サーバー最新値 base を mutate に渡し、その結果を書く。読んでから書くまでに他の端末が同じキーを変えていれば
// Firestore が自動でやり直す（mutate は何度呼ばれてもよい純関数であること＝writeVerified と同じ約束）。
//   戻り値: 'ok'（書いた）/ 'nochange'（mutate が undefined＝変更不要）/ false（失敗）
const fbTxn = async (k, mutate, opts) => {
  const _o = opts || {};
  let mutateErr = null;
  if (fbAuth && !fbUser) { console.warn('[FB] 未サインインのため書けません', k); return false; }
  try {
    const r = await fbWithTimeout(fbDb.runTransaction(async t => {
      const s = await t.get(fbDoc(k));

      if (_o.requireBase && s && s.exists && !(base && typeof base === 'object')) throw Object.assign(new Error('base broken'), { hubAbort: true });
      let val;
      try { val = mutate(base); } catch (e) { mutateErr = e; throw Object.assign(new Error('mutate failed'), { hubAbort: true }); }
      if (val === undefined) return 'nochange';
      t.set(fbDoc(k), { v: JSON.stringify(val), u: firebase.firestore.FieldValue.serverTimestamp() });
      return 'ok';
    }), 'txn ' + k);
    markGasUp();
    return r;
  } catch (e) {
    if (!(e && e.hubAbort)) markGasDown();

    return false;

};

    const keys = Object.keys(data);
    const summary = snapSummaryOf(data);
    let b = fbDb.batch(), n = 0;
    for (const k of keys) { b.set(fbSnapDoc(id).collection('kv').doc(k), { v: data[k] }); if (++n % 400 === 0) { await b.commit(); b = fbDb.batch(); } }
    b.set(fbSnapDoc(id), { prefix: STOR, ts: now.getTime(), tsText: now.toLocaleString('ja-JP'), kind, label: label || '', summary, n: keys.length, ready: true, by: fbUser.email || '' });
    await b.commit();
    await fbDb.runTransaction(async t => {
      const s = await t.get(fbSnapIdx());
      const list = (s.exists && Array.isArray((s.data() || {}).list)) ? s.data().list : [];
      t.set(fbSnapIdx(), { list: list.map(e => e.file === id ? Object.assign({}, e, { summary, ready: true }) : e) });
    });
    for (const en of drop) fbSnapDelete(en.file);   // 古い分は裏で消す
    return id;
  } catch (e) { console.error('[SNAP] 時点保存に失敗', e && e.message); return ''; }
};
const fbSnapList = async () => {
  if (!FB_ON) return [];
  try { await fbWhenReady(); if (!fbUser) return []; const s = await fbSnapIdx().get(); const list = (s.exists && Array.isArray((s.data() || {}).list)) ? s.data().list : []; return list.filter(e => e.ready !== false).sort((a, b) => b.ts - a.ts); }
  catch (e) { console.warn('[SNAP] 一覧を読めません', e && e.message); return []; }
};
const fbSnapRead = async id => {
  if (!FB_ON) return null;
  try {
    const s = await fbSnapDoc(id).get(); if (!s.exists) return null;
    const q = await fbSnapDoc(id).collection('kv').get();
    const keys = {}; q.forEach(d => { keys[d.id] = (d.data() || {}).v; });
    return Object.assign({}, s.data(), { keys });
  } catch (e) { console.warn('[SNAP] 中身を読めません', e && e.message); return null; }
};
// 復旧：全キーを時点保存の値に戻す。直前に pre-restore を取る（やり直し用）
const fbSnapRestore = async id => {
  if (!FB_ON || !fbUser) return 'error: offline';
  const p = await fbSnapRead(id); if (!p || !p.keys) return 'error: snapshot not found';
  if (p.prefix !== STOR) return 'error: prefix mismatch';
  await fbSnapCreate('pre-restore', '復旧直前の自動保存');
  const keys = Object.keys(p.keys);
  let b = fbDb.batch(), n = 0;
  for (const k of keys) { b.set(fbKvRef(k), { v: String(p.keys[k] == null ? '' : p.keys[k]), u: firebase.firestore.FieldValue.serverTimestamp() }); if (++n % 400 === 0) { await b.commit(); b = fbDb.batch(); } }
  await b.commit();
  return 'ok: restored ' + keys.length + ' keys';
};
// 部分復旧：指定日の insp に「消えていた予約(rows)」だけを足す（同じ氏名＋時間＋車種があれば足さない）
const fbSnapAddBack = async (date, rows) => {
  if (!FB_ON || !fbUser || !date || !rows || !rows.length) return 'error: no rows';
  const sig = r => [String((r && r.name) || ''), String((r && r.time) || ''), String((r && r.carType) || '')].join('|');
  let added = 0;
  const r = await fbTxn(STOR + 'insp', base => {
    const insp = (base && typeof base === 'object' && !Array.isArray(base)) ? base : {};
    const day = Array.isArray(insp[date]) ? insp[date] : (insp[date] = []);
    const have = {}; for (const x of day) if (x && x.name && x.bookingStatus !== 'cancelled') have[sig(x)] = true;
    added = 0;
    for (const x of rows) { if (!x || !x.name || have[sig(x)]) continue; day.push(x); have[sig(x)] = true; added++; }
    return added ? insp : undefined;
  });
  return r ? 'ok: added ' + added : 'error: write failed';
};
// 店別復旧：その店の整備(sched)・メモ(memo)・整備に紐づく代車(sched-)だけ戻す。車検・車検代車・他店・共有キーには触らない
const fbSnapRestoreStore = async (id, store) => {
  if (store !== 'honten' && store !== 'sanda') return 'error: bad store';
  if (!FB_ON || !fbUser) return 'error: offline';
  const p = await fbSnapRead(id); if (!p || !p.keys) return 'error: snapshot not found';
  if (p.prefix !== STOR) return 'error: prefix mismatch';
  await fbSnapCreate('pre-restore', '店別復旧(' + store + ')直前の自動保存');
  const restored = [];
  for (const suf of ['-sched', '-memo']) {
    const k = STOR + store + suf;
    if (!(k in p.keys)) continue;
    await fbKvRef(k).set({ v: String(p.keys[k] == null ? '' : p.keys[k]), u: firebase.firestore.FieldValue.serverTimestamp() });
    restored.push(store + suf);
  }
  const lresKey = STOR + store + '-lres';
  if (lresKey in p.keys) {
    let snapLres = {}; try { snapLres = JSON.parse(p.keys[lresKey] || '{}') || {}; } catch (e) {}
    const bkStarts = (res, mapKey, pre) => String((res && res.bookingKey) || mapKey || '').indexOf(pre) === 0;
    await fbTxn(lresKey, base => {
      const cur = (base && typeof base === 'object' && !Array.isArray(base)) ? base : {};
      const ids = Object.assign({}, cur, snapLres), merged = {};
      for (const car in ids) {
        const out = {};
        for (const bk in (cur[car] || {})) if (bkStarts(cur[car][bk], bk, 'insp-')) out[bk] = cur[car][bk];      // 車検代車＝現状維持
        for (const bk in (snapLres[car] || {})) if (bkStarts(snapLres[car][bk], bk, 'sched-')) out[bk] = snapLres[car][bk];   // 整備代車＝時点保存へ
        if (Object.keys(out).length) merged[car] = out;
      }
      return merged;
    });
    restored.push(store + '-lres(整備分のみ)');
  }
  return 'ok: ' + store + ' restored [' + restored.join(', ') + ']';
};

// ── 予定作業（旧 GAS のトリガーの代わり。開いている PC 画面が行う・2026-09-19）──
//   ・daily：その日の最初（誰かが開いた時）に1回。90日保持
//   ・auto：1時間に1回（誰かの画面が開いていれば）。48時間保持
//   ・保管箱への仕分け：14日より前の日付を insp → insp-arch へ（daily の後に1回）
//   複数の画面が同時に動いても、一覧のトランザクション（claim）で1つだけが作る。
const ARCHIVE_BUFFER_DAYS = 14;
const fbArchiveOldInsp = async () => {
  if (!FB_ON || !fbUser) return;
  const parseDk = k => { const p = String(k).split('-'); if (p.length !== 3) return null; const y = +p[0], m = +p[1], d = +p[2]; return (y && m && d) ? new Date(y, m - 1, d) : null; };
  const cutoff = new Date(); cutoff.setHours(0, 0, 0, 0); cutoff.setDate(cutoff.getDate() - ARCHIVE_BUFFER_DAYS);
  try {
    await fbDb.runTransaction(async t => {
      const hs = await t.get(fbKvRef(STOR + 'insp')), as = await t.get(fbKvRef(STOR + 'insp-arch'));
      const hot = fbParse(hs) || {}, arch = fbParse(as) || {};
      if (!hot || typeof hot !== 'object' || Array.isArray(hot)) return;
      let cnt = 0;
      for (const k of Object.keys(hot)) { const dt = parseDk(k); if (dt && dt.getTime() < cutoff.getTime()) { arch[k] = hot[k]; delete hot[k]; cnt++; } }
      if (!cnt) return;
      t.set(fbKvRef(STOR + 'insp-arch'), { v: JSON.stringify(arch), u: firebase.firestore.FieldValue.serverTimestamp() });
      t.set(fbKvRef(STOR + 'insp'), { v: JSON.stringify(hot), u: firebase.firestore.FieldValue.serverTimestamp() });
      console.log('[SNAP] 保管箱へ仕分け', cnt, '日分');
    });
  } catch (e) { console.warn('[SNAP] 仕分けに失敗', e && e.message); }
};
let __snapTimer = null;
const fbSnapTick = async () => {
  if (!FB_ON || !fbUser || document.visibilityState === 'hidden') return;
  try {
    const d = await fbSnapCreate('daily', '', { sameDay: true });
    if (d) await fbArchiveOldInsp();
    await fbSnapCreate('auto', '', { withinMs: SNAP_AUTO_EVERY_MIN * 60000 });
  } catch (e) {}
