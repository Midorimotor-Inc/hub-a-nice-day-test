// GASからデータを読み込む
// ★サーバーに繋がっているかの目印。読み取りに失敗した時に画面を空のまま描くと
//   「データが全部消えた」ように見える（2026-08-26、実際にユーザーが消失と誤解した）。
//   はっきり知らせるための状態をここで持つ。データそのものには一切触れない。
const markGasUp   = ()=>{try{window.__hubGasDown=0;}catch(e){}};
const markGasDown = ()=>{try{if(!window.__hubGasDown)window.__hubGasDown=Date.now();}catch(e){}};
const sGet = async(k, retries=3) => {
  if (FB_ON) return fbGet(k);            // 保存先が Firestore のとき（2026-09-18）
  if (!GAS_READY) return null;
  for(let i=0;i<retries;i++){
    try {
      const r = await fetch(`${GAS_URL}?key=${encodeURIComponent(k)}&apiKey=${encodeURIComponent(GAS_API_KEY)}`, {cache:'no-store'});
      if(r.status===503){
        if(i<retries-1){await new Promise(r=>setTimeout(r,2000*(i+1)));continue;}
        markGasDown(); return null;
      }
      const t = await r.text();
      // 値が無いだけ（'null'）は「繋がっているが空」＝異常ではない
      if (!t || t === 'null' || t.startsWith('error:')) { markGasUp(); return null; }
      const parsed = JSON.parse(t);
      // GASの同時呼び出しエラーが混入したデータを除外
      if (parsed && typeof parsed === 'object' && parsed.error) { markGasUp(); return null; }
      markGasUp();
      return parsed;
    } catch { if(i===retries-1){ markGasDown(); return null; } }
  }
  markGasDown();
  return null;
};

// GASにデータを書き込む
// ★2026-08-24 全面改修（BLOCK-B / Kyoshi承認済み）
//   これまで書き込みは mode:'no-cors' で送っており、GASの応答を読めなかった。
//   GASの書き込みは LockService の25秒グローバルロックで直列化され、1本あたり10〜27秒かかる。
//   アプリは1つの保存で複数キー（insp / lres / custbk / locks / cust-updates …）へ同時に投げるため、
//   25秒に間に合わなかった分は GAS が 'error: lock_timeout' を返して捨てているのに、
//   no-cors のせいでそれを成功として扱っていた（実測: 6本同時に投げると4本が捨てられる）。
//   ＝予約や代車が無言で消える最大の原因。対策は2つ:
//     (1) 応答を読む … 'ok' なら確実に着地。'error: lock_timeout' なら混雑なので待って自動再送する。
//     (2) 直列化   … アプリ全体で必ず1本ずつ送る。顧客ファイルの保存と予約の保存が巻き添えにならない。
//   応答が読めない環境（CORSが遮断される等）では従来どおり no-cors で投げ直し、成否不明として扱う。
let __gasWriteQueue=Promise.resolve();
try{ window.__hubWriteBusy=0; }catch(e){}
const __sSetOnce=async(k,v)=>{
  const body=JSON.stringify({key:k,value:JSON.stringify(v),apiKey:GAS_API_KEY});
  try{
    const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const t=String((await r.text())||'').trim();
    if(t==='ok')return 'ok';
    if(t.indexOf('lock_timeout')>=0)return 'busy';
    return 'error:'+t.slice(0,80);
  }catch(e){
    try{await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});}catch(e2){}
    return 'unknown';
  }
};
const sSet=async(k,v,retries=4)=>{
  if(FB_ON){                              // 保存先が Firestore のとき（2026-09-18）。応答は0.1秒ほどなので直列化は不要
    window.__hubWriteBusy=(window.__hubWriteBusy||0)+1;
    try{ return await fbSet(k,v); }finally{ try{window.__hubWriteBusy=Math.max(0,(window.__hubWriteBusy||1)-1);}catch(e){} }
  }
  if(!GAS_READY)return false;
  window.__hubWriteBusy=(window.__hubWriteBusy||0)+1;
  const job=__gasWriteQueue.then(async()=>{
    for(let i=0;i<retries;i++){
      const r=await __sSetOnce(k,v);
      // ★'ok' はGASが「シートに書き終えた」と返した証拠。'unknown' は応答が読めない環境で成否不明。
      //   真偽値ではなく状態を返し、呼び出し側が読み返しの要否を判断できるようにする
      //   （どちらも真値なので既存の if(await sSet(...)) はそのまま動く）。
      if(r==='ok'||r==='unknown')return r;
      if(r==='busy'){
        console.warn('[WRITE] GAS混雑(lock_timeout)→待って再送',k,'attempt',i+1);
        await new Promise(x=>setTimeout(x,3000+4000*i));
        continue;
      }
      console.error('[WRITE] GASがエラーを返しました',k,r);
      return false;
    }
    console.error('[WRITE] 混雑が続き書き込めませんでした',k);
    return false;
  }).catch(e=>{console.error('[WRITE] 例外',k,e);return false;});
  __gasWriteQueue=job.then(()=>{},()=>{});
  try{return await job;}finally{try{window.__hubWriteBusy=Math.max(0,(window.__hubWriteBusy||1)-1);}catch(e){}}
};

// ★保存の「サーバー最新値を読む → 書く → 読み返して検算する」全体を〈保存中〉として扱う。
//   ポーリングは window.__hubWriteBusy>0 の間だけサーバー値で画面を上書きしない仕組みだが、
//   この印は sSet の間しか立っておらず、その手前の「読む」1〜3秒は素通りできた。
//   画面に先に出した予約が、その隙のポーリングで一瞬消えることがある
//   （2026-08-28、即時表示を入れた際にユーザーが「ポーリング問題は大丈夫か」と指摘して判明）。
//   読み取りから検算までを一続きで守る。sGet/sSet/useShared 自体は変更しない。
const withSaveBusy=async(fn)=>{
  try{ window.__hubWriteBusy=(window.__hubWriteBusy||0)+1; }catch(e){}
  try{ return await fn(); }
  finally{ try{ window.__hubWriteBusy=Math.max(0,(window.__hubWriteBusy||1)-1); }catch(e){} }
};

// ★ポーリングで受けたサーバー値とローカル値を突き合わせる（代車/レンタカー/週予定など
//   {親キー:{子キー:レコード}} 形のデータ用）。純関数にして単体テストできるようにしてある。
//   規則:
//     - 基本はサーバー値を採用する。
//     - ローカルにしか無い／ローカルの方が id が新しいレコードは、"作られたばかり"の間だけ残す。
//       （書き込みがまだGASに届いていない自分の入力を、ポーリングで消させないため）
//   ★FRESH_MS を過ぎたローカル専用レコードは捨てる。従来は無条件に復活させていたため、
//     他のPCで削除した代車が自分の画面では毎回よみがえり、リロードするまで消えなかった
//     （＝「代車が消えたり現れたりする」の正体。2026-08-25にユーザーが報告）。
//   ★id も savedAt も持たないレコードは判断材料が無いので従来どおり残す（custbk等の保護）。
const SHARED_FRESH_MS = 180000; // 3分。GASへの書き込みは実測2〜4秒なので十分な猶予
// ★id と savedAt の「大きい方」を時刻にする（Kyoshi承認のBLOCK-B変更・2026-09-16）。
//   従来は id があれば savedAt を見なかった。id は作成時刻なので、既存の予約の名前や期間を
//   変えても時刻が変わらず「サーバーの方が正」と判定され、GASの60秒キャッシュが返す古い値に
//   数秒で上書きされていた（代車・レンタカーの利用者名を変えても元に戻る、と報告）。
//   編集時に savedAt を打ち直せば、3分間はローカルの編集が古いキャッシュに負けない。
//   サーバーにも同じ savedAt が入るので、キャッシュが切れた後は両方同じ値になる。
function sharedRecTs(r){
  if(!r||typeof r!=='object')return 0;
  return Math.max(Number(r.id)||0, Number(r.savedAt)||0);
}
function sharedRecFresh(r,nowTs){
  const t=sharedRecTs(r);
  if(!t)return true;                       // 時刻が分からないものは残す（従来動作）
  return (nowTs-t) < SHARED_FRESH_MS;
}
// ★スケジュール(insp)用。{日付:[行,...]} の形なので上のマージ規則（{親:{子:値}}）は使えない。
//   サーバー値を土台に、「手元にしか無い作りたての行」だけを足して返す。

//   古い値が土台として返ることがある。そのまま書くとその予約が消える。
//   行の同一判定は custId → seq → 氏名+No の順。seq(作成時刻)が古い行は足さない

      (a.seq&&b.seq&&a.seq===b.seq)||

          const local = localRef.current;
          if (local && typeof local==='object' && !Array.isArray(local) &&
              v   && typeof v   ==='object' && !Array.isArray(v)) {
            const mg = mergeSharedObjects(local, v, Date.now());
            localRef.current = mg; setVal(mg);
          } else {
            localRef.current = v; setVal(v);
          }
        }
    }
    return () => { mounted.current = false; __hubPollUnregister(id); if (deferTimer.current) { clearTimeout(deferTimer.current); deferTimer.current = null; } deferred.current = null; };
  }, [key, pollMs]);

  const update = useCallback((fn) => {
    const next = typeof fn === 'function' ? fn(localRef.current) : fn;
    localRef.current = next;
    setVal(next);
    writeCount.current += 1;
    try { window.__hubLastWriteTs = Date.now(); } catch (e) {}   // 表示消失の見張りが自分の保存と区別するため
    // ★保存ごとに独立したタイマーで減算する。以前は直前のタイマーをclearしていたため、
    //   70秒以内に2回以上保存すると writeCount が減りきらず、そのキーのポーリング反映が
    //   リロードまで停止していた（2026-07-02 Kyoshi承認のBLOCK-B変更）
    sSet(key, next).then(() => {
      setTimeout(() => { writeCount.current = Math.max(0, writeCount.current - 1); }, 70000);
    }).catch(() => {
      setTimeout(() => sSet(key, localRef.current).catch(() => {}), 1500);
      setTimeout(() => { writeCount.current = Math.max(0, writeCount.current - 1); }, 72000);
    });
  }, [key]);

  // GAS書き戻しなし・writeCount操作なしのローカル表示更新専用
  // visibilitychangeなど「読み込んで表示だけ更新したい」場面で使用
  const updateLocal = useCallback((v) => {
    const next = typeof v === 'function' ? v(localRef.current) : v;
    localRef.current = next;
    setVal(next);
  }, []);

  return [val, update, updateLocal];
}

const SEC_INSP='sec-insp', SEC_SCHED='sec-sched', SEC_NOTES='sec-notes';
const scrollTo=(id)=>{
  if(id==='sec-top'){window.scrollTo({top:0,behavior:'smooth'});return;}
  const el=document.getElementById(id);
  if(!el)return;
  // sticky headerの高さ分オフセット
  const headerH=document.querySelector('header')?.offsetHeight||0;
  const top=el.getBoundingClientRect().top+window.scrollY-headerH-8;
  window.scrollTo({top,behavior:'smooth'});
};

                    </button>
                  </div>
                  <div style={{fontSize:11.5,color:'#6b7280',lineHeight:1.8}}>
                    紛失・退職のときは<b>「取り消し」</b>を押してください。押した瞬間からその端末は使えなくなります。<br/>
                    「失効予定」は<b>最後に使った日から90日後</b>です。使うたびに先へ延びるので、毎日使う端末がここで切れることはありません。
                    3か月まったく開かれなかった端末だけが自動で消えます。
                  </div>
                  {devices===null?(
                    <div style={{padding:'20px 0',textAlign:'center',color:'#9ca3af',fontSize:12}}>読み込み中…</div>
                  ):Object.keys(devices).length===0?(
                    <div style={{padding:'18px 14px',background:'#f9fafb',border:'1.5px solid #e5e7eb',borderRadius:10,color:'#6b7280',fontSize:12,lineHeight:1.8}}>

                    <div style={{display:'flex',flexDirection:'column',gap:7}}>
                      {Object.keys(devices).map(j=>{

                              // 画面の一覧ではなくサーバー最新を土台にして、対象の1件だけを消す。

                      }}

// ============================================
//  ログイン
// ============================================
// ============================================
//  本人認証：この端末にスタッフを追加する
//    メールを入れる → (最初の1人だけ)端末の種類を選ぶ → 届いた6桁を入れる
//    氏名とナンバーは入力させない（自己申告だと他人を名乗れるため）。
//    サーバーが登録済みメールから本人を確定して返す。
// ============================================
// 招待メールのリンクに付いている印（?inv=…）。開くだけで誰の登録か伝わるので、
// アドレスを打つ段を飛ばして6桁の入力から始める（ユーザー指摘 2026-09-15）。
// 登録が済んだら（やめた時も）URLから印を外す。残すと開き直すたびに登録画面が出る。
const HUB_INVITE_ID=(()=>{try{return new URLSearchParams(location.search).get('inv')||'';}catch(e){return '';}})();
const hubDropInvite=()=>{ if(!HUB_INVITE_ID)return; try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){} };
// ── 登録の引き継ぎ（?hand=…）──────────────────────────────────────
//   iPhoneでは Safari／LINEやメールの中のブラウザ／ホーム画面に追加したアイコン が、それぞれ別の保管場所を持つ。
//   Safariで登録してもアイコンから開くと未登録になり、もう一度メール→6桁をやらされていた（2026-09-16 竹林）。
//   登録が済んだブラウザが「引き継ぎの印」を作ってURLに付け（?hand=…）、その印つきURLから開いた側は
//   印を出して同じ利用証を受け取る。台帳に行は増えない（同じ端末の行を共有する）。印は30分で消える。
const HUB_HANDOFF_ID=(()=>{try{return new URLSearchParams(location.search).get('hand')||'';}catch(e){return '';}})();
const hubIsPhone=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent||'');
// 印を作る／出す（hubMakeHandoff / hubTakeHandoff）は Firestore 版を BLOCK-B の認証層に置いた（2026-09-18）

// ── スマホ登録の QR コード（2026-09-22 ユーザー要望）──
//   PC でサインインしている人の「引き継ぎの印」（30分）を作り、mobile.html?hand=…&reg=1 を QR にする。
//   スマホのカメラで読むと、その人としてサインインした状態で登録の流れ（自分専用／共有 → 完了 → ホーム画面に追加）に入る。
//   印には合言葉が入るので30分で無効。別の人（このPCでサインインしていない人）は、アドレス入りの招待 URL（要・6桁コード）を QR にする。
const hubMobileUrl=()=>location.origin+location.pathname.replace(/[^/]*$/,'mobile.html');
const HubQr=({text,size=200})=>{
  let svg='';
  try{ if(typeof qrcode==='function'){ const q=qrcode(0,'M'); q.addData(text); q.make(); svg=q.createSvgTag({cellSize:4,margin:2,scalable:true}); } }catch(e){ svg=''; }
  if(!svg) return <div style={{fontSize:11,color:'#6b7280',wordBreak:'break-all',padding:8,border:'1px dashed #cbd5e1',borderRadius:8}}>QR を描けません。この URL をスマホで開いてください：<br/>{text}</div>;
  return <div style={{width:size,height:size,margin:'0 auto',background:'white',padding:6,border:'1px solid #e5e7eb',borderRadius:10}} dangerouslySetInnerHTML={{__html:svg.replace('<svg ','<svg style="width:100%;height:100%" ')}}/>;
};
const PhoneQrPanel=({people,compact})=>{
  // people: この端末に登録されている人 [{name,email}]。サインイン中の人は印（コード不要）、それ以外は招待 URL（要コード）
  const meMail=(fbUser&&fbUser.email||'').toLowerCase();
  const list=(people||[]).filter(p=>p&&p.name);
  const mine=list.find(p=>String(p.email||'').toLowerCase()===meMail);
  const [sel,setSel]=useState(mine?mine.name:(list[0]?list[0].name:''));
  const person=list.find(p=>p.name===sel)||mine||null;
  const direct=!!(person&&mine&&person.name===mine.name&&fbAuth&&fbUser);
  const [hand,setHand]=useState('');
  const [made,setMade]=useState(0);
  const [busy,setBusy]=useState(false);
  const make=async()=>{ if(!direct)return; setBusy(true); try{ const h=await hubMakeHandoff(); setHand(h||''); setMade(Date.now()); }finally{ setBusy(false); } };
  useEffect(()=>{ setHand(''); if(direct) make(); },[direct,sel]);
  useEffect(()=>{ if(!direct)return; const t=setInterval(make,25*60*1000); return()=>clearInterval(t); },[direct]);   // 印は30分で無効なので作り直す
  const url=direct?(hand?hubMobileUrl()+'?hand='+encodeURIComponent(hand)+'&reg=1':''):(person&&person.email?hubMobileUrl()+'?inv=1&e='+encodeURIComponent(person.email):'');
  return(
    <div style={{textAlign:'center'}}>
      {list.length>1&&(
        <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap',marginBottom:10}}>
          {list.map(p=><button key={p.name} onClick={()=>setSel(p.name)} style={{padding:'6px 12px',borderRadius:8,border:`2px solid ${sel===p.name?'#1d4ed8':'#e5e7eb'}`,background:sel===p.name?'#dbeafe':'white',color:sel===p.name?'#1e40af':'#475569',fontWeight:700,fontSize:12,cursor:'pointer'}}>{p.name}</button>)}
        </div>
      )}
      {person&&<div style={{fontWeight:900,fontSize:15,color:'#1e293b',marginBottom:6}}>{person.name} さんのスマホ用</div>}
      {direct
        ?(url?<HubQr text={url} size={compact?180:220}/>:<div style={{padding:30,color:'#6b7280',fontSize:12}}>{busy?'QR を準備しています…':'QR を作れませんでした。もう一度お試しください。'}</div>)
        :(url?<HubQr text={url} size={compact?180:220}/>:<div style={{padding:20,color:'#b45309',fontSize:12}}>この人のメールアドレスが登録に無いため QR を出せません。招待メールから登録してください。</div>)}
      <div style={{fontSize:12,color:'#475569',lineHeight:1.8,marginTop:10,textAlign:'left',background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'10px 12px'}}>
        <b>スマホでの手順</b><br/>
        ① スマホのカメラでこの QR を読む → 出てきたリンクを開く（<b>Safari／Chrome で</b>）<br/>
        {direct
          ?<>② 名前が出たら「自分専用」を選ぶ → 登録完了（<b>コード入力は不要</b>）<br/></>
          :<>② メールアドレスが入った登録画面が出るので、<b>招待コード（6桁）</b>を入れる<br/></>}
        ③ 「ホーム画面に追加」（iPhone：共有ボタン □↑ → ホーム画面に追加／Android：⋮ → ホーム画面に追加）<br/>
        ④ 次からはホーム画面のアイコンから開くだけ
      </div>
      {direct&&<div style={{fontSize:11,color:'#94a3b8',marginTop:6}}>この QR は表示から30分で無効になります（自動で作り直します）。{hand&&<button onClick={make} disabled={busy} style={{marginLeft:6,padding:'2px 8px',borderRadius:6,border:'1px solid #cbd5e1',background:'white',fontSize:11,cursor:'pointer'}}>作り直す</button>}</div>}
    </div>
  );
};
const PhoneQrModal=({people,onClose})=>(
  <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:2147483000,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:16,width:'min(460px,96vw)',maxHeight:'92vh',overflowY:'auto',padding:'18px 18px 16px',boxShadow:'0 24px 80px rgba(0,0,0,.4)'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{fontWeight:900,fontSize:16,color:'#1e293b'}}>📱 スマホを登録（QR コード）</div>
        <button onClick={onClose} style={{border:'none',background:'#f1f5f9',borderRadius:8,width:32,height:32,fontSize:16,cursor:'pointer'}}>✕</button>
      </div>
      <PhoneQrPanel people={people}/>
    </div>
  </div>
);

const AuthAddScreen=({onDone,onCancel,staffH,staffS})=>{
  // 流れ：email（アドレスを入れる）→ sent（メールを送った）→ ［メールのリンクを開く＝この画面が開き直る］→ signing（確認中）
  //       → kind / plan / label（端末の種類）→ done。招待メールのリンクから開いた時は signing から始まる。
  //   6桁コードは無い。リンクを開いたブラウザがそのまま本人としてサインインする（2026-09-18）。
  const linkOpen=hubIsLinkOpen();
  const firstOnDevice0 = hubLive(hubLoadMine()).length===0;
  const [step,setStep]=useState((linkOpen||(fbAuth&&firstOnDevice0))?'signing':'email');   // サインイン済みかもしれない端末は、まず確かめる
  const [email,setEmail]=useState(hubLinkEmailFromUrl());
  // 招待 QR（管理者コンソール）から来た時は 6桁を URL から受け取って入れておく（2026-09-22・メールが届かない人のため）
  const codeFromUrl=()=>{try{return (new URLSearchParams(location.search).get('code')||'').replace(/[^0-9]/g,'').slice(0,6);}catch(e){return '';}};
  const [code,setCode]=useState(codeFromUrl());            // 招待コード（6桁）。メールのリンクを開かなくても登録できる
  const [kind,setKind]=useState(hubKind());
  const [busy,setBusy]=useState(false);
  const [hand,setHand]=useState('');            // 登録直後に作る引き継ぎの印（スマホ）
  const [phoneQr,setPhoneQr]=useState('ask');   // PC で登録完了 → 'ask'（スマホも登録しますか？）｜'show'（QR）｜'no'
  const [err,setErr]=useState('');
  const [who,setWho]=useState(null);
  const [pend,setPend]=useState(null);
  const [needEmail,setNeedEmail]=useState(false);   // リンクを開いたがアドレスが分からない（別の端末で送ったリンク）
  const [label,setLabel]=useState(hubLabel());   // この端末の名前（共有のときだけ聞く）
  const [devNames,setDevNames]=useState(null);   // 管理者が決めた端末名の候補
  const [typing,setTyping]=useState(false);      // 候補を使わず自分で入力する
  const [plan,setPlan]=useState([]);             // 管理者が決めた「使う端末」
  const firstOnDevice = hubLive(hubLoadMine()).length===0;
  const errText=r=>{
    const e=r&&r.err;
    return e==='not_allowed' ? 'このアドレスは登録されていません。管理者にご確認ください。'
      : e==='too_many' ? '送信が続いています。しばらく待ってからお試しください。'
      : e==='bad_email' ? 'メールアドレスの形式が正しくありません。'
      : e==='bad_code' ? 'アドレスかコードが違います。'
      : e==='bad_domain' ? 'この画面のアドレスがまだ許可されていません（管理者：Firebase の承認済みドメインに追加してください）。'
      : e==='expired' ? 'このリンクは期限切れか、すでに使われています。メールアドレスを入れて、新しいリンクを受け取ってください。'
      : e==='quota' ? '本日のメールリンクの送信上限（Firebase の無料枠）に達しました。管理者に招待コードを発行してもらい、アドレスとコードで登録してください。'
      : e==='offline' ? '通信の状態をご確認ください。'
      : 'うまくいきませんでした。もう一度お試しください。'+(r&&r.raw?'（'+r.raw+'）':'');
  };
  // アドレスと6桁で登録する
  const startCode=async()=>{
    const mail=email.trim();
    if(mail.indexOf('@')<1){setErr('メールアドレスの形式が正しくありません。');return;}
    if(code.length!==6){setErr('招待コード（6桁）を入れてください。');return;}
    setErr('');setBusy(true);
    const r=await hubSignInWithCode(mail,code);
    setBusy(false);
    if(!r.ok){ setErr(r.err==='bad_code'?'アドレスかコードが違います。招待メールの6桁をご確認ください。':errText(r)); return; }
    await afterSignIn();
  };
  // アドレスを入れてリンクを送る
  const startSend=async()=>{
    const mail=email.trim();
    if(mail.indexOf('@')<1){setErr('メールアドレスの形式が正しくありません。');return;}
    setErr('');setBusy(true);
    const r=await hubSendLink(mail);
    setBusy(false);
    if(!r.ok){ setErr(errText(r)); return; }
    setStep('sent');
  };
  // 利用証を端末に保存して完了。端末の種類と名前はここで確定する。
  const finish=(r,k,lb)=>{
    hubDropInvite();
    hubSetKind(k);
    if(lb) hubSetLabel(lb);
    const list=hubLoadMine().filter(x=>x.name!==r.name);
    list.push({uid:r.uid||'',name:r.name,myNumber:r.myNumber,store:r.store||'honten',email:r.email||'',
               isDevice:!!r.device,isAdmin:!!r.admin});
    hubSaveMine(list);
    if(fbAuth&&fbUser) hubHandoffSecret().catch(()=>{});   // 合言葉の控え（引き継ぎ・管理者のコード再招待に要る）
    // 2人目が入った端末は「共有」に直す（自分専用のままだと他人の名義で予約が入る）
    if(hubLive(hubLoadMine()).filter(x=>!x.isDevice).length>1 && hubKind()==='own') hubSetKind('shared');
    // 管理者の端末一覧で読めるように、台帳へ記録する
    hubWriteDevice();
    setWho(r);setStep('done');
  };
  // 共有の端末は、最初に登録する人が1回だけ名前を付ける
  const needLabel=k=>k==='shared'&&!hubLabel();
  // 管理者がその人に決めた「使う端末」を引く。決まっていれば本人は何も選ばない。
  const planOf=async r=>{
    try{
      const store=(r&&r.store)==='sanda'?'sanda':'honten';
      const have=store==='sanda'?staffS:staffH;
      const fresh=await Promise.race([sGet(STOR+store+'-staff-v2'),new Promise(res=>setTimeout(()=>res(null),5000))]);
      const list=(Array.isArray(fresh)&&fresh.length)?fresh:((Array.isArray(have)&&have.length)?have:[]);
      const me=(Array.isArray(list)?list:[]).find(x=>x&&((r.uid&&x.uid===r.uid)||x.name===r.name));
      return (me&&Array.isArray(me.devPlan))?me.devPlan.filter(Boolean):[];
    }catch(e){ return []; }
  };
  // サインインが済んだあと：許可簿で本人を確定し、端末の種類へ進む（旧 verify の後半と同じ）
  const afterSignIn=async()=>{
    setBusy(true);
    const r=await hubResolveMe();
    setBusy(false);
    if(!r||!r.ok){
      setErr(errText(r||{err:'error'}));
      try{ if(fbAuth&&fbUser) await fbAuth.signOut(); }catch(e){}
      hubDropInvite();
      setStep('email'); return;
    }
    if(r.device){ finish(r,'shared',r.label||r.name||''); return; }
    const plan=await planOf(r);
    if(plan.length===1){ const one=plan[0]; finish(r, one==='own'?'own':'shared', one==='own'?'':one); return; }
    if(plan.length>1){ setPend(r); setPlan(plan); setStep('plan'); return; }
    if(firstOnDevice && !kind){ setPend(r); setStep('kind'); return; }
    const already=hubLive(hubLoadMine()).length>0;
    const finalKind=(already&&(kind||hubKind())==='own')?'shared':(kind||hubKind()||'shared');
    if(needLabel(finalKind)){ setPend(r); setKind(finalKind); setStep('label'); return; }
    finish(r, finalKind, '');
  };
  // リンクから開いた：サインインを完了する。アドレスが分からなければ聞く（別の端末で送ったリンクを開いた時）
  const completeLink=async(typed)=>{
    setErr('');setBusy(true);
    const r=await hubCompleteLink(typed);
    setBusy(false);
    if(r.ok){ setNeedEmail(false); await afterSignIn(); return; }
    if(r.err==='need_email'){ setNeedEmail(true); setStep('email'); return; }
    if(r.err==='expired'||r.err==='no_link'){ hubDropInvite(); setErr(errText(r)); setStep('email'); return; }
    setErr(errText(r)); setStep('email');
  };
  useEffect(()=>{
    if(step!=='signing')return;
    (async()=>{
      await fbWhenReady();
      // すでにサインイン済みで、まだこの端末に登録されていない人（別の環境で登録済み・引き継ぎ後など）はそのまま確定へ
      if(!linkOpen){ if(fbUser&&firstOnDevice){ await afterSignIn(); } else setStep('email'); return; }
      await completeLink('');
    })();
  },[step]);
  // 登録が済んだら、スマホでは引き継ぎの印を作っておく（スマホ版へ移る／ホーム画面に追加する時に使う）
  useEffect(()=>{
    if(step!=='done'||!hubIsPhone()||hand)return;
    (async()=>{ const h=await hubMakeHandoff(); if(h) setHand(h); })();
  },[step]);
  // 管理者が決めた端末名を読む（無くても止まらない。その場で入力できる）
  useEffect(()=>{
    if(step!=='label'||devNames!==null)return;
    (async()=>{
      const v=await sGet(STOR+'auth-devnames');
      const list=Array.isArray(v)?v.filter(x=>x&&x.name):[];
      setDevNames(list); setTyping(list.length===0);
    })();
  },[step,devNames]);
  const pickKind=k=>{ setKind(k); if(needLabel(k)){setStep('label');return;} finish(pend,k,''); };

  const BOX={background:'white',borderRadius:18,padding:'28px 30px',maxWidth:430,width:'100%',boxShadow:'0 30px 80px rgba(0,0,0,0.4)'};
  const IN={width:'100%',padding:'11px 13px',border:'2px solid #e5e7eb',borderRadius:9,fontSize:15,outline:'none',boxSizing:'border-box'};
  const BTN=(on)=>({width:'100%',padding:'13px 0',background:on?'linear-gradient(135deg,#c2410c,#f97316)':'#e5e7eb',
    color:on?'white':'#9ca3af',border:'none',borderRadius:11,fontWeight:800,fontSize:15,cursor:on?'pointer':'default',marginTop:14});
  const SUB={width:'100%',padding:'10px 0',background:'#f8fafc',border:'2px solid #cbd5e1',borderRadius:9,
    fontWeight:700,fontSize:13,color:'#475569',cursor:'pointer',marginTop:9};
  const ERR=err?<div style={{color:'#dc2626',fontWeight:700,fontSize:12.5,marginTop:8}}>{err}</div>:null;
  const CARD={width:'100%',textAlign:'left',padding:'13px 15px',borderRadius:10,border:'2px solid #cbd5e1',background:'white',cursor:'pointer'};

  return(
    <div style={{position:'fixed',inset:0,background:'linear-gradient(140deg,#7c2d12,#EA580C,#f97316)',display:'flex',
      alignItems:'flex-start',justifyContent:'center',fontFamily:'system-ui,sans-serif',padding:'28px 16px',overflowY:'auto',zIndex:10001}}>
      <div style={BOX}>
        <div style={{textAlign:'center',marginBottom:18}}>
          <div style={{fontSize:38,marginBottom:4}}>🔑</div>
          <div style={{fontWeight:900,fontSize:17,color:'#111827'}}>この端末にスタッフを追加</div>
          <div style={{fontSize:12,color:'#6b7280',marginTop:3}}>登録は端末ごとに1回だけです</div>
        </div>

        {step==='email'&&(
          <div>
            <div style={{fontSize:12.5,color:'#4b5563',lineHeight:1.8,marginBottom:12}}>
              {needEmail
                ? <>このリンクを送った時のメールアドレスを入れてください（別の端末で送ったリンクのため確認が要ります）。</>
                : <>管理者に登録してもらった<b>ご自分のメールアドレス</b>を入れてください。<br/>
                   そのアドレスにログイン用のリンクが届きます。名前や番号の入力は要りません。</>}
            </div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={IN}
              placeholder="ここにメールアドレスを入力" autoComplete="off" inputMode="email"
              onKeyDown={e=>{if(e.key==='Enter'){ if(needEmail) completeLink(email); else if(code.length===6) startCode(); }}}/>
            {!needEmail&&(<>
              <div style={{fontSize:12,color:'#374151',fontWeight:700,marginTop:12,marginBottom:4}}>招待メールの「招待コード」（6桁）</div>
              <input type="text" value={code} onChange={e=>setCode(e.target.value.replace(/[^0-9]/g,'').slice(0,6))}
                style={{...IN,fontSize:24,letterSpacing:'0.4em',textAlign:'center',fontWeight:800}}
                placeholder="------" inputMode="numeric" autoComplete="one-time-code"
                onKeyDown={e=>{if(e.key==='Enter'&&code.length===6)startCode();}}/>
            </>)}
            {ERR}
            {needEmail
              ? <button style={BTN(!busy&&email.trim().length>0)} disabled={busy||!email.trim()} onClick={()=>completeLink(email)}>{busy?'確認中…':'確認する'}</button>
              : <>
                  <button style={BTN(!busy&&email.trim().length>0&&code.length===6)} disabled={busy||!email.trim()||code.length!==6} onClick={startCode}>
                    {busy?'確認中…':'登録する'}
                  </button>
                  <button style={SUB} disabled={busy||!email.trim()} onClick={startSend}>コードがない → ログイン用のリンクをメールで受け取る</button>
                </>}
            {onCancel&&<button style={SUB} onClick={()=>{hubDropInvite();onCancel();}}>やめる</button>}
          </div>
        )}

        {step==='sent'&&(
          <div>
            <div style={{background:'#eff6ff',border:'2px solid #93c5fd',borderRadius:11,padding:'14px 14px'}}>
              <div style={{fontWeight:900,fontSize:15,color:'#1e3a8a'}}>📧 メールを送りました</div>
              <div style={{fontSize:12.5,color:'#1e40af',lineHeight:1.8,marginTop:6}}>
                <b>{email.trim()}</b> 宛に届いたメールの「ログイン」のリンクを、<b>この端末で</b>開いてください。<br/>
                開くだけで登録が終わります（6桁の入力はありません）。
              </div>
            </div>
            <div style={{fontSize:11.5,color:'#6b7280',lineHeight:1.7,marginTop:10}}>
              届かない時は迷惑メールも見てください。送信元は Firebase（noreply@hub-a-nice-day.firebaseapp.com）です。
            </div>
            {ERR}
            <button style={SUB} disabled={busy} onClick={startSend}>{busy?'送信中…':'メールが見つからない → 送り直す'}</button>
            <button style={{...SUB,marginTop:6}} onClick={()=>{setErr('');setStep('email');}}>← アドレスを入れ直す</button>
          </div>
        )}

        {step==='signing'&&(
          <div style={{textAlign:'center',padding:'10px 0'}}>
            <div style={{fontWeight:800,fontSize:14,color:'#374151'}}>確認しています…</div>
            <div style={{fontSize:12,color:'#9ca3af',marginTop:6}}>数秒で終わります</div>
            {ERR}
          </div>
        )}

        {step==='kind'&&(
          <div>
            <div style={{fontWeight:800,fontSize:15,color:'#111827',marginBottom:3}}>
              {pend&&pend.name} さん、確認できました
            </div>
            <div style={{fontSize:12,color:'#6b7280',marginBottom:12}}>
              最後にひとつだけ。<b>この端末はどちらですか？</b><br/>
              最初に登録する人が1回選ぶだけです。あとから変えられます。
            </div>
            <button onClick={()=>pickKind('shared')} style={{...CARD,marginBottom:9}}>
              <div style={{fontWeight:800,fontSize:14,color:'#111827'}}>みんなで使う（共有）</div>
              <div style={{fontSize:11.5,color:'#6b7280',marginTop:2}}>店のPCなど。使う前に名前を選びます。<b>迷ったらこちら。</b></div>
            </button>
            <button onClick={()=>pickKind('own')} style={CARD}>
              <div style={{fontWeight:800,fontSize:14,color:'#111827'}}>自分専用</div>
              <div style={{fontSize:11.5,color:'#6b7280',marginTop:2}}>自分のスマホ、個人に割り当てたPC。開くだけで使えます。</div>
            </button>

// ============================================
//  第2火曜日ユーティリティ
// ============================================
// 毎月第2火曜日を返す（1月=0,5月=4,8月=7 は除外 → null）
const getSecondTuesdayExemptMonths = new Set([0,4,7]); // 1月・5月・8月（0-indexed）
const getSecondTuesday = (year, month) => {
  // month: 0-indexed
  if(getSecondTuesdayExemptMonths.has(month)) return null;
  let count=0;
  for(let d=1;d<=31;d++){
    const dt=new Date(year,month,d);
    if(dt.getMonth()!==month)break;
    if(dt.getDay()===2){count++;if(count===2)return d;}
  }
  return null;
};
const isSecondTuesdayHoliday = (year, month, day, overrideOpen) => {
  // 第2火曜日かつ除外月でなく、かつ個別で「通常営業」上書きされていない
  const d2 = getSecondTuesday(year, month);
  if(d2===null||d2!==day) return false;
  const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  if(overrideOpen && overrideOpen.includes(ds)) return false;
  return true;
};
const fmt = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  if(!isOpen) return null;

  const toggle=d=>setClosedDays(p=>p.includes(d)?p.filter(x=>x!==d):[...p,d]);

  const addDate=(ds)=>{

// ============================================
//  検索（1-B案・2026-09-19）：氏名・車種・顧客No・電話で、車検予約（保管箱の過去分も）・整備予約・顧客ファイルを探す。
//  「空き枠検索」の置き換え（車検はカレンダーで空きが分かり、整備は前後を見ないと決められないため使われなかった）。
//  顧客ファイルは開いた時に1回だけ読む（Firestore の cf-index → 各ファイルの index → チャンク）。
// ============================================

// ══ 顧客の横断検索「索引」（v2.98・2026-09-26）══════════════════════════
//   月ファイル（cf-*）がいつでも正。索引はそこから何度でも作り直せる“探すための軽い写し”で、
//   DM の月ごと一覧にも集計にも使わない。だから消えても作り直すだけで済む。
//   中身は 氏名・車種・顧客No・電話・満了日・どのファイルの誰か だけ。
//   ★予約状況（status/入庫日）は入れない：変わるたびに索引を直す必要が無くなり、古い情報が出ない。
//   キー： cf-search-index … {built, total, chunks, files:[月...]}
//          cf-search-chunk-i … 索引の行の配列（1本 2500行・約200KB）
const CFX_CHUNK = 2500;
const cfxIndexKey = () => STOR + 'cf-search-index';
const cfxChunkKey = i => STOR + 'cf-search-chunk-' + i;
const cfxRow = (c, fileName) => ({
  n: String(c.name || ''), c: String(c.carType || ''), no: (c.no == null ? '' : c.no),
  p: [c.phoneMobile, c.phoneHome].map(v => String(v || '').trim()).filter(Boolean).join('/'),
  e: String(c.expiry || ''), f: String(fileName || ''), i: String(c.custId || ''),
});
// 探す時の正規化：全角半角・大小・空白・ハイフン・かっこを無視する（画面の検索と同じ規則）
const cfxNorm = s => String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/[\s　\-‐ー－()（）]/g, '');
const cfxDigits = s => String(s == null ? '' : s).normalize('NFKC').replace(/[^0-9]/g, '');
// 同じ人をまとめる鍵：顧客Noがあればそれ、無ければ氏名＋車種
const cfxPersonKey = r => (r.no !== '' && r.no != null) ? ('no:' + cfxNorm(r.no)) : ('nm:' + cfxNorm(r.n) + '/' + cfxNorm(r.c));
// 索引を読む（sGet を渡す）。無ければ null＝まだ作られていない
const cfxLoad = async (sGet) => {
  const idx = await sGet(cfxIndexKey());
  if (!idx || !Number(idx.chunks)) return null;
  const parts = await Promise.all(Array.from({ length: Number(idx.chunks) }, async (_, i) => {
    let a = await sGet(cfxChunkKey(i));
    for (let t = 0; !Array.isArray(a) && t < 2; t++) { await new Promise(r => setTimeout(r, 600 * (t + 1))); a = await sGet(cfxChunkKey(i)); }
    return Array.isArray(a) ? a : null;
  }));
  if (parts.some(p => !p)) return null;                 // 欠けている＝作り直しが要る
  return { meta: idx, rows: parts.flat() };
};
// 索引を作って書く（files は [{name, customers:[...]}]。PC の顧客リストが持っているもの）
const cfxBuild = async (files, sSet) => {
  const rows = [];
  [...files].sort((a, b) => String(b.name).localeCompare(String(a.name)))
    .forEach(f => (f.customers || []).forEach(c => { if (c && c.name) rows.push(cfxRow(c, f.name)); }));
  const chunks = [];
  for (let i = 0; i < rows.length; i += CFX_CHUNK) chunks.push(rows.slice(i, i + CFX_CHUNK));
  for (let i = 0; i < chunks.length; i++) await sSet(cfxChunkKey(i), chunks[i]);
  const meta = { built: Date.now(), total: rows.length, chunks: chunks.length, files: files.map(f => f.name) };
  await sSet(cfxIndexKey(), meta);
  return meta;
};
// 探す：ヒットした行を「人」でまとめ、新しい月を今回・それ以外を前回として返す
//   数字だけを打った時は 電話と顧客No の数字で探す（電話の下4桁だけでも出る）
const cfxSearch = (rows, q, limit) => {
  const raw = String(q || '').trim();
  if (raw.length < 2) return [];
  const nq = cfxNorm(raw), dq = cfxDigits(raw);
  const numOnly = dq.length >= 2 && cfxNorm(raw) === dq;
  const hit = r => numOnly
    ? (cfxDigits(r.p).includes(dq) || cfxDigits(r.no).includes(dq))
    : (cfxNorm(r.n).includes(nq) || cfxNorm(r.c).includes(nq) || cfxNorm(r.no).includes(nq) || cfxNorm(r.p).includes(nq));
  const groups = new Map();
  for (const r of rows) {
    if (!hit(r)) continue;
    const k = cfxPersonKey(r);
    const g = groups.get(k);
    if (!g) groups.set(k, { key: k, now: r, past: [] });
    else if (String(r.f) > String(g.now.f)) { g.past.unshift(g.now); g.now = r; }
    else g.past.push(r);
    if (groups.size >= (limit || 200) && !groups.has(k)) break;
  }
  return [...groups.values()].sort((a, b) => String(b.now.f).localeCompare(String(a.now.f)));
};
const _hubNorm=s=>String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s\u3000\-‐ー－()（）]/g,'');
const FindModal=memo(({isOpen,onClose,inspData,schedDataH,schedDataS,onGo,onGoCust})=>{

  const storeName=st=>(st==='sanda'||st==='三田店')?'三田店':'本店';

    if(!r||!r.name)return;

  }); });
  // 整備（両店）
  const schedHits=[];
  if(nq) [['honten',schedDataH],['sanda',schedDataS]].forEach(([st,sd])=>{ Object.keys(sd||{}).forEach(dk=>{ Object.keys(sd[dk]||{}).forEach(sk=>{
    const r=sd[dk][sk]; if(!r||!r.name)return;
    if(hit(r.name,r.carType,r.content,r.work)) schedHits.push({kind:'sched',dk,sk,r,store:st,n:dkNum(dk)});
  }); }); });
  // 顧客ファイル
  const custHits=nq?(cust||[]).filter(r=>hit(r.name,r.carType,r.no,r.phoneHome,r.phoneMobile,r.address)):[];
  const byDate=(a,b)=>b.n-a.n;
  inspHits.sort(byDate); schedHits.sort(byDate);
  const all=(tab==='all'||tab==='insp')?inspHits:[];
  const all2=(tab==='all'||tab==='sched')?schedHits:[];
  const all3=(tab==='all'||tab==='cust')?custHits:[];
  const total=inspHits.length+schedHits.length+custHits.length;
  const mark=text=>{
    const t=String(text==null?'':text); if(!nq||!t)return t;
    const i=_hubNorm(t).indexOf(nq); if(i<0)return t;

// ============================================
//  空き枠検索（2026-09-19 に「検索」へ置き換え。部品は残してある）
// ============================================
const SearchModal=memo(({isOpen,onClose,inspData,schedData,closedDays,closedDates,overrideOpenDates,onNavigate,inspLimits})=>{
  const [sType,setSType]=useState('insp');
  const [dows,setDows]=useState([]);
  const [fh,setFh]=useState('09');
  const [th,setTh]=useState('18');
  const [results,setResults]=useState([]);
  const [searched,setSearched]=useState(false);
  const DOW=['日','月','火','水','木','金','土'];

  const doSearch=()=>{
    const found=[];
    const now=new Date();
    const end=new Date(now.getFullYear(),now.getMonth()+3,now.getDate());
    for(let cur=new Date(now);cur<=end&&found.length<30;cur.setDate(cur.getDate()+1)){
      const y=cur.getFullYear(),m=cur.getMonth(),d=cur.getDate(),dow=cur.getDay();
      if(closedDays.includes(dow)) continue;
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(closedDates.includes(ds)) continue;
      if(isSecondTuesdayHoliday(y,m,d,Array.isArray(overrideOpenDates)?overrideOpenDates:[])) continue;
      if(dows.length>0&&!dows.includes(dow)) continue;
      const dk=dateKey(y,m,d);
      if(sType==='insp'){
        const _limit=(inspLimits&&inspLimits[dk]!=null)?inspLimits[dk]:6;
        const rows=Array.from({length:_limit},(_,i)=>(inspData[dk]||[])[i]||null);
        const emptyIdx=rows.findIndex(r=>!r?.name);
        const empCnt=rows.filter(r=>!r?.name).length;
        if(emptyIdx>=0) found.push({y,m,d,dk,dow,label:`${m+1}/${d}（${DOW[dow]}）`,detail:`空き${empCnt}台`,type:'insp',slot:null,emptyIdx});
      } else {
        for(const slot of TIME_SLOTS){
          if(found.length>=30) break;
          const [h]=slot.split(':').map(Number);
          if(h<parseInt(fh)||h>parseInt(th)) continue;
          if(!(schedData[dk]?.[slot]?.name)) found.push({y,m,d,dk,dow,label:`${m+1}/${d}（${DOW[dow]}）`,detail:slot,type:'sched',slot});
        }
      }
    }
    setResults(found);setSearched(true);
  };

  if(!isOpen) return null;
  const HO=Array.from({length:10},(_,i)=>String(9+i).padStart(2,'0'));
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:2500,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="modal-box" style={{background:'white',borderRadius:16,padding:'26px 26px',width:'min(600px,95vw)',maxHeight:'90vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <h2 style={{fontSize:17,fontWeight:800,color:'white',margin:0}}>🔍 空き枠検索</h2>
          <button onClick={onClose} style={{background:'#f3f4f6',border:'none',borderRadius:'50%',width:32,height:32,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><X size={16}/></button>
        </div>
        <div style={{display:'flex',gap:9,marginBottom:14}}>
          {[{v:'insp',l:'🚗 車検'},{v:'sched',l:'⏰ スケジュール'}].map(t=>(
            <button key={t.v} onClick={()=>{setSType(t.v);setSearched(false);}} style={{flex:1,padding:'9px',borderRadius:7,border:`2px solid ${sType===t.v?'#c2410c':'#e5e7eb'}`,background:sType===t.v?'#eef2ff':'white',color:sType===t.v?'#c2410c':'#374151',fontWeight:700,cursor:'pointer'}}>{t.l}</button>
          ))}
        </div>
        <p style={{fontSize:12,fontWeight:700,color:'#374151',marginBottom:7}}>希望曜日（未選択=全日）</p>
        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:13}}>
          {DOW.map((n,i)=><button key={i} onClick={()=>setDows(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i])} style={{padding:'6px 11px',borderRadius:6,border:`2px solid ${dows.includes(i)?'#c2410c':'#e5e7eb'}`,background:dows.includes(i)?'#eef2ff':'white',color:dows.includes(i)?'#c2410c':'#374151',fontWeight:700,cursor:'pointer',fontSize:12}}>{n}</button>)}
        </div>
        {sType==='sched'&&(
          <div style={{marginBottom:13}}>
            <p style={{fontSize:12,fontWeight:700,color:'#374151',marginBottom:7}}>希望時間帯</p>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <select value={fh} onChange={e=>setFh(e.target.value)} style={{padding:'7px',border:'2px solid #e5e7eb',borderRadius:6,fontSize:13,outline:'none'}}>
                {HO.map(h=><option key={h} value={h}>{h}:00</option>)}
              </select>
              <span style={{fontWeight:700}}>〜</span>
              <select value={th} onChange={e=>setTh(e.target.value)} style={{padding:'7px',border:'2px solid #e5e7eb',borderRadius:6,fontSize:13,outline:'none'}}>
                {HO.map(h=><option key={h} value={h}>{h}:00</option>)}
              </select>
            </div>
          </div>
        )}
        <button onClick={doSearch} style={{width:'100%',padding:'11px 0',background:'linear-gradient(135deg,#c2410c,#ea580c)',color:'white',border:'none',borderRadius:9,fontWeight:700,cursor:'pointer',marginBottom:14}}>
          🔍 検索（3ヶ月先・最大30件）
        </button>
        {searched&&(
          <div className="fade-in">
            {results.length===0
              ?<div style={{textAlign:'center',padding:'20px',color:'#6b7280'}}>空き枠が見つかりませんでした</div>
              :<>
                <p style={{fontSize:12,fontWeight:700,color:'#374151',marginBottom:7}}>検索結果 {results.length}件</p>
                <div style={{maxHeight:280,overflowY:'auto',display:'flex',flexDirection:'column',gap:5}}>
                  {results.map((r,i)=>(
                    <button key={i} onClick={()=>{onNavigate(r);onClose();}}
                      style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 13px',background:'#f8fafc',border:'2px solid #e2e8f0',borderRadius:8,cursor:'pointer',textAlign:'left'}}
                      onMouseEnter={e=>{e.currentTarget.style.background='#eef2ff';e.currentTarget.style.borderColor='#c2410c';}}
                      onMouseLeave={e=>{e.currentTarget.style.background='#f8fafc';e.currentTarget.style.borderColor='#e2e8f0';}}>
                      <div><span style={{fontWeight:700,color:'white',marginRight:9}}>{r.label}</span><span style={{fontSize:12,color:'#6b7280'}}>{r.detail}</span></div>
                      <span style={{fontSize:12,color:'#c2410c',fontWeight:700}}>→ 移動</span>
                    </button>
                  ))}
                </div>
              </>
            }
          </div>
        )}
      </div>
    </div>
  );
});

              {TIME_SLOTS.map(s=><option key={s} value={s}>{s}</option>)}

        {/* 制限解除項目 */}

          <div style={{fontSize:11,color:'#6b7280',marginBottom:8}}>制限時間内でも予約可能にする作業内容を選択</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:7,maxHeight:280,overflowY:'auto'}}>
            {WORKS.map(w=>{
              const on=exemptWorks.includes(w.id);
              return(
                <button key={w.id} onClick={()=>toggleWork(w.id)}
                  style={{padding:'8px 12px',border:`2px solid ${on?'#10b981':'#d1d5db'}`,borderRadius:8,background:on?'#d1fae5':'white',cursor:'pointer',textAlign:'left',fontSize:12,fontWeight:600,color:on?'#065f46':'#6b7280'}}>
                  <span style={{marginRight:6}}>{on?'✓':'○'}</span>{w.id} {w.name}
                </button>
              );

        {/* ボタン */}
        <div style={{display:'flex',gap:8}}>

          {restriction&&<button onClick={handleRemove} style={{padding:'11px 14px',background:'#f3f4f6',border:'none',borderRadius:9,fontWeight:600,cursor:'pointer',fontSize:12,color:'#6b7280'}}>制限解除</button>}
          <button onClick={onClose} style={{padding:'11px 14px',background:'#f3f4f6',border:'none',borderRadius:9,fontWeight:600,cursor:'pointer',fontSize:12}}>戻る</button>
        </div>
      </div>
    </div>
  );
});

// ============================================
//  スタッフ休日・有給カレンダーモーダル
// ============================================
const StaffCalendarModal=memo(({isOpen,onClose,initMonth,currentUser,adminMode,
  dynStaffH,dynStaffS,
  dayOffDataH,setDayOffDataH,dayOffDataS,setDayOffDataS,
  paidLeaveDataH,setPaidLeaveDataH,paidLeaveDataS,setPaidLeaveDataS,
  offNoteH,setOffNoteH,offNoteS,setOffNoteS,
  closedDaysH,closedDaysS,closedDatesH,closedDatesS,overrideOpenDates,
  monthlyHolidays,onSaveMonthlyHoliday})=>{
  const [calStore,setCalStore]=useState('honten');
  const [selStaff,setSelStaff]=useState(null);
  const [selType,setSelType]=useState('dayoff');
  const [calMonth,setCalMonth]=useState(null);
  const [memoEdit,setMemoEdit]=useState(null);   // {dkk} 休日メモを編集中の日（選んだスタッフの分）
  const [memoText,setMemoText]=useState('');
  const [autoLeaveMsg,setAutoLeaveMsg]=useState('');   // 「枠を使い切ったので有給にしました」の一言（数秒で消える）
  useEffect(()=>{ if(!autoLeaveMsg)return; const t=setTimeout(()=>setAutoLeaveMsg(''),6000); return()=>clearTimeout(t); },[autoLeaveMsg]);

  useEffect(()=>{
    if(isOpen){
      // ログインユーザーの店舗を初期選択
      const userStoreId=currentUser?.store?.id||'honten';
      setCalStore(userStoreId);
      setCalMonth(initMonth||new Date());
      // ログインユーザーを初期選択（自分の休日をすぐ編集できるように）
      setSelStaff(currentUser?.name||null);
      setSelType('dayoff');
    }
  },[isOpen,initMonth,currentUser]);

  if(!isOpen||!calMonth)return null;

  const cy=calMonth.getFullYear(),cm=calMonth.getMonth();
  const staffList=(calStore==='honten'?(dynStaffH&&dynStaffH.length>0?dynStaffH:DEFAULT_STAFF_HONTEN):(dynStaffS&&dynStaffS.length>0?dynStaffS:DEFAULT_STAFF_SANDA))
    .filter(s=>s.badge!=='president'&&s.myNumber!==0);
  const storeObj=STORES.find(s=>s.id===calStore);
  const _rawDayOff =calStore==='honten'?dayOffDataH  :dayOffDataS;
  const _rawPleave =calStore==='honten'?paidLeaveDataH  :paidLeaveDataS;
  // 各日付の値が配列でなければ[]に正規化
  const dayOffData = Object.fromEntries(Object.entries(_rawDayOff||{}).map(([k,v])=>[k,Array.isArray(v)?v:[]]));
  const setDayOffData=calStore==='honten'?setDayOffDataH:setDayOffDataS;
  const pleaveData = Object.fromEntries(Object.entries(_rawPleave||{}).map(([k,v])=>[k,Array.isArray(v)?v:[]]));
  const setPleaveData=calStore==='honten'?setPaidLeaveDataH:setPaidLeaveDataS;
  const offNote=(calStore==='honten'?offNoteH:offNoteS)||{};
  const setOffNote=calStore==='honten'?setOffNoteH:setOffNoteS;
  const noteOf=(dkk,name)=>{const v=offNote[dkk+'::'+name];return typeof v==='string'?v:(v&&v.memo)||'';};
  const canEditStaff=name=>adminMode||name===(currentUser&&currentUser.name);
  const saveMemo=(dkk,name,text)=>{
    const k=dkk+'::'+name, t=String(text||'').trim().slice(0,30);
    if((noteOf(dkk,name)||'')===t)return;
    setOffNote(p=>{const n={...(p||{})};if(t)n[k]=t;else delete n[k];return n;});
  };

  // 店舗休業日判定（店舗別closedDays + 両店共通closedDates + 第2火曜）
  const storeCDays = Array.isArray(calStore==='honten'?closedDaysH:closedDaysS)
    ? (calStore==='honten'?closedDaysH:closedDaysS) : [];
  const storeCDates = Array.isArray(calStore==='honten'?closedDatesH:closedDatesS)
    ? (calStore==='honten'?closedDatesH:closedDatesS) : [];
  const ovOpen = Array.isArray(overrideOpenDates)?overrideOpenDates:[];
  const isStoreClosed=(year,month,day)=>{
    const dt=new Date(year,month,day);
    if(storeCDays.includes(dt.getDay()))return true;
    const ds=fmt(year,month,day);
    if(storeCDates.includes(ds))return true;
    if(isSecondTuesdayHoliday(year,month,day,ovOpen))return true;
    return false;
  };

  const handleDayClick=(dkk,year,month,day)=>{
    if(!selStaff)return;
    // 一般スタッフは自分の休日しか触れない（画面で絞っているが、念のためここでも）
    if(!adminMode && selStaff!==(currentUser&&currentUser.name))return;
    if(isStoreClosed(year,month,day))return; // 店休日は操作不可
    if(selType==='dayoff'){
      const cur=dayOffData[dkk]||[];
      // ★「休日」のまま、もう一度クリックで解除できる（2026-09-28 ユーザー指示）。
      //   枠を使い切って自動で有給になった日も、有給ボタンに切り替えずにここで外せる。
      if(cur.includes(selStaff)||(pleaveData[dkk]||[]).includes(selStaff)){
        setDayOffData(p=>({...p,[dkk]:(p[dkk]||[]).filter(n=>n!==selStaff)}));
        setPleaveData(p=>({...p,[dkk]:(p[dkk]||[]).filter(n=>n!==selStaff)}));
        saveMemo(dkk,selStaff,''); if(memoEdit&&memoEdit.dkk===dkk)setMemoEdit(null);   // 休みを外したらメモも消す
      }else{
        // 今月の枠（会社の休日数＋繰越）を使い切っていたら、休日ではなく有給として入れる（2026-09-21 ユーザー決定）
        const q=calcHolidayCarry(selStaff,year,month,dayOffData,isStoreClosed,monthlyHolidays);
        if(q&&q.quota!=null&&q.taken>=q.quota){
          setDayOffData(p=>({...p,[dkk]:(p[dkk]||[]).filter(n=>n!==selStaff)}));
          setPleaveData(p=>({...p,[dkk]:[...(p[dkk]||[]).filter(n=>n!==selStaff),selStaff]}));
          setAutoLeaveMsg(`${month+1}月の休日の枠（${q.quota}日）を使い切っているので、${month+1}/${day} は有給として入れました`);
          return;
        }
        setPleaveData(p=>({...p,[dkk]:(p[dkk]||[]).filter(n=>n!==selStaff)}));
        setDayOffData(p=>({...p,[dkk]:[...(p[dkk]||[]).filter(n=>n!==selStaff),selStaff]}));
      }
    }else{
      const cur=pleaveData[dkk]||[];
      if(cur.includes(selStaff)){
        setPleaveData(p=>({...p,[dkk]:(p[dkk]||[]).filter(n=>n!==selStaff)}));
        saveMemo(dkk,selStaff,''); if(memoEdit&&memoEdit.dkk===dkk)setMemoEdit(null);
      }else{
        setDayOffData(p=>({...p,[dkk]:(p[dkk]||[]).filter(n=>n!==selStaff)}));
        setPleaveData(p=>({...p,[dkk]:[...(p[dkk]||[]).filter(n=>n!==selStaff),selStaff]}));
      }
    }
  };

  const daysInMonth=new Date(cy,cm+1,0).getDate();
  const first=new Date(cy,cm,1).getDay();
  const weeks=[];let wk=Array(7).fill(null);
  for(let d=1;d<=daysInMonth;d++){
    const dow=(first+d-1)%7;wk[dow]=d;
    if(dow===6){weeks.push([...wk]);wk=Array(7).fill(null);}
  }
  if(wk.some(x=>x!==null))weeks.push([...wk]);
  const DOW2=['日','月','火','水','木','金','土'];

  // 月次集計（店舗休業日はスタッフ休日にカウント）
  const monthlySummary=staffList.map(s=>{
    let offs=0,leaves=0,closedN=0;
    for(let d=1;d<=daysInMonth;d++){
      const dkk=`${cy}-${cm+1}-${d}`;
      if(isStoreClosed(cy,cm,d)){offs++;closedN++;continue;} // 店休日はスタッフ休日としてカウント
      if((dayOffData[dkk]||[]).includes(s.name))offs++;
      if((pleaveData[dkk]||[]).includes(s.name))leaves++;
    }
    const carry=calcHolidayCarry(s.name,cy,cm,dayOffData,isStoreClosed,monthlyHolidays);
    if(carry&&carry.over>0){offs-=carry.over;leaves+=carry.over;}   // 枠を超えた休日は有給に数える
    return{name:s.name,offs,leaves,closedN,carry};
  }).filter(s=>s.offs>0||s.leaves>0||(s.carry&&s.carry.quota!=null));

  const today=new Date();
  const selCarry=selStaff?calcHolidayCarry(selStaff,cy,cm,dayOffData,isStoreClosed,monthlyHolidays):null;   // 選んだ人の繰り越し（充てた日の表示用）

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',zIndex:2500,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="modal-box"
        style={{background:'white',borderRadius:16,width:'min(900px,97vw)',maxHeight:'94vh',overflow:'hidden',display:'flex',flexDirection:'column',boxShadow:'0 24px 80px rgba(0,0,0,0.4)'}}>

        {/* ヘッダー */}
        <div style={{padding:'14px 20px',background:`linear-gradient(135deg,${storeObj.color},${storeObj.accent})`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{color:'white',fontWeight:800,fontSize:15}}>🏖 スタッフ休日・有給カレンダー</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {STORES.map(s=>(
              <button key={s.id} onClick={()=>{setCalStore(s.id);// 店舗切り替え時：自分の店舗なら自分を再選択、他店舗なら全員表示
                const nextStaff=(s.id===currentUser?.store?.id)?currentUser?.name||null:null;
                setSelStaff(nextStaff);}}
                style={{padding:'5px 13px',borderRadius:6,border:'2px solid rgba(255,255,255,0.5)',
                  background:calStore===s.id?'rgba(255,255,255,0.3)':'transparent',
                  color:'white',fontWeight:calStore===s.id?800:500,fontSize:12,cursor:'pointer'}}>
                {s.name}
              </button>
            ))}
            <button onClick={onClose} style={{background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:30,height:30,cursor:'pointer',color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}><X size={14}/></button>
          </div>
        </div>

        {/* スタッフ選択 + 種類 */}
        <div style={{padding:'11px 20px',background:'#f8fafc',borderBottom:'1px solid #e5e7eb',flexShrink:0}}>
          {/* 会社が決めた今月の休日数（表示のみ・入力は管理者4人） */}
          <div style={{display:'flex',alignItems:'center',marginBottom:8}}>
            <MonthlyHolidayBadge y={cy} m={cm}
              value={(monthlyHolidays||{})[`${cy}-${cm+1}`]}
              canEdit={canRestore(currentUser)}
              onSave={onSaveMonthlyHoliday||(()=>{})}/>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:selStaff?8:0}}>
            <span style={{fontSize:11,fontWeight:700,color:'#374151',flexShrink:0}}>スタッフ：</span>
            {!adminMode&&<span style={{fontSize:10.5,color:'#9ca3af'}}>（ご自分の休日だけ設定できます）</span>}
            <button onClick={()=>setSelStaff(null)}
              style={{padding:'4px 10px',borderRadius:6,border:`2px solid ${!selStaff?'#6366f1':'#d1d5db'}`,
                background:!selStaff?'#eef2ff':'white',color:!selStaff?'#c2410c':'#6b7280',
                fontWeight:!selStaff?700:500,fontSize:11,cursor:'pointer'}}>
              全員表示
            </button>
            {/* 一般スタッフは自分の名前だけ。他人の休日は管理者が設定する（決定①）。
                「全員表示」は残すので、他人の休みを見ることはできる。 */}
            {(adminMode?staffList:staffList.filter(s=>s.name===(currentUser&&currentUser.name))).map(s=>{
              const hasDayoff=Object.values(dayOffData).some(arr=>arr.includes(s.name));
              const hasLeave=Object.values(pleaveData).some(arr=>arr.includes(s.name));
              return(
                <button key={s.id} onClick={()=>setSelStaff(s.name)}
                  style={{padding:'4px 10px',borderRadius:6,border:`2px solid ${selStaff===s.name?storeObj.color:'#d1d5db'}`,
                    background:selStaff===s.name?storeObj.bg:'white',
                    color:selStaff===s.name?storeObj.color:'#374151',
                    fontWeight:selStaff===s.name?700:500,fontSize:11,cursor:'pointer',
                    position:'relative'}}>
                  {s.name}
                  {(hasDayoff||hasLeave)&&<span style={{position:'absolute',top:-3,right:-3,width:7,height:7,borderRadius:'50%',background:hasDayoff?'#f97316':'#10b981'}}/>}
                </button>
              );
            })}
          </div>
          {selStaff&&(
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <span style={{fontSize:11,fontWeight:700,color:'#374151',flexShrink:0}}>種類：</span>
              <button onClick={()=>setSelType('dayoff')}
                style={{padding:'5px 14px',borderRadius:7,border:`2px solid ${selType==='dayoff'?'#f97316':'#d1d5db'}`,
                  background:selType==='dayoff'?'#fff7ed':'white',color:selType==='dayoff'?'#ea580c':'#6b7280',
                  fontWeight:selType==='dayoff'?800:500,fontSize:12,cursor:'pointer'}}>
                🏖 休日
              </button>
              <button onClick={()=>setSelType('leave')}
                style={{padding:'5px 14px',borderRadius:7,border:`2px solid ${selType==='leave'?'#10b981':'#d1d5db'}`,
                  background:selType==='leave'?'#d1fae5':'white',color:selType==='leave'?'#059669':'#6b7280',
                  fontWeight:selType==='leave'?800:500,fontSize:12,cursor:'pointer'}}>
                📋 有給
              </button>
              <span style={{fontSize:11,color:'#9ca3af',marginLeft:4}}>日付をクリックで設定・解除。休みの日の ✎ でメモ</span>
            </div>
          )}
          {memoEdit&&selStaff&&(
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:8,padding:'8px 12px',background:'#fffbeb',border:'1.5px solid #fcd34d',borderRadius:8}}>
              <span style={{fontSize:12,fontWeight:800,color:'#92400e',flexShrink:0}}>📝 {cm+1}/{memoEdit.dkk.split('-')[2]} {selStaff} のメモ</span>
              <input value={memoText} onChange={e=>setMemoText(e.target.value)} maxLength={30} autoFocus placeholder="例：午後休・前月分・病院"
                onKeyDown={e=>{if(e.key==='Enter'){saveMemo(memoEdit.dkk,selStaff,memoText);setMemoEdit(null);}if(e.key==='Escape')setMemoEdit(null);}}
                style={{flex:1,padding:'6px 10px',border:'1.5px solid #d1d5db',borderRadius:6,fontSize:13}}/>
              <button onClick={()=>{saveMemo(memoEdit.dkk,selStaff,memoText);setMemoEdit(null);}}
                style={{padding:'6px 14px',borderRadius:6,border:'none',background:'#f97316',color:'white',fontWeight:800,fontSize:12,cursor:'pointer'}}>保存</button>
              {noteOf(memoEdit.dkk,selStaff)&&<button onClick={()=>{saveMemo(memoEdit.dkk,selStaff,'');setMemoEdit(null);}}
                style={{padding:'6px 10px',borderRadius:6,border:'1.5px solid #d1d5db',background:'white',color:'#6b7280',fontWeight:700,fontSize:12,cursor:'pointer'}}>消す</button>}
              <button onClick={()=>setMemoEdit(null)} style={{padding:'6px 10px',borderRadius:6,border:'none',background:'transparent',color:'#9ca3af',fontSize:12,cursor:'pointer'}}>やめる</button>
            </div>
          )}
        </div>

        {/* カレンダー本体 */}
        <div style={{flex:1,overflowY:'auto',padding:'16px 20px'}}>
          {/* 月ナビ */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:14,marginBottom:12}}>
            <button onClick={()=>setCalMonth(new Date(cy,cm-1,1))} style={NAV_S}><ChevronLeft size={16}/></button>
            <span style={{fontWeight:800,fontSize:17,color:'#1f2937'}}>{cy}年{cm+1}月</span>
            <button onClick={()=>setCalMonth(new Date(cy,cm+1,1))} style={NAV_S}><ChevronRight size={16}/></button>
          </div>

          <div style={{border:'2px solid #e5e7eb',borderRadius:9,overflow:'hidden'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'#eef2ff',borderBottom:'1px solid #d1d5db'}}>
              {DOW2.map((d,i)=>(
                <div key={i} style={{padding:'7px 0',textAlign:'center',fontWeight:700,fontSize:12,color:i===0?'#dc2626':i===6?'#1d4ed8':'#374151'}}>{d}</div>
              ))}
            </div>
            {weeks.map((week,wi)=>(
              <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
                {week.map((day,di)=>{
                  if(!day)return <div key={di} style={{minHeight:80,borderTop:'1px solid #e5e7eb',borderLeft:di>0?'1px solid #e5e7eb':'none',background:'#f9fafb'}}/>;
                  const dkk=`${cy}-${cm+1}-${day}`;
                  const dow=new Date(cy,cm,day).getDay();
                  const isHol=HOLIDAYS_2026.has(`${cy}-${cm+1}-${day}`);
                  const numCol=(isHol||dow===0)?'#dc2626':dow===6?'#1d4ed8':'#111';
                  const isToday=day===today.getDate()&&cm===today.getMonth()&&cy===today.getFullYear();

                  // 店舗休業日は名前非表示
                  const selDayoff=!isCl&&selStaff&&(dayOffData[dkk]||[]).includes(selStaff);
                  const selLeave =!isCl&&selStaff&&(pleaveData[dkk]||[]).includes(selStaff);
                  // 休業日の見た目は車検カレンダーと共通（A案＋左の区切りバー）
                  const cellBg=isCl?CLOSED_BG:selDayoff?'#fff7ed':selLeave?'#f0fdf4':'white';
                  const cellBorder=isCl?'1px solid #e5e7eb':selDayoff?'2px solid #f97316':selLeave?'2px solid #10b981':'1px solid #e5e7eb';

                  // 他スタッフのアイコン（店休日は非表示）
                  const othersOff =isCl?[]:(dayOffData[dkk]||[]).filter(n=>n!==selStaff);
                  const othersLeave=isCl?[]:(pleaveData[dkk]||[]).filter(n=>n!==selStaff);

                  return(
                    <div key={di}
                      onClick={()=>handleDayClick(dkk,cy,cm,day)}
                      style={{minHeight:82,padding:'5px 4px',borderTop:'1px solid #e5e7eb',
                        borderLeft:di>0?'1px solid #e5e7eb':'none',
                        background:cellBg,outline:isToday?TODAY_CELL.outline:cellBorder,outlineOffset:isToday?TODAY_CELL.outlineOffset:0,borderRadius:isToday?10:0,zIndex:isToday?3:'auto',boxShadow:isCl?CLOSED_BAR:'none',position:'relative',
                        cursor:isCl?'not-allowed':selStaff?'pointer':'default',
                        transition:'opacity 0.1s'}}
                      onMouseEnter={e=>{if(selStaff&&!isCl)e.currentTarget.style.opacity='0.75';}}
                      onMouseLeave={e=>{e.currentTarget.style.opacity='1';}}>

                        ))}
                        {othersLeave.slice(0,5).map((name,i)=>(
                          <span key={`l${i}`} title={`${name}（有給）${noteOf(dkk,name)?'：'+noteOf(dkk,name):''}`}

                            {name.charAt(0)}
                          </span>
                        ))}
                        {(othersOff.length+othersLeave.length)>10&&<span style={{fontSize:8,color:'#9ca3af'}}>…</span>}
                      </div>

              <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
                {monthlySummary.map(({name,offs,leaves,closedN,carry})=>(

                    <span style={{fontWeight:700,color:'#374151'}}>{name}</span>
                    {offs>0&&<span style={{color:'#ea580c',fontWeight:700,display:'flex',alignItems:'center',gap:2}}><span style={{width:8,height:8,borderRadius:2,background:'#f97316',display:'inline-block'}}/>休{offs}日{offBreakdown(closedN,carry)&&<span style={{fontWeight:500,color:'#9a3412'}}>{offBreakdown(closedN,carry)}</span>}</span>}
                    {leaves>0&&<span style={{color:'#059669',fontWeight:700,display:'flex',alignItems:'center',gap:2}}><span style={{width:8,height:8,borderRadius:2,background:'#10b981',display:'inline-block'}}/>有{leaves}日</span>}
                    <span style={{color:'#c2410c',fontWeight:800,fontSize:10}}>計{offs+leaves}日</span>
                    {carryLabel(carry)&&<span title={carryTitle(carry)} style={{fontSize:10,fontWeight:700,color:carry.remain>0?'#1d4ed8':'#dc2626',borderLeft:'1px solid #e5e7eb',paddingLeft:6}}>{carryLabel(carry)}</span>}

          <span style={{display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:13,height:13,borderRadius:2,background:'#f97316',display:'inline-block'}}/>🏖 休日（オレンジ）
          </span>
          <span style={{display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:13,height:13,borderRadius:2,background:'#10b981',display:'inline-block'}}/>📋 有給（グリーン）
          </span>

          {selStaff
            ?<span style={{color:'#c2410c',fontWeight:600}}>← {selStaff}さんの日付をクリックして設定・解除</span>
            :<span>スタッフを選択すると日付を設定できます</span>
          }
          <button onClick={onClose}
            style={{marginLeft:'auto',padding:'8px 22px',background:'linear-gradient(135deg,#c2410c,#ea580c)',color:'white',border:'none',borderRadius:8,fontWeight:900,fontSize:13,cursor:'pointer',boxShadow:'0 3px 10px rgba(67,56,202,0.35)',whiteSpace:'nowrap'}}>
            ✅ 確定して閉じる

        </div>
      </div>
    </div>
