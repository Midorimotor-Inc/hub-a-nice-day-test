                    🔑 {RENTAL_LOCAL.find(c=>c.id===rConfirm.carId)?.name}　{start.month+1}/{start.day}〜{end.month+1}/{end.day}（{days}日間）
                  </div>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <input value={rPickUser} onChange={e=>setRPickUser(e.target.value)}
                      placeholder="利用者名を入力" autoFocus
                      style={{flex:1,padding:'9px 12px',border:'2px solid #6ee7b7',borderRadius:8,fontSize:13,outline:'none',fontFamily:'inherit'}}
                      onKeyDown={e=>{if(e.key==='Enter')rHandleConfirm();}}/>
                    <button onClick={rHandleConfirm}
                      style={{padding:'9px 20px',background:'#059669',color:'white',border:'none',borderRadius:8,fontWeight:800,cursor:'pointer',fontSize:13,whiteSpace:'nowrap'}}>✓ 確定</button>
                    <button onClick={()=>{setRConfirm(null);setRPickUser('');}}
                      style={{padding:'9px 14px',background:'#f3f4f6',border:'none',borderRadius:8,cursor:'pointer',fontSize:13}}>取消</button>
                  </div>
                </div>
              );
            })()}

            {/* レンタカードラッグ中バナー */}
            {pickMode&&rDrag&&(()=>{
              const {start,end}=rDrag;
              const days=Math.floor((new Date(end.year,end.month,end.day)-new Date(start.year,start.month,start.day))/(1000*60*60*24))+1;
              return(
                <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:1800,background:'rgba(5,150,105,0.95)',color:'white',borderRadius:10,padding:'10px 20px',fontSize:13,fontWeight:700,boxShadow:'0 4px 20px rgba(0,0,0,0.3)',pointerEvents:'none',whiteSpace:'nowrap'}}>
                  🔑 {RENTAL_LOCAL.find(c=>c.id===rDrag.carId)?.name}　{start.month+1}/{start.day}〜{end.month+1}/{end.day}（{days}日間）　← 離して確定
                </div>
              );
            })()}
          </div>
        );
      })()}

      {/* 編集モーダル（代車） */}
      {editModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:3000,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>setEditModal(null)}>
          <div onClick={e=>e.stopPropagation()} className="modal-box" style={{background:'white',borderRadius:15,padding:'24px 28px',width:'min(420px,92vw)',maxHeight:'88vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <h2 style={{fontSize:16,fontWeight:800,color:'#7c2d12',margin:0}}>✎ 代車予約の編集 - {editModal.carName}</h2>
              <button onClick={()=>setEditModal(null)} style={{background:'#f3f4f6',border:'none',borderRadius:'50%',width:30,height:30,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><X size={14}/></button>
            </div>
            <div style={{display:'grid',gap:12}}>
              <div><label style={LBL}>利用者名</label><input value={editForm.user} onChange={e=>setEditForm(p=>({...p,user:e.target.value}))} style={INP} autoFocus/></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <div><label style={LBL}>貸出日</label><input type="date" value={editForm.startDate} onChange={e=>setEditForm(p=>({...p,startDate:e.target.value}))} style={INP}/></div>
                <div><label style={LBL}>返却日</label><input type="date" value={editForm.endDate} onChange={e=>setEditForm(p=>({...p,endDate:e.target.value}))} style={INP}/></div>
              </div>
              {/* 他の予約状況ミニプレビュー（近い分だけ・多い時はスクロール） */}
              {(()=>{const n=nearRes(loanerRes[editModal.carId],editForm,editModal.resId);return(
              <div style={{background:'#f8fafc',borderRadius:6,padding:'8px 10px',fontSize:11,color:'#6b7280'}}>
                <strong style={{color:'#374151'}}>📅 {editModal.carName} の近い予約：</strong>
                {n.rows.length===0
                  ?<span style={{marginLeft:6}}>なし</span>
                  :<div style={{maxHeight:120,overflowY:'auto',marginTop:2}}>
                    {n.rows.map(r=>(
                      <div key={r.id} style={{marginTop:3,color:'#dc2626'}}>
                        🚫 {r.user}：{r.fm+1}/{r.fd}〜{r.tm+1}/{r.td}
                      </div>
                    ))}
                  </div>}
                {n.hidden>0&&<div style={{marginTop:4,color:'#94a3b8'}}>（ほかに古い予約が {n.hidden} 件あります）</div>}
              </div>);})()}
            </div>
            <div style={{display:'flex',gap:8,marginTop:18}}>
              <button onClick={saveEdit} style={{flex:1,padding:'11px 0',background:'linear-gradient(135deg,#c2410c,#ea580c)',color:'white',border:'none',borderRadius:9,fontWeight:700,cursor:'pointer'}}>✓ 更新</button>
              <button onClick={()=>{onDeleteRes(editModal.carId,editModal.resId);setEditModal(null);}} style={{padding:'11px 14px',background:'#fee2e2',color:'#dc2626',border:'2px solid #fca5a5',borderRadius:9,fontWeight:700,cursor:'pointer'}}>🗑</button>
              <button onClick={()=>setEditModal(null)} style={{padding:'11px 14px',background:'#f3f4f6',border:'none',borderRadius:9,fontWeight:600,cursor:'pointer'}}>戻る</button>
            </div>
          </div>
        </div>
      )}

      {/* 編集モーダル（レンタカー） */}
      {rentalEditModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:3000,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>setRentalEditModal(null)}>
          <div onClick={e=>e.stopPropagation()} className="modal-box" style={{background:'white',borderRadius:15,padding:'24px 28px',width:'min(420px,92vw)',maxHeight:'88vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <h2 style={{fontSize:16,fontWeight:800,color:'#065f46',margin:0}}>🔑 レンタカー予約の編集 - {rentalEditModal.carName}</h2>
              <button onClick={()=>setRentalEditModal(null)} style={{background:'#f3f4f6',border:'none',borderRadius:'50%',width:30,height:30,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><X size={14}/></button>
            </div>
            <div style={{display:'grid',gap:12}}>
              <div><label style={LBL}>利用者名</label><input value={rentalEditForm.user} onChange={e=>setRentalEditForm(p=>({...p,user:e.target.value}))} style={INP} autoFocus/></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <div><label style={LBL}>貸出日</label><input type="date" value={rentalEditForm.startDate} onChange={e=>setRentalEditForm(p=>({...p,startDate:e.target.value}))} style={INP}/></div>
                <div><label style={LBL}>返却日</label><input type="date" value={rentalEditForm.endDate} onChange={e=>setRentalEditForm(p=>({...p,endDate:e.target.value}))} style={INP}/></div>
              </div>
              {(()=>{const n=nearRes((rentalRes||{})[rentalEditModal.carId],rentalEditForm,rentalEditModal.resId);return(
              <div style={{background:'#f0fdf4',borderRadius:6,padding:'8px 10px',fontSize:11,color:'#6b7280'}}>
                <strong style={{color:'#065f46'}}>📅 {rentalEditModal.carName} の近い予約：</strong>
                {n.rows.length===0
                  ?<span style={{marginLeft:6}}>なし</span>
                  :<div style={{maxHeight:120,overflowY:'auto',marginTop:2}}>
                    {n.rows.map(r=>(
                      <div key={r.id} style={{marginTop:3,color:'#dc2626'}}>
                        🚫 {r.user}：{r.fm+1}/{r.fd}〜{r.tm+1}/{r.td}
                      </div>
                    ))}
                  </div>}
                {n.hidden>0&&<div style={{marginTop:4,color:'#94a3b8'}}>（ほかに古い予約が {n.hidden} 件あります）</div>}
              </div>);})()}
            </div>
            <div style={{display:'flex',gap:8,marginTop:18}}>
              <button onClick={saveEditRental} style={{flex:1,padding:'11px 0',background:'linear-gradient(135deg,#059669,#047857)',color:'white',border:'none',borderRadius:9,fontWeight:700,cursor:'pointer'}}>✓ 更新</button>
              <button onClick={()=>{onDeleteRentalRes(rentalEditModal.carId,rentalEditModal.resId);setRentalEditModal(null);}} style={{padding:'11px 14px',background:'#fee2e2',color:'#dc2626',border:'2px solid #fca5a5',borderRadius:9,fontWeight:700,cursor:'pointer'}}>🗑</button>
              <button onClick={()=>setRentalEditModal(null)} style={{padding:'11px 14px',background:'#f3f4f6',border:'none',borderRadius:9,fontWeight:600,cursor:'pointer'}}>戻る</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
});

// ============================================
//  RestoreModal — 時点復旧（4名のみ・GAS v10スナップショット）
// ============================================
const RestoreModal = memo(({isOpen, onClose, currentUser, inspData})=>{
  const [list,setList]=useState(null);         // null=読込中, []=なし
  const [sel,setSel]=useState(null);           // 選択中のエントリ
  const [detail,setDetail]=useState(null);     // 詳しい中身(snapRead)
  const [detailLoading,setDetailLoading]=useState(false);
  const [confirming,setConfirming]=useState(false);
  const [restoring,setRestoring]=useState(false);
  const [done,setDone]=useState(false);
  const [drillDate,setDrillDate]=useState(null);  // 詳しい中身→日付タップで開くその日の明細
  const [added,setAdded]=useState({});            // 部分復旧で足した予約(sig→true)。即時反映用
  const [elapsed,setElapsed]=useState(0);         // 復旧の経過秒（進捗表示用）
  const [restoreScope,setRestoreScope]=useState('all'); // 'all'=両店舗全部 / 'honten' / 'sanda'
  const [making,setMaking]=useState(false);       // 「今すぐ保存」の実行中（Firestore 版）
  const makeNow=async()=>{
    if(!FB_ON||making)return;
    setMaking(true);
    const id=await fbSnapCreate('manual','手動保存');
    const a=await snapList(); setList(a); if(id){ const e=a.find(x=>x.file===id); if(e) pick(e); }
    setMaking(false);
  };

  useEffect(()=>{
    if(!isOpen)return;
    setList(null);setSel(null);setDetail(null);setConfirming(false);setRestoring(false);setDone(false);setDrillDate(null);setAdded({});setElapsed(0);setRestoreScope('all');
    snapList().then(a=>{ setList(a); if(a.length) setSel(a[0]); });
  },[isOpen]);

  // 予約の同一判定シグネチャ（位置番号はズレるので中身で照合。GAS snapAddBack と同じ規則）
  const rowSig=(r)=>[String((r&&r.name)||''),String((r&&r.time)||''),String((r&&r.carType)||'')].join('|');
  // 部分復旧: この予約1件だけを今のデータに足す（サーバーがロック内で安全に追記）
  const doAddBack=async(date,r)=>{
    await snapAddBack(date,[r]);
    setAdded(a=>({...a,[rowSig(r)]:true}));
  };

  if(!isOpen) return null;
  const allowed = canRestore(currentUser);
  const kindLabel = (k)=> k==='daily'?'日次':k==='pre-restore'?'復旧前':k==='manual'?'手動':'自動';
  const autoList  = (list||[]).filter(e=>e.kind!=='daily');
  const dailyList = (list||[]).filter(e=>e.kind==='daily');
  const sum = sel&&sel.summary?sel.summary:{insp:0,sched:0,loaner:0,memo:0};

  const pick=(e)=>{ setSel(e); setDetail(null); setConfirming(false); setDrillDate(null); setAdded({}); setRestoreScope('all'); };
  const startScope=(sc)=>{ setRestoreScope(sc); setConfirming(true); };
  const loadDetail = async()=>{ if(!sel)return; setDetailLoading(true); const d=await snapRead(sel.file); setDetail(d); setDetailLoading(false); };
  const doRestore = async()=>{
    if(!sel||!allowed)return;
    setRestoring(true); setElapsed(0);
    const t0=Date.now();
    const iv=setInterval(()=>setElapsed(Math.round((Date.now()-t0)/1000)),1000); // 経過秒を1秒ごとに更新
    if(restoreScope==='all') await snapRestore(sel.file);                 // 両店舗すべて（車検含む）
    else                     await snapRestoreStore(sel.file,restoreScope); // その店の整備・メモ・整備代車だけ
    if(!FB_ON) await new Promise(r=>setTimeout(r,3500)); // GAS は no-cors で応答不可→待ってからリロード
    clearInterval(iv);
    setDone(true);
    setTimeout(()=>location.reload(),1500);
  };

  const ov={position:'fixed',inset:0,background:'rgba(15,23,42,0.6)',zIndex:6000,display:'flex',alignItems:'center',justifyContent:'center',padding:12};
  const box={background:'white',borderRadius:16,width:'min(880px,96vw)',maxWidth:'96vw',maxHeight:'92vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 70px rgba(0,0,0,0.4)',overflow:'hidden'};
  const row=(active)=>({display:'flex',alignItems:'center',gap:10,padding:'9px 11px',border:`1px solid ${active?'#1d4ed8':'#eef2f8'}`,borderRadius:10,marginBottom:6,cursor:'pointer',background:active?'#eff4ff':'white',boxShadow:active?'inset 0 0 0 1px #1d4ed8':'none'});
  const ghd={fontSize:11,fontWeight:800,letterSpacing:'.05em',color:'#94a3b8',margin:'4px 2px 7px',display:'flex',alignItems:'center',gap:6};

  return (
    <div style={ov} onClick={restoring?undefined:onClose}>
      <div style={box} onClick={e=>e.stopPropagation()}>
        {/* ヘッダー */}
        <div style={{background:'linear-gradient(135deg,#1e3a8a,#1d4ed8)',color:'white',padding:'14px 20px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <span style={{fontSize:18}}>🕒</span>
          <div style={{flex:1}}>
            <div style={{fontSize:16,fontWeight:800}}>データ復旧（バックアップから戻す）</div>
            <div style={{fontSize:11,opacity:0.85}}>本店・三田店の全データ／保存時点を選んで戻せます</div>
          </div>
          <button onClick={onClose} disabled={restoring} style={{background:'rgba(255,255,255,0.18)',border:'none',borderRadius:'50%',width:30,height:30,cursor:restoring?'default':'pointer',color:'white',fontSize:15}}>✕</button>
        </div>

        {done ? (
          <div style={{padding:'44px 24px',textAlign:'center'}}>
            <div style={{fontSize:34,marginBottom:10}}>✅</div>
            <div style={{fontSize:16,fontWeight:800,color:'#0f9d58'}}>復旧しました</div>
            <div style={{fontSize:12,color:'#64748b',marginTop:6}}>最新の状態を読み込むため、画面を再読み込みします…</div>
          </div>
        ) : !allowed ? (
          <div style={{padding:'44px 24px',textAlign:'center',color:'#64748b'}}>
            <div style={{fontSize:30,marginBottom:8}}>🔒</div>
            <div style={{fontWeight:700,color:'#334155'}}>この操作は許可されていません</div>
            <div style={{fontSize:12,marginTop:6}}>復旧は指定された担当者のみ実行できます。</div>
          </div>
        ) : (
        <div style={{display:'flex',minHeight:0,minWidth:0,flex:1}}>
          {/* 左：一覧 */}
          <div style={{width:'42%',minWidth:0,flexShrink:0,borderRight:'1px solid #e5e7eb',padding:'13px 13px 16px',overflowY:'auto'}}>
            {list===null ? <div style={{padding:'20px',textAlign:'center',color:'#94a3b8',fontSize:13}}>読み込み中…</div>
             : list.length===0 ? <div style={{padding:'20px',textAlign:'center',color:'#94a3b8',fontSize:13}}>保存された時点がまだありません<br/>（{FB_ON?'開いている画面が1時間ごとに自動で貯めます':'30分ごとに自動で貯まります'}）
                  {FB_ON&&allowed&&<div style={{marginTop:10}}><button onClick={makeNow} disabled={making} style={{padding:'7px 14px',borderRadius:8,border:'2px solid #1d4ed8',background:'#eff4ff',color:'#1d4ed8',fontWeight:800,fontSize:12.5,cursor:'pointer'}}>{making?'保存しています…':'今すぐ時点保存を作る'}</button></div>}</div>
             : <>
                {FB_ON&&allowed&&<button onClick={makeNow} disabled={making} style={{width:'100%',marginBottom:9,padding:'7px 10px',borderRadius:8,border:'2px solid #1d4ed8',background:'#eff4ff',color:'#1d4ed8',fontWeight:800,fontSize:12.5,cursor:'pointer'}}>{making?'保存しています…':'＋ 今すぐ時点保存を作る'}</button>}
                {autoList.length>0 && <div style={ghd}><span style={{width:7,height:7,borderRadius:'50%',background:'#0f9d58',display:'inline-block'}}/>最近の自動保存（{FB_ON?'1時間ごと':'30分ごと'}）</div>}
                {autoList.map(e=>(
                  <div key={e.file} style={row(sel&&sel.file===e.file)} onClick={()=>pick(e)}>
                    <div style={{width:30,height:30,borderRadius:8,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,background:'#e6f6ec'}}>🕒</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13}}>{e.tsText}<span style={{fontSize:10,color:'#94a3b8',marginLeft:6,fontWeight:600}}>{kindLabel(e.kind)}</span></div>
                      <div style={{fontSize:11,color:'#64748b'}}>車検{e.summary?e.summary.insp:0}・整備{e.summary?e.summary.sched:0}</div>
                    </div>
                  </div>
                ))}
                {dailyList.length>0 && <div style={{...ghd,marginTop:14}}><span style={{width:7,height:7,borderRadius:'50%',background:'#1d4ed8',display:'inline-block'}}/>過去の日次バックアップ（毎朝2時・90日分）</div>}
                {dailyList.map(e=>(
                  <div key={e.file} style={row(sel&&sel.file===e.file)} onClick={()=>pick(e)}>
                    <div style={{width:30,height:30,borderRadius:8,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,background:'#eff4ff'}}>📅</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13}}>{e.tsText}</div>
                      <div style={{fontSize:11,color:'#64748b'}}>車検{e.summary?e.summary.insp:0}・整備{e.summary?e.summary.sched:0}</div>
                    </div>
                  </div>
                ))}
               </>}
          </div>

          {/* 右：プレビュー */}
          <div style={{flex:1,minWidth:0,padding:'15px 18px 18px',overflowY:'auto'}}>
            {!sel ? <div style={{color:'#94a3b8',fontSize:13,paddingTop:20}}>左から時点を選んでください。</div>
             : <>
              <div style={{fontSize:16,fontWeight:800}}>{sel.tsText} の状態</div>
              <div style={{fontSize:12,color:'#64748b',margin:'2px 0 13px'}}>この時点に保存されていた内容です。戻す前にここで確認できます。</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
                {[['🚗 車検予約',sum.insp,'#1d4ed8'],['⏰ 整備',sum.sched,'#1d4ed8'],['🔑 代車・レンタカー',sum.loaner,'#0f9d58'],['📝 備考メモ',sum.memo,'#0f9d58']].map(([l,n,c])=>(
                  <div key={l} style={{border:'1px solid #e5e7eb',borderRadius:10,padding:'9px 12px',background:'#f8fafc'}}>
                    <div style={{fontSize:22,fontWeight:800,color:c,lineHeight:1.1}}>{n}</div>
                    <div style={{fontSize:11,color:'#64748b',fontWeight:600}}>{l}</div>
                  </div>
                ))}
              </div>

              {!confirming ? <>
                <div style={{fontSize:12,fontWeight:800,color:'#334155',margin:'2px 2px 7px'}}>戻す範囲を選ぶ</div>
                <button onClick={()=>startScope('honten')} style={{width:'100%',border:'1px solid #c7d7f5',borderRadius:11,padding:'11px 13px',fontSize:13.5,fontWeight:800,color:'#173da8',background:'#eff4ff',cursor:'pointer',textAlign:'left'}}>🔵 本店だけ戻す<div style={{fontSize:11,fontWeight:600,color:'#64748b',marginTop:2}}>整備・メモ・整備の代車のみ／車検と三田は変わりません</div></button>

// ── 代車予約を「位置インデックスに依存せず」特定する（2026-08-23 追加） ──
// 旧来は bookingKey `insp-{dk}-{idx}` の完全一致だけで旧代車を消していた。
// しかし代車を付けた後に上の行が挿入・削除されると idx がズレ、削除が空振りする。
// その結果「前の代車予約が残ったまま、付け直しで2件にダブる」現象が起きていた。
// そこで「同じ旧日付・同じ客」で照合する経路を併用する（bookingKey一致は従来どおり残す）。
const _lrNm=s=>String(s==null?'':s).replace(/[\s　]/g,'');
const _lrMatch=(r,ident)=>{
  if(!r||!ident||!ident.dk)return false;
  if(String(r.bookingKey||'').indexOf(`insp-${ident.dk}-`)!==0)return false;
  if(ident.custId&&r.custId)return String(r.custId)===String(ident.custId);
  return !!_lrNm(ident.name)&&_lrNm(r.user)===_lrNm(ident.name);
};
const _lrObj=b=>(b&&typeof b==='object'&&!Array.isArray(b))?b:{};
const resHasBooking=(base,ident)=>{
  if(!ident||!ident.dk)return false;
  return Object.values(_lrObj(base)).some(days=>Object.values(days||{}).some(r=>_lrMatch(r,ident)));
};
const removeResByBooking=(base,ident)=>{
  const src=_lrObj(base);
  if(!ident||!ident.dk)return src;
  const out={};
  for(const cid of Object.keys(src)){
    const days={...(src[cid]||{})};
    Object.keys(days).forEach(k=>{ if(_lrMatch(days[k],ident))delete days[k]; });
    out[cid]=days;
  }
  return out;
};

function AppInner() {
  const nowDate = new Date();
  // -- ログイン後は今日のスケジュールからスタート --
  // ★修正4: sessionStorageでログイン状態を保持（リロード後も維持）
  const [currentUser,setCurrentUser]=useState(()=>{
    try{
      // sessionStorage：ブラウザ（タブ）を閉じたらログアウト
      const saved=sessionStorage.getItem('hub_currentUser');
      return saved?JSON.parse(saved):null;
    }catch{return null;}
  });
  const setCurrentUserPersist=useCallback((user)=>{
    setCurrentUser(user);
    try{
      if(user) sessionStorage.setItem('hub_currentUser',JSON.stringify(user));
      else sessionStorage.removeItem('hub_currentUser');
    }catch{}
  },[]);

  // ── 本人認証：この端末に登録された人 ──
  const [authMine,setAuthMine]=useState(()=>hubLive(hubLoadMine()));
  const [showAuthAdd,setShowAuthAdd]=useState(!!HUB_INVITE_ID);   // 招待リンクから開いたら最初から登録画面
  const [showPhoneQr,setShowPhoneQr]=useState(false);   // ログイン画面の「スマホを登録（QR）」（2026-09-22）
  // 引き継ぎの印（?hand=）つきで開いた：この保管場所に利用証が無ければ印を出して受け取る。
  // すでにある時は何もしない（URLの印はホーム画面に追加する時のために残す）。
  //   2026-09-18 から：Firebase のサインイン判定が出るまで（数百ミリ秒）も同じく何も描かない。判定が出たら
  //   ・引き継ぎの印があり未登録なら印を出して受け取る
  //   ・サインイン済みなら台帳と許可簿に突き合わせる（管理者に取り消された端末・外された人は登録を捨てる）
  //   ・サインインが無いのに登録一覧だけ残っていれば（保管場所が消えた等）登録を捨てて登録画面へ
  const [handPending,setHandPending]=useState(!!fbAuth||(!!HUB_HANDOFF_ID&&hubLive(hubLoadMine()).length===0));
  useEffect(()=>{
    if(!handPending)return;
    (async()=>{
      try{
        const u=await fbWhenReady();
        let ok=true;
        if(HUB_HANDOFF_ID&&hubLive(hubLoadMine()).length===0){ await hubTakeHandoff(); }
        else if(fbAuth&&!u&&hubLoadMine().length){ hubSaveMine([]); ok=false; }

        if(!ok||hubIsLinkOpen()) setCurrentUserPersist(null);

  },[handPending]);
  // 自分でログアウトした直後は、自動ログインを止めてログイン画面を出す。
  // 止めないと押した瞬間に入り直してしまい、交代も「＋スタッフを追加」もできない。
  const [authAutoOff,setAuthAutoOff]=useState(false);
  // 自動ログインの判定はスタッフ表が届いてから決まる。それまでログイン画面を描くと
  // 一瞬だけ見えてしまうので、判定中は何も描かない。長く待たされないよう5秒で諦める。
  const [autoGaveUp,setAutoGaveUp]=useState(false);
  const _autoPending=!currentUser&&!authAutoOff&&!autoGaveUp
    &&hubKind()==='own'&&authMine.length===1&&!authMine[0].isDevice;
  useEffect(()=>{
    if(!_autoPending)return;
    const t=setTimeout(()=>setAutoGaveUp(true),5000);
    return()=>clearTimeout(t);
  },[_autoPending]);
  const refreshAuthMine=useCallback(()=>{setAuthMine(hubLive(hubLoadMine()));},[]);

  // ── 共有PC：10分無操作でスタッフ選択画面に戻る ──
  const _idleTimer = useRef(null);
  const _idleDesktop = useRef(null); // タイムアウト時に戻る共有PC情報

  const resetIdleTimer = useCallback(() => {
    if(!_idleDesktop.current) return;
    clearTimeout(_idleTimer.current);
    _idleTimer.current = setTimeout(() => {
      // スタッフのみログアウト（共有PC情報は保持）
      setCurrentUser(null);
      try{ sessionStorage.removeItem('hub_currentUser'); }catch{}
    }, 10 * 60 * 1000); // 10分
  }, []);

  // 共有PCログイン時にタイマー開始、個人PCはタイマー不要
  useEffect(() => {
    if(currentUser?.desktopName) {

      _idleDesktop.current = {
        name: currentUser.desktopName,
        store: currentUser.store?.id || currentUser.store,

      // 操作イベントでタイマーリセット
      const events = ['mousedown','mousemove','keydown','touchstart','scroll','click'];
      events.forEach(e => window.addEventListener(e, resetIdleTimer, {passive:true}));
      resetIdleTimer();
      return () => {
        events.forEach(e => window.removeEventListener(e, resetIdleTimer));
        clearTimeout(_idleTimer.current);
      };
    } else {
      // 個人PCまたはログアウト：タイマー不要
      _idleDesktop.current = null;
      clearTimeout(_idleTimer.current);

  }, [currentUser?.desktopName, resetIdleTimer]);
  const [curMonth,setCurMonth]=useState(new Date(nowDate.getFullYear(),nowDate.getMonth(),1));

  const [schedCollapsed,setSchedCollapsed]=useState(false); // スケジュール畳む/開く（デフォルト：開く）

  const [isFullscreen,setIsFullscreen]=useState(false);

  const [fsAsk,setFsAsk]=useState(false);
  // ★全画面に入った直後の数秒だけ「元に戻す」ボタンを光らせて、やめ方が分かるようにする。

  const [fsHint,setFsHint]=useState(false);

      if(saved){const u=JSON.parse(saved);const sid=u?.store?.id||u?.store||null;if(sid)setViewStore(sid);}
    }catch(e){}
  },[]);
  useEffect(()=>{
    const onVisible=()=>{
      if(document.visibilityState==='visible')refreshMainData();
    };
    document.addEventListener('visibilitychange',onVisible);
    return()=>document.removeEventListener('visibilitychange',onVisible);
  },[refreshMainData]);
  // 全画面オーバーレイ内の顧客リストから「スケジュールに戻る」→ オーバーレイを閉じてデータ再取得
  useEffect(()=>{
    const onMsg=(e)=>{
      if(e.origin!==location.origin)return;
      // ★顧客リスト(iframe)で代車を付けた瞬間に受け取って、その場で代車管理へ反映する。
      //   従来は保存が終わってサーバーから読み直すまで親は知らず、スケジュールは即出るのに
      //   代車管理だけ遅れて出ていた（2026-08-25にユーザーが報告）。
      //   保存自体はリスト側がバックグラウンドで続けるので、ここでは見た目だけ先行させる。
      if(e.data&&e.data.type==='hub-lres-added'&&e.data.rec&&e.data.carId!=null){
        const {store,carId,dayKey,rec}=e.data;
        const apply=(store==='sanda')?updateLocalLresS:updateLocalLresH;
        apply(prev=>{
          const base=(prev&&typeof prev==='object'&&!Array.isArray(prev))?prev:{};
          // 同じ予約の古い置き場所を消してから置く（キーがズレて二重に出ないように）
          return putResRec(removeResByBk(base,[rec.bookingKey]),carId,dayKey||`${rec.fy}-${rec.fm}-${rec.fd}`,rec);
        });
        markJustAdded(rec.id); // 顧客リストから入れた分も「たった今」として光らせる
        return;
      }
      if(e.data&&e.data.type==='hub-close-customers'){
        setCustOverlay(false);
        // ★「スケジュールに戻る」は文字どおりスケジュール画面へ戻す。
        //   顧客リストをオーバーレイ化(v1.60)して以降、この分岐は「閉じるだけ」だったため
        //   カレンダー→リスト→戻る でカレンダーに戻っていた（2026-08-25にユーザーが報告）。
        //   オーバーレイ化する前は ./index.html を読み直しており、初期値が
        //   view='schedule' / selDate=今日 なので必ずスケジュールが出ていた。それに揃える。
        setSelDate(d=>{if(d)return d;const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());});
        setView('schedule');
        refreshMainData();
      }
    };
    window.addEventListener('message',onMsg);
    return()=>window.removeEventListener('message',onMsg);
  },[refreshMainData,updateLocalLresH,updateLocalLresS,markJustAdded]);

  // 顧客リストデータのバックグラウンドプリロード
  useEffect(()=>{
    const preload=async()=>{
      try{
        const idx=await sGet(STOR+'cf-index');
        if(!Array.isArray(idx)||idx.length===0)return;
        // cf-indexをlocalStorageに保存
        localStorage.setItem('hub-cf-index',JSON.stringify(idx));
        // 各ファイルのチャンクを順番にバックグラウンド取得
        const SAFE=n=>n.replace(/[^a-zA-Z0-9\u3000-\u9fff\u30a0-\u30ff\u3040-\u309f]/g,'_').slice(0,30);
        for(const fi of idx){
          const sn=SAFE(fi.name);
          const chunkIdx=await sGet(STOR+'cf-'+sn+'-index');
          if(!chunkIdx)continue;
          const chunks=await Promise.all(
            Array.from({length:chunkIdx.chunks},(_,i)=>sGet(STOR+'cf-'+sn+'-chunk-'+i))
          );
          const customers=chunks.filter(Boolean).flat();
          // チャンクデータをlocalStorageに保存
          // cust-updatesキューの情報で上書き（キャンセル済みを保護）
          try{
            const pendingUpdates=await sGet(STOR+'cust-updates')||[];
            const mergedCustomers=customers.map(c=>{
              const pending=pendingUpdates.find(u=>
                (u.custId&&u.custId===c.custId)||
                (u.name&&u.no&&u.name===c.name&&String(u.no)===String(c.no))
              );
              if(pending){return{...c,status:pending.status,...(pending.entryDate!==undefined?{entryDate:pending.entryDate}:{})};}
              return c;
            });
            localStorage.setItem('hub-cf-'+sn,JSON.stringify({name:fi.name,customers:mergedCustomers}));
          }catch(e){
            localStorage.setItem('hub-cf-'+sn,JSON.stringify({name:fi.name,customers}));
          }
        }
      }catch(e){/* プリロード失敗は無視 */}
    };
    // 起動3秒後にバックグラウンドで開始（メイン処理を妨げない）
    const timer=setTimeout(preload,3000);
    return()=>clearTimeout(timer);
  },[]);
  const handleExport=useCallback(()=>{
    const now=new Date();
    const data={
      exportedAt:now.toISOString(),
      exportedBy:currentUser?.name||'',
      exportedStore:vsId,
      version:'hub-v8',
      inspData,
      schedDataHonten:schedDataH, schedDataSanda:schedDataS,
      memoDataHonten:memoDataH,   memoDataSanda:memoDataS,
      loanerResHonten:loanerResH, loanerResSanda:loanerResS,
    };
    const json=JSON.stringify(data,null,2);
    navigator.clipboard.writeText(json).then(()=>{
      setExportStatus('ok');
      setTimeout(()=>setExportStatus(null),3000);
    }).catch(()=>{
      setExportStatus('err');
      setTimeout(()=>setExportStatus(null),4000);
    });
  },[currentUser,inspData,schedData,memoData,loanerRes,closedDays,closedDates]);

  // ── 印刷・PDF出力 ──────────────────────────────────────────
  const handlePrint = useCallback((dk, inspData, schedData, dateLabel, vsId, loanerRes, COURSES, LOANERS, TIME_SLOTS, staffList, dayOffData, closedDays, closedDates, memoData) => {
    const storeName = vsId==='honten'?'本店':'三田店';
    const storeColor = vsId==='honten'?'#2563eb':'#dc2626';
    // 元配列インデックス(_idx)を保持：代車のbookingKey(insp-${dk}-${idx})照合に必要
    const inspRows = (inspData[dk]||[]).map((r,idx)=> r?{...r,_idx:idx}:r);
    const normSt = s=>{if(!s)return'';if(s==='honten'||s==='本店')return'honten';if(s==='sanda'||s==='三田店')return'sanda';return s;};
    const myRows = inspRows.filter(r=>r&&r.name&&normSt(r.store)===vsId);
    const otherRows = inspRows.filter(r=>r&&r.name&&normSt(r.store)&&normSt(r.store)!==vsId);
    const noStoreRows = inspRows.filter(r=>r&&r.name&&!normSt(r.store));
    const sortedInsp = [...myRows, ...noStoreRows, ...otherRows];

    const courseLabel = id => {const c=COURSES.find(c=>c.id===Number(id));return c?c.name:'';};
    const courseBadge = id => {const c=COURSES.find(c=>c.id===Number(id));if(!c)return '';return c.id===1?`<span class="course-badge course-ma">${c.initial}</span>`:`<span class="course-badge course-other" style="color:${c.color}">${c.initial}</span>`;};
    // 代車表記：車種名（番号）。文字量で段階縮小（fitクラスは各表の文字サイズにem追従）
    const fmtLoaner = (nm, num) => num?`${nm}（${num}）`:(nm||'');
    const loanerFitCls = s => {const n=(s||'').length; return 'loaner-fit'+(n>13?' f3':n>9?' f2':n>6?' f1':'');};
    // 本体(getLoanerLabel/1409行)と同一判定: bookingKey一致(氏名ガード付き)を最優先、なければ「この日付を含む期間×氏名一致」。
    // 旧実装は氏名のみで全期間照合し、別日の代車を誤表示していた（本番印刷で実害）。dkはhandlePrint引数を使用。
    const getLoanerLabel = (name, bookingKey) => {
      const parts=dk.split('-').map(Number);
      const dateNum=toNum(parts[0], parts[1]-1, parts[2]);
      let nameMatch='';
      for(const cid of Object.keys(loanerRes)){
        for(const r of Object.values(loanerRes[cid]||{})){
          const label = r.carName ? fmtLoaner(r.carName, r.carNum) : '代車';  // 静的LOANERSは本番と別物なので名前に使わない
          if(bookingKey && r.bookingKey===bookingKey && (!r.user || r.user===name)) return label;
          if(!nameMatch && name && r.user===name && dateNum>=toNum(r.fy,r.fm,r.fd) && dateNum<=toNum(r.ty,r.tm,r.td)) nameMatch=label;
        }
      }
      return nameMatch;
    };
    // スケジュール枠の代車表示：枠に保存された実値を忠実に使う（loanerIdから静的LOANERSを逆引きすると
    // 本番では別車種のデフォルト名＝DEV相当が出てしまうため使わない）。カッコだけ全角に正規化。
    const schedLoaner = r => {
      if(r.rentalLabel) return r.rentalLabel;
      const s = r.loaner||'';
      const m = s.match(/^(.*?)\s*[（(]([^）)]*)[）)]\s*$/);
      return m ? fmtLoaner(m[1], m[2]) : s;
    };

    const dayOff = dayOffData[dk]||[];
    const workStaff = staffList.filter(s=>!dayOff.includes(s.name));

    // タイムスケジュール：9:00〜18:00 全枠（空き含む）
    const PRINT_SLOTS = SCHED_SLOTS.filter(s=>{
      if(isSpecialSlot(s)) return true;       // 未定/午前/午後の枠も印刷に含める
      const h=parseInt(s.split(':')[0]);
      return h>=9 && h<=18 && s!=='12:30';  // 12:30（昼休み枠）は印刷では省く
    });

    // ★事前入庫・納車も印刷に載せる（画面のタイムスケジュールと同じ規則）。
    //   これらは「行そのものを保存しない派生表示」なので、当日のデータだけ見ていた印刷には
    //   出てこなかった。他の日付の車検／作業から毎回組み立てる（2026-08-26にユーザーが要望）。
    const _inStore = r => (r.store===vsId||(r.store==null&&vsId==='honten'));
    const _slotOf  = t => (t&&SCHED_SLOTS.includes(getBaseSlot(t)))?getBaseSlot(t):'未定';
    const _mmdd    = s => {const p=String(s||'').split('-');return p.length===3?`${+p[1]}/${+p[2]}`:String(s||'');};
    const _initial = c => {const x=COURSES.find(x=>x.id===Number(c));return x?x.initial:'';};
    const derivedBySlot = {};
    const pushDerived = (slot,row)=>{(derivedBySlot[slot]=derivedBySlot[slot]||[]).push(row);};
    Object.keys(inspData||{}).forEach(wdk=>{
      (inspData[wdk]||[]).forEach((r,ix)=>{
        if(!r||!r.name||r.bookingStatus==='cancelled'||!_inStore(r))return;
        // 事前入庫：この日に車だけ預かる（車検作業日は別の日）
        if(wdk!==dk && r.entryDate===dk){
          pushDerived(_slotOf(r.time),{kind:'事前入庫',cls:'d-pre',name:r.name,carType:r.carType||'',
            loaner:getLoanerLabel(r.name,`insp-${wdk}-${ix}`),
            note:`${_mmdd(wdk)} 車検${_initial(r.course)?`（${_initial(r.course)}）`:''}の預かり`});
        }
        // 納車：この日に返す
        if(r.deliveryDate===dk){
          pushDerived(_slotOf(r.deliveryTime),{kind:'納車',cls:'d-dlv',name:r.name,carType:r.carType||'',
            loaner:getLoanerLabel(r.name,`insp-${wdk}-${ix}`),
            note:`${_mmdd(wdk)} 車検${_initial(r.course)?`（${_initial(r.course)}）`:''}の納車`});
        }
      });
    });
    Object.keys(schedData||{}).forEach(wdk=>{
      Object.keys(schedData[wdk]||{}).forEach(sk=>{
        const r=schedData[wdk][sk];
        if(!r||!r.name)return;
        // 整備の事前入庫（2026-09-19）
        if(wdk!==dk && r.entryDate===dk){
          pushDerived(_slotOf(getBaseSlot(sk)),{kind:'事前入庫',cls:'d-pre',name:r.name,carType:r.carType||'',loaner:schedLoaner(r),note:`${_mmdd(wdk)} 作業の預かり`});
        }
        if(r.deliveryDate!==dk)return;
        if(wdk===dk&&getBaseSlot(sk)===_slotOf(r.deliveryTime))return; // 自分自身の枠と重なる時は出さない
        pushDerived(_slotOf(r.deliveryTime),{kind:'納車',cls:'d-dlv',name:r.name,carType:r.carType||'',
          loaner:schedLoaner(r),note:`${_mmdd(wdk)} 作業の納車`});
      });
    });

    const schedRows = [];
    for(const slot of PRINT_SLOTS){
      const subKeys = Object.keys(schedData[dk]||{}).filter(k=>getBaseSlot(k)===slot).sort();
      const dataKeys = subKeys.filter(k=>{const r=schedData[dk][k];return r&&r.name;});
      const derived  = derivedBySlot[slot]||[];
      if(dataKeys.length===0&&derived.length===0){
        schedRows.push({slot, name:'', carType:'', work:'', loaner:'', note:'', isEmpty:true});
      } else {
        let first=true;
        dataKeys.forEach(k=>{
          const r=schedData[dk][k];
          schedRows.push({slot:first?slot:'', name:r.name||'', carType:r.carType||'', work:r.work||'', loaner:schedLoaner(r), note:r.content||'', isEmpty:false});
          first=false;
        });
        derived.forEach(d=>{
          schedRows.push({slot:first?slot:'', name:d.name, carType:d.carType, work:d.kind, loaner:d.loaner, note:d.note, isEmpty:false, cls:d.cls});
          first=false;
        });
      }
    }

    // 備考・メモ
    const memos = (memoData&&memoData[dk])||[];
    const memoLen = memos.reduce((a,m)=>a+(((m.content||m.text||'')).length),0);
    const memoCls = memoLen>180?'m-xs':memoLen>90?'m-sm':'';  // 文字量で段階縮小
    const memoHtml = memos.length>0
      ? memos.map(m=>`<div style="padding:4px 0;border-bottom:1px solid #cbd5e1;color:#000">${m.content||m.text||''}</div>`).join('')
      : '<div style="color:#64748b">なし</div>';

    const html = `<!DOCTYPE html>

  //   GASの書き込みは25秒のグローバルロックを取り1本2〜4秒かかるので、
  //   端末が2〜3台開いているだけでロックがほぼ埋まり、予約の保存が待たされ、

      if(expired.length===0)return; // 期限切れが無ければGASに書かない

    const _cur=_resObj(loanerRes)[loanerId]||{};

      .filter(r=>r&&(_hasExact?r.bookingKey===bk:(userName&&r.user===userName)))

  // 代車予約の期間編集は1回のatomic更新で差し替える（delete+addの競合を防ぐ）。
  //   bookingKey / carName / carNum / locked などの既存フィールドはそのまま残るので紐付けが切れない。
  const replaceLoanerRes=useCallback((cid,rid,patch0)=>{
    const patch={...(patch0||{}),savedAt:Date.now()};   // ★編集は savedAt を打ち直す（sharedRecTs 参照）
    setLoanerUndo(u=>[...u,{prevState:loanerRes}]);

      base=>resHasRec(base,cid,rid)?patchResRec(base,cid,rid,patch):undefined,
      back=>{const r=Object.values(_resObj(back)[cid]||{}).find(x=>x&&x.id===rid);
             return !!r&&Object.keys(patch||{}).every(k=>JSON.stringify(r[k])===JSON.stringify(patch[k]));},
      {verb:'期間の変更',name:patch?.user}

  const deleteLoanerRes=useCallback((cid,rid)=>{
    setLoanerUndo(u=>[...u,{prevState:loanerRes}]);

    const deletedRes=Object.values(loanerRes[cid]||{}).find(r=>r.id===rid);
    persistLres(
      base=>resHasRec(base,cid,rid)?removeResById(base,cid,rid):undefined,
      back=>!resHasRec(back,cid,rid),
      {verb:'削除',name:deletedRes?.user}
    );
    // inspDataの該当行のloaner/loanerId/rentalLabel/rentalCarIdもクリア
    if(deletedRes?.bookingKey){
      const bk=deletedRes.bookingKey;
      // bookingKey形式: "insp-2026-5-18-2"
      const m=bk.match(/^insp-(.+)-(\d+)$/);

        // 指すのでidxで対象行を特定する。失敗しても軽微（代車ラベルが残るだけ）なのでアラートは出さない。
        persistInsp(
          base=>{
            const data=(base&&typeof base==='object'&&!Array.isArray(base))?{...base}:{};
            const rows=[...(data[dk]||[])];
            if(rows[idx]&&(rows[idx].loaner||rows[idx].loanerId)){
              rows[idx]={...rows[idx],loaner:'',loanerId:null};
              data[dk]=rows;
            }
            return data;
          },
          back=>{ const rows=(back&&back[dk])||[]; return !rows[idx]||!(rows[idx].loaner||rows[idx].loanerId); },
          {alert:false}
        );

    }

  // 「↶ 戻す」と「最適化の適用」は代車予約を丸ごと差し替える操作なので、mutate はサーバー最新値を

  // 読み返し検証は通す（着地しなければアラート＋メール通知）。
  const undoLoanerRes=useCallback(()=>{
    if(!loanerUndo.length)return;
    const snap=loanerUndo[loanerUndo.length-1].prevState;
    persistLres(()=>snap,back=>JSON.stringify(back)===JSON.stringify(snap),{verb:'「戻す」'});

  },[loanerUndo,persistLres]);
  // ⑤ 限定：この予約の代車を固定（最適化で動かさない）。locked を反転する。
  // ★まだ保存していない（いま選んだ）代車の限定を切り替える。保存時に一緒に書かれる。
  const togglePendingLoanerLock=useCallback(()=>{
    setPendingLoanerData(p=>p?{...p,locked:!p.locked}:p);
  },[]);
  const toggleLoanerLock=useCallback((cid,resId)=>{
    // 反転後の値を先に確定させる（再送のたびに反転すると値が定まらないため）
    const cur=Object.values(_resObj(loanerRes)[cid]||{}).find(r=>r&&r.id===resId);
    if(!cur)return;
    const next=!cur.locked;
    persistLres(
      base=>resHasRec(base,cid,resId)?patchResRec(base,cid,resId,{locked:next,savedAt:Date.now()}):undefined,   // ★savedAt も打ち直す
      back=>{const r=Object.values(_resObj(back)[cid]||{}).find(x=>x&&x.id===resId);return !r||!!r.locked===next;},
      {verb:'固定の切り替え',name:cur.user}
    );
  },[persistLres,loanerRes]);
  // ⑤ 最適化の適用：現在店舗の代車予約を丸ごと差し替えるだけ（実行前に戻す用スナップショットを積む）。
  //   スケジュール行の表示は bookingKey 一致の getLoanerLabel が予約側の carName から再計算するため
  //   自動で新しい車に追従する（insp側は触らないので「↶ 戻す」で完全に元へ戻せる）。
  const applyLoanerOptimize=useCallback((newLoanerRes,moves)=>{
    setLoanerUndo(u=>[...u,{prevState:loanerRes}]);
    persistLres(()=>newLoanerRes,back=>JSON.stringify(back)===JSON.stringify(newLoanerRes),{verb:'最適化の適用'});
    // ★最適化は代車予約(lres)だけを動かすが、予約カード側にも代車名(loaner/loanerId)が
    //   保存されている。ここを書き換えないと古い車名が残り、実際と食い違う。
    //   （2026-09-03 ユーザー報告：9/1でERエクスプレスと岩田さんに同じ N-BOX(9012) が
    //     出ていた。lresでは ER=スペーシア／岩田=N-BOX と正しく分かれており、
    //     ERの予約カードに古い N-BOX の文字が残っていたのが原因）
    const _label=bk=>{
      for(const cid of Object.keys(newLoanerRes||{})){
        for(const r of Object.values(newLoanerRes[cid]||{})){
          if(r&&r.bookingKey===bk)return{label:r.carName?`${r.carName}${r.carNum?` (${r.carNum})`:''}`:'',id:Number(cid)};
        }
      }
      return null;
    };
    const _inspMoves=[],_schedMoves=[];
    (moves||[]).forEach(mv=>{
      if(!mv||!mv.bookingKey)return;
      const info=_label(mv.bookingKey); if(!info)return;
      const m=String(mv.bookingKey).match(/^(insp|sched)-(\d+-\d+-\d+)-(.+)$/); if(!m)return;
      (m[1]==='insp'?_inspMoves:_schedMoves).push({dk:m[2],at:m[3],user:mv.user,...info});
    });
    if(_inspMoves.length){
      persistInsp(base=>{
        const out={...(base||{})};
        _inspMoves.forEach(mv=>{
          const rows=[...(out[mv.dk]||[])]; const i=Number(mv.at);
          const row=rows[i];
          // 行がずれている可能性があるので、氏名が一致する時だけ書き換える（取り違え防止）
          if(!row||!row.name||row.name!==mv.user)return;
          rows[i]={...row,loaner:mv.label,loanerId:mv.id};
          out[mv.dk]=rows;
        });
        return out;
      },back=>_inspMoves.every(mv=>{
        const row=((back||{})[mv.dk]||[])[Number(mv.at)];
        return !row||row.name!==mv.user||row.loaner===mv.label;
      }),{verb:'代車名の更新',alert:false});
    }
    if(_schedMoves.length){
      setSchedData(prev=>{
        const out={...(prev||{})};
        _schedMoves.forEach(mv=>{
          const day={...(out[mv.dk]||{})}; const row=day[mv.at];
          if(!row||!row.name||row.name!==mv.user)return;
          day[mv.at]={...row,loaner:mv.label,loanerId:mv.id};
          out[mv.dk]=day;
        });
        return out;
      });
    }
  },[loanerRes,persistLres,persistInsp,setSchedData]);

  useEffect(()=>{

  // タイムスケジュールを現在時刻に自動追従スクロール（今日を表示中のみ・現在の1枠前を先頭に）。
  // ★フックは必ずログイン判定(if(!currentUser)return)より前に置くこと（後ろに置くと
  //   ログイン⇄ログアウトでフック数が変わりReactがレンダリングエラーになる）。dkは内部で算出。
  const lastAutoSlotRef=useRef(null);
  useEffect(()=>{

      : (selDate ? (()=>{const p=String(selDate).split('-').map(Number);return p.length===3?new Date(p[0],p[1]-1,p[2]):new Date(selDate);})() : null);
    const _dk = _sd?dateKey(_sd.getFullYear(),_sd.getMonth(),_sd.getDate()):null;
    lastAutoSlotRef.current=null;

    const n0=new Date();
    // 今日以外は時間連動しない。前日で下にスクロールした位置が残らないよう先頭(09:00)へ戻す。
    if(_dk!==dateKey(n0.getFullYear(),n0.getMonth(),n0.getDate())){
      const resetTop=()=>{const c=document.getElementById(SEC_SCHED);if(c)c.scrollTop=0;};
      const rts=[0,150,400,900].map(ms=>setTimeout(resetTop,ms));
      return()=>rts.forEach(clearTimeout);
    }
    const targetSlot=()=>{
      const n=new Date();
      let m=Math.floor((n.getHours()*60+n.getMinutes())/30)*30-30; // 現在枠の1枠前
      m=Math.max(9*60,Math.min(18*60,m));                          // 09:00〜18:00にクランプ
      return `${String(Math.floor(m/60)).padStart(2,'0')}:${m%60===0?'00':'30'}`;
    };
    const apply=(force)=>{
      const slot=targetSlot();
      if(!force&&lastAutoSlotRef.current===slot)return;
      const cont=document.getElementById(SEC_SCHED);
      if(!cont)return;
      if(cont.scrollHeight-cont.clientHeight<40)return; // レイアウト未確定時は後の再試行に任せる
      let row=null;
      const idx=Math.max(0,TIME_SLOTS.indexOf(slot));

      const headH=head?head.getBoundingClientRect().height:0;
      cont.scrollTo({top:Math.max(0,rowTop-headH),behavior:document.visibilityState==='visible'?'smooth':'auto'});
    };

      const stuck=cont&&cont.scrollTop>10;
      if(stuck||attempts>20){clearInterval(initIv);return;}
      lastAutoSlotRef.current=null;
      apply(false);
    },1500);
    const iv=setInterval(()=>apply(false),30000);

                    {/* -- 個人選択時：月間合計バー -- */}
                    {staffMonthStats&&(

                            <span style={{width:10,height:10,borderRadius:2,background:'#10b981',display:'inline-block'}}/>
                            📋 有給&nbsp;<span style={{fontSize:18,fontWeight:900}}>{staffMonthStats.leaves}</span>&nbsp;日
                          </span>
                          <span style={{fontSize:12,color:'#c2410c',fontWeight:800,padding:'5px 10px',background:'#eef2ff',border:'1px solid #a5b4fc',borderRadius:16}}>

                      </div>

                  </div>
                  </div>
                );
              })()

        {/* -- スケジュール -- */}
        {view==='schedule'&&_selDate&&(()=>{
          const inspRows=getInsps(dk);
          return (
            <div style={{background:'white',borderRadius:0,boxShadow:'none',borderTop:`4px solid ${vsStore.color}`,flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
              <div id="sec-top"/>
              {/* 固定ヘッダー：日付ナビ〜スタッフバー */}
              <div ref={el=>{if(el){const h=el.offsetHeight;document.documentElement.style.setProperty('--sticky-nav-h',h+'px');}}}
                style={{flexShrink:0,zIndex:400,background:'white',borderBottom:`2px solid ${vsStore.color}44`,padding:'0 18px'}}>
                {/* 1行目：ナビ - 日付を中央、ズームを右 */}
                <div style={{paddingBottom:6,paddingTop:6,display:'flex',alignItems:'center',justifyContent:'center',gap:6,position:'relative'}}>
                  <div style={{display:'flex',gap:3,alignItems:'center',justifyContent:'center'}}>
                      <button onClick={()=>moveDate(-30)} style={{...NAV_S,padding:'4px 7px',fontSize:10}} title="先月">««</button>
                      <button onClick={()=>moveDate(-7)} style={{...NAV_S,padding:'4px 7px',fontSize:10}} title="前週">«</button>
                      <button onClick={()=>moveDate(-1)} style={{...NAV_S,padding:'4px 8px'}}><ChevronLeft size={14}/></button>
                      <div style={{position:'relative',display:'inline-flex',alignItems:'center'}}>
                        <span
                          onClick={()=>{const el=document.getElementById('sched-date-input');if(el){try{el.showPicker();}catch{el.click();}}}}
                          style={{fontWeight:900,fontSize:15,color:'white',padding:'4px 14px',minWidth:130,textAlign:'center',background:'#7c2d12',border:'2px solid #a5b4fc',borderRadius:8,cursor:'pointer',userSelect:'none',display:'inline-block'}}>
                          {_selDate?`${_selDate.getMonth()+1}月${_selDate.getDate()}日（${['日','月','火','水','木','金','土'][_selDate.getDay()]}）`:''}
                        </span>
                        <input id="sched-date-input" type="date"
                          value={_selDate?`${_selDate.getFullYear()}-${String(_selDate.getMonth()+1).padStart(2,'0')}-${String(_selDate.getDate()).padStart(2,'0')}`:''}
                          onChange={e=>{const p=e.target.value.split('-').map(Number);if(p.length===3&&!isNaN(p[0]))setSelDate(new Date(p[0],p[1]-1,p[2]));}}
                          style={{position:'absolute',opacity:0,width:'1px',height:'1px',top:0,left:0,pointerEvents:'none'}}
                        />
                      </div>
                      <button onClick={()=>moveDate(1)} style={{...NAV_S,padding:'4px 8px'}}><ChevronRight size={14}/></button>
                      <button onClick={()=>moveDate(7)} style={{...NAV_S,padding:'4px 7px',fontSize:10}} title="翌週">»</button>
                      <button onClick={()=>moveDate(30)} style={{...NAV_S,padding:'4px 7px',fontSize:10}} title="翌月">»»</button>
                    </div>
                  
                  {dayMemos.length>0&&(
                    <div style={{position:'absolute',left:'25%',transform:'translateX(-50%)',pointerEvents:'none',display:'flex',alignItems:'center'}}>
                      <span style={{display:'flex',alignItems:'center',gap:5,padding:'4px 13px',background:'#fbbf24',border:'2px solid #d97706',borderRadius:7,fontSize:12,fontWeight:800,color:'#1c1917',whiteSpace:'nowrap',boxShadow:'0 2px 6px rgba(217,119,6,0.35)',pointerEvents:'auto',cursor:'pointer',userSelect:'none'}}
                        onClick={()=>document.getElementById('sec-notes')?.scrollIntoView({behavior:'smooth'})}>
                        📝 備考 {dayMemos.length}件
                      </span>
                    </div>
                  )}
                  {/* 本日に戻るボタン。備考バッジ（左25%）と対称の右75%に置いてバランスを取る。
                      表示中の日付が今日でない時だけ出す */}
                  {(()=>{
                    const _t=new Date();
                    const isToday=_selDate&&_selDate.getFullYear()===_t.getFullYear()&&_selDate.getMonth()===_t.getMonth()&&_selDate.getDate()===_t.getDate();
                    if(isToday)return null;
                    return(
                      <div style={{position:'absolute',left:'75%',transform:'translateX(-50%)',display:'flex',alignItems:'center'}}>
                        <button onClick={()=>setSelDate(new Date())} title="表示中の日付にかかわらず今日へ一気に戻る"
                          style={{display:'flex',alignItems:'center',gap:5,padding:'4px 13px',background:'#16a34a',border:'2px solid #15803d',borderRadius:7,fontSize:12,fontWeight:800,color:'white',whiteSpace:'nowrap',boxShadow:'0 2px 6px rgba(22,163,74,0.4)',cursor:'pointer',userSelect:'none'}}>
                          ⏱ 本日に戻る
                        </button>
                      </div>
                    );
                  })()}
                </div>
                {/* 2行目：スタッフバー（固定） */}
                {(()=>{
                  // 店舗休日の場合はスタッフ全員を休み扱い
                  const storeHoliday=isClosed(new Date(...dk.split('-').map((v,i)=>i===1?Number(v)-1:Number(v))));
                  const manualOffs=dayOffData[dk]||[];
                  const offs=storeHoliday?currentStaffList.map(s=>s.name):manualOffs;
                  const working=storeHoliday?[]:currentStaffList.filter(s=>!manualOffs.includes(s.name));
                  const dayoff=storeHoliday?currentStaffList:currentStaffList.filter(s=>manualOffs.includes(s.name));
                  return(
                    <div style={{display:'flex',alignItems:'stretch',border:'1px solid #e5e7eb',borderRadius:8,overflow:'hidden',marginBottom:6}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,padding:'5px 12px',background:storeHoliday?'#f3f4f6':vsStore.bg,flex:1,flexWrap:'wrap',minWidth:0}}>
                        <span style={{fontSize:12}}>👤</span>
                        <span style={{fontWeight:700,fontSize:11,color:'#374151',whiteSpace:'nowrap'}}>本日</span>
                        {storeHoliday
                          ? <span style={{fontSize:11,color:'#9ca3af',fontStyle:'italic'}}>店休日（全員休み）</span>
                          : working.length>0
                            ? working.map(s=>(
                                <span key={s.id} style={{padding:'2px 9px',borderRadius:20,background:vsStore.bg,color:vsStore.accent,fontWeight:700,fontSize:11,border:`1px solid ${vsStore.color}55`,whiteSpace:'nowrap'}}>
                                  {s.name}
                                </span>
                              ))
                            : <span style={{fontSize:11,color:'#9ca3af',fontStyle:'italic'}}>—</span>
                        }
                      </div>
                      <div onClick={storeHoliday?undefined:()=>setShowDayOff(true)} title={storeHoliday?'店休日のため全員休み':'クリックして休日スタッフを編集'}
                        style={{display:'flex',alignItems:'center',gap:6,padding:'5px 12px',
                          background:'repeating-linear-gradient(45deg,#f5f5f5,#f5f5f5 3px,#ebebeb 3px,#ebebeb 6px)',
                          borderLeft:'1px solid #e5e7eb',cursor:storeHoliday?'default':'pointer',flexWrap:'wrap',justifyContent:'flex-end',minWidth:'fit-content',maxWidth:'45%'}}>
                        {dayoff.length>0
                          ? dayoff.map(s=>{
                              const nv=((vsId==='honten'?offNoteH:offNoteS)||{})[dk+'::'+s.name];
                              const note=storeHoliday?'':(typeof nv==='string'?nv:(nv&&nv.memo)||'');
                              return(
                              <span key={s.id} title={note||undefined} style={{padding:'2px 9px',borderRadius:20,background:'#9ca3af',color:'white',fontWeight:700,fontSize:11,whiteSpace:'nowrap'}}>
                                {s.name}{note&&<span style={{fontWeight:400,opacity:.9}}>（{note.length>8?note.slice(0,8)+'…':note}）</span>}
                              </span>
                              );})
                          : <span style={{fontSize:11,color:'#9ca3af',fontStyle:'italic',whiteSpace:'nowrap'}}>休日なし</span>
                        }
                        <span style={{fontSize:11,color:'#9ca3af',flexShrink:0}}>🏖</span>
                      </div>
                    </div>
                  );
                })()}
              </div>

              <div style={{padding:'8px 18px 4px 18px',flex:1,minHeight:0,display:'flex',flexDirection:'column',overflowY:'auto'}}>
              {/* 編集中ロック表示 */}
              {(()=>{
                const al=Object.entries(locks).filter(([k,v])=>k.includes(dk)&&v.lockedBy!==currentUser.name);
                if(!al.length)return null;
                return <div style={{marginBottom:12,padding:'7px 12px',background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:7,display:'flex',gap:7,flexWrap:'wrap',alignItems:'center'}}>
                  <span style={{fontSize:12,fontWeight:700,color:'#92400e'}}>🔒 編集中：</span>
                  {al.map(([k,v])=><span key={k} style={{fontSize:11,background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:12,padding:'2px 8px',color:'#dc2626',fontWeight:600}}>{v.lockedBy}</span>)}
                </div>;
              })()}

              {/* -- 対応可能チェック・アラート（時間枠別・自店舗のみ） -- */}
              {(()=>{
                const storeHolidayChk=isClosed(new Date(...dk.split('-').map((v,i)=>i===1?Number(v)-1:Number(v))));
                const offs=storeHolidayChk?currentStaffList.map(s=>s.name):(dayOffData[dk]||[]);
                const workingStaff=storeHolidayChk?[]:currentStaffList.filter(s=>!offs.includes(s.name));
                if(workingStaff.length===0)return null;
                // 対応スタッフ＝出勤者のうち対応可能業務で車検/整備いずれかのフロント対応にチェックがある人のみ
                const capOf=s=>s.capabilities||getDefaultCapabilities(s.badge||'mechanic');
                const frontCount=workingStaff.filter(s=>{const c=capOf(s);return c.insp_front||c.sched_front;}).length;

                // 入庫時間を分単位に変換するヘルパー
                const toMin=t=>{
                  if(!t)return null;
                  const m=t.match(/(\d+):(\d+)/);
                  if(!m)return null;
                  return parseInt(m[1])*60+parseInt(m[2]);
                };

                // 自店舗の車検を枠別にカウント（承認済みのみ）（9:00〜9:29 → 9時枠、9:30〜9:59 → 9:30枠）
                const myInsps=(inspData[dk]||[]).filter(r=>r?.name&&!r.pendingApproval&&(r.store===vsId||(r.store==null&&vsId==='honten')));
                const insp900=myInsps.filter(r=>{const m=toMin(r.time);return m!=null&&m>=9*60&&m<9*60+30;}).length;
                const insp930=myInsps.filter(r=>{const m=toMin(r.time);return m!=null&&m>=9*60+30&&m<10*60;}).length;

                // スケジュールの09:00・09:30スロット件数（複数行対応）
                const countSchedSlot=(base)=>{
                  const day=schedData[dk]||{};
                  const keys=[base,...Object.keys(day).filter(k=>k.startsWith(base+'__'))];
                  return keys.filter(k=>day[k]?.name).length;
                };
                const sched900=countSchedSlot('09:00');
                const sched930=countSchedSlot('09:30');

                // 枠ごとの合計
                const total900=insp900+sched900;
                const total930=insp930+sched930;

                const alerts=[];
                [
                  {label:'9:00枠',total:total900,insp:insp900,sched:sched900},
                  {label:'9:30枠',total:total930,insp:insp930,sched:sched930},
                ].forEach(({label,total,insp,sched})=>{
                  if(total===0)return;
                  const isOver=total>frontCount;
                  const isEqual=total===frontCount;
                  if(!isOver&&!isEqual)return;
                  alerts.push({label,total,insp,sched,isOver,isEqual});
                });

                if(alerts.length===0)return null;
                return(
                  <div style={{marginBottom:12,display:'flex',flexDirection:'column',gap:6}}>
                    {alerts.map(({label,total,insp,sched,isOver})=>(
                      <div key={label} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 14px',background:isOver?'#fff1f2':'#fffbeb',border:`2px solid ${isOver?'#fca5a5':'#fcd34d'}`,borderRadius:9}}>
                        <span style={{fontSize:18,flexShrink:0}}>{isOver?'⚠️':'⚡'}</span>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:800,color:isOver?'#dc2626':'#d97706',fontSize:13}}>
                            【{label}】入庫台数が対応スタッフ数{isOver?'を超えています':'に達しています'}
                          </div>
                          <div style={{fontSize:11,color:isOver?'#9f1239':'#92400e',marginTop:2,display:'flex',gap:10,flexWrap:'wrap'}}>
                            <span>🚗 車検 <strong>{insp}台</strong></span>
                            <span>⏰ 整備 <strong>{sched}件</strong></span>
                            <span>＝ 合計 <strong>{total}件</strong></span>
                            <span title="対応可能業務で車検/整備フロント対応にチェックのある出勤スタッフ">👤 フロント対応 <strong>{frontCount}名</strong>{frontCount!==workingStaff.length&&<span style={{fontWeight:400}}>（出勤{workingStaff.length}名）</span>}</span>
                            {isOver&&<span style={{color:'#dc2626',fontWeight:800}}>→ {total-frontCount}件オーバー</span>}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })()}

              {/* == スプリットパネル：左＝車検＋備考 ／ 右＝タイムスケジュール == */}
              {/* ドラッグで左右比率を変更、リセットで50:50に戻す */}
              <div ref={splitContainerRef}
                style={{display:'flex',gap:0,flex:1,overflow:'hidden',position:'relative',userSelect:isDraggingRef.current?'none':'auto'}}
                onMouseMove={e=>{
                  if(!isDraggingRef.current||!splitContainerRef.current)return;
                  const rect=splitContainerRef.current.getBoundingClientRect();
                  const pct=((e.clientX-rect.left)/rect.width)*100;
                  setSplitRatio(Math.min(93,Math.max(7,pct)));
                }}
                onMouseUp={()=>{isDraggingRef.current=false;document.body.style.cursor='';document.body.style.userSelect='';}}
                onMouseLeave={()=>{if(isDraggingRef.current){isDraggingRef.current=false;document.body.style.cursor='';document.body.style.userSelect='';}}}
              >

                {/* --- 左カラム --- */}
                <div style={{width:`${splitRatio}%`,minWidth:0,flexShrink:0,display:'flex',flexDirection:'column',gap:18,overflowY:'auto',height:'100%',paddingBottom:40}}>
              {/* -- 車検セクション（台数集計なし） -- */}
              <div id={SEC_INSP} style={{marginBottom:26,scrollMarginTop:'var(--header-h,60px)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <h3 style={SEC_TITLE('#9a3412')}>🚗 車検</h3>
                  {/* 台数制限バッジ（設定中の日のみ表示） */}
                  {inspLimits[dk]!=null&&(
                    <div style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px',background:'#fee2e2',border:'2px solid #ef4444',borderRadius:6}}>
                      <span style={{fontSize:14}}>🚗</span>
                      <span style={{fontWeight:700,color:'#dc2626',fontSize:11}}>台数制限 最大{inspLimits[dk]}台</span>
                    </div>
                  )}
                  {/* 承認待ち警告アイコン */}
                  {(()=>{
                    const pendingCount=(inspData[dk]||[]).filter(r=>r?.name&&r.pendingApproval).length;
                    if(pendingCount===0)return null;
                    return <div style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px',background:'#fef3c7',border:'2px solid #f59e0b',borderRadius:6}}>
                      <span style={{fontSize:16}}>⚠️</span>
                      <span style={{fontWeight:700,color:'#d97706',fontSize:11}}>承認待ち {pendingCount}件</span>
                    </div>;
                  })()}
                  {/* +/- 枠ボタン：左詰め */}
                  {inspSlots>1&&<button onClick={()=>setInspSlots(s=>Math.max(1,s-1))} title="枠を削除" style={{display:'flex',alignItems:'center',gap:2,padding:'4px 9px',background:'#fef2f2',border:'2px solid #fca5a5',borderRadius:5,cursor:'pointer',fontWeight:700,fontSize:10,color:'#dc2626'}}><MinusSquare size={13}/></button>}

                </div>
                <div style={{overflowX:'auto'}}>
                  <table style={TBL}>
                    <thead><tr style={{background:'linear-gradient(90deg,#9a3412,#ea580c)',color:'white'}}>
                      {['No','氏名','車種','コース','代車','特典','入庫','備考'].map(h=><th key={h} style={{padding:'7px 8px',textAlign:'left',fontSize:12,fontWeight:600,whiteSpace:'nowrap'}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {(()=>{
                        const allRows=(inspData[dk]||[]);
                        // 現在の店舗を上位に表示（本店ログイン→本店上、三田店ログイン→三田店上）
                        const normSt=s=>{if(!s)return'';if(s==='honten'||s==='本店')return'honten';if(s==='sanda'||s==='三田店')return'sanda';return s;};
                        const storeOrder=r=>{const st=normSt(r?.store);if(st===vsId)return 0;if(st)return 1;return 2;};
                        const timeToMin=t=>{if(!t||typeof t!=='string')return 9999;const m=t.match(/(\d+):(\d+)/);return m?parseInt(m[1])*60+parseInt(m[2]):9999;};
                        const sortFn=(a,b)=>{
                          const so=storeOrder(a)-storeOrder(b);
                          if(so!==0)return so;
                          return timeToMin(a.time)-timeToMin(b.time);
                        };
                        // 台数制限取得（設定なければ6）
                        const dayInspLimit=inspLimits[dk]??6;
                        // 予約順(seq)で承認状態をその場で再計算し、これを表示の真実とする。
                        // → 保存フラグのラグ・経路差・ポーリング競合に依存せず、承認待ちバッジを常に正しく表示。
                        //   （繰り上がりで確定した行はバッジが消え、レギュラー3台超過は承認待ちのまま）
                        const recomputed=recomputeInspApproval(allRows.map(r=>(r&&r.name?r:blankInsp())),dayInspLimit);
                        const allMapped=recomputed.map((r,i)=>({...(r&&r.name?r:blankInsp()),_origIdx:i}));
                        // キャンセル除外・名前あり行を予約順(seq)で並べる
                        // （先着6台/7台目の判定は予約順。seq無し旧データは入力順にフォールバック）
                        const validRows=allMapped
                          .filter(r=>!!(r.name)&&r.bookingStatus!=='cancelled')
                          .sort((a,b)=>{const sa=(a.seq!=null)?a.seq:a._origIdx;const sb=(b.seq!=null)?b.seq:b._origIdx;return sa-sb;});

                        // 上段6台：入力順で先着dayInspLimit台を確定（店舗・承認状態に関わらず）
                        // ただし表示順はログイン店舗優先・時刻順（sortFn）で並べる
                        const normalRows=validRows.slice(0,dayInspLimit).slice().sort(sortFn);

                        // 下段7台目以降：入力順で7台目以降を時刻順で並べる
                        const waitingRows=validRows
                          .slice(dayInspLimit)
                          .sort((a,b)=>timeToMin(a.time)-timeToMin(b.time));

                        // 追加行のインデックス
                        const usedIdxs=new Set(validRows.map(r=>r._origIdx));
                        const recycledIdx=allRows.findIndex((r,i)=>!usedIdxs.has(i)&&(!r||!r.name||r.bookingStatus==='cancelled'));
                        const addIdx=recycledIdx>=0?recycledIdx:allRows.length;

                        const rows=[];
                        // ① 上段：先着6台（店舗・承認状態に関わらず入力順固定）
                        normalRows.forEach((row,dispIdx)=>{
                          const origIdx=row._origIdx??dispIdx;
                          const {_origIdx,...cleanRow}=row;
                          rows.push(
                            <InspRow key={`${origIdx}-${dispIdx}`} row={applyArrivedOv(dk,cleanRow,origIdx)} idx={origIdx} dispNo={dispIdx+1} dk={dk} onOpenModal={handleOpenModal} lockInfo={getInspLock(dk,origIdx)} loanerRes={loanerRes} loanerResH={loanerResH} loanerResS={loanerResS} vsId={vsId} onApprove={handleApprove} onToggleArrived={toggleInspArrived} isOverLimit={false} setItems={setItems}/>
                          );
                        });
                        // ② 台数制限超過バナー（7台目以降がある場合）
                        if(waitingRows.length>0){
                          rows.push(
                            <tr key="limit-alert">
                              <td colSpan={8} style={{padding:'7px 14px',background:'linear-gradient(90deg,#fee2e2,#fff1f2)',border:'2px solid #fca5a5',textAlign:'center',fontSize:12,fontWeight:800,color:'#dc2626'}}>
                                ⚠️ 台数制限（{dayInspLimit}台）超過 — 以下は承認待ちになります
                              </td>
                            </tr>
                          );
                        }
                        // ③ 下段：7台目以降（入力順・承認済みでも位置は変わらない）
                        waitingRows.forEach((row,pi)=>{
                          const origIdx=row._origIdx??pi;
                          const {_origIdx,...cleanRow}=row;
                          // 承認済み行はそのまま（承認済みバッジ）、未承認行は承認待ちフラグ付与
                          const displayRow=cleanRow.approved
                            ?{...cleanRow,pendingApproval:false}  // 承認済み：承認待ちバッジ消す
                            :{...cleanRow,pendingApproval:true};  // 未承認：承認待ちバッジ表示
                          rows.push(
                            <InspRow key={`waiting-${origIdx}-${pi}`} row={applyArrivedOv(dk,displayRow,origIdx)} idx={origIdx} dispNo={normalRows.length+pi+1} dk={dk} onOpenModal={handleOpenModal} lockInfo={getInspLock(dk,origIdx)} loanerRes={loanerRes} loanerResH={loanerResH} loanerResS={loanerResS} vsId={vsId} onApprove={handleApprove} onToggleArrived={toggleInspArrived} isOverLimit={false} setItems={setItems}/>
                          );
                        });
                        // ④ 追加行（isNew=trueで開く）。台数制限を掛けた日で上限に達していたら「予約不可」
                        const addDispNo=normalRows.length+waitingRows.length+1;
                        const _limitFull=(inspLimits[dk]!=null&&validRows.length>=dayInspLimit)?dayInspLimit:null;
                        rows.push(
                          <InspRow key={`add-${addIdx}`} row={{...blankInsp()}} idx={addIdx} dispNo={addDispNo} dk={dk} onOpenModal={(type,dk2,idx2,slot)=>handleOpenModal(type,dk2,idx2,slot,true)} lockInfo={getInspLock(dk,addIdx)} loanerRes={loanerRes} loanerResH={loanerResH} loanerResS={loanerResS} vsId={vsId} onApprove={handleApprove} isOverLimit={false} limitFull={_limitFull} setItems={setItems}/>
                        );
                        return rows;
                      })()}
                    </tbody>
                  </table>

                  {schedRestrictions[dk]&&(

                    </button>

                      style={{display:'flex',alignItems:'center',gap:3,padding:'4px 10px',background:'#f8fafc',border:'2px solid #94a3b8',borderRadius:5,cursor:'pointer',fontSize:10,color:'#475569',fontWeight:700}}>

                </div>
              <div id={SEC_SCHED} style={{flex:1,minHeight:0,overflow:'auto'}}>
                <div style={{minWidth:'max-content'}}>
                  <table style={{...TBL,width:'100%',overflow:'visible'}}>
                    <thead><tr>
                      {['時間','氏名','車種','作業','代車・レンタカー','指・見','内容'].map(h=><th key={h} style={{padding:h==='時間'?'7px 4px':'7px 8px',textAlign:'left',fontSize:12,fontWeight:600,whiteSpace:'nowrap',position:'sticky',top:0,zIndex:6,background:'linear-gradient(90deg,#0e7490,#0891b2)',color:'white',...(h==='時間'?{width:50,minWidth:50,maxWidth:50}:{})}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {(()=>{
                      // 前日入庫：この日(dk)に入庫する（車検作業日は別日の）車検を入庫時間ごとに集める
                      const _doBySlot={};
                      Object.keys(inspData||{}).forEach(wdk=>{ if(wdk===dk)return;
                        (inspData[wdk]||[]).forEach((r,ix)=>{ if(!r||!r.name||r.entryDate!==dk||r.bookingStatus==='cancelled')return;
                          if(!(r.store===vsId||(r.store==null&&vsId==='honten')))return;
                          const s=(r.time&&SCHED_SLOTS.includes(getBaseSlot(r.time)))?getBaseSlot(r.time):'未定';
                          (_doBySlot[s]=_doBySlot[s]||[]).push({r,wdk,ix,kind:'insp'});
                        });
                      });
                      // 整備（タイムスケジュール）の事前入庫も同じく（2026-09-19）
                      Object.keys(schedData||{}).forEach(wdk=>{ if(wdk===dk)return;
                        Object.keys(schedData[wdk]||{}).forEach(sk=>{
                          const r=schedData[wdk][sk];
                          if(!r||!r.name||r.entryDate!==dk)return;
                          const s=SCHED_SLOTS.includes(getBaseSlot(sk))?getBaseSlot(sk):'未定';   // 入庫時刻は作業枠の時刻と同じ
                          (_doBySlot[s]=_doBySlot[s]||[]).push({r,wdk,sk,kind:'sched'});
                        });
                      });
                      // 納車：この日(dk)に納車する車検／タイムスケジュール（作業日は同日でも別日でもよい）を納車時間ごとに集める。
                      // deliveryDate は任意項目。行そのものは保存せず、ここで派生表示するだけ。
                      const _dlBySlot={};
                      Object.keys(inspData||{}).forEach(wdk=>{
                        (inspData[wdk]||[]).forEach((r,ix)=>{ if(!r||!r.name||r.deliveryDate!==dk||r.bookingStatus==='cancelled')return;
                          if(!(r.store===vsId||(r.store==null&&vsId==='honten')))return;
                          const s=(r.deliveryTime&&SCHED_SLOTS.includes(getBaseSlot(r.deliveryTime)))?getBaseSlot(r.deliveryTime):'未定';
                          (_dlBySlot[s]=_dlBySlot[s]||[]).push({r,wdk,ix,kind:'insp'});
                        });
                      });
                      Object.keys(schedData||{}).forEach(wdk=>{
                        Object.keys(schedData[wdk]||{}).forEach(sk=>{
                          const r=schedData[wdk][sk];
                          if(!r||!r.name||r.deliveryDate!==dk)return;
                          if(wdk===dk&&getBaseSlot(sk)===getBaseSlot(r.deliveryTime||'未定'))return; // 自分自身の枠と重なる時は出さない
                          const s=(r.deliveryTime&&SCHED_SLOTS.includes(getBaseSlot(r.deliveryTime)))?getBaseSlot(r.deliveryTime):'未定';
                          (_dlBySlot[s]=_dlBySlot[s]||[]).push({r,wdk,sk,kind:'sched'});
                        });
                      });
                      return SCHED_SLOTS.map(slot=>{
                        // baseSlotの全サブキーを取得（既存行 + 空の基本行）
                        const subKeys=getSchedSubKeys(dk,slot);
                        const displayKeys=subKeys.length>0?subKeys:[slot];
                        // 最後の行が空（name未入力）でない場合は+ボタン行を追加
                        const lastKey=subKeys[subKeys.length-1];
                        const lastRow=schedData[dk]?.[lastKey];
                        const lastHasData=lastRow&&lastRow.name;
                        // 次のサブキーを計算
                        const nextSub=subKeys.length; // 0-base→sub=1,2,3...
                        const nextKey=makeSlotKey(slot,nextSub);
                        const isHour=slot.endsWith(':00');
                        // 畳んでいる時：この時間帯に予約（or前日入庫）がある行のみ表示
                        const hasBookingInSlot=subKeys.some(k=>(schedData[dk]?.[k]?.name))||((_doBySlot[slot]||[]).length>0)||((_dlBySlot[slot]||[]).length>0);
                        if(schedCollapsed&&!hasBookingInSlot) return null;
                        // 入庫制限チェック（同時刻追加ボタン用・nullガード付き）
                        const _slotRestr=schedRestrictions[dk];
                        const isSlotRestricted=!!(()=>{
                          try{
                            if(!_slotRestr||!_slotRestr.startTime||!_slotRestr.endTime)return false;
                            const _tm=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
                            return _tm(slot)>=_tm(_slotRestr.startTime)&&_tm(slot)<_tm(_slotRestr.endTime);
                          }catch(e){return false;}
                        })();
                        return(
                          <React.Fragment key={slot}>
                            {displayKeys.map((subKey,si)=>{
                              // 畳んでいる時：予約のない行はスキップ
                              const rowData=getSchedRow(dk,subKey);
                              if(schedCollapsed&&!rowData?.name) return null;
                              return(
                              <SchedRow key={subKey}
                                row={applyArrivedOv(dk,rowData,subKey)}
                                slot={subKey}
                                baseSlot={slot}
                                isFirstSub={si===0}
                                dk={dk}
                                onOpenModal={handleOpenModal}
                                lockInfo={getSchedLock(dk,subKey)}
                                loanerRes={loanerRes}
                                vsId={vsId}
                                restriction={schedRestrictions[dk]}
                                onToggleArrived={toggleSchedArrived}
                                setItems={setItems}/>
                              );
                            })}
                            {/* 前日入庫（この日に入庫する別日の車検）を読み取り専用で表示。クリックで車検を開く */}
                            {(_doBySlot[slot]||[]).map(({r,wdk,ix,sk,kind})=>{
                              const wl=wdk.split('-');
                              const isSch=kind==='sched';
                              const dl=isSch?'':getLoanerLabel(loanerRes,wdk,r.name,`insp-${wdk}-${ix}`);
                              const loaner=r.rentalLabel||dl||(isSch?(r.loaner||''):'');
                              // ★事前入庫の日こそ実際に車が入る日。ここでもチェックできる。
                              //   印は本体（作業日）の予約に付くので、両方の日で同じチェックが見える。
                              const _ak=arrivedKey(wdk,r,isSch?sk:ix);
                              const _arr=arrivedOv[_ak]?!!arrivedOv[_ak].v:!!r.arrived;
                              return(
                                <tr key={'do-'+wdk+'-'+(isSch?sk:ix)} onClick={()=>isSch?handleOpenModal('sched',wdk,null,sk,false):handleOpenModal('insp',wdk,ix,null,false)}
                                  style={{background:'#fff7ed',cursor:'pointer'}} title={isSch?'事前入庫の整備（クリックで予定を編集）':'事前入庫の車検（クリックで車検を編集）'}>
                                  <td onClick={e=>{e.preventDefault();e.stopPropagation();isSch?toggleSchedArrived(wdk,sk):toggleInspArrived(wdk,ix);}}
                                    title={_arr?'入庫済み（クリックで解除）':'入庫したらクリック'}
                                    style={{...TD,width:50,maxWidth:50,cursor:'pointer',textAlign:_arr?'center':undefined,background:_arr?'#fde047':undefined,paddingLeft:6,paddingRight:3,whiteSpace:isSpecialSlot(slot)?'normal':'nowrap',lineHeight:isSpecialSlot(slot)?1.12:undefined,color:'#9a3412',fontWeight:700,fontSize:isSpecialSlot(slot)?10:11,borderLeft:'3px solid #ea580c'}}>
                                    {_arr?<span style={{fontWeight:900,color:'#dc2626',fontSize:15,lineHeight:1}}>✓</span>:(isSpecialSlot(slot)?specialSlotLabel(slot):slot)}</td>
                                  <td style={TD}>
                                    <div style={{lineHeight:1.25}}>
                                      <span style={{fontSize:10,fontWeight:800,color:'white',background:'#ea580c',borderRadius:20,padding:'1px 7px',whiteSpace:'nowrap'}}>🚗 事前入庫</span>
                                      <div style={{fontWeight:800,color:'#7c2d12',marginTop:2}}>{r.name}</div>
                                    </div>
                                  </td>
                                  <td style={TD}><span style={{fontWeight:700,color:'#374151',fontSize:13}}>{r.carType||'—'}</span></td>
                                  <td style={TD}><span style={{color:'#9ca3af'}}>—</span></td>
                                  {/* ★代車のバッジは本体の行と同じ規則にそろえる（2026-09-03 ユーザー指摘）。
                                      限定のときだけ 🔒、限定でなければ何も付けない。
                                      従来はここだけ 🔑 を付けており、🔑 はレンタカーの記号なので紛らわしかった。
                                      （レンタカーはラベル自体に 🔑 が入っているので二重にならない） */}
                                  <td style={TD}>{loaner?<span style={{fontSize:11,color:'#065f46',fontWeight:700}}>
                                    {!r.rentalLabel&&!isSch&&getLoanerLocked(loanerRes,wdk,r.name,`insp-${wdk}-${ix}`)&&<span title="限定：この代車は最適化で動かしません" style={{marginRight:3}}>🔒</span>}
                                    {loaner}</span>:<span style={{color:'#9ca3af'}}>—</span>}</td>
                                  <td style={TD}><span style={{color:'#9ca3af'}}>—</span></td>
                                  <td style={TD}>
                                    <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                                      <span style={{fontSize:10,color:'#9a3412',fontWeight:700,whiteSpace:'nowrap',background:'#ffedd5',border:'1px solid #fdba74',borderRadius:20,padding:'1px 7px'}}>→ {wl[1]}/{wl[2]} {isSch?'予定':'車検'}</span>
                                      {r.note&&<span style={{fontSize:12,color:'#374151'}}>{r.note}</span>}
                                    </div>
                                  </td>
                                </tr>
                              );
                            })}
                            {/* 納車（この日に納車する車検・予定）を読み取り専用で表示。クリックで元の予約を開く */}
                            {(_dlBySlot[slot]||[]).map((d,di)=>{
                              const r=d.r,wl=d.wdk.split('-');
                              // ★納車行も同じ予約の姿。ここでのチェックも元の予約に付く。
                              const _ak=arrivedKey(d.wdk,r,d.kind==='insp'?d.ix:d.sk);
                              const _arr=arrivedOv[_ak]?!!arrivedOv[_ak].v:!!r.arrived;
                              const loaner=d.kind==='insp'
                                ?(r.rentalLabel||getLoanerLabel(loanerRes,d.wdk,r.name,`insp-${d.wdk}-${d.ix}`)||r.loaner||'')
                                :(r.rentalLabel||r.loaner||'');
                              // ★事前入庫（入庫日）がある予約は「入庫日 入庫 → 納車」で示す（2026-09-19 ユーザー要望。作業日を出すと予約日と読まれる）
                              const _el=(r.entryDate&&r.entryDate!==d.wdk)?r.entryDate.split('-'):null;
                              const srcLabel=_el?`${_el[1]}/${_el[2]} 入庫`:`${wl[1]}/${wl[2]} ${d.kind==='insp'?'車検':'予定'}`;
                              return(
                                <tr key={'dl-'+d.kind+'-'+d.wdk+'-'+(d.ix??d.sk)+'-'+di}
                                  onClick={()=>d.kind==='insp'?handleOpenModal('insp',d.wdk,d.ix,null,false):handleOpenModal('sched',d.wdk,null,d.sk,false)}
                                  style={{background:'#ecfdf5',cursor:'pointer'}} title="納車予定（クリックで元の予約を編集）">

// ★サーバーに繋がらない時の告知。ログイン画面でも出す必要があるので最上位に置く
//   （繋がらないとログイン画面のまま止まるため、アプリ内に置くと出ない）。
//   データには一切触れない。表示だけ。
const GasDownBanner=()=>{
  const [since,setSince]=useState(0);
  const [,tick]=useState(0);
  useEffect(()=>{
    const t=setInterval(()=>{
      let d=0; try{d=window.__hubGasDown||0;}catch(e){}
      setSince(prev=>prev===d?prev:d);
      tick(x=>x+1);
    },2000);
    return()=>clearInterval(t);
  },[]);
  if(!since)return null;
  const sec=Math.max(0,Math.floor((Date.now()-since)/1000));
  if(sec<5)return null; // 一瞬の失敗では騒がない
  return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:2147483647,background:'#7f1d1d',color:'white',
      padding:'10px 16px',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',
      boxShadow:'0 2px 12px rgba(0,0,0,.45)',fontFamily:'system-ui,sans-serif'}}>
      <span style={{fontSize:20,lineHeight:1}}>⚠</span>
      <div style={{flex:1,minWidth:240}}>
        <div style={{fontWeight:900,fontSize:15}}>Google のサーバー（保存先）の応答待ちです。データは守られています。（{sec}秒経過）</div>
        <div style={{fontSize:12,opacity:.9,marginTop:2}}>
          このアプリの故障ではなく、Google 側の処理が混み合っています。いま画面に出ていない予約も消えていません。
          応答が戻り次第このメッセージは消え、自動で表示に戻ります。それまでの入力は保存されないのでお待ちください。
        </div>
      </div>
      <button onClick={()=>{try{window.__hubGasDown=0;}catch(e){}location.reload();}}
        style={{background:'white',color:'#7f1d1d',border:'none',borderRadius:7,padding:'7px 14px',
          fontWeight:800,fontSize:13,cursor:'pointer',whiteSpace:'nowrap'}}>再読み込み</button>
    </div>
  );
};
// 表示が一瞬消えて自動で戻した時の知らせ（2026-09-29）。20秒で自然に消える。
const DisplayHealBanner=()=>{
  const [msg,setMsg]=useState('');
  useEffect(()=>{
    const t=setInterval(()=>{
      let h=null; try{h=window.__hubDisplayHeal||null;}catch(e){}
      if(!h){setMsg('');return;}
      if(Date.now()-h.ts>20000){try{window.__hubDisplayHeal=null;}catch(e){}setMsg('');return;}
      setMsg(prev=>prev===h.msg?prev:h.msg);
    },1000);
    return()=>clearInterval(t);
  },[]);
  if(!msg)return null;
  return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:2147483646,background:'#fef3c7',color:'#92400e',
      padding:'9px 16px',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',
      borderBottom:'2px solid #f59e0b',boxShadow:'0 2px 10px rgba(0,0,0,.2)',fontFamily:'system-ui,sans-serif'}}>
      <span style={{fontSize:18,lineHeight:1}}>🔄</span>
      <div style={{flex:1,minWidth:240,fontSize:13,fontWeight:800}}>{msg}</div>
      <button onClick={()=>{try{window.__hubDisplayHeal=null;}catch(e){}}}
        style={{background:'#92400e',color:'white',border:'none',borderRadius:7,padding:'5px 12px',fontWeight:800,fontSize:12,cursor:'pointer'}}>閉じる</button>
    </div>
  );
};
function App(){return <ErrorBoundary><GasDownBanner/><DisplayHealBanner/><AppInner/></ErrorBoundary>;}
