// ============================================
//  車両管理画面（車検証＋点検管理）
// ============================================
const ALERT_DAYS_VEHICLE = 90; // 90日前からアラート

const VEHICLE_CATS=[
  {id:'loaner',  label:'代車',   icon:'🚗', color:'#2563eb'},
  {id:'rental',  label:'レンタカー', icon:'🔑', color:'#7c3aed'},
  {id:'company', label:'社用車', icon:'🏢', color:'#0891b2'},
  {id:'exhibit', label:'展示車', icon:'🏪', color:'#d97706'},
  {id:'trial',   label:'試乗車', icon:'🎯', color:'#059669'},
  {id:'other',   label:'その他', icon:'📋', color:'#6b7280'},
];

const VehicleView=memo(({vehicleData,setVehicleData,loanerH,loanerS,rentalList,onSaveLoanerH,onSaveLoanerS,onSaveRental})=>{
  // ── 車両管理 → 代車管理へ登録（2026-09-23 ユーザー要望）──
  //   車両管理で登録した「代車」「レンタカー」を、代車管理の一覧（車種＋色・ナンバー）に入れる。
  //   ナンバーは「神戸582わ1741パール」のような書き方でも、最後の数字のかたまりを拾う。
  const carNumOf=(v)=>{const m=String(v&&v.num||'').match(/(\d{1,4})(?!.*\d)/);return m?m[1]:String(v&&v.num||'').trim();};
  const carNameOf=(v)=>[String(v&&v.name||'').trim(),String(v&&v.color||'').trim()].filter(Boolean).join('').trim();
  const listOf=(kind)=>kind==='rental'?(rentalList||[]):(kind==='honten'?(loanerH||[]):(loanerS||[]));
  const isRegistered=(v)=>{const n=carNumOf(v);if(!n)return '';
    for(const k of ['rental','honten','sanda'])if(listOf(k).some(c=>String(c.num||'').trim()===n))return k;return '';};
  const registerToLoaner=(v,kind)=>{
    const name=carNameOf(v), num=carNumOf(v);
    if(!name){alert('車種（車両名）を入れてください。');return;}
    const list=listOf(kind).slice();
    const at=list.findIndex(c=>String(c.num||'').trim()===num&&num);
    if(at>=0){
      if(!window.confirm(`同じナンバー（${num}）の車がすでにあります。\n「${list[at].name}」→「${name}」に更新しますか？`))return;
      list[at]={...list[at],name,num,colorHex:v.colorHex||carColorHex(v.color)||list[at].colorHex||''};
    }else{
      if(list.length>=20){alert('代車管理に入れられるのは20台までです。');return;}
      const id=(kind==='rental'?'r':kind==='honten'?'h':'s')+Date.now();
      const hex=v.colorHex||carColorHex(v.color)||'';
      list.push(kind==='rental'?{id,name,num,colorHex:hex}:{id,name,num,store:kind,colorHex:hex});
    }
    (kind==='rental'?onSaveRental:kind==='honten'?onSaveLoanerH:onSaveLoanerS)(list);
    alert(`${kind==='rental'?'レンタカー':(kind==='honten'?'本店の代車':'三田店の代車')}に「${name}（${num}）」を${at>=0?'更新':'登録'}しました。\n代車管理の画面に出ます。`);
  };
  const [filterCat,setFilterCat]=useState('all');
  const [filterAlert,setFilterAlert]=useState(false);
  const [selId,setSelId]=useState(null); // 選択中の車両ID
  const [showAddVehicle,setShowAddVehicle]=useState(false);
  const [addForm,setAddForm]=useState({name:'',num:'',color:'',category:'loaner',regDate:'',inspName:'',inspDays:'',note:''});
  const [showAddInsp,setShowAddInsp]=useState(false);
  const [addInspForm,setAddInspForm]=useState({name:'',days:'',note:''});
  const fileInputRef=useRef(null);
  const list=Array.isArray(vehicleData)?vehicleData:[];

  const today=new Date();today.setHours(0,0,0,0);

  const getInspStatus=(ins)=>{
    if(ins.completed)return{label:'完了',color:'#9ca3af',bg:'#f3f4f6',level:0};
    if(!ins.scheduledDate)return{label:'日付未設定',color:'#9ca3af',bg:'#f3f4f6',level:0};
    const d=new Date(ins.scheduledDate);
    const left=Math.ceil((d-today)/(1000*60*60*24));
    if(left<0)return{label:`${Math.abs(left)}日超過`,color:'#dc2626',bg:'#fee2e2',level:3};
    if(left===0)return{label:'今日！',color:'#dc2626',bg:'#fee2e2',level:3};
    if(left<=7)return{label:`あと${left}日`,color:'#dc2626',bg:'#fee2e2',level:3};
    if(left<=30)return{label:`あと${left}日`,color:'#d97706',bg:'#fef3c7',level:2};
    if(left<=ALERT_DAYS_VEHICLE)return{label:`あと${left}日`,color:'#d97706',bg:'#fffbeb',level:1};
    return{label:`あと${left}日`,color:'#059669',bg:'#f0fdf4',level:0};
  };

  const getVehicleAlert=(v)=>{
    if(!Array.isArray(v.inspections))return 0;
    return Math.max(0,...v.inspections.map(ins=>getInspStatus(ins).level),0);
  };

  const fmtDate=(ds)=>{
    if(!ds)return'—';
    const d=new Date(ds);
    return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  };

  // 車検証ファイル一括読み込み
  const handleFiles=(files)=>{
    const newVehicles=[];
    Array.from(files).forEach(f=>{
      // ファイル名から車両情報を推定（例：「ワゴンR_1234.pdf」→ 名前・ナンバー）
      const base=f.name.replace(/\.[^.]+$/,''); // 拡張子除去
      const parts=base.split(/[_\-\s・]/);
      const name=parts[0]||base;
      const num=parts[1]||'';
      // 登録日は今日
      const regDate=today.toISOString().slice(0,10);
      newVehicles.push({
        id:'v_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        name,num,category:'other',regDate,
        fileName:f.name,fileSize:f.size,
        inspections:[],note:'',
        createdAt:new Date().toISOString(),
      });
    });
    if(newVehicles.length>0){
      setVehicleData(p=>[...(Array.isArray(p)?p:[]),...newVehicles]);
      alert(`${newVehicles.length}台の車両を登録しました。\n車両名・ナンバー・区分・点検情報を確認・編集してください。`);
    }
  };

  // 車両追加
  const addVehicle=()=>{
    if(!addForm.name.trim())return;
    const newV={
      id:'v_'+Date.now(),
      name:addForm.name.trim(),
      num:addForm.num.trim(),
      color:(addForm.color||'').trim(),
      colorHex:addForm.colorHex||carColorHex(addForm.color)||'',
      category:addForm.category,
      regDate:addForm.regDate,
      note:addForm.note.trim(),
      inspections:addForm.inspName.trim()&&addForm.inspDays?[{
        id:'ins_'+Date.now(),
        name:addForm.inspName.trim(),
        scheduledDate:(()=>{
          if(!addForm.regDate)return'';
          const d=new Date(addForm.regDate);
          d.setDate(d.getDate()+Number(addForm.inspDays));
          return d.toISOString().slice(0,10);
        })(),
        completed:false,completedAt:null,note:'',
      }]:[],
      createdAt:new Date().toISOString(),
    };
    setVehicleData(p=>[...(Array.isArray(p)?p:[]),newV]);
    setAddForm({name:'',num:'',category:'loaner',regDate:'',inspName:'',inspDays:'',note:''});
    setShowAddVehicle(false);
    setSelId(newV.id);
  };

  // 点検追加
  const addInspection=(vId)=>{
    if(!addInspForm.name.trim()||!addInspForm.days)return;
    const vehicle=list.find(v=>v.id===vId);
    if(!vehicle)return;
    const ins={
      id:'ins_'+Date.now(),
      name:addInspForm.name.trim(),
      scheduledDate:(()=>{
        if(!vehicle.regDate)return addInspForm.customDate||'';
        const d=new Date(vehicle.regDate);
        d.setDate(d.getDate()+Number(addInspForm.days));
        return d.toISOString().slice(0,10);
      })(),
      completed:false,completedAt:null,
      note:addInspForm.note.trim(),
    };
    setVehicleData(p=>p.map(v=>v.id===vId?{...v,inspections:[...(v.inspections||[]),ins]}:v));
    setAddInspForm({name:'',days:'',note:''});
    setShowAddInsp(false);
  };

  // 点検完了トグル
  const toggleInsp=(vId,insId)=>{
    setVehicleData(p=>p.map(v=>v.id!==vId?v:{
      ...v,inspections:(v.inspections||[]).map(ins=>ins.id!==insId?ins:{
        ...ins,completed:!ins.completed,completedAt:!ins.completed?new Date().toISOString():null
      })
    }));
  };

  // 点検削除
  const deleteInsp=(vId,insId)=>{
    if(!confirm('この点検記録を削除しますか？'))return;
    setVehicleData(p=>p.map(v=>v.id!==vId?v:{...v,inspections:(v.inspections||[]).filter(ins=>ins.id!==insId)}));
  };

  // 車両削除
  const deleteVehicle=(vId)=>{
    if(!confirm('この車両の全データを削除しますか？'))return;
    setVehicleData(p=>p.filter(v=>v.id!==vId));
    if(selId===vId)setSelId(null);
  };

  // 車両情報編集
  const [editVehicle,setEditVehicle]=useState(null);
  const saveVehicleEdit=(vId,updates)=>{
    setVehicleData(p=>p.map(v=>v.id===vId?{...v,...updates}:v));
    setEditVehicle(null);
  };

  const filtered=list
    .filter(v=>filterCat==='all'||v.category===filterCat)
    .filter(v=>!filterAlert||getVehicleAlert(v)>0)
    .sort((a,b)=>getVehicleAlert(b)-getVehicleAlert(a));

  const selVehicle=list.find(v=>v.id===selId);
  const alertTotal=list.filter(v=>getVehicleAlert(v)>0).length;

  const INP_S={width:'100%',padding:'7px 10px',border:'2px solid #e5e7eb',borderRadius:7,fontSize:12,outline:'none',fontFamily:'inherit',boxSizing:'border-box'};

  return(
    <div style={{background:'white',borderRadius:13,boxShadow:'0 10px 40px rgba(0,0,0,.18)',borderTop:'4px solid #c2410c',display:'flex',flexDirection:'column',position:'fixed',top:'var(--header-h,90px)',left:'8px',right:'8px',bottom:'8px',overflowY:'auto',zIndex:10,borderRadius:13}}>

      {/* ヘッダー */}
      <div style={{padding:'12px 18px',borderBottom:'2px solid #e5e7eb',display:'flex',alignItems:'center',gap:10,flexShrink:0,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:20}}>🔔</span>
          <span style={{fontWeight:900,fontSize:16,color:'white'}}>車両管理</span>
          {alertTotal>0&&<span style={{padding:'2px 10px',borderRadius:20,background:'#fee2e2',color:'#dc2626',fontSize:11,fontWeight:700}}>⚠️ {alertTotal}台アラート</span>}
          <span style={{fontSize:11,color:'#9ca3af'}}>{list.length}台登録</span>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',marginLeft:'auto',flexWrap:'wrap'}}>
          {/* フォルダ一括読み込み */}
          <input ref={fileInputRef} type="file" accept=".pdf,image/*" multiple style={{display:'none'}} onChange={e=>handleFiles(e.target.files)}/>
          <button onClick={()=>fileInputRef.current?.click()}
            style={{display:'flex',alignItems:'center',gap:4,padding:'6px 12px',background:'linear-gradient(135deg,#0891b2,#0e7490)',color:'white',border:'none',borderRadius:7,fontWeight:700,fontSize:11,cursor:'pointer'}}>
            📂 車検証ファイル読込
          </button>
          <button onClick={()=>{setShowAddVehicle(p=>!p);setSelId(null);}}
            style={{display:'flex',alignItems:'center',gap:4,padding:'6px 12px',background:'#f0fdf4',border:'2px solid #86efac',borderRadius:7,fontWeight:700,fontSize:11,color:'#065f46',cursor:'pointer'}}>
            ＋ 手動追加
          </button>
        </div>
      </div>

      {/* フィルター */}
      <div style={{padding:'8px 18px',borderBottom:'1px solid #f1f5f9',display:'flex',gap:5,flexWrap:'wrap',flexShrink:0,background:'#fafafa',alignItems:'center'}}>
        <button onClick={()=>setFilterCat('all')} style={{padding:'3px 10px',borderRadius:20,border:`1.5px solid ${filterCat==='all'?'#c2410c':'#e5e7eb'}`,background:filterCat==='all'?'#eef2ff':'white',color:filterCat==='all'?'#c2410c':'#6b7280',fontSize:11,fontWeight:filterCat==='all'?700:400,cursor:'pointer'}}>全て</button>
        {VEHICLE_CATS.map(cat=>{
          const cnt=list.filter(v=>v.category===cat.id).length;
          if(cnt===0)return null;
          return <button key={cat.id} onClick={()=>setFilterCat(cat.id)} style={{padding:'3px 10px',borderRadius:20,border:`1.5px solid ${filterCat===cat.id?cat.color:'#e5e7eb'}`,background:filterCat===cat.id?cat.color+'22':'white',color:filterCat===cat.id?cat.color:'#6b7280',fontSize:11,fontWeight:filterCat===cat.id?700:400,cursor:'pointer'}}>{cat.icon}{cat.label}({cnt})</button>;
        })}
        <button onClick={()=>setFilterAlert(p=>!p)} style={{marginLeft:'auto',padding:'3px 10px',borderRadius:20,border:`1.5px solid ${filterAlert?'#dc2626':'#e5e7eb'}`,background:filterAlert?'#fee2e2':'white',color:filterAlert?'#dc2626':'#6b7280',fontSize:11,fontWeight:filterAlert?700:400,cursor:'pointer'}}>⚠️ アラートのみ</button>
      </div>

      <div style={{flex:1,display:'flex',overflow:'hidden',minHeight:0}}>
        {/* 左：車両リスト */}
        <div style={{width:280,flexShrink:0,borderRight:'2px solid #e5e7eb',overflowY:'auto',display:'flex',flexDirection:'column'}}>

          {/* 手動追加フォーム */}
          {showAddVehicle&&(

                        <div style={{display:'flex',gap:6}}>
                          <button onClick={()=>saveVehicleEdit(selVehicle.id,{name:editVehicle.name,num:editVehicle.num,color:editVehicle.color||'',colorHex:editVehicle.colorHex||carColorHex(editVehicle.color)||'',category:editVehicle.category,regDate:editVehicle.regDate,note:editVehicle.note})} style={{flex:1,padding:'7px',background:'#c2410c',color:'white',border:'none',borderRadius:7,fontWeight:700,fontSize:12,cursor:'pointer'}}>✓ 保存</button>

                      </div>
                    ):(
                      <>

                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <input type="number" value={addInspForm.days} onChange={e=>setAddInspForm(p=>({...p,days:e.target.value}))} placeholder={selVehicle.regDate?`登録日から何日後？（登録日：${fmtDate(selVehicle.regDate)}）`:'登録日から何日後？'} style={{...INP_S,flex:1}} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>

                      {selVehicle.regDate&&addInspForm.days&&(
                        <div style={{fontSize:11,color:'#065f46',background:'white',padding:'4px 8px',borderRadius:5,border:'1px solid #a7f3d0'}}>

                        </div>
                      )}
                      <input value={addInspForm.note} onChange={e=>setAddInspForm(p=>({...p,note:e.target.value}))} placeholder="メモ（任意）" style={INP_S} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
                      <div style={{display:'flex',gap:5}}>
                        <button onClick={()=>addInspection(selVehicle.id)} disabled={!addInspForm.name.trim()||!addInspForm.days} style={{flex:1,padding:'7px',background:addInspForm.name.trim()&&addInspForm.days?'#059669':'#e5e7eb',color:addInspForm.name.trim()&&addInspForm.days?'white':'#9ca3af',border:'none',borderRadius:7,fontWeight:700,fontSize:12,cursor:addInspForm.name.trim()&&addInspForm.days?'pointer':'default'}}>追加</button>
                        <button onClick={()=>setShowAddInsp(false)} style={{padding:'7px 12px',background:'#f3f4f6',border:'none',borderRadius:7,fontSize:11,cursor:'pointer'}}>×</button>
                      </div>
                    </div>
                  </div>
                )}

                {(!selVehicle.inspections||selVehicle.inspections.length===0)&&(
                  <div style={{padding:'16px',textAlign:'center',color:'#9ca3af',fontSize:12,background:'#f9fafb',borderRadius:8,border:'2px dashed #e5e7eb'}}>
                    「＋ 追加」で点検スケジュールを登録してください<br/>
                    <span style={{fontSize:10}}>（例：1ヶ月点検・6ヶ月点検・車検・保険更新 など）</span>
                  </div>
                )}

                {(selVehicle.inspections||[]).map(ins=>{
                  const st=getInspStatus(ins);
                  return(
                    <div key={ins.id} style={{padding:'10px 12px',marginBottom:8,background:ins.completed?'#f8fafc':st.bg,border:`2px solid ${ins.completed?'#e5e7eb':st.level>=3?'#fca5a5':st.level>=1?'#fde68a':'#e5e7eb'}`,borderRadius:9,display:'flex',alignItems:'center',gap:10}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:13,color:ins.completed?'#9ca3af':'#1e293b',textDecoration:ins.completed?'line-through':''}}>{ins.name}</div>
                        <div style={{fontSize:11,color:'#6b7280',marginTop:2,display:'flex',gap:8,flexWrap:'wrap'}}>
                          {ins.scheduledDate&&<span>予定日：{fmtDate(ins.scheduledDate)}</span>}
                          {ins.completed&&ins.completedAt&&<span style={{color:'#059669'}}>✓ {fmtDate(ins.completedAt)}完了</span>}
                          {ins.note&&<span style={{color:'#c2410c'}}>📝 {ins.note}</span>}
                        </div>
                      </div>
                      <span style={{padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:700,background:st.bg,color:st.color,whiteSpace:'nowrap',border:`1px solid ${st.color}44`}}>{st.label}</span>
                      <button onClick={()=>toggleInsp(selVehicle.id,ins.id)}
                        style={{padding:'4px 10px',borderRadius:7,border:`1.5px solid ${ins.completed?'#6b7280':'#10b981'}`,background:ins.completed?'#f3f4f6':'#f0fdf4',color:ins.completed?'#6b7280':'#065f46',fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
                        {ins.completed?'戻す':'✓ 完了'}
                      </button>
                      <button onClick={()=>deleteInsp(selVehicle.id,ins.id)} style={{width:26,height:26,borderRadius:5,border:'1px solid #fecaca',background:'#fef2f2',color:'#dc2626',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>×</button>
                    </div>
                  );
                })}
              </div>
            );
          })()}
        </div>
      </div>

      {/* アラートバナー（90日以内の点検一覧） */}
      {(()=>{
        const alerts=list.flatMap(v=>(v.inspections||[])
          .filter(ins=>!ins.completed&&getInspStatus(ins).level>0)
          .map(ins=>({...ins,vehicleName:v.name,vehicleNum:v.num,vehicleId:v.id,st:getInspStatus(ins)}))
        ).sort((a,b)=>new Date(a.scheduledDate)-new Date(b.scheduledDate));
        if(alerts.length===0)return null;
        return(
          <div style={{flexShrink:0,padding:'8px 16px',borderTop:'2px solid #fecaca',background:'#fff5f5',display:'flex',gap:8,overflowX:'auto',alignItems:'center'}}>
            <span style={{fontSize:11,fontWeight:800,color:'#dc2626',flexShrink:0}}>⚠️ アラート</span>
            {alerts.map((a,i)=>(
              <div key={i} onClick={()=>setSelId(a.vehicleId)}
                style={{display:'flex',gap:4,alignItems:'center',padding:'3px 10px',background:a.st.bg,border:`1.5px solid ${a.st.color}`,borderRadius:20,cursor:'pointer',flexShrink:0,transition:'opacity .15s'}}
                onMouseEnter={e=>e.currentTarget.style.opacity='.75'}
                onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
                <span style={{fontSize:11,fontWeight:700,color:a.st.color}}>{a.vehicleName}</span>
                <span style={{fontSize:10,color:'#6b7280'}}>{a.name}</span>
                <span style={{fontSize:10,fontWeight:700,color:a.st.color}}>{a.st.label}</span>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
});

const LoanerSettingsModal = memo(({isOpen, onClose, listH, listS, onSaveH, onSaveS, rentalList, onSaveRental}) => {
  const [tab, setTab] = useState('honten'); // 'honten' | 'sanda' | 'rental'
  const [items, setItems] = useState([]);
  const [editIdx, setEditIdx] = useState(null);
  const [editName, setEditName] = useState('');
  const [editNum,  setEditNum]  = useState('');
  const [addName,  setAddName]  = useState('');
  const [addNum,   setAddNum]   = useState('');

  // タブ変更時にリストを同期
  useEffect(() => {

※ 削除すると予約データのリンクが切れます`)) return;

                <button onClick={addCar} disabled={!addName.trim()}
                  style={{padding:'7px 14px',background:addName.trim()?'#059669':'#e5e7eb',color:addName.trim()?'white':'#9ca3af',border:'none',borderRadius:7,fontWeight:700,fontSize:12,cursor:addName.trim()?'pointer':'default',flexShrink:0}}>

            style={{padding:'10px 16px',background:'#f3f4f6',border:'none',borderRadius:9,fontWeight:600,fontSize:12,cursor:'pointer'}}>

});

// ============================================
//  代車管理グリッド（閲覧専用 + モーダル編集）
// ============================================
const LoanerGrid=memo(({loanerRes,loanerMonth,setLoanerMonth,onDeleteRes,onReplaceRes,onUndo,selDate,onBack,onPickLoaner,pickMode,locks,currentUser,onLockCar,onUnlockCar,savedModalData,inspData,schedData,onOpenBooking,pinnedRes,setPinnedRes,hoverRes,setHoverRes,storeLoaners,storeInfo,rentalCars,rentalRes,onAddRentalRes,onDeleteRentalRes,onReplaceRentalRes,onPickRental,onOpenSettings,tireData,locationData,onOpenTireEdit,onOpenLocationEdit,onApplyOptimize,pendingDeleteBk='',justAddedIds=[]})=>{
  const LOANERS_LOCAL=storeLoaners||LOANERS;
  const RENTAL_LOCAL=rentalCars||DEFAULT_RENTAL_CARS;
  // 表示色：期間の重なる予約どうしは必ず違う色（同じお客様は同じ色）。描画のたびに全予約から決める
  const _resColors=useMemo(()=>assignResColors(loanerRes),[loanerRes]);
  const _rentalColors=useMemo(()=>assignResColors(rentalRes||{}),[rentalRes]);
  const rentalResLocal=rentalRes||{};
  const [editModal,setEditModal]=useState(null);
  const [editForm,setEditForm]=useState({user:'',startDate:'',endDate:''});
  const [rentalEditModal,setRentalEditModal]=useState(null);
  const [rentalEditForm,setRentalEditForm]=useState({user:'',startDate:'',endDate:''});
  const [optResult,setOptResult]=useState(null); // ⑤最適化のプレビュー
  // ⑤最適化の基準日（この日以降を並べ替え・これより前は対象外）。既定は今日。カレンダーの日付ヘッダークリックで変更。
  const [optBaseDate,setOptBaseDate]=useState(()=>{const n=new Date();return{year:n.getFullYear(),month:n.getMonth(),day:n.getDate()};});

  // ⑤ 代車最適化：歯抜けを減らすよう非限定の予約を車ごとに詰め直す（限定は現状維持）。
  // 貪欲法：開始日順に、重複しない車のうち「直前の返却が今回の貸出に最も近い車」へ割り当て（＝すき間最小・車を集約）。
  const computeOptimize=()=>{
    const cars=LOANERS_LOCAL||[];
    const all=[];
    Object.keys(loanerRes||{}).forEach(cid=>{
      const day=loanerRes[cid]||{};
      Object.keys(day).forEach(k=>{const r=day[k]; if(r&&r.user) all.push({...r,_curCar:String(cid),_key:k});});
    });
    const toN=(y,m,d)=>toNum(y,m,d);
    // 基準日（既定は今日／カレンダーの日付クリックで変更）。基準日より前は対象外、
    // 基準日をまたぐ貸出中・限定は動かさず枠だけ占有、基準日以降の貸出だけ並べ替える。
    const todayD=toN(optBaseDate.year,optBaseDate.month,optBaseDate.day);
    const past=[],fixed=[],movable=[];
    all.forEach(r=>{
      const s=toN(r.fy,r.fm,r.fd), e=toN(r.ty,r.tm,r.td);
      if(e<todayD) past.push(r);                       // 返却済み → 触らない・考慮しない
      else if(r.locked||s<todayD) fixed.push(r);       // 貸出中 or 限定 → 動かさない（枠は占有）
      else movable.push(r);                            // これから貸す → 最適化対象
    });
    const carById={}; cars.forEach(c=>carById[String(c.id)]=c);
    const carInt={}; cars.forEach(c=>carInt[String(c.id)]=[]);
    fixed.forEach(r=>{const cid=r._curCar; if(carInt[cid]) carInt[cid].push({s:toN(r.fy,r.fm,r.fd),e:toN(r.ty,r.tm,r.td)});});
    movable.sort((a,b)=>toN(a.fy,a.fm,a.fd)-toN(b.fy,b.fm,b.fd));
    const assign={};
    movable.forEach(r=>{
      const s=toN(r.fy,r.fm,r.fd), e=toN(r.ty,r.tm,r.td);
      let best=null,bestScore=-Infinity;
      for(const c of cars){
        const cid=String(c.id); const ints=carInt[cid]||[];
        if(ints.some(iv=> s<=iv.e && iv.s<=e)) continue; // 重複する車は不可
        const lastEnd=ints.reduce((mx,iv)=> iv.e<s?Math.max(mx,iv.e):mx, -Infinity); // 直前の返却
        if(lastEnd>bestScore){best=cid;bestScore=lastEnd;} // 直前返却が最も近い＝すき間最小。全空きは車順で先頭
      }
      if(best==null) best=r._curCar; // 万一入らなければ現状維持
      assign[r.id]=best;
      (carInt[best]=carInt[best]||[]).push({s,e});
    });
    const newLR={}; Object.keys(loanerRes||{}).forEach(cid=>{newLR[String(cid)]={};}); cars.forEach(c=>{if(!newLR[String(c.id)])newLR[String(c.id)]={};});
    const moves=[];
    // ★キーは衝突しない「年-月-日」を使う（"日"だけだと別の月で同じ日に始まる予約を
    //   同じ車にまとめた時にキーが衝突して予約が消える。同じ車に同じ開始日=重複なので一意）。
    const rkey=(r)=>`${r.fy}-${r.fm}-${r.fd}`;
    // ★同じ車・同じ開始日は本来ありえない（＝重複予約）が、過去データや別経路の書き込みで
    //   ぶつかることがある。素直に代入すると片方が無言で消えるので、埋まっていたら横へ逃がす。
    const rput=(cid,r,res)=>{
      const days=(newLR[cid]=newLR[cid]||{});
      let k=rkey(r);
      if(days[k]&&days[k].id!==res.id)k=`${k}_${res.id}`;
      days[k]=res;
    };
    // 過去・貸出中・限定はそのままの車に残す（触らない）
    past.forEach(r=>{const {_curCar,_key,...res}=r; rput(_curCar,r,res);});
    fixed.forEach(r=>{const {_curCar,_key,...res}=r; rput(_curCar,r,res);});
    movable.forEach(r=>{
      const cid=assign[r.id]; const car=carById[cid]; const {_curCar,_key,...res}=r;
      rput(cid,r,{...res,carName:car?car.name:res.carName,carNum:car?car.num:res.carNum});
      if(String(_curCar)!==String(cid)){
        const oldCar=carById[_curCar];
        moves.push({user:r.user,fromCarId:_curCar,toCarId:cid,fromName:(oldCar&&oldCar.name)||res.carName||'?',toName:(car&&car.name)||'?',period:`${r.fm+1}/${r.fd}〜${r.tm+1}/${r.td}`,bookingKey:r.bookingKey});
      }
    });
    return {moves,newLoanerRes:newLR,movableCount:movable.length,fixedCount:fixed.length,pastCount:past.length};
  };
  // pinnedRes/hoverResは親から受け取る（グリッドの再レンダリングを防いでscrollLeftを保持）
  // pickMode用ドラッグ状態
  const [drag,setDrag]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [pickUser,setPickUser]=useState('');
  const isDragging=useRef(false);
  const gridRef=useRef(null);
  const scrollLock=useRef(false);
  const rentalScrollRef=useRef(null); // 自動スクロール済みフラグ

  // 表示範囲：selDateから-2日〜+31日（月をまたぐ）
  const dateRange=useMemo(()=>{
    // loanerMonthの月を中心に前月末〜翌月頭まで表示（長期レンタル対応）
    const baseMonth=loanerMonth||new Date();
    const y=baseMonth.getFullYear();
    const m=baseMonth.getMonth();
    // 前月15日〜翌々月15日の約90日間を表示
    const startDate=new Date(y,m-1,15);
    const endDate=new Date(y,m+2,15);
    const range=[];
    const current=new Date(startDate);
    while(current<=endDate){
      range.push({
        year:current.getFullYear(),
        month:current.getMonth(),
        day:current.getDate(),
        date:new Date(current)
      });
      current.setDate(current.getDate()+1);
    }
    return range;
  },[loanerMonth]);

  const DOW=['日','月','火','水','木','金','土'];
  const hi=selDate?selDate.getDate():null;

  // 選択日が変わったらスクロールロックをリセット
  useEffect(()=>{
    scrollLock.current=false;
  },[selDate]);

  // 開いた時のスクロール位置（初回のみ）。
  //   代車表・レンタカー表とも、基準日（予約から開いたときはその日／通常は本日）が
  //   左から4列目に来るようにする＝直前3日分も一緒に見える（2026-07-30 ユーザー要望）。
  //   ※日付セルは44px幅。先頭の車名列(100px/120px)は position:sticky なので、
  //     scrollLeft=idx*44 でその日付が車名列のすぐ右＝1列目に来る。3列ぶん戻せば4列目。
  useEffect(()=>{
    if(scrollLock.current)return;
    const base=selDate||new Date();
    // DOMレンダリング後に確実に実行（setTimeout）
    const timer=setTimeout(()=>{
      if(!gridRef.current)return;
      const cellWidth=44,leadCols=3;
      const targetIndex=dateRange.findIndex(d=>
        d.year===base.getFullYear()&&
        d.month===base.getMonth()&&
        d.day===base.getDate()
      );
      if(targetIndex===-1)return;
      const left=Math.max(0,(targetIndex-leadCols)*cellWidth);
      gridRef.current.scrollLeft=left;
      if(rentalScrollRef.current)rentalScrollRef.current.scrollLeft=left;
      scrollLock.current=true;
    },100);
    return()=>clearTimeout(timer);
  },[selDate,dateRange]);

  const getRes=(cid,y,m,d)=>{const num=toNum(y,m,d);return Object.values(loanerRes[cid]||{}).find(r=>num>=toNum(r.fy,r.fm,r.fd)&&num<=toNum(r.ty,r.tm,r.td));};
  // ★同じ日を覆う予約を「全部」返す。表示は1台1日1件しか描けないので、2件目以降は
  //   画面から消えてしまう。二重取りが起きても気づけないため、件数を数えて警告に使う
  //   （2026-08-28にユーザーが報告：8/29のｆｆｄｂｚが代車管理に出てこない。
  //    アルトに木村さん(車検)とｆｆｄｂｚ(一般)の2件が同じ日に入っていた）。
  const getResAll=(cid,y,m,d)=>{const num=toNum(y,m,d);return Object.values(loanerRes[cid]||{}).filter(r=>r&&num>=toNum(r.fy,r.fm,r.fd)&&num<=toNum(r.ty,r.tm,r.td));};
  // 表示中の期間で二重取りになっている車と日を集める
  const dupWarn=useMemo(()=>{
    const out=[];
    (LOANERS_LOCAL||[]).forEach(car=>{
      (dateRange||[]).forEach(d=>{
        const rs=getResAll(car.id,d.year,d.month,d.day);
        if(rs.length>1)out.push({car:`${car.name}${car.num?` (${car.num})`:''}`,
          date:`${d.month+1}/${d.day}`,users:rs.map(r=>r.user||'(名前なし)')});
      });
    });
    return out;
  },[loanerRes,dateRange,LOANERS_LOCAL]);
  const hasConflict=(cid,sy,sm,sd,ey,em,ed)=>{
    const start=new Date(sy,sm,sd);
    const end=new Date(ey,em,ed);
    const current=new Date(start);
    while(current<=end){
      if(getRes(cid,current.getFullYear(),current.getMonth(),current.getDate()))return true;
      current.setDate(current.getDate()+1);
    }
    return false;
  };

  // -- pickModeのドラッグ操作 --
  const handleMD=(cid,dateObj,e)=>{
    if(!pickMode)return;
    if(getRes(cid,dateObj.year,dateObj.month,dateObj.day))return;
    isDragging.current=true;
    setDrag({carId:cid,start:dateObj,end:dateObj});
    setConfirm(null);setPickUser('');
  };
  const handleME=(cid,dateObj)=>{
    if(!pickMode||!isDragging.current||!drag||drag.carId!==cid)return;
    if(getRes(cid,dateObj.year,dateObj.month,dateObj.day))return;
    // startより後の日付のみ
    if(new Date(dateObj.year,dateObj.month,dateObj.day)>=new Date(drag.start.year,drag.start.month,drag.start.day)){
      setDrag(p=>({...p,end:dateObj}));
    }
  };
  const handleMU=()=>{
    if(!pickMode||!isDragging.current||!drag)return;
    isDragging.current=false;
    const {carId,start,end}=drag;
    if(hasConflict(carId,start.year,start.month,start.day,end.year,end.month,end.day)){
      // 従来は無言で何も起きず、選べない理由が分からなかった（2026-08-28）
      setDrag(null);alert('その期間はこの代車が既に使われています。\n別の車か別の期間を選んでください。');return;
    }
    setConfirm({carId,start,end});
    setDrag(null);
    setPickUser(savedModalData?.name||'');
  };

  // 確定
  const handlePickConfirm=()=>{
    if(!confirm)return;
    const {carId,start,end}=confirm;
    // 返却日の「年・月」も渡す（Kyoshi承認のBLOCK-C変更・2026-08-23）。
    // 従来は end.day しか渡しておらず、受け側が返却の年月に開始の年月を流用していたため、
    // 月をまたぐ貸出（例 7/29〜8/2）が「7/29〜7/2」＝返却が開始より前の壊れた期間になっていた。
    onPickLoaner(carId,start.day,end.day,pickUser||'（未入力）',start.year,start.month,end.year,end.month);
    setConfirm(null);setPickUser('');
  };

  // 閲覧モード：editModalで編集
  const openEdit=(car,res)=>{
    if(res._rental){
      // レンタカー編集
      setRentalEditForm({
        user:res.user,
        startDate:`${res.fy}-${String(res.fm+1).padStart(2,'0')}-${String(res.fd).padStart(2,'0')}`,
        endDate:`${res.ty}-${String(res.tm+1).padStart(2,'0')}-${String(res.td).padStart(2,'0')}`
      });
      setRentalEditModal({carId:car.id,resId:res.id,carName:car.name,color:res.color});
      return;
    }
    setEditForm({
      user:res.user,
      startDate:`${res.fy}-${String(res.fm+1).padStart(2,'0')}-${String(res.fd).padStart(2,'0')}`,
      endDate:`${res.ty}-${String(res.tm+1).padStart(2,'0')}-${String(res.td).padStart(2,'0')}`
    });
    setEditModal({carId:car.id,resId:res.id,carName:car.name});
  };
  const getState=(cid,dateObj)=>{
    if(!dateObj)return null;
    const {year:y,month:m,day:d}=dateObj;
    if(drag&&drag.carId===cid){
      const dragStart=new Date(drag.start.year,drag.start.month,drag.start.day);
      const dragEnd=new Date(drag.end.year,drag.end.month,drag.end.day);
      const current=new Date(y,m,d);
      if(current>=dragStart&&current<=dragEnd)return'drag';
    }
    if(confirm&&confirm.carId===cid){
      const confStart=new Date(confirm.start.year,confirm.start.month,confirm.start.day);
      const confEnd=new Date(confirm.end.year,confirm.end.month,confirm.end.day);
      const current=new Date(y,m,d);
      if(current>=confStart&&current<=confEnd)return'confirm';
    }
    return getRes(cid,y,m,d)||null;
  };

  // 予約済みセルクリックで該当予約を開く
  const handleResClick=(res)=>{
    if(pickMode)return;
    const dk=dateKey(res.fy,res.fm,res.fd);
    const inspRows=inspData[dk]||[];
    for(let i=0;i<inspRows.length;i++){
      if(inspRows[i]&&(inspRows[i].loanerId===res.carId||inspRows[i].name===res.user)){onOpenBooking('insp',dk,i,null,inspRows[i]);return;}
    }
    const schedDay=schedData[dk]||{};
    for(const slot of TIME_SLOTS){
      if(schedDay[slot]&&(schedDay[slot].loanerId===res.carId||schedDay[slot].name===res.user)){onOpenBooking('sched',dk,null,slot,schedDay[slot]);return;}
    }
  };

  // 編集画面に出す「既存予約」は、編集中の期間の前後60日と今日以降のものだけ（2026-09-28）。
  //   この車の何年ぶんもの履歴を全部並べると、編集欄と更新ボタンが画面の外に出てしまう。
  const nearRes=(all,form,resId)=>{
    const ymd=v=>{const p=String(v||'').split('-').map(Number);return p.length===3?new Date(p[0],p[1]-1,p[2]).getTime():null;};
    const f=ymd(form.startDate), t=ymd(form.endDate)||f;
    const today=new Date();today.setHours(0,0,0,0);
    const DAY=86400000;
    const list=Object.values(all||{}).filter(r=>r&&r.id!==resId).map(r=>({r,
      s:new Date(r.fy,r.fm,r.fd).getTime(), e:new Date(r.ty,r.tm,r.td).getTime()}));
    const keep=list.filter(x=>(f!=null&&x.e>=f-60*DAY&&x.s<=t+60*DAY)||x.e>=today.getTime());
    keep.sort((a,b)=>a.s-b.s);
    return {rows:keep.map(x=>x.r), hidden:list.length-keep.length};
  };

  // 編集保存：自分以外の予約と重複チェック
  const saveEdit=()=>{
    if(!editForm.user.trim()||!editForm.startDate||!editForm.endDate)return;
    const [fy,fm,fd]=editForm.startDate.split('-').map(Number);
    const [ty,tm,td]=editForm.endDate.split('-').map(Number);
    if(toNum(fy,fm-1,fd)>toNum(ty,tm-1,td)){alert('返却日は貸出日以降にしてください');return;}
    // 自分以外の予約と重複していないかチェック
    const others=Object.values(loanerRes[editModal.carId]||{}).filter(r=>r.id!==editModal.resId);
    const conflict=others.some(r=>{
      const rs=toNum(r.fy,r.fm,r.fd),re=toNum(r.ty,r.tm,r.td);
      const ns=toNum(fy,fm-1,fd),ne=toNum(ty,tm-1,td);
      return ns<=re&&ne>=rs;
    });
    if(conflict){alert('その期間は他の予約と重複しています');return;}
    // 1回のatomic更新で既存レコードを差し替える（delete+addの競合を防ぐ。レンタカー側と同じ作法）。
    // ★従来は delete→add で作り直していたため bookingKey / carName / carNum / locked が消え、
    //   期間を編集しただけで予約との紐付けが切れていた（代車管理には出るが予約から辿れない）。
    const prev=Object.values(loanerRes[editModal.carId]||{}).find(r=>r.id===editModal.resId);
    onReplaceRes(editModal.carId,editModal.resId,{fy,fm:fm-1,fd,ty,tm:tm-1,td,user:editForm.user,color:prev?.color||RES_COLORS[0]});
    setEditModal(null);
  };

  // レンタカー編集保存
  const saveEditRental=()=>{
    if(!rentalEditForm.user.trim()||!rentalEditForm.startDate||!rentalEditForm.endDate)return;
    const [fy,fm,fd]=rentalEditForm.startDate.split('-').map(Number);
    const [ty,tm,td]=rentalEditForm.endDate.split('-').map(Number);
    if(toNum(fy,fm-1,fd)>toNum(ty,tm-1,td)){alert('返却日は貸出日以降にしてください');return;}
    // 重複チェック
    const rentalResLocal=rentalRes||{};
    const others=Object.values(rentalResLocal[rentalEditModal.carId]||{}).filter(r=>r.id!==rentalEditModal.resId);
    const conflict=others.some(r=>{
      const rs=toNum(r.fy,r.fm,r.fd),re=toNum(r.ty,r.tm,r.td);
      const ns=toNum(fy,fm-1,fd),ne=toNum(ty,tm-1,td);
      return ns<=re&&ne>=rs;
    });
    if(conflict){alert('その期間は他の予約と重複しています');return;}
    // 1回のatomic更新で既存レコードを差し替え（delete+addの競合を防ぐ）
    onReplaceRentalRes(rentalEditModal.carId,rentalEditModal.resId,{
      fy,fm:fm-1,fd,ty,tm:tm-1,td,
      user:rentalEditForm.user,
      color:rentalEditModal.color||RES_COLORS[0],
    });
    setRentalEditModal(null);
  };

  return (
    <div>
      {/* ヘッダー */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:6,flexWrap:'wrap',flexShrink:0}}>
        <button onClick={onBack} style={BACK_S}><ChevronLeft size={16}/>{pickMode?'予約カードに戻る':'スケジュールに戻る'}</button>
        <h2 style={{fontSize:18,fontWeight:800,color:'#7c2d12',margin:0}}>
          🚗 代車管理
          {!pickMode&&<span style={{fontSize:12,color:'#6b7280',marginLeft:8,fontWeight:500}}>（閲覧専用）</span>}
        </h2>
        {!pickMode&&<div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
          {onApplyOptimize&&<button onClick={()=>setOptResult(computeOptimize())} title="基準日以降の代車の割り当てを詰め直す（過去・貸出中・限定は動かさない）。基準日はカレンダーの日付をクリックで変更。"
            style={{padding:'6px 12px',background:'#4f46e5',color:'white',border:'none',borderRadius:6,fontWeight:700,cursor:'pointer',fontSize:12,display:'flex',alignItems:'center',gap:5}}
            onMouseEnter={e=>e.currentTarget.style.background='#4338ca'}
            onMouseLeave={e=>e.currentTarget.style.background='#4f46e5'}>✨ 最適化<span style={{fontSize:10,fontWeight:600,background:'rgba(255,255,255,0.25)',borderRadius:4,padding:'1px 6px'}}>基準 {optBaseDate.month+1}/{optBaseDate.day}〜</span></button>}
          <button onClick={onUndo} style={{padding:'6px 13px',background:'#f59e0b',color:'white',border:'none',borderRadius:6,fontWeight:700,cursor:'pointer',fontSize:12}}>↶ 戻す</button>
          <button onClick={onOpenTireEdit} title="タイヤ種別 一括設定"
            style={{padding:'6px 10px',background:'#fef3c7',border:'2px solid #fbbf24',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',gap:4,fontSize:11,fontWeight:700,color:'#d97706'}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor='#f59e0b';e.currentTarget.style.background='#fef08a';}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor='#fbbf24';e.currentTarget.style.background='#fef3c7';}}>
            ☀❄ タイヤ
          </button>
          <button onClick={onOpenLocationEdit} title="レンタカー所在地 一括設定"
            style={{padding:'6px 10px',background:'#d1fae5',border:'2px solid #6ee7b7',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',gap:4,fontSize:11,fontWeight:700,color:'#059669'}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor='#10b981';e.currentTarget.style.background='#a7f3d0';}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor='#6ee7b7';e.currentTarget.style.background='#d1fae5';}}>
            📍 所在地
          </button>
          <button onClick={onOpenSettings} title="代車・レンタカー設定"
            style={{padding:'6px 10px',background:'#f3f4f6',border:'2px solid #d1d5db',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',gap:4,fontSize:11,fontWeight:700,color:'#374151'}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor='#c2410c';e.currentTarget.style.color='#c2410c';}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor='#d1d5db';e.currentTarget.style.color='#374151';}}>
            <Settings size={13}/>設定
          </button>
        </div>}
      </div>

      {/* 月ナビゲーション */}
      {!pickMode&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:8,flexShrink:0}}>
        <button onClick={()=>setLoanerMonth(new Date(loanerMonth.getFullYear(),loanerMonth.getMonth()-1,1))}
          style={{padding:'5px 14px',background:'#c2410c',color:'white',border:'none',borderRadius:6,cursor:'pointer',fontWeight:700,fontSize:13}}>
          ◀ 前月
        </button>
        <span style={{fontWeight:800,fontSize:15,color:'#1f2937',minWidth:100,textAlign:'center',background:'white',padding:'3px 10px',borderRadius:6}}>
          {loanerMonth.getFullYear()}年{loanerMonth.getMonth()+1}月
        </span>
        <button onClick={()=>setLoanerMonth(new Date(loanerMonth.getFullYear(),loanerMonth.getMonth()+1,1))}
          style={{padding:'5px 14px',background:'#c2410c',color:'white',border:'none',borderRadius:6,cursor:'pointer',fontWeight:700,fontSize:13}}>
          翌月 ▶
        </button>
        <button onClick={()=>setLoanerMonth(new Date(nowDate.getFullYear(),nowDate.getMonth(),1))}
          style={{padding:'5px 12px',background:'#374151',color:'white',border:'none',borderRadius:6,cursor:'pointer',fontSize:12,marginLeft:6}}>
          今月
        </button>
      </div>}

      {/* ★二重取りの警告。1台1日1件しか描けないので、これが無いと2件目は画面から消えたままになる */}
      {dupWarn.length>0&&(
        <div style={{flexShrink:0,margin:'0 0 8px',padding:'8px 12px',borderRadius:8,
          background:'#fef2f2',border:'1px solid #fecaca',color:'#991b1b',fontSize:12,fontWeight:700}}>
          <div>⚠ 同じ代車が同じ日に2件以上入っています（表の帯には1件しか出ません）</div>
          {dupWarn.slice(0,8).map((w,i)=>(
            <div key={i} style={{fontWeight:600,marginTop:3}}>・{w.date} {w.car}：{w.users.join(' ／ ')}</div>
          ))}
          {dupWarn.length>8&&<div style={{fontWeight:600,marginTop:3}}>ほか {dupWarn.length-8} 件</div>}
        </div>
      )}

      {/* グリッド：overflow:hiddenでズレ防止 */}
      <div ref={gridRef} className="fat-hscroll"
        style={{overflowX:'auto',overflowY:'visible',userSelect:'none',WebkitUserSelect:'none'}}
        onMouseUp={handleMU}
        onMouseLeave={()=>{if(isDragging.current){isDragging.current=false;setDrag(null);}}}>
        <table style={{borderCollapse:'collapse',fontSize:12,tableLayout:'fixed',width:'max-content'}}>
          <thead>
            <tr>
              <th style={{width:100,minWidth:100,maxWidth:100,background:'#fff7ed',padding:'7px 9px',textAlign:'left',fontWeight:700,border:'1px solid #e5e7eb',position:'sticky',left:0,top:0,zIndex:20,fontSize:11,boxSizing:'border-box'}}>代車</th>
              {dateRange.map((dateObj,i)=>{
                if(!dateObj)return null;
                const {year,month,day}=dateObj;
                const dow=new Date(year,month,day).getDay();
                const h2=selDate&&year===selDate.getFullYear()&&month===selDate.getMonth()&&day===selDate.getDate();
                const isHol=isHoliday(year,month,day);
                // 月が変わるタイミング
                const isMonthStart=i===0||(dateRange[i-1]&&dateRange[i-1].month!==month);
                // ⑤最適化の基準日か（クリックで設定・紫で強調）
                const isOptBase=optBaseDate&&optBaseDate.year===year&&optBaseDate.month===month&&optBaseDate.day===day;
                return <th key={i} onClick={()=>setOptBaseDate({year,month,day})} title="クリックで最適化の基準日に設定"
                  style={{width:44,minWidth:44,maxWidth:44,textAlign:'center',padding:'3px 0',border:isOptBase?'2px solid #4f46e5':'1px solid #e5e7eb',cursor:'pointer',fontSize:9,background:isOptBase?'#ede9fe':h2?'#fef08a':isMonthStart?'#ddd6fe':'#fff7ed',color:dow===0||isHol?'#dc2626':dow===6?'#1d4ed8':'#374151',fontWeight:isOptBase||h2?800:600,boxSizing:'border-box',position:'relative'}}>
                  {isMonthStart&&<div style={{fontSize:7,fontWeight:800,color:'#c2410c'}}>{month+1}月</div>}
                  <div>{day}</div><div style={{fontSize:7}}>{DOW[dow]}</div>
                  {isOptBase&&<div style={{fontSize:7,fontWeight:800,color:'#4f46e5',lineHeight:1}}>基準</div>}
                </th>;
              })}
            </tr>
          </thead>
          <tbody>
            {LOANERS_LOCAL.map((car,carIdx)=>{
              return (
                <tr key={car.id}>
                  <td style={{background:'#f9fafb',border:'1px solid #e5e7eb',padding:'5px 9px',fontWeight:600,fontSize:11,whiteSpace:'nowrap',position:'sticky',left:0,zIndex:5,transform:'translateZ(0)',backfaceVisibility:'hidden',height:40,boxSizing:'border-box'}}>
                    {(()=>{
                      const tireId=tireData&&tireData[String(car.id)];
                      const tireInfo=TIRE_TYPES.find(x=>x.id===tireId);
                      return(
                        <div style={{display:'flex',alignItems:'center',gap:5}}>
                          {tireInfo&&<span title={tireInfo.label} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:18,borderRadius:4,background:tireInfo.bg,color:tireInfo.color,fontSize:9,fontWeight:900,flexShrink:0,letterSpacing:'-0.5px'}}>{tireInfo.icon}</span>}
                          <div>
                            <div style={{fontWeight:700,color:'#7c2d12',display:'flex',alignItems:'center',gap:4}}><CarColorChip hex={car.colorHex} label={car.colorHex?'車体色':''} size={11}/>{car.name}</div>
                            <div style={{color:'#111827',fontSize:10,fontWeight:800}}>{car.num}</div>
                          </div>
                        </div>
                      );
                    })()}
                  </td>
                  {dateRange.map((dateObj,i)=>{
                    if(!dateObj)return null;
                    const {year,month,day}=dateObj;
                    const st=getState(car.id,dateObj);
                    const isObj=st&&typeof st==='object';
                    const isDrag=st==='drag';
                    const isConf=st==='confirm';
                    const h2=selDate&&year===selDate.getFullYear()&&month===selDate.getMonth()&&day===selDate.getDate();
                    const isStart=isObj&&st.fd===day&&st.fm===month&&st.fy===year;
                    const isEnd=isObj&&st.td===day&&st.tm===month&&st.ty===year;
                    const bg=isDrag?'#bef264':isConf?'#93c5fd':isObj?(_resColors[st.id]||resColorOf(st)):h2?'#fef08a':'white';
                    const isFree=pickMode&&!isObj&&!isDrag&&!isConf;
                    const isBlocked=pickMode&&isObj;
                    // 隣（左＝同じ代車の前日／上＝1つ上の代車の同日）が別の予約なら濃い区切り線を引く。
                    // 同系色の予約が隣り合っても境目が分かるようにする（色は変えない）。
                    const _sameRes=(a,b)=>a&&b&&typeof a==='object'&&typeof b==='object'&&a.id===b.id;
                    const _leftSt=(i>0&&dateRange[i-1])?getState(car.id,dateRange[i-1]):null;
                    const _upSt=carIdx>0?getState(LOANERS_LOCAL[carIdx-1].id,dateObj):null;
                    const sepL=isObj&&!_sameRes(st,_leftSt);
                    const sepT=isObj&&_upSt&&typeof _upSt==='object'&&!_sameRes(st,_upSt);
                    const SEP='2px solid #1e293b';
                    // 貸出2日以上は、その日数分のセルを1枠として名前を横に広げて表示（入りきらなければ尻切れ）。
                    const _prevD=i>0?dateRange[i-1]:null;
                    const showName=isObj&&(isStart||!_leftSt||(typeof _leftSt==='object'&&_leftSt.id!==st.id)||(!!_prevD&&_prevD.month!==month));
                    let nameSpan=1;
                    if(showName){for(let j=i+1;j<dateRange.length;j++){const s=getState(car.id,dateRange[j]);if(s&&typeof s==='object'&&s.id===st.id)nameSpan++;else break;}}
                    // ★この端末が「たった今」登録した予約か（保存の完了は待たない）
                    const isJust=isObj&&justAddedIds&&justAddedIds.indexOf(st.id)>=0;
                    return (
                      <td key={i}
                        className={isJust&&!isDrag&&!isConf?'hub-just-added':undefined}
                        onMouseDown={e=>{
                          e.preventDefault();
                          if(!isBlocked)handleMD(car.id,dateObj,e);
                        }}
                        onMouseEnter={()=>{
                          if(!isBlocked)handleME(car.id,dateObj);
                          if(!pickMode&&isObj)setHoverRes({car,res:st});
                        }}
                        onMouseLeave={()=>{
                          if(!pickMode&&isObj)setHoverRes(null);
                        }}
                        onClick={(e)=>{
                          if(!pickMode&&isObj){
                            e.preventDefault();
                            e.stopPropagation();
                            setPinnedRes({car,res:st});
                            setHoverRes(null);
                          }
                        }}
                        style={{
                          width:44,minWidth:44,maxWidth:44,height:40,
                          border:'1px solid #e5e7eb',
                          ...(sepL?{borderLeft:SEP}:{}),
                          ...(sepT?{borderTop:SEP}:{}),
                          boxShadow:isDrag?'inset 0 0 0 2px #65a30d':isConf?'inset 0 0 0 2px #2563eb':'none',
                          background:bg,
                          cursor:isBlocked?'not-allowed':isFree?'crosshair':!pickMode&&isObj?'pointer':'default',
                          padding:0,
                          overflow:(showName||isJust)?'visible':'hidden',
                          position:'relative',
                          boxSizing:'border-box'
                        }}>
                        {/* ★たった今登録した予約の目印。開始位置にだけ出す */}
                        {isJust&&showName&&(<div className="hub-just-chip">たった今</div>)}
                        {/* 貸出日数分のセルを1枠として名前を表示（開始日 or 月またぎ・前が別予約の再開始位置から。尻切れ可） */}
                        {showName&&(
                          <div style={{position:'absolute',left:3,top:'50%',transform:'translateY(-50%)',width:nameSpan*44-6,fontSize:11,color:'white',fontWeight:800,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'clip',textShadow:'-1px -1px 1px rgba(0,0,0,.85),1px -1px 1px rgba(0,0,0,.85),-1px 1px 1px rgba(0,0,0,.85),1px 1px 1px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9)',zIndex:2,pointerEvents:'none'}}>
                            {/* ★限定（この車でないとダメ）の予約は鍵マーク付き。最適化で動かない印 */}
                            {st.locked&&<span style={{marginRight:2}}>🔒</span>}{shortenCorpName(st.user)}
                          </div>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* ホバープレビュー（軽量・消えやすい） */}

      {/* 固定編集パネル（予約済みバーをクリックで開く） */}
      {!pickMode&&pinnedRes&&pinnedRes.res&&(
        <div style={{position:'fixed',bottom:24,right:24,zIndex:2000,background:'white',border:`2px solid ${pinnedRes.res._rental?'#059669':'#c2410c'}`,borderRadius:12,padding:'16px 18px',boxShadow:'0 8px 40px rgba(0,0,0,0.25)',minWidth:260}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:800,color:pinnedRes.res._rental?'#065f46':'#7c2d12'}}>
              {pinnedRes.res._rental?'🔑':'🚙'} {pinnedRes.car.name}
            </div>
            <button onClick={()=>setPinnedRes(null)}
              style={{background:'#f3f4f6',border:'none',borderRadius:'50%',width:24,height:24,cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',color:'#6b7280'}}>×</button>
          </div>
          <div style={{fontSize:12,color:'#374151',marginBottom:4}}>
            📅 {pinnedRes.res.fm+1}/{pinnedRes.res.fd}〜{pinnedRes.res.tm+1}/{pinnedRes.res.td}
            <span style={{marginLeft:8,fontWeight:800,color:'white',background:pinnedRes.res._rental?'#059669':'#c2410c',borderRadius:20,padding:'2px 10px',fontSize:12}}>{loanDays(pinnedRes.res)}日間</span>
          </div>
          <div style={{fontSize:12,color:'#6b7280',marginBottom:12}}>👤 {pinnedRes.res.user}</div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>{openEdit(pinnedRes.car,pinnedRes.res);setPinnedRes(null);}}
              style={{flex:1,padding:'8px 0',background:'#c2410c',color:'white',border:'none',borderRadius:7,fontWeight:700,fontSize:12,cursor:'pointer'}}>✎ 編集</button>
            <button onClick={()=>{
              if(window.confirm(`「${pinnedRes.car.name}」の予約（${pinnedRes.res.fm+1}/${pinnedRes.res.fd}〜${pinnedRes.res.tm+1}/${pinnedRes.res.td} ${pinnedRes.res.user}）を削除しますか？`)){
                if(pinnedRes.res._rental){
                  onDeleteRentalRes(pinnedRes.car.id,pinnedRes.res.id);
                }else{
                  onDeleteRes(pinnedRes.car.id,pinnedRes.res.id);
                }
                setPinnedRes(null);
              }
            }}
              style={{flex:1,padding:'8px 0',background:'#ef4444',color:'white',border:'none',borderRadius:7,fontWeight:700,fontSize:12,cursor:'pointer'}}>🗑 削除</button>
          </div>
        </div>
      )}


      {/* -- 画面下部fixed固定パネル群 -- */}

      {/* ドラッグ中バナー：bottom center */}
      {pickMode&&drag&&(()=>{
        const {start,end}=drag;
        const days=Math.floor((new Date(end.year,end.month,end.day)-new Date(start.year,start.month,start.day))/(1000*60*60*24))+1;
        return(
          <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:1800,background:'rgba(146,64,14,0.95)',color:'white',borderRadius:10,padding:'10px 20px',fontSize:13,fontWeight:700,boxShadow:'0 4px 20px rgba(0,0,0,0.3)',pointerEvents:'none',whiteSpace:'nowrap'}}>
            🚙 {LOANERS_LOCAL.find(c=>String(c.id)===String(drag.carId))?.name}　{start.month+1}/{start.day}〜{end.month+1}/{end.day}（{days}日間）　← 離して確定
          </div>
        );
      })()}

      {/* 確定パネル：bottom center（大） */}
      {pickMode&&confirm&&(()=>{
        const {start,end}=confirm;
        const days=Math.floor((new Date(end.year,end.month,end.day)-new Date(start.year,start.month,start.day))/(1000*60*60*24))+1;
        return(
          <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:1900,background:'white',border:'2px solid #3b82f6',borderRadius:14,padding:'16px 24px',boxShadow:'0 8px 40px rgba(0,0,0,0.25)',minWidth:340,maxWidth:'90vw'}}>
            <div style={{fontWeight:800,color:'#1d4ed8',fontSize:14,marginBottom:12,textAlign:'center'}}>
              🚙 {LOANERS_LOCAL.find(c=>String(c.id)===String(confirm.carId))?.name}　{start.month+1}/{start.day}〜{end.month+1}/{end.day}（{days}日間）
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input value={pickUser} onChange={e=>setPickUser(e.target.value)}
                placeholder="利用者名を入力" autoFocus
                style={{flex:1,padding:'9px 12px',border:'2px solid #93c5fd',borderRadius:8,fontSize:13,outline:'none',fontFamily:'inherit'}}
                onKeyDown={e=>{if(e.key==='Enter')handlePickConfirm();}}/>
              <button onClick={handlePickConfirm}
                style={{padding:'9px 20px',background:'#2563eb',color:'white',border:'none',borderRadius:8,fontWeight:800,cursor:'pointer',fontSize:13,whiteSpace:'nowrap'}}>✓ 確定</button>
              <button onClick={()=>{setConfirm(null);setPickUser('');}}
                style={{padding:'9px 14px',background:'#f3f4f6',border:'none',borderRadius:8,cursor:'pointer',fontSize:13}}>取消</button>
            </div>
          </div>
        );
      })()}

      {/* 使い方ヒント：ヘッダー直下インライン */}
      {pickMode&&!confirm&&!drag&&(
        <div style={{background:'rgba(240,253,244,0.97)',border:'1px solid #86efac',borderRadius:8,padding:'6px 12px',fontSize:11,color:'#166534',marginBottom:8,display:'inline-flex',alignItems:'center',gap:4}}>
          💡 空きセルをクリック→右にスライド→離して日数確定
        </div>
      )}
      {/* ①代車ホバー情報：代車とレンタカーの間の空白に大きく表示（右下の小窓は廃止） */}
      {!pickMode&&(
        <div style={{minHeight:62,margin:'4px 0 10px',borderRadius:11,border:`1px ${hoverRes&&hoverRes.res?'solid':'dashed'} ${hoverRes&&hoverRes.res?(hoverRes.res._rental?'#6ee7b7':'#fdba74'):'#cbd5e1'}`,background:hoverRes&&hoverRes.res?(hoverRes.res._rental?'#f0fdf4':'#fff7ed'):'#f8fafc',display:'flex',alignItems:'center',padding:'10px 18px',transition:'background .1s'}}>
          {hoverRes&&hoverRes.res?(
            <div style={{display:'flex',alignItems:'center',gap:18,flexWrap:'wrap'}}>
              <span style={{display:'inline-flex',alignItems:'center',gap:9,fontSize:19,fontWeight:800,color:hoverRes.res._rental?'#065f46':'#7c2d12'}}>
                <span style={{width:15,height:15,borderRadius:4,background:(hoverRes.res._rental?_rentalColors:_resColors)[hoverRes.res.id]||resColorOf(hoverRes.res),display:'inline-block',boxShadow:'0 1px 2px rgba(0,0,0,.25)'}}/>
                {hoverRes.res._rental?'🔑':'🚙'} {hoverRes.car.name}{hoverRes.car.num?`（${hoverRes.car.num}）`:''}
              </span>
              <span style={{fontSize:16,fontWeight:700,color:'#334155'}}>📅 {hoverRes.res.fm+1}/{hoverRes.res.fd} 〜 {hoverRes.res.tm+1}/{hoverRes.res.td}</span>
              <span style={{fontSize:15,fontWeight:800,color:'white',background:hoverRes.res._rental?'#059669':'#c2410c',borderRadius:20,padding:'3px 12px'}}>{loanDays(hoverRes.res)}日間</span>
              <span style={{fontSize:18,fontWeight:800,color:'#1e293b'}}>👤 {hoverRes.res.user}</span>
              <span style={{fontSize:11,color:'#94a3b8',fontWeight:600}}>クリックで編集・削除</span>
            </div>
          ):(
            <span style={{fontSize:13,color:'#94a3b8'}}>🖱 予約バーにマウスを乗せると、ここに詳細が大きく表示されます（クリックで編集・削除）</span>
          )}
        </div>
      )}

      {/* ⑤ 最適化：変更内容の確認モーダル */}
      {optResult&&(
        <div style={{position:'fixed',inset:0,background:'rgba(15,23,42,0.55)',zIndex:5000,display:'flex',alignItems:'center',justifyContent:'center',padding:14}} onClick={()=>setOptResult(null)}>
          <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:14,width:'min(560px,96vw)',maxHeight:'88vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 60px rgba(0,0,0,0.35)',overflow:'hidden'}}>
            <div style={{background:'linear-gradient(135deg,#3730a3,#4f46e5)',color:'white',padding:'14px 20px'}}>
              <div style={{fontSize:16,fontWeight:800}}>✨ 代車の最適化</div>
              <div style={{fontSize:11,opacity:0.85,marginTop:2}}>基準日（{optBaseDate.month+1}/{optBaseDate.day}）以降の貸出を詰め直します（それ以前・貸出中・限定は動かしません）</div>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'16px 20px'}}>
              {optResult.moves.length===0?(
                <div style={{textAlign:'center',padding:'24px 8px',color:'#334155'}}>
                  <div style={{fontSize:30,marginBottom:8}}>👍</div>
                  <div style={{fontWeight:700}}>すでに最適です</div>
                  <div style={{fontSize:12,color:'#64748b',marginTop:6}}>動かせる予約はありませんでした（これから貸す {optResult.movableCount} 件／貸出中・限定 {optResult.fixedCount} 件／過去は対象外 {optResult.pastCount} 件）。</div>
                </div>
              ):(<>
                <div style={{fontSize:13,color:'#334155',marginBottom:12}}><b>{optResult.moves.length}件</b>の予約の代車が変わります：</div>
                <div style={{display:'flex',flexDirection:'column',gap:7}}>
                  {optResult.moves.map((mv,i)=>(
                    <div key={i} style={{border:'1px solid #e5e7eb',borderRadius:9,padding:'9px 12px',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                      <span style={{fontWeight:800,fontSize:14,color:'#1e293b'}}>👤 {mv.user}</span>
                      <span style={{fontSize:12,color:'#64748b'}}>{mv.period}</span>
                      <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:7,fontWeight:700,fontSize:13}}>
                        <span style={{color:'#94a3b8',textDecoration:'line-through'}}>{mv.fromName}</span>
                        <span style={{color:'#4f46e5'}}>→ {mv.toName}</span>
                      </span>
                    </div>
                  ))}
                </div>
                <div style={{marginTop:12,fontSize:11,color:'#64748b',background:'#f8fafc',border:'1px solid #e5e7eb',borderRadius:8,padding:'8px 11px'}}>
                  ※ お客様が使う代車が変わります。実行後に「↶ 戻す」で元に戻せます。特定の車で貸したい予約は、予約カードの「🔒 限定」で固定してください。
                </div>
              </>)}
            </div>
            <div style={{padding:'12px 20px',borderTop:'1px solid #e5e7eb',display:'flex',gap:8,flexShrink:0}}>
              {optResult.moves.length>0&&<button onClick={()=>{onApplyOptimize(optResult.newLoanerRes,optResult.moves);setOptResult(null);}}
                style={{flex:1,padding:'12px',background:'linear-gradient(135deg,#3730a3,#4f46e5)',color:'white',border:'none',borderRadius:9,fontWeight:800,fontSize:14,cursor:'pointer'}}>✓ この内容で最適化する</button>}
              <button onClick={()=>setOptResult(null)} style={{padding:'12px 18px',background:'#f3f4f6',border:'none',borderRadius:9,fontWeight:700,fontSize:13,color:'#475569',cursor:'pointer'}}>{optResult.moves.length>0?'キャンセル':'閉じる'}</button>
            </div>
          </div>
        </div>
      )}

      {/* == レンタカーセクション == */}
      {RENTAL_LOCAL.length > 0 && (()=>{
        // レンタカー専用ドラッグ状態
        const [rDrag,setRDrag]=React.useState(null);
        const [rConfirm,setRConfirm]=React.useState(null);
        const [rPickUser,setRPickUser]=React.useState('');
        const rDragging=React.useRef(false);

        const getRState=(carId,dateObj)=>{
          const {year,month,day}=dateObj;
          const dn=toNum(year,month,day);
          // rresはオブジェクト構造{key:予約}が正（旧データは配列）。両対応で配列化してから走査
          // （本番データで「resList is not iterable」クラッシュが出た箇所。配列前提にしないこと）
          const raw=rentalResLocal[carId]||[];
          const resList=Array.isArray(raw)?raw:Object.values(raw||{});
          for(const r of resList){
            if(r&&dn>=toNum(r.fy,r.fm,r.fd)&&dn<=toNum(r.ty,r.tm,r.td))return r;
          }
          return null;
        };

        const getRDragState=(carId,dateObj)=>{
          if(!pickMode)return getRState(carId,dateObj);
          const {year,month,day}=dateObj;
          const dn=toNum(year,month,day);
          if(rDrag&&rDrag.carId===carId){
            const s=toNum(rDrag.start.year,rDrag.start.month,rDrag.start.day);
            const e=toNum(rDrag.end.year,rDrag.end.month,rDrag.end.day);
            if(dn>=s&&dn<=e)return'drag';
          }
          if(rConfirm&&rConfirm.carId===carId){
            const s=toNum(rConfirm.start.year,rConfirm.start.month,rConfirm.start.day);
            const e=toNum(rConfirm.end.year,rConfirm.end.month,rConfirm.end.day);
            if(dn>=s&&dn<=e)return'confirm';
          }
          return getRState(carId,dateObj);
        };

        const rHandleMD=(carId,dateObj)=>{
          if(!pickMode)return;
          if(getRState(carId,dateObj))return;
          rDragging.current=true;
          setRDrag({carId,start:dateObj,end:dateObj});
        };
        const rHandleME=(carId,dateObj)=>{
          if(!pickMode||!rDragging.current||!rDrag||rDrag.carId!==carId)return;
          const s=toNum(rDrag.start.year,rDrag.start.month,rDrag.start.day);
          const e=toNum(dateObj.year,dateObj.month,dateObj.day);
          if(e>=s)setRDrag(p=>({...p,end:dateObj}));
        };
        const rHandleMU=()=>{
          if(!rDragging.current||!rDrag)return;
          rDragging.current=false;
          setRConfirm({...rDrag});
          setRDrag(null);
          setRPickUser(savedModalData?.name||'');
        };
        const rHandleConfirm=()=>{
          if(!rPickUser.trim()||!rConfirm)return;
          const {carId,start,end}=rConfirm;
          const id='rr'+Date.now();
          const rec={id,carId,user:rPickUser.trim(),
            fy:start.year,fm:start.month,fd:start.day,
            ty:end.year,tm:end.month,td:end.day,
            color:RES_COLORS[Object.keys(rentalResLocal).length%RES_COLORS.length]};
          onAddRentalRes(carId,rec);
          setRConfirm(null);setRPickUser('');
          // pickModeならモーダルに戻る（onPickRentalがあれば呼ぶ）
          if(pickMode&&onPickRental){
            onPickRental(carId,rec);
          }
        };

        return(
          <div style={{marginTop:22}}
            onMouseUp={rHandleMU}
            onMouseLeave={()=>{if(rDragging.current){rDragging.current=false;setRDrag(null);}}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <h3 style={{margin:0,fontSize:14,fontWeight:800,color:'#059669'}}>🔑 レンタカー（両店共通）</h3>
              <span style={{padding:'2px 8px',borderRadius:12,background:'#d1fae5',color:'#065f46',fontSize:10,fontWeight:700}}>{RENTAL_LOCAL.length}台</span>
              {pickMode&&<span style={{fontSize:11,color:'#059669',fontWeight:600}}></span>}
            </div>
            <div ref={rentalScrollRef} className="fat-hscroll" style={{overflowX:'auto',overflowY:'visible',userSelect:'none',WebkitUserSelect:'none'}}>
              <table style={{borderCollapse:'collapse',fontSize:12,tableLayout:'fixed',width:'max-content'}}>
                <thead>
                  <tr>
                    <th style={{width:120,minWidth:120,maxWidth:120,background:'#d1fae5',padding:'7px 9px',textAlign:'left',fontWeight:700,border:'1px solid #a7f3d0',position:'sticky',left:0,top:0,zIndex:20,fontSize:11,boxSizing:'border-box'}}>レンタカー</th>
                    {dateRange.map((dateObj,i)=>{
                      if(!dateObj)return null;
                      const {year,month,day}=dateObj;
                      const dow=new Date(year,month,day).getDay();
                      const h2=selDate&&year===selDate.getFullYear()&&month===selDate.getMonth()&&day===selDate.getDate();
                      const isHol=isHoliday(year,month,day);
                      const isMonthStart=i===0||(dateRange[i-1]&&dateRange[i-1].month!==month);
                      return <th key={i} style={{width:44,minWidth:44,maxWidth:44,textAlign:'center',padding:'3px 0',border:'1px solid #a7f3d0',fontSize:9,background:h2?'#fef08a':isMonthStart?'#d1fae5':'#ecfdf5',color:dow===0||isHol?'#dc2626':dow===6?'#1d4ed8':'#374151',fontWeight:h2?800:600,boxSizing:'border-box'}}>
                        {isMonthStart&&<div style={{fontSize:7,fontWeight:800,color:'#059669'}}>{month+1}月</div>}
                        <div>{day}</div><div style={{fontSize:7}}>{DOW[dow]}</div>
                      </th>;
                    })}
                  </tr>
                </thead>
                <tbody>
                  {RENTAL_LOCAL.map(car=>{
                    const tireId=tireData?tireData[String(car.id)]:null;
                    const tireInfo=TIRE_TYPES.find(x=>x.id===tireId);
                    const locId=locationData?locationData[String(car.id)]:null;
                    return (
                      <tr key={car.id}>
                        <td style={{background:'#f0fdf4',border:'1px solid #a7f3d0',padding:'5px 9px',fontWeight:600,fontSize:11,whiteSpace:'nowrap',position:'sticky',left:0,zIndex:5,height:40,boxSizing:'border-box'}}>
                          <div style={{display:'flex',alignItems:'center',gap:4,flexWrap:'nowrap',overflow:'hidden'}}>
                            {tireInfo&&<span title={tireInfo.label} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:16,borderRadius:3,background:tireInfo.bg,color:tireInfo.color,fontSize:9,fontWeight:900,flexShrink:0}}>{tireInfo.icon}</span>}
                            <div style={{minWidth:0,overflow:'hidden'}}>
                              <div style={{fontWeight:700,color:'#065f46',overflow:'hidden',textOverflow:'ellipsis'}}>{car.name}</div>
                              <div style={{color:'#111827',fontSize:10,fontWeight:800}}>{car.num}</div>
                            </div>
                            {locId==='honten'&&<span title="本店" style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:18,height:18,borderRadius:3,background:'#2563eb',color:'white',fontSize:10,fontWeight:900,flexShrink:0,lineHeight:1}}>本</span>}
                            {locId==='sanda' &&<span title="三田店" style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:18,height:18,borderRadius:3,background:'#dc2626',color:'white',fontSize:10,fontWeight:900,flexShrink:0,lineHeight:1}}>三</span>}
                            {locId==='out'   &&<span title="貸出中" style={{padding:'1px 4px',borderRadius:3,background:'#6b7280',color:'white',fontSize:9,fontWeight:700,flexShrink:0}}>🔑</span>}
                          </div>
                        </td>
                        {dateRange.map((dateObj,i)=>{
                          if(!dateObj)return null;
                          const {year,month,day}=dateObj;
                          const st=getRDragState(car.id,dateObj);
                          const isObj=st&&typeof st==='object';
                          const isDrag=st==='drag';
                          const isConf=st==='confirm';
                          const h2=selDate&&year===selDate.getFullYear()&&month===selDate.getMonth()&&day===selDate.getDate();
                          const isStart=isObj&&st.fd===day&&st.fm===month&&st.fy===year;
                          const bg=isDrag?'#bef264':isConf?'#93c5fd':isObj?(_rentalColors[st.id]||resColorOf(st)):h2?'#fef08a':'white';
                          const isFree=pickMode&&!isObj&&!isDrag&&!isConf;
                          const isBlocked=pickMode&&isObj;
                          // 貸出2日以上は日数分のセルを1枠として名前を横に広げる（尻切れ可）
                          let rNameSpan=1;
                          if(isObj&&isStart){for(let j=i+1;j<dateRange.length;j++){const s=getRDragState(car.id,dateRange[j]);if(s&&typeof s==='object'&&s.id===st.id)rNameSpan++;else break;}}
                          return (
                            <td key={i}
                              onMouseDown={e=>{e.preventDefault();if(!isBlocked)rHandleMD(car.id,dateObj);}}
                              onMouseEnter={()=>{rHandleME(car.id,dateObj);if(!pickMode&&isObj)setHoverRes({car,res:{...st,_rental:true}});}}
                              onMouseLeave={()=>{if(!pickMode&&isObj)setHoverRes(null);}}
                              onClick={e=>{
                                if(!pickMode&&isObj){e.preventDefault();e.stopPropagation();setPinnedRes({car,res:{...st,_rental:true}});}
                              }}
                              style={{
                                width:44,minWidth:44,maxWidth:44,height:40,
                                border:'1px solid #a7f3d0',
                                boxShadow:isDrag?'inset 0 0 0 2px #65a30d':isConf?'inset 0 0 0 2px #2563eb':'none',
                                background:bg,
                                cursor:isBlocked?'not-allowed':isFree?'crosshair':!pickMode&&isObj?'pointer':'default',
                                padding:0,overflow:(isObj&&isStart)?'visible':'hidden',position:'relative',boxSizing:'border-box'}}>
                              {isObj&&isStart&&(
                                <div style={{position:'absolute',left:3,top:'50%',transform:'translateY(-50%)',width:rNameSpan*44-6,fontSize:11,color:'white',fontWeight:800,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'clip',textShadow:'-1px -1px 1px rgba(0,0,0,.85),1px -1px 1px rgba(0,0,0,.85),-1px 1px 1px rgba(0,0,0,.85),1px 1px 1px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9)',zIndex:2,pointerEvents:'none'}}>
                                  {shortenCorpName(st.user)}
                                </div>
                              )}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* レンタカー確定パネル */}
            {pickMode&&rConfirm&&(()=>{
              const {start,end}=rConfirm;
              const days=Math.floor((new Date(end.year,end.month,end.day)-new Date(start.year,start.month,start.day))/(1000*60*60*24))+1;
              return(
                <div style={{position:'fixed',bottom:80,left:'50%',transform:'translateX(-50%)',zIndex:1950,background:'white',border:'2px solid #059669',borderRadius:14,padding:'16px 24px',boxShadow:'0 8px 40px rgba(0,0,0,0.25)',minWidth:340,maxWidth:'90vw'}}>
