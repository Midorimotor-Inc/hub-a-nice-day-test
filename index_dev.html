});

// ============================================
//  車検台数制限モーダル
// ============================================
const InspLimitModal=memo(({isOpen,onClose,curMonth,inspLimits,onSave})=>{
  const today=new Date();
  const defDate=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const [selDate,setSelDate]=useState(defDate);
  // 台数は「未選択(null)」が既定。制限のある日を選べばその台数、解除すれば未選択に戻る
  //（従来は常に3が選択済みの網掛けで、解除しても選択が残って紛らわしかった）
  const [limitCount,setLimitCount]=useState(null);
  const dkOf=dateStr=>{if(!dateStr)return null;const[y,m,d]=dateStr.split('-').map(Number);return`${y}-${m}-${d}`;};

  useEffect(()=>{
    if(isOpen)setSelDate(defDate);
  },[isOpen]);
  // 開いた時・日付を変えた時は、その日の現在の制限に合わせる（無ければ未選択）
  useEffect(()=>{
    if(!isOpen)return;
    const dk=dkOf(selDate);
    const cur=dk?inspLimits[dk]:undefined;
    setLimitCount(cur!=null?cur:null);
  },[isOpen,selDate,inspLimits]);

  if(!isOpen)return null;

  // inspLimitsの全エントリを日付順にソートして表示（今日以降のみ）
  const todayNum=(()=>{const t=new Date();return t.getFullYear()*10000+(t.getMonth()+1)*100+t.getDate();})();
  const allLimits=Object.entries(inspLimits)
    .map(([dk,limit])=>{
      const parts=dk.split('-').map(Number);
      const [y,m,d]=[parts[0],parts[1],parts[2]];
      const num=y*10000+m*100+d;
      return{dk,y,m,d,num,limit};
    })
    .filter(({num})=>num>=todayNum)
    .sort((a,b)=>a.num-b.num);

  // 日付文字列→dk変換
  const dateToDk=(dateStr)=>{
    if(!dateStr)return null;
    const [y,m,d]=dateStr.split('-').map(Number);
    return `${y}-${m}-${d}`;
  };

  const handleSave=()=>{
    const dk=dateToDk(selDate);
    if(!dk){alert('日付を選択してください');return;}
    if(limitCount==null){alert('最大台数を選んでください');return;}
    onSave(dk,limitCount);
    onClose();   // 確定したら閉じる（2026-09-20 ユーザー要望）
  };
  const handleRemove=()=>{
    const dk=dateToDk(selDate);
    if(!dk)return;
    onSave(dk,null);      // nullで制限解除
    setLimitCount(null);  // 台数の選択（網掛け）も外して未選択に戻す
  };
  const selectedDk=dateToDk(selDate);
  const currentLimit=selectedDk?inspLimits[selectedDk]:undefined;

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="modal-box"
        style={{background:'white',borderRadius:16,padding:'24px 28px',width:'min(480px,94vw)',boxShadow:'0 20px 60px rgba(0,0,0,0.3)',maxHeight:'90vh',overflowY:'auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <div>
            <div style={{fontWeight:800,fontSize:16,color:'white'}}>🚗 車検台数制限設定</div>
            <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>通常は6台/日。スタッフ数が少ない日に制限を設定できます</div>
          </div>
          <button onClick={onClose} style={{background:'#f3f4f6',border:'none',borderRadius:'50%',width:32,height:32,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><X size={16}/></button>
        </div>

        {/* 制限する日付 */}
        <div style={{marginBottom:18}}>
          <label style={{display:'block',fontWeight:700,fontSize:13,color:'#374151',marginBottom:7}}>📅 制限する日付</label>
          <input type="date" value={selDate} onChange={e=>setSelDate(e.target.value)}
            style={{width:'100%',padding:'9px 12px',border:'2px solid #d1d5db',borderRadius:8,fontSize:14,outline:'none',boxSizing:'border-box'}}/>
          {currentLimit!=null&&(
            <div style={{marginTop:5,padding:'5px 10px',background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:6,fontSize:11,color:'#dc2626',fontWeight:700}}>
              この日は現在 最大{currentLimit}台 に制限されています
            </div>
          )}
        </div>

        {/* 最大台数セレクター */}
        <div style={{marginBottom:20}}>
          <label style={{display:'block',fontWeight:700,fontSize:13,color:'#374151',marginBottom:7}}>🚗 最大台数（0〜6台）</label>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {[0,1,2,3,4,5,6].map(n=>{
              const isZero=n===0;
              const isSix=n===6;
              const active=limitCount===n;
              return(
                <button key={n} onClick={()=>setLimitCount(n)}
                  style={{flex:'1 1 0',minWidth:40,padding:'11px 0',borderRadius:9,
                    border:`2px solid ${active?(isZero?'#7c3aed':isSix?'#059669':'#dc2626'):'#d1d5db'}`,
                    background:active?(isZero?'#ede9fe':isSix?'#d1fae5':'#fee2e2'):'white',
                    color:active?(isZero?'#7c3aed':isSix?'#059669':'#dc2626'):'#6b7280',
                    fontWeight:active?900:600,fontSize:16,cursor:'pointer',transition:'all 0.12s',position:'relative'}}>
                  {n}
                  {isZero&&<div style={{fontSize:8,color:active?'#7c3aed':'#9ca3af',fontWeight:700,lineHeight:1.1}}>全禁止</div>}
                  {isSix&&<div style={{fontSize:8,color:active?'#059669':'#9ca3af',fontWeight:700,lineHeight:1.1}}>通常</div>}
                </button>
              );
            })}
          </div>
          <div style={{marginTop:7,fontSize:11,color:'#6b7280',textAlign:'center'}}>
            0 = 車検不可（全禁止）　6 = 通常通り（制限なし扱い）　制限解除は「制限解除」ボタン。「確定」で保存して閉じます
          </div>
        </div>

        {/* ボタン */}
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          <button onClick={handleSave} disabled={limitCount==null}
            style={{flex:1,padding:'11px 0',background:limitCount==null?'#e5e7eb':'linear-gradient(135deg,#ef4444,#dc2626)',color:limitCount==null?'#9ca3af':'white',border:'none',borderRadius:9,fontWeight:800,fontSize:14,cursor:limitCount==null?'not-allowed':'pointer'}}>
            ✓ 確定
          </button>
          {currentLimit!=null&&(
            <button onClick={handleRemove}
              style={{padding:'11px 14px',background:'#f3f4f6',border:'none',borderRadius:9,fontWeight:600,cursor:'pointer',fontSize:12,color:'#6b7280'}}>
              制限解除
            </button>
          )}
          <button onClick={onClose}
            style={{padding:'11px 14px',background:'#f3f4f6',border:'none',borderRadius:9,fontWeight:600,cursor:'pointer',fontSize:12}}>
            戻る
          </button>
        </div>

        {/* 設定済み台数制限一覧（今日以降） */}
        {allLimits.length>0&&(
          <div style={{borderTop:'1px solid #e5e7eb',paddingTop:14}}>
            <div style={{fontWeight:700,fontSize:12,color:'#374151',marginBottom:8}}>📋 台数制限設定一覧（今日以降）</div>
            <div style={{display:'flex',flexDirection:'column',gap:5,maxHeight:200,overflowY:'auto'}}>
              {allLimits.map(({dk,y,m,d,limit})=>(
                <div key={dk} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 10px',background:'#fff1f2',border:'1px solid #fecaca',borderRadius:7}}>
                  <span style={{fontSize:12,fontWeight:700,color:'#374151'}}>{y}年{m}月{d}日</span>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{padding:'2px 10px',background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:20,fontSize:11,fontWeight:700,color:'#dc2626'}}>最大{limit}台</span>
                    <button onClick={()=>{onSave(dk,null);if(dk===selectedDk)setLimitCount(null);}}
                      style={{fontSize:10,color:'#9ca3af',background:'none',border:'none',cursor:'pointer',padding:'2px 4px',fontWeight:600}}>
                      解除×
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
});

// ============================================
//  予約入力モーダル（左スライドパネル）
//  isNew=true → 空欄フォーム強制・削除ボタン非表示
//  isNew=false → 既存データ読み込み・削除ボタン表示
// ============================================
// ============================================
//  クイックアイテム編集モーダル
// ============================================
const SetItemEditModal=memo(({isOpen,onClose,items,onSave,title})=>{
  const [list,setList]=useState([]);
  const [editIdx,setEditIdx]=useState(null);
  const [editLabel,setEditLabel]=useState('');
  const [editText,setEditText]=useState('');
  const [newLabel,setNewLabel]=useState('');
  const [newText,setNewText]=useState('');

  useEffect(()=>{if(isOpen){setList([...items]);setEditIdx(null);setNewLabel('');setNewText('');}  },[isOpen,items]);
  if(!isOpen)return null;

  const startEdit=(idx)=>{setEditIdx(idx);setEditLabel(list[idx].label);setEditText(list[idx].text||'');};
  const confirmEdit=()=>{if(!editLabel.trim())return;setList(p=>{const n=[...p];n[editIdx]={...n[editIdx],label:editLabel.trim(),text:(editText.trim()||editLabel.trim())};return n;});setEditIdx(null);};   // テキスト空なら表示名を入れる
  const moveUp=(i)=>{if(i===0)return;setList(p=>{const n=[...p];[n[i-1],n[i]]=[n[i],n[i-1]];return n;});};
  const moveDown=(i)=>{setList(p=>{if(i>=p.length-1)return p;const n=[...p];[n[i],n[i+1]]=[n[i+1],n[i]];return n;});};
  const deleteItem=(i)=>{setList(p=>p.filter((_,j)=>j!==i));};
  const addItem=()=>{
    if(!newLabel.trim())return;
    setList(p=>[...p,{id:`si_${Date.now()}`,label:newLabel.trim(),text:(newText.trim()||newLabel.trim())}]);   // テキスト空なら表示名をそのまま挿入する
    setNewLabel('');setNewText('');
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',zIndex:4800,display:'flex',alignItems:'center',justifyContent:'center',padding:12}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="modal-box"
        style={{background:'white',borderRadius:16,width:'min(640px,96vw)',maxHeight:'90vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 60px rgba(0,0,0,0.4)'}}>
        <div style={{padding:'16px 20px',background:'linear-gradient(135deg,#0e7490,#0891b2)',borderRadius:'16px 16px 0 0',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <div>
            <div style={{color:'white',fontWeight:800,fontSize:15}}>⚡ {title||'クイックアイテム編集'}</div>
            <div style={{color:'rgba(255,255,255,0.75)',fontSize:11,marginTop:2}}>内容欄に挿入できる定型文を管理します</div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:30,height:30,cursor:'pointer',color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}><X size={14}/></button>
        </div>

        <div style={{flex:1,overflowY:'auto',padding:'14px 20px',display:'flex',flexDirection:'column',gap:8}}>
          {list.map((item,i)=>(
            <div key={item.id||i} style={{background:'#f8fafc',border:'2px solid #e5e7eb',borderRadius:9,overflow:'hidden',flexShrink:0}}>
              {editIdx===i?(
                <div style={{padding:'10px 12px',display:'flex',flexDirection:'column',gap:6}}>
                  <input value={editLabel} onChange={e=>setEditLabel(e.target.value)} placeholder="ボタン表示名"
                    style={{...INP,fontSize:13}}/>
                  <input value={editText} onChange={e=>setEditText(e.target.value)} placeholder="挿入するテキスト（内容欄に入る文章）"
                    style={{...INP,fontSize:12}}/>
                  <div style={{display:'flex',gap:6}}>
                    <button onClick={confirmEdit} style={{flex:1,padding:'7px 0',background:'#0891b2',color:'white',border:'none',borderRadius:7,fontWeight:700,fontSize:12,cursor:'pointer'}}>✓ 確定</button>
                    <button onClick={()=>setEditIdx(null)} style={{padding:'7px 14px',background:'#f3f4f6',border:'none',borderRadius:7,fontSize:12,cursor:'pointer'}}>キャンセル</button>
                  </div>
                </div>
              ):(
                <div style={{display:'flex',alignItems:'center',gap:6,padding:'8px 10px'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:3,marginRight:4}}>
                    <button onClick={()=>moveUp(i)} disabled={i===0} style={{border:'none',background:'none',cursor:i===0?'default':'pointer',color:i===0?'#d1d5db':'#6b7280',fontSize:11,padding:'1px 4px',lineHeight:1}}>▲</button>
                    <button onClick={()=>moveDown(i)} disabled={i===list.length-1} style={{border:'none',background:'none',cursor:i===list.length-1?'default':'pointer',color:i===list.length-1?'#d1d5db':'#6b7280',fontSize:11,padding:'1px 4px',lineHeight:1}}>▼</button>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13,color:'#0891b2'}}>{item.label}</div>
                    <div style={{fontSize:11,color:'#6b7280',wordBreak:'break-all',lineHeight:1.5,marginTop:2}}>{item.text||'（表示名をそのまま挿入）'}</div>
                  </div>
                  <button onClick={()=>startEdit(i)} style={{padding:'4px 10px',background:'#e0f2fe',border:'1px solid #7dd3fc',borderRadius:6,fontSize:11,fontWeight:600,cursor:'pointer',color:'#0369a1',whiteSpace:'nowrap'}}>編集</button>
                  <button onClick={()=>deleteItem(i)} style={{padding:'4px 8px',background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:6,fontSize:11,cursor:'pointer',color:'#dc2626'}}>✕</button>
                </div>
              )}
            </div>
          ))}

          {/* 新規追加 */}
          <div style={{background:'#f0fdf4',border:'2px dashed #86efac',borderRadius:9,padding:'10px 12px',flexShrink:0}}>
            <div style={{fontWeight:700,fontSize:12,color:'#059669',marginBottom:8}}>＋ 新規追加</div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              <input value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder="ボタン表示名（例：バッテリー交換）"
                style={{...INP,fontSize:13}}/>
              <input value={newText} onChange={e=>setNewText(e.target.value)} placeholder="挿入するテキスト（空なら表示名がそのまま入ります）"
                style={{...INP,fontSize:12}}/>
              <button onClick={addItem} disabled={!newLabel.trim()}
                style={{padding:'8px 0',background:newLabel.trim()?'#059669':'#d1d5db',color:'white',border:'none',borderRadius:7,fontWeight:700,fontSize:12,cursor:newLabel.trim()?'pointer':'default'}}>
                ＋ 追加する
              </button>
            </div>
          </div>
        </div>

        <div style={{padding:'12px 20px',borderTop:'1px solid #e5e7eb',display:'flex',gap:8,flexShrink:0}}>
          <button onClick={()=>{onSave(list);onClose();}}
            style={{flex:1,padding:'11px 0',background:'linear-gradient(135deg,#0e7490,#0891b2)',color:'white',border:'none',borderRadius:9,fontWeight:800,fontSize:13,cursor:'pointer'}}>
            ✓ 保存して閉じる
          </button>
          <button onClick={onClose} style={{padding:'11px 16px',background:'#f3f4f6',border:'none',borderRadius:9,fontSize:12,cursor:'pointer'}}>キャンセル</button>
        </div>
      </div>
    </div>
  );
});


// ── 車検カレンダーピッカー（顧客リストモーダル用）──
const InspCalendarPicker=memo(({form,setForm,bmInspData,bmClosedDays,bmClosedDates,bmOverrideOpen,bmInspLimits})=>{
  const [calMonth,setCalMonth]=useState(()=>{
    if(form._bookingDate){const p=form._bookingDate.split('-');return new Date(Number(p[0]),Number(p[1])-1,1);}
    return new Date();
  });
  const cy=calMonth.getFullYear(),cm=calMonth.getMonth();
  const daysInMonth=new Date(cy,cm+1,0).getDate();
  const first=new Date(cy,cm,1).getDay();
  const weeks=[];let wk=Array(7).fill(null);
  for(let d=1;d<=daysInMonth;d++){
    const dow=(first+d-1)%7;wk[dow]=d;
    if(dow===6){weeks.push([...wk]);wk=Array(7).fill(null);}
  }
  if(wk.some(x=>x!==null))weeks.push([...wk]);
  const getDk=d=>`${cy}-${cm+1}-${d}`;
  const getCount=d=>{
    const rows=(bmInspData&&bmInspData[getDk(d)])||[];
    return rows.filter(r=>r&&r.name&&!r.pendingApproval&&r.bookingStatus!=='cancelled').length;
  };
  const getLimit=d=>(bmInspLimits&&bmInspLimits[getDk(d)])||6;
  const isClosed=d=>{
    const date=new Date(cy,cm,d);
    const days=Array.isArray(bmClosedDays)?bmClosedDays:[];
    const dates=Array.isArray(bmClosedDates)?bmClosedDates:[];
    const ov=Array.isArray(bmOverrideOpen)?bmOverrideOpen:[];
    if(days.includes(date.getDay()))return true;
    const ds=`${cy}-${String(cm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(dates.includes(ds))return true;
    return false;
  };
  const DOW_CAL=['日','月','火','水','木','金','土'];
  const today=new Date();
  return(
    <div style={{border:'2px solid #e5e7eb',borderRadius:9,overflow:'hidden',fontSize:11}}>
      {/* ナビ */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:'#f8fafc',borderBottom:'1px solid #e5e7eb'}}>
        <button onClick={()=>setCalMonth(new Date(cy,cm-1,1))}
          style={{padding:'3px 10px',border:'1px solid #d1d5db',borderRadius:6,background:'white',cursor:'pointer',fontSize:13}}>‹</button>
        <span style={{fontWeight:800,color:'white',fontSize:13}}>{cy}年{cm+1}月</span>
        <button onClick={()=>setCalMonth(new Date(cy,cm+1,1))}
          style={{padding:'3px 10px',border:'1px solid #d1d5db',borderRadius:6,background:'white',cursor:'pointer',fontSize:13}}>›</button>
      </div>
      {/* 曜日ヘッダー */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'#eef2ff',borderBottom:'1px solid #e5e7eb'}}>
        {DOW_CAL.map((d,i)=>(
          <div key={d} style={{textAlign:'center',padding:'5px 0',fontWeight:700,fontSize:11,
            color:i===0?'#dc2626':i===6?'#2563eb':'#374151'}}>{d}</div>
        ))}
      </div>
      {/* 週グリッド */}
      {weeks.map((wk,wi)=>(
        <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
          {wk.map((d,di)=>{
            if(!d)return<div key={di} style={{minHeight:52,borderTop:'1px solid #f3f4f6',borderLeft:di>0?'1px solid #f3f4f6':'none',background:'#f9fafb'}}/>;
            const cnt=getCount(d);
            const lmt=getLimit(d);
            const closed=isClosed(d);
            const isToday=d===today.getDate()&&cm===today.getMonth()&&cy===today.getFullYear();
            const dateStr=`${cy}-${String(cm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isSel=form._bookingDate===dateStr;
            const isFull=cnt>=lmt;
            const numColor=di===0?'#dc2626':di===6?'#2563eb':'#111';
            let bg='white';
            if(isSel)bg='#dbeafe';
            else if(closed)bg=CLOSED_BG; // 車検カレンダーと同じ見た目
            else if(isFull)bg='#fef2f2';
            return(
              <div key={di}
                onClick={()=>{if(!closed)setForm({...form,_bookingDate:dateStr});}}
                style={{minHeight:52,padding:'4px 3px',cursor:closed?'not-allowed':'pointer',
                  borderTop:'1px solid #f3f4f6',borderLeft:di>0?'1px solid #f3f4f6':'none',
                  background:bg,boxShadow:closed?CLOSED_BAR:'none',
                  outline:isSel?'2px solid #2563eb':isToday?'2px solid #93c5fd':'none',
                  position:'relative'}}>
                <div style={{textAlign:'center',fontWeight:isToday?900:700,fontSize:12,
                  color:isSel?'#1d4ed8':closed?CLOSED_FG:numColor}}>{d}</div>
                {!closed&&(
                  <div style={{textAlign:'center',marginTop:2}}>
                    <span style={{fontSize:10,fontWeight:700,
                      color:isFull?'#dc2626':cnt>=lmt-1?'#d97706':'#059669'}}>
                      {cnt}/{lmt}台
                    </span>
                  </div>
                )}
                {closed&&<div style={{textAlign:'center',fontSize:9,color:'#6b7280',fontWeight:800}}>休</div>}
                {isSel&&<div style={{position:'absolute',top:2,right:2,width:6,height:6,borderRadius:'50%',background:'#2563eb'}}/>}
              </div>
            );
          })}
        </div>
      ))}
      {/* 凡例 */}
      <div style={{display:'flex',gap:10,padding:'6px 10px',background:'#f8fafc',borderTop:'1px solid #e5e7eb',flexWrap:'wrap'}}>
        <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#059669'}}>●空き</span>
        <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#d97706'}}>●残少</span>
        <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#dc2626'}}>●満</span>
        <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#9ca3af'}}>休休業日</span>
      </div>
    </div>
  );
});

const BookingModal=memo(({isOpen,onClose,type,initialData,isNew,dateLabel,timeSlot,onSave,onDelete,onDateChange,onOpenLoanerPicker,pendingLoanerId,pendingLoanerData,pendingRentalId,pendingRentalRec,rentalCarsData,loanerRes,modalDk,modalIdx:modalIdxProp,onDeleteLoaner,onToggleLoanerLock,onTogglePendingLoanerLock,currentUser,setItems,onOpenSetItemEdit,allCars,fromCustList,savedModalData,inspData:bmInspData,closedDays:bmClosedDays,closedDates:bmClosedDates,overrideOpenDates:bmOverrideOpen,inspLimits:bmInspLimits})=>{
  const [form,setForm]=useState(initialData);
  const [staffInput,setStaffInput]=useState('');
  const [showStaff,setShowStaff]=useState(false);
  const nameRef=useRef(null);
  const staffRef=useRef(null);
  const carRef=useRef(null);
  const workRef=useRef(null);      // 作業内容（整備）
  const tokutenRef=useRef(null);   // 特典（車検）
  const shimiRef=useRef(null);     // 指・見（整備）
  const timeRef=useRef(null);
  const noteRef=useRef(null);
  const contRef=useRef(null);

  // キーボード操作用state（必ずreturnより前に定義）
  const [kbField,setKbField]=useState('');
  const [showTmPk,setShowTmPk]=useState(false);
  const [showWkPk,setShowWkPk]=useState(false);
  const [showShPk,setShowShPk]=useState(false);
  const [showDatePicker,setShowDatePicker]=useState(false);
  const [showEntryPicker,setShowEntryPicker]=useState(false); // 前日入庫の入庫日ピッカー
  const [entryPickerMonth,setEntryPickerMonth]=useState(null);
  const [showDelivPicker,setShowDelivPicker]=useState(false); // 納車日ピッカー（車検・タイムスケジュール共通・任意）
  const [delivPickerMonth,setDelivPickerMonth]=useState(null);
  const [showDelivTmPk,setShowDelivTmPk]=useState(false);     // 納車時間ピッカー
  // 入庫日／納車日カレンダーの基準日＝このモーダルが編集している日（スケジュールで選択した日）。
  // 日付キーはゼロ詰めなし（2026-7-5）なので比較前に正規化する。
  const normDk=s=>{const p=String(s||'').split('-');return (p.length===3&&p.every(v=>v!==''&&!isNaN(v)))?`${+p[0]}-${+p[1]}-${+p[2]}`:'';};
  const baseDk=normDk(modalDk);
  const baseMonth=()=>{const p=baseDk?baseDk.split('-').map(Number):null;const now=new Date();return p?{year:p[0],month:p[1]-1}:{year:now.getFullYear(),month:now.getMonth()};};
  const baseMd=baseDk?(()=>{const p=baseDk.split('-');return `${p[1]}/${p[2]}`;})():'';
  // モーダルオープン時に元のdkを保持
  useEffect(()=>{ if(isOpen){ originalDkRef.current=''; localTargetDkRef.current=''; } },[isOpen]);
  const [pickerMonth,setPickerMonth]=useState(null);
  const localTargetDkRef=useRef('');
  const originalDkRef=useRef('');

  // 同じ予約かどうかをキーで判定（代車ピッカー往復などでリセットしないため）
  const makeKey=(d)=>d?`${d._idx??'none'}|${d._slot??'none'}|${d.name??''}`:'';
  const prevKeyRef=useRef('');
  const prevOpenRef=useRef(false);

  useEffect(()=>{
    if(!isOpen){prevOpenRef.current=false;return;}
    const justOpened=!prevOpenRef.current;
    const curKey=makeKey(initialData);
    const sameBooking=curKey===prevKeyRef.current;
    prevOpenRef.current=true;
    prevKeyRef.current=curKey;

    // 同じ予約の再open（代車ピッカーから戻るなど）→ formをリセットしない
    // ただしisNew=trueの新規入力は必ずリセット
    if(sameBooking && !isNew) return;

    const loginName = currentUser?.name || '';
    const defaultStaff = initialData.staff || (isNew ? loginName : loginName);
    const formData = {...initialData, staff: defaultStaff, bookingStatus: initialData.bookingStatus||'new'};
    setForm(formData);
    setStaffInput(defaultStaff);
    setShowStaff(false);
    if(justOpened) setTimeout(()=>{setKbField('name');nameRef.current?.focus();},120);
  },[isOpen,initialData,isNew,currentUser]);

  useEffect(()=>{
    if(pendingLoanerId!=null){
      const car=(allCars&&allCars.length?allCars:LOANERS).find(c=>String(c.id)===String(pendingLoanerId));
      if(car)setForm(p=>({...p,loaner:`${car.name} (${car.num})`,loanerId:car.id}));
    }
  },[pendingLoanerId]);

  if(!isOpen) return null;
  const isInsp=type==='insp';
  const canDelete=!!onDelete;

  // ── キーボード操作 ──────────────────────────────────────────
  const INSP_ORDER=['name','staff','car','course','tokuten','time','note'];
  const SCHED_ORDER=['name','staff','car','work','shimi','note'];
  const ORDER=isInsp?INSP_ORDER:SCHED_ORDER;
  // フォーカスリング
  const KB=(key)=>kbField===key
    ?{outline:`3px solid ${isInsp?'#c2410c':'#0891b2'}`,outlineOffset:'2px',boxShadow:`0 0 0 4px rgba(${isInsp?'67,56,202':'8,145,178'},0.15)`}
    :{};
  // 次/前のフィールドへ
  const TIME_VALS=SCHED_SLOTS; // 9:00〜18:00＋整理用の特別枠（未定/午前/午後）
  // キー操作で送った時、フォーカスした項目をモーダルの中央にスクロール
  //（上の方の項目は先頭でクランプされ中央に来ないが、中央を過ぎたら常に真ん中に保たれる）
  const centerField=(el)=>{ if(el){try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){} } };
  const goNext=(from)=>{
    const i=ORDER.indexOf(from); if(i<0||i>=ORDER.length-1)return;
    const next=ORDER[i+1]; setKbField(next);
    if(next==='name'){nameRef.current?.focus();centerField(nameRef.current);}
    else if(next==='staff'){staffRef.current?.focus();centerField(staffRef.current);}
    else if(next==='car'){carRef.current?.focus();centerField(carRef.current);}
    else if(next==='time'){timeRef.current?.focus();centerField(timeRef.current);}
    else if(next==='note'){noteRef.current?.focus();centerField(noteRef.current);}
    else if(next==='cont'){contRef.current?.focus();centerField(contRef.current);}
    else{// course/tokuten/work/shimi: モーダル内のdiv[tabIndex=0]を順番に探す
      const divs=Array.from(document.querySelectorAll('.booking-modal-inner div[tabIndex="0"]'));
      const target=divs.find(d=>d.dataset.kbkey===next);
      if(target)setTimeout(()=>{target.focus();centerField(target);},20);
    }
  };
  const goPrev=(from)=>{
    const i=ORDER.indexOf(from); if(i<=0)return;
    const prev=ORDER[i-1]; setKbField(prev);
    if(prev==='name'){nameRef.current?.focus();centerField(nameRef.current);}
    else if(prev==='staff'){staffRef.current?.focus();centerField(staffRef.current);}
    else if(prev==='car'){carRef.current?.focus();centerField(carRef.current);}
    else if(prev==='time'){timeRef.current?.focus();centerField(timeRef.current);}
    else if(prev==='note'){noteRef.current?.focus();centerField(noteRef.current);}
    else if(prev==='cont'){contRef.current?.focus();centerField(contRef.current);}
    else{
      const divs=Array.from(document.querySelectorAll('.booking-modal-inner div[tabIndex="0"]'));
      const target=divs.find(d=>d.dataset.kbkey===prev);
      if(target)setTimeout(()=>{target.focus();centerField(target);},20);
    }
  };
  // 各フィールドのキーハンドラ
  const onKbNav=(e,field)=>{
    if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();goNext(field);}
    else if(e.key==='ArrowUp'){e.preventDefault();goPrev(field);}
  };
  const onCourseKb=(e)=>{
    const ids=COURSES.map(c=>c.id),cur=ids.indexOf(form.course);
    if(e.key==='ArrowLeft'&&cur>0){e.preventDefault();setForm(p=>({...p,course:ids[cur-1]}));}
    else if(e.key==='ArrowRight'&&cur<ids.length-1){e.preventDefault();setForm(p=>({...p,course:ids[cur+1]}));}
    else if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();goNext('course');}
    else if(e.key==='ArrowUp'){e.preventDefault();goPrev('course');}
  };
  const TIDS=TOKUENS.map(t=>t.id);
  const onTokKb=(e)=>{
    const cur=TIDS.indexOf(form.tokuten);
    if(e.key==='ArrowLeft'&&cur>0){e.preventDefault();setForm(p=>({...p,tokuten:TIDS[cur-1]}));}
    else if(e.key==='ArrowRight'&&cur<TIDS.length-1){e.preventDefault();setForm(p=>({...p,tokuten:TIDS[cur+1]}));}
    else if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();goNext('tokuten');}
    else if(e.key==='ArrowUp'){e.preventDefault();goPrev('tokuten');}
  };
  const onTimeKb=(e)=>{
    if(!showTmPk){if(e.key==='Enter'){e.preventDefault();setShowTmPk(true);}return;}
    const cur=TIME_VALS.indexOf(form.time);
    const scrollTmIntoView=(v)=>{const el=document.querySelector('[data-tmid="'+v+'"]');if(el)el.scrollIntoView({block:'nearest'});};
    if(e.key==='ArrowDown'){e.preventDefault();const nv=TIME_VALS[Math.min(cur+1,TIME_VALS.length-1)];setForm(p=>({...p,time:nv}));scrollTmIntoView(nv);}
    else if(e.key==='ArrowUp'){e.preventDefault();const nv=TIME_VALS[Math.max(cur-1,0)];setForm(p=>({...p,time:nv}));scrollTmIntoView(nv);}
    else if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();setShowTmPk(false);if(e.key==='Enter')goNext('time');}
  };
  const WIDS=WORKS.map(w=>w.id);
  const onWorkKb=(e)=>{
    if(!showWkPk){if(e.key==='Enter'){e.preventDefault();setShowWkPk(true);}
      else if(e.key==='ArrowDown'){e.preventDefault();goNext('work');}
      else if(e.key==='ArrowUp'){e.preventDefault();goPrev('work');}
      return;}
    const cur=WIDS.indexOf(form.work);
    // 選択中の項目を常にリスト内に見えるようスクロール（下端に来たらドラム式に上へ送る）
    const scrollWkIntoView=(id)=>{const el=document.querySelector('[data-wkid="'+id+'"]');if(el)el.scrollIntoView({block:'nearest'});};
    if(e.key==='ArrowDown'){e.preventDefault();const ni=cur<0?0:Math.min(cur+1,WIDS.length-1);setForm(p=>({...p,work:WIDS[ni]}));scrollWkIntoView(WIDS[ni]);}
    else if(e.key==='ArrowUp'){e.preventDefault();const ni=Math.max(cur-1,0);setForm(p=>({...p,work:WIDS[ni]}));scrollWkIntoView(WIDS[ni]);}
    else if(e.key==='Enter'){e.preventDefault();setShowWkPk(false);setKbField('shimi');setTimeout(()=>document.querySelector('[data-kbkey="shimi"]')?.focus(),30);}
    else if(e.key==='Escape'){e.preventDefault();setShowWkPk(false);}
  };
  const SHIDS=[...SHIMIS.map(s=>s.id)];
  const onShimiKb=(e)=>{
    if(!showShPk){if(e.key==='Enter'){e.preventDefault();setShowShPk(true);}
      else if(e.key==='ArrowDown'){e.preventDefault();goNext('shimi');}
      else if(e.key==='ArrowUp'){e.preventDefault();goPrev('shimi');}
      return;}
    const cur=SHIDS.indexOf(form.shimi);
    if(e.key==='ArrowDown'){e.preventDefault();setForm(p=>({...p,shimi:SHIDS[Math.min(Math.max(cur,0)+1,SHIDS.length-1)]}));}
    else if(e.key==='ArrowUp'){e.preventDefault();setForm(p=>({...p,shimi:SHIDS[Math.max(cur-1,0)]}));}
    else if(e.key==='Enter'){e.preventDefault();setShowShPk(false);contRef.current?.focus();setKbField('note');}
    else if(e.key==='Escape'){e.preventDefault();setShowShPk(false);}
  };
  // ──────────────────────────────────────────────────────────

  // 代車期間チェック：スケジュール期間（入庫日→納車日）と代車の貸出期間の不一致を返す。
  // 一致・代車無し（代車削除でチェック解除）・レンタカーの場合は null。バナー表示と保存時確認で共用。
  const computeLoanerMismatch=()=>{
    if(pendingRentalId!=null)return null; // レンタカーは対象外
    const _idx=type==='insp'?(modalIdxProp??initialData?._idx??0):null;
    const curBk=type==='insp'?`insp-${modalDk}-${_idx}`:`sched-${modalDk}-${timeSlot}`;
    const origDk=originalDkRef.current;
    const origBk=(origDk&&origDk!==modalDk)?(type==='insp'?`insp-${origDk}-${_idx}`:`sched-${origDk}-${timeSlot}`):null;
    let loanFrom=null,loanTo=null;
    if(pendingLoanerData&&pendingLoanerId!=null){
      // ピック直後（未保存）＝ピッカーで選んだ期間
      const pd=pendingLoanerData;
      loanFrom=toNum(pd.startYear,pd.startMonth,pd.startDay);
      // ★終了日の「年月」は必ず終了側の値を使う。ここだけ開始側の年月に終了日を組み合わせて
      //   おり、月をまたぐ選択（例: 8/31〜9/1）を 8/31〜8/1 と誤って計算していた。
      //   その結果、期間が合っているのに「一致しません」と警告が出て、しかも文面の日付も
      //   間違っていた（2026-08-27にユーザーが報告）。保存されるデータ自体は正しい＝表示と
      //   判定だけの不具合。渡ってこない経路では従来どおり開始の年月にフォールバックする。
      loanTo=toNum(pd.endYear??pd.startYear,pd.endMonth??pd.startMonth,pd.endDay);
    }else{
      // 保存済み予約＝現在キー or 元キー（日付変更で移動する前）に一致する予約
      const wantKeys=[curBk,origBk].filter(Boolean);
      let r=null;
      for(const cid of Object.keys(loanerRes||{})){
        r=Object.values(loanerRes[cid]||{}).find(x=>wantKeys.includes(x.bookingKey));
        if(r)break;
      }
      if(r){loanFrom=toNum(r.fy,r.fm,r.fd);loanTo=toNum(r.ty,r.tm,r.td);}
    }
    if(loanFrom==null)return null; // 代車無し＝チェック対象外（代車削除で解除）
    // 予定期間は schedSpan（純関数・単体テスト済み）で求める。
    //   日付変更中は移動先の日付が車検日になる。
    const {from:schFrom,to:schTo}=schedSpan({
      inspDk: localTargetDkRef.current||modalDk,
      entryDate: form.entryDate,
      deliveryDate: form.deliveryDate,
      course: form.course,
    });
    if(schFrom==null||schTo==null)return null;
    if(loanFrom===schFrom&&loanTo===schTo)return null; // 一致
    return {schFrom,schTo,loanFrom,loanTo};
  };
  const _mmFmt=n=>n==null?'—':`${Math.floor(n/100)%100}/${n%100}`;
  // 保存前に代車期間のズレを確認（アラートのみ方針：同じ代車が空いているとは限らないため自動同期はしない）
  const confirmLoanerMismatch=()=>{
    const mm=computeLoanerMismatch();
    if(!mm)return true;
    // 日数も出す（「何日ズレているか」が一目で分かるように）。
    const _sd=spanDays(mm.schFrom,mm.schTo), _ld=spanDays(mm.loanFrom,mm.loanTo);
    return window.confirm(`⚠ 代車の期間がスケジュールと一致していません。\n\nスケジュール（入庫日→納車日）：${_mmFmt(mm.schFrom)}〜${_mmFmt(mm.schTo)}（${_sd}日間）\n代車の貸出期間　　　　　　：${_mmFmt(mm.loanFrom)}〜${_mmFmt(mm.loanTo)}（${_ld}日間）\n\nこのまま保存しますか？\n（代車を合わせるには「選択」で選び直し、代車が不要なら「削除」で外してください）`);
  };

  const handleSave=()=>{
    if(!form.name){alert('氏名を入力してください');nameRef.current?.focus();return;}
    if(!form.carType){alert('車種を入力してください');carRef.current?.focus();return;}
    if(isInsp){
      if(!form.course){alert('コースを選択してください');return;}
      if(!form.time){alert('入庫時間を入力してください');timeRef.current?.focus();return;}
    }else{
      if(!form.work){alert('作業内容を選択してください');workRef.current?.focus();return;}
    }
    if(!confirmLoanerMismatch())return; // ズレたまま保存の最終確認でキャンセル→中断
    onSave({...form, _targetDk: localTargetDkRef.current||'', _originalDk: originalDkRef.current||''});
  };
  // 顧客リストからの仮予約/本予約ボタン用
  const handleSaveAs=(status)=>{
    if(!form.name){alert('氏名を入力してください');nameRef.current?.focus();return;}
    // 本予約のみ車種・コース必須
    if(status==='confirmed'){
      if(!form.carType){alert('車種を入力してください');carRef.current?.focus();return;}
      if(!form.course){alert('コースを選択してください');return;}
    }
    // 本予約時のみ代車期間のズレを確認（仮予約は代車を確定しないためスキップ）
    if(status==='confirmed'&&!confirmLoanerMismatch())return;
    // 仮予約はモーダルを閉じない（_keepOpen フラグで制御）
    onSave({...form, bookingStatus:status, _keepOpen: status==='provisional'});
  };
  const handleDelete=()=>{onDelete();};
  const handleStaffBlur=()=>{const r=resolveStaff(staffInput);setStaffInput(r);setForm(p=>({...p,staff:r}));};
  const ke=(e,ref)=>{if(e.key==='Enter'){e.preventDefault();ref?.current?.focus();}};
  
  // 十字キーによるカーソル移動
  const handleArrowKey=(e)=>{
    if(!isInsp)return; // 車検のみ
    const refs=[nameRef,staffRef,carRef,tokutenRef,timeRef,noteRef];
    const currentIndex=refs.findIndex(r=>r.current===document.activeElement);
    if(currentIndex===-1)return;
    
    if(e.key==='ArrowUp'&&currentIndex>0){
      e.preventDefault();
      refs[currentIndex-1].current?.focus();
    }else if(e.key==='ArrowDown'&&currentIndex<refs.length-1){
      e.preventDefault();
      refs[currentIndex+1].current?.focus();
    }
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.35)',zIndex:1000,display:'flex',alignItems:'stretch',justifyContent:'flex-start'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="slide-in booking-modal-inner"
        style={{background:'white',width:'clamp(360px,90vw,560px)',height:'100vh',overflowY:'auto',boxShadow:'8px 0 32px rgba(0,0,0,0.22)',borderRight:`3px solid ${isInsp?'#9a3412':'#0891b2'}`}}>
        {/* パネルヘッダー */}
        <div style={{background:isInsp?'linear-gradient(135deg,#9a3412,#ea580c)':'linear-gradient(135deg,#0e7490,#0891b2)',padding:'16px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:20}}>
          <div>
            <div style={{color:'white',fontWeight:800,fontSize:16}}>{isInsp?'🚗 車検予約カード':'📋 一般予約カード'}</div>
            <div style={{color:'rgba(255,255,255,0.75)',fontSize:12,marginTop:2,position:'relative'}}>
              {(!isNew)?(<span onClick={()=>{if(!pickerMonth){const m=dateLabel.match(/(\d+)月(\d+)日/),now=new Date();setPickerMonth({year:now.getFullYear(),month:m?parseInt(m[1])-1:now.getMonth()});}setShowDatePicker(p=>!p);}} style={{cursor:'pointer',borderBottom:'1px dashed rgba(255,255,255,0.6)',paddingBottom:1}} title="クリックで日付変更">{dateLabel}</span>):dateLabel}
              {timeSlot?` / ${timeSlot}`:''}
              {showDatePicker&&pickerMonth&&(
                <div style={{position:'fixed',top:'100px',left:'20px',zIndex:9999,background:'white',borderRadius:10,boxShadow:'0 8px 30px rgba(0,0,0,0.25)',padding:12,minWidth:240}} onClick={e=>e.stopPropagation()}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                    <button onClick={()=>setPickerMonth(p=>{const d=new Date(p.year,p.month-1,1);return{year:d.getFullYear(),month:d.getMonth()};})} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#374151',lineHeight:1}}>‹</button>
                    <span style={{fontWeight:700,fontSize:13,color:'#1f2937'}}>{pickerMonth.year}年{pickerMonth.month+1}月</span>
                    <button onClick={()=>setPickerMonth(p=>{const d=new Date(p.year,p.month+1,1);return{year:d.getFullYear(),month:d.getMonth()};})} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#374151',lineHeight:1}}>›</button>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:2}}>
                    {['日','月','火','水','木','金','土'].map((d,i)=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:700,color:i===0?'#ef4444':i===6?'#2563eb':'#9ca3af',padding:'2px 0'}}>{d}</div>)}
                  </div>
                  {(()=>{const yr=pickerMonth.year,mo=pickerMonth.month,first=new Date(yr,mo,1).getDay(),days=new Date(yr,mo+1,0).getDate(),cells=[];for(let i=0;i<first;i++)cells.push(<div key={'e'+i}/>);for(let d=1;d<=days;d++){const dow=new Date(yr,mo,d).getDay(),dk2=`${yr}-${mo+1}-${d}`;cells.push(<div key={d} onClick={()=>{if(!originalDkRef.current){const m=dateLabel.match(/(\d+)月(\d+)日/),now=new Date();const y=now.getFullYear(),mo=m?parseInt(m[1]):now.getMonth()+1,d=m?parseInt(m[2]):now.getDate();originalDkRef.current=`${y}-${mo}-${d}`;}localTargetDkRef.current=dk2;onDateChange&&onDateChange(dk2);setShowDatePicker(false);}} style={{textAlign:'center',padding:'4px 2px',cursor:'pointer',fontSize:12,borderRadius:4,color:dow===0?'#ef4444':dow===6?'#2563eb':'#1f2937',fontWeight:600}} onMouseOver={e=>e.currentTarget.style.background='#f3f4f6'} onMouseOut={e=>e.currentTarget.style.background=''}>{d}</div>);}return <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:1}}>{cells}</div>;})()}
                  <button onClick={()=>setShowDatePicker(false)} style={{marginTop:8,width:'100%',padding:'4px',background:'#f3f4f6',border:'none',borderRadius:6,cursor:'pointer',fontSize:11,color:'#6b7280'}}>キャンセル</button>
                </div>
              )}
            </div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,0.15)',border:'none',borderRadius:'50%',width:32,height:32,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'white'}}><X size={16}/></button>
        </div>

        {/* ── リストからの場合：仮予約/本予約ボタンを最上部に固定 ── */}
        {isInsp&&fromCustList&&(
          <div style={{padding:'12px 16px',background:'#f8fafc',borderBottom:'1px solid #e2e8f0',display:'flex',gap:8}}
            onClick={e=>e.stopPropagation()}>
            <button onClick={e=>{e.stopPropagation();handleSaveAs('provisional');}}
              style={{flex:1,padding:'10px 4px',background:'linear-gradient(135deg,#16a34a,#15803d)',
                color:'white',border:'none',borderRadius:9,fontWeight:900,fontSize:12,
                cursor:'pointer',boxShadow:'0 2px 8px rgba(22,163,74,.3)',letterSpacing:'.2px'}}>
              📋 仮予約（保存・編集継続）
            </button>
            <button onClick={e=>{e.stopPropagation();handleSaveAs('confirmed');}}
              style={{flex:1,padding:'10px 4px',background:'linear-gradient(135deg,#1d4ed8,#1e40af)',
                color:'white',border:'none',borderRadius:9,fontWeight:900,fontSize:12,
                cursor:'pointer',boxShadow:'0 2px 8px rgba(29,78,216,.3)',letterSpacing:'.2px'}}>
              ✅ 本予約確定
            </button>
          </div>
        )}

        <div style={{padding:'16px 20px',display:'grid',gap:14}}>
          {/* 入庫日（車検日）— リスト画面からのみ表示・車検カレンダー */}
          {isInsp&&fromCustList&&(
            <div>
              <label style={LBL}>📅 入庫日（車検日） <span style={{fontWeight:400,color:'#9ca3af',fontSize:10}}>カレンダーから選択・空欄でも仮予約OK</span></label>
              {/* 選択済み日付の表示 */}
              {form._bookingDate&&(
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,padding:'7px 12px',background:'#dbeafe',border:'2px solid #3b82f6',borderRadius:8}}>
                  <span style={{fontWeight:800,color:'#1d4ed8',fontSize:13}}>📅 {form._bookingDate}</span>
                  <button onClick={()=>setForm({...form,_bookingDate:''})}
                    style={{marginLeft:'auto',padding:'2px 8px',background:'#ef4444',color:'white',border:'none',borderRadius:5,fontSize:11,cursor:'pointer',fontWeight:700}}>
                    ✕ クリア
                  </button>
                </div>
              )}
              {/* 車検カレンダー */}
              <InspCalendarPicker
                form={form} setForm={setForm}
                bmInspData={bmInspData}
                bmClosedDays={bmClosedDays}
                bmClosedDates={bmClosedDates}
                bmOverrideOpen={bmOverrideOpen}
                bmInspLimits={bmInspLimits}
              />
            </div>
          )}
          {/* 仮予約保存済みバナー */}
          {isInsp&&fromCustList&&form._savedAsProvisional&&(
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 14px',
              background:'#dcfce7',border:'2px solid #4ade80',borderRadius:9,
              color:'#166534',fontWeight:700,fontSize:12}}>
              ✅ 仮予約として保存しました。本予約確定を押すとスケジュールに登録されます。
            </div>
          )}
          {/* 時間変更（整備スケジュールのみ） */}
          {!isInsp&&(
            <div>
              <label style={LBL}>時間帯 <span style={{fontWeight:400,color:'#9ca3af',fontSize:10}}>変更する場合は選択</span></label>
              <select value={getBaseSlot(form._slot||timeSlot)}
                onChange={e=>setForm(p=>({...p,_slot:e.target.value}))}
                style={{...INP,fontWeight:700,color:'#0891b2'}}>
                {SCHED_SLOTS.map(s=><option key={s} value={s}>{specialSlotLabel(s)}</option>)}
              </select>
            </div>
          )}
          {/* 氏名 */}
          <div>
            <label style={LBL}>氏名 *</label>
            <input ref={nameRef} value={form.name} onChange={e=>setForm({...form,name:e.target.value})}
              onFocus={()=>setKbField('name')} onBlur={()=>setKbField('')}
              onKeyDown={e=>onKbNav(e,'name')} placeholder="お客様名" style={{...INP,...KB('name')}}/>
          </div>
          {/* 担当 */}
          <div>
            <label style={LBL}>担当 <span style={{fontWeight:400,color:'#9ca3af',fontSize:10}}>番号を打って Enter で名前に変わります・ダブルクリックで一覧</span></label>
            <input ref={staffRef} value={staffInput} onChange={e=>setStaffInput(e.target.value)}
              onFocus={()=>setKbField('staff')}
              onBlur={()=>{handleStaffBlur();setKbField('');}}
              onDoubleClick={()=>setShowStaff(p=>!p)}
              onKeyDown={e=>{
                if(e.key==='Enter'||e.key==='ArrowDown'){
                  e.preventDefault();
                  const r=resolveStaff(staffInput);
                  // 番号を打った1回目の Enter は、その場で担当者名に変えるだけ（欄から出ない）
                  if(e.key==='Enter'&&r&&r!==staffInput){ setStaffInput(r); setForm(p=>({...p,staff:r})); return; }
                  handleStaffBlur(); goNext('staff');
                }
                else if(e.key==='ArrowUp'){e.preventDefault();handleStaffBlur();goPrev('staff');}
              }}
              autoComplete="off" placeholder="担当者名 or 番号" style={{...INP,...KB('staff')}}/>
            {showStaff&&<div style={{display:'flex',gap:4,marginTop:5,flexWrap:'wrap'}}>
              {STAFF.map(s=><button key={s.id} onClick={()=>{setStaffInput(s.name);setForm(p=>({...p,staff:s.name}));setShowStaff(false);carRef.current?.focus();}} style={{padding:'2px 8px',fontSize:11,borderRadius:4,border:'1px solid #e5e7eb',cursor:'pointer',background:form.staff===s.name?'#c2410c':'white',color:form.staff===s.name?'white':'#374151'}}>{s.id}.{s.name}</button>)}
            </div>}
          </div>
          {/* 車種 */}
          <div>
            <label style={LBL}>車種</label>
            <input ref={carRef} value={form.carType} onChange={e=>setForm({...form,carType:e.target.value})}
              onFocus={()=>setKbField('car')} onBlur={()=>setKbField('')}
              onKeyDown={e=>onKbNav(e,'car')}
              placeholder="例：プリウス" style={{...INP,...KB('car')}}/>
          </div>
          {/* 電話・住所（任意・2026-09-20）：リストから予約した場合はリストの値が自動で入る。整備は電話だけ */}
          <div style={{display:'grid',gridTemplateColumns:isInsp?'1fr 1.5fr':'1fr',gap:8}}>
            <div>
              <label style={LBL}>電話 <span style={{fontWeight:400,color:'#9ca3af',fontSize:10}}>任意</span></label>
              <input value={form.phone||''} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="090-0000-0000" style={INP}/>   {/* PC では inputMode=tel を付けない：次の備考欄に移った時に日本語入力（ひらがな）が解除されるため（2026-09-23） */}
            </div>
            {isInsp&&<div>
              <label style={LBL}>住所 <span style={{fontWeight:400,color:'#9ca3af',fontSize:10}}>任意</span></label>
              <input value={form.address||''} onChange={e=>setForm({...form,address:e.target.value})} placeholder="市区町村から" style={INP}/>
            </div>}
          </div>
          {/* コース（車検） */}
          {isInsp&&(
            <div>
              <label style={LBL}>コース *</label>
              <div data-kbkey="course" tabIndex={0} onFocus={()=>{setKbField('course');if(!form.course)setForm(p=>({...p,course:COURSES[0].id}));}} onBlur={()=>setKbField('')}
                onKeyDown={onCourseKb}
                style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:7,outline:'none'}}>
                {COURSES.map(c=>(
                  <button key={c.id} tabIndex={-1} onClick={()=>{setForm({...form,course:c.id});}}
                    style={{padding:'10px 6px',borderRadius:9,
                      border:`2px solid ${form.course===c.id?c.color:'#e5e7eb'}`,
                      background:form.course===c.id?c.bg:'white',
                      color:form.course===c.id?c.color:'#6b7280',
                      fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:5,transition:'all .12s',
                      outline:kbField==='course'&&form.course===c.id?`3px solid ${c.color}`:'none',outlineOffset:'2px'}}>
                    <span style={{width:22,height:22,borderRadius:'50%',background:form.course===c.id?c.color:'#e5e7eb',color:form.course===c.id?'white':'#9ca3af',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:900,flexShrink:0}}>{c.initial}</span>
                    <span style={{fontSize:10}}>{c.name}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
          {/* 作業（整備） */}
          {!isInsp&&(
            <div>
              <label style={LBL}>作業内容</label>
              <div data-kbkey="work" tabIndex={0}
                onFocus={()=>setKbField('work')} onBlur={()=>{setKbField('');setTimeout(()=>setShowWkPk(false),150);}}
                onKeyDown={onWorkKb} onClick={()=>setShowWkPk(p=>!p)}
                style={{...INP,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',...KB('work')}}>
                <span style={{color:form.work?'#111':'#9ca3af'}}>
                  {form.work?(WORKS.find(w=>w.id===form.work)||{name:'未選択'}).name:'選択してください（Enterで開く）'}
                </span>
                <span style={{fontSize:10,color:'#6b7280'}}>{showWkPk?'▲':'▼'}</span>
              </div>
              {showWkPk&&(
                <div style={{border:'2px solid #0891b2',borderRadius:8,marginTop:4,maxHeight:180,overflowY:'auto',background:'white',boxShadow:'0 4px 12px rgba(0,0,0,0.15)'}}>
                  {WORKS.map((w,i)=>(
                    <div key={i} data-wkid={w.id}
                      onMouseDown={e=>{e.preventDefault();setForm(p=>({...p,work:w.id}));setShowWkPk(false);setKbField('shimi');}}
                      style={{padding:'8px 12px',cursor:'pointer',fontSize:13,
                        background:form.work===w.id?'#e0f2fe':'white',
                        fontWeight:form.work===w.id?700:400,
                        borderLeft:form.work===w.id?'3px solid #0891b2':'3px solid transparent'}}>
                      {w.id} {w.name}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          {/* 代車・レンタカー */}
          <div>
            <label style={LBL}>代車・レンタカー</label>
            <div style={{display:'flex',gap:7}}>
              {(()=>{
                const bk2=type==='insp'?`insp-${modalDk}-${modalIdxProp??initialData?._idx??0}`:`sched-${modalDk}-${timeSlot}`;
                // -- レンタカー選択済みの場合
                if(pendingRentalId!=null&&pendingRentalRec){
                  const rcar=(rentalCarsData||[]).find(c=>c.id===pendingRentalId)||{name:'レンタカー',num:''};
                  const rentalLabel=`🔑 ${rcar.name}${rcar.num?` (${rcar.num})`:''}`;
                  return(<>
                    <input value={rentalLabel} readOnly style={{...INP,flex:1,cursor:'pointer',background:'#f0fdf4',color:'#065f46',fontWeight:700}} onClick={()=>onOpenLoanerPicker({...form})}/>
                    <button onClick={()=>onOpenLoanerPicker({...form})} style={{padding:'0 12px',background:'#059669',color:'white',border:'none',borderRadius:7,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',fontSize:12}}>変更</button>
                    <button onClick={()=>onDeleteLoaner(pendingRentalId,modalDk,form.name,'rental')} style={{padding:'0 10px',background:'#ef4444',color:'white',border:'none',borderRadius:7,cursor:'pointer'}}>削除</button>
                  </>);
                }
                // -- 代車（従来ロジック）
                const dynamicLoaner=pendingLoanerId!=null
                  ?(()=>{const c=(allCars&&allCars.length?allCars:LOANERS).find(x=>String(x.id)===String(pendingLoanerId));return c?`${c.name} (${c.num})`:''})()
                  :getLoanerLabel(loanerRes,modalDk,form.name,bk2);
                const dynamicLoanerId=pendingLoanerId??getLoanerIdForRow(loanerRes,modalDk,form.name,bk2);
                // ⑤ 限定：保存済みの代車予約（bookingKey一致）を探し、その locked を切り替える
                const _lockResv=(dynamicLoanerId!=null&&pendingLoanerId==null)?Object.values(loanerRes[dynamicLoanerId]||{}).find(r=>r.bookingKey===bk2):null;
                // ★まだ保存していない（いま選んだばかりの）代車にも限定を付けられるようにする。
                //   従来は「保存済みの代車がある予約を開き直した時」だけ出ていたため、
                //   最初の予約では付けられず、保存→開き直しの2手間が必要だった
                //   （2026-08-27にユーザーが要望）。高さ制限などは最初から分かっているので、
                //   その場で付けられる方が自然。保存時に代車へ locked が一緒に書かれる。
                const _pendLock=(pendingLoanerData&&pendingLoanerId!=null)?pendingLoanerData:null;
                return(<>
                  <input value={dynamicLoaner} readOnly placeholder="管理表で選択" style={{...INP,flex:1,cursor:'pointer',background:'#fef9c3',color:dynamicLoaner?'#7c2d12':'#9ca3af'}} onClick={()=>onOpenLoanerPicker({...form,loaner:dynamicLoaner,loanerId:dynamicLoanerId})}/>
                  <button onClick={()=>onOpenLoanerPicker({...form,loaner:dynamicLoaner,loanerId:dynamicLoanerId})} style={{padding:'0 12px',background:'#0891b2',color:'white',border:'none',borderRadius:7,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',fontSize:12}}>選択</button>
                  {_pendLock&&onTogglePendingLoanerLock&&<button onClick={onTogglePendingLoanerLock}
                    title={_pendLock.locked?'限定を解除（最適化で動かせるようにする）':'この予約の車を限定（最適化で動かさない）'}
                    style={{padding:'0 10px',background:_pendLock.locked?'#7c2d12':'#f3f4f6',color:_pendLock.locked?'white':'#6b7280',border:'2px solid '+(_pendLock.locked?'#7c2d12':'#d1d5db'),borderRadius:7,cursor:'pointer',fontWeight:700,fontSize:11,whiteSpace:'nowrap'}}>
                    {_pendLock.locked?'🔒 限定中':'🔓 限定'}</button>}
                  {_lockResv&&onToggleLoanerLock&&<button onClick={()=>onToggleLoanerLock(dynamicLoanerId,_lockResv.id)}
                    title={_lockResv.locked?'固定を解除（最適化で動かせるようにする）':'この予約の車を固定（最適化で動かさない）'}
                    style={{padding:'0 10px',background:_lockResv.locked?'#7c2d12':'#f3f4f6',color:_lockResv.locked?'white':'#6b7280',border:`2px solid ${_lockResv.locked?'#7c2d12':'#d1d5db'}`,borderRadius:7,cursor:'pointer',fontWeight:700,fontSize:11,whiteSpace:'nowrap'}}>
                    {_lockResv.locked?'🔒 限定中':'🔓 限定'}</button>}
                  {dynamicLoaner&&<button onClick={()=>{
                    setForm({...form,loaner:'',loanerId:null});
                    if(dynamicLoanerId)onDeleteLoaner(dynamicLoanerId,modalDk,form.name);
                  }} style={{padding:'0 10px',background:'#ef4444',color:'white',border:'none',borderRadius:7,cursor:'pointer'}}>削除</button>}
                </>);
              })()}
            </div>
          </div>
          {/* 代車期間チェック：スケジュール期間（入庫日→納車日）と代車予約期間の不一致を警告（非ブロッキング・手動修正） */}
          {(()=>{
            const mm=computeLoanerMismatch();
            if(!mm)return null;
            return(
              <div style={{marginTop:-2,marginBottom:2,padding:'8px 11px',borderRadius:8,background:'#fffbeb',border:'2px solid #f59e0b',color:'#92400e',fontSize:12,lineHeight:1.55}}>

                      <div key={v}

            {(setItems||[]).length>0&&(
              <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}}>
                {(setItems||[]).map((si,i)=>{
                  const field=isInsp?'note':'content';
                  const cur=(isInsp?form.note:form.content)||'';
                  // ★挿入するテキストが空のアイテムは表示名をそのまま入れる（2026-09-19 報告：「部品手配OK」がテキスト未入力で無反応だった）
                  const txt=(si.text&&String(si.text).trim())?si.text:(si.label||'');
                  // 現在の内容にこのアイテムのテキストが含まれているか
                  const lines=cur.split('\n');
                  const isActive=!!(txt&&lines.includes(txt));
                  return(
                    <button key={si.id||i}
                      onClick={()=>{
                        if(isActive){
                          // 2回目：該当行を削除
                          const next=lines.filter(l=>l!==txt).join('\n');
                          setForm(p=>({...p,[field]:next}));
                        }else{
                          // 1回目：末尾に追記
                          if(!txt)return;
                          setForm(p=>({...p,[field]:cur?cur+'\n'+txt:txt}));
                        }
                      }}
                      style={{
                        display:'inline-flex',alignItems:'center',gap:5,
                        padding:'6px 14px',
                        background:isActive?'#d1fae5':'#ecfdf5',
                        border:`2px solid ${isActive?'#10b981':'#6ee7b7'}`,
                        borderRadius:20,
                        fontSize:13,fontWeight:700,

                        whiteSpace:'nowrap',
                        transition:'all 0.12s',

                    </button>
                  );
                })}
              </div>
            )}
            <textarea ref={isInsp?noteRef:contRef} value={isInsp?form.note:form.content}
              onChange={e=>setForm({...form,[isInsp?'note':'content']:e.target.value})}
              onFocus={()=>setKbField('note')} onBlur={()=>setKbField('')}
              onKeyDown={e=>{if(e.key==='ArrowUp'&&e.target.selectionStart===0){e.preventDefault();goPrev('note');}}}              
              rows={3} lang="ja" placeholder="メモや特記事項（クイックバッジはマウスで選択）" style={{...INP,resize:'vertical',minHeight:65,...KB('note')}}/>
          </div>
          {/* ボタン */}
          <div style={{display:'flex',flexDirection:'column',gap:8,paddingBottom:28}}>
            {(!isInsp||!fromCustList)&&(
              /* ── スケジュール画面 or 整備：通常ボタン ── */

                  {isInsp?(isNew?'📋 確定して登録':'💾 内容を保存する'):'✅ 予約確定'}

          </div>
        </div>

// ╚══════════════════════════════════════════════════════════════════╝

// limitFull: 台数制限を掛けた日で上限に達している場合の上限台数（そうでなければnull）。
//            追加行を「予約不可」にして新規入力自体をブロックする（制限を掛けていない日は従来どおり7台目=承認待ち）
// ★入庫済みチェック。氏名の左に置く小さな〇。押すと黄色地に赤チェックが点く。
//   「その車がもう入庫しているか」を誰が見ても分かるようにするための任意の印
//   （2026-08-27にユーザーが要望）。予約内容そのものには影響しない。
//   行のクリック（予約カードを開く）と取り違えないよう、押した時は伝播を止める。
const ArrivedCheck=({on,onToggle,size=17})=>(
  <span role="checkbox" aria-checked={on} tabIndex={0}
    title={on?'入庫済み（クリックで解除）':'入庫したらクリック'}
    onClick={e=>{e.preventDefault();e.stopPropagation();onToggle();}}
    onMouseDown={e=>{e.preventDefault();e.stopPropagation();}}
    onKeyDown={e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();e.stopPropagation();onToggle();}}}
    style={{width:size,height:size,flexShrink:0,borderRadius:'50%',cursor:'pointer',
      display:'inline-flex',alignItems:'center',justifyContent:'center',
      border:`2px solid ${on?'#dc2626':'#9ca3af'}`,
      background:on?'#fde047':'white',
      color:'#dc2626',fontWeight:900,fontSize:size-5,lineHeight:1,
      boxShadow:on?'0 0 0 2px rgba(253,224,71,.55)':'none',
      transition:'background .12s, border-color .12s'}}>{on?'✓':''}</span>
);

const InspRow=memo(({row,idx,dispNo,dk,onOpenModal,lockInfo,loanerRes,loanerResH,loanerResS,vsId,onApprove,onToggleArrived,isOverLimit,limitFull,setItems})=>{
  const cObj=row.course?COURSES.find(c=>c.id===row.course):null;
  const isEmpty=!row.name&&!row.staff&&!row.carType&&!row.course;
  const locked=lockInfo?.lockedBy;
  const bookingKey=`insp-${dk}-${idx}`;
  // row.storeに基づいてloanerResを選択（店舗切り替えで代車が変わらないようにする）
  const normRowStore=s=>{if(!s)return vsId;if(s==='honten'||s==='本店')return'honten';if(s==='sanda'||s==='三田店')return'sanda';return vsId;};
  const rowLoanerRes=(loanerResH&&loanerResS)
    ?(normRowStore(row.store)==='honten'?loanerResH:loanerResS)
    :loanerRes;
  const loanerLabel=getLoanerLabel(rowLoanerRes,dk,row.name,bookingKey);
  const loanerLocked=getLoanerLocked(rowLoanerRes,dk,row.name,bookingKey); // 限定＝最適化で動かさない
  // store正規化: 'honten'/'本店' → 'honten'、'sanda'/'三田店' → 'sanda'
  const normStore=s=>{if(!s)return'';if(s==='honten'||s==='本店')return'honten';if(s==='sanda'||s==='三田店')return'sanda';return s;};
  const rowStore=normStore(row.store);
  // 他店舗データ: 店舗が設定されていてかつ現在の店舗と異なる場合
  const otherStore=row.name&&rowStore&&rowStore!==vsId;
  const pending=row.pendingApproval;
  const approved=row.approved;
  const canApprove=pending&&vsId==='honten';
  // 承認待ち行は本店ユーザーが承認・編集できる必要があるため otherStore でブロックしない
  const limitBlocked=isEmpty&&limitFull!=null; // 台数制限の上限に達した日の追加行
  const blocked=(!isEmpty&&isOverLimit)||limitBlocked||locked||(otherStore&&!canApprove);
  const isCancelled=row.bookingStatus==='cancelled';

  const noteQItems=setItems||[];

  // 行背景：優先度 isOverLimit > pending > locked > bookingStatus stripe
  const rowBg = isOverLimit ? '#fef2f2'
    : isCancelled ? BOOKING_STATUS_STRIPE.cancelled
    : pending ? BOOKING_STATUS_STRIPE.provisional
    : approved ? BOOKING_STATUS_STRIPE.confirmed
    : locked ? '#fffbeb'
    : isEmpty ? (idx%2===0?'white':'#f8f7ff')
    : (row.bookingStatus&&BOOKING_STATUS_STRIPE[row.bookingStatus]) || (idx%2===0?'white':'#f8f7ff');

  return (
    <tr style={{background:rowBg,opacity:isCancelled?0.75:1}}>
      {/* ★No.欄をクリックすると入庫済みチェックが入る。氏名欄に置くと予約カードが開く
           誤操作のもとになるため、ここへ移した（2026-08-27にユーザーが要望）。 */}
      <td onClick={e=>{if(!isEmpty&&row.name&&onToggleArrived){e.preventDefault();e.stopPropagation();onToggleArrived(dk,idx);}}}
        title={!isEmpty&&row.name?(row.arrived?'入庫済み（クリックで解除）':'入庫したらクリック'):undefined}
        style={{...TD,cursor:!isEmpty&&row.name?'pointer':undefined,textAlign:'center',
          background:row.arrived?'#fde047':undefined,
          borderLeft:locked?'5px solid #f59e0b':`3px solid ${isOverLimit?'#fca5a5':isCancelled?'#dc2626':pending?'#f59e0b':row.store==='honten'?'#2563eb':row.store==='sanda'?'#dc2626':'#e5e7eb'}`}}>
        {row.arrived
          ? <span style={{fontWeight:900,color:'#dc2626',fontSize:15,lineHeight:1}}>✓</span>
          : <span style={{fontWeight:700,color:isOverLimit?'#dc2626':isCancelled?'#dc2626':pending?'#f59e0b':row.store==='honten'?'#2563eb':row.store==='sanda'?'#dc2626':'#6366f1',padding:'0 4px'}}>{dispNo!=null?dispNo:idx+1}</span>}
      </td>
      <td style={{...TD,cursor:blocked||isCancelled?'not-allowed':'pointer'}} onClick={()=>{if(!blocked&&!isCancelled)onOpenModal('insp',dk,idx,null,false);}}>
        {isOverLimit&&!isEmpty
         ?<div style={{padding:'3px 5px'}}>
            {row.name&&<div style={{fontWeight:600,color:'#6b7280',opacity:0.7}}>{row.name}</div>}
            <div style={{fontSize:10,color:'#ef4444',fontWeight:700,display:'flex',alignItems:'center',gap:3}}>🚫 台数制限超過・予約不可</div>
          </div>
         :isCancelled?<div style={{padding:'3px 5px'}}>
            <div style={{fontWeight:600,color:'#6b7280',textDecoration:'line-through'}}>{row.name}</div>
            <div style={{fontSize:10,color:'#dc2626',fontWeight:700,display:'flex',alignItems:'center',gap:4}}>
              ✗ キャンセル済
              <button onClick={e=>{e.stopPropagation();if(confirm(`「${row.name}」の予約を削除しますか？`))onOpenModal('insp',dk,idx,null,'delete');}}
                style={{padding:'1px 6px',background:'#dc2626',color:'white',border:'none',borderRadius:4,fontSize:9,cursor:'pointer',fontWeight:700}}>
                🗑
              </button>
            </div>
          </div>
         :locked?<div style={{padding:'3px 5px'}}>{row.name&&<div style={{fontWeight:600}}>{row.name}</div>}<LockBadge lockedBy={lockInfo.lockedBy} isNew={!row.name}/></div>
         :limitBlocked?<div style={{color:'#dc2626',fontSize:11,padding:'5px 7px',fontWeight:800,display:'flex',alignItems:'center',gap:4}}><span style={{fontSize:12}}>🚫</span>予約不可（台数制限 {limitFull}台に達しています）</div>
         :isEmpty?<div style={{color:'#475569',fontSize:11,padding:'5px 7px',fontStyle:'italic',fontWeight:600,display:'flex',alignItems:'center',gap:4}}><span style={{width:18,height:18,border:'2px dashed #94a3b8',borderRadius:3,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#475569',fontWeight:700}}>+</span>クリックして追加</div>
         :<div style={{padding:'3px 5px'}}>
              <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                <span style={{fontWeight:700,color:pending?'#6b7280':'#7c2d12',whiteSpace:'nowrap'}}>{row.name}</span>
                {row.store&&<span style={{padding:'1px 6px',borderRadius:20,fontSize:10,fontWeight:800,background:row.store==='honten'?'#2563eb':'#dc2626',color:'white',flexShrink:0,whiteSpace:'nowrap'}}>
                  {row.store==='honten'?'本店':'三田店'}
                </span>}
                {pending&&<span style={{padding:'1px 6px',borderRadius:20,fontSize:10,fontWeight:800,background:'#f59e0b',color:'white',flexShrink:0,whiteSpace:'nowrap'}}>承認待ち</span>}
                {approved&&!pending&&<span style={{padding:'1px 6px',borderRadius:20,fontSize:10,fontWeight:800,background:'#10b981',color:'white',flexShrink:0,whiteSpace:'nowrap'}}>承認済み</span>}
                {canApprove&&<button onClick={(e)=>{e.stopPropagation();onApprove(dk,idx);}} style={{padding:'2px 8px',background:'#10b981',color:'white',border:'none',borderRadius:5,fontSize:10,fontWeight:700,cursor:'pointer',flexShrink:0}}>✓ 承認</button>}
              </div>
              {row.staff&&<div style={{fontSize:12,color:pending?'#6b7280':'#374151'}}>{row.staff}</div>}
            </div>}
      </td>
      <td style={TD}><span style={{color:pending||isOverLimit||isCancelled?'#6b7280':'#374151',fontSize:13,fontWeight:700}}>{row.carType||'—'}</span>
        {row.phone&&<div style={{fontSize:11,color:pending||isOverLimit||isCancelled?'#9ca3af':'#0369a1',fontWeight:600,whiteSpace:'nowrap'}}>📞{row.phone}</div>}</td>
      <td style={TD}>{cObj&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:20,background:cObj.bg,color:cObj.color,fontWeight:700,fontSize:11,opacity:pending||isOverLimit||isCancelled?0.4:1}}><span style={{width:16,height:16,borderRadius:'50%',background:cObj.color,color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:900}}>{cObj.initial}</span>{cObj.name}</span>}</td>
      <td style={TD}><span style={{fontSize:12,color:row.rentalLabel?(pending||isOverLimit||isCancelled?'#6b7280':'#065f46'):(pending||isOverLimit||isCancelled?'#6b7280':'#374151'),fontWeight:400}}>
        {/* ★限定（この車でないとダメ）の代車は鍵マークを付ける。最適化で動かない印 */}
        {loanerLocked&&!row.rentalLabel&&<span title="限定：この代車は最適化で動かしません" style={{marginRight:3,fontSize:11}}>🔒</span>}
        {row.rentalLabel||loanerLabel||'—'}</span></td>
      <td style={TD}><span style={{fontSize:13,color:pending||isOverLimit||isCancelled?'#6b7280':'#374151'}}>{row.tokuten||'—'}</span></td>
      <td style={TD}>{(row.entryDate&&row.entryDate!==dk)?(()=>{const p=row.entryDate.split('-');const mmdd=String(p[1]).padStart(2,'0')+'/'+String(p[2]).padStart(2,'0');return <span title="事前入庫（入庫日）" style={{display:'inline-flex',flexDirection:'column',lineHeight:1.15}}><span style={{fontWeight:800,fontSize:12,color:pending||isOverLimit||isCancelled?'#9ca3af':'#c2410c',whiteSpace:'nowrap'}}>🚗{mmdd}</span>{row.time&&<span style={{fontSize:10,color:'#9ca3af'}}>{specialSlotLabel(row.time)}</span>}</span>;})():<span style={{fontWeight:600,fontSize:13,color:pending||isOverLimit||isCancelled?'#6b7280':'#374151'}}>{row.time||'—'}</span>}</td>
      <td style={TD}>{row.note
        ?<div style={{display:'flex',flexWrap:'wrap',gap:3,alignItems:'center'}}>
           {row.note.split('\n').map((line,i)=>{
             const m=noteQItems.find(si=>si.text&&si.text===line);
             return m
               ?<span key={i} style={{display:'inline-flex',alignItems:'center',padding:'1px 7px',background:'#ecfdf5',border:'1.5px solid #6ee7b7',borderRadius:20,fontSize:10,fontWeight:700,color:'#065f46',whiteSpace:'nowrap',opacity:pending||isOverLimit?0.5:1}}>{m.label}</span>
               :<span key={i} style={{fontSize:13,color:pending||isOverLimit||isCancelled?'#6b7280':'#374151'}}>{line}</span>;
           })}
         </div>
        :<span style={{color:pending||isOverLimit||isCancelled?'#6b7280':'#9ca3af'}}>—</span>}</td>
    </tr>
  );
});

// ============================================
//  入庫制限の内容ポップアップ（入庫制限バッジのホバー・制限網掛け行のホバーで共通に使う）
//  ※title属性のツールチップは表示まで約1秒かかるので使わない（即時表示のため自前で描画）
// ============================================
const RestrictionTip=({r,style})=>{
  const ex=Array.isArray(r.exemptWorks)?r.exemptWorks:[];
  const okWorks=WORKS.filter(w=>ex.includes(w.id));
  const ngCount=WORKS.length-okWorks.length;
  return(
    <div style={{position:'absolute',zIndex:9999,width:250,background:'white',border:'2px solid #ef4444',borderRadius:10,
      boxShadow:'0 10px 30px rgba(0,0,0,0.22)',padding:'10px 12px',pointerEvents:'none',...style}}>
      <div style={{fontWeight:800,fontSize:12,color:'#dc2626',marginBottom:7}}>🚫 入庫制限 {r.startTime}〜{r.endTime}</div>
      <div style={{fontSize:11,fontWeight:800,color:'#047857',marginBottom:5}}>✅ この時間帯に入庫できる作業</div>
      {okWorks.length===0
        ?<div style={{fontSize:11,color:'#6b7280'}}>なし（すべて入庫できません）</div>
        :<ul style={{margin:0,paddingLeft:16,display:'flex',flexDirection:'column',gap:4}}>
          {okWorks.map(w=>(
            <li key={w.id} style={{color:'#047857'}}>
              <span style={{display:'inline-block',padding:'2px 8px',background:'#ecfdf5',border:'1px solid #6ee7b7',borderRadius:20,fontSize:10,fontWeight:800,color:'#047857'}}>{w.name}</span>
            </li>
          ))}
        </ul>}
      <div style={{marginTop:8,fontSize:10,color:'#6b7280'}}>上記以外（{ngCount}件）は入庫制限中です</div>
    </div>
  );
};

// ============================================
//  SchedRow
// ============================================
const SchedRow=memo(({row,slot,baseSlot,isFirstSub,dk,onOpenModal,lockInfo,loanerRes,vsId,restriction,setItems,onToggleArrived})=>{
  const [showRestrTip,setShowRestrTip]=useState(false);
  const isEmpty=!row.name&&!row.staff&&!row.carType&&!row.work;
  const locked=lockInfo?.lockedBy;
  const isHour=(baseSlot||slot).endsWith(':00');
  const isSub=slot!==baseSlot;
  const _normStore3=s=>{if(!s)return'';if(s==='honten'||s==='本店')return'honten';if(s==='sanda'||s==='三田店')return'sanda';return s;};
  const otherStore=row.name&&_normStore3(row.store)&&_normStore3(row.store)!==vsId;
  const bookingKey=`sched-${dk}-${slot}`;
  const loanerLabel=getLoanerLabel(loanerRes,dk,row.name,bookingKey);
  const loanerLocked=getLoanerLocked(loanerRes,dk,row.name,bookingKey); // 限定＝最適化で動かさない

  const isRestricted=!!(()=>{
    try{
      if(!restriction||!restriction.startTime||!restriction.endTime)return false;
      const toMin=(t)=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
      const slotMin=toMin(baseSlot||slot);
      return slotMin>=toMin(restriction.startTime)&&slotMin<toMin(restriction.endTime);
    }catch(e){return false;}
  })();

  const contentQItems=setItems||[];

  // 制限時間帯でも「制限解除の作業」の予約が入っている行は、入庫時間の欄だけ制限色を残し、
  // 案件の内容は白背景にして「この予約は入庫できる案件」と一目で分かるようにする
  const restrExempt=isRestricted&&!!row.name&&Array.isArray(restriction.exemptWorks)&&restriction.exemptWorks.includes(row.work);
  const rowBgSched=restrExempt?'white'
    :isRestricted?'#fee2e2'
    :locked?'#fffbeb':row.store==='sanda'?'#fff0f0':row.store==='honten'?'#eff6ff':isHour?'white':'#f0feff';

  return (
    <tr id={isFirstSub?'sched-slot-'+(baseSlot||slot).replace(':',''):undefined}
      onMouseEnter={()=>{if(isRestricted)setShowRestrTip(true);}}
      onMouseLeave={()=>{if(isRestricted)setShowRestrTip(false);}}
      style={{background:rowBgSched,cursor:locked||otherStore?'not-allowed':'pointer'}}
      onClick={()=>{if(!locked&&!otherStore){const _e=!row.name;onOpenModal('sched',dk,null,slot,_e);}}}>
      <td onClick={e=>{if(row.name&&onToggleArrived){e.preventDefault();e.stopPropagation();onToggleArrived(dk,slot);}}}
        title={row.name?(row.arrived?'入庫済み（クリックで解除）':'入庫したらクリック'):undefined}
        style={{...TD,position:'relative',width:50,maxWidth:50,cursor:row.name?'pointer':undefined,textAlign:row.arrived?'center':undefined,background:row.arrived?'#fde047':(isRestricted?'#fee2e2':undefined),fontWeight:isFirstSub&&(isHour||isSpecialSlot(baseSlot))?800:600,color:isFirstSub&&isSpecialSlot(baseSlot)?'#9333ea':(isFirstSub?'#0891b2':'#7dd3fc'),whiteSpace:isSpecialSlot(baseSlot)?'normal':'nowrap',lineHeight:isSpecialSlot(baseSlot)?1.12:undefined,paddingLeft:6,paddingRight:3,fontSize:isFirstSub&&isSpecialSlot(baseSlot)?10:(isFirstSub&&isHour?14:11),borderLeft:isSub?'3px solid #7dd3fc':''}}>
        {/* ★時刻欄をクリックすると入庫済みチェックが入る（氏名欄だと予約カードが開くため） */}
        {row.arrived
          ? <span style={{fontWeight:900,color:'#dc2626',fontSize:15,lineHeight:1}}>✓</span>
          : (isFirstSub?(isSpecialSlot(baseSlot)?specialSlotLabel(baseSlot):slot):<span style={{fontSize:9,color:'#a5f3fc'}}>↳</span>)}
        {/* 制限網掛けの上にマウスが来たら即座に同じポップアップを出す（title属性は表示が遅いので使わない） */}
        {isRestricted&&showRestrTip&&<RestrictionTip r={restriction} style={{top:'100%',left:0,marginTop:2}}/>}
      </td>
      <td style={TD}>
        {locked?<div style={{padding:'3px 5px',borderLeft:'5px solid #f59e0b',marginLeft:-8,paddingLeft:8}}>{row.name&&<div style={{fontWeight:600}}>{row.name}</div>}<LockBadge lockedBy={lockInfo.lockedBy} isNew={!row.name}/></div>
         :isEmpty?<div style={{color:'#475569',fontSize:11,padding:'5px 7px',fontStyle:'italic',fontWeight:600,display:'flex',alignItems:'center',gap:4}}><span style={{width:18,height:18,border:'2px dashed #94a3b8',borderRadius:3,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#475569',fontWeight:700}}>+</span>クリックして追加</div>
         :<div style={{padding:'3px 5px'}}>
              <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'nowrap'}}>
                <span style={{fontWeight:600,color:'#1e293b',whiteSpace:'nowrap'}}>{row.name}</span>
                {row.store&&<span style={{padding:'1px 6px',borderRadius:20,fontSize:10,fontWeight:800,background:row.store==='honten'?'#2563eb':'#dc2626',color:'white',flexShrink:0,whiteSpace:'nowrap'}}>
                  {row.store==='honten'?'本店':'三田店'}
                </span>}
              </div>
              {row.staff&&<div style={{fontSize:12,color:'#374151'}}>{row.staff}</div>}
            </div>}
      </td>
      <td style={TD}><span style={{color:'#374151',fontSize:13,fontWeight:700}}>{row.carType||'—'}</span>
        {row.phone&&<div style={{fontSize:11,color:'#0369a1',fontWeight:600,whiteSpace:'nowrap'}}>📞{row.phone}</div>}</td>
      <td style={TD}>{row.work?<WorkBadge id={row.work} dim={locked||otherStore}/>:<span style={{fontSize:13,color:'#374151'}}>—</span>}</td>
      <td style={TD}><span style={{fontSize:12,color:row.rentalLabel?'#065f46':'#374151',fontWeight:400}}>
        {/* ★限定（この車でないとダメ）の代車は鍵マークを付ける。最適化で動かない印 */}
        {loanerLocked&&!row.rentalLabel&&<span title="限定：この代車は最適化で動かしません" style={{marginRight:3,fontSize:11}}>🔒</span>}
        {row.rentalLabel||loanerLabel||'—'}</span></td>
      <td style={TD}><span style={{fontSize:13,color:'#374151'}}>{row.shimi||'—'}</span></td>
      <td style={TD}>{row.content
        ?<div style={{display:'flex',flexWrap:'wrap',gap:3,alignItems:'center'}}>
           {row.content.split('\n').map((line,i)=>{
             const m=contentQItems.find(si=>si.text&&si.text===line);
             return m
               ?<span key={i} style={{display:'inline-flex',alignItems:'center',padding:'1px 7px',background:'#ecfdf5',border:'1.5px solid #6ee7b7',borderRadius:20,fontSize:10,fontWeight:700,color:'#065f46',whiteSpace:'nowrap'}}>{m.label}</span>
               :<span key={i} style={{fontSize:13,color:'#374151'}}>{line}</span>;
           })}
         </div>
        :<span style={{color:'#9ca3af'}}>—</span>}</td>
    </tr>
  );
});


// ============================================
//  タイヤ種別一括編集モーダル
// ============================================
const TIRE_TYPES=[
  {id:'summer', label:'夏タイヤ',  icon:'夏', color:'#ffffff', bg:'#ef4444', border:'#dc2626'},
  {id:'winter', label:'冬タイヤ',  icon:'冬', color:'#ffffff', bg:'#2563eb', border:'#1d4ed8'},
];
const TireEditModal=memo(({isOpen,onClose,allCarsH,allCarsS,rentalCars,tireData,onSave})=>{
  const [local,setLocal]=useState({});
  useEffect(()=>{if(isOpen)setLocal({...tireData});},[isOpen,tireData]);
  if(!isOpen)return null;
  const allGroups=[
    {label:'🚗 本店 代車',cars:allCarsH,color:'#2563eb'},
    {label:'🚗 三田店 代車',cars:allCarsS,color:'#dc2626'},
    {label:'🔑 レンタカー',cars:rentalCars,color:'#059669'},
  ];
  const handleSave=()=>{onSave(local);onClose();};
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:4500,display:'flex',alignItems:'center',justifyContent:'center',padding:12}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="modal-box"
        style={{background:'white',borderRadius:14,width:'min(580px,96vw)',maxHeight:'90vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 60px rgba(0,0,0,0.35)'}}>
        <div style={{padding:'18px 22px 14px',background:'linear-gradient(135deg,#f59e0b,#d97706)',borderRadius:'14px 14px 0 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
