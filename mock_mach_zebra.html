<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>モック：マッハ車検の網掛けを斜めゼブラに戻す</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#334155;font-family:'Yu Gothic UI','Meiryo',sans-serif;color:#0f172a}
  .pick{position:sticky;top:0;z-index:50;background:#0f172a;color:white;padding:9px 14px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid #475569}
  .pick b{font-size:13px}
  .seg{display:inline-flex;border:2px solid #64748b;border-radius:9px;overflow:hidden}
  .seg button{padding:6px 13px;border:none;background:white;color:#475569;font-size:12.5px;font-weight:800;
    cursor:pointer;font-family:inherit}
  .seg button.on{background:#E8492E;color:white}
  .pick label{font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .note{font-size:11.5px;color:#cbd5e1}
  .win{margin:10px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .head{display:flex;align-items:center;gap:10px;padding:6px 12px;color:white;
    background:linear-gradient(135deg,#1e3a8a,#1d4ed8)}
  .head .l{flex:1;min-width:0;display:flex;align-items:center;gap:9px;overflow:hidden}
  .head .l b{font-size:15px}
  .head .l span{font-size:12.5px;opacity:.95;white-space:nowrap}
  .scroll{max-height:62vh;overflow:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
  th,td{border:1px solid #d7dde5;font-size:11.5px;vertical-align:middle;height:26px;padding:1px 3px;position:relative}
  th{padding:5px 4px;font-size:11px;font-weight:800;white-space:nowrap;background:#f1f5f9;position:sticky;top:0;z-index:4}
  .tm{width:54px;background:#f8fafc;font-size:11px;font-weight:800;color:#475569;text-align:center;white-space:nowrap}
  tr.h0 td{background:#e6f6fb}
  tr.h0 td.tm{background:#cfeef7}
  tr.sp td{background:#f0fdf4}
  tr.sp td.tm{background:#047857;color:white}
  td.ins{background:#fff7ed;padding:3px}
  td.tm.ins{color:#9a3412}
  td.stf{background:#f8fafc;text-align:center;padding:3px;line-height:1;border-bottom:4px double #334155}
  td.tm.stf{border-bottom:4px double #334155}
  .td0{border-left:3px solid #c2410c}.td1{border-right:3px solid #c2410c}
  th.today{background:#ffedd5;border-top:3px solid #c2410c}
  .dbadge{display:inline-block;padding:1px 9px;border-radius:10px;background:#0f766e;color:white;font-weight:900}
  .dplain{display:inline-block;padding:1px 9px;border-radius:10px;background:#fff;border:1px solid #cbd5e1}
  .sun{color:#dc2626}.sat{color:#2563eb}
  .grp{display:flex;gap:10px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:1px 0}
  .col{display:grid;grid-template-rows:repeat(2,19px);grid-auto-flow:column;gap:2px}
  .cb{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:5px;
    color:white;font-size:11px;font-weight:900}
  .cb.plus{background:white;color:#c2410c;border:1.5px dashed #fb923c;font-size:12px}
  .sb{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 2px;
    border-radius:4px;font-size:10px;font-weight:800;background:#e2e8f0;color:#334155;margin:0 1px}
  .ent{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
  .wk{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;
    color:white;font-size:9.5px;font-weight:900;flex-shrink:0}
  .add{color:#cbd5e1;text-align:center;font-size:11px;display:block}
  /* ★入庫制限のセル。下地はごく薄い赤、その上に斜めゼブラを重ねる */
  td.rst{background:var(--base)!important}
  .zb{position:absolute;inset:0;pointer-events:none;z-index:1;
    background-image:repeating-linear-gradient(45deg,var(--stripe) 0 var(--w),transparent var(--w) calc(var(--w)*2))}
  .machlab{position:relative;z-index:2;font-size:9.5px;font-weight:900;color:#b91c1c;padding-left:2px}
  .cap{color:#e2e8f0;font-size:12.5px;margin:0 12px 10px;line-height:1.7}
  .cap b{color:white}
</style>
</head>
<body>

<div class="pick">
  <b>ゼブラの濃さ</b>
  <span class="seg" id="segC">
    <button data-c="rgba(220,38,38,.10)" data-b="#fffafa">ごく薄い</button>
    <button data-c="rgba(220,38,38,.16)" data-b="#fff5f5" class="on">薄い</button>
    <button data-c="rgba(220,38,38,.24)" data-b="#fff1f1">ふつう</button>
    <button data-c="rgba(220,38,38,.34)" data-b="#ffecec">はっきり</button>
  </span>
  <b>線の太さ</b>
  <span class="seg" id="segW">
    <button data-w="3px">細い</button>
    <button data-w="5px" class="on">ふつう</button>
    <button data-w="7px">太い</button>
  </span>
  <b>つなぎ目</b>
  <span class="seg" id="segA">
    <button data-a="1" class="on">そろえる</button>
    <button data-a="0">そろえない（前のズレ方）</button>
  </span>
  <span class="note">※ 10:00〜11:00 のように :00 と :30 が続く所で見比べてください。スクロールしても崩れません。</span>
</div>

<div class="win">
  <div class="head">
    <div class="l"><b>⏰ タイムスケジュール（週）</b><span>本店</span><span>10/19（月） 〜 10/25（日）</span></div>
  </div>
  <div class="scroll" id="sc"><table id="tbl"></table></div>
</div>
<div class="cap">
  <b>マッハ車検の入庫制限</b>：10/19 は 10:00〜11:00（1時間＝枠2つ）、10/20 は 10:00〜11:00 と 14:00〜15:00、10/23 は手で入れた 13:00〜14:30（枠3つ）。<br>
  「そろえない」に切り替えると、<b>枠の境目で模様が段違いになる</b>のが分かります（v3.72 でゼブラをやめた理由）。
</div>

<script>
var DAYS=[['10/19','月'],['10/20','火'],['10/21','水'],['10/22','木'],['10/23','金'],['10/24','土'],['10/25','日']];
var TODAY=2;
var INSP=[[['マ',1]],[['マ',2]],[],[['ク',3]],[['ク',1]],[['レ',3]],[['ク',1]]];
var COL={'マ':'#b91c1c','ク':'#1d4ed8','レ':'#d97706'};
// 入庫制限：日の番号 → その日の制限の枠（先頭の枠に「マッハ車検」と出す）
var RST={0:{'10:00':'マッハ車検','10:30':''},
         1:{'10:00':'マッハ車検','10:30':'','14:00':'マッハ車検','14:30':''},
         4:{'13:00':'','13:30':'','14:00':''}};
var SCH={0:{'09:00':['Q','#0891b2','川上','オイル交換'],'15:30':['B','#7c3aed','西村','鈑金 左前']},
         2:{'09:00':['Q','#0891b2','朝一','エンジンオイル交換'],'13:00':['B','#7c3aed','昼一','鈑金']},
         5:{'09:30':['納','#16a34a','大山','納車']}};
var TIMES=['09:00','09:30','10:00','10:30','11:00','11:30','午前入庫','13:00','13:30','14:00','14:30',
           '15:00','15:30','16:00','16:30','17:00','17:30','18:00','午後入庫','時間未定'];
var SPECIAL={'午前入庫':1,'午後入庫':1,'時間未定':1};
var align=true;

function colCls(i){ return (i===TODAY?' td0 td1':''); }
function build(){
  var h='<thead><tr><th class="tm"></th>';
  for(var i=0;i<7;i++){
    var d=DAYS[i], cls=(i===TODAY?'today':'')+colCls(i);
    var inner=(i===TODAY)?'<span class="dbadge">'+d[0]+'（'+d[1]+'）</span>'
      :'<span class="dplain'+(d[1]==='日'?' sun':(d[1]==='土'?' sat':''))+'">'+d[0]+'（'+d[1]+'）</span>';
    h+='<th class="'+cls.trim()+'">'+inner+'</th>';
  }
  h+='</tr></thead><tbody>';
  h+='<tr><td class="tm ins">車検</td>';
  for(var i=0;i<7;i++){
    var g='<div class="grp">';
    for(var k=0;k<INSP[i].length;k++){
      g+='<div class="col">';
      for(var m=0;m<INSP[i][k][1];m++) g+='<span class="cb" style="background:'+COL[INSP[i][k][0]]+'">'+INSP[i][k][0]+'</span>';
      g+='</div>';
    }
    g+='<div class="col"><span class="cb plus">＋</span></div></div>';
    h+='<td class="ins'+colCls(i)+'">'+g+'</td>';
  }
  h+='</tr><tr><td class="tm stf">出勤</td>';
  for(var i=0;i<7;i++) h+='<td class="stf'+colCls(i)+'"><span class="sb">江</span><span class="sb">竹</span></td>';
  h+='</tr>';
  for(var r=0;r<TIMES.length;r++){
    var slot=TIMES[r], sp=!!SPECIAL[slot], half=(slot.indexOf(':00')>0);
    h+='<tr class="'+(sp?'sp':(half?'h0':''))+'"><td class="tm">'+slot+'</td>';
    for(var i=0;i<7;i++){
      var rst=(RST[i]||{})[slot];
      var e=(SCH[i]||{})[slot];
      var inner=e
        ? '<div class="ent" style="position:relative;z-index:2"><span class="wk" style="background:'+e[1]+'">'+e[0]+'</span><b>'+e[2]+'</b>'
          +'<span style="color:#64748b">'+e[3]+'</span></div>'
        : '<span class="add" style="position:relative;z-index:2">＋</span>';
      var zb=(rst!==undefined)?'<span class="zb"></span>':'';
      var lab=rst?'<span class="machlab">'+rst+'</span>':'';
      h+='<td class="'+(rst!==undefined?'rst':'')+colCls(i)+'">'+zb+lab+inner+'</td>';
    }
    h+='</tr>';
  }
  document.getElementById('tbl').innerHTML=h+'</tbody>';
  phase();
}
// ★つなぎ目をそろえる：模様の周期で、そのセルの位置ぶんだけ背景をずらす
//   斜め45度の模様は、縦にも横にも「線の太さ×2×√2」で繰り返す。
//   セルが下に Δ ずれていれば背景を Δ 戻せば、1枚の紙に描いたのと同じ見え方になる。
function phase(){
  var w=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--w'))||5;
  var p=w*2*Math.SQRT2;
  var base=document.getElementById('tbl').getBoundingClientRect();
  [].forEach.call(document.querySelectorAll('.zb'),function(z){
    if(!align){ z.style.backgroundPosition='0 0'; return; }
    var r=z.getBoundingClientRect();
    var x=-(((r.left-base.left)%p)+p)%p, y=-(((r.top-base.top)%p)+p)%p;
    z.style.backgroundPosition=x.toFixed(2)+'px '+y.toFixed(2)+'px';
  });
}
function setVar(k,v){ document.documentElement.style.setProperty(k,v); }
document.getElementById('segC').addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if(!b)return;
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('on');});
  b.classList.add('on'); setVar('--stripe',b.dataset.c); setVar('--base',b.dataset.b);
});
document.getElementById('segW').addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if(!b)return;
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('on');});
  b.classList.add('on'); setVar('--w',b.dataset.w); phase();
});
document.getElementById('segA').addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if(!b)return;
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('on');});
  b.classList.add('on'); align=(b.dataset.a==='1'); phase();
});
window.addEventListener('resize',phase);
setVar('--stripe','rgba(220,38,38,.16)'); setVar('--base','#fff5f5'); setVar('--w','5px');
build();
</script>
</body>
</html>
