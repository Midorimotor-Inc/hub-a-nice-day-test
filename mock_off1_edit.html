function fit(rows){
  var area=document.getElementById('area'), g=document.getElementById('grid'), s=document.getElementById('side');
  var ch=Math.max(66,(area.clientHeight-16-44)/rows), avail=area.clientWidth-36-s.offsetWidth-12;
  g.style.width=Math.min(avail,Math.max(720,Math.round(ch*1.25*7)))+'px';

// マスに入りきらない予定は「＋n件」にまとめる
function trim(){
  document.querySelectorAll('#grid .c[data-d]').forEach(function(c){
    var n=0, scs=c.querySelectorAll('.sc');
    if(!scs.length)return;
    var i=scs.length-1;
    while(c.scrollHeight>c.clientHeight+1&&i>=0){scs[i].remove();i--;n++;
      var m=c.querySelector('.more'); if(!m){m=document.createElement('span');m.className='more';c.appendChild(m);}
      m.textContent='＋'+n+'件';
    }
  });
}

function setOff(d,k){
  if(!canEdit()){toast('ほかの人の休日は入れられません（見るだけ）');return;}
  if(closed(d)){toast('店の休業日には入れられません');return;}
  var dk=dkOf(d);

  else{OFF[who][dk]=k;if(k==='tr')delete NOTE[who+'/'+dk];}

function dayClick(e,root){
  var t=e.target, d=selDay;
  if(t.closest('[data-x]')){closeDay();return;}
  var b=t.closest('[data-set]'); if(b){setOff(d,b.dataset.set);refreshDay();return;}
  if(t.closest('[data-add]')){form={d:d,title:'',time:'',end:'',memo:'',priv:false};refreshDay();var i=document.querySelector('[data-f="title"]');if(i)i.focus();return;}
  b=t.closest('[data-edit]'); if(b){var x=SC.find(function(s){return s.id==b.dataset.edit;});form={d:d,id:x.id,title:x.title,time:x.time||'',end:x.end||'',memo:x.memo||'',priv:!!x.priv};refreshDay();return;}
  b=t.closest('[data-priv]'); if(b){readForm(root);form.priv=b.dataset.priv==='1';refreshDay();return;}
  if(t.closest('[data-cancel]')){form=null;refreshDay();return;}
  if(t.closest('[data-del]')){SC=SC.filter(function(s){return s.id!==form.id;});form=null;refreshDay();toast('予定を削除しました（モック）');return;}
  if(t.closest('[data-save]')){readForm(root);
    if(!form.title.trim()){toast('件名を入れてください');return;}
    var rec={dk:dkOf(d),time:form.time.trim(),end:form.end.trim(),title:form.title.trim(),memo:form.memo.trim(),owner:ME,priv:form.priv};
    if(form.id){var o=SC.find(function(s){return s.id===form.id;});Object.assign(o,rec);}else{rec.id=nextId++;SC.push(rec);}
    form=null;refreshDay();toast('予定を保存しました（モック）');return;}
}
