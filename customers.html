// 入庫日をGASキー形式（ゼロなし）に変換
const toDk=d=>{if(!d)return'';const p=String(d).split('-');return p.length===3?`${p[0]}-${parseInt(p[1])}-${parseInt(p[2])}`:d;};
// ★同期チェックの見はじめ（2026-09-30 ユーザー指示）。
//   スケジュールを使い始めたのが 2026/9/22。それより前の車検は当時スケジュールに入れていないので、
//   同期チェックに出すと毎回「反映漏れ」として並んでしまう（本番で33件）。
//   ここより前は数えない。顧客ファイルの中身（予約済の印・集計）は触らないので、
//   この日付を戻せばまた出るようになる。
const SYNC_FROM_DK='2026-9-22';
const _dkNum=dk=>{const p=String(dk||'').split('-');return p.length<3?0:Number(p[0])*10000+Number(p[1])*100+Number(p[2]);};
const inSyncRange=d=>{const dk=toDk(d);return !!dk&&_dkNum(dk)>=_dkNum(SYNC_FROM_DK);};

// ═══════════════════════════════════════════
// メインアプリ
// ═══════════════════════════════════════════
const App=()=>{
  // index.htmlのlocalStorageからログインユーザーを取得
  const currentUser=useMemo(()=>{
    try{const u=sessionStorage.getItem('hub_currentUser');
      const p=u?JSON.parse(u):null;
      // スケジュール側でログインした人の利用証を、この画面の通信にも載せる
      if(p&&p.name)hubUse(p.name);
      return p;}catch{return null;}
  },[]);
  const [files,setFiles]=useState([]);
  const filesRef = useRef([]); // setFilesと同期して常に最新値を保持
  const recentImportRef = useRef({});   // この画面で取り込んだ直後のファイル名（一覧に載る前に消されないように）
  useEffect(()=>{filesRef.current=files;},[files]); // 初回ロード含めfilesを常にfilesRefへ反映（最初の予約でchangedFileがnullになりリスト未保存になるのを防ぐ）
  const pollUpdatesRef = useRef(null);
  const reconcileRef = useRef(null); // スケジュール→リスト突き合わせ（自己修復）
  const [activeIdx,setActiveIdx]=useState(0);
  // ── 横断検索の索引（v2.98）──
  const [cfxRows,setCfxRows]=useState(null);     // null=まだ読んでいない／[]=索引が無い
  const [cfxMeta,setCfxMeta]=useState(null);
  const [cfxQ,setCfxQ]=useState('');
  const [cfxBusy,setCfxBusy]=useState(false);
  useEffect(()=>{ (async()=>{
    try{ const r=await cfxLoad(sGet); if(r){setCfxRows(r.rows);setCfxMeta(r.meta);} else setCfxRows([]); }
    catch(e){ setCfxRows([]); }
  })(); },[]);
  // 索引を作り直す（取り込み・削除のあとに自動で。手動ボタンもある）
  const cfxRebuild=useCallback(async(fileList)=>{
    const list=(fileList||filesRef.current||[]).filter(f=>f&&Array.isArray(f.customers)&&f.customers.length);
    if(!list.length){setCfxRows([]);setCfxMeta(null);return null;}
    setCfxBusy(true);
    try{
      const meta=await cfxBuild(list,sSet);
      const r=await cfxLoad(sGet);
      if(r){setCfxRows(r.rows);setCfxMeta(r.meta);}
      return meta;
    }catch(e){ console.warn('[CFX] 索引を作れません',e&&e.message); return null; }
    finally{ setCfxBusy(false); }
  },[]);
  const [search,setSearch]=useState('');
  const [filterStatus,setFilterStatus]=useState('all');
  // ★スケジュール画面の「検索」から開かれた時（2026-09-19）：sessionStorage の指示で、そのファイルを開いて名前で絞る
  // ★検索から別タブで開かれた時は URL（?find=氏名&file=月）で絞り込む。
  //   同じタブ内で開く従来の経路（sessionStorage）も残す（2026-09-30）。
  const findReqRef=useRef((()=>{
    try{
      const sp=new URLSearchParams(location.search);
      const q=sp.get('find')||'';
      if(q)return{q,file:sp.get('file')||'',ts:Date.now()};
    }catch(e){}
    try{const v=JSON.parse(sessionStorage.getItem(STOR+'cust-find')||'null');sessionStorage.removeItem(STOR+'cust-find');return(v&&v.q&&Date.now()-(v.ts||0)<60000)?v:null;}catch(e){return null;}
  })());
  useEffect(()=>{ const req=findReqRef.current; if(!req||!Array.isArray(files)||!files.length)return; const i=files.findIndex(f=>f&&f.name===req.file); if(i<0)return; findReqRef.current=null; setActiveIdx(i); setSearch(req.q); },[files]);
  // ★同じタブの中で開いたまま隠されている時、スケジュール側から「この人で絞り込んで」と届く（2026-09-30）
  useEffect(()=>{
    const onMsg=(e)=>{
      if(e.origin!==location.origin)return;
      const d=e.data;
      if(!d||d.type!=='hub-cust-find'||!d.q)return;
      const i=(files||[]).findIndex(f=>f&&f.name===d.file);
      if(i>=0)setActiveIdx(i);
      setFilterStatus('all');
      setSearch(d.q);
    };
    window.addEventListener('message',onMsg);
    return()=>window.removeEventListener('message',onMsg);
  },[files]);
  const [gasOk,setGasOk]=useState(null);
  const [gasLoading,setGasLoading]=useState(true);
  // サーバーから本体をまだ読み終えていない顧客ファイルの数。0になるまで「読み込み中」を出し続ける。
  // （以前は一覧(cf-index)を受け取った時点で案内を消していたため、ファイルが並ぶ前に
  //   「インポートしてください」と出てしまい、読み込み済みなのに取り込み直す誤解を招いた）

          // 保存後にGASを読み返して実反映を確認（sSetはno-corsで失敗を検知できないため）。
          // 未反映なら最大3回再試行。成否をbooleanで返し、確認できたファイルの通知だけをキューから消す。
          const saveChunkVerified=async(f)=>{
            for(let _a=0;_a<3;_a++){
              try{
                // ★サーバーの現在値を先に読み、中身が変わったチャンクだけ書く。
                //   従来は prev=null で毎回3チャンク（各40KB）を丸ごと書き直しており、
                //   1件の予約通知を受けるたびにGASのロック(25秒・全書き込み共通)を
                //   1分以上占有していた。＝他の保存が巻き添えで遅くなる/溢れる原因。
                //   通知の送り主がすでに保存済みなら書き込みは0本で済む。
                //   欠けている(_complete===false)時だけは全部書き直して修復する。
                const _cur=await loadFileChunked(f.name).catch(()=>null);
                await saveFileChunked(f,(_cur&&_cur._complete!==false)?_cur.customers:null);
                try{localStorage.setItem(STOR+'cf-'+safeName(f.name),JSON.stringify(f));}catch(e){}
                await new Promise(r=>setTimeout(r,2000));
                const chk=await loadFileChunked(f.name);
                const okAll=chk&&Array.isArray(chk.customers)&&fresh.every(u=>{
                  if(!appliedTs.has(u.ts))return true;
                  const c=chk.customers.find(x=>(u.custId&&x.custId===u.custId)||(x.name===u.name&&String(x.no||'')===String(u.no||'')));
                  if(!c)return true; // このファイルの顧客でなければ対象外
                  const{custId:_,name:__,no:___,ts:____,...sf}=u;
                  return Object.keys(sf).every(k=>String(c[k]??'')===String(sf[k]??''));
                });
                if(okAll)return true;
                console.warn('[SYNC] chunk保存 未反映 retry',_a+1,f.name);
              }catch(e){console.error('[SYNC] chunk保存エラー:',e);}
            }
            console.error('[SYNC] chunk保存がGASに反映できませんでした:',f.name);
            return false;
          };
          // 先にローカル状態を更新（即時反映）。GAS保存の確認は後で行い、確認できた通知だけ消す。
          const next=filesRef.current.map(f=>{
            if(!changedFiles.has(f.name))return f;
            const custs=f.customers.map(c=>{
              const upd=findUpd(c);
              if(!upd)return c;
              // statusとextraFieldsのみ更新（他フィールドは保護）
              const{custId:_,name:__,no:___,ts:____,...safeFields}=upd;
              return{...c,...safeFields};
            });
            return{...f,customers:custs};
          });
          filesRef.current=next; // filesRef同期
          setFiles(next);
          // ★体感速度優先: ローカル適用の時点で「反映中」バッジを即クリア＋完了フラッシュを出す。
          //   GAS保存の確認(数秒)は待たせない。__appliedUpdTsにも即追加し、次ポーリングでの
          //   再処理・再フラッシュを防ぐ。
          //   信頼性: キューからの削除だけは保存確認後(verifiedTs)に限定。未確認はキューに残り、
          //   saveChunkVerified自体の3回読み返し再試行＋リロード時の再適用で最終的に必ず反映される。
          appliedTs.forEach(ts=>window.__appliedUpdTs.add(ts));
          setPendingSync(prev=>{
            const n={...prev};
            fresh.forEach(u=>{if(appliedTs.has(u.ts))delete n[u.custId||`${u.name}__${u.no}`];});
            return n;
          });
          const doneItems=fresh.filter(u=>appliedTs.has(u.ts)).map(u=>({name:u.name,entryDate:u.entryDate}));
          if(doneItems.length>0){
            const _fts=Date.now();
            setSyncFlash({items:doneItems,ts:_fts});
            setTimeout(()=>setSyncFlash(f=>(f&&f.ts===_fts)?null:f),4000);
            // 反映された行をハイライト（どの顧客が変わったか一目で分かるように）
            const _keys=fresh.filter(u=>appliedTs.has(u.ts)).map(u=>u.custId||`${u.name}__${u.no}`);
            setRecentApplied(prev=>{const n={...prev};_keys.forEach(k=>{n[k]=_fts;});return n;});
            setTimeout(()=>setRecentApplied(prev=>{
              const n={...prev};_keys.forEach(k=>{if(n[k]===_fts)delete n[k];});return n;
            }),4500);
          }
          // ★GAS保存＋読み返し確認は背景で実行（バッジ表示はもう待たせない）。確認できた月の
          //   通知だけをキューから消す。未確認はキューに残してリロード時に再試行する。
          const okFiles=new Set();
          await Promise.all([...changedFiles].map(async fn=>{
            const f=next.find(x=>x.name===fn);
            if(f&&await saveChunkVerified(f))okFiles.add(fn);
          }));
          verifiedTs=new Set([...appliedTs].filter(ts=>{
            const fs=tsFiles[ts];return fs&&[...fs].every(fn=>okFiles.has(fn));
          }));
        }
        // ★GAS反映を確認できた通知のみキューから削除。未確認・未マッチは残して次回再試行。
        //   無ts(旧式)と60日超(最終backstop)だけ掃除。キャンセル通知が7日で消えて反映漏れが
        //   恒久化していた不具合の対策として、保持期間を7日→60日へ延長。
        const remaining=arr.filter(u=>{
          if(u.ts&&verifiedTs.has(u.ts))return false;
          if(!u.ts||Date.now()-u.ts>60*24*60*60*1000)return false;
          // 宛先の顧客がリストに存在しない通知は、10分待っても適用先が現れなければ捨てる
          //（スケジュールで手入力された予約のキャンセル通知など。放置すると60日間キューに残り続ける）
          if(!matchesCust(u)&&Date.now()-u.ts>10*60*1000){
            console.warn('[SYNC] 宛先不明の通知を破棄:',u.name);
            return false;
          }
          return true;
        });
        if(remaining.length!==arr.length)await sSet(STOR+'cust-updates',remaining.length>0?remaining:[]);
      }catch{}finally{window.__pollUpdatesBusy=false;}
    };
    pollUpdatesRef.current=pollUpdates;
    pollUpdates(); // 開いた瞬間に即時適用
    const pollTimer=setInterval(pollUpdates,15000);
    // ★Firestore：通知キュー(cust-updates)と顧客ファイル一覧(cf-index)を購読しておく。
    //   以後の sGet は手元の最新値を返すので、15秒ごとの読みはサーバーに行かず、変更は即座に届く。
    const unLive=fbLive([STOR+'cust-updates',STOR+'cf-index'],()=>{ try{ pollUpdates(); }catch(e){}
      // 他のPCがファイルを消したら、この画面からもすぐ下ろす（2026-09-23）
      try{ sGet(STOR+'cf-index').then(v=>pruneMissingRef.current&&pruneMissingRef.current(v)).catch(()=>{}); }catch(e){}
    });
    return()=>{ clearInterval(pollTimer); unLive(); };
  },[]);

  // ── 他のPCが取り込んだ顧客ファイルを自動で拾う（60秒ごと） ──
  // 「一度読み込んだら開いた人全員で共有」を、開き直さなくても成立させるための取り込み。
  // 起動時の1回きりだと、AさんがインポートしてもBさんの画面は再読み込みまで増えなかった。
  useEffect(()=>{
    const pickup=async()=>{
      if(__saveCount>0||(window.__hubWriteBusy||0)>0)return; // 自分が保存中はさわらない
      const idx=await sGet(STOR+'cf-index');
      if(!Array.isArray(idx))return;
      pruneMissing(idx);
      if(idx.length===0)return;
      const have=new Set((filesRef.current||[]).map(f=>f.name));
      for(const fi of idx){
        if(have.has(fi.name))continue;
        const f=await loadFileChunked(fi.name).catch(()=>null);
        if(!f)continue;
        if(f._complete===false){setCfWarn(prev=>prev.includes(fi.name)?prev:[...prev,fi.name]);continue;}
        try{localStorage.setItem(STOR+'cf-'+safeName(f.name),JSON.stringify(f));}catch(e){}
        setFiles(prev=>{
          if(prev.some(p=>p.name===f.name))return prev;
          const next=[...prev,f];filesRef.current=next;return next;
        });
      }
    };
    const t=setInterval(pickup,60000);
    return()=>clearInterval(t);
  },[pruneMissing]);

  // 画面復帰時（タブ切替・スリープ復帰）に即時リフレッシュ
  useEffect(()=>{
    const onVisible=()=>{
      if(document.visibilityState!=='visible')return;
      if(pollUpdatesRef.current) pollUpdatesRef.current();
      sGet(STOR+'insp').then(v=>{if(v&&typeof v==='object')setInspData(v);});
      // 丸ごと置き換えずマージする（保存直後の代車が一瞬消えるのを防ぐ）
      sGet(storKey('lres','honten')).then(v=>{if(v&&typeof v==='object'&&!Array.isArray(v))setLoanerResH(prev=>mergeSharedObjects(prev||{},v,Date.now()));});
      sGet(storKey('lres','sanda')).then(v=>{if(v&&typeof v==='object'&&!Array.isArray(v))setLoanerResS(prev=>mergeSharedObjects(prev||{},v,Date.now()));});
      // 突き合わせ自己修復（GASから最新inspを読み直して照合）
      setTimeout(()=>{if(reconcileRef.current)reconcileRef.current();},2500);
    };
    document.addEventListener('visibilitychange',onVisible);
    return()=>document.removeEventListener('visibilitychange',onVisible);
  },[]);

  // ── スケジュール→リスト突き合わせ（自己修復）──────────────────────
  // 同期通知（cust-updates）が通信障害・旧コード端末などで失われても、リスト起動時と
  // 画面復帰時にスケジュール(insp)の実予約と照合し、ズレた本予約の入庫日・コース・
  // 入庫時間を自動修正して収束させる。statusは変更しない（キャンセル等の判断は同期チェックの領分）。
  const reconcileListWithInsp=useCallback(async()=>{
    try{
      if(__saveCount>0)return;
      if(Date.now()-(window.__lastReconcile||0)<15000)return; // 15秒スロットル
      window.__lastReconcile=Date.now();
      const files=filesRef.current||[];
      if(!files.length)return;
      // 必ずGASから最新inspを読む（手元の古いinspDataで逆方向に巻き戻さないため）
      const inspObj=await sGet(STOR+'insp');
      if(!inspObj||typeof inspObj!=='object')return; // 読めない時は何もしない
      // custId→最新のアクティブinsp行（キャンセル除外・同一顧客はseq最大を採用）
      const byCust={};
      for(const dk of Object.keys(inspObj)){
        const rows=inspObj[dk];
        if(!Array.isArray(rows))continue;
        rows.forEach(r=>{
          if(!r||!r.custId||!r.name||r.bookingStatus==='cancelled')return;
          const prev=byCust[r.custId];
          if(!prev||(r.seq||0)>(prev.r.seq||0))byCust[r.custId]={r,dk};
        });
      }
      const pad=(dk)=>{const p=String(dk).split('-').map(Number);return(p.length===3&&!isNaN(p[0]))?`${p[0]}-${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')}`:String(dk);};
      const fixFor=(c)=>{
        const hit=byCust[c.custId];
        if(!hit)return null;
        const ed=pad(hit.dk),r=hit.r;
        const upd={};
        if(c.entryDate!==ed){upd.entryDate=ed;upd.linkedInspDate=ed;}
        if(r.course!=null&&Number(c.course)!==Number(r.course))upd.course=Number(r.course)||0;
        const bt=r.time||r.bookingTime||'';
        if(bt&&c.bookingTime!==bt)upd.bookingTime=bt;
        return Object.keys(upd).length?upd:null;
      };
      const changedFiles=new Set();
      const fixedItems=[];
      const fixedByCustId={};
      const next=files.map(f=>{
        let changed=false;
        const custs=f.customers.map(c=>{
          if(!c||c.status!=='confirm'||!c.custId)return c;
          const upd=fixFor(c);
          if(!upd)return c;
          changed=true;changedFiles.add(f.name);
          fixedByCustId[c.custId]=upd;
          fixedItems.push({name:c.name,entryDate:upd.entryDate||c.entryDate,key:c.custId});
          return{...c,...upd};
        });
        return changed?{...f,customers:custs}:f;
      });
      if(changedFiles.size===0)return;
      filesRef.current=next;
      setFiles(next);
      console.log('[RECONCILE] スケジュールに合わせてリスト修正:',fixedItems.map(i=>i.name).join('・'));
      // 完了フラッシュ＋行ハイライト（どこが直ったか見えるように）
      const _fts=Date.now();
      setSyncFlash({items:fixedItems.map(i=>({name:i.name,entryDate:i.entryDate})),ts:_fts});
      setTimeout(()=>setSyncFlash(f=>(f&&f.ts===_fts)?null:f),4000);
      setRecentApplied(prev=>{const n={...prev};fixedItems.forEach(i=>{n[i.key]=_fts;});return n;});
      setTimeout(()=>setRecentApplied(prev=>{const n={...prev};fixedItems.forEach(i=>{if(n[i.key]===_fts)delete n[i.key];});return n;}),4500);
      // 変更ファイルを保存。GAS最新とマージし、直した顧客のフィールドだけ上書き（他端末の更新を消さない）
      for(const f of next){
        if(!changedFiles.has(f.name))continue;
        try{
          const latest=await loadFileChunked(f.name);
          const base=(latest&&Array.isArray(latest.customers))?latest.customers:f.customers;
          const merged=base.map(c=>(c&&c.custId&&fixedByCustId[c.custId])?{...c,...fixedByCustId[c.custId]}:c);
          await saveFileChunked({...f,customers:merged});
          try{localStorage.setItem(STOR+'cf-'+safeName(f.name),JSON.stringify({...f,customers:merged}));}catch(e){}
        }catch(e){console.error('[RECONCILE] 保存エラー:',e);}
      }
    }catch(e){console.error('[RECONCILE] エラー:',e);}
  },[]);
  reconcileRef.current=reconcileListWithInsp;
  // 起動時にも一度実行（チャンク読込完了を待って20秒後）
  useEffect(()=>{
    const t=setTimeout(()=>{if(reconcileRef.current)reconcileRef.current();},20000);
    return()=>clearTimeout(t);
  },[]);

  // Excelインポート
  const handleImport=useCallback(async e=>{
    const fileList=Array.from(e.target.files||[]);
    if(!fileList.length)return;
    setImporting(true);
    try{
      const results=await Promise.all(fileList.map(parseExcelFile));
      // まず画面とローカルキャッシュを更新（体感速度）。共有の実体はこの後GASへ書く。
      const next=[...filesRef.current];
      results.forEach(r=>{
        const i=next.findIndex(f=>f.name===r.name);
        if(i>=0)next[i]=r;else next.push(r);
        try{localStorage.setItem(STOR+'cf-'+safeName(r.name),JSON.stringify({name:r.name,customers:r.customers}));}catch(_e){}
      });
      filesRef.current=next;
      setFiles(next);
      // ★GASへは1ファイルずつ順番に保存し、着地を読み返しで確認する。
      //   以前は全ファイルを並列に投げっぱなしにしており、GASのロックを奪い合って
      //   後続の書き込みが無言で捨てられ、開き直すと取り込んだ月が消えていた。
      const failed=[];
      // ★取り込みを始める前に所要時間を伝えて、了解を取ってから走る。
      //   GASへの書き込みは1本あたり15〜30秒の固定コスト（データ量とほぼ無関係）で、
      //   100人ごとに1本＋ファイルごとに索引1本＋最後に一覧1本を書く。複数ファイルだと
      //   数分かかるので、黙って始めると「固まった」と誤解され、途中で閉じられて
      //   保存が失われる（2026-08-24にユーザーから指摘）。
      const _bars=results.reduce((a,r)=>a+Math.ceil(r.customers.length/CHUNK_SIZE),0);
      const _writes=_bars+results.length+1;
      const _mins=Math.max(1,Math.ceil(_writes*25/60));
      const _colReport=results.map(r=>{
        const c=r.cols||{};
        const line=nm=>(x,h)=>`${nm} ${x}件${h?`（列「${h}」）`:'（列が見つかりません）'}`;
        return `・「${r.name}」${r.customers.length}件\n`+
          `    ${line('入庫日')(c.entryCount||0,c.entryHeader)}${(!c.entryCount&&c.entrySample)?`　※ 値の例「${c.entrySample}」を日付として読めません`:''}\n`+
          `    ${line('満期')(c.expiryCount||0,c.expiryHeader)}\n`+
          `    ${line('電話')(c.phoneCount||0,c.phoneHeader)}\n`+
          `    ${line('住所')(c.addressCount||0,c.addressHeader)}`;
      }).join('\n');
      const _missing=results.filter(r=>!(r.cols&&r.cols.entryHeader));
      if(!window.confirm(
        `${results.map(r=>`「${r.name}」${r.customers.length}件`).join('、')} を取り込みます。\n\n`+
        `▼ 読めた内容（元ファイルの列）\n${_colReport}\n\n`+
        (_missing.length?`⚠ ${_missing.map(r=>'「'+r.name+'」').join('')}に入庫日の列が見つかりません。元ファイルの見出し（入庫日・車検日など）をご確認ください。\n\n`:'')+
        `サーバーへの保存に【約${_mins}分】かかります（保存${_writes}回 × 15〜30秒）。\n`+
        `画面に「保存中」と残りが出ます。終わるまでこの画面を閉じたり再読み込みしないでください。\n\n`+
        `開始しますか？`)){
        setImportMsg('');setImporting(false);e.target.value='';return;
      }
      const _t0=Date.now();
      let _doneWrites=0;
      // 残り時間は「1本25秒」の見込みと実測の平均で出す（進むほど実測に寄る）。
      const _remain=()=>{
        const left=Math.max(0,_writes-_doneWrites);
        const per=_doneWrites>0?(Date.now()-_t0)/_doneWrites:25000;
        const m=Math.ceil(left*per/60000);
        return m<=1?'あと1分ほど':`あと約${m}分`;
      };
      setImportMsg(`保存中 … 全${_writes}本 / 約${_mins}分`);
      for(let i=0;i<results.length;i++){
        const r=results[i];
        setImportMsg(`保存中 (${i+1}/${results.length}) ${r.name} … ${_remain()}`);
        let ok=false;
        // ★GASが遅いので1本あたり15〜30秒かかる。止まって見えないよう本数と残り時間を出す。
        const onStep=(n,total,last)=>{
          _doneWrites++;
          setImportMsg(`保存中 (${i+1}/${results.length}) ${r.name} … ${last?'仕上げ':`${n}/${total}本目`} / ${_remain()}`);
        };
        try{
          // 中身が変わったチャンクだけ書く（同じ月の入れ直しは差分だけで済み、大幅に速い）。
          const _prev=await loadFileChunked(r.name).catch(()=>null);
          ok=await saveFileChunked(r,(_prev&&_prev._complete!==false)?_prev.customers:null,onStep);
        }catch(_e){ok=false;}
        if(!ok)failed.push(r.name);
      }
      // 一覧(cf-index)には「確実に保存できたファイル」だけを載せる。
      // 失敗した分を載せると、他のPCが開いた時に中身の無いファイル名だけが見える状態になる。
      setImportMsg('一覧を更新中…');
      results.forEach(r=>{ recentImportRef.current[r.name]=Date.now(); });   // 一覧に載る前に prune されないように
      const okFiles=next.filter(f=>!failed.includes(f.name));
      const idxOk=await saveFilesIndex(okFiles);
      setImportMsg('');
      if(failed.length||!idxOk){
        setCfWarn(prev=>[...new Set([...prev,...failed])]);
        alert(`⚠ 保存できなかったファイルがあります
${failed.length?failed.map(n=>'「'+n+'」').join('、'):'一覧の更新に失敗しました'}

他のPCからは見えない状態です。通信が混み合っている可能性があるので、少し待ってからもう一度取り込んでください。`);
      }else{
        setCfWarn([]);
        cfxRebuild(okFiles);   // 横断検索の索引を作り直す（v2.98）
        alert(`${results.map(r=>`「${r.name}」${r.customers.length}件`).join('、')} をインポートしました。
保存を確認しました（開いた人全員のPCに共有されます）。`);
      }
    }catch(err){setImportMsg('');alert('インポートエラー: '+err.message);}
    setImporting(false);
    e.target.value='';
  },[]);

  // ファイル削除
  const handleDeleteFile=useCallback(async(idx)=>{
    const deletedFile=files[idx];
    if(!deletedFile)return;
    if(!confirm(`「${deletedFile.name}」${deletedFile.customers.length}件を削除します。\n\nサーバーからも消えるので、他のPC・スマホからも見えなくなります。\n（戻すには、もう一度ファイルを取り込んでください）\n\n削除しますか？`))return;
    delete recentImportRef.current[deletedFile.name];
    const next=files.filter((_,i)=>i!==idx);
    filesRef.current=next;
    setFiles(next);
    deleteFileFromCache(deletedFile);
    setActiveIdx(p=>Math.max(0,p>=idx?p-1:p));
    setImportMsg(`「${deletedFile.name}」を削除中…`);
    try{
      await saveFilesIndex(next,{remove:[deletedFile.name]});   // 一覧から外す（これで他のPCからも消える）
      await deleteFileOnServer(deletedFile.name,(n,total)=>setImportMsg(`「${deletedFile.name}」を削除中… ${n}/${total}`));
      setImportMsg('');
      cfxRebuild(next);   // 横断検索の索引も作り直す（v2.98）
    }catch(e){
      setImportMsg('');
      alert('⚠ 削除の途中で通信に失敗しました。\nもう一度お試しください（一覧からは外れています）。');
    }
  },[files]);

  // 予約保存（スケジュール・代車に連動）
  // キャンセルから未予約に復活
  const handleRevive=useCallback((customer)=>{
    if(!confirm(`「${customer.name}」をキャンセルから未予約に戻しますか？`))return;
    const revived={...customer,status:'none',entryDate:'',linkedInspDate:'',
      bookingTime:'',course:'',tokuten:'',staff:'',note:''};
    setFiles(prev=>{
      const next=prev.map(f=>{
        const ci=f.customers.findIndex(c=>c.custId===customer.custId);
        if(ci<0)return f;
        const custs=[...f.customers];
        custs[ci]=revived;
        saveFileChunked({...f,customers:custs});
        return{...f,customers:custs};
      });
      return next;
    });
    // cust-updatesからキャンセル通知を削除（ポーリングで再cancelされないよう）
    sGet(STOR+'cust-updates').then(updates=>{
      if(!Array.isArray(updates)||updates.length===0)return;
      const filtered=updates.filter(u=>
        !(u.custId&&u.custId===customer.custId)&&
        !(u.name&&u.name===customer.name&&String(u.no||'')===String(customer.no||''))
      );
      if(filtered.length!==updates.length)sSet(STOR+'cust-updates',filtered);
    }).catch(()=>{});
  },[]);

  // スケジュール(insp)をGASへ保存し、反映状況をトーストで可視化する。
  // sSetのawaitはGASが実際に書き終えた応答で解決するので「解決＝反映完了」。
  // 30秒(GASロック最大25秒＋余裕)を超えても未解決なら「遅延・再試行」を表示。
  // スケジュール(insp)をGASへ保存。体感を最短にするため、書き込み送信(sSet)が完了した時点で
  // すぐ「完了」を表示し、返すPromiseもそこで resolve する（予約処理は先へ進む）。
  // 実際に保存されたかの読み返し検証はバックグラウンドで行い、万一サーバーが受け付けていなければ
  // 「完了」を「エラー」に自動訂正＋再送する（速度を優先しつつデータ消失は検知する設計）。
  const saveInspWithStatus=useCallback((data,name,verify)=>{
    const start=()=>{
      // ★楽観的UI: 書込の往復(約0.7秒)を待たず、その場で即「反映しました」を表示して体感を即時化。
      //   実保存はバックグラウンドで読み返し検証し、未反映なら再送→最終的に失敗した時のみ
      //   「エラー」に訂正する（速度を優先しつつデータ消失は必ず検知する設計）。
      setSyncToast({status:'done',name});
      setTimeout(()=>setSyncToast(s=>(s&&s.status==='done'&&s.name===name)?null:s),4000);
      // 読み返し検証＋自動再送（完全バックグラウンド）。GAS書き込み完了を待って1.5秒後に確認。
      // 反映済み→何もしない（既に「完了」表示）。未反映→再送（最大2回）。最終的に未反映なら
      // 「完了」を「エラー」に訂正。読み返し自体の失敗も「未確認」として成功側に倒さない。
      const verifyBg=async(attempt)=>{
        await new Promise(r=>setTimeout(r,1500));
        let ok=false;
        try{
          const rb=await sGet(STOR+'insp');
          if(rb&&typeof rb==='object'){
            const rows=rb[verify.dk]||[];
            ok=rows.some(r=>r&&(verify.custId?r.custId===verify.custId:(r.name===verify.name&&String(r.no||'')===String(verify.no||''))));
          }
        }catch(e){}
        if(ok)return; // 反映確認OK → 既に出している「完了」のままでよい
        if(attempt<2){await sSet(STOR+'insp',data);return verifyBg(attempt+1);} // 未反映→再送
        setSyncToast({status:'error',name,retry:start}); // 最終的に未反映 → 「完了」をエラーに訂正
      };
      const p=sSet(STOR+'insp',data);
      p.then(()=>{
        inspWriteRef.current=Date.now(); // 保護延長
        if(verify&&verify.dk)verifyBg(0); // 裏で実反映を検証。失敗時のみ上で「エラー」に訂正
      }).catch(()=>{
        setSyncToast({status:'error',name,retry:start});
      });
      return p; // ★呼び出し側はsSet解決で先へ進む（検証待ちを待たない）
    };
    return start();
  },[]);

  const handleBookingSave=useCallback(async(form,customer)=>{
    // ★保存の入口から最後までを数える。スケジュール(insp)の書き込みを待っている間はまだ
    //   裏の保存が始まっておらず、カウンタだけ見ると0になる瞬間がある。その隙にオーバーレイを
    //   閉じられると、続くリスト・custbk・通知の保存が丸ごと死ぬ（実測で再現）。
    const _bg=[]; // 裏で走らせる保存。全部終わってからカウンタを戻す
    try{ window.__hubBusyOps=(window.__hubBusyOps||0)+1; }catch(_e){}
    try{
    const{entryDate,store,bookingTime,course,tokuten,staff,note,isTemp,selCarId,selDays,selLocked,preEntry,deliveryDate,deliveryTime}=form;
    const status=isTemp?'temp':'confirm';
    // ★同じ車の予約が別の日にも入っている時は、移すのか・両方残すのかを尋ねる（2026-10-04 現場報告）。
    //   custId が合う行はこれまでどおり黙って移す（同じ予約の入れ直しなので）。
    let movePerson=true;
    const _oldSpots=[];   // 外す古い予約の場所（代車を消すのに使う）。by:'id'=custIdで一致、'person'=同じ車
    if(entryDate&&!isTemp){
      const _p=String(entryDate).split('-');
      const _dkF=_p.length===3?`${_p[0]}-${parseInt(_p[1])}-${parseInt(_p[2])}`:entryDate;
      const others=findOtherDayRows(hotInsp,customer,_dkF);
      // custId で見つかる古い行（別の日）＝同じ予約の入れ直し。これは黙って外れる
      Object.keys(hotInsp||{}).forEach(d=>{
        if(d===_dkF||!Array.isArray(hotInsp[d]))return;
        (hotInsp[d]||[]).forEach((r,i)=>{
          if(!r||!r.name||r.bookingStatus==='cancelled')return;
          if(customer.custId&&r.custId===customer.custId)_oldSpots.push({dk:d,idx:i,by:'id'});
        });
      });
      others.forEach(o=>_oldSpots.push({dk:o.dk,idx:o.idx,by:'person'}));
      if(others.length>0){
        const _lab=d=>{const q=String(d).split('-').map(Number);const dd=new Date(q[0],q[1]-1,q[2]);
          return `${q[1]}/${q[2]}（${['日','月','火','水','木','金','土'][dd.getDay()]}）`;};
        movePerson=window.confirm(
          `${customer.name} 様（${customer.carType||''}）の車検予約が すでに ${others.map(o=>_lab(o.dk)).join('・')} に入っています。\n\n`+
          `OK … その予約を消して ${_lab(_dkF)} へ移します（日にちの変更）\n`+
          `キャンセル … 両方とも残します（2台ぶんの予約）`);
      }
    }
    // 予約1件の保存（insp／顧客ファイル）を1つのIDで追跡し、両方の反映が確認できるまで
    // localStorageの控え（pending）を消さない。消えていなければ起動時に「未反映の予約」として拾える。
    const pid=`${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
    const _done={insp:!(entryDate&&!isTemp),file:false};
    const _maybeDrop=()=>{if(_done.insp&&_done.file)pendDrop(pid);};
    // ★本予約確定の瞬間に楽観的に「反映しました」を即表示（書込往復もバックグラウンド処理も待たない）。
    //   後段の writeVerified が裏でGAS反映を検証し、万一未反映なら「エラー」に訂正する。
    if(entryDate&&!isTemp){
      setSyncToast({status:'done',name:customer.name});
      setTimeout(()=>setSyncToast(s=>(s&&s.status==='done'&&s.name===customer.name)?null:s),4000);
    }
    const bookDate=today();
    const dm1=customer.dm1Date,dm2=customer.dm2Date;
    const dmCol=calcDMCol(dm1,dm2,bookDate);

    // 1. 顧客リスト更新
    const updCustomer={...customer,status,entryDate,store,bookingTime,course:Number(course)||0,tokuten,staff,note,
      linkedInspDate:entryDate,
      ...(dmCol==='dm1'?{dm1Book:bookDate}:{dm2Book:bookDate}),
    };

    // 顧客リスト更新
    // filesRefから直接changedFileを作成（setFilesの非同期問題を回避）
    const currentFiles = filesRef.current || [];
    let changedFile = null;
    const targetFile = currentFiles.find(f => f.customers.some(c => c.custId === customer.custId));
    if(targetFile){
      const custs = targetFile.customers.map(c => c.custId === customer.custId ? updCustomer : c);
      changedFile = {...targetFile, customers: custs};
    }
    setFiles(prev=>{
      const next=prev.map((f)=>{
        const ci=f.customers.findIndex(c=>c.custId===customer.custId);
        if(ci<0)return f;
        const custs=[...f.customers];
        custs[ci]=updCustomer;
        return {...f,customers:custs};
      });
      filesRef.current = next; // filesRefを同期
      const _updFile=next.find(f=>f.customers?.some(c=>c.custId===customer.custId));
      if(_updFile){
        // localStorageキャッシュ即時更新（タブ切替後の上書きを防ぐ）
        // ※従来はSAFE（スコープ外）参照のReferenceErrorをcatchで握り潰し、一度も動いていなかった
        try{localStorage.setItem(STOR+'cf-'+safeName(_updFile.name),JSON.stringify(_updFile));}catch(e){}
      }
      return next;
    });
    // 2. inspDataに予約追加（本予約のみ。仮予約はリスト表示のみでスケジュールには載せない）
    if(entryDate&&!isTemp){
      const dk=entryDate;
      if(dk){
        // index.htmlのdateKey形式に変換（"2026-3-16" ← ゼロなし）
        const parts=dk.split('-');
        const dkFormatted=parts.length===3?`${parts[0]}-${parseInt(parts[1])}-${parseInt(parts[2])}`:dk;

        const courseNum=Number(course)||0;
        const rowBase={
          name:customer.name,carType:customer.carType,
          course:courseNum,store,staff,tokuten:tokuten||'-',
          note,no:customer.no,
          // ★電話・住所（2026-09-20）：リストにあればスケジュールの予約カードにも持たせる（車検モーダルに自動反映）
          phone:custPhones(customer)[0]||'',address:String(customer.address||'').trim(),
          bookingStatus:isTemp?'provisional':'confirmed',
          custId:customer.custId,
          bookingTime,
          time:bookingTime||'',  // index.htmlのrow.time表示用
          // ★事前入庫日・納車日・納車時間。スケジュール側の予約カードと同じ項目名で持たせる
          //   （entryDate＝事前入庫日。未設定なら空＝車検日当日入庫）。
          //   ここに入れておかないと、リストから保存し直すたびにスケジュール側で
          //   設定した事前入庫・納車日が消える。
          entryDate:preEntry||'',
          deliveryDate:deliveryDate||'',
          deliveryTime:deliveryDate?(deliveryTime||'未定'):'',
          // ★代車を選んだときは、予約カード側にも車名を持たせる（スケジュール側と同じ項目名）。
          //   ここが空だと「代車予約はあるのにカードの代車欄は空」という食い違いになる。
          //   選んでいないときはキー自体を渡さず、applyBookingToInsp が元の値を引き継ぐ。
          ...(selCarId?(()=>{
            const _cars=[...(loanerListH.length>0?loanerListH:LOANERS_H),...(loanerListS.length>0?loanerListS:LOANERS_S)];
            const _c=_cars.find(c=>c.id===selCarId);
            return {loaner:_c?`${_c.name}${_c.num?` (${_c.num})`:''}`:'',loanerId:selCarId};
          })():{}),
        };
        // ★保存を始める前に「予約したという事実」を端末に残す（未反映なら起動時に検出して再送できる）
        pendAdd({pid,ts:Date.now(),custId:customer.custId,name:customer.name,no:customer.no,
          dk:dkFormatted,row:rowBase,cust:updCustomer,fileName:targetFile?targetFile.name:''});

        // ★スケジュール(insp)を最優先で・確実に書き込む。書くたびにサーバー最新値を読み直して
        //   適用し直すので、他PCの予約を巻き添えで消さない。読み返して入っていなければ再送。
        let bKey=`insp-${dkFormatted}-0`;
        let localInsp=null;
        const inspOk=await writeVerified(STOR+'insp',
          base=>{
            const r=applyBookingToInsp(base,{customer,dkFormatted,row:rowBase,inspLimits,movePerson});
            bKey=r.bKey;localInsp=r.data;
            return r.data;
          },
          back=>inspHasCust(back,dkFormatted,customer.custId,customer.name),
          3,{requireBase:true} // 読めなかったサーバー値を「空」とみなして書かない
        );
        if(localInsp){setInspData(localInsp);inspWriteRef.current=Date.now();}
        _done.insp=inspOk;_maybeDrop();
        if(!inspOk){
          setSyncToast({status:'error',name:customer.name});
          setPendings(pendLoad());
          alert(`⚠️ ${customer.name} の予約をスケジュールに反映できませんでした（サーバー混雑）。\n画面上部の「未反映の予約」バナーから再送できます。`);
        }

        // ★保管箱（14日より前の分）に残っている同じ予約も外す（2026-10-04）
        _bg.push((async()=>{
          try{
            const _a=await sGet(STOR+'insp-arch');
            const _n=archDropSameBooking(_a,customer.custId,dkFormatted);
            if(_n){ await sSet(STOR+'insp-arch',_n); setInspArch(_n);
              try{ if(IS_EMBED)window.parent.postMessage({type:'hub-reload-main'},location.origin); }catch(_e){} }
          }catch(e){}
        })());
        // ★変更前の代車・レンタカーを消す（2026-10-04 報告：日を変えても前の代車が残っていた）。
        //   「両方残す」を選んだ時は、custId が同じ古い予約の分だけ消す（別予約の代車は触らない）。
        {
          const _spots=_oldSpots.filter(sp=>sp.dk!==dkFormatted&&(movePerson||sp.by==='id'));
          if(_spots.length>0){
            const _arg={keys:_spots.map(sp=>`insp-${sp.dk}-${sp.idx}`),
              custId:customer.custId,name:customer.name,
              dks:[...new Set(_spots.map(sp=>sp.dk))]};
            [storKey('lres','honten'),storKey('lres','sanda'),STOR+'rres'].forEach(_k=>{
              _bg.push(writeVerified(_k,
                base=>resDropForMove(base,_arg),
                back=>!resDropForMove(back,_arg),
                2,{requireBase:true}
              ).then(()=>sGet(_k).then(v=>{
                if(!v||typeof v!=='object')return;
                if(_k===storKey('lres','honten'))setLoanerResH(v);
                else if(_k===storKey('lres','sanda'))setLoanerResS(v);
                try{ if(IS_EMBED)window.parent.postMessage({type:'hub-reload-main'},location.origin); }catch(_e){}
              }).catch(()=>{})).catch(()=>{}));
            });
          }
        }
        // 4. custbk（カレンダー6枠）にも保存
        // キー形式: "氏名::2026-3-16"（ゼロなし）
        const bkKey=`${customer.name.trim()}::${dkFormatted}`;
        // ★前の日の控えは消す（2026-10-04）。残っていると同期チェックが「未反映の予約」と見なして、
        //   消したはずの日に予約を作り直してしまう＝二重予約の作り直しになる。
        _bg.push(writeVerified(STOR+'custbk',
          base=>{
            const b=(base&&typeof base==='object')?base:{};
            const drop=Object.keys(b).filter(k=>{
              if(k===bkKey)return false;
              const e=b[k],f=e&&e.formData;
              if(!e||!f||String(e.dk||'')===dkFormatted)return false;
              return (!!customer.custId&&f.custId===customer.custId)||(movePerson&&isSameVehicleRow(f,customer));
            });
            if(drop.length===0)return undefined;
            const n={...b};drop.forEach(k=>{delete n[k];});return n;
          },
          back=>!Object.keys(back||{}).some(k=>{
            const e=back[k],f=e&&e.formData;
            if(!e||!f||String(e.dk||'')===dkFormatted)return false;
            return (!!customer.custId&&f.custId===customer.custId)||(movePerson&&isSameVehicleRow(f,customer));
          }),
          2,{requireBase:true}
        ).catch(()=>{}));
        const custbkEntry={
          status:isTemp?'provisional':'confirmed',
          formData:{
            name:customer.name,
            staff:staff||'',
            carType:customer.carType,
            phone:custPhones(customer)[0]||'',address:String(customer.address||'').trim(),   // 仮予約カード（2026-09-20）
            course:course||0,
            tokuten:tokuten||'-',
            loaner:'',loanerId:null,
            rentalLabel:'',rentalCarId:null,
            time:bookingTime||'',
            note:note||'',
            bookingStatus:isTemp?'provisional':'confirmed',
            custId:customer.custId,
            store:store,
          },
          custMonth:null,
          custRowIdx:null,
          dk:dkFormatted,
          idx:Number(String(bKey).split('-').pop())||0,
          savedAt:Date.now(),
        };
        // custbkもサーバー最新値にマージして書き、読み返して確認する（従来は投げっぱなしで、
        // lock_timeout時に無言で消えていた）
        _bg.push(writeVerified(STOR+'custbk',
          base=>({...((base&&typeof base==='object')?base:{}),[bkKey]:custbkEntry}),
          back=>!!(back&&back[bkKey]),
          3,{requireBase:true} // 読めなかったサーバー値を「空」とみなして書かない
        ));

        // 3. 代車予約追加（bookingKey付き）
        if(selCarId&&selDays&&selDays.length>0){
          const allLoaners=[...(loanerListH.length>0?loanerListH:LOANERS_H),...(loanerListS.length>0?loanerListS:LOANERS_S)];
          const car=allLoaners.find(c=>c.id===selCarId);
          const carStore=car?.store||store;
          const resKey=storKey('lres',carStore);
          const _localLres=carStore==='honten'?loanerResH:loanerResS;

          const sorted=[...selDays].sort();
          const s=new Date(sorted[0]),e=new Date(sorted[sorted.length-1]);
          const newRes={
            id:Date.now(),
            bookingKey:bKey,
            user:customer.name,
            custId:customer.custId,
            fy:s.getFullYear(),fm:s.getMonth(),fd:s.getDate(),
            ty:e.getFullYear(),tm:e.getMonth(),td:e.getDate(),
            color:null, // setLoanerResH/S 内で計算
            carName:car?.name||'',
            carNum:car?.num||'',
            // ★限定＝最適化で動かさない印。false の時はキー自体を持たせない
            //   （index側の作法に合わせる。undefined は JSON.stringify で消える）
            locked:selLocked?true:undefined,
          };
          // ★保存キーは「年-月-日」。日だけだと別の月の同じ日で衝突する
          //   （index側は v1.76 で直したが、リスト側が直し漏れていた）。
          //   キー名自体に意味は無く、予約は id / bookingKey で特定する。
          const _dKey=`${newRes.fy}-${newRes.fm}-${newRes.fd}`;
          // ★色は先に決めて、画面表示と保存で同じ値を使う（従来は保存側でだけ計算していた）
          const _colorIdx=customer.custId?[...String(customer.custId)].reduce((a,c)=>a+c.charCodeAt(0),0)%RES_COLORS.length:0;
          newRes.color=RES_COLORS[_colorIdx];
          // 同じ予約の古い代車を消してから置く。希望キーが別予約で埋まっていたら横へ逃がす
          const _placeRes=(base)=>resPutRec(
            resRemoveRes(base,{bookingKey:bKey,custId:customer.custId}),
            selCarId,_dKey,newRes);
          const loanerRes=_placeRes(_localLres);
          // ★まず画面に出す（車検と同時に見えるように）。保存は下のバックグラウンド処理で行う。
          //   従来はサーバーからlresを読み終わってから初めて setLoanerRes していたため、
          //   車検はすぐ出るのに代車だけ1〜4秒遅れて出ていた（2026-08-25にユーザーが報告）。
          if(carStore==='honten')setLoanerResH(loanerRes);else setLoanerResS(loanerRes);
          // ★親（スケジュール画面）にも即座に渡す。顧客リストは iframe なので、
          //   親はサーバーから読み直すまで新しい代車を知らない＝代車管理だけ表示が遅れていた。
          //   保存の完了は待たずに見た目を先行させる（保存自体は下のバックグラウンド処理）。
          try{
            if(IS_EMBED)window.parent.postMessage(
              {type:'hub-lres-added',store:carStore,carId:selCarId,dayKey:_dKey,rec:newRes},location.origin);
          }catch(_e){}

          // ★サーバー最新のlresを取得してからマージして保存（2026-07-03修正）。
          // 以前はローカルstateベースで丸ごと上書きしていたため、このタブを開いてから
          // 他端末（モバイル等）が入れた代車予約を巻き添えで消す事故があり得た。
          _bg.push((async()=>{
            const _sD=new Date(sorted[0]);
            const _localBase=carStore==='honten'?loanerResH:loanerResS;
            const _fresh=await sGet(resKey);
            const _base=(_fresh&&typeof _fresh==='object'&&!Array.isArray(_fresh))?_fresh:(_localBase||{});
            // サーバー最新値の上に、同じ置き方（衝突したら横へ逃がす）で置き直す
            const merged=_placeRes(_base);
            if(carStore==='honten')setLoanerResH(merged);else setLoanerResS(merged);
            // 代車も読み返し検証つきで書く（無言failで「車検には代車名があるのに代車表に帯が無い」状態を作らない）
            await writeVerified(resKey,
              base=>_placeRes(base),
              back=>{
                // 置き場所(キー)は衝突時にずれるので、キーではなく id で着地を確かめる
                const days=(back&&back[selCarId])||{};
                return Object.values(days).some(r=>r&&r.id===newRes.id);
              },
              3,{requireBase:true} // 読めなかったサーバー値を「空」とみなして書かない
            );
          })());
        }
      }
    }
    // 顧客ファイルをGAS最新とマージして保存（他端末の更新を消さない）。
    // ★insp書き込みの後に・バックグラウンドで実行。先にスケジュールを確実に反映し、
    //   その後で（多数チャンクの）顧客ファイル保存を行うことでGASロック競合を避ける。
    //   sSetはno-corsで失敗を検知できないため、読み返して実反映を確認し、最大3回まで再試行。
    if(changedFile){
      _bg.push((async()=>{
        for(let _attempt=0;_attempt<3;_attempt++){
          try{
            const _latest=await loadFileChunked(changedFile.name);
            const _base=(_latest&&Array.isArray(_latest.customers))?_latest.customers:changedFile.customers;
            let _merged=_base.map(c=>c.custId===customer.custId?updCustomer:c);
            if(!_merged.some(c=>c.custId===customer.custId))_merged.push(updCustomer);
            const _mf={...changedFile,customers:_merged};
            const _wrote=await saveFileChunked(_mf,_base); // 変わったチャンクだけ書く
            try{localStorage.setItem(STOR+'cf-'+safeName(changedFile.name),JSON.stringify(_mf));}catch(e){}
            // ★保存が「GASのok応答」で確認できていれば、もう一度読み返さない。
            //   3チャンクの読み直し（約4秒）＋待ち2秒を毎回やっており、入力した本人を
            //   その分だけ待たせていた（オーバーレイを閉じるのに22秒かかっていた要因）。
            if(_wrote===true){ _done.file=true;_maybeDrop(); return; }
            // 確認が取れなかった時だけ読み返して照合する
            await new Promise(r=>setTimeout(r,2000));
            const _check=await loadFileChunked(changedFile.name);
            const _saved=_check&&(_check.customers||[]).find(c=>c.custId===customer.custId);
            if(_saved&&_saved.status===updCustomer.status&&_saved.entryDate===updCustomer.entryDate){
              _done.file=true;_maybeDrop();
              return;
            }
            console.warn('顧客ファイル保存 未反映 retry',_attempt+1,customer.name);
          }catch(e){console.error('顧客ファイル保存エラー:',e);}
        }
        setPendings(pendLoad());
        alert(`⚠️ ${customer.name} のリスト保存がサーバーに反映できませんでした。\n画面上部の「未反映の予約」バナーから再送できます。`);
      })());
    }else{ _done.file=true;_maybeDrop(); }
    // ★他のPCへ「この顧客を予約した」と知らせる（cust-updatesキュー）。
    //   スケジュール側の予約は index の syncCustStatus が必ずこれを積むのに、
    //   リストからの予約だけ積んでいなかった。＝別のPCのリストは、開き直すまで
    //   ずっと「未予約」の網かけのままだった（2026-08-24にユーザーが報告）。
    //   60秒の自動取り込み(pickup)は「まだ持っていないファイル」しか読まないので、
    //   すでに202608を開いている端末はこの通知が無いと永久に気づけない。
    //   ・同じ顧客の古い通知（キャンセル等）は差し替える＝再予約時のコリジョン防止も兼ねる
    //   ・自分自身は適用済み扱いにして、他PCが受け取る前にキューから消さないようにする
    //   ・7日より古い通知は掃除する（誰も受け取らないまま溜まり続けるのを防ぐ）
    const _upd={custId:customer.custId,name:customer.name,no:customer.no,
      status:updCustomer.status,entryDate:updCustomer.entryDate,linkedInspDate:updCustomer.linkedInspDate,
      store:updCustomer.store,bookingTime:updCustomer.bookingTime,course:updCustomer.course,
      tokuten:updCustomer.tokuten,staff:updCustomer.staff,note:updCustomer.note,
      ...(dmCol==='dm1'?{dm1Book:bookDate}:{dm2Book:bookDate}),
      ts:Date.now()};
    try{ if(!window.__appliedUpdTs)window.__appliedUpdTs=new Set(); window.__appliedUpdTs.add(_upd.ts); }catch(e){}
    const _sameCust=u=>(u.custId&&u.custId===customer.custId)||
      (u.name&&u.name===customer.name&&String(u.no||'')===String(customer.no||''));
    const _weekAgo=Date.now()-7*24*3600*1000;
    _bg.push(writeVerified(STOR+'cust-updates',
      base=>[...(Array.isArray(base)?base:[]).filter(u=>u&&!_sameCust(u)&&(u.ts||0)>_weekAgo),_upd],
      back=>Array.isArray(back)&&back.some(u=>u&&u.ts===_upd.ts),
      3,{requireBase:true} // 読めなかったサーバー値を「空」とみなして書かない
    ));
    }finally{
      // 裏の保存が全部終わってから初めてカウンタを戻す＝それまで画面は閉じられない
      Promise.allSettled(_bg).then(()=>{try{window.__hubBusyOps=Math.max(0,(window.__hubBusyOps||1)-1);}catch(_e){}});
    }
  },[loanerListH,loanerListS,saveInspWithStatus]);

  // ── 未反映の予約（pending）を起動時にサーバーと突き合わせる ──
  // 「保存できたつもりで消えていた」予約を、端末を閉じても見失わないための最後の砦。
  // insp に入っていれば控えを消し、入っていなければバナーに出して再送できるようにする。
  const checkPendings=useCallback(async()=>{
    const list=pendLoad();
    if(list.length===0){setPendings([]);return;}
    let insp={};
    try{insp=(await sGet(STOR+'insp'))||{};}catch(e){setPendings(list);return;}
    const left=[];
    for(const p of list){
      if(!p.dk||!p.row){pendDrop(p.pid);continue;}          // 仮予約など（insp対象外）は控えを残さない
      if(inspHasCust(insp,p.dk,p.custId,p.name))pendDrop(p.pid);
      else left.push(p);
    }
    setPendings(left);
  },[]);
  useEffect(()=>{const t=setTimeout(checkPendings,4000);return()=>clearTimeout(t);},[checkPendings]);

  // 未反映の予約を再送（スケジュール＋顧客ファイルの両方）
  const resendPending=useCallback(async(p)=>{
    setResending(p.pid);
    try{
      const ok=await writeVerified(STOR+'insp',
        base=>applyBookingToInsp(base,{customer:{custId:p.custId,name:p.name},dkFormatted:p.dk,row:p.row,inspLimits}).data,
        back=>inspHasCust(back,p.dk,p.custId,p.name));
      if(!ok){alert(`⚠️ ${p.name} の再送もサーバーに届きませんでした。少し待ってからもう一度お試しください。`);return;}
      // 顧客ファイル側（status/entryDate）も入っていなければ入れ直す
      if(p.fileName&&p.cust){
        const f=await loadFileChunked(p.fileName);
        if(f&&Array.isArray(f.customers)){
          const cur=f.customers.find(c=>c.custId===p.custId);
          if(!cur||cur.status!==p.cust.status||cur.entryDate!==p.cust.entryDate){
            const merged=f.customers.map(c=>c.custId===p.custId?{...c,...p.cust}:c);
            await saveFileChunked({name:p.fileName,customers:merged},f.customers);
          }
        }
      }
      pendDrop(p.pid);
      setInspData(await sGet(STOR+'insp')||{});
      setSyncToast({status:'done',name:p.name});
      setTimeout(()=>setSyncToast(s=>(s&&s.name===p.name)?null:s),4000);
    }finally{
      setResending('');
      setPendings(pendLoad());
    }
  },[inspLimits]);

  const handleSyncCheck=useCallback(async()=>{
    setSyncing(true);
    try{
      // GASから全ファイルとinspDataを直接取得（キャッシュ不使用）
      const [latestInsp,fileIndex]=await Promise.all([
        sGet(STOR+'insp').then(v=>v||{}),
        sGet(STOR+'cf-index').then(v=>v||[]),
      ]);
      const allFiles=await Promise.all(fileIndex.map(fi=>loadFileChunked(fi.name).catch(()=>null)));
      const allCusts=allFiles.filter(Boolean).flatMap(f=>f.customers||[]);
      const confirmedWithDate=allCusts.filter(c=>c.status==='confirm'&&c.entryDate&&inSyncRange(c.entryDate));
      const notInInsp=c=>{
        const dk=toDk(c.entryDate);
        if(!dk)return false;
        // cancelledを除いた行で照合。custId一致 or 氏名一致（再インポートでcustIdが変わった場合の対策）
        const activeRows=(latestInsp[dk]||[]).filter(r=>r&&r.bookingStatus!=='cancelled');
        return!activeRows.some(r=>
          (r.custId&&r.custId===c.custId)||
          (r.name&&r.name===c.name)
        );
      };
      const missing=confirmedWithDate.filter(notInInsp);
      // ★顧客ファイルへの保存ごと失敗した予約は、リスト側が'confirm'にならないので上のチェックには
      //   絶対に引っかからない（阪上さんのケース）。予約時の控え(pending)とカレンダー用のcustbkも
      //   突き合わせ、スケジュールに無いものを未反映として拾う。
      const seen=new Set(missing.map(c=>c.custId||c.name));
      const extra=[];
      const pushExtra=c=>{const k=c.custId||c.name;if(seen.has(k))return;seen.add(k);extra.push(c);};
      pendLoad().forEach(p=>{
        if(!p.dk||!p.row)return;
        if(!inSyncRange(p.cust&&p.cust.entryDate||p.dk))return;   // 見はじめより前は数えない
        if(inspHasCust(latestInsp,p.dk,p.custId,p.name))return;
        pushExtra({...(p.cust||{}),custId:p.custId,name:p.name,no:p.no,carType:p.row.carType,
          course:p.row.course,store:p.row.store,staff:p.row.staff,tokuten:p.row.tokuten,note:p.row.note,
          bookingTime:p.row.bookingTime,entryDate:p.cust?.entryDate||p.dk,_src:'この端末の予約控え'});
      });
      let custbk={};
      try{custbk=(await sGet(STOR+'custbk'))||{};}catch(e){}
      Object.values(custbk).forEach(e=>{
        if(!e||e.status!=='confirmed'||!e.dk||!e.formData)return;
        if(!inSyncRange(e.dk))return;                              // 見はじめより前は数えない
        const f=e.formData;
        if(inspHasCust(latestInsp,e.dk,f.custId,f.name))return;
        pushExtra({custId:f.custId,name:f.name,no:f.no,carType:f.carType,course:f.course,store:f.store,
          staff:f.staff,tokuten:f.tokuten,note:f.note,bookingTime:f.time,entryDate:e.dk,_src:'カレンダー仮登録(custbk)'});
      });
      setSyncDialog({missing:[...missing,...extra],total:confirmedWithDate.length+extra.length,latestInsp});
    }catch(e){alert('GASからのデータ取得に失敗しました: '+(e.message||e));}
    finally{setSyncing(false);}
  },[]);

  const handleSyncFix=useCallback(async()=>{
    if(!syncDialog||syncDialog.missing.length===0)return;
    setSyncing(true);
    try{
      let newInspData={...(await sGet(STOR+'insp')||{})};
      const sizeBefore=JSON.stringify(newInspData).length;
      let added=0;
      const toAdd=[];
      for(const c of syncDialog.missing){
        const dk=toDk(c.entryDate);
        if(!dk)continue;
        if(!Array.isArray(newInspData[dk]))newInspData[dk]=[];
        const activeRows=newInspData[dk].filter(r=>r&&r.bookingStatus!=='cancelled');
        if(activeRows.some(r=>
          (r.custId&&r.custId===c.custId)||
          (r.name&&r.name===c.name)
        ))continue;
        const courseNum=Number(c.course)||0;
        const idx=newInspData[dk].length;
        newInspData[dk]=[...newInspData[dk],{
          name:c.name,carType:c.carType||'',
          course:courseNum,
          store:c.store||'honten',staff:c.staff||'',
          tokuten:c.tokuten||'-',note:c.note||'',no:c.no||'',
          bookingStatus:'confirmed',
          custId:c.custId,bookingTime:c.bookingTime||'',time:c.bookingTime||'',
          seq:Date.now()+added, // 予約順は最後尾へ（既存予約の並び・確定を乱さない）
          bookingKey:`insp-${dk}-${idx}`,
        }];
        toAdd.push({c,dk,idx});
        added++;
      }
      // ★承認の再計算（index_dev.htmlと同一ルール）。復元行はseq最後尾なので
      //   既存予約の確定を乱さず、上限超過分だけ承認待ちになる。マッハ2台は追加条件。
      const _fixDays=new Set(toAdd.map(x=>x.dk));
      _fixDays.forEach(dk=>{newInspData[dk]=recomputeInspApproval(newInspData[dk],(inspLimits&&inspLimits[dk])??6);});
      toAdd.forEach(({dk,idx})=>{newInspData[dk]=applyMahPendingRule(newInspData[dk],idx);});
      const sizeAfter=Math.round(JSON.stringify(newInspData).length/1024);
      const sizeBeforeKB=Math.round(sizeBefore/1024);
      await sSet(STOR+'insp',newInspData);

      // sSetはno-corsのため成否不明。3秒後に読み返して確認する
      await new Promise(r=>setTimeout(r,3000));
      const readBack=await sGet(STOR+'insp')||{};
      const verified=toAdd.filter(({c,dk})=>{
        const rows=(readBack[dk]||[]).filter(r=>r&&r.bookingStatus!=='cancelled');
        return rows.some(r=>(r.custId&&r.custId===c.custId)||(r.name&&r.name===c.name));
      }).length;
      const writeOk=toAdd.length>0&&verified===toAdd.length;

      setInspData(writeOk?readBack:newInspData);
      if(writeOk)inspWriteRef.current=Date.now();
      setSyncDialog(prev=>({...prev,fixed:true,addedCount:added,writeOk,verified,
        diagMsg:`データサイズ: ${sizeBeforeKB}KB → ${sizeAfter}KB（追加${added}件・確認${verified}件）`}));
    }catch(e){alert('修復に失敗しました: '+(e.message||e));}
    finally{setSyncing(false);}
  },[syncDialog,inspLimits]);

  // 現在のファイルの顧客リスト
  const currentFile=files[activeIdx];
  const allCustomers=currentFile?.customers||[];

  // 絞り込み
  const filtered=useMemo(()=>{
    let list=allCustomers;
    if(filterStatus!=='all')list=list.filter(c=>c.status===filterStatus);
    if(search){
      const q=search.toLowerCase();
      list=list.filter(c=>
        (c.name||'').toLowerCase().includes(q)||
        String(c.no||'').includes(q)||
        (c.carType||'').toLowerCase().includes(q)||
        (c.staff||'').includes(q)
      );
    }
    return list;
  },[allCustomers,filterStatus,search]);

  // ── UI ──
  const TH={padding:'8px 8px',fontWeight:700,fontSize:11,color:'#374151',whiteSpace:'nowrap',background:'#f8fafc',borderBottom:'2px solid #e5e7eb',textAlign:'left',position:'sticky',top:0,zIndex:2};

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* ★保存の完了待ち。閉じると裏の保存が死ぬので、終わるまで画面を覆って待たせる */}
      {closing&&(
        <div style={{position:'fixed',inset:0,zIndex:2147483646,background:'rgba(15,23,42,.72)',
          display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:'white',borderRadius:14,padding:'26px 32px',maxWidth:420,textAlign:'center',
            boxShadow:'0 12px 40px rgba(0,0,0,.4)'}}>
            <div style={{fontSize:30,marginBottom:10}}>💾</div>
            <div style={{fontWeight:800,fontSize:15,color:'#1e293b',marginBottom:8}}>{closing}</div>
            <div style={{fontSize:12,color:'#64748b',lineHeight:1.7}}>
              予約をサーバーに保存しています。<br/>完了すると自動でスケジュールに戻ります。
            </div>
          </div>
        </div>
      )}
      {/* ── ヘッダー ── */}
      <div style={{flexShrink:0,background:'linear-gradient(135deg,#1e1b4b,#1d4ed8)',padding:'10px 16px',display:'flex',alignItems:'center',gap:10}}>
        <a href="./index.html" onClick={e=>{
            // ★別タブで開かれた時（2026-10-04 から顧客リストはいつでも別タブ）は、
            //   このタブを閉じてスケジュールのタブへ戻る。別のタブへ行くと全画面は解除されるが、
            //   スケジュールのタブはそのままなので、戻れば元の大きさで続けられる。
            const standalone=!IS_EMBED&&(()=>{try{return !!(window.opener&&!window.opener.closed);}catch(err){return false;}})();
            if(IS_EMBED||standalone){
              e.preventDefault();
              // ★保存が終わるまで閉じない。オーバーレイ(iframe)を閉じると裏で走っている
              //   リスト本体・カレンダー枠・代車・他PCへの通知の保存がその場で死ぬ。
              //   （ページ遷移ではないので beforeunload の警告も出ない）
              const close=()=>{
                if(IS_EMBED){try{window.parent.postMessage({type:'hub-close-customers'},location.origin);}catch(err){}return;}
                try{ if(window.opener&&!window.opener.closed)window.opener.focus(); }catch(err){}
                try{ window.close(); }catch(err){}
                // 閉じられなかった時（ブラウザが拒むことがある）は今までどおり画面を戻す
                setTimeout(()=>{ try{ if(!window.closed)location.href='./index.html'; }catch(err){} },400);
              };
              if(savesInFlight()<=0){close();return;}
              let waited=0;
              setClosing('保存中です… 完了までお待ちください');
              const tick=()=>{
                if(savesInFlight()<=0||waited>=180000){setClosing(null);close();return;}
                waited+=500;
                if(waited%2000===0)setClosing(`保存中です… 完了までお待ちください（${Math.round(waited/1000)}秒）`);
                setTimeout(tick,500);
              };
              tick();
              return;
            }
            try{sessionStorage.setItem(STOR+'fs-restore',(document.fullscreenElement||document.webkitFullscreenElement)?'1':'0');}catch(err){}
          }}
          style={{color:'#fef08a',fontSize:12,textDecoration:'none',fontWeight:800,
          padding:'6px 14px',background:'#16a34a',borderRadius:8,border:'2px solid #15803d',
          boxShadow:'0 2px 6px rgba(22,163,74,0.4)'}}>
          ← スケジュールに戻る
        </a>
        <div style={{color:'white',fontWeight:900,fontSize:15,flex:1,display:'flex',alignItems:'center',gap:8}}>🚗 顧客リスト<span style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10,background:'#eff6ff',color:'#1d4ed8',border:'1px solid #bfdbfe'}}>v{APP_VERSION}</span></div>
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          <div style={{width:7,height:7,borderRadius:'50%',background:gasOk===true?'#4ade80':gasOk===false?'#f87171':'#fbbf24'}}/>
          <span style={{color:'rgba(255,255,255,.6)',fontSize:10}}>{gasOk===true?'GAS接続済':gasOk===false?'GAS接続エラー':'確認中'}</span>
        </div>
        {<button data-fs-toggle="1" onClick={()=>{setFsHint(false);toggleFullscreen();}} title={isFullscreen?'全画面を終了して元のウインドウに戻す':'全画面表示（ブラウザのタブ・お気に入りバーを隠して大きく表示）'}
          style={{display:'flex',alignItems:'center',gap:4,padding:'5px 10px',background:(fsHint&&!isFullscreen)?'#fde047':'rgba(255,255,255,0.15)',border:(fsHint&&!isFullscreen)?'2px solid #facc15':'2px solid rgba(255,255,255,0.5)',borderRadius:8,cursor:'pointer',fontWeight:(fsHint&&!isFullscreen)?900:700,fontSize:11,color:(fsHint&&!isFullscreen)?'#7c2d12':'white',whiteSpace:'nowrap',boxShadow:(fsHint&&!isFullscreen)?'0 0 0 4px rgba(250,204,21,.35)':'none',transition:'all .15s'}}
          onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.3)'}
          onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,0.15)'}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            {isFullscreen
              ?<><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></>
              :<><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></>}
          </svg>
          {isFullscreen?'元に戻す':'全画面'}
        </button>}

            padding:'11px 14px',borderRadius:11,boxShadow:'0 8px 24px rgba(0,0,0,.18)',
            background:theme.bg,border:`2px solid ${theme.bd}`,color:theme.fg,
            display:'flex',alignItems:'center',gap:10,fontSize:13,fontWeight:700}}>
            {isPend
              ?<span className="spinner-sm" style={{flexShrink:0,borderTopColor:'#d97706'}}/>
              :<span style={{fontSize:17,flexShrink:0}}>✅</span>}
            <span style={{flex:1,lineHeight:1.4}}>{label}</span>
            {/* 何かの理由で反映が進まない時に手で閉じられるようにする（消えないポップアップ対策） */}
            <button onClick={()=>{setPendingSync({});setSyncFlash(null);}}
              style={{flexShrink:0,width:22,height:22,borderRadius:'50%',border:'none',background:'rgba(0,0,0,.08)',color:theme.fg,fontSize:12,fontWeight:800,cursor:'pointer'}}>✕</button>
          </div>
        );
      })()}

      {/* ── スケジュール反映 同期トースト ── */}
      {syncToast&&(()=>{
        const st=syncToast.status;
        // 完了=ライトブルー(本予約の色)、保存中=ライトグリーン(仮予約の色)。背景と差が出て見つけやすく直感的。
        const theme=st==='done'?{bg:'#dbeafe',bd:'#60a5fa',fg:'#1e40af',icon:'✅'}
          :st==='error'?{bg:'#fee2e2',bd:'#f87171',fg:'#991b1b',icon:'⚠️'}
          :st==='slow'?{bg:'#fef3c7',bd:'#fbbf24',fg:'#92400e',icon:'⏳'}
          :{bg:'#dcfce7',bd:'#4ade80',fg:'#166534',icon:'🔄'};
        const msg=st==='done'?`${syncToast.name}さんの予約をスケジュールに反映しました`
          :st==='error'?`${syncToast.name}さんの予約の反映に失敗しました`
          :st==='slow'?`反映に時間がかかっています（30秒超）`
          :`${syncToast.name}さんの予約をスケジュールに反映中…`;
        return (
          <div style={{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',zIndex:99999,
            minWidth:300,maxWidth:420,
            padding:'18px 22px',borderRadius:14,boxShadow:'0 12px 40px rgba(0,0,0,.28)',
            background:theme.bg,border:`2px solid ${theme.bd}`,color:theme.fg,
            display:'flex',alignItems:'center',gap:12,fontSize:15,fontWeight:700}}>
            <span style={{fontSize:22,flexShrink:0}}>{theme.icon}</span>
            <span style={{flex:1,lineHeight:1.4}}>{msg}</span>
            {(st==='slow'||st==='error')&&syncToast.retry&&(
              <button onClick={()=>syncToast.retry()}
                style={{flexShrink:0,padding:'5px 12px',background:theme.fg,color:'white',border:'none',
                  borderRadius:7,fontWeight:800,fontSize:12,cursor:'pointer'}}>再試行</button>
            )}
            {st!=='saving'&&(
              <button onClick={()=>setSyncToast(null)}
                style={{flexShrink:0,padding:'2px 7px',background:'transparent',color:theme.fg,
                  border:'none',fontWeight:900,fontSize:15,cursor:'pointer',lineHeight:1}}>✕</button>
            )}
          </div>
        );
      })()}
    </div>
  );
};

// ★サーバーに繋がらない時の告知。読み取りに失敗した画面を「消えた」と誤解させないため、
//   アプリの外側（最上位）に置いて必ず出るようにする。データには一切触れない。
const GasDownBanner=()=>{
  const [since,setSince]=useState(0);
  const [,tick]=useState(0);
  useEffect(()=>{
    const t=setInterval(()=>{
      let d=0; try{d=window.__hubGasDown||0;}catch(e){}
      setSince(prev=>prev===d?prev:d); tick(x=>x+1);
    },2000);
    return()=>clearInterval(t);
  },[]);
  if(!since)return null;
  const sec=Math.max(0,Math.floor((Date.now()-since)/1000));
  if(sec<5)return null;
  return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:2147483647,background:'#7f1d1d',color:'white',
      padding:'10px 16px',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',
      boxShadow:'0 2px 12px rgba(0,0,0,.45)',fontFamily:'system-ui,sans-serif'}}>
      <span style={{fontSize:20,lineHeight:1}}>⚠</span>
      <div style={{flex:1,minWidth:240}}>
        <div style={{fontWeight:900,fontSize:15}}>サーバーに接続できません。データは守られています。</div>
        <div style={{fontSize:12,opacity:.9,marginTop:2}}>
          いま画面に出ていない顧客・予約も消えていません。繋がり次第このメッセージは消え、自動で表示に戻ります。
          復旧するまでの入力は保存されないのでお待ちください。（{sec}秒経過）
        </div>
      </div>
      <button onClick={()=>{try{window.__hubGasDown=0;}catch(e){}location.reload();}}
        style={{background:'white',color:'#7f1d1d',border:'none',borderRadius:7,padding:'7px 14px',
          fontWeight:800,fontSize:13,cursor:'pointer',whiteSpace:'nowrap'}}>再読み込み</button>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<><GasDownBanner/><App/></>);
</script>
</body>
</html>
