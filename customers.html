        // ★保存がまだGASに着地していない状態でリロードすると、その保存は失われる
        //   （GASへの書き込みは10〜27秒かかる）。書き込みが残っている間は待ってから更新する。
        window.addEventListener('beforeunload',function(ev){
          if((window.__hubWriteBusy||0)>0){ev.preventDefault();ev.returnValue='';return '';}
        });
        var __waitWrite=function(cb){
          var waited=0;
          (function go(){
            if((window.__hubWriteBusy||0)>0&&waited<180000){
              b.textContent='保存中です… 完了までお待ちください（'+Math.round(waited/1000)+'秒）';
              waited+=1000;setTimeout(go,1000);return;
            }
            cb();
          })();
        };
      b.onclick=function(){__waitWrite(function(){b.textContent='更新中…';location.reload();});};
      document.body.appendChild(b);
    }
    async function check(){
      if(shown||checking||navigator.onLine===false)return; checking=true;
      try{
        var res=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
        if(res&&res.ok){
          var t=await res.text();
          var m=t.match(/__APP_BUILD='(build-\d+)'/);
          // ★ビルド識別子だけでなく、バージョン番号の違いでも出す（識別子の更新忘れ対策・2026-09-12）。
          var mv=t.match(/(?:APP_VERSION|MOBILE_VERSION)\s*=\s*'([^']+)'/), rv=runningVer();
          if((m&&m[1]!==RUNNING)||(mv&&rv&&mv[1]!==rv))banner();
        }
      }catch(e){}
      checking=false;
    }
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
    setTimeout(check,8000);   // 開いてすぐ（8秒）に1回。古い画面のまま使い始めないように
    setInterval(check,15*60*1000);
  })();
</script>

const HUB_BASE_KEY='hub2026co-f466kt5vs3vnDQDPuwWeS6XM';
let GAS_API_KEY=HUB_BASE_KEY;
const STOR='hub-v8-dev-';
// ★この端末に登録した人（v2.20 / 2026-09-04・Kyoshi承認のBLOCK-B変更。2026-09-18 に Firebase Auth 化）

const HUB_MINE_KEY = STOR + 'auth-mine';   // この端末の登録者 [{uid,name,myNumber,store,email,isDevice,isAdmin}]
const HUB_KIND_KEY = STOR + 'auth-kind';   // 'own'（自分専用）/ 'shared'（共有）

const hubSetLabel = v => { try { localStorage.setItem(HUB_LABEL_KEY, String(v || '').slice(0, 40)); } catch (e) {} };

const hubRenew = async name => {};

// index側の全画面オーバーレイ（iframe）内で開かれているか。埋め込み時は

const IS_EMBED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
const APP_VERSION='3.34'; // 表示用バージョン。更新ごとに上げる（軽微+0.01／大型は整数を上げる）。index_dev.htmlと揃える
const storKey=(base,sid)=>`${STOR}${sid}-${base}`;
const CHUNK_SIZE=100;
// ファイル名をGASキーに使える形に変換
const safeName=n=>n.replace(/[^a-zA-Z0-9　-鿿゠-ヿ぀-ゟ]/g,'_').slice(0,30);
// ファイルをチャンクに分割してGASに保存。
// ★prevCustomers（保存前のサーバー値）を渡すと、中身が変わったチャンクだけ書く。

//   （全書き込み共通・25秒）を長時間占有して他の保存をlock_timeoutで無言failさせていた。
let __saveCount=0;

// ══ 顧客の横断検索「索引」（v2.98・2026-09-26）══════════════════════════
//   月ファイル（cf-*）がいつでも正。索引はそこから何度でも作り直せる“探すための軽い写し”で、
//   DM の月ごと一覧にも集計にも使わない。だから消えても作り直すだけで済む。
//   中身は 氏名・車種・顧客No・電話・満了日・どのファイルの誰か だけ。
//   ★予約状況（status/入庫日）は入れない：変わるたびに索引を直す必要が無くなり、古い情報が出ない。
//   キー： cf-search-index … {built, total, chunks, files:[月...]}
//          cf-search-chunk-i … 索引の行の配列（1本 2500行・約200KB）
const CFX_CHUNK = 2500;
const cfxIndexKey = () => STOR + 'cf-search-index';
const cfxChunkKey = i => STOR + 'cf-search-chunk-' + i;
const cfxRow = (c, fileName) => ({
  n: String(c.name || ''), c: String(c.carType || ''), no: (c.no == null ? '' : c.no),
  p: [c.phoneMobile, c.phoneHome].map(v => String(v || '').trim()).filter(Boolean).join('/'),
  // ★住所も索引に入れる（2026-10-02）。PC の検索は住所も見ていたのに索引に無く、
  //   スマホだけ住所で引けなかった。索引は作り直せば増える（1行あたり十数文字）。
  a: String(c.address || ''),
  e: String(c.expiry || ''), f: String(fileName || ''), i: String(c.custId || ''),
});
// 探す時の正規化：全角半角・大小・空白・ハイフン・かっこを無視する（画面の検索と同じ規則）
const cfxNorm = s => String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/[\s　\-‐ー－()（）]/g, '');
const cfxDigits = s => String(s == null ? '' : s).normalize('NFKC').replace(/[^0-9]/g, '');
// まとめる鍵：氏名＋車種＋ナンバー＋満了日（2026-10-04 に直した）
//   ★no は【ナンバー4桁】であって顧客Noではない。no だけで鍵にしていたため、
//     同じ4桁の別人（栗﨑さんと阿部さん…）や、同じ会社の別の車（ダイナ／タイタン）まで
//     1件にまとめて隠していた。満了日まで見れば、車ごと・1台ごとに出る。
const cfxPersonKey = r => 'v:' + cfxNorm(r.n) + '/' + cfxNorm(r.c) + '/' + cfxNorm(r.no) + '/' + cfxNorm(r.e);

const cfxLoad = async (sGet) => {
  const idx = await sGet(cfxIndexKey());
  if (!idx || !Number(idx.chunks)) return null;
  const parts = await Promise.all(Array.from({ length: Number(idx.chunks) }, async (_, i) => {
    let a = await sGet(cfxChunkKey(i));
    for (let t = 0; !Array.isArray(a) && t < 2; t++) { await new Promise(r => setTimeout(r, 600 * (t + 1))); a = await sGet(cfxChunkKey(i)); }
    return Array.isArray(a) ? a : null;
  }));
  if (parts.some(p => !p)) return null;                 // 欠けている＝作り直しが要る
  return { meta: idx, rows: parts.flat() };
};
// 索引を作って書く（files は [{name, customers:[...]}]。PC の顧客リストが持っているもの）
const cfxBuild = async (files, sSet) => {
  const rows = [];
  [...files].sort((a, b) => String(b.name).localeCompare(String(a.name)))
    .forEach(f => (f.customers || []).forEach(c => { if (c && c.name) rows.push(cfxRow(c, f.name)); }));
  const chunks = [];
  for (let i = 0; i < rows.length; i += CFX_CHUNK) chunks.push(rows.slice(i, i + CFX_CHUNK));
  for (let i = 0; i < chunks.length; i++) await sSet(cfxChunkKey(i), chunks[i]);
  const meta = { built: Date.now(), total: rows.length, chunks: chunks.length, files: files.map(f => f.name) };
  await sSet(cfxIndexKey(), meta);
  return meta;
};
// 探す：ヒットした行を「人」でまとめ、新しい月を今回・それ以外を前回として返す
//   数字だけを打った時は 電話と顧客No の数字で探す（電話の下4桁だけでも出る）
const cfxSearch = (rows, q, limit) => {
  const raw = String(q || '').trim();
  if (raw.length < 1) return [];   // ★1文字でも探す（2026-10-02。PC と揃えるため）
  const nq = cfxNorm(raw), dq = cfxDigits(raw);
  const numOnly = dq.length >= 2 && cfxNorm(raw) === dq;
  const hit = r => numOnly
    ? (cfxDigits(r.p).includes(dq) || cfxDigits(r.no).includes(dq))
    : (cfxNorm(r.n).includes(nq) || cfxNorm(r.c).includes(nq) || cfxNorm(r.no).includes(nq) || cfxNorm(r.p).includes(nq) || cfxNorm(r.a).includes(nq));
  const groups = new Map();
  for (const r of rows) {
    if (!hit(r)) continue;
    const k = cfxPersonKey(r);
    const g = groups.get(k);
    if (!g) groups.set(k, { key: k, now: r, past: [] });
    else if (String(r.f) > String(g.now.f)) { g.past.unshift(g.now); g.now = r; }
    else g.past.push(r);
    if (groups.size >= (limit || 600) && !groups.has(k)) break;
  }
  return [...groups.values()].sort((a, b) => String(b.now.f).localeCompare(String(a.now.f)));
};
const splitChunks=custs=>{const cs=[];for(let i=0;i<custs.length;i+=CHUNK_SIZE)cs.push(custs.slice(i,i+CHUNK_SIZE));return cs;};
// ★sSetはno-cors＝GASが lock_timeout を返しても成功として返る。重要な書き込みは
//   「書く→読み返す→違えば再送」で必ず着地を確認する（2026-08-24追加）。
//   これが無かったため、複数ファイルを一度に取り込むと chunk / cf-{name}-index の書き込みが
//   十数本同時にGASのロック(25秒・全書き込み共通)を奪い合い、溢れた分が無言で捨てられていた。
//   結果、cf-index にはファイル名だけ残り実体が無い＝開き直すと取り込んだはずの月が消える。
// ★GASは1回の書き込みに11〜27秒、読めるようになるまで最大40秒かかる（2026-08-24実測。
//   データ量ではなく1回あたりの固定コスト）。短い間隔で「未反映」と決めつけて再送すると、
//   重い書き込みが積み上がって永久に終わらない（v1.77はこれで「保存中」から進まなかった）。
//   → 最大90秒ゆっくり待って着地を確認し、それでも駄目な時だけ1回だけ書き直す。
const CF_POLL_MS=3000, CF_WAIT_MS=90000;
const sSetVerified=async(key,val,eq,tries=2)=>{
  const same=eq||((back)=>JSON.stringify(back)===JSON.stringify(val));
  for(let i=0;i<tries;i++){
    // ★GASが 'ok' を返したら着地は確定しているので読み返さない。
    //   実測(2026-08-25・GAS v12): 書き込み応答の直後から読める＝読み返しは時間の無駄だった。
    //   応答が読めない環境('unknown')だけ従来どおり読み返して確認する。
    if(await sSet(key,val)==='ok')return true;
    const until=Date.now()+CF_WAIT_MS;
    while(Date.now()<until){
      await new Promise(r=>setTimeout(r,CF_POLL_MS));
      try{ if(same(await sGet(key)))return true; }catch(e){}
    }
    console.warn('[CF] 90秒待っても未反映→書き直し',key,'attempt',i+1);
  }
  console.error('[CF] GASに反映できませんでした:',key);
  return false;
};
const saveFileChunked=async(file,prevCustomers,onStep)=>{
  __saveCount++;
  try{
  const name=safeName(file.name);
  const chunks=splitChunks(file.customers);
  const prev=Array.isArray(prevCustomers)?splitChunks(prevCustomers):null;
  const idx={name:file.name,total:file.customers.length,chunks:chunks.length};
  // ★チャンクは1本ずつ順番に書く（並列に投げるとGASのロックを奪い合って無言で落ちる）。
  //   各本を読み返して確認し、全部そろってから最後にインデックスを書く。
  //   ＝「cf-{name}-index がある＝中身も揃っている」を保証する（半端な状態を作らない）。
  let ok=true;
  for(let i=0;i<chunks.length;i++){
    const same=prev&&prev[i]&&JSON.stringify(prev[i])===JSON.stringify(chunks[i]);
    if(same)continue;
    if(onStep)onStep(i+1,chunks.length);
    const c=chunks[i];
    const done=await sSetVerified(STOR+'cf-'+name+'-chunk-'+i,c,
      back=>Array.isArray(back)&&back.length===c.length&&JSON.stringify(back)===JSON.stringify(c));
    if(!done){ok=false;break;}
  }
  if(ok){
    if(onStep)onStep(chunks.length,chunks.length,true);
    // インデックスは中身が変わった時だけ書く。ただし過去に書き損じて欠けている場合は書き直す
    //（欠けたままだとそのファイルは誰のPCからも読めない）。
    let cur=null;
    try{cur=await sGet(STOR+'cf-'+name+'-index');}catch(e){}
    if(!(cur&&cur.chunks===idx.chunks&&cur.total===idx.total&&cur.name===idx.name))
      ok=await sSetVerified(STOR+'cf-'+name+'-index',idx,
        back=>back&&back.chunks===idx.chunks&&back.total===idx.total);
  }
  return ok;
  }finally{
    // ★保存完了後の猶予。この間はポーリングがサーバー値でローカルを上書きしない。
    //   従来は70秒。書き込みが10〜27秒かかり「書いた値がすぐ読めない」前提の数字だったが、
    //   v1.79で応答(ok)を確認して書くようになり、GAS v12で書き込みは約2秒・書けた直後から
    //   読めることを実測した。70秒のままだと、ファイルを1回保存しただけで他PCの予約が
    //   最大70秒画面に出てこない（実測: 他PCへの反映が20秒→80秒に伸びた）。
    setTimeout(()=>{__saveCount=Math.max(0,__saveCount-1);},8000);
  }
};
// ファイルをチャンクから復元
const loadFileChunked=async(name)=>{
  const sn=safeName(name);
  const idx=await sGet(STOR+'cf-'+sn+'-index');
  if(!idx)return null;
  // ★読めなかったチャンクは1回だけ即再試行する。以前は落ちた分を黙って捨てて
  //   flat() していたため、件数が減ったまま「一部の顧客だけ消えている」状態になり得た。
  // ★チャンクは並列で読む。1本3〜4秒かかるので直列だと100人増えるごとに待ち時間が
  //   3〜4秒ずつ伸びていた（実測: 257件の月で読み込みに14.8秒）。GASのロックは書き込み
  //   専用で読み取りは競合しないため、並列にしても取りこぼしは増えない。
  const chunks=await Promise.all(
    Array.from({length:idx.chunks},async(_,i)=>{
      let c=await sGet(STOR+'cf-'+sn+'-chunk-'+i);
      // ★読めるまで待って3回まで試す。1回だけの再試行では、回線や端末が遅いPCで
      //   取りこぼして「このPCだけ一部の顧客が出ない」状態になっていた
      //   （2026-08-27にユーザーが報告：PCによって読めたり読めなかったりする）。
      for(let a=0;!Array.isArray(c)&&a<3;a++){
        await new Promise(r=>setTimeout(r,800*(a+1)));
        c=await sGet(STOR+'cf-'+sn+'-chunk-'+i);
      }
      return Array.isArray(c)?c:null;
    })
  );
  const customers=chunks.filter(Boolean).flat();
  // _complete=false は「サーバー上のデータが欠けている」の合図。呼び出し側で警告を出す。
  const _complete=chunks.every(Boolean)&&(!idx.total||customers.length===idx.total);
  const _missing=chunks.filter(c=>!c).length;
  if(!_complete)console.warn('[CF] 読み込み不完全',name,customers.length,'/',idx.total,'欠け',_missing,'/',idx.chunks);
  return{name:idx.name,customers,_complete,_expected:idx.total,_missing,_chunks:idx.chunks};
};
// 全ファイルリスト
let __lastCfIndex=null; // 最後に読めたサーバー側の顧客ファイル一覧（読み取り失敗時のフォールバック）
const saveFilesIndex=async(files,opts)=>{
  const _o=opts||{};
  const seen=new Set(),merged=[];
  files.forEach(f=>{if(!seen.has(f.name)){seen.add(f.name);merged.push({name:f.name,count:f.customers.length});}});
  // ★サーバーにあってローカルに無いファイルは消さない。読み込みに一度失敗しただけの月を
  //   一覧から落とすと、そのファイルが全員のPCから見えなくなる。削除は明示指定(remove)のみ。
  // ★サーバー値を読めなかった時に「一覧は空」とみなすと、他の月を一覧から消してしまう
  //   （2026-08-24に202607が実際に消えた）。読めない時は最後に読めた一覧を使う。
  let cur=null;try{cur=await sGet(STOR+'cf-index');}catch(e){}
  if(Array.isArray(cur))__lastCfIndex=cur; else cur=__lastCfIndex;
  if(Array.isArray(cur))cur.forEach(x=>{if(x&&x.name&&!seen.has(x.name)){seen.add(x.name);merged.push(x);}});
  const rm=new Set(_o.remove||[]);
  const index=merged.filter(x=>!rm.has(x.name));
  // 全員のPCが最初に読む一覧。ここが落ちると取り込んだファイルが誰にも見えないので必ず確認する。
  return await sSetVerified(STOR+'cf-index',index,
    back=>Array.isArray(back)&&back.length===index.length&&index.every(x=>back.some(b=>b&&b.name===x.name)));
};
const deleteFileFromCache=(file)=>{
  const sn=safeName(file.name);
  try{localStorage.removeItem(STOR+'cf-'+sn);}catch(e){}
};
// ★削除したファイルの中身もサーバーから消す（2026-09-23）。
//   以前は一覧（cf-index）から名前を外すだけで、チャンクはそのまま残していた。
//   そのため「消したはずの月」が他のPCの画面に残り続け、そのPCが何かを保存すると
//   一覧に名前が戻って全員のところに復活しうる状態だった。
const deleteFileOnServer=async(name,onStep)=>{
  const sn=safeName(name);
  let chunks=0;
  try{ const idx=await sGet(STOR+'cf-'+sn+'-index'); if(idx&&idx.chunks)chunks=idx.chunks; }catch(e){}
  let done=0;
  for(let i=0;i<chunks;i++){
    try{ await sSet(STOR+'cf-'+sn+'-chunk-'+i,null); }catch(e){}
    done++; if(onStep)onStep(done,chunks+1);
  }
  try{ await sSet(STOR+'cf-'+sn+'-index',null); }catch(e){}
  if(onStep)onStep(chunks+1,chunks+1);
};
const RES_COLORS=['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#e11d48','#14b8a6','#a855f7'];

// ── 予約1件を insp（サーバー最新値）に適用する純関数 ──
// ★必ず「サーバーから読んだ最新値」を base に渡すこと。以前は保存開始時に一度読んだ値を
//   使い回して全文を書き戻していたため、その間に他PCが入れた予約を巻き添えで消していた。
// ★同じ車の予約かどうか（2026-10-04）。custId はファイルを取り込み直すと変わるので、
//   氏名＋ナンバー4桁＋車種でも照合する。
const bkNorm=s=>String(s==null?'':s).normalize('NFKC').replace(/[\s　]/g,'').toLowerCase();
const isSameVehicleRow=(r,c)=>!!r&&!!c&&bkNorm(r.name)===bkNorm(c.name)
  &&String(r.no==null?'':r.no)===String(c.no==null?'':c.no)
  &&bkNorm(r.carType)===bkNorm(c.carType);
// その人の予約が「今から入れる日」以外の日にも入っているか（custId では見つからない分）
const findOtherDayRows=(insp,customer,dkFormatted)=>{
  const out=[];
  Object.keys(insp||{}).forEach(d=>{
    if(d===dkFormatted||!Array.isArray(insp[d]))return;
    (insp[d]||[]).forEach((r,i)=>{
      if(!r||!r.name||r.bookingStatus==='cancelled')return;
      if(customer.custId&&r.custId===customer.custId)return;    // これは今までどおり自動で外れる
      if(isSameVehicleRow(r,customer))out.push({dk:d,idx:i,row:r});
    });
  });
  return out;
};
// ★外した古い予約に紐づく代車・レンタカーを消す（2026-10-04）。
//   bookingKey は行の位置で決まるので行がずれると空振りする。その人＋開始日でも照合する。
const resDropForMove=(base,{keys,custId,name,dks})=>{
  const src=(base&&typeof base==='object'&&!Array.isArray(base))?base:{};
  const out={};let touched=false;
  const startDk=r=>(r&&r.fy!=null)?(r.fy+'-'+(Number(r.fm)+1)+'-'+r.fd):'';
  for(const cid of Object.keys(src)){
    const days={...(src[cid]||{})};
    Object.keys(days).forEach(k=>{
      const r=days[k];if(!r)return;
      const byKey=!!(r.bookingKey&&(keys||[]).includes(r.bookingKey));
      const byWho=(!!custId&&r.custId===custId)||(!!name&&bkNorm(r.user)===bkNorm(name));   // 氏名のスペースの違いは気にしない
      const byDay=byWho&&(dks||[]).includes(startDk(r));
      if(byKey||byDay){delete days[k];touched=true;}
    });
    out[cid]=days;
  }
  return touched?out:undefined;
};
// ★保管箱（insp-arch）から「同じ予約」を外す（2026-10-04）。
//   14日より前の予約は insp から insp-arch に移してあり、画面は両方を合体して出す。
//   日付を変えても保管箱の古い行が残ると、同じ人が2件出たままになる（テスト版 辻井さんで確認）。
//   消すのは custId が同じ行だけ。氏名で消すと、本当の過去の車検履歴まで消えてしまう。
//   行は詰めずに null にする（後ろの行の bookingKey＝代車の紐付けを壊さないため）。
const archDropSameBooking=(arch,custId,keepDk)=>{
  if(!custId||!arch||typeof arch!=='object'||Array.isArray(arch))return undefined;
  const out={};let hit=false;
  Object.keys(arch).forEach(d=>{
    const rows=Array.isArray(arch[d])?arch[d]:arch[d];
    if(d===keepDk||!Array.isArray(rows)){out[d]=rows;return;}
    const next=rows.map(r=>(r&&r.custId===custId&&r.bookingStatus!=='cancelled')?(hit=true,null):r);
    out[d]=next;
  });
  return hit?out:undefined;
};
const applyBookingToInsp=(base,{customer,dkFormatted,row,inspLimits,movePerson})=>{
  const data=(base&&typeof base==='object'&&!Array.isArray(base))?{...base}:{};
  const recalc=new Set();
  let oldRow=null,oldDk=null;
  for(const d of Object.keys(data)){
    if(!Array.isArray(data[d]))continue;
    const before=data[d].length;
    // ★custId が一致する行に加えて、同じ車（氏名＋ナンバー＋車種）の行も外す（2026-10-04）。
    //   movePerson が false の時は今までどおり custId だけ（利用者が「両方残す」を選んだ時）。
    const sameBooking=r=>!!r&&(
      (!!customer.custId&&r.custId===customer.custId)||
      (movePerson&&r.bookingStatus!=='cancelled'&&isSameVehicleRow(r,customer)));
    const hit=data[d].find(r=>sameBooking(r)&&r.bookingStatus!=='cancelled');
    if(hit){oldRow=hit;oldDk=d;}
    data[d]=data[d].filter(r=>!sameBooking(r)); // 入庫日変更に対応（旧行を除去）
    if(data[d].length!==before)recalc.add(d);
  }
  const sameDay=!!(oldRow&&oldDk===dkFormatted);
  // 同じ日への再保存は予約順(seq)と手動承認(approved)を引き継ぐ。日付変更は移動先の最後尾＝新seq
  // ★代車名(loaner/loanerId)は、今回の保存で指定が無ければ元の行の値を引き継ぐ。
  //   この行は丸ごと入れ替える作りなので、引き継がないとリストから保存し直すたびに
  //   スケジュール側で入れた代車名が消える。代車予約(lres)は残るので画面上は
  //   出続けるが、カードの中身と食い違う（2026-09-03 実データで発見：コイズミさん）。
  const newRow={...row,
    ...(row.loaner===undefined&&oldRow?{loaner:oldRow.loaner||'',loanerId:oldRow.loanerId??null}:{}),
    seq:(sameDay&&oldRow.seq!=null)?oldRow.seq:(row.seq||Date.now()),
    ...(sameDay&&oldRow.approved?{approved:true}:{})};
  if(!Array.isArray(data[dkFormatted]))data[dkFormatted]=[];
  data[dkFormatted]=[...data[dkFormatted],newRow];
  const idx=data[dkFormatted].length-1;
  const bKey=`insp-${dkFormatted}-${idx}`;
  data[dkFormatted][idx]={...newRow,bookingKey:bKey};
  const lim=(inspLimits&&inspLimits[dkFormatted])??6;
  data[dkFormatted]=recomputeInspApproval(data[dkFormatted],lim);
  data[dkFormatted]=applyMahPendingRule(data[dkFormatted],idx);
  recalc.delete(dkFormatted);
  recalc.forEach(d=>{data[d]=recomputeInspApproval(data[d],(inspLimits&&inspLimits[d])??6);});
  return {data,idx,bKey};
};
const inspHasCust=(insp,dk,custId,name)=>((insp&&insp[dk])||[]).some(r=>r&&r.bookingStatus!=='cancelled'&&(custId?r.custId===custId:r.name===name));

// ── 予約順(seq)ベースの承認状態 再計算（index_dev.htmlのBLOCK-Cと同一の純関数。変更時は両方同時に）──
// 各insp行の seq（予約順）で昇順に並べ、先着 limit 台=確定 / 超過分=承認待ち(pendingApproval=true)。
// レギュラー車検(course=3)は別途1日3台まで。承認は予約に固定されず枠に紐づく:
// 先着枠内に入った行は承認待ち・手動承認(approved)とも外して通常確定（6台以内に繰り上がれば承認バッジが消える）。
// 枠外でも本店が手動承認(approved)した行だけは確定維持（承認済みバッジ）。
const recomputeInspApproval = (rows, limit) => {
  const lim = (limit!=null) ? limit : 6;
  const out = rows.map(r => (r ? {...r} : r));
  const active = out
    .map((r, i) => ({ r, i }))
    .filter(x => x.r && x.r.name && x.r.course && x.r.bookingStatus !== 'cancelled');
  active.sort((a, b) => {
    const sa = (a.r.seq != null) ? a.r.seq : a.i;
    const sb = (b.r.seq != null) ? b.r.seq : b.i;
    return sa - sb;
  });
  let conf = 0, reg = 0;
  for (const { r } of active) {
    const isReg = Number(r.course) === 3;
    const eligible = (conf < lim) && (!isReg || reg < 3);
    if (eligible) {
      delete r.pendingApproval;       // 先着枠内 → 確定
      delete r.approved;              // 枠内に繰り上がった → 手動承認も解除
      conf++; if (isReg) reg++;
    } else if (r.approved) {
      delete r.pendingApproval;       // 枠外だが手動承認済み → 確定維持
      conf++; if (isReg) reg++;
    } else {
      r.pendingApproval = true;       // 枠外・未承認 → 承認待ち
    }
  }
  return out;
};
// マッハ車検1日2台ルール（リスト経由の予約だけの追加条件・従来挙動の維持）。
// 注: スケジュール側のrecomputeにはこのルールが無いため、スケジュール側で保存されると外れる。
const applyMahPendingRule=(rows,targetIdx)=>{
  const t=rows[targetIdx];
  if(!t||Number(t.course)!==1||t.pendingApproval)return rows;
  const others=rows.filter((r,i)=>i!==targetIdx&&r&&r.name&&Number(r.course)===1&&!r.pendingApproval&&r.bookingStatus!=='cancelled');
  if(others.length>=2){const out=[...rows];out[targetIdx]={...t,pendingApproval:true};return out;}
  return rows;
};

// GAS通信
// ═══════════════════════════════════════════
// ★サーバーに繋がっているかの目印。読み取りに失敗した時に画面を空のまま描くと
//   「データが全部消えた」ように見える（2026-08-26、実際にユーザーが消失と誤解した）。
//   はっきり知らせるための状態をここで持つ。データそのものには一切触れない。
const markGasUp   = ()=>{try{window.__hubGasDown=0;}catch(e){}};
const markGasDown = ()=>{try{if(!window.__hubGasDown)window.__hubGasDown=Date.now();}catch(e){}};

// ── Firestore 保存層（Kyoshi承認のBLOCK-B変更・2026-09-18。index_dev.html と同じ規則）──
//   コレクション kv、ドキュメントID＝キー名、{v: JSON文字列, u: サーバー時刻}。値の意味は GAS 版と同じ。
//   sGet / sSet はこの層を通る。fbLive(keys, onChange) で購読したキーは onSnapshot で手元に届き続けるので、
//   以後の sGet はサーバーを読みに行かず手元の最新値を返す（15秒ごとのポーリングを読み取り0回にする）。
let fbDb = null;
const FB_ON = (() => {
  try {
    if (BACKEND !== 'firebase' || typeof firebase === 'undefined' || !firebase.firestore || typeof HUB_FIREBASE_CONFIG === 'undefined') return false;
    if (!firebase.apps.length) firebase.initializeApp(HUB_FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    return true;
  } catch (e) { console.error('[FB] 初期化に失敗したため GAS 版で動きます', e); return false; }
})();
try { window.__hubBackend = FB_ON ? 'firebase' : 'gas'; } catch (e) {}
const FB_TIMEOUT_MS = 25000;
const fbUp = () => { try { window.__hubGasDown = 0; } catch (e) {} };
const fbDown = () => { try { if (!window.__hubGasDown) window.__hubGasDown = Date.now(); } catch (e) {} };
// ドキュメントID。'/' は使えない。STOR で始まらないキー（'schedRestrictions' や 'hub-v8-gasping'）は STOR を前置して
//   この環境のものとして扱う（DEV と本番で同じ行を共有していた古い作りを、ここで環境ごとに分ける）。
const fbDocId = k => { k = String(k); if (k.indexOf(STOR) !== 0) k = STOR + k; return k.replace(/\//g, '%2F'); };
const fbDoc = k => fbDb.collection('kv').doc(fbDocId(k));
const fbParse = snap => {
  if (!snap || !snap.exists) return null;
  const d = snap.data() || {};
  if (typeof d.v !== 'string' || d.v === '' || d.v === 'null') return null;
  try { const p = JSON.parse(d.v); return (p && typeof p === 'object' && p.error) ? null : p; } catch (e) { return null; }
};
const fbWithTimeout = (p, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout: ' + label)), FB_TIMEOUT_MS))]);
// 購読中のキーの手元の最新値。{loaded, value}
const fbLiveMap = new Map();
const fbLive = (keys, onChange) => {
  if (!FB_ON) return () => {};
  let timer = null;
  const fire = () => { if (timer) return; timer = setTimeout(() => { timer = null; try { onChange && onChange(); } catch (e) {} }, 150); };
  const unsubs = keys.map(k => {
    const ent = { loaded: false, value: null, unsub: null, dead: false };
    fbLiveMap.set(k, ent);
    const start = () => { if (ent.dead || ent.unsub) return; try {
      ent.unsub = fbDoc(k).onSnapshot({ includeMetadataChanges: false }, snap => {
        const fromCache = !!(snap.metadata && snap.metadata.fromCache);
        if (fromCache && !snap.exists && !ent.loaded) { fbDown(); return; }   // 回線断で手元にも無い＝まだ読めていない
        ent.value = fbParse(snap); ent.loaded = true; if (!fromCache) fbUp(); fire();
      }, err => { console.error('[FB] 購読に失敗', k, err && err.message); if (!(err && err.code === 'permission-denied')) fbDown(); });
    } catch (e) { console.error('[FB] 購読できません', k, e); } };
    if (fbAuth) fbWhenUser(start); else start();   // サインインしてから購読する（未サインインではルールに拒否される）
    return () => { ent.dead = true; try { ent.unsub && ent.unsub(); } catch (e) {} if (fbLiveMap.get(k) === ent) fbLiveMap.delete(k); };
  });
  return () => unsubs.forEach(u => u());
};
const fbGet = async k => {
  const ent = fbLiveMap.get(k);
  if (ent && ent.loaded) return ent.value;   // 購読中＝手元が常に最新（自分の書き込みも即座に反映される）
  if (fbAuth) { await fbWhenReady(); if (!fbUser) return null; }   // 未サインインは「まだ読めない」（赤い帯は出さない）
  try { const s = await fbWithTimeout(fbDoc(k).get({ source: 'server' }), 'get ' + k); fbUp(); return fbParse(s); }
  catch (e) { console.warn('[FB] 読めません', k, e && e.message); fbDown(); return null; }
};
const fbSet = async (k, v) => {
  if (fbAuth && !fbUser) { console.warn('[FB] 未サインインのため書けません', k); return false; }
  try { await fbWithTimeout(fbDoc(k).set({ v: JSON.stringify(v), u: firebase.firestore.FieldValue.serverTimestamp() }), 'set ' + k); fbUp(); return 'ok'; }
  catch (e) { console.error('[FB] 書けません', k, e && e.message); fbDown(); return false; }
};
// サーバー最新値 base → mutate(base) を書く。他端末と衝突したら Firestore が自動でやり直す（mutate は純関数であること）。
//   戻り値: 'ok' / 'nochange'（mutate が undefined）/ false（失敗）。書いた値は opts.out.val に入る。
const fbTxn = async (k, mutate, opts) => {
  const _o = opts || {};
  let mutateErr = null;
  if (fbAuth && !fbUser) { console.warn('[FB] 未サインインのため書けません', k); return false; }
  try {
    const r = await fbWithTimeout(fbDb.runTransaction(async t => {
      const s = await t.get(fbDoc(k));
      const base = fbParse(s);
      if (_o.requireBase && s && s.exists && !(base && typeof base === 'object')) throw Object.assign(new Error('base broken'), { hubAbort: true });
      let val;
      try { val = mutate(base); } catch (e) { mutateErr = e; throw Object.assign(new Error('mutate failed'), { hubAbort: true }); }
      if (val === undefined) return 'nochange';
      t.set(fbDoc(k), { v: JSON.stringify(val), u: firebase.firestore.FieldValue.serverTimestamp() });
      if (_o.out) _o.out.val = val;
      return 'ok';
    }), 'txn ' + k);
    fbUp();
    return r;
  } catch (e) {
    if (!(e && e.hubAbort)) fbDown();
    console.error('[FB] 保存に失敗', k, (mutateErr && mutateErr.message) || (e && e.message));
    return false;
  }
};

const HUB_HANDOFF_ID='';   // 顧客リストは引き継ぎ（?hand=）を扱わない（index / mobile で受け取る）
// ── 本人認証：Firebase Authentication（メールリンク）（Kyoshi承認のBLOCK-B変更・2026-09-18）──
//   6桁コードと GAS の利用証は廃止。届いたメールのリンクを開くだけで、その端末（ブラウザ）が本人として

const sGet=async(k,retries=3)=>{
  if(FB_ON)return fbGet(k);            // 保存先が Firestore のとき（2026-09-18）
  for(let i=0;i<retries;i++){
    try{
      const r=await fetch(`${GAS_URL}?key=${encodeURIComponent(k)}&apiKey=${encodeURIComponent(GAS_API_KEY)}`,{cache:'no-store'});
      if(r.status===503){
        if(i<retries-1){await new Promise(r=>setTimeout(r,2000*(i+1)));continue;}
        markGasDown(); return null;
      }
      const t=await r.text();
      // 値が無いだけ（'null'）は「繋がっているが空」＝異常ではない
      if(!t||t==='null'||t.startsWith('error')||t==='unauthorized'){markGasUp();return null;}
      try{const v=JSON.parse(t);markGasUp();return v;}catch{markGasDown();return null;}
    }catch{if(i===retries-1){markGasDown();return null;}}
  }
  markGasDown();
  return null;
};

let __gasWriteQueue=Promise.resolve();

const __sSetOnce=async(k,v)=>{
  const body=JSON.stringify({key:k,value:JSON.stringify(v),apiKey:GAS_API_KEY});
  try{
    const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const t=String((await r.text())||'').trim();
    if(t==='ok')return 'ok';
    if(t.indexOf('lock_timeout')>=0)return 'busy';
    return 'error:'+t.slice(0,80);
  }catch(e){
    try{await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});}catch(e2){}
    return 'unknown';
  }
};
const sSet=async(k,v,retries=4)=>{
  if(FB_ON){                              // 保存先が Firestore のとき（2026-09-18）
    window.__hubWriteBusy=(window.__hubWriteBusy||0)+1;
    try{ return await fbSet(k,v); }finally{ try{window.__hubWriteBusy=Math.max(0,(window.__hubWriteBusy||1)-1);}catch(e){} }
  }
  window.__hubWriteBusy=(window.__hubWriteBusy||0)+1;
  const job=__gasWriteQueue.then(async()=>{
    for(let i=0;i<retries;i++){
      const r=await __sSetOnce(k,v);
      // ★'ok' はGASが「シートに書き終えた」と返した証拠。'unknown' は応答が読めない環境
      //   （CORS遮断でno-corsに落ちた時）で、成否不明。呼び出し側が読み返しの要否を判断できるよう
      //   真偽値ではなく状態を返す（どちらも真値なので既存の if(await sSet(...)) はそのまま動く）。
      if(r==='ok'||r==='unknown')return r;
      if(r==='busy'){
        console.warn('[WRITE] GAS混雑(lock_timeout)→待って再送',k,'attempt',i+1);
        await new Promise(x=>setTimeout(x,3000+4000*i));
        continue;
      }
      console.error('[WRITE] GASがエラーを返しました',k,r);
      return false;
    }
    console.error('[WRITE] 混雑が続き書き込めませんでした',k);
    return false;
  }).catch(e=>{console.error('[WRITE] 例外',k,e);return false;});
  __gasWriteQueue=job.then(()=>{},()=>{});
  try{return await job;}finally{try{window.__hubWriteBusy=Math.max(0,(window.__hubWriteBusy||1)-1);}catch(e){}}
};
// ★sSetはno-cors。GASが 'error: lock_timeout' を返しても成功として返るため、書けたことにならない。
//   重要なキーは必ずこれで書く: 書く→読み返す→期待どおりでなければサーバー最新値から作り直して再送。
//   mutate(server最新値)→保存する値 を返す関数。check(読み返した値)→true で成功。
const writeVerified=async(key,mutate,check,tries=3,opts)=>{
  const _o=opts||{};
  if(FB_ON){
    // ★Firestore：トランザクション1回で「サーバー最新値を読む→変更→書く」（他端末と衝突すれば自動やり直し）。
    //   書けたら内容ごと確定するので読み返し検算は不要。失敗は少し待って tries 回まで。
    for(let i=0;i<tries;i++){
      const r=await fbTxn(key,mutate,{requireBase:_o.requireBase});
      if(r==='ok'||r==='nochange')return true;
      if(i<tries-1)await new Promise(r=>setTimeout(r,1500+1500*i));
    }
    console.error('[WRITE] Firestoreに反映できませんでした:',key);
    return false;
  }
  for(let i=0;i<tries;i++){
    let base=null;
    try{base=await sGet(key);}catch(e){}
    // ★サーバー値を読めなかった時（GASの一時的な失敗・混雑。sGetはエラーもnullで返す）に
    //   「空っぽ」とみなして書くと、その1回でそのキーの全予約を消してしまう。requireBase 指定時は
    //   書かずに次の試行へ回し、3回とも読めなければ失敗として呼び出し側に返す（2026-07-30）。
    if(_o.requireBase&&!(base&&typeof base==='object')){
      console.warn('[WRITE] サーバー値を読めないため書き込みを見送り',key,'attempt',i+1);
      await new Promise(r=>setTimeout(r,1500+1500*i));
      continue;
    }
    let val;
    try{val=mutate(base);}catch(e){return false;}
    if(val===undefined)return true; // 変更不要
    await sSet(key,val);
    await new Promise(r=>setTimeout(r,1500+1500*i));
    try{
      const back=await sGet(key);
      if(check(back))return true;
    }catch(e){}
    console.warn('[WRITE] 未反映→再送',key,'attempt',i+1);
  }
  console.error('[WRITE] GASに反映できませんでした:',key);
  return false;
};

// ★裏で走っている保存を数える（顧客リストは index の全画面オーバーレイ＝iframe で開かれる）。
//   予約1件の保存は、スケジュール(insp)だけを await して、リスト本体・カレンダー枠(custbk)・
//   代車・他PCへの通知は「裏で続ける」作りになっている。ところがオーバーレイを閉じると
//   iframe ごと破棄され、裏の保存はその場で全部死ぬ（ページ遷移ではないので beforeunload も出ない）。
//   実測: 保存の3秒後に「スケジュールに戻る」を押すと、insp だけ残ってリスト・custbk・通知が消えた。
//   ＝2026-08-24の月本さん、8-25の三村電機の「スケジュールにはあるのにリストが未予約」の正体。
//   __hubWriteBusy は「GASへ送信中」しか数えないので、送信前の読み取り待ちを取りこぼす。
//   そこで保存の一連の処理そのものを数え、終わるまで画面を閉じさせない。
const trackSave=(p)=>{
  try{ window.__hubBusyOps=(window.__hubBusyOps||0)+1; }catch(e){}
  return Promise.resolve(p).catch(()=>{}).then(()=>{
    try{ window.__hubBusyOps=Math.max(0,(window.__hubBusyOps||1)-1); }catch(e){}
  });
};
// ★index_dev.html の mergeSharedObjects と同じ規則。サーバー値で丸ごと置き換えると、
//   保存した代車がまだGASに届いていない間にタブ復帰が入った時に一瞬消えてしまう。
//   ローカルにしか無いレコードは「作られたばかり(3分以内)」の間だけ残す。
const SHARED_FRESH_MS=180000;
// ★id と savedAt の大きい方（index_dev.html と同じ規則。Kyoshi承認のBLOCK-B変更・2026-09-16）
const sharedRecTs=r=>(r&&typeof r==='object')?Math.max(Number(r.id)||0,Number(r.savedAt)||0):0;
const sharedRecFresh=(r,nowTs)=>{const t=sharedRecTs(r);return t?((nowTs-t)<SHARED_FRESH_MS):true;};
const mergeSharedObjects=(local,server,nowTs)=>{
  const mg={...server};
  for(const cid of Object.keys(local||{})){
    const lCar=local[cid]||{}, gCar=mg[cid]||{};
    if(Array.isArray(lCar)||Array.isArray(gCar))continue;
    // ★数値・文字列など入れ子でない値はサーバー値をそのまま使う（{...5}={} で壊れるため・2026-09-24）
    if(!(lCar&&typeof lCar==='object')||!(gCar&&typeof gCar==='object'))continue;
    const merged={...gCar};
    for(const day of Object.keys(lCar)){
      const lRec=lCar[day], gRec=gCar[day];
      const newerLocal=!(day in gCar)||(sharedRecTs(lRec)||0)>(sharedRecTs(gRec)||0);
      if(newerLocal&&sharedRecFresh(lRec,nowTs))merged[day]=lRec;
    }
    mg[cid]=merged;
  }
  return mg;
};
// ★代車予約の置き方。index_dev.html の removeResByBk / putResRec と同じ規約にそろえる。
//   構造は {carId:{キー:予約}}。キー名自体に意味は無く、予約は id / bookingKey / custId で特定する。
//   ・resRemoveRes … 同じ予約（bookingKey か custId が一致）を全車から取り除く
//   ・resPutRec    … 希望キーが別予約で埋まっていたらサフィックスを付けて逃がす
//   ★リスト側は希望キーへ無条件で上書きしていたため、同じ代車・同じ開始日の別予約を
//     無言で消していた（2026-08-26、タント8/25開始の予約が上書きされて消えたのを確認）。
//     index側は v1.76 で直っていたが、リスト側が直し漏れていた。
const _lresObj=b=>(b&&typeof b==='object'&&!Array.isArray(b))?b:{};
const resRemoveRes=(base,{bookingKey,custId})=>{
  const src=_lresObj(base),out={};
  for(const cid of Object.keys(src)){
    const days={...(src[cid]||{})};
    Object.keys(days).forEach(k=>{
      const r=days[k];if(!r)return;
      if(bookingKey&&r.bookingKey===bookingKey)delete days[k];
      else if(custId&&r.custId===custId)delete days[k];
    });
    out[cid]=days;
  }
  return out;
};
const resPutRec=(base,carId,wantKey,rec)=>{
  const src=_lresObj(base),days={...(src[carId]||{})};
  let k=String(wantKey);
  if(days[k]&&days[k].id!==rec.id)k=`${wantKey}_${rec.id}`; // 別予約が居たら横へ逃がす
  days[k]={...rec};
  return {...src,[carId]:days};
};

// 年の無い日付（__MD__MM-DD）に年を入れる。基準はファイル名の年月（202610 など）。
//   例：202610 のファイルで「9/25」→ 2026-09-25、「1/5」→ 2027-01-05
const fixMD=(v,baseY,baseM)=>{
  if(typeof v!=='string'||v.indexOf('__MD__')!==0)return v||'';
  const [mm,dd]=v.slice(6).split('-').map(Number);
  if(!mm||!dd)return '';
  let y=baseY;
  if(baseM&&mm-baseM>6)y--;         // 基準より半年以上あと → 前の年
  if(baseM&&baseM-mm>6)y++;         // 基準より半年以上まえ → 次の年
  return `${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
};
const parseExcelDate=v=>{
  if(v===null||v===undefined||v==='')return'';
  // Dateオブジェクトの場合
  if(v instanceof Date){
    if(isNaN(v.getTime()))return'';
    return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  }
  // Excel数値（シリアル値）
  if(typeof v==='number'&&v>1000){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  const s=String(v).trim();
  if(!s)return'';
  // ISO形式・スラッシュ形式
  let m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // MM/DD/YYYY形式
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){const y=m[3].length===2?`20${m[3]}`:m[3];return`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  // 和式（2026年9月25日 / 9月25日）
  m=s.match(/^(?:(\d{4})年)?\s*(\d{1,2})月\s*(\d{1,2})日/);
  if(m)return m[1]?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:`__MD__${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // 年の無い「9/25」「9-25」…どの年かは呼び出し側（ファイル名の年月）で決める
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})\s*(?:[（(][^)）]*[)）])?$/);
  if(m)return `__MD__${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  // JavaScriptのDate.toString()の場合（Mon Jun 01 2026...）
  const d2=new Date(s);
  if(!isNaN(d2.getTime())&&s.length>6){
    return`${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}-${String(d2.getDate()).padStart(2,'0')}`;
  }
  return'';
};
const fmtDate=s=>{if(!s)return'';const p=s.split('-');return p.length===3?`${p[1]}/${p[2]}`:s;};
const fmtDateShort=s=>{if(!s)return'';const p=s.split('-');return p.length===3?`${p[1]}/${p[2]}`:s;};
const today=()=>new Date().toISOString().split('T')[0];

// 特典自動判定
const calcTokuten=(expiry,bookDate)=>{
  if(!expiry||!bookDate)return'-';
  const diff=(new Date(expiry)-new Date(bookDate))/(1000*60*60*24);
  if(diff>=60)return'②';
  if(diff>=30)return'①';
  return'-';
};

// 特典欄の掃除：Excelの「特典」列に日付が入っていると（入庫日を隣の列に打った等）
//   Dateがそのまま文字になって「Sun Nov 08 2026 00:00:00 GMT+0900」のように表示されてしまう。
//   特典は「-」「①」「②」しか無いので、日付らしいものは「-」として扱う（2026-09-11）。
const isDateLike=v=>v instanceof Date||/GMT[+-]\d|^\d{4}-\d{1,2}-\d{1,2}|^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(String(v==null?'':v).trim());
const cleanTokuten=t=>{if(t==null||isDateLike(t))return'-';const x=String(t).trim();return x||'-';};

// 受注日のDM列判定
const calcDMCol=(dm1Date,dm2Date,bookDate)=>{
  if(!bookDate)return null;
  if(dm2Date&&bookDate>=dm2Date)return'dm2';
  return'dm1';
};

// 固有番号生成（ファイル名＋行番号＋フルネーム＋ナンバー4桁）
const makeCustId=(fileName,rowIdx,name,no)=>{
  // 全角スペース・スペースを除去、全角英数を半角に正規化
  const normName=String(name||'').replace(/[\s　]/g,'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const normNo=String(no||'').trim();
  return `${fileName}__${rowIdx}__${normName}__${normNo}`;
};

// セル背景色 → ステータス変換
const cellColorToStatus=hexColor=>{
  if(!hexColor)return null;
  const h=hexColor.replace('#','').toUpperCase();
  // 黄系 → 初回車検
  if(/^FF(F[5-9A-F]|[A-E][0-9A-F])[0-9A-F]{2}$/i.test(h)||h==='FFFF00'||h==='FFFF99'||h==='FFFACD'||h.startsWith('FFE')||h.startsWith('FFF'))
    return'new_car';
  // 青系 → 本予約
  if(h.startsWith('ADD')||h.startsWith('B0C')||h.startsWith('9FC')||h==='87CEEB'||h==='87CEFA'||h.startsWith('00B')||h.startsWith('00C')||(/^[0-9A-F]{2}[0-9A-F]{2}F[0-9A-F]$/i.test(h)))
    return'confirm';
  // 緑系 → 仮予約
  if(h.startsWith('90E')||h.startsWith('98F')||h==='00FF00'||h.startsWith('00F')||h.startsWith('7FFF')||(/^[0-9A-F]{2}[C-F][0-9A-F]{3}$/i.test(h)))
    return'temp';
  // 赤系 → キャンセル
  if(h==='FF0000'||h.startsWith('FF0')||h.startsWith('FF4')||h.startsWith('F08')||h.startsWith('FA8'))
    return'cancel';
  return null;
};

const parseExcelFile=async(file)=>{
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary',cellDates:true,cellStyles:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

        // ヘッダー行検出
        let headerRow=-1;
        // ヘッダー行検出：「名称」「NO」「車種」のうち2つ以上一致
        const kws=['名称','NO','車種','点検','満期'];
        for(let i=0;i<Math.min(15,rows.length);i++){
          const s=rows[i].join('');
          if(kws.filter(k=>s.includes(k)).length>=2){headerRow=i;break;}
        }
        if(headerRow<0){reject(new Error('ヘッダー行が見つかりません（名称・NO・車種 のいずれかを含む列が必要です）'));return;}

        // ヘッダー行：Dateオブジェクトや数値は日付文字列に変換
        const headers=rows[headerRow].map((h,hi)=>{
          if(h instanceof Date) return isNaN(h.getTime())?`__date_col_${hi}__`:h.toISOString().slice(0,10);
          if(typeof h==='number'&&h>1000){
            // Excelシリアル値を日付に変換して列名とする
            const d=new Date(Math.round((h-25569)*86400*1000));
            return isNaN(d.getTime())?`__date_col_${hi}__`:d.toISOString().slice(0,10);
          }
          return String(h||'').trim();
        });
        // 全角半角・スペース正規化して列名検索
        const norm=s=>String(s||'').replace(/[\s　]/g,'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).toUpperCase();
        const fc=(...kws)=>{for(const k of kws){const nk=norm(k);const i=headers.findIndex(h=>norm(h).includes(nk));if(i>=0)return i;}return-1;};

        const cExpiry =fc('点検満期','満期');
        const cName   =fc('名称','氏名');
        const cNo     =fc('NO','ナンバー');
        const cCar    =fc('車種');
        // 投函日列：①②の検索（複数パターン対応）
        // 投函日列検索：文字列パターン or Excelで日付ヘッダーになっているケース
        const allToukanCols=headers.map((h,i)=>{
          const hn=h.replace(/[\s　]/g,'');
          const isDm=(hn.includes('投函')||hn.includes('DM')||hn.includes('案内')||hn.includes('発送'))&&!hn.includes('予約')&&!hn.includes('後');
          return isDm?i:-1;
        }).filter(i=>i>=0);
        // 日付型ヘッダー列（ExcelでDateが列名になっているケース）
        const isDateCol=h=>h==='Invalid Date'||/^__date_col_/.test(h)||/^\d{4}-\d{2}-\d{2}$/.test(h);
        const allDateCols=headers.map((h,i)=>isDateCol(h)?i:-1).filter(i=>i>=0);
        let cDm1D,cDm2D;
        if(allToukanCols.length>=1){
          // 「投函」等の文字列で見つかった場合
          cDm1D=allToukanCols[0];
          cDm2D=allToukanCols[1]??-1;
        } else if(allDateCols.length>=2){
          // 日付型ヘッダーが2個以上 → 奇数番目=投函日、偶数番目=予約日
          cDm1D=allDateCols[0]??-1;
          cDm2D=allDateCols[2]??allDateCols[1]??-1;
        } else {
          cDm1D=fc('投函日①','投函①','投函日1','投函日','DM1','ＤＭ①','第１回','案内①');
          cDm2D=fc('投函日②','投函②','投函日2','DM2','ＤＭ②','第２回','案内②');
        }
        // 予約列（日付型ヘッダーの場合は偶数番目、文字列の場合は「予約」含む列）
        let cBook1=-1,cBook2=-1;
        if(allDateCols.length>=2&&allToukanCols.length===0){
          cBook1=allDateCols[1]??-1;
          cBook2=allDateCols[3]??-1;
        }
        // デバッグ保存
        window.__lastImportHeaders=headers;
        window.__lastImportDmCols={allToukanCols,allDateCols,cDm1D,cDm2D,cBook1,cBook2};
        // cBook1/cBook2は上部で定義済み（日付型ヘッダー対応）
        // 文字列「予約」含む列で上書き
        const bookColsStr=headers.map((h,i)=>h.includes('予約')?i:-1).filter(i=>i>=0);
        const cBook1f=bookColsStr[0]??cBook1??-1;
        const cBook2f=bookColsStr[1]??cBook2??-1;

        let cEntry  =fc('入庫日','車検日','入庫予定日','入庫予定','来店日');   // 2026-09-23：元ファイルの見出しが「車検日」等でも拾う
        if(cEntry<0){   // 見出しの言い回しが違う時：「入庫」「車検」を含む列（店舗・満期は除く）のうち、日付が入っている最初の列
          const cand=headers.map((h,i)=>({h:norm(h),i})).filter(x=>/入庫|車検/.test(x.h)&&!/店舗|満期|点検/.test(x.h));
          for(const c of cand){
            const hit=rows.slice(headerRow+1,headerRow+80).some(r=>r&&parseExcelDate(r[c.i]));
            if(hit){cEntry=c.i;break;}
          }
        }
        // ★見出しが日付そのもの（DM表の形）で「入庫日」の文字が無いファイル対策（2026-09-23）。
        //   投函①・予約①・投函②・予約② に使っていない日付列のうち、いちばん右で実際に日付が入っている列を入庫日とみなす。
        //   （元ファイル 202608 では H=投函① I=予約① J=投函② K=予約② L=入庫日 の並び）
        if(cEntry<0&&allDateCols.length>=1){
          const used=new Set([cDm1D,cDm2D,cBook1f,cBook2f].filter(x=>x>=0));
          const rest=allDateCols.filter(i=>!used.has(i));
          for(let k=rest.length-1;k>=0;k--){
            const i=rest[k];
            const n=rows.slice(headerRow+1).filter(r=>r&&parseExcelDate(r[i])).length;
            if(n>0){cEntry=i;break;}
          }
        }
        const cTok    =fc('特典');
        const cCourse =fc('種類','コース');
        const cStore  =fc('入庫店舗','店舗');
        const cStaff  =fc('担当');
        const cNote   =fc('備考');
        const cPhoneHome   =fc('自宅','tel（自宅）','自宅電話','自宅tel','tel(自宅)');
        const cPhoneMobile =fc('携帯','mobile','tel（携帯）','携帯電話','携帯tel','tel(携帯)');
        const cAddress     =fc('住所','address','所在地','住居','お住まい','〒','郵便');
        window.__lastImportCols={
          phoneHomeHeader:cPhoneHome>=0?headers[cPhoneHome]:'(未検出)',
          phoneMobileHeader:cPhoneMobile>=0?headers[cPhoneMobile]:'(未検出)',
          addressHeader:cAddress>=0?headers[cAddress]:'(未検出)',
        };

        const fileName=file.name.replace(/\.[^.]+$/,'');
        const _fm=fileName.match(/(20\d{2})[^0-9]?(\d{1,2})/);   // 202610 / 2026-10 など
        const baseY=_fm?Number(_fm[1]):new Date().getFullYear(), baseM=_fm?Number(_fm[2]):0;
        const pd=v=>fixMD(parseExcelDate(v),baseY,baseM);
        const customers=[];

        for(let i=headerRow+1;i<rows.length;i++){
          const row=rows[i];
          const name=String(row[cName]||'').trim();
          if(!name||name.includes('合計')||name.includes('件数'))continue;

          const expiry =pd(row[cExpiry]);
          const no     =String(row[cNo]||'').trim();
          const carType=String(row[cCar>=0?cCar:0]||'').trim();
          const dm1Date=pd(row[cDm1D>=0?cDm1D:null]);
          const dm1Book=pd(row[cBook1f>=0?cBook1f:null]);
          const dm2Date=pd(row[cDm2D>=0?cDm2D:null]);
          const dm2Book=pd(row[cBook2f>=0?cBook2f:null]);
          const entryDate=pd(row[cEntry>=0?cEntry:null]);
          const tokRaw =(()=>{const v=row[cTok>=0?cTok:null];return isDateLike(v)?'':String(v||'').trim();})(); // 日付が紛れていたら特典なし
          const courseRaw=(cCourse>=0?String(row[cCourse]||''):'').trim();
          const storeRaw=String(row[cStore>=0?cStore:null]||'').trim();
          const staff  =String(row[cStaff>=0?cStaff:null]||'').trim();
          const note   =String(row[cNote>=0?cNote:null]||'').trim();
          const phoneHome   =String(row[cPhoneHome>=0?cPhoneHome:null]||'').trim();
          const phoneMobile =String(row[cPhoneMobile>=0?cPhoneMobile:null]||'').trim();
          const address     =String(row[cAddress>=0?cAddress:null]||'').trim();

          // セル背景色からステータス取得
          const cellRef=XLSX.utils.encode_cell({r:i,c:cName>=0?cName:0});
          const cell=ws[cellRef];
          let statusFromColor=null;
          if(cell&&cell.s&&cell.s.fgColor){
            const fg=cell.s.fgColor;
            const hex=fg.rgb||fg.theme||'';
            statusFromColor=cellColorToStatus(hex);
          }

          // ステータス自動判定
          let status=statusFromColor||'none';
          if(!statusFromColor){
            if(entryDate)status='confirm';
            else if(dm1Book||dm2Book)status='confirm';
          }

          // コース変換（省略形・数字・部分一致も対応）
          const courseObj=COURSES.find(c=>courseRaw.includes(c.name)||courseRaw===c.short)
            ||(/^[123]$/.test(courseRaw)?COURSES.find(c=>c.id===Number(courseRaw)):null)
            ||(courseRaw.length>=2?COURSES.find(c=>courseRaw.includes(c.name.replace('車検',''))):null);

          // 店舗変換
          let storeId='';
          if(storeRaw.includes('三田')||storeRaw==='sanda')storeId='sanda';
          else if(storeRaw.includes('本店')||storeRaw==='honten')storeId='honten';

          // 特典変換
          const tokuten=tokRaw==='①'||tokRaw==='1'?'①':tokRaw==='②'||tokRaw==='2'?'②':tokRaw||'-';

          const custId=makeCustId(fileName,i,name,no);

          customers.push({
            custId,rowIdx:i,
            expiry,name,no:isNaN(Number(no))?no:Number(no),carType,
            phoneHome,phoneMobile,address,
            dm1Date,dm1Book,dm2Date,dm2Book,
            entryDate,tokuten,
            course:courseObj?courseObj.id:null,
            store:storeId,staff,note,status,
            bookingTime:'',
            linkedInspDate:'',
          });
        }
        const colName=i=>i>=0?headers[i]:'';
        const sampleOf=i=>{if(i<0)return '';for(let r=headerRow+1;r<Math.min(rows.length,headerRow+200);r++){const v=rows[r]&&rows[r][i];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v instanceof Date?v.toLocaleDateString('ja-JP'):v).slice(0,20);}return '';};
        const cnt=k=>customers.filter(c=>c[k]).length;
        resolve({name:fileName,customers,cols:{
          entryHeader:colName(cEntry), entryCount:cnt('entryDate'), entrySample:sampleOf(cEntry), entryCol:cEntry,
          expiryHeader:colName(cExpiry), expiryCount:cnt('expiry'),
          phoneHeader:[colName(cPhoneHome),colName(cPhoneMobile)].filter(Boolean).join('・'),
          phoneCount:customers.filter(c=>c.phoneHome||c.phoneMobile).length,
          addressHeader:colName(cAddress), addressCount:cnt('address'),
          headers:headers.filter(Boolean).join(' / '),
        }});
      }catch(err){reject(err);}
    };
    reader.onerror=()=>reject(new Error('ファイル読み込みエラー'));
    reader.readAsBinaryString(file);
  });
};

const LoanerGrid=memo(({storeId,entryDate,loanerRes,loanerList,onSelect,selCarId,selDays})=>{
  const loaners=(loanerList&&loanerList.length>0)?loanerList:(storeId==='honten'?LOANERS_H:LOANERS_S);
  const dragRef=useRef({});

  // Hooksはreturnの前に全て宣言する必要がある
  const [startOffset,setStartOffset]=useState(0);
  const prevEntryRef=useRef(entryDate);

  // entryDate変化時にoffsetをリセット（useEffectで行う）
  useEffect(()=>{
    if(prevEntryRef.current!==entryDate){
      prevEntryRef.current=entryDate;
      setStartOffset(0);
    }
  },[entryDate]);

  if(!entryDate)return(
    <div style={{padding:'16px 0',color:'#94a3b8',fontSize:12,textAlign:'center'}}>
      入庫日を先に入力してください
    </div>
  );

  const toNum=(y,mo,d)=>y*10000+mo*100+d;
  const [y0,m0,d0]=entryDate.split('-').map(Number);

  // 表示開始日（入庫日-2日 + startOffset）
  const viewStart=new Date(y0,m0-1,d0-2+startOffset);

  // 30日分の日付配列
  const dates=Array.from({length:30},(_,i)=>{
    const d=new Date(viewStart.getFullYear(),viewStart.getMonth(),viewStart.getDate()+i);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dow=d.getDay();
    const isEntry=key===entryDate;
    const isMonthStart=d.getDate()===1;
    return{key,label:d.getDate(),month:d.getMonth()+1,dow,isEntry,isMonthStart};
  });

  const isBooked=(carId,key)=>{
    const [ky,km,kd]=key.split('-').map(Number);
    const dn=toNum(ky,km-1,kd);
    return Object.values(loanerRes[carId]||{}).some(r=>{
      const s=toNum(r.fy,r.fm,r.fd),e=toNum(r.ty,r.tm,r.td);
      return dn>=s&&dn<=e;
    });
  };

  const CELL=36;
  const NAME_W=88;

  return(
    <div style={{fontSize:11,userSelect:'none'}}>
      {/* ナビゲーター */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,paddingLeft:NAME_W}}>
        <button onClick={()=>setStartOffset(p=>p-30)}
          style={{background:'#e0e7ff',border:'none',borderRadius:5,padding:'2px 10px',cursor:'pointer',fontWeight:700,color:'#3730a3',fontSize:13}}>‹ 前</button>
        <span style={{fontSize:11,color:'#64748b',fontWeight:600}}>
          {dates[0].month}/{dates[0].label} 〜 {dates[29].month}/{dates[29].label}
        </span>
        <button onClick={()=>setStartOffset(p=>p+30)}
          style={{background:'#e0e7ff',border:'none',borderRadius:5,padding:'2px 10px',cursor:'pointer',fontWeight:700,color:'#3730a3',fontSize:13}}>次 ›</button>
      </div>
      {/* グリッド */}
      <div style={{overflowX:'auto'}}>
        <div style={{minWidth:NAME_W+CELL*30}}>
          {/* 日付ヘッダー */}
          <div style={{display:'flex',background:'#dbeafe',borderBottom:'2px solid #93c5fd'}}>
            <div style={{width:NAME_W,minWidth:NAME_W,padding:'4px 6px',fontWeight:700,color:'#374151',borderRight:'2px solid #93c5fd',fontSize:11,flexShrink:0}}>代車</div>
            {dates.map(({key,label,month,dow,isEntry,isMonthStart})=>(
              <div key={key} style={{
                width:CELL,minWidth:CELL,textAlign:'center',padding:'2px 1px',flexShrink:0,
                background:isEntry?'#1d4ed8':isMonthStart?'#ecfdf5':'#dbeafe',
                color:isEntry?'white':dow===0?'#dc2626':dow===6?'#7c3aed':'#1e1b4b',
                fontWeight:isEntry?800:isMonthStart?700:400,
                borderRight:'1px solid #bfdbfe',
                borderLeft:isMonthStart?'2px solid #22c55e':undefined,
                fontSize:10,lineHeight:1.3}}>
                {isMonthStart&&<div style={{fontSize:8,color:'#16a34a',fontWeight:800}}>{month}月</div>}
                <div>{label}</div>
                {isEntry&&<div style={{fontSize:8}}>◎</div>}
              </div>
            ))}
          </div>
          {/* 代車行 */}
          {loaners.map((car,ci)=>(
            <div key={car.id} style={{display:'flex',borderBottom:'1px solid #e0e7ff',background:ci%2===0?'white':'#f8faff'}}>
              <div style={{width:NAME_W,minWidth:NAME_W,padding:'5px 7px',borderRight:'2px solid #93c5fd',flexShrink:0}}>
                <div style={{fontWeight:700,fontSize:11,color:'#1e1b4b',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{car.name}</div>
                <div style={{fontSize:9,color:'#94a3b8'}}>{car.num}</div>
              </div>
              {dates.map(({key})=>{
                const booked=isBooked(car.id,key);
                const sel=selCarId===car.id&&(selDays||[]).includes(key);
                return(
                  <div key={key}
                    style={{width:CELL,minWidth:CELL,height:32,borderRight:'1px solid #e0e7ff',flexShrink:0,
                      background:booked?'#fca5a5':sel?'#bfdbfe':'transparent',
                      cursor:booked?'not-allowed':'pointer',
                      display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,
                      outline:sel?'2px solid #3b82f6':'none'}}
                    onMouseDown={()=>{
                      if(booked)return;
                      if(sel){onSelect(null,[]);return;}
                      dragRef.current={dragging:true,carId:car.id,startKey:key,days:[key]};
                      onSelect(car.id,[key]);
                    }}
                    onMouseEnter={()=>{
                      if(!dragRef.current.dragging||dragRef.current.carId!==car.id)return;
                      const allKeys=dates.map(d=>d.key);
                      const si=allKeys.indexOf(dragRef.current.startKey);
                      const ei=allKeys.indexOf(key);
                      if(si<0||ei<0)return;
                      const range=allKeys.slice(Math.min(si,ei),Math.max(si,ei)+1);
                      if(range.some(k=>isBooked(car.id,k)))return;
                      dragRef.current.days=range;
                      onSelect(car.id,range);
                    }}
                    onMouseUp={()=>{dragRef.current.dragging=false;}}
                  >
                    {booked&&<span style={{color:'#ef4444',fontWeight:700}}>×</span>}
                    {sel&&!booked&&<span style={{color:'#1d4ed8',fontWeight:700}}>✓</span>}
                  </div>
                );
              })}
            </div>
          ))}
          {/* 凡例 */}
          <div style={{display:'flex',gap:12,padding:'4px 6px',background:'#f8faff',borderTop:'1px solid #e0e7ff',flexWrap:'wrap'}}>
            <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#64748b'}}><span style={{width:12,height:12,background:'#1d4ed8',borderRadius:2,display:'inline-block'}}/>◎入庫日</span>
            <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#64748b'}}><span style={{width:12,height:12,background:'#bfdbfe',border:'1px solid #3b82f6',borderRadius:2,display:'inline-block'}}/>選択中</span>
            <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#64748b'}}><span style={{width:12,height:12,background:'#fca5a5',borderRadius:2,display:'inline-block'}}/>使用中</span>
          </div>
        </div>
      </div>
    </div>
  );
});

// ── 第2火曜日（両店共通定休）判定ユーティリティ ──
// index_dev.html と同一ロジック。1月・5月・8月の第2火曜は通常営業（除外）。
// overrideOpen に入っている日付は個別に「通常営業」へ戻す。
const _secTueExemptMonths=new Set([0,4,7]); // 1月・5月・8月（0-indexed）
const getSecondTuesday=(year,month)=>{
  if(_secTueExemptMonths.has(month))return null;
  let count=0;
  for(let d=1;d<=31;d++){
    const dt=new Date(year,month,d);
    if(dt.getMonth()!==month)break;
    if(dt.getDay()===2){count++;if(count===2)return d;}
  }
  return null;
};
const isSecondTuesdayHoliday=(year,month,day,overrideOpen)=>{
  const d2=getSecondTuesday(year,month);
  if(d2===null||d2!==day)return false;
  const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  if(overrideOpen&&overrideOpen.includes(ds))return false;
  return true;
};

// ── 車検カレンダーピッカー（入庫日選択用）──
function InspCalendarPicker({value,onChange,inspData,closedDays,closedDates,overrideOpen,inspLimits,open,onClose}){
  const [calMonth,setCalMonth]=useState(()=>{
    if(value){const p=value.split('-');return new Date(Number(p[0]),Number(p[1])-1,1);}
    return new Date();
  });
  if(!open)return null;
  const cy=calMonth.getFullYear(),cm=calMonth.getMonth();
  const dim=new Date(cy,cm+1,0).getDate();
  const first=new Date(cy,cm,1).getDay();
  const weeks=[];let wk=Array(7).fill(null);
  for(let d=1;d<=dim;d++){
    const dow=(first+d-1)%7;wk[dow]=d;
    if(dow===6){weeks.push([...wk]);wk=Array(7).fill(null);}
  }
  if(wk.some(x=>x!==null))weeks.push([...wk]);
  function getDk(d){return `${cy}-${cm+1}-${d}`;}
  function getCounts(d){
    const raw=(inspData&&inspData[getDk(d)])||[];
    // データ上に古い承認待ちフラグが残っていても正しい空き数になるよう、表示用に再計算してから数える
    const rows=recomputeInspApproval(raw,getLmt(d));
    const v=rows.filter(r=>r&&r.name&&!r.pendingApproval&&r.bookingStatus!=='cancelled');
    return{1:v.filter(r=>Number(r.course)===1).length,2:v.filter(r=>Number(r.course)===2).length,3:v.filter(r=>Number(r.course)===3).length,total:v.length};
  }
  function getLmt(d){return(inspLimits&&inspLimits[getDk(d)])||6;}
  function closed(d){
    const dt=new Date(cy,cm,d);
    const cdays=Array.isArray(closedDays)?closedDays:[];
    const cdates=Array.isArray(closedDates)?closedDates:[];
    if(cdays.includes(dt.getDay()))return true;
    const ds=`${cy}-${String(cm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(cdates.includes(ds))return true;
    // 第2火曜日（両店共通定休。overrideOpenで個別に通常営業化）
    if(isSecondTuesdayHoliday(cy,cm,d,Array.isArray(overrideOpen)?overrideOpen:[]))return true;
    return false;
  }
  const DOW=['日','月','火','水','木','金','土'];
  const today=new Date();
  const COLORS={1:{bg:'#fca5a5',tc:'#b91c1c',label:'マ'},2:{bg:'#93c5fd',tc:'#1d4ed8',label:'ク'},3:{bg:'#fde68a',tc:'#b45309',label:'レ'}};
  return (
    <div style={{border:'1.5px solid #e5e7eb',borderRadius:9,overflow:'hidden',fontSize:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 12px',background:'#f8fafc',borderBottom:'1px solid #e5e7eb'}}>
        <button onClick={()=>setCalMonth(new Date(cy,cm-1,1))} style={{padding:'3px 10px',border:'1px solid #d1d5db',borderRadius:6,background:'white',cursor:'pointer',fontSize:13}}>&#8249;</button>
        <span style={{fontWeight:800,color:'#1e1b4b',fontSize:13}}>{cy}年{cm+1}月</span>
        <button onClick={()=>setCalMonth(new Date(cy,cm+1,1))} style={{padding:'3px 10px',border:'1px solid #d1d5db',borderRadius:6,background:'white',cursor:'pointer',fontSize:13}}>&#8250;</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'#eef2ff',borderBottom:'1px solid #e5e7eb'}}>
        {DOW.map((d,i)=>(
          <div key={d} style={{textAlign:'center',padding:'4px 0',fontWeight:700,fontSize:10,color:i===0?'#dc2626':i===6?'#2563eb':'#374151'}}>{d}</div>
        ))}
      </div>
      {weeks.map((wk,wi)=>(
        <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
          {wk.map((d,di)=>{
            if(!d)return <div key={di} style={{minHeight:66,borderTop:'1px solid #f3f4f6',borderLeft:di>0?'1px solid #f3f4f6':'none',background:'#f9fafb'}}/>;
            const cc=getCounts(d);
            const lmt=getLmt(d);
            const isClosed=closed(d);
            const isToday=d===today.getDate()&&cm===today.getMonth()&&cy===today.getFullYear();
            const ds=`${cy}-${String(cm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isSel=value===ds;
            const isFull=cc.total>=lmt;
            const numColor=di===0?'#dc2626':di===6?'#2563eb':'#111';
            let bg='white';
            if(isSel)bg='#dbeafe';
            else if(isClosed)bg='repeating-linear-gradient(45deg,#f9fafb,#f9fafb 3px,#f3f4f6 3px,#f3f4f6 6px)';
            else if(isFull)bg='#fee2e2';
            // 6枠スロットを生成
            const slots=[];
            for(let i=0;i<cc[1];i++)slots.push(1);
            for(let i=0;i<cc[2];i++)slots.push(2);
            for(let i=0;i<cc[3];i++)slots.push(3);
            while(slots.length<6)slots.push(0);
            // 台数制限を掛けた日で上限に達していたら選べない（制限を掛けていない日は従来どおり）
            const limitBlocked=!!(inspLimits&&inspLimits[getDk(d)]!=null&&cc.total>=lmt);
            return (
              <div key={di}
                onClick={()=>{if(isClosed)return;if(limitBlocked){alert(`🚫 ${cm+1}/${d} は台数制限（最大${lmt}台）に達しているため、予約できません。`);return;}onChange(ds);if(onClose)onClose();}}
                style={{minHeight:66,padding:'3px 2px',cursor:(isClosed||limitBlocked)?'not-allowed':'pointer',
                  borderTop:'1px solid #f3f4f6',borderLeft:di>0?'1px solid #f3f4f6':'none',
                  background:bg,outline:isSel?'2px solid #2563eb':isToday?'2px solid #93c5fd':'none',position:'relative'}}>
                <div style={{textAlign:'center',fontWeight:isToday?900:700,fontSize:11,
                  color:isSel?'#1d4ed8':isClosed?'#9ca3af':numColor,lineHeight:1.3}}>{d}</div>
                {!isClosed&&(
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:1,padding:'2px 2px'}}>
                    {slots.map((cid,si)=>(
                      <div key={si} style={{
                        height:14,borderRadius:2,
                        background:cid?COLORS[cid].bg:'#f3f4f6',
                        border:cid?'none':'1px solid #e5e7eb',
                        display:'flex',alignItems:'center',justifyContent:'center'}}>
                        {cid?<span style={{fontSize:7,fontWeight:900,color:COLORS[cid].tc}}>{COLORS[cid].label}</span>:null}
                      </div>
                    ))}
                  </div>
                )}
                {isClosed&&<div style={{textAlign:'center',fontSize:9,color:'#9ca3af',marginTop:2}}>休</div>}
                {!isClosed&&limitBlocked&&<div style={{textAlign:'center',fontSize:8,color:'#dc2626',fontWeight:800,marginTop:1}}>予約不可</div>}
                {isSel&&<div style={{position:'absolute',top:1,right:1,width:5,height:5,borderRadius:'50%',background:'#2563eb'}}/>}
              </div>
            );
          })}
        </div>
      ))}
      <div style={{display:'flex',gap:8,padding:'5px 10px',background:'#f8fafc',borderTop:'1px solid #e5e7eb',flexWrap:'wrap',alignItems:'center'}}>
        {[1,2,3].map(cid=>(
          <span key={cid} style={{display:'inline-flex',alignItems:'center',gap:3,fontSize:9,fontWeight:700}}>
            <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:14,height:10,borderRadius:2,background:COLORS[cid].bg}}>
              <span style={{fontSize:6,fontWeight:900,color:COLORS[cid].tc}}>{COLORS[cid].label}</span>
            </span>
            {cid===1?'マッハ':cid===2?'クイック':'レギュラー'}
          </span>
        ))}
        <span style={{display:'inline-flex',alignItems:'center',gap:3,fontSize:9,color:'#9ca3af'}}>
          <span style={{width:10,height:8,display:'inline-block',background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:2}}/>6台満
        </span>
        <span style={{fontSize:9,color:'#9ca3af'}}>休=休業</span>
      </div>
    </div>
  );
}


// ★事前入庫日・納車日を選ぶ小さなカレンダー（スケジュール側の予約カードと同じ操作感）。
//   入庫日のカレンダー(InspCalendarPicker)は車検枠の空き状況を見せる専用品なので、
//   枠と関係のないこの2つには使わず、素直な月カレンダーを出す。
//   値は index 側と同じ「YYYY-M-D」（ゼロ詰めなし）で持つ。
const MiniDatePicker=({value,onChange,open,onClose,baseDk,accent})=>{
  const parse=s=>{const p=String(s||'').split('-').map(Number);return (p.length===3&&p.every(n=>!isNaN(n)))?p:null;};
  const src=parse(value)||parse(baseDk);
  const [mo,setMo]=useState(()=>src?{year:src[0],month:src[1]-1}:(()=>{const n=new Date();return{year:n.getFullYear(),month:n.getMonth()};})());
  if(!open)return null;
  const first=new Date(mo.year,mo.month,1).getDay(), days=new Date(mo.year,mo.month+1,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++)cells.push(<div key={'e'+i}/>);
  const norm=s=>{const p=parse(s);return p?`${p[0]}-${p[1]}-${p[2]}`:'';};
  for(let d=1;d<=days;d++){
    const dow=new Date(mo.year,mo.month,d).getDay();
    const dk=`${mo.year}-${mo.month+1}-${d}`;
    const sel=norm(value)===dk, base=norm(baseDk)===dk;
    cells.push(
      <div key={d} title={base?'入庫日（車検日）':''} onClick={()=>{onChange(dk);onClose();}}
        style={{display:'flex',alignItems:'center',justifyContent:'center',width:28,height:28,margin:'0 auto',
          cursor:'pointer',fontSize:12,borderRadius:'50%',boxSizing:'border-box',
          color:sel?'white':dow===0?'#ef4444':dow===6?'#2563eb':'#1f2937',
          fontWeight:(sel||base)?800:600,background:sel?accent:'',
          border:base?`2px solid ${accent}`:'2px solid transparent'}}>{d}</div>);
  }
  return(
    <div style={{position:'absolute',top:'100%',left:0,zIndex:9999,marginTop:4,background:'white',borderRadius:10,
      boxShadow:'0 8px 30px rgba(0,0,0,.25)',padding:12,minWidth:240,border:`2px solid ${accent}`}} onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <button type="button" onClick={()=>setMo(p=>{const d=new Date(p.year,p.month-1,1);return{year:d.getFullYear(),month:d.getMonth()};})}
          style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#374151'}}>‹</button>
        <span style={{fontWeight:700,fontSize:13,color:'#1f2937'}}>{mo.year}年{mo.month+1}月</span>
        <button type="button" onClick={()=>setMo(p=>{const d=new Date(p.year,p.month+1,1);return{year:d.getFullYear(),month:d.getMonth()};})}
          style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#374151'}}>›</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:2}}>
        {['日','月','火','水','木','金','土'].map((d,i)=>(
          <div key={d} style={{textAlign:'center',fontSize:10,fontWeight:700,color:i===0?'#ef4444':i===6?'#2563eb':'#9ca3af',padding:'2px 0'}}>{d}</div>))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:1}}>{cells}</div>
      {baseDk&&<div style={{marginTop:6,display:'flex',alignItems:'center',gap:5,fontSize:10,color:'#6b7280'}}>
        <span style={{width:14,height:14,borderRadius:'50%',border:`2px solid ${accent}`,flexShrink:0}}/>◯＝入庫日（車検日）</div>}
      <button type="button" onClick={onClose}
        style={{marginTop:8,width:'100%',padding:4,background:'#f3f4f6',border:'none',borderRadius:6,cursor:'pointer',fontSize:11,color:'#6b7280'}}>閉じる</button>
    </div>
  );
};

const BookingModal=({customer,inspData,loanerResH,loanerResS,loanerListH,loanerListS,onSave,onClose,currentUser,closedDaysH,closedDaysS,closedDatesH,closedDatesS,overrideOpen,inspLimits})=>{
  const normStore=s=>{if(!s)return'honten';if(s==='三田店'||s==='sanda')return'sanda';return'honten';};
  const defaultStaff=customer.staff||currentUser?.name||'';
  // デフォルト店舗: 顧客の店舗 > ログインユーザーの店舗 > 本店
  // 店舗優先順位: 顧客の既存店舗 > ログインユーザーの店舗 > 本店
  // normStoreは空でも'honten'を返すのでcustomer.storeが空かを先にチェック
  const userStore=currentUser?.store?.id||currentUser?.store||'honten';
  const defaultStore=customer.store?normStore(customer.store):userStore;
  const defaultTokuten=(()=>{
    {const ct=cleanTokuten(customer.tokuten);if(ct!=='-')return ct;}  // 日付などの紛れ物は使わない
    if(customer.expiry){const today=new Date().toISOString().slice(0,10);return calcTokuten(customer.expiry,today);}
    return'-';
  })();
  // ★スケジュール側で設定済みの「事前入庫日・納車日・納車時間」を拾って初期値にする。
  //   拾わないと、リストから予約を開いて保存し直すたびにスケジュール側で入れた
  //   事前入庫・納車日が消える（保存はスケジュール行を組み立て直すため）。
  const _existingInspRow=(()=>{
    try{
      for(const dk of Object.keys(inspData||{})){
        const hit=(inspData[dk]||[]).find(r=>r&&r.custId&&r.custId===customer.custId&&r.bookingStatus!=='cancelled');
        if(hit)return hit;
      }
    }catch(e){}
    return null;
  })();
  const [form,setForm]=useState({
    entryDate:customer.entryDate||'',
        store:defaultStore,
    bookingTime:customer.bookingTime||'',
    course:customer.course||0,
    tokuten:defaultTokuten,
    staff:defaultStaff,
    note:customer.note||'',
    preEntry:_existingInspRow?.entryDate||'',        // 事前入庫日（スケジュール行の entryDate）
    deliveryDate:_existingInspRow?.deliveryDate||'',  // 納車日
    deliveryTime:_existingInspRow?.deliveryTime||'',  // 納車時間
  });
  const [showPreEntryCal,setShowPreEntryCal]=useState(false);
  const [showDelivCal,setShowDelivCal]=useState(false);
  const [showDelivTime,setShowDelivTime]=useState(false);
  const [showCal,setShowCal]=useState(true);
  const [selCarId,setSelCarId]=useState(null);
  const [selDays,setSelDays]=useState([]);
  // ★代車の『限定』（この車でないとダメ＝最適化で動かさない）。
  //   スケジュール側の予約カードには前からある機能だが、リストからの予約では付けられず、
  //   あとでスケジュールを開き直す必要があった（2026-09-03 ユーザー要望）。
  const [selLocked,setSelLocked]=useState(false);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState('');
  // キーボード操作用state/ref（Hooksはreturnより前に全定義）
  const [focusField,setFocusField]=useState('time');
  const [showTimePicker,setShowTimePicker]=useState(false);
  const timeRef=useRef(null);
  const noteRef=useRef(null);
  // モーダルを開いたとき入庫時間にフォーカス
  useEffect(()=>{
    // モーダルを開いたとき最上部にスクロール（日付入力が最初のため）
    const el=document.getElementById('booking-modal-scroll');
    if(el) el.scrollTop=0;
  },[customer.custId]);

  const dynListH=(loanerListH&&loanerListH.length>0)?loanerListH:LOANERS_H;
  const dynListS=(loanerListS&&loanerListS.length>0)?loanerListS:LOANERS_S;
  const loanerRes=form.store==='honten'?loanerResH:loanerResS;
  const closedDays=form.store==='honten'?closedDaysH:closedDaysS;
  const closedDates=form.store==='honten'?closedDatesH:closedDatesS;
  const storeObj=STORES.find(s=>s.id===form.store)||STORES[0];
  const upd=k=>e=>setForm(p=>({...p,[k]:typeof e==='object'&&e.target?e.target.value:e}));

  const handleSave=async(isTemp)=>{
    setErr('');
    if(isTemp){
      // 仮予約：特典は必須でない（-=なしも有効）
    }else{
      const missing=[];
      if(!form.entryDate)missing.push('入庫日');
      if(!form.course)missing.push('車検コース');
      if(!form.bookingTime)missing.push('入庫時間');
      if(!form.tokuten)missing.push('特典');
      // 特典「-」は「特典なし」として有効（エラーにしない）
      if(missing.length){setErr(`本予約には ${missing.join('・')} が必要です`);return;}
    }
    setSaving(true);
    // モーダルは即座に閉じ、GAS保存はバックグラウンドで継続させる。
    // GAS書き込みは直列ロック(最大25秒)＋チャンク保存で長時間かかることがあり、
    // await完了まで待つと「保存中...」のままフリーズして見えるため。
    // 予約はローカルstateへ即時反映されるので、閉じても予約内容は失われない。
    onClose();
    Promise.resolve(onSave({...form,isTemp,selCarId,selDays,selLocked},customer))
      .catch(e=>console.error('onSave error:',e))
      .finally(()=>setSaving(false));
  };

  const courseObj=COURSES.find(c=>c.id===Number(form.course));

  // ── キーボード操作ロジック（return前に定義）──────────────────
  // フィールド順序：時間 → コース → 特典 → 備考
  const FIELD_ORDER=['time','course','tokuten','note'];
  const FOCUS_STYLE={outline:'3px solid #1d4ed8',outlineOffset:'2px',boxShadow:'0 0 0 4px rgba(29,78,216,0.15)'};
  const FR=(key)=>focusField===key?FOCUS_STYLE:{};

  // 時間リスト
  const TIME_LIST=Array.from({length:19},(_,i)=>{
    const h=Math.floor(i/2)+9,m=i%2===0?'00':'30';
    return`${String(h).padStart(2,'0')}:${m}`;
  });

  // 次のフィールドへ移動
  // フォーカス移動ヘルパー
  const gotoField=(key)=>{
    setFocusField(key);
    if(key==='time'){setTimeout(()=>timeRef.current?.focus(),20);}
    else if(key==='note'){setTimeout(()=>noteRef.current?.focus(),20);}
    else{// course/tokuten: data属性でdivを探してfocus
      setTimeout(()=>{
        const el=document.querySelector('[data-bmfield="'+key+'"]');
        if(el)el.focus();
      },20);
    }
  };
  const moveNext=(from)=>{
    const cur=FIELD_ORDER.indexOf(from);
    const next=FIELD_ORDER[cur+1];
    if(!next)return;
    gotoField(next);
  };
  const movePrev=(from)=>{
    const cur=FIELD_ORDER.indexOf(from);
    const prev=FIELD_ORDER[cur-1];
    if(!prev)return;
    gotoField(prev);
  };

  // 入庫時間キー操作
  const onTimeKey=(e)=>{
    if(!showTimePicker){
      if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();setShowTimePicker(true);}
      return;
    }
    const cur=TIME_LIST.indexOf(form.bookingTime);
    if(e.key==='ArrowDown'){e.preventDefault();upd('bookingTime')(TIME_LIST[Math.min(cur+1,TIME_LIST.length-1)]);}
    else if(e.key==='ArrowUp'){e.preventDefault();upd('bookingTime')(TIME_LIST[Math.max(cur-1,0)]);}
    else if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();setShowTimePicker(false);if(e.key==='Enter')setTimeout(()=>moveNext('time'),50);}
  };

  // コースキー操作（←→）
  const onCourseKey=(e)=>{
    const ids=COURSES.map(c=>c.id);
    const cur=ids.indexOf(Number(form.course));
    if(e.key==='ArrowLeft'&&cur>0){e.preventDefault();upd('course')(ids[cur-1]);}
    else if(e.key==='ArrowRight'&&cur<ids.length-1){e.preventDefault();upd('course')(ids[cur+1]);}
    else if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();moveNext('course');}
    else if(e.key==='ArrowUp'){e.preventDefault();movePrev('course');}
  };

  // 特典キー操作（←→）
  const TOK_LIST=['-','①','②'];
  const onTokKey=(e)=>{
    const cur=TOK_LIST.indexOf(form.tokuten);
    if(e.key==='ArrowLeft'&&cur>0){e.preventDefault();upd('tokuten')(TOK_LIST[cur-1]);}
    else if(e.key==='ArrowRight'&&cur<TOK_LIST.length-1){e.preventDefault();upd('tokuten')(TOK_LIST[cur+1]);}
    else if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();moveNext('tokuten');}
    else if(e.key==='ArrowUp'){e.preventDefault();movePrev('tokuten');}
  };
  // ─────────────────────────────────────────────────────────────

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'white',borderRadius:14,width:'100%',maxWidth:860,maxHeight:'92vh',display:'flex',flexDirection:'column',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{padding:'14px 18px',borderRadius:'14px 14px 0 0',background:storeObj.id==='sanda'?'linear-gradient(135deg,#991b1b,#dc2626)':`linear-gradient(135deg,#1e1b4b,${storeObj.color})`,display:'flex',alignItems:'center',gap:10}}>
          <div style={{flex:1}}>
            <div style={{color:'white',fontWeight:900,fontSize:17}}>{customer.name}</div>
            <div style={{color:'rgba(255,255,255,.7)',fontSize:11,marginTop:2,display:'flex',gap:12,flexWrap:'wrap'}}>
              <span>🚗 {customer.carType}</span><span>No.{customer.no}</span><span>満期: {fmtDate(customer.expiry)}</span>
            </div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,padding:'6px 12px',color:'white',fontSize:13,fontWeight:700}}>✕</button>
        </div>
        <div id='booking-modal-scroll' style={{overflowY:'auto',flex:1,padding:18}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
            <div>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5,flexWrap:'wrap'}}>
                <span style={{fontSize:11,fontWeight:700,color:'#374151'}}>📅 入庫日 <span style={{color:'#dc2626',fontSize:10}}>（本予約必須）</span></span>
                {form.entryDate&&<span style={{fontWeight:800,color:'#1d4ed8',fontSize:12}}>{form.entryDate}</span>}
                <button type="button" onClick={()=>setShowCal(p=>!p)}
                  style={{padding:'2px 10px',fontSize:10,borderRadius:6,border:'1.5px solid #3b82f6',
                    background:showCal?'#2563eb':'white',color:showCal?'white':'#2563eb',
                    fontWeight:700,cursor:'pointer',flexShrink:0}}>
                  {showCal?'▲ 閉じる':'📅 カレンダーを開く'}
                </button>
              </div>
              <InspCalendarPicker
                value={form.entryDate}
                onChange={v=>setForm(p=>({...p,entryDate:v}))}
                inspData={inspData}
                closedDays={closedDays}
                closedDates={closedDates}
                overrideOpen={overrideOpen}
                inspLimits={inspLimits}
                open={showCal}
                onClose={()=>setShowCal(false)}
              />
            </div>
            <div>
              <label style={{display:'block',fontSize:11,fontWeight:700,color:'#374151',marginBottom:5}}>店舗</label>
              <div style={{display:'flex',gap:8}}>
                {STORES.map(s=>(
                  <button key={s.id} onClick={()=>setForm(p=>({...p,store:s.id}))}
                    style={{flex:1,padding:'8px',border:`2px solid ${form.store===s.id?s.color:'#e5e7eb'}`,borderRadius:8,background:form.store===s.id?s.color:'white',color:form.store===s.id?'white':'#374151',fontWeight:700,fontSize:12,cursor:'pointer'}}>
                    {s.name}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label style={{display:'block',fontSize:11,fontWeight:700,color:'#374151',marginBottom:5}}>入庫時間 <span style={{color:'#dc2626',fontSize:10}}>（本予約必須）</span></label>
              <div data-bmfield="time" ref={timeRef} tabIndex={0}
                onFocus={()=>setFocusField('time')} onBlur={()=>{setFocusField('');setTimeout(()=>setShowTimePicker(false),150);}}
                onKeyDown={onTimeKey}
                onClick={()=>setShowTimePicker(p=>!p)}
                style={{width:'100%',padding:'8px 10px',border:'1.5px solid #e5e7eb',borderRadius:8,fontSize:13,boxSizing:'border-box',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',...FR('time')}}>
                <span style={{color:form.bookingTime?'#0284c7':'#9ca3af',fontWeight:form.bookingTime?700:400}}>
                  {form.bookingTime||'時間を選択（Enterで開く）'}
                </span>
                <span style={{fontSize:10,color:'#6b7280'}}>{showTimePicker?'▲':'▼'}</span>
              </div>
              {showTimePicker&&(
                <div style={{border:'2px solid #0284c7',borderRadius:8,marginTop:4,maxHeight:180,overflowY:'auto',background:'white',boxShadow:'0 4px 12px rgba(0,0,0,0.15)'}}>
                  {TIME_LIST.map(v=>(
                    <div key={v}
                      onMouseDown={e=>{e.preventDefault();upd('bookingTime')(v);setShowTimePicker(false);moveNext('time');}}
                      style={{padding:'7px 14px',cursor:'pointer',fontSize:13,fontWeight:form.bookingTime===v?800:400,
                        background:form.bookingTime===v?'#e0f2fe':'white',color:form.bookingTime===v?'#0284c7':'#374151',
                        borderLeft:form.bookingTime===v?'4px solid #0284c7':'4px solid transparent'}}>
                      {v}
                    </div>
                  ))}
                </div>
              )}
            </div>
            {/* ★事前入庫日（前日・前々日に車だけ預かる場合）。スケジュール行の entryDate に入る */}
            <div style={{position:'relative'}}>
              <label style={{display:'block',fontSize:11,fontWeight:700,color:'#374151',marginBottom:5}}>
                事前入庫日 <span style={{fontWeight:400,color:'#9ca3af',fontSize:10}}>前日・前々日などに預かる場合</span>
              </label>
