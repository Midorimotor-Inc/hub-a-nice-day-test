<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub 管理者コンソール [テスト版]</title>
<!-- 招待 QR（2026-09-22）。読めなくても URL の文字で代わりになる -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
/* 明るい配色に固定（ユーザー指定：ダーク色は使わない）。
   どの環境で開いても同じ見え方になるよう、色はすべて明示する。 */
:root{
  color-scheme: light;
  --ground:#f6f5f1;          /* 温かみのある紙色。事務所の書類の地 */
  --panel:#ffffff;
  --panel-2:#faf9f6;
  --rule:#e4e2da;
  --rule-2:#cfccc2;
  --ink:#1b2129;
  --ink-2:#586170;
  --ink-3:#8a9099;
  --pine:#1d3d38;            /* 緑モータースの「緑」。管理者側の地色 */
  --pine-2:#2c5850;
  --pine-soft:#e8efec;
  --ok:#15803d;   --ok-bg:#e7f4ea;   --ok-line:#a7d5b5;
  --wait:#b45309; --wait-bg:#fdf2e3; --wait-line:#e9c98f;
  --idle:#767c86; --idle-bg:#f0efec; --idle-line:#d8d6ce;
  --stop:#b02020; --stop-bg:#fbeaea; --stop-line:#e6b0b0;
  --focus:#2c5850;
  --shadow:0 1px 2px rgba(27,33,41,.05), 0 10px 28px rgba(27,33,41,.07);
}
/* 本番（?env=prod）は青。DEVの緑と取り違えないように、ヘッダー・帯・地色をまとめて変える */
html[data-env="prod"]{
  --ground:#eaf0fa;
  --panel-2:#f3f6fc;
  --rule:#d5dceb;
  --pine:#1e3a8a;
  --pine-2:#1d4ed8;
  --pine-soft:#e3eafb;
  --focus:#1d4ed8;
}
html[data-env="prod"] .note-bar{background:#1e3a8a;color:#fff}
html[data-env="prod"] .note-bar .tag{background:#fff;color:#1e3a8a}
.top .envswitch{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45)}
.top .envswitch:hover{background:rgba(255,255,255,.28)}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);
  font-family:"Noto Sans JP",-apple-system,"Yu Gothic UI","Hiragino Sans",sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,.zen{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ── モックの説明帯 ───────────────────────────── */
.note-bar{background:var(--pine);color:#e9f0ed;padding:9px 20px;font-size:12.5px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.note-bar b{color:#fff}
.note-bar .tag{background:rgba(255,255,255,.16);border-radius:20px;padding:1px 10px;font-size:11px;font-weight:700;letter-spacing:.04em}

/* ── ログイン ─────────────────────────────── */
.gate{min-height:calc(100vh - 42px);display:flex;align-items:flex-start;justify-content:center;padding:56px 20px 80px}
.gate-card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);
  width:min(430px,100%);padding:34px 32px}
.crest{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:24px}
.crest .mark{width:46px;height:46px;border-radius:12px;background:var(--pine);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:21px}
.crest h1{margin:6px 0 0;font-size:19px;font-weight:900;letter-spacing:.01em;text-wrap:balance}
.crest p{margin:0;font-size:12px;color:var(--ink-3);letter-spacing:.06em}
label.f{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;margin:0 0 6px}
input[type=email],input[type=text]{width:100%;padding:11px 13px;border:1.5px solid var(--rule-2);border-radius:9px;
  font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input.code{font-family:"Roboto Mono",monospace;font-size:27px;font-weight:700;letter-spacing:.36em;text-align:center;padding:12px 0 12px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:9px;
  border:1.5px solid var(--pine);background:var(--pine);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer;
  font-family:"Zen Kaku Gothic New",sans-serif}
.btn:hover{background:var(--pine-2);border-color:var(--pine-2)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.w{width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--pine);border-color:var(--rule-2)}
.btn.ghost:hover{background:var(--pine-soft)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:7px}
.btn.stop{background:transparent;color:var(--stop);border-color:var(--stop-line)}
.btn.stop:hover{background:var(--stop-bg)}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.8;margin:0 0 16px}
.err{color:var(--stop);font-weight:700;font-size:12.5px;margin-top:9px}
.mailcard{margin-top:20px;border:1px dashed var(--wait-line);background:var(--wait-bg);border-radius:11px;padding:13px 15px}
.mailcard .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--wait);margin-bottom:5px}
.mailcard .subject{font-weight:700;font-size:13px;font-family:"Zen Kaku Gothic New",sans-serif}
.mailcard .big{font-family:"Roboto Mono",monospace;font-size:28px;font-weight:700;letter-spacing:.2em;margin-top:6px}

/* ── コンソール ───────────────────────────── */
.top{background:var(--pine);color:#fff;padding:13px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top .brand{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:16px;letter-spacing:.01em}
.top .env{font-size:10.5px;font-weight:700;letter-spacing:.1em;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:20px}
.top .me{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;color:#cfdcd8}
.top .me b{color:#fff}
.avatar{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--pine);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:12px;font-family:"Roboto Mono",monospace}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 90px}

/* 進み具合 */
.progress{background:var(--panel);border:1px solid var(--rule);border-radius:13px;box-shadow:var(--shadow);
  padding:20px 22px;margin-bottom:22px}
.progress h2{margin:0 0 3px;font-size:15px;font-weight:700}
.progress .sub{margin:0 0 15px;font-size:12.5px;color:var(--ink-2)}
.bar{display:flex;height:11px;border-radius:20px;overflow:hidden;background:var(--idle-bg);margin-bottom:13px}
.bar span{display:block;height:100%}
.bar .s-ok{background:var(--ok)} .bar .s-wait{background:var(--wait)} .bar .s-idle{background:var(--idle-line)}
.legend{display:flex;gap:22px;flex-wrap:wrap}
.legend div{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--ink-2)}
.legend .n{font-family:"Roboto Mono",monospace;font-size:21px;font-weight:700;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;transform:translateY(-2px)}
.dot.ok{background:var(--ok)} .dot.wait{background:var(--wait)} .dot.idle{background:var(--idle-line)}

/* タブ */
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--rule);margin-bottom:18px;flex-wrap:wrap}
.tab{appearance:none;background:none;border:none;padding:11px 17px;font:inherit;font-size:14px;font-weight:700;
  font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab[aria-selected="true"]{color:var(--pine);border-bottom-color:var(--pine)}
.tab:hover{color:var(--ink)}
.tab .cnt{font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-left:6px}

.panelbox{background:var(--panel);border:1px solid var(--rule);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.panelhead{padding:15px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.panelhead h3{margin:0;font-size:14.5px;font-weight:700}
.panelhead p{margin:2px 0 0;font-size:12px;color:var(--ink-2);line-height:1.7}
.panelhead .right{margin-left:auto;display:flex;gap:8px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{background:var(--panel-2);font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.07em;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
td.num{font-family:"Roboto Mono",monospace;color:var(--ink-3);width:44px}
td.nm{font-weight:700;white-space:nowrap}
td.nm small{display:block;font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:.02em}
td.act{text-align:right;white-space:nowrap}
.mailin{width:100%;min-width:190px;padding:7px 10px;border:1.5px solid transparent;border-radius:7px;
  font-family:"Roboto Mono",monospace;font-size:12.5px;background:transparent;color:var(--ink)}
.mailin:hover{border-color:var(--rule-2);background:#fff}
.mailin:focus{border-color:var(--pine);background:#fff;outline:none}
.mailin::placeholder{color:var(--ink-3);font-style:normal}

.state{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
  white-space:nowrap;border:1px solid transparent}
.state.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.state.wait{background:var(--wait-bg);color:var(--wait);border-color:var(--wait-line)}
.state.idle{background:var(--idle-bg);color:var(--idle);border-color:var(--idle-line)}
.state.none{background:transparent;color:var(--ink-3);border-color:var(--rule-2);border-style:dashed}
.state .devs{font-family:"Roboto Mono",monospace;font-weight:500;opacity:.85}

.stripe{width:3px;padding:0;border-bottom:1px solid var(--rule)}
.stripe.ok{background:var(--ok)} .stripe.wait{background:var(--wait)} .stripe.idle{background:var(--idle-line)}
.stripe.none{background:transparent;border-right:2px dashed var(--rule-2)}

.empty{padding:38px 22px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.9}
.foot{padding:14px 20px;border-top:1px solid var(--rule);background:var(--panel-2);font-size:12px;color:var(--ink-2);line-height:1.8}

/* トースト */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--pine);color:#fff;
  padding:12px 20px;border-radius:11px;box-shadow:0 12px 34px rgba(27,33,41,.28);font-size:13.5px;font-weight:700;
  font-family:"Zen Kaku Gothic New",sans-serif;z-index:50;max-width:min(560px,92vw)}
.toast small{display:block;font-weight:400;font-size:11.5px;color:#c9d8d4;margin-top:2px;font-family:"Noto Sans JP",sans-serif}

/* 確認ダイアログ */
/* 中身が画面より高くなることがある（使う端末を選ぶと伸びる）。
   中央寄せのままだと上下が切れてボタンに届かないので、はみ出したらスクロールさせる。
   margin:auto なら、収まるときは中央・はみ出すときは切れずに上から並ぶ。 */
.scrim{position:fixed;inset:0;background:rgba(27,33,41,.45);display:flex;justify-content:center;
  padding:20px;z-index:60;overflow-y:auto;overscroll-behavior:contain}
.dialog{background:var(--panel);border-radius:14px;box-shadow:0 26px 70px rgba(27,33,41,.4);
  width:min(430px,100%);padding:26px 26px 0;margin:auto;flex-shrink:0}
/* 決定ボタンは常に見えるように、画面の下端に貼り付けておく。
   bottom を負にすると画面の外へ固定されてしまうので 0 にすること。 */
.dialog .row{position:sticky;bottom:0;background:var(--panel);padding:14px 0 22px;
  border-radius:0 0 14px 14px}
.dialog h4{margin:0 0 8px;font-size:16px;font-weight:700;font-family:"Zen Kaku Gothic New",sans-serif}
.dialog p{margin:0 0 6px;font-size:13px;color:var(--ink-2);line-height:1.85}
.dialog .addr{font-family:"Roboto Mono",monospace;font-size:14px;font-weight:700;color:var(--ink);
  background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:10px 0 12px;word-break:break-all}
.dialog select,.dialog input[type=email]{width:100%;padding:11px 12px;border:1.5px solid var(--rule-2);
  border-radius:9px;font:inherit;font-size:15px;background:#fff;color:var(--ink);box-sizing:border-box}
.dialog .row{display:flex;gap:9px;margin-top:16px}
.dialog .row .btn{flex:1}

@media (max-width:640px){
  .wrap{padding:18px 12px 70px}
  .top{padding:11px 14px}
  .progress{padding:16px}
  .legend{gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="note-bar" id="notebar">
  <span class="tag">テスト版</span>
  <span>スケジュールシステム・テスト版の管理者コンソールです。<b>メイン（本番）のデータには触れません</b>。</span>
</div>
<div id="toastbox"></div><div id="app"><div class="gate"><div class="gate-card"><p class="hint">読み込んでいます…</p></div></div></div>
<!-- 保存先・本人認証は Firebase（2026-09-18）。読み込めなければ「繋がらない」と出す -->
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="firebase_config.js"></script>
<script>

(function(){
"use strict";
// =====================================================================
//  Hub 管理者コンソール（DEV）
//  ・スタッフのログイン用メール登録と招待メールの送信
//  ・本人確認を済ませた端末の一覧と取り消し
//  ・管理者名簿の追加と削除
//  この画面を開けるのは、許可簿（Firestore の meta/allowed）で role=admin の人だけ。
//  ログインは Firebase Authentication のメールリンク（2026-09-18〜）。判定は Firestore のルールが行う。画面の申告は信用しない。
// =====================================================================
var APP_VERSION = '3.04';
var GAS_URL     = 'https://script.google.com/macros/s/AKfycbyNE1eVKjibSPLEA0HrVZI8NxEFKWQfMYQ6cKoM1Gznauy9AhfZqHzgs1zzMaxXnQ1_/exec';
// 環境の切り替え（2026-09-15）。この1ファイルで本番とDEVの両方を扱う。
//   既定はDEV（安全側）。URLに ?env=prod が付いている時だけ本番のデータを扱う。
//   記憶はしない＝開き直せば必ずDEVに戻る。本番は毎回ボタンで入る。
//   本番の時は見た目を青にして、どちらを触っているか一目で分かるようにする。
var ENV_PROD    = (function(){ try { return new URLSearchParams(location.search).get('env') === 'prod'; } catch (e) { return false; } })();
var STOR        = ENV_PROD ? 'hub-v8-' : 'hub-v8-dev-';
var IS_DEV      = !ENV_PROD;
var APP_URL_OF  = { 'hub-v8-': 'https://midorimotor-inc.github.io/hub-a-nice-day-main/',
                    'hub-v8-dev-': 'https://midorimotor-inc.github.io/hub-a-nice-day-test/' };
document.documentElement.setAttribute('data-env', ENV_PROD ? 'prod' : 'dev');
// 切り替えボタン。本番へ入る時は一言たしかめる（押し間違いで本番のスタッフに招待が飛ぶのを防ぐ）
function switchEnv(toProd){
  if (toProd && !window.confirm('スケジュールシステム・メイン（本番）のデータを扱います。\n\nここで送る招待メールは実際のスタッフに届き、\n取り消しは本番の端末に効きます。よろしいですか？\n\n（ログインし直しは要りません。画面が青になります）')) return;
  var u = location.pathname + (toProd ? '?env=prod' : '');
  location.href = u;
}

// ── Firebase（保存先・本人認証）──────────────────────────
//   本番と DEV は同じ Firebase プロジェクト。データはキー名の頭（hub-v8- / hub-v8-dev-）で分かれる。
//   ログインは Firebase のサインイン（端末内に保持）なので、環境を切り替えてもログインは1回でよい。
var HUB_BASE_KEY = 'hub2026co-f466kt5vs3vnDQDPuwWeS6XM';   // GAS に残す機能（時点保存）用
var GAS_API_KEY  = HUB_BASE_KEY;
var fbDb = null, fbAuth = null, fbUser = null, fbAuthReady = false, fbReadyWaiters = [];
try {
  if (typeof firebase !== 'undefined' && typeof HUB_FIREBASE_CONFIG !== 'undefined') {
    if (!firebase.apps.length) firebase.initializeApp(HUB_FIREBASE_CONFIG);
    fbDb = firebase.firestore(); fbAuth = firebase.auth();
    try { fbAuth.languageCode = 'ja'; } catch (e) {}
    fbAuth.onAuthStateChanged(function(u){ fbUser = u || null; fbAuthReady = true; fbReadyWaiters.splice(0).forEach(function(cb){ try { cb(fbUser); } catch (e) {} }); });
  }
} catch (e) { console.error('[FB] 初期化に失敗', e); }
function fbWhenReady(){ return new Promise(function(res){ if (fbAuthReady || !fbAuth) res(fbUser); else fbReadyWaiters.push(res); }); }
function fbEmailKey(e){ return String(e || '').trim().toLowerCase().replace(/\./g, ','); }
function fbAllowedRef(){ return fbDb.collection('meta').doc('allowed'); }
function fbDocId(k){ k = String(k); if (k.indexOf(STOR) !== 0) k = STOR + k; return k.replace(/\//g, '%2F'); }
function fbKvRef(k){ return fbDb.collection('kv').doc(fbDocId(k)); }
// スケジュール画面の登録一覧（この端末）。コンソールでは読むだけ（登録はスケジュール画面で行う）
var HUB_MINE_KEY = STOR + 'auth-mine';
function hubLoadMine(){
  try { var v = JSON.parse(localStorage.getItem(HUB_MINE_KEY));
    return (v instanceof Array) ? v.filter(function(x){ return x && x.name && !x.token; }) : []; }
  catch(e){ return []; }
}
function hubLive(l){ return l || []; }
var ENV_PREFIXES = ['hub-v8-', 'hub-v8-dev-'];
// アプリ（スケジュール画面）の入口。招待メールのリンクはここへ戻る
var APP_ENTRY_OF = { 'hub-v8-': 'index_main.html', 'hub-v8-dev-': 'index_dev.html' };
function appEntryUrl(){ return APP_URL_OF[STOR] + APP_ENTRY_OF[STOR]; }

// ── Firestore とのやりとり（関数名は以前の GAS 版のまま。呼び出し側を変えずに済ませる）──
var GAS_FAIL = {gasFail:true};
function fbErrCode(e){ return String((e && e.code) || ''); }
function gasRead(key){
  if (!fbDb) return Promise.resolve(GAS_FAIL);
  return fbWhenReady().then(function(){ return fbKvRef(key).get(); }).then(function(snap){
    if (!snap.exists) return null;
    var d = snap.data() || {};
    if (typeof d.v !== 'string' || !d.v || d.v === 'null') return null;
    try { return JSON.parse(d.v); } catch(e){ return null; }
  }).catch(function(e){ if (fbErrCode(e).indexOf('permission-denied') >= 0) lostAdmin(); return GAS_FAIL; });
}
function gasWrite(key, value){
  if (!fbDb) return Promise.resolve(false);
  return fbKvRef(key).set({ v: JSON.stringify(value), u: firebase.firestore.FieldValue.serverTimestamp() })
    .then(function(){ return true; })
    .catch(function(e){ if (fbErrCode(e).indexOf('permission-denied') >= 0) lostAdmin(); return false; });
}
// 許可簿
function allowedRead(){
  return fbWhenReady().then(function(){ return fbAllowedRef().get(); })
    .then(function(snap){ return snap.exists ? (snap.data() || {}) : {}; });
}
function allowedUpsert(mail, patch){
  var k = fbEmailKey(mail);
  return allowedRead().then(function(all){
    var prev = all[k] || {};
    var next = Object.assign({ email: String(mail).trim().toLowerCase(), role: 'staff', active: true, kind: 'staff' }, prev, patch, { at: Date.now() });
    var o = {}; o[k] = next;
    return fbAllowedRef().set(o, { merge: true }).then(function(){ return next; });
  });
}
function adminsFromAllowed(all){
  return Object.keys(all).filter(function(k){ var a = all[k]; return a && a.role === 'admin' && a.active !== false; })
    .map(function(k){ var a = all[k]; return { mail: a.email || k.replace(/,/g, '.'), uid: a.uid || '', name: a.name || '' }; });
}
// 招待：許可簿に載せて（既にあれば更新）ログイン用のリンクを送る。リンクは各環境のスケジュール画面へ戻る
function sendInvite(mail, info){
  if (!fbAuth) return Promise.resolve({ ok:false, err:'offline' });
  var m = String(mail || '').trim().toLowerCase();
  if (badMail(m)) return Promise.resolve({ ok:false, err:'bad_email' });
  return allowedUpsert(m, info || {}).then(function(){
    return fbAuth.sendSignInLinkToEmail(m, { url: appEntryUrl() + '?inv=1&e=' + encodeURIComponent(m), handleCodeInApp: true })
      .then(function(){ return { ok:true }; });
  }).catch(function(e){
    var c = fbErrCode(e);
    return { ok:false, err: c.indexOf('permission-denied') >= 0 ? 'not_admin' : c.indexOf('quota') >= 0 ? 'quota' : c.indexOf('too-many') >= 0 ? 'too_many'
      : c.indexOf('unauthorized') >= 0 ? 'bad_domain' : c.indexOf('invalid-email') >= 0 ? 'bad_email' : (c || 'error') };
  });
}
// 招待コード（2026-09-18 夕方）：アカウントの合言葉を6桁にして、GAS でメールする。使う端末はアドレス＋6桁で登録できる。
//   既にある人は users（合言葉の控え。管理者も読める）でその人としてサインインし直してから付け替える。控えが無い人はリンクを送る。
function hubRandom(n){ var a = new Uint8Array(n); try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); } return Array.prototype.map.call(a, function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); }
function secondaryApp(){ try { return firebase.app('hub-invite'); } catch (e) { return firebase.initializeApp(HUB_FIREBASE_CONFIG, 'hub-invite'); } }
function gasMailInvite(mail, code, info){
  var q = new URLSearchParams({ action:'mailInvite', email: mail, code: code, prefix: STOR, apiKey: GAS_API_KEY,
    name: String((info && info.name) || ''), kind: String((info && info.kind) || 'staff') });   // GAS のシートに無い人にも送れるように（2026-09-20）
  return fetch(GAS_URL + '?' + q.toString(), { cache:'no-store' }).then(function(r){ return r.text(); })
    .then(function(t){ try { return JSON.parse(t); } catch (e) { return { ok:false, err:'bad_response' }; } }, function(){ return { ok:false, err:'offline' }; });
}
function inviteByCode(mail, info){
  if (!fbAuth) return Promise.resolve({ ok:false, err:'offline' });
  var m = String(mail || '').trim().toLowerCase();
  if (badMail(m)) return Promise.resolve({ ok:false, err:'bad_email' });
  var code = String(Math.floor(100000 + Math.random() * 900000));
  return allowedUpsert(m, info || {}).then(function(){
    var app2 = secondaryApp(), auth2 = app2.auth(), db2 = app2.firestore();
    var fin = function(r){ return auth2.signOut().catch(function(){}).then(function(){ return r; }); };
    return auth2.createUserWithEmailAndPassword(m, code).then(function(cred){ return cred.user; }, function(e){
      if (fbErrCode(e).indexOf('email-already-in-use') < 0) throw e;
      return fbDb.collection('users').where('email', '==', m).get().then(function(q){
        var pw = ''; q.forEach(function(d){ var v = d.data() || {}; if (!pw && v.pw) pw = v.pw; });
        if (!pw) return null;   // 控えが無い（リンクで登録した人）
        return auth2.signInWithEmailAndPassword(m, pw).then(function(cred){ return cred.user.updatePassword(code).then(function(){ return cred.user; }); });
      });
    }).then(function(user2){
      if (!user2) return fin(null).then(function(){ return sendInvite(m, info).then(function(r){ return Object.assign({ mode:'link' }, r); }); });
      return db2.collection('users').doc(user2.uid).set({ email: m, pw: code, inviteAt: Date.now() }, { merge: true })
        .then(function(){ return fin(null); })
        .then(function(){ return gasMailInvite(m, code, info); })
        .then(function(r){ return { ok:true, mode:'code', code: code, mailed: !!(r && r.ok), mailErr: (r && r.err) || '' }; });
    }, function(e){ return fin({ ok:false, err: fbErrCode(e).indexOf('permission-denied') >= 0 ? 'not_admin' : (fbErrCode(e) || 'error') }); });
  }, function(e){ return { ok:false, err: fbErrCode(e).indexOf('permission-denied') >= 0 ? 'not_admin' : (fbErrCode(e) || 'error') }; });
}
function inviteResult(r, who){
  if (r && r.ok && r.mode === 'code') return [ (r.mailed ? '招待メールを送りました' : 'メールは送れませんでした'), who + '　招待コード：' + r.code + (r.mailed ? '（メールにも書いてあります。使う端末でアドレスとこの6桁を入れてもらってください）' : '（' + (r.mailErr || '') + '。この6桁を本人に伝えてください）') ];
  if (r && r.ok) return [ 'ログイン用のリンクを送りました', who + '　この方は合言葉の控えが無いため、メールのリンクを開いてもらう方式です。' ];
  return [ '送れませんでした', inviteErr(r) ];
}

// ── データの読み込み ─────────────────────────────
var slowTimer = null;
function loadAll(){
  S.loading = true; S.loadSlow = false; S.loadError = false; render();
  // 15秒たっても返らなければ「待っています」と知らせる（固まったと思われないように）
  if (slowTimer) clearTimeout(slowTimer);
  slowTimer = setTimeout(function(){ if (S.loading) { S.loadSlow = true; render(); } }, 15000);
  return Promise.all([
    gasRead(STOR + 'honten-staff-v2'),
    gasRead(STOR + 'sanda-staff-v2'),
    devicesRead(),
    allowedRead().then(function(all){ return { ok:true, all:all, admins: adminsFromAllowed(all) }; }, function(){ return { ok:false }; }),
    gasRead(STOR + 'auth-devnames')
  ]).then(function(r){
    if (slowTimer) { clearTimeout(slowTimer); slowTimer = null; }
    // どれか1つでも読めなかったら、空の一覧を出さずに知らせる（黙って0人にしない）
    var failed = r[0] === GAS_FAIL || r[1] === GAS_FAIL || r[2] === GAS_FAIL || r[4] === GAS_FAIL || !(r[3] && r[3].ok);
    S.staffH = (r[0] instanceof Array) ? r[0] : [];
    S.staffS = (r[1] instanceof Array) ? r[1] : [];
    S.devices = (r[2] && typeof r[2] === 'object' && !(r[2] instanceof Array)) ? r[2] : {};
    S.allowed = (r[3] && r[3].ok) ? r[3].all : {};
    S.admins = (r[3] && r[3].ok && r[3].admins) ? r[3].admins : [];
    S.devnames = (r[4] instanceof Array) ? r[4].filter(function(x){ return x && x.name; }) : [];
    S.loading = false; S.loadSlow = false; S.loadError = failed; render();
  }, function(){
    if (slowTimer) { clearTimeout(slowTimer); slowTimer = null; }
    S.loading = false; S.loadSlow = false; S.loadError = true; render();
  });
}

// スタッフを別の店のスタッフ表へ移す（2026-09-19）。先に移り先へ足してから元の店から消す
//   （途中で止まっても「両方に居る」で済み、「どこにも居ない」にはならない）。許可簿と台帳の店舗も合わせる。
function moveStaff(uid, from, to, patch){
  var kf = STOR + (from === 'sanda' ? 'sanda' : 'honten') + '-staff-v2';
  var kt = STOR + (to === 'sanda' ? 'sanda' : 'honten') + '-staff-v2';
  return Promise.all([gasRead(kf), gasRead(kt)]).then(function(r){
    if (!(r[0] instanceof Array) || r[1] === GAS_FAIL) return {ok:false, why:'読めなかった'};
    var src = r[0], dst = (r[1] instanceof Array) ? r[1] : [];
    var rec = src.filter(function(x){ return x && x.uid === uid; })[0];
    if (!rec) return {ok:false, why:'その方が見つからない'};
    var moved = Object.assign({}, rec, patch || {}, { store: to });
    Object.keys(moved).forEach(function(k){ if (moved[k] === undefined) delete moved[k]; });
    // 移り先に同じ番号（myNumber）の人がいたら、空いている番号に付け替える（番号で人を引く箇所があるため）
    var usedNo = {};
    src.concat(dst).forEach(function(x){ if (x && x.uid !== uid) usedNo[Number(x.myNumber)] = 1; });
    if (Number(moved.myNumber) !== 0 && usedNo[Number(moved.myNumber)]) { var n = 1; while (usedNo[n]) n++; moved.myNumber = n; }
    var nextDst = dst.some(function(x){ return x && x.uid === uid; })
      ? dst.map(function(x){ return (x && x.uid === uid) ? moved : x; })
      : dst.concat([moved]);
    var nextSrc = src.filter(function(x){ return !(x && x.uid === uid); });
    return gasWrite(kt, nextDst).then(function(ok1){
      if (!ok1) return {ok:false, why:'移り先の店に書き込めなかった'};
      if (to === 'sanda') S.staffS = nextDst; else S.staffH = nextDst;
      return gasWrite(kf, nextSrc).then(function(ok2){
        if (!ok2) return {ok:false, why:'移り先には足しましたが、元の店から消せませんでした。「再読込」で確かめてください'};
        if (from === 'sanda') S.staffS = nextSrc; else S.staffH = nextSrc;
        // 許可簿（meta/allowed）と端末台帳の店舗も合わせる（どちらも表示用。失敗しても移動そのものは済んでいる）
        var mail = String(moved.loginEmail || '').toLowerCase();
        var jobs = [];
        if (mail && S.allowed[fbEmailKey(mail)]) jobs.push(allowedUpsert(mail, {store: to, name: moved.name, uid: uid}).then(function(a){ S.allowed[fbEmailKey(mail)] = a; }));
        Object.keys(S.devices || {}).forEach(function(id){
          var d = S.devices[id];
          if (d && d.env === STOR && String(d.e || '').toLowerCase() === mail && mail) {
            jobs.push(fbDb.collection('devices').doc(id).update({ s: to }).then(function(){ d.s = to; }));
          }
        });
        return Promise.all(jobs.map(function(p){ return p.then(function(){ return true; }, function(){ return false; }); }))
          .then(function(rs){ return rs.every(Boolean) ? {ok:true} : {ok:true, warn:'許可簿か端末台帳の店舗表示は更新できませんでした（ログインには影響しません）。「再読込」で確かめてください。'}; });
      });
    });
  });
}
// スタッフ表から1人を消す（登録解除のとき。過去の予約に書かれた氏名はそのまま残る）
function removeStaff(uid, store){
  var key = STOR + (store === 'sanda' ? 'sanda' : 'honten') + '-staff-v2';
  return gasRead(key).then(function(latest){
    if (!(latest instanceof Array)) return {ok:false, why:'読めなかった'};
    var next = latest.filter(function(x){ return !(x && x.uid === uid); });
    if (next.length === latest.length) return {ok:true, why:''};   // 既に無い
    return gasWrite(key, next).then(function(okw){
      if (okw) { if (store === 'sanda') S.staffS = next; else S.staffH = next; }
      return {ok:okw, why: okw ? '' : '書き込めなかった'};
    });
  });
}
function findStaff(uid){
  var l = allStaff().filter(function(s){ return s.uid === uid; });
  return l[0] || null;
}
// スタッフ表は店舗ごとに分かれている。書き込む側を間違えないよう、必ず読み直してから1件だけ直す。
function saveStaffField(uid, store, patch){
  var key = STOR + (store === 'sanda' ? 'sanda' : 'honten') + '-staff-v2';
  return gasRead(key).then(function(latest){
    if (!(latest instanceof Array)) return {ok:false, why:'読めなかった'};
    var hit = false;
    var next = latest.map(function(s){
      if (s && s.uid === uid) { hit = true; return Object.assign({}, s, patch); }
      return s;
    });
    if (!hit) return {ok:false, why:'その方が見つからない'};
    return gasWrite(key, next).then(function(okw){
      if (okw) { if (store === 'sanda') S.staffS = next; else S.staffH = next; }
      return {ok:okw, why: okw ? '' : '書き込めなかった'};
    });
  });
}

// ── 操作 ────────────────────────────────────────
function bind(){
  var $ = function(id){ return document.getElementById(id); };
  var each = function(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); };

  // --- ログイン ---
  if ($('send')) $('send').onclick = function(){
    var v = ($('m') ? ($('m').value || '') : S.mail).trim();
    if (badMail(v)) { S.err = 'メールアドレスの形式が正しくありません。（カンマや空白が入っていませんか）'; render(); return; }
    if (!fbAuth) { S.err = 'Firebase に繋がっていません。通信の状態をご確認ください。'; render(); return; }
    S.mail = v; S.err = ''; S.busy = true; render();
    // 戻り先はこのコンソール（同じ環境）。アドレスを載せるので、開いた側で打ち直さなくてよい
    var back = location.origin + location.pathname + '?' + (ENV_PROD ? 'env=prod&' : '') + 'inv=1&e=' + encodeURIComponent(v);
    fbAuth.sendSignInLinkToEmail(v, { url: back, handleCodeInApp: true }).then(function(){
      try { localStorage.setItem('hub-admin-link-email', v); } catch (e) {}
      S.busy = false; S.step = 'sent'; render();
    }, function(e){
      S.busy = false;
      var c = fbErrCode(e);
      S.err = c.indexOf('quota') >= 0 ? '本日のメールリンクの送信上限（Firebase の無料枠）に達しました。管理者に招待コードを発行してもらい、アドレスとコードで登録してください。（コンソールに入れる管理者に発行してもらうか、node fb_seed_allowed.js --code で発行）'
        : c.indexOf('too-many') >= 0 ? '送信が続いています。しばらく待ってからお試しください。'
        : c.indexOf('unauthorized') >= 0 ? 'この画面のアドレスが Firebase の承認済みドメインにありません（' + location.hostname + '）。'
        : c.indexOf('invalid-email') >= 0 ? 'メールアドレスの形式が正しくありません。'
        : 'メールを送れませんでした。通信の状態をご確認ください。（' + c + '）';
      render();
    });
  };
  if ($('m')) $('m').onkeydown = function(e){ if (e.key === 'Enter') { if ($('okcode') && ($('c').value || '').length === 6) $('okcode').click(); } };
  if ($('c')) {
    $('c').oninput = function(e){ e.target.value = e.target.value.replace(/[^0-9]/g,'').slice(0,6); S.typed = e.target.value; };
    $('c').onkeydown = function(e){ if (e.key === 'Enter') $('okcode').click(); };
  }
  if ($('okcode')) $('okcode').onclick = function(){
    var v = ($('m').value || '').trim().toLowerCase(), c = ($('c').value || '').trim();
    if (badMail(v)) { S.err = 'メールアドレスの形式が正しくありません。'; render(); return; }
    if (c.length !== 6) { S.err = '招待コード（6桁）を入れてください。コードが無ければ下のボタンでリンクを受け取れます。'; render(); return; }
    S.mail = v; S.typed = c; S.err = ''; S.busy = true; render();
    fbAuth.signInWithEmailAndPassword(v, c).then(function(){ S.busy = false; S.typed = ''; afterSignIn(); }, function(e){
      S.busy = false;
      var cc = fbErrCode(e);
      S.err = /wrong-password|invalid-credential|user-not-found|invalid-login/.test(cc) ? 'アドレスかコードが違います。'
        : cc.indexOf('too-many') >= 0 ? '失敗が続いたため、しばらく止まっています。時間をおいてお試しください。'
        : 'ログインできませんでした（' + cc + '）。';
      render();
    });
  };
  if ($('back')) $('back').onclick = function(){ S.step = 'mail'; S.err = ''; S.typed = ''; render(); };
  if ($('signout')) $('signout').onclick = function(){ if (fbAuth) fbAuth.signOut().then(function(){ S.me = null; S.view = 'gate'; S.step = 'mail'; S.err = ''; render(); }); };

  // --- 環境の切り替え ---
  each('#envswitch', function(b){ b.onclick = function(){ switchEnv(IS_DEV); }; });

  // --- タブ ---
  each('[data-tab]', function(b){ b.onclick = function(){ S.tab = b.dataset.tab; render(); }; });
  if ($('reload')) $('reload').onclick = function(){ loadAll(); };
  if ($('reload-retry')) $('reload-retry').onclick = function(){ loadAll(); };
  if ($('reloadstaff')) $('reloadstaff').onclick = function(){
    loadAll().then(function(){ toast('読み直しました', '新しいスタッフが出てこない場合は、スタッフ設定での登録が保存されているか確かめてください。'); });
  };

  // --- メールの保存 ---
  each('[data-mail]', function(i){
    i.onchange = function(){
      var uid = i.dataset.mail, store = i.dataset.store;
      var s = findStaff(uid); if (!s) return;
      var v = i.value.trim().toLowerCase();
      if (v && badMail(v)) { toast('保存しませんでした', 'メールアドレスの形式が正しくありません。カンマや空白が入っていないか確かめてください。'); i.value = s.loginEmail||''; return; }
      i.disabled = true;
      saveStaffField(uid, store, {loginEmail: v || undefined}).then(function(res){
        i.disabled = false;
        if (!res.ok) { toast('保存できませんでした', res.why + '。サーバーが混んでいた可能性があります。「再読込」で今の状態を確かめてから、もう一度お試しください。'); return; }
        render();
        toast('保存しました', v ? (s.name + ' さんのログイン用メールを ' + v + ' にしました。続けて「招待を送る」を押してください。')
                               : (s.name + ' さんのログイン用メールを消しました。'));
      });
    };
  });

  // --- スタッフ／共有端末を追加、用途を決める ---
  //     招待するときに「使う端末」まで決めてしまえば、登録する人は
  //     メールと6桁を入れるだけで終わる。
  //     スタッフ表に新しく人を足すこともできる（氏名・番号・店舗だけ）。
  //     バッジや対応可能業務は既定のまま。細かい設定はスケジュール画面で。
  function saveNewStaff(store, rec){
    var key = STOR + (store === 'sanda' ? 'sanda' : 'honten') + '-staff-v2';
    return gasRead(key).then(function(latest){
      if (latest === GAS_FAIL) return { ok:false, why:'サーバーから一覧を読めませんでした。少し待ってからもう一度お試しください' };
      var base = (latest instanceof Array) ? latest : [];
      if (base.some(function(x){ return x && Number(x.myNumber) === Number(rec.myNumber); })) {
        return { ok:false, why:'その番号はすでに使われています' };
      }
      return gasWrite(key, base.concat([rec])).then(function(okw){
        if (okw) { if (store === 'sanda') S.staffS = base.concat([rec]); else S.staffH = base.concat([rec]); }
        return { ok:okw, why: okw ? '' : '書き込めなかった' };
      });
    });
  }

  function openAdd(existing){
    var rest = allStaff().filter(function(s){ return !isListed(s); });
    var target = existing || null;
    var plan = (target && target.devPlan instanceof Array) ? target.devPlan.slice() : ['own'];
    var devOpts = S.devnames.map(function(d){
      return '<option value="' + esc(d.name) + '">' + esc(d.name)
        + '（' + (d.store === 'sanda' ? '三田店' : '本店') + '）</option>'; }).join('');

    var whatPicker = target ? '' : (
      '<label class="f">何を追加しますか</label>'
      + '<div style="display:flex;gap:8px;margin-bottom:16px">'
      + '<label style="flex:1;border:1.5px solid var(--rule-2);border-radius:9px;padding:10px 12px;cursor:pointer;text-align:center">'
      + '<input type="radio" name="addwhat" value="staff" checked style="width:auto;margin-right:6px"><b>スタッフ</b></label>'
      + '<label style="flex:1;border:1.5px solid var(--rule-2);border-radius:9px;padding:10px 12px;cursor:pointer;text-align:center">'
      + '<input type="radio" name="addwhat" value="dev" style="width:auto;margin-right:6px"><b>共有端末</b></label></div>'
      // 共有端末：人は選ばない。名前と置き場所だけ。
      + '<div id="devwrap" hidden>'
      + '<p style="font-size:12.5px;color:var(--ink-2);line-height:1.8">'
      + '店のPCやタブレットを登録します。<b>人と同じで、メールで認証します。</b>'
      + '登録用のアドレスに招待を送り、その端末でアドレスと6桁を入れてもらいます。</p>'
      + '<label class="f" for="devname" style="margin-top:10px">端末名</label>'
      + '<input type="text" id="devname" placeholder="例：共有PC1" autocomplete="off" maxlength="40">'
      + '<label class="f" style="margin-top:14px">置いてある店舗</label>'
      + '<select id="devstore"><option value="honten">本店</option><option value="sanda">三田店</option></select>'
      + '<label class="f" for="devmail" style="margin-top:14px">登録用メール（あとからでも可）</label>'
      + '<input type="email" id="devmail" placeholder="例：pc1@midori-m.com" autocomplete="off" inputmode="email">'
      + '<p style="font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.8">'
      + 'この端末の登録に使うアドレスです。<b>管理者が受け取れるアドレスで構いません</b>'
      + '（端末の登録は管理者の作業なので、専用のアドレスを用意する必要はありません）。<br>'
      + '自分のスマホ（個人端末）はここに登録しません。共有の端末だけです。</p></div>');

    var staffPicker = target
      ? ('<p style="font-size:13px;font-weight:700">' + esc(target.name) + ' さん</p>'
        + '<label class="f" for="edstore" style="margin-top:8px">所属店舗</label>'
        + '<select id="edstore"><option value="honten"' + (target.store === 'sanda' ? '' : ' selected') + '>本店</option>'
        + '<option value="sanda"' + (target.store === 'sanda' ? ' selected' : '') + '>三田店</option></select>'
        + '<p style="font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.8">'
        + '店舗を変えると、その店のスタッフ表に移ります（担当の選択肢・休日設定・頭数も移り先の店に）。'
        + '過去の予約に書かれた名前はそのまま残ります。</p>')
      : ('<label class="f" for="newuid">スタッフ</label>'
        + '<select id="newuid">'
        + rest.map(function(x){
            return '<option value="' + esc(x.uid) + '">' + esc(x.name)
              + '（' + (x.store==='sanda'?'三田店':'本店') + '）</option>'; }).join('')
        + '<option value="__new__">＋ 一覧にない（新しく登録する）…</option></select>'
        + '<div id="newstaffwrap" style="margin-top:10px;padding-left:2px" hidden>'
        + '<label class="f" for="nsname">氏名</label>'
        + '<input type="text" id="nsname" placeholder="例：山田太郎" autocomplete="off" maxlength="20">'
        + '<div style="margin-top:10px"><label class="f" for="nsstore">店舗</label>'
        + '<select id="nsstore"><option value="honten">本店</option><option value="sanda">三田店</option></select></div>'
        + '<p style="font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.8">'
        + 'バッジと対応可能業務は既定のまま登録します。'
        + 'あとでスケジュール画面の「⚙️ スタッフ設定」から整えてください。</p></div>');

    S.dialog = {
      title: target ? (target.name + ' さんの設定') : '追加',
      okLabel: target ? '変更する' : '追加する',
      body: whatPicker
        + '<div id="staffwrap">'
        + staffPicker
        + '<label class="f" style="margin-top:14px">この方はシステムを操作しますか</label>'
        + '<label style="display:block;border:1.5px solid var(--rule-2);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer">'
        + '<input type="radio" name="newrole" value="use"' + ((target && target.noLogin) ? '' : ' checked') + ' style="width:auto;margin-right:8px">'
        + '<b>操作する</b><br><span style="font-size:12px;color:var(--ink-2);margin-left:24px">'
        + '予約の入力や確認をします。ログインが要ります。</span></label>'
        + '<label style="display:block;border:1.5px solid var(--rule-2);border-radius:9px;padding:11px 13px;cursor:pointer">'
        + '<input type="radio" name="newrole" value="none"' + ((target && target.noLogin) ? ' checked' : '') + ' style="width:auto;margin-right:8px">'
        + '<b>操作しない</b><br><span style="font-size:12px;color:var(--ink-2);margin-left:24px">'
        + 'アルバイト・助っ人など。ログインしません。<br>休日設定・頭数・予約の担当欄には今までどおり出ます。</span></label>'
        + '<div id="usewrap">'
        + '<label class="f" style="margin-top:16px">この方が使う端末（いくつでも選べます）</label>'
        + '<label style="display:block;border:1.5px solid var(--rule-2);border-radius:9px;padding:10px 13px;margin-bottom:8px;cursor:pointer">'
        + '<input type="checkbox" id="planown"' + (plan.indexOf('own') >= 0 ? ' checked' : '') + ' style="width:auto;margin-right:8px">'
        + '<b>個人端末</b><span style="font-size:12px;color:var(--ink-2)">　自分のスマホ、自分だけが使うPC</span></label>'
        + '<label style="display:block;border:1.5px solid var(--rule-2);border-radius:9px;padding:10px 13px;cursor:pointer">'
        + '<input type="checkbox" id="planshared"' + (plan.some(function(x){ return x !== 'own'; }) ? ' checked' : '') + ' style="width:auto;margin-right:8px">'
        + '<b>共有端末</b><span style="font-size:12px;color:var(--ink-2)">　店のPC・タブレット</span></label>'
        + '<div id="sharedwrap" style="margin-top:8px;padding-left:24px"' + (plan.some(function(x){ return x !== 'own'; }) ? '' : ' hidden') + '>'
        + (devOpts
            ? '<select id="planname">' + devOpts + '</select>'
            : '<p style="font-size:12px;color:var(--wait);line-height:1.8">'
              + '共有端末がまだ登録されていません。先に「共有端末」を追加してください。</p>')
        + '</div>'
        + '<label class="f" for="newmail" style="margin-top:16px">ログイン用メール（あとからでも可）</label>'
        + '<input type="email" id="newmail" placeholder="例：okaue@midori-m.com" autocomplete="off" inputmode="email"'
        + ' value="' + esc((target && target.loginEmail) || '') + '">'
        + '<p style="font-size:12px;color:var(--ink-3);margin-top:6px">'
        + '本人が受け取れるアドレスにしてください。空欄のままでも追加できます。</p></div>'
        + '</div>',
      onOk: function(){}
    };
    render();

    var $$ = function(id){ return document.getElementById(id); };
    var whatIs = function(){ return ((document.querySelector('input[name="addwhat"]:checked') || {}).value) || 'staff'; };
    var syncWhat = function(){
      var dev = whatIs() === 'dev';
      if ($$('devwrap')) $$('devwrap').hidden = !dev;
      if ($$('staffwrap')) $$('staffwrap').hidden = dev;
    };
    var syncRole = function(){
      var none = ((document.querySelector('input[name="newrole"]:checked')||{}).value) === 'none';
      if ($$('usewrap')) $$('usewrap').hidden = none;
    };
    var syncShared = function(){
      if ($$('sharedwrap')) $$('sharedwrap').hidden = !($$('planshared') && $$('planshared').checked);
    };
    var syncNewStaff = function(){
      var isNew = $$('newuid') && $$('newuid').value === '__new__';
      if ($$('newstaffwrap')) $$('newstaffwrap').hidden = !isNew;
    };
    Array.prototype.forEach.call(document.querySelectorAll('input[name="addwhat"]'), function(r){ r.onchange = syncWhat; });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="newrole"]'), function(r){ r.onchange = syncRole; });
    if ($$('planshared')) $$('planshared').onchange = syncShared;
    if ($$('newuid')) $$('newuid').onchange = syncNewStaff;
    syncWhat(); syncRole(); syncShared(); syncNewStaff();

    var okBtn = document.querySelector('[data-dlg="ok"]');
    if (okBtn) okBtn.onclick = function(){
      // --- 共有端末を足す ---
      if (whatIs() === 'dev') {
        var nm = (($$('devname')||{}).value||'').trim().slice(0,40);
        var st2 = ($$('devstore')||{}).value || 'honten';
        if (!nm) { toast('追加しませんでした', '端末名を入れてください。'); return; }
        if (S.devnames.some(function(d){ return d.name === nm; })) {
          toast('追加しませんでした', 'その名前はすでにあります。'); return;
        }
        S.dialog = null; render();
        gasRead(STOR + 'auth-devnames').then(function(latest){
          if (latest === GAS_FAIL) { toast('保存できませんでした', 'サーバーから一覧を読めていません。少し待ってからもう一度お試しください。'); render(); return; }
          var base = (latest instanceof Array) ? latest.filter(function(x){ return x && x.name; }) : [];
          if (base.some(function(d){ return d.name === nm; })) {
            S.devnames = base; render(); toast('追加しませんでした', 'その名前はすでにあります。'); return;
          }
          var dmail = (($('devmail')||{}).value||'').trim().toLowerCase();
          if (dmail && badMail(dmail)) {
            toast('追加しませんでした', 'メールアドレスの形式が正しくありません。カンマや空白が入っていないか確かめてください。');
            return;
          }
          var recDev = { name: nm, store: st2 };
          if (dmail) recDev.mail = dmail;
          saveDevNames(base.concat([recDev])).then(function(okw){
            // 足した端末は「スタッフと招待」には出ない（人ではないので）。
            // 何も起きていないように見えるため、一覧のあるタブへ移して見せる。
            if (okw) S.tab = 'devices';
            render();
            toast(okw ? nm + ' を追加しました' : '追加できませんでした',
              okw ? '「登録端末」の一覧に入りました。次はスタッフの「設定」を開いて、'
                    + 'この端末を使う人に割り当ててください。'
                  : '通信の状態をご確認ください。');
          });
        });
        return;
      }

      // --- スタッフ ---
      var role = ((document.querySelector('input[name="newrole"]:checked')||{}).value) || 'use';
      var mail = (($$('newmail')||{}).value||'').trim().toLowerCase();
      var newPlan = [];
      if (role === 'use') {
        if ($$('planown') && $$('planown').checked) newPlan.push('own');
        if ($$('planshared') && $$('planshared').checked) {
          var pick = ($$('planname')||{}).value || '';
          if (!pick) { toast('保存しませんでした', '先に「共有端末」を追加してください。'); return; }
          newPlan.push(pick);
        }
        if (!newPlan.length) { toast('保存しませんでした', '使う端末を1つ以上選んでください。'); return; }
      }
      if (role === 'use' && mail) {
        if (badMail(mail)) { toast('保存しませんでした', 'メールアドレスの形式が正しくありません。カンマや空白が入っていないか確かめてください。'); return; }
        var dup = allStaff().filter(function(x){ return (!target || x.uid !== target.uid) && (x.loginEmail||'').toLowerCase() === mail; })[0];
        if (dup) { toast('保存しませんでした', 'そのアドレスは ' + dup.name + ' さんで使われています。'); return; }
      }
      var patch = (role === 'none')
        ? { noLogin: true, sysUse: undefined, loginEmail: undefined, devPlan: undefined }
        : { noLogin: undefined, sysUse: true, loginEmail: mail || undefined, devPlan: newPlan };

      // 新しいスタッフを作る場合
      var isNew = !target && $$('newuid') && $$('newuid').value === '__new__';
      if (isNew) {
        var nsName = (($$('nsname')||{}).value||'').trim().slice(0,20);
        var nsStore = ($$('nsstore')||{}).value || 'honten';
        if (!nsName) { toast('追加しませんでした', '氏名を入れてください。'); return; }
        // 番号（myNumber）は画面から外した。空いている最小の番号を裏で振る（並び順・社長判定の裏方の値）
        var usedNo = {}; allStaff().forEach(function(x){ usedNo[Number(x.myNumber)] = 1; });
        var nsNo = 1; while (usedNo[nsNo]) nsNo++;
        var rec = Object.assign({ uid:'a'+Date.now(), name:nsName, myNumber:nsNo,
                                  badge:'mechanic', store:nsStore }, patch);
        Object.keys(rec).forEach(function(k){ if (rec[k] === undefined) delete rec[k]; });
        S.dialog = null; render();
        saveNewStaff(nsStore, rec).then(function(res){
          if (!res.ok) { toast('追加できませんでした', res.why + '。'); return; }
          render();
          toast(nsName + ' さんをスタッフ表に追加しました',
            'バッジや対応可能業務は、スケジュール画面の「⚙️ スタッフ設定」で整えてください。');
        });
        return;
      }

      var uid = target ? target.uid : (($$('newuid')||{}).value || '');
      if (!uid) { toast('追加しませんでした', 'スタッフを選んでください。'); return; }
      var s2 = findStaff(uid); if (!s2) return;
      var toStore = (target && $$('edstore')) ? ($$('edstore').value === 'sanda' ? 'sanda' : 'honten') : s2.store;
      var moving = toStore !== s2.store;
      S.dialog = null; render();
      (moving ? moveStaff(uid, s2.store, toStore, patch) : saveStaffField(uid, s2.store, patch)).then(function(res){
        if (moving && res.ok) {
          render();
          toast(s2.name + ' さんを' + (toStore === 'sanda' ? '三田店' : '本店') + 'に移しました',
            res.warn || 'スケジュール画面の「⚙️ スタッフ設定」で、バッジや対応可能業務を確かめてください。');
          return;
        }
        if (!res.ok) { toast('保存できませんでした', res.why + '。サーバーが混んでいた可能性があります。「再読込」で今の状態を確かめてから、もう一度お試しください。'); return; }

// ── 起動 ────────────────────────────────────────
//   Firebase のサインインが残っていればログイン画面を出さずに開く。メールのリンクから開いた時はサインインを完了する。
function inviteErr(r){
  var e = r && r.err;
  return e === 'not_admin' ? '管理者としてログインしている必要があります（許可簿に書けませんでした）。'
    : e === 'quota' ? '本日のメールリンクの送信上限（Firebase の無料枠）に達しました。この方は控えが無いためリンクでしか招待できません。明日以降にもう一度送るか、node fb_seed_allowed.js --code で発行してください。'
    : e === 'too_many' ? '送信が続いています。しばらく待ってからお試しください。'
    : e === 'bad_domain' ? 'アプリのアドレスが Firebase の承認済みドメインにありません。'
    : e === 'bad_email' ? 'メールアドレスの形式が正しくありません。'
    : '通信の状態をご確認ください。' + (e ? '（' + e + '）' : '');
}
function enterConsole(all){
  var a = all[fbEmailKey(fbUser.email)];
  if (!a || a.active === false || a.role !== 'admin') {
    S.view = 'gate'; S.step = 'mail'; S.mail = fbUser.email || '';
    S.err = 'このアドレス（' + (fbUser.email || '') + '）は管理者ではありません。管理者に追加してもらってから、もう一度お試しください。';
    render(); return;
  }
  S.me = { name: a.name || '', uid: a.uid || '', mail: fbUser.email || '' };
  S.view = 'console'; S.tab = 'staff'; S.admins = adminsFromAllowed(all); S.allowed = all;
  render(); loadAll();
}
function afterSignIn(){
  allowedRead().then(enterConsole, function(e){
    S.view = 'gate'; S.step = 'mail'; S.mail = (fbUser && fbUser.email) || '';
    S.err = (fbErrCode(e).indexOf('permission-denied') >= 0)
      ? 'このアドレス（' + S.mail + '）は登録されていません。管理者に追加してもらってから、もう一度お試しください。'
      : '許可簿を読めませんでした。通信の状態をご確認ください。';
    render();
  });
}
(function start(){
  if (!fbAuth) { S.err = 'Firebase に繋がっていません（firebase_config.js か通信の状態をご確認ください）。'; render(); return; }
  var linkOpen = false; try { linkOpen = fbAuth.isSignInWithEmailLink(location.href); } catch (e) {}
  if (linkOpen) {
    S.view = 'gate'; S.step = 'signing'; render();
    var mail = ''; try { mail = new URLSearchParams(location.search).get('e') || localStorage.getItem('hub-admin-link-email') || ''; } catch (e) {}
    if (!mail) { S.step = 'mail'; S.err = 'このリンクを送った時のメールアドレスを入れて、もう一度リンクを送ってください。'; render(); return; }
    fbAuth.signInWithEmailLink(mail, location.href).then(function(){
      try { localStorage.removeItem('hub-admin-link-email'); } catch (e) {}
      try { history.replaceState(null, '', location.pathname + (ENV_PROD ? '?env=prod' : '')); } catch (e) {}
      afterSignIn();
    }, function(e){
      var c = fbErrCode(e);
      S.step = 'mail'; S.mail = mail;
      S.err = (c.indexOf('invalid-action-code') >= 0 || c.indexOf('expired') >= 0)
        ? 'このリンクは期限切れか、すでに使われています。もう一度リンクを送ってください。'
        : 'ログインできませんでした（' + c + '）。もう一度リンクを送ってください。';
      try { history.replaceState(null, '', location.pathname + (ENV_PROD ? '?env=prod' : '')); } catch (e2) {}
      render();
    });
    return;
  }
  S.view = 'gate'; S.step = 'signing'; render();
  fbWhenReady().then(function(u){
    if (u) afterSignIn(); else { S.step = 'mail'; render(); }
  });
})();
})();

</script>
</body>
</html>
