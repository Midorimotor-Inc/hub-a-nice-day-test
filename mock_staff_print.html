<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>モック：スタッフ休日表の印刷</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;background:#475569;color:#1b2129}
.bar{background:#0f172a;color:white;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.bar b{font-size:14px}
.bar button{padding:7px 14px;border-radius:7px;border:2px solid #475569;background:#1e293b;color:#cbd5e1;font-weight:700;font-size:13px;cursor:pointer}
.bar button.on{background:#fbbf24;border-color:#fbbf24;color:#0f172a}
.note{max-width:1123px;margin:10px auto 0;background:#fffbeb;border:2px solid #fcd34d;border-radius:9px;padding:9px 14px;font-size:13px;line-height:1.7}
.paper{width:1123px;height:794px;margin:12px auto 30px;background:white;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:30px;overflow:hidden}
iframe{border:none;width:1063px;height:734px}
</style></head><body>
<div class="bar"><b>スタッフ休日表の印刷（A4 横・1枚）</b>
  <button data-v="cal">店舗全体　A案 カレンダー型</button><button data-v="table">店舗全体　B案 表型</button><button data-v="one">スタッフ個別</button></div>
<div class="note" id="note"></div>
<div class="paper"><iframe id="fr"></iframe></div>
<script>
// ── スタッフ休日表の印刷（v3.129.0・2026-11-23 ユーザー要望）─────────────────
//   「スタッフ休日・有給カレンダー」から、店舗全体／スタッフ個別 を A4 横 1枚で刷る。
//   ★純関数。画面が持っている値（その月の日ごとの休日・有給・研修／月の集計）を受け取って HTML の文字を返すだけ。
//   ★外から何も読み込まない（CDN・画像・フォントなし）。script も入れない（印刷は開いた側から w.print()）。
//   ★「1か月が1枚に収まる」ことを最優先。表の高さを決め打ちにして、行を等分する。
//   ★色が出ない紙でも読めるよう、休＝「休」／有給＝「有」／研修＝「研」の字を必ず添える（色だけで区別しない）。
//   d = {mode:'cal'|'table'|'one', storeName, y, m(0始まり), who, quota, stamp,
//        staff:[氏名], days:[{d,dow,closed,hol,off:[],leave:[],trn:[],notes:{氏名:メモ}}],
//        summary:[{name,offs,leaves,trn,closedN,breakdown,carry}], carried:[日]（個別のみ）}
const staffCalPrintHtml=(d)=>{
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const DOW=['日','月','火','水','木','金','土'];
  const dcls=x=>(x.hol||x.dow===0)?'sun':(x.dow===6?'sat':'');
  const title=`スタッフ休日表　${d.y}年${d.m+1}月　${esc(d.storeName)}${d.mode==='one'?'　'+esc(d.who)+' さん':'（全体）'}`;
  const sumOf=n=>(d.summary||[]).find(s=>s.name===n)||{name:n,offs:0,leaves:0,trn:0};
  // 週に割る（日曜はじまり・画面のカレンダーと同じ）
  const weeks=[];let wk=Array(7).fill(null);
  d.days.forEach(x=>{wk[x.dow]=x;if(x.dow===6){weeks.push(wk);wk=Array(7).fill(null);}});
  if(wk.some(Boolean))weeks.push(wk);
  const css=`
@page{size:A4 landscape;margin:8mm}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Yu Gothic","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{width:281mm;height:193mm;display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;align-items:baseline;gap:12px;border-bottom:2.5px solid #111;padding-bottom:3px;flex-shrink:0}
.hd h1{font-size:19px;margin:0;font-weight:900;letter-spacing:.5px}
.hd .r{margin-left:auto;font-size:10px;color:#444;white-space:nowrap}
.lg{display:flex;gap:14px;align-items:center;font-size:10.5px;margin:4px 0 5px;flex-shrink:0;color:#222}
.k{display:inline-block;min-width:15px;text-align:center;font-weight:900;font-size:10px;border-radius:3px;padding:0 2px;margin-right:3px;line-height:1.45}
.k.off{background:#fff;color:#c2410c;border:1.4px solid #c2410c}
.k.lv{background:#047857;color:#fff;border:1.4px solid #047857}
.k.tr{background:#fff;color:#7e22ce;border:1.4px dashed #7e22ce}
.cbox{display:inline-block;width:13px;height:13px;background:#fecaca;border:1px solid #b91c1c;vertical-align:-2px;margin-right:3px}
table{border-collapse:collapse;width:100%;table-layout:fixed}
.grid{flex:1;min-height:0}
.grid table{height:100%}
.grid th{font-size:12px;padding:2px 0;border:1.2px solid #111;background:#e5e7eb;height:6mm}
.grid td{border:1.2px solid #111;vertical-align:top;padding:2px 4px;overflow:hidden}
.sun{color:#dc2626}.sat{color:#1d4ed8}
td.none{background:#f3f4f6}
td.closed{background:#fecaca}
.dn{font-size:15px;font-weight:900;line-height:1.15;display:flex;align-items:baseline;gap:4px}
.dn small{font-size:9px;font-weight:700;color:#dc2626}
.cl{font-size:13px;font-weight:900;color:#991b1b;letter-spacing:3px;text-align:center;margin-top:5mm}
.nm{font-size:11.5px;font-weight:700;line-height:1.42;white-space:nowrap;overflow:hidden}
.dense .nm{font-size:9.5px;line-height:1.3}
.dense .k{font-size:8.5px;min-width:12px}
.nm i{font-style:normal;font-weight:400;font-size:9px;color:#555;margin-left:3px}
.sm{flex-shrink:0;margin-top:5px;border:1.2px solid #111;padding:3px 7px;font-size:10.5px;display:flex;flex-wrap:wrap;gap:2px 16px}
.sm b{font-weight:900}
.sm .t{font-weight:900;margin-right:4px}
/* 表型 */
.tb th,.tb td{border:1px solid #111;text-align:center;font-size:11px;padding:0;overflow:hidden}
.tb th{background:#e5e7eb;font-size:10.5px;height:5.5mm}
.tb th.name,.tb td.name{width:25mm;text-align:left;padding-left:5px;font-weight:800;font-size:12px;white-space:nowrap}
.tb th.tot,.tb td.tot{width:10.5mm;font-weight:800;background:#f8fafc}
.tb td.cy{width:21mm;font-size:9px;font-weight:700;background:#f8fafc;white-space:nowrap}
.tb th.cy{width:21mm}
.tb td.closed{background:#fecaca;color:#991b1b;font-size:9px}
.tb td .k{margin:0;font-size:11px;min-width:16px}
.tb tr.cnt td{font-size:10px;font-weight:800;background:#f8fafc;height:6mm}
/* 個別 */
.one .dn{font-size:17px}
.mk{text-align:center;font-weight:900;margin-top:2mm;font-size:21px;letter-spacing:2px}
.mk.off{color:#c2410c}.mk.lv{color:#047857}.mk.tr{color:#7e22ce;font-size:17px}
.mk small{display:block;font-size:9.5px;font-weight:700;letter-spacing:0;color:#1d4ed8;margin-top:1px}
.memo{font-size:10px;color:#92400e;text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden}
.one td.is-off{background:#fff7ed}.one td.is-lv{background:#ecfdf5}.one td.is-tr{background:#faf5ff}
.big{flex-shrink:0;margin-top:5px;border:1.5px solid #111;padding:5px 10px;font-size:13px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.big b{font-size:17px;font-weight:900}
.big .sub{font-size:10.5px;color:#444}
`;
  const head=`<div class="hd"><h1>🏖 ${title}</h1><div class="r">${d.quota!=null?'会社の休日数 '+esc(d.quota)+'日　／　':''}作成 ${esc(d.stamp)}</div></div>`
    +`<div class="lg"><span><span class="k off">休</span>休日</span><span><span class="k lv">有</span>有給</span><span><span class="k tr">研</span>研修（出勤・不在）</span><span><span class="cbox"></span>休業日</span></div>`;
  const thDow='<tr>'+DOW.map((w,i)=>`<th class="${i===0?'sun':i===6?'sat':''}">${w}</th>`).join('')+'</tr>';
  const dn=x=>`<div class="dn ${dcls(x)}">${x.d}${x.hol&&!x.closed?'<small>祝</small>':''}</div>`;
  let body='';
  if(d.mode==='cal'){
    // ── 店舗全体・カレンダー型：その日に休む人の名前を並べる
    const mx=Math.max(0,...d.days.map(x=>x.closed?0:x.off.length+x.leave.length+x.trn.length));
    const nmOf=(x,n,cls,ch)=>`<div class="nm"><span class="k ${cls}">${ch}</span>${esc(n)}${x.notes&&x.notes[n]?'<i>'+esc(x.notes[n])+'</i>':''}</div>`;
    body=`<div class="grid${mx>(weeks.length>5?4:5)?' dense':''}"><table>${thDow}`+weeks.map(w=>'<tr style="height:'+(100/weeks.length).toFixed(2)+'%">'+w.map(x=>{
      if(!x)return '<td class="none"></td>';
      if(x.closed)return `<td class="closed">${dn(x)}<div class="cl">休業日</div></td>`;
      return `<td>${dn(x)}${x.off.map(n=>nmOf(x,n,'off','休')).join('')}${x.leave.map(n=>nmOf(x,n,'lv','有')).join('')}${x.trn.map(n=>nmOf(x,n,'tr','研')).join('')}</td>`;
    }).join('')+'</tr>').join('')+'</table></div>';
    body+=`<div class="sm"><span class="t">集計</span>`+d.staff.map(n=>{const s=sumOf(n);return `<span><b>${esc(n)}</b>　休${s.offs||0}・有${s.leaves||0}${s.trn?'・研'+s.trn:''}${s.carry?'　'+esc(s.carry):''}</span>`;}).join('')+'</div>';
  }else if(d.mode==='table'){
    // ── 店舗全体・表型：スタッフ×日
    const cnt=x=>x.closed?'':(x.off.length+x.leave.length)||'';
    body=`<div class="grid"><table class="tb"><tr><th class="name" rowspan="2">氏名</th>`+d.days.map(x=>`<th class="${dcls(x)}">${x.d}</th>`).join('')+`<th class="tot" rowspan="2">休日</th><th class="tot" rowspan="2">有給</th><th class="tot" rowspan="2">計</th><th class="tot" rowspan="2">研修</th><th class="cy" rowspan="2">繰り越し</th></tr>`
      +'<tr>'+d.days.map(x=>`<th class="${dcls(x)}">${DOW[x.dow]}</th>`).join('')+'</tr>'
      +d.staff.map(n=>{const s=sumOf(n);return `<tr><td class="name">${esc(n)}</td>`+d.days.map(x=>{
          if(x.closed)return '<td class="closed">店休</td>';
          if(x.off.includes(n))return '<td><span class="k off">休</span></td>';
          if(x.leave.includes(n))return '<td><span class="k lv">有</span></td>';
          if(x.trn.includes(n))return '<td><span class="k tr">研</span></td>';
          return '<td></td>';
        }).join('')+`<td class="tot">${s.offs||0}</td><td class="tot">${s.leaves||0}</td><td class="tot">${(s.offs||0)+(s.leaves||0)}</td><td class="tot">${s.trn||''}</td><td class="cy">${esc(s.carry||'')}</td></tr>`;}).join('')
      +`<tr class="cnt"><td class="name" style="font-size:10px">休みの人数</td>`+d.days.map(x=>`<td${x.closed?' class="closed"':''}>${cnt(x)}</td>`).join('')+'<td colspan="5"></td></tr></table></div>';
    body+=`<div class="sm"><span class="t">見かた</span><span>「休日」には店の休業日も入っています（画面の集計と同じ数え方）。「休みの人数」は 休日＋有給 の人数です。</span></div>`;
  }else{
    // ── スタッフ個別
    const n=d.who,s=sumOf(n);
    body=`<div class="grid one"><table>${thDow}`+weeks.map(w=>'<tr style="height:'+(100/weeks.length).toFixed(2)+'%">'+w.map(x=>{
      if(!x)return '<td class="none"></td>';
      if(x.closed)return `<td class="closed">${dn(x)}<div class="cl">休業日</div></td>`;
      const memo=x.notes&&x.notes[n]?`<div class="memo">📝 ${esc(x.notes[n])}</div>`:'';
      if(x.off.includes(n))return `<td class="is-off">${dn(x)}<div class="mk off">休日${(d.carried||[]).includes(x.d)?'<small>↩ 繰り越し分</small>':''}</div>${memo}</td>`;
      if(x.leave.includes(n))return `<td class="is-lv">${dn(x)}<div class="mk lv">有給</div>${memo}</td>`;
      if(x.trn.includes(n))return `<td class="is-tr">${dn(x)}<div class="mk tr">研修</div></td>`;
      return `<td>${dn(x)}</td>`;
    }).join('')+'</tr>').join('')+'</table></div>';
    body+=`<div class="big"><span>休日 <b>${s.offs||0}</b> 日${s.breakdown?'<span class="sub">　'+esc(s.breakdown)+'</span>':''}</span><span>有給 <b>${s.leaves||0}</b> 日</span><span>計 <b>${(s.offs||0)+(s.leaves||0)}</b> 日</span>${s.trn?`<span>研修 <b>${s.trn}</b> 日<span class="sub">（休みには数えません）</span></span>`:''}${s.carry?`<span class="sub" style="font-size:12px;font-weight:800;color:#111">${esc(s.carry)}</span>`:''}</div>`;
  }
  return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>${title}</title><style>${css}</style></head><body><div class="sheet" data-printmode="${d.mode}">${head}${body}</div></body></html>`;
};

// ※お名前はすべて架空です
var STAFF=['青木一郎','井上二郎','上田三郎','江口四郎','小川五郎','加藤六郎','木村七郎','工藤八郎','小島九郎'];
var Y=2026,M=11,CLOSED=[8,29,30,31],HOL=[];
var OFF={'青木一郎':[2,6,10,13,17,20,24],'井上二郎':[1,5,9,13,16,20,23,27],'上田三郎':[3,6,11,14,18,21,25],'江口四郎':[4,7,10,15,18,22,26],'小川五郎':[2,5,12,14,19,21,27],'加藤六郎':[1,6,9,13,17,23,26],'木村七郎':[3,7,11,16,20,24,28],'工藤八郎':[4,6,12,15,19,22,25],'小島九郎':[2,7,10,14,18,21,27]};
var LEAVE={'青木一郎':[28],'上田三郎':[26],'小川五郎':[28],'工藤八郎':[13,26]};
var TRN={'江口四郎':[16,17],'小島九郎':[16]};
var NOTES={'2':{'青木一郎':'午後休'},'13':{'工藤八郎':'病院'},'26':{'上田三郎':'帰省'}};
var days=[];for(var i=1;i<=31;i++){var dow=new Date(Y,M,i).getDay();var has=function(o){return STAFF.filter(function(n){return (o[n]||[]).indexOf(i)>=0;});};
  days.push({d:i,dow:dow,closed:CLOSED.indexOf(i)>=0,hol:HOL.indexOf(i)>=0,off:has(OFF),leave:has(LEAVE),trn:has(TRN),notes:NOTES[i]||{}});}
var summary=STAFF.map(function(n,ix){var o=(OFF[n]||[]).length+CLOSED.length,l=(LEAVE[n]||[]).length,t=(TRN[n]||[]).length;
  return {name:n,offs:o,leaves:l,trn:t,closedN:CLOSED.length,breakdown:'（うち店休日'+CLOSED.length+'日'+(ix===0?'＋繰り越し休日1日':'')+'）',carry:ix===0?'':(ix%3===1?'繰り越し1日':'')};});
var V='cal';
var N={cal:'<b>店舗全体　A案 カレンダー型</b>：画面のカレンダーと同じ形。その日に休む人の<b>名前</b>が並ぶ。「この日は誰が休みか」がひと目で分かる。メモも名前の横に出る。下に全員の集計。',
  table:'<b>店舗全体　B案 表型</b>：<b>スタッフ×日</b>の表（勤務表の形）。1人を横に追えば「いつ休みか」、縦に見れば「この日は何人休みか」が分かる。右端に休日・有給・計・研修・繰り越し。',
  one:'<b>スタッフ個別</b>：その人だけの1か月。休日・有給・研修を大きく、メモと「繰り越し分」の印も出る。下にその人の集計（休日○日・有給○日・繰り越し）。'};
function render(){
  var d={mode:V,storeName:'本店',y:Y,m:M,who:'青木一郎',quota:9,stamp:'2026/11/23 15:10',staff:STAFF,days:days,summary:summary,carried:[2]};
  document.getElementById('fr').srcdoc=staffCalPrintHtml(d);
  document.getElementById('note').innerHTML=N[V]+'<br><span style="color:#64748b;font-size:12px">どれも A4 横・1枚に収まります。色が出ないプリンターでも読めるよう、休・有・研の字を必ず添えています。お名前・日付は架空です。</span>';
  [].forEach.call(document.querySelectorAll('.bar button'),function(b){b.className=b.dataset.v===V?'on':'';});
}
document.addEventListener('click',function(e){var b=e.target.closest('.bar button');if(b){V=b.dataset.v;render();}});
render();
</script></body></html>
