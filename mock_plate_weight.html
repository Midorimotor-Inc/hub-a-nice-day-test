<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナンバーの枠の見本（案内のうすさ／入れた字の太さ）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1b2129;padding:18px}
  h1{font-size:18px;margin-bottom:4px}
  .lead{font-size:13px;color:#475569;margin-bottom:16px;line-height:1.7}
  .panel{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ttl{font-size:13px;font-weight:800;color:#0f172a;margin-bottom:8px}
  .pick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
  .pick button{border:2px solid #e5e7eb;background:#fff;border-radius:8px;padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .pick button.on{border-color:#6d28d9;background:#ede9fe;color:#4c1d95}
  .note{font-size:11.5px;color:#64748b;margin-top:5px}
  .card{background:#fff;border-radius:10px;padding:14px;border:1px solid #e5e7eb}
  label.lbl{display:block;font-size:11px;font-weight:700;color:#6b7280;margin-bottom:4px}
  label.lbl span{font-weight:400;color:#9ca3af;font-size:10px}
  .row{display:grid;grid-template-columns:1.15fr .85fr .7fr 1.05fr;gap:6px}
  .row input{width:100%;padding:10px 6px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;text-align:center;font-family:inherit;outline:none}
  .row input:focus{border-color:#0891b2}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.two{grid-template-columns:1fr}}
  .cap{font-size:12px;font-weight:700;color:#334155;margin-bottom:6px}
  .cur{font-size:12px;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:9px 11px;margin-top:10px;line-height:1.7}
  code{font-family:Consolas,monospace;background:#eef2f6;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<h1>ナンバーの枠：案内のうすさと、入れた字の太さ</h1>
<p class="lead">
  左が<b>まだ何も入れていない枠</b>（案内の字＝神戸／582／は／3182）、右が<b>入れた枠</b>です。<br>
  ボタンを押して見比べて、いちばん分かりやすい組み合わせを教えてください。枠には実際に打ち込めます。
</p>

<div class="panel">
  <div class="ttl">① 案内の字のうすさ</div>
  <div class="pick" id="p1"></div>
  <div class="note">※ いまの本番は「B案（もっとうすい）」を入れてあります。</div>
</div>

<div class="panel">
  <div class="ttl">② 入れた字の太さ</div>
  <div class="pick" id="p2"></div>
  <div class="note">※ いまの本番は「③ もっと太い（800）」を入れてあります。</div>
</div>

<div class="two">
  <div class="panel">
    <div class="cap">まだ入れていない枠</div>
    <div class="card">
      <label class="lbl">ナンバー <span>地名／分類番号／かな／4桁（Enter で次の枠へ）</span></label>
      <div class="row" id="rowA">
        <input placeholder="神戸"><input placeholder="582"><input placeholder="は"><input placeholder="3182">
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="cap">入れた枠</div>
    <div class="card">
      <label class="lbl">ナンバー <span>地名／分類番号／かな／4桁（Enter で次の枠へ）</span></label>
      <div class="row" id="rowB">
        <input value="神戸"><input value="582"><input value="は"><input value="3182">
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="cap">半分だけ入れた時（いちばん多い見え方）</div>
  <div class="card">
    <label class="lbl">ナンバー <span>地名／分類番号／かな／4桁（Enter で次の枠へ）</span></label>
    <div class="row" id="rowC">
      <input value="神戸"><input placeholder="582"><input value="は"><input placeholder="3182">
    </div>
  </div>
  <div class="cur" id="cur"></div>
</div>

<script>
var SHADES=[
  ['A案 うすい','#cbd0d6'],
  ['B案 もっとうすい（いま）','#dde1e6'],
  ['C案 ほとんど消える','#ebedf0']
];
var WEIGHTS=[['① ふつう',400],['② 太い',700],['③ もっと太い（いま）',800],['④ いちばん太い',900]];
var S=1, W=2;
var st=document.createElement('style'); document.head.appendChild(st);
function draw(){
  var sh=SHADES[S][1], w=WEIGHTS[W][1];
  st.textContent='.row input{font-weight:'+w+'}.row input::placeholder{color:'+sh+';opacity:1;font-weight:500}';
  [['p1',SHADES,S],['p2',WEIGHTS,W]].forEach(function(x){
    [].forEach.call(document.getElementById(x[0]).children,function(b,i){
      b.className = (i===x[2]?'on':'');
    });
  });
  document.getElementById('cur').innerHTML='いまの見本：案内の字 <code>'+sh+'</code>（'+SHADES[S][0]+'）／入れた字の太さ <code>'+w+'</code>（'+WEIGHTS[W][0]+'）';
}
function mk(id,list,set){
  var box=document.getElementById(id);
  list.forEach(function(it,i){
    var b=document.createElement('button'); b.textContent=it[0];
    b.onclick=function(){ set(i); draw(); };
    box.appendChild(b);
  });
}
mk('p1',SHADES,function(i){S=i;});
mk('p2',WEIGHTS,function(i){W=i;});
draw();
</script>
</body>
</html>
