          <div style={{background:'white',borderRadius:12,overflow:'hidden',border:'1px solid #e0f2fe'}}>
            {SCHED_SLOTS.map(slot=>{
              const day=sd[dk]||{};
              const subKeys=[slot,...Object.keys(day).filter(k=>k.startsWith(slot+'__'))];
              // 廃止した12:30枠の既存予約は「未定」枠（旧12:30の位置）に取り込んで消さない
              if(slot==='未定'){ if(day['12:30'])subKeys.push('12:30'); subKeys.push(...Object.keys(day).filter(k=>k.startsWith('12:30__'))); }
              const dks=subKeys.filter(k=>{const r=day[k];return r&&r.name;});
              const isEmpty=dks.length===0;
              const spc=isSpecialSlot(slot);
              const restricted=isSlotRestricted(slot); // 入庫制限の時間帯（PC版と同じく整備予約のみ制限）
              // 制限中でも「制限解除の作業」の予約が入っている枠は、入庫時間の欄だけ制限色を残して
              // 案件の内容は白背景にする（入庫できる案件だと一目で分かるように・PC版と共通の考え方）
              const exemptInSlot=restricted&&dks.some(k=>restrExemptIds.includes(day[k]&&day[k].work));
              // ★入庫済みチェック。押した直後は手元の保持を優先（古いキャッシュで点滅しないように）
              const _r0=dks[0]&&day[dks[0]];
              const _sk=_r0?dk+'|'+(_r0.name||dks[0]):null;
              const _schedArr=_r0?((arrivedOv&&_sk in arrivedOv)?arrivedOv[_sk]:!!_r0.arrived):false;
              return(
                <div key={slot} style={{display:'flex',borderBottom:'1px solid #f0fdfa',background:restricted?'#fee2e2':isEmpty?(spc?'#fdfaff':'white'):(spc?'#f5f0ff':'#f0fdfa')}}>
                  {/* ★時刻欄をタップすると、その枠の予約に入庫済みチェックが入る */}
                  {/* 押した直後は手元の保持を優先（古いキャッシュで点滅しないように） */}
                  <div onClick={e=>{e.preventDefault();e.stopPropagation();const k=dks[0];const r0=k&&day[k];if(r0&&r0.name&&onToggleArrived)onToggleArrived('sched',dk,k);}}
                    style={{width:44,flexShrink:0,padding:'8px 4px',fontSize:11,fontWeight:700,color:_schedArr?'#dc2626':(spc?(isEmpty?'#7c3aed':'#9333ea'):(isEmpty?'#475569':'#0e7490')),background:_schedArr?'#fde047':undefined,textAlign:'center',borderRight:`2px solid ${spc?(isEmpty?'#f3e8ff':'#d8b4fe'):(isEmpty?'#f0f9ff':'#99f6e4')}`}}>{_schedArr?'✓':slot}</div>
                  <div style={{flex:1,padding:'5px 9px',background:exemptInSlot?'white':undefined}}>
                    {dks.map((key,ki)=>{
                      const r=day[key];
                      const w=WORKS.find(x=>x.id===r.work);
                      const loanerTxt=r.loaner||r.rentalLabel||'';
                      return(
                        <div key={ki} onClick={()=>{if(otherView){alert('🏪 他の店のタイムスケジュールは閲覧のみです。\n直すには上の切り替えで自分の店に戻してください。\n（車検は他の店でも直せます）');return;}onOpenEdit({type:'sched',dk,slot:key,isNew:false});}}
                          style={{marginBottom:4,cursor:otherView?'default':'pointer',opacity:otherView?0.75:1}}>
                          <span style={{fontWeight:800,fontSize:13}}>{r.name}</span>
                          {r.carType&&<span style={{fontSize:11,color:'#64748b',marginLeft:5}}>{r.carType}</span>}
                          {(w||r.workType)&&<span style={{marginLeft:5,padding:'1px 5px',background:'#ccfbf1',color:'#0f766e',borderRadius:6,fontSize:10,fontWeight:700}}>{w?w.name:r.workType}</span>}
                          {loanerTxt&&<span style={{marginLeft:5,fontSize:10,color:'#0284c7'}}>{loanerTxt}</span>}
                          <span style={{fontSize:12,color:'#cbd5e1',marginLeft:4}}>›</span>
                          {r.content&&<div style={{fontSize:11,color:'#64748b',marginTop:1}}>{r.content}</div>}
                        </div>
                      );
                    })}
                    {!otherView&&<div onClick={()=>{
                        if(isHoliday){blockNew();return;}
                        const free=subKeys.find(k=>!day[k]||!day[k].name)||makeSlotKey(slot,subKeys.length);
                        onOpenEdit({type:'sched',dk,slot:free,isNew:true});
                      }}
                      style={{color:restricted?'#dc2626':isHoliday?'#94a3b8':isEmpty?'#475569':'#0e7490',fontSize:11,cursor:'pointer',padding:'2px 0',fontWeight:restricted?700:600}}>
                      {isHoliday?'休業日（追加不可）':restricted?`🚫 入庫制限 ${restrLabels(restr).join('／')}（制限解除の作業のみ）`:isEmpty?'＋ タップで追加':'＋ 同時刻に追加'}
                    </div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
        <div style={{margin:'12px 12px 20px'}}>
          <div style={{fontWeight:900,fontSize:13,color:'#7c3aed',marginBottom:6}}>📝 備考・メモ</div>
          {memos.length===0?<div style={{background:'white',borderRadius:12,padding:12,textAlign:'center',color:'#94a3b8',fontSize:12,border:'1px solid #f1f5f9'}}>なし</div>:
            memos.map((mm,i)=>(
              <div key={i} onClick={()=>{if(!otherView&&onEditMemo)onEditMemo(dk,i);}}
                style={{background:'#faf5ff',borderRadius:10,padding:'8px 11px',marginBottom:4,border:'1px solid #e9d5ff',fontSize:12,color:'#374151',whiteSpace:'pre-wrap',display:'flex',gap:6,alignItems:'flex-start'}}>
                <span style={{flex:1}}>{mm.content||mm.text||''}</span>
                {!otherView&&onEditMemo&&<span style={{fontSize:11,color:'#a78bfa',fontWeight:800,flexShrink:0}}>✎</span>}
              </div>
            ))}
          {/* ★備考・メモの追加／編集（2026-10-03 ユーザー報告。他店を見ている時は閲覧のみ） */}
          {!otherView&&onEditMemo&&(
            <div onClick={()=>onEditMemo(dk,null)}
              style={{marginTop:6,padding:'12px 0',textAlign:'center',borderRadius:12,border:'2px dashed #c4b5fd',background:'#faf5ff',color:'#6d28d9',fontWeight:800,fontSize:13}}>
              ＋ 備考・メモを追加
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

const LOANER_SECTION_COLORS={honten:'#1d4ed8',sanda:'#dc2626',rental:'#7c3aed'};
const LoanerView=({loanerResH,loanerResS,rentalResData,rentalCars,loanerCarsH,loanerCarsS,vsId})=>{
  const today=new Date();
  // ★表示は「月ごと」ではなく起点日からの連続49日（2026-07-30 ユーザー要望）。
  //   既定の起点＝本日の3日前 → 本日が左から4列目に出て、左スワイプ（横スクロール）で
  //   本日から45日先まで一気に確認できる。‹ › で起点を30日ずつ動かせば過去も見られる。
  const LOANER_LEAD_DAYS=3, LOANER_SPAN=49; // 3日前＋本日＋45日先
  const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const [rangeStart,setRangeStart]=useState(()=>{
    const s=dayStart(new Date()); s.setDate(s.getDate()-LOANER_LEAD_DAYS); return s;
  });
  const [selRes,setSelRes]=useState(null); // タップした予約の詳細ポップアップ {r,car,isRental}
  const swipeX=useRef(null);
  const shiftRange=n=>setRangeStart(p=>{const s=new Date(p);s.setDate(s.getDate()+n);return s;});
  const resetRange=()=>{const s=dayStart(new Date());s.setDate(s.getDate()-LOANER_LEAD_DAYS);setRangeStart(s);};
  const dim=LOANER_SPAN;
  const sc=vsId==='honten'?'#1d4ed8':'#dc2626';
  const myLoaners=vsId==='honten'?loanerCarsH:loanerCarsS;
  const myLoanerRes=vsId==='honten'?loanerResH:loanerResS;
  const rentals=Array.isArray(rentalCars)&&rentalCars.length>0?rentalCars:DEFAULT_RENTAL_CARS;
  const rentalRes=rentalResData||{};
  const toNumL=(y,m,d)=>y*10000+m*100+d;
  // 起点日から連続 LOANER_SPAN 日ぶん（月をまたぐ）
  const dates=useMemo(()=>Array.from({length:LOANER_SPAN},(_,i)=>{
    const dt=new Date(rangeStart.getFullYear(),rangeStart.getMonth(),rangeStart.getDate()+i);
    const y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate();
    return{y,m,d,dow:dt.getDay(),num:toNumL(y,m,d),isMonthStart:d===1||i===0};
  }),[rangeStart]);
  const firstD=dates[0],lastD=dates[dates.length-1];
  // lres/rres は {carId: {key: 予約}} のオブジェクト構造（配列ではない）
  const getRes=(res,cid,num)=>Object.values(res[cid]||{}).find(r=>{
    const s=toNumL(r.fy,r.fm,r.fd);
    const e=toNumL(r.ty,r.tm,r.td);
    return num>=s&&num<=e;
  });
  // ★同じ車が同じ日に2件以上入っている分を数える。帯は1台1日1件しか描けないので、
  //   2件目以降は画面から消えて気づけない（2026-08-28にユーザーが報告：8/29のｆｆｄｂｚ）。
  const getResAll=(res,cid,num)=>Object.values(res[cid]||{}).filter(r=>r&&num>=toNumL(r.fy,r.fm,r.fd)&&num<=toNumL(r.ty,r.tm,r.td));
  const dupWarn=useMemo(()=>{
    const out=[];
    [[myLoaners,myLoanerRes],[rentals,rentalRes]].forEach(([cars,res])=>{
      (cars||[]).forEach(car=>{
        (dates||[]).forEach(({m,d,num})=>{
          const rs=getResAll(res||{},car.id,num);
          if(rs.length>1)out.push(`${m+1}/${d} ${car.name}${car.num?` (${car.num})`:''}：${rs.map(r=>r.user||'(名前なし)').join(' ／ ')}`);
        });
      });
    });
    return out;
  },[myLoaners,myLoanerRes,rentals,rentalRes,dates]);
  const LCAR_COLORS=['#fca5a5','#86efac','#93c5fd','#fde68a','#c4b5fd','#f9a8d4','#6ee7b7','#fbbf24'];
  const RCAR_COLORS=['#d8b4fe','#a5b4fc','#6ee7b7','#fde68a','#fca5a5','#93c5fd'];
  const renderGrid=(cars,res,sectionColor,label)=>(
    <div style={{marginBottom:0}}>
      <div style={{background:sectionColor,padding:'5px 10px',display:'flex',alignItems:'center',gap:6}}>
        <span style={{color:'white',fontWeight:800,fontSize:11}}>{label}</span>
        <span style={{color:'rgba(255,255,255,.7)',fontSize:10}}>{cars.length}台</span>
      </div>
      {cars.map((car,ci)=>(
        <div key={car.id} style={{display:'flex',borderBottom:'1px solid #f1f5f9'}}>
          <div style={{width:80,minWidth:80,padding:'6px 7px',background:'#f8fafc',borderRight:'2px solid #e5e7eb',display:'flex',flexDirection:'column',justifyContent:'center',position:'sticky',left:0,zIndex:2}}>
            <div style={{fontWeight:700,fontSize:10,color:'#1e293b',lineHeight:1.3}}>{car.name}</div>
            <div style={{fontSize:10,color:'#111827',fontWeight:800}}>{car.num}</div>
          </div>
          {dates.map(({y,m,d,num},di)=>{
            const r=getRes(res,car.id,num);
            const colors=label.includes('レンタカー')?RCAR_COLORS:LCAR_COLORS;
            const color=r?colors[ci%colors.length]:'white';
            const isTd=y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();
            // 帯の先頭＝貸出日そのもの、または表示範囲の左端で貸出中のとき
            const isStart=!!r&&((r.fy===y&&r.fm===m&&r.fd===d)||di===0);
            // 貸出日数分のセルを1枠として名前を横に広げる（表示範囲内の長さ。入りきらなければ尻切れ）。
            const endIdx=r?dates.findIndex(x=>x.num>toNumL(r.ty,r.tm,r.td)):-1;
            const nameSpan=isStart&&r?Math.max(1,(endIdx<0?dates.length:endIdx)-di):1;
            return(
              <div key={di} onClick={()=>r&&setSelRes({r,car,isRental:label.includes('レンタカー')})} style={{width:32,minWidth:32,height:36,background:color,borderRight:'1px solid #f1f5f9',borderLeft:isTd?`2px solid ${sc}`:'none',position:'relative',overflow:isStart&&r?'visible':'hidden',cursor:r?'pointer':'default'}}>
                {isStart&&r&&(
                  // 帯の日数分に広げ、2行まで使う。法人格を落として固有名だけ出す。入りきらなければ尻切れ。
                  <div style={{position:'absolute',left:1,top:'50%',transform:'translateY(-50%)',width:nameSpan*32-2,fontSize:8,fontWeight:800,color:'white',textShadow:'0 1px 2px rgba(0,0,0,.85)',lineHeight:1.1,display:'-webkit-box',WebkitBoxOrient:'vertical',WebkitLineClamp:2,overflow:'hidden',wordBreak:'break-all',zIndex:3,pointerEvents:'none'}}>
                    {shortenCorpName(r.user)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{flexShrink:0,background:'white',borderBottom:'1px solid #f1f5f9',borderTop:'3px solid #7c3aed',padding:'10px 14px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button onClick={()=>shiftRange(-30)} style={{width:34,height:34,borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>&#8249;</button>
          <div style={{flex:1,textAlign:'center'}}>
            <div style={{fontWeight:900,fontSize:15}}>{firstD.m+1}/{firstD.d} 〜 {lastD.m+1}/{lastD.d}</div>
            <div style={{fontSize:9,color:'#94a3b8'}}>← 左スワイプで45日先まで / ‹ › は30日移動</div>
          </div>
          <button onClick={()=>shiftRange(30)} style={{width:34,height:34,borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>&#8250;</button>
          <button onClick={resetRange} style={{height:34,padding:'0 10px',borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontSize:11,fontWeight:800,color:'#374151'}}>今日</button>
        </div>
      </div>
      <div style={{flex:1,overflow:'auto',WebkitOverflowScrolling:'touch'}}>
        <div style={{minWidth:`${82+dim*32}px`}}>
          <div style={{display:'flex',position:'sticky',top:0,zIndex:10,background:'white',borderBottom:'2px solid #e5e7eb'}}>
            <div style={{width:80,minWidth:80,padding:'6px 7px',fontWeight:700,fontSize:9,color:'#64748b',background:'#f8fafc',borderRight:'2px solid #e5e7eb',position:'sticky',left:0,zIndex:3}}>代車 / レンタ</div>
            {dates.map(({y,m,d,dow,isMonthStart},di)=>{
              const isTd=y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();
              const isHol=isHoliday(y,m,d);
              return(
                <div key={di} style={{width:32,minWidth:32,textAlign:'center',padding:'3px 1px',background:isTd?'#dbeafe':'white',borderRight:'1px solid #f1f5f9',borderLeft:isMonthStart&&di>0?'2px solid #c7d2fe':'none'}}>
                  {isMonthStart&&<div style={{fontSize:7,fontWeight:800,color:'#7c3aed',lineHeight:1}}>{m+1}月</div>}
                  <div style={{fontSize:8,color:isTd?'#1e40af':dow===0||isHol?'#ef4444':dow===6?'#3b82f6':'#94a3b8',fontWeight:600}}>{DOW[dow]}</div>
                  <div style={{fontSize:11,fontWeight:isTd?800:500,color:isTd?'#1e40af':dow===0||isHol?'#ef4444':dow===6?'#3b82f6':'#1e293b'}}>{d}</div>
                </div>
              );
            })}
          </div>
          {dupWarn.length>0&&(
            <div style={{margin:'6px 8px',padding:'7px 9px',borderRadius:8,background:'#fef2f2',
              border:'1px solid #fecaca',color:'#991b1b',fontSize:10,fontWeight:700,lineHeight:1.5}}>
              <div>⚠ 同じ車が同じ日に2件以上入っています（帯には1件しか出ません）</div>
              {dupWarn.slice(0,5).map((w,i)=><div key={i} style={{fontWeight:600}}>・{w}</div>)}
              {dupWarn.length>5&&<div style={{fontWeight:600}}>ほか {dupWarn.length-5} 件</div>}
            </div>
          )}
          {renderGrid(myLoaners,myLoanerRes,vsId==='honten'?'#1d4ed8':'#dc2626',vsId==='honten'?'本店 代車':'三田店 代車')}
          <div style={{height:3,background:'#e5e7eb'}}/>
          {renderGrid(rentals,rentalRes,'#7c3aed','レンタカー（共通）')}
        </div>
        <div style={{padding:'10px 12px 20px',display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',minWidth:`${82+dim*32}px`}}>
          <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10}}><span style={{width:12,height:12,background:'#fca5a5',borderRadius:2,display:'inline-block'}}/>使用中</span>
          <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10}}><span style={{width:12,height:12,background:'white',border:'1px solid #e2e8f0',borderRadius:2,display:'inline-block'}}/>空き</span>
          <span style={{fontSize:10,color:'#94a3b8'}}>帯をタップで詳細（貸出〜返却）</span>
        </div>
      </div>
      {selRes&&(()=>{
        const {r,car,isRental}=selRes;
        const fmt=(y,m,d)=>`${m+1}/${d}（${DOW[new Date(y,m,d).getDay()]}）`;
        const days=Math.round((Date.UTC(r.ty,r.tm,r.td)-Date.UTC(r.fy,r.fm,r.fd))/86400000)+1;
        return(
          <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:250,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={()=>setSelRes(null)}>
            <div onClick={e=>e.stopPropagation()}
              onTouchStart={e=>{swipeX.current=e.touches[0].clientX;}}
              onTouchEnd={e=>{if(swipeX.current==null)return;const dx=e.changedTouches[0].clientX-swipeX.current;swipeX.current=null;if(dx>40)shiftRange(-30);else if(dx<-40)shiftRange(30);}}
              style={{background:'white',borderRadius:'20px 20px 0 0',padding:'16px 18px calc(18px + env(safe-area-inset-bottom,0px))',boxShadow:'0 -8px 40px rgba(0,0,0,.25)',animation:'sheetUp .2s ease'}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                <span style={{fontSize:10,fontWeight:800,color:'white',background:isRental?'#7c3aed':sc,borderRadius:20,padding:'2px 10px',whiteSpace:'nowrap'}}>{isRental?'レンタカー':'代車'}</span>
                <span style={{fontWeight:900,fontSize:16,flex:1,lineHeight:1.3}}>{r.user||'（名前なし）'}</span>
                <button onClick={()=>setSelRes(null)} style={{width:32,height:32,borderRadius:'50%',background:'#f1f5f9',border:'none',fontSize:16,color:'#64748b',flexShrink:0}}>✕</button>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:8,fontSize:13}}>
                <div style={{display:'flex',gap:8}}><span style={{color:'#94a3b8',width:52,flexShrink:0}}>車両</span><span style={{fontWeight:700}}>{car?.name}{car?.num?` (${car.num})`:''}</span></div>
                <div style={{display:'flex',gap:8}}><span style={{color:'#94a3b8',width:52,flexShrink:0}}>貸出</span><span style={{fontWeight:800,color:'#0369a1'}}>{fmt(r.fy,r.fm,r.fd)}</span></div>
                <div style={{display:'flex',gap:8}}><span style={{color:'#94a3b8',width:52,flexShrink:0}}>返却</span><span style={{fontWeight:800,color:'#047857'}}>{fmt(r.ty,r.tm,r.td)}</span></div>
                <div style={{display:'flex',gap:8}}><span style={{color:'#94a3b8',width:52,flexShrink:0}}>期間</span><span style={{fontWeight:700}}>{days}日間{(r.fm!==r.tm||r.fy!==r.ty)&&<span style={{marginLeft:6,fontSize:11,color:'#c2410c',fontWeight:800}}>月をまたぐ貸出</span>}</span></div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8,marginTop:16}}>
                <button onClick={()=>shiftRange(-30)} style={{flex:1,padding:'10px 0',borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontWeight:800,fontSize:12,color:'#374151'}}>‹ 30日前へ</button>
                <span style={{fontWeight:900,fontSize:12,minWidth:86,textAlign:'center'}}>{firstD.m+1}/{firstD.d}〜{lastD.m+1}/{lastD.d}</span>
                <button onClick={()=>shiftRange(30)} style={{flex:1,padding:'10px 0',borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontWeight:800,fontSize:12,color:'#374151'}}>30日先へ ›</button>
              </div>
              <div style={{textAlign:'center',fontSize:10,color:'#94a3b8',marginTop:6}}>← 横スワイプでも期間移動（過去の帯が確認できます）</div>
            </div>
          </div>
        );
      })()}
    </div>
  );
};

// ── 通知メール設定 ──
// 保存失敗時の通知メール送信先（ログイン中スタッフごとに1件、通知専用・個人アドレス可）。
// 登録先は共有キー ${STOR}notify-emails の {スタッフ名: アドレス} マップ。
// ============================================
//  マイスケジュール（2026-09-30 作り直し）— PC と mobile で同じコードを置く
//   ヒントと答え（暗号のシークレット）はやめた。予定は2種類だけ：
//   ・共有スケジュール：kv の ${STOR}mysched = { id:{dk,time,title,memo,owner(氏名),uid(スタッフuid),at} }
//       全員が読める。直せる・消せるのは本人だけ。
//   ・マイスケジュール：kv の ${STOR}myprv-{スタッフuid} = { id:{dk,time,title,memo,at} }
//       その人だけのもの。**自分専用の端末でしか読み書きしない**。
//   ・端末の種類は登録の時に決めた ${STOR}auth-kind（'own'＝自分専用／'shared'＝店の共有）。
//       共有の端末では myprv を **購読も読み込みもしない**ので、画面に出ないだけでなく端末に降りてこない。
//       自分専用の端末では「すべて表示／共有スケジュール／マイスケジュール」で見え方を切り替えられる。
//   ★暗号はかけていない。Firestore を直接見られる人（管理者・運営）には中身が読める。
//     「自分のPCを覗かれることはほとんどない」という前提で、簡単さを取った（2026-09-30 ユーザー判断）。
//     人に知られて困ることは書かない運用。
//   ・以前の暗号書庫（${STOR}mysec-{uid}）は使わない。2026-09-30 に「持ってくる」案内もやめた
//     （残っている書庫は読む手立てが無いので、Firestore に残っていても中身は開けない）。
// ============================================
// この端末は「自分専用」か（登録の時に決めたもの）。共有の端末ではマイスケジュールを扱わない。
const HUB_OWN_DEVICE=()=>{try{return localStorage.getItem(STOR+'auth-kind')==='own';}catch(e){return false;}};
// 予定の入れ物の購読（PC・mobile 共通）。暗号はもう使っていない。
const HubKvSub={
  // Firestore の onSnapshot。手元キャッシュ由来の値は使わない
  subscribe:(k,cb)=>{
    if(typeof FB_ON==='undefined'||!FB_ON)return ()=>{};
    let un=null,dead=false;
    const start=()=>{ if(dead||un)return; try{ un=fbDoc(k).onSnapshot({includeMetadataChanges:false},snap=>{ if(snap.metadata&&snap.metadata.fromCache&&!snap.exists)return; try{cb(fbParse(snap));}catch(e){} },err=>{ console.warn('[予定] 購読に失敗',k,err&&err.message); }); }catch(e){} };
    if(typeof fbAuth!=='undefined'&&fbAuth)fbWhenUser(start); else start();
    return ()=>{dead=true;try{un&&un();}catch(e){}};
  },
};
// 予定の並び（時刻→作成順）
// 予定の並び（終日を一番上に、あとは開始時刻→作った順）
const hubSchedKey=x=>(x&&x.allday)?'':((x&&x.time)||'99:99');
const hubSchedSort=(a,b)=>(hubSchedKey(a)<hubSchedKey(b)?-1:hubSchedKey(a)>hubSchedKey(b)?1:(a.at||0)-(b.at||0));
// 予定の時間の書き方：終日／10:00〜11:30／10:00／—
const hubSchedTime=x=>(x&&x.allday)?'終日':(x&&x.time?(x.end?(x.time+'〜'+x.end):x.time):'—');
// 色（2026-10-01 ユーザー決定・B案）：共有＝水色／マイ＝ピンク／他の人の共有＝灰色
const MS_COL={
  priv:{bg:'#fce7f3',bd:'#f472b6',lf:'#be185d',tx:'#9d174d',chipBg:'#db2777',chipTx:'#ffffff'},
  mine:{bg:'#cffafe',bd:'#22d3ee',lf:'#0e7490',tx:'#155e75',chipBg:'#0891b2',chipTx:'#ffffff'},
  other:{bg:'#ffffff',bd:'#e5e7eb',lf:'#9ca3af',tx:'#6b7280',chipBg:'#f3f4f6',chipTx:'#6b7280'},
};
const msCol=(isPriv,isMine)=>isPriv?MS_COL.priv:isMine?MS_COL.mine:MS_COL.other;
const hubSchedId=()=>'ms'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ── マイスケジュールのフック（2026-09-30）。sGet/saveKv は各画面のデータ層。
//   ★自分専用の端末でなければ key を作らない＝読み込みも購読もしない（共有PCには降りてこない）。
function useHubPrivate(staffUid,sGetFn,saveKv){
  const own=HUB_OWN_DEVICE();
  const key=(own&&staffUid)?STOR+'myprv-'+staffUid:null;
  const [items,setItems]=useState({});
  const [busy,setBusy]=useState(false);
  useEffect(()=>{
    setItems({});
    if(!key)return;
    let alive=true,got=false;
    sGetFn(key).then(v=>{if(alive&&!got&&v&&typeof v==='object')setItems(v);}).catch(()=>{});
    const un=HubKvSub.subscribe(key,v=>{if(!alive)return;got=true;setItems(v&&typeof v==='object'?v:{});});
    return()=>{alive=false;un();};
  },[key]);
  const save=async next=>{
    if(!key)return false;
    setBusy(true);
    try{const ok=await saveKv(key,()=>next);if(ok===false)return false;setItems(next);return true;}
    finally{setBusy(false);}
  };
  return {enabled:!!key,items,busy,save};
}

// ── 公開予定（mysched）の読み：サーバー値をそのまま使う小さなフック（PC 用）──
//   useShared は {車:{日:予約}} 向けの「手元の新しい行を残す」マージをするため、{id:予定} の形だと
//   消した予定が手元から復活する（削除できない・公開⇄🔒の切替で2つになる：2026-09-20 の不具合）。
//   予定の書き込みは writeVerified（トランザクション）で、購読がその結果を運ぶので手元マージは要らない。
function useHubKv(key,sGetFn){
  const [val,setVal]=useState({});
  useEffect(()=>{
    if(!key)return;
    let alive=true,got=false;
    sGetFn(key).then(v=>{ if(alive&&!got&&v&&typeof v==='object')setVal(v); }).catch(()=>{});
    const un=HubKvSub.subscribe(key,v=>{ if(!alive)return; got=true; setVal(v&&typeof v==='object'?v:{}); });
    return ()=>{alive=false;un();};
  },[key]);
  return val;
}

// ── 1日分の予定パネル（共有＋マイ、追加・編集）。PC のモーダルと mobile の日詳細で共用 ──
//   view: 'all' | 'pub' | 'priv'（自分専用の端末だけ切り替えられる。共有端末では常に 'pub' 相当）
const MySchedPanel=({dk,user,pub,savePub,priv,compact,onClose,view})=>{
  const canPriv=!!(priv&&priv.enabled);
  const vw=canPriv?(view||'all'):'pub';
  const [form,setForm]=useState(null);           // {id?, title, time, memo, priv}
  const [msg,setMsg]=useState('');
  const [saving,setSaving]=useState(false);
  useEffect(()=>{setForm(null);setMsg('');},[dk]);
  const pubList=(vw==='priv')?[]:Object.entries(pub||{}).filter(([,v])=>v&&v.dk===dk).map(([id,v])=>({...v,id})).sort(hubSchedSort);
  const prvList=(!canPriv||vw==='pub')?[]:Object.entries(priv.items||{}).filter(([,v])=>v&&v.dk===dk).map(([id,v])=>({...v,id,priv:true})).sort(hubSchedSort);
  const mine=v=>v.uid===user.uid;
  const p=dk.split('-');
  const label=`${p[1]}/${p[2]}（${['日','月','火','水','木','金','土'][new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getDay()]}）`;
  const fs2=compact?12:13;
  const submit=async()=>{
    if(!form)return;
    const title=String(form.title||'').trim().slice(0,40);
    if(!title){setMsg('件名を入れてください');return;}
    // 終日のときは時刻を持たない。終わりだけ入れて始まりが空、は無しにする
    const allday=!!form.allday;
    const st=allday?'':(form.time||'');
    const en=(allday||!st)?'':(form.end||'');
    if(!allday&&st&&en&&en<st){setMsg('終わりの時刻が始まりより前です');return;}
    const rec={dk,time:st,end:en,allday,title,memo:String(form.memo||'').trim().slice(0,200)};
    setSaving(true);setMsg('');
    try{
      if(form.priv&&canPriv){
        const next={...priv.items};
        const id=form.id&&next[form.id]?form.id:hubSchedId();
        next[id]={...(next[id]||{}),...rec,at:(next[id]&&next[id].at)||Date.now()};
        if(form.id&&form.wasPublic){ await savePub(b=>{const n={...(b||{})};delete n[form.id];return n;}); }   // 共有→マイ に変えた
        if(!(await priv.save(next))){setMsg('保存できませんでした。もう一度お試しください');return;}
      }else{
        const id=form.id&&!form.wasPriv?form.id:hubSchedId();
        const ok=await savePub(b=>{const n={...(b||{})};const old=n[id];if(old&&old.uid&&old.uid!==user.uid)return undefined;n[id]={...(old||{}),...rec,owner:user.name,uid:user.uid,at:(old&&old.at)||Date.now()};return n;});
        if(ok===false){setMsg('保存できませんでした。もう一度お試しください');return;}
        if(form.id&&form.wasPriv&&canPriv){ const next={...priv.items};delete next[form.id];await priv.save(next); }   // マイ→共有 に変えた
      }
      setForm(null);
    }finally{setSaving(false);}
  };
  const remove=async it=>{
    if(!confirm(`「${it.title}」を削除しますか？`))return;
    setSaving(true);
    try{
      if(it.priv){if(!canPriv)return;const next={...priv.items};delete next[it.id];await priv.save(next);}
      else await savePub(b=>{const n={...(b||{})};if(!n[it.id]||(n[it.id].uid&&n[it.id].uid!==user.uid))return undefined;delete n[it.id];return n;});
      setForm(null);
    }finally{setSaving(false);}
  };
  const Item=({it})=>{
    const c=msCol(!!it.priv,mine(it));
    return(
    <div style={{display:'flex',alignItems:'flex-start',gap:7,padding:compact?'7px 9px':'8px 11px',marginBottom:4,borderRadius:9,
      background:c.bg,border:`1.5px solid ${c.bd}`,borderLeft:`4px solid ${c.lf}`}}>
      <span style={{fontSize:11,fontWeight:800,color:c.tx,width:76,flexShrink:0,marginTop:1,lineHeight:1.35}}>
        {it.allday
          ?<span style={{display:'inline-block',borderRadius:4,padding:'0 5px',lineHeight:'16px',background:c.chipBg,color:c.chipTx,fontSize:10,fontWeight:800}}>終日</span>
          :<>{it.time||'—'}{it.end&&<><br/>〜{it.end}</>}</>}
      </span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:800,fontSize:fs2,display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
          <span style={{wordBreak:'break-all'}}>{it.title}</span>
          <span style={{fontSize:10,fontWeight:700,color:c.chipTx,background:c.chipBg,borderRadius:10,padding:'1px 7px'}}>{it.priv?'🙋 マイ':mine(it)?'自分':it.owner}</span>
        </div>
        {it.memo&&<div style={{fontSize:11,color:'#4b5563',marginTop:2,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>{it.memo}</div>}
      </div>
      {(it.priv||mine(it))&&(
        <button onClick={()=>{setForm({id:it.id,title:it.title,time:it.time||'',end:it.end||'',allday:!!it.allday,memo:it.memo||'',priv:!!it.priv,wasPriv:!!it.priv,wasPublic:!it.priv});setMsg('');}}
          style={{flexShrink:0,padding:'3px 8px',borderRadius:6,border:'1px solid #d1d5db',background:'white',fontSize:11,cursor:'pointer',color:'#374151'}}>編集</button>
      )}
    </div>
    );
  };
  // ★文字は16px以上にする（2026-10-02）。iPhone は16px未満の入力欄を触ると画面を自動で拡大し、
  //   そのまま戻らないため「切り替えたら勝手に拡大されている」ように見えていた。
  const inputS={width:'100%',padding:compact?'8px 10px':'8px 11px',border:'1.5px solid #d1d5db',borderRadius:8,fontSize:16,boxSizing:'border-box',background:'white'};
  return(
    <div>
      {!compact&&(
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div style={{fontWeight:900,fontSize:16}}>📝 {label} の予定</div>
          {onClose&&<button onClick={onClose} style={{background:'#f3f4f6',border:'none',borderRadius:'50%',width:30,height:30,cursor:'pointer',fontSize:14}}>✕</button>}
        </div>
      )}
      {pubList.length===0&&prvList.length===0&&!form&&<div style={{fontSize:12,color:'#9ca3af',padding:'4px 0 8px'}}>この日の予定はありません</div>}
      {pubList.map(it=><Item key={it.id} it={it}/>)}
      {prvList.map(it=><Item key={it.id} it={it}/>)}
      {form?(
        <div style={{marginTop:8,padding:'10px 12px',background:'#f8fafc',border:'1.5px solid #cbd5e1',borderRadius:10}}>
          <div style={{fontWeight:800,fontSize:12,color:'#334155',marginBottom:6}}>{form.id?'予定を編集':'予定を追加'}</div>
          <input style={{...inputS,marginBottom:6}} placeholder="件名（例：○○社と打合せ）" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} maxLength={40} autoFocus/>
          {/* ★時間：開始〜終了。終わりは空でもよい。「終日にする」を押すと時刻の欄は隠れる（2026-10-01） */}
          <div style={{display:'flex',gap:6,marginBottom:6,alignItems:'center',flexWrap:'wrap'}}>
            <button onClick={()=>setForm({...form,allday:!form.allday})}
              style={{padding:'8px 12px',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',
                border:`2px solid ${form.allday?'#475569':'#e5e7eb'}`,background:form.allday?'#f1f5f9':'white',color:form.allday?'#0f172a':'#6b7280'}}>終日にする</button>
            {form.allday
              ?<span style={{fontSize:12,fontWeight:700,color:'#0f172a'}}>終日</span>
              :<>
                <input type="time" style={{...inputS,width:'auto',flex:'0 0 auto'}} value={form.time||''} onChange={e=>setForm({...form,time:e.target.value})}/>
                <span style={{fontSize:13,color:'#64748b',fontWeight:700}}>〜</span>
                <input type="time" style={{...inputS,width:'auto',flex:'0 0 auto'}} value={form.end||''} onChange={e=>setForm({...form,end:e.target.value})}/>
                {(form.time||form.end)&&<button onClick={()=>setForm({...form,time:'',end:''})} style={{padding:'0 10px',borderRadius:8,border:'1px solid #d1d5db',background:'white',fontSize:11,cursor:'pointer'}}>時刻なし</button>}
                <span style={{fontSize:11,color:'#94a3b8'}}>終わりは空でもOK</span>
              </>}
          </div>
          <textarea style={{...inputS,minHeight:52,marginBottom:6,resize:'vertical'}} placeholder="メモ（任意）" value={form.memo} onChange={e=>setForm({...form,memo:e.target.value})} maxLength={200}/>
          {/* ★どちらに入れるか。自分専用の端末でだけ選べる（共有の端末では共有スケジュールだけ） */}
          {canPriv?(
            <div style={{display:'flex',gap:6,marginBottom:8}}>
              {[['pub','👥 共有スケジュール','他のスタッフにも見えます'],['priv','🙋 マイスケジュール','自分の端末だけ']].map(([k,l,sub])=>{
                const on=(k==='priv')===!!form.priv;
                return(
                  <button key={k} onClick={()=>setForm({...form,priv:k==='priv'})}
                    style={{flex:1,padding:'8px 6px',borderRadius:8,border:`2px solid ${on?(k==='priv'?MS_COL.priv.lf:MS_COL.mine.lf):'#e5e7eb'}`,background:on?(k==='priv'?MS_COL.priv.bg:MS_COL.mine.bg):'white',color:on?(k==='priv'?MS_COL.priv.tx:MS_COL.mine.tx):'#6b7280',fontWeight:on?800:600,fontSize:12,cursor:'pointer'}}>
                    {l}<div style={{fontSize:9.5,fontWeight:400,opacity:.8}}>{sub}</div>
                  </button>
                );
              })}
            </div>
          ):(
            <div style={{marginBottom:8,fontSize:11,color:'#6b7280',background:'#f3f4f6',border:'1px solid #e5e7eb',borderRadius:8,padding:'7px 9px',lineHeight:1.6}}>
              この端末は<b>店の共有</b>として登録されています。予定は<b>共有スケジュール</b>として追加されます。<br/>
              マイスケジュールは自分専用の端末でだけ使えます。
            </div>
          )}
          {msg&&<div style={{fontSize:11,color:'#b91c1c',fontWeight:700,marginBottom:6}}>{msg}</div>}
          <div style={{display:'flex',gap:6}}>
            <button disabled={saving} onClick={submit} style={{flex:1,padding:'9px 0',borderRadius:8,border:'none',background:form.priv?MS_COL.priv.chipBg:MS_COL.mine.chipBg,color:'white',fontWeight:800,fontSize:13,cursor:'pointer'}}>{saving?'保存中…':form.id?'保存':'追加'}</button>
            {form.id&&<button disabled={saving} onClick={()=>remove({id:form.id,title:form.title,priv:form.wasPriv})} style={{padding:'9px 12px',borderRadius:8,border:'1px solid #fca5a5',background:'#fef2f2',color:'#b91c1c',fontWeight:700,fontSize:12,cursor:'pointer'}}>削除</button>}
            <button disabled={saving} onClick={()=>{setForm(null);setMsg('');}} style={{padding:'9px 12px',borderRadius:8,border:'1px solid #d1d5db',background:'white',fontSize:12,cursor:'pointer'}}>やめる</button>
          </div>
        </div>
      ):(
        <button onClick={()=>{setForm({title:'',time:'',end:'',allday:false,memo:'',priv:canPriv&&vw==='priv'});setMsg('');}}
          style={{marginTop:6,width:'100%',padding:compact?'8px 0':'9px 0',borderRadius:9,border:`1.5px dashed ${MS_COL.mine.bd}`,background:MS_COL.mine.bg,color:MS_COL.mine.tx,fontWeight:800,fontSize:compact?11.5:12,cursor:'pointer'}}>＋ 予定を追加</button>
      )}
    </div>
  );
};

// ── PC：月のカレンダー（予定ビュー）──
const MySchedCalendar=({cy,cm,user,pub,priv,isClosedDay,onPickDay,storeLabelOf,view})=>{
  const canPriv=!!(priv&&priv.enabled);
  const vw=canPriv?(view||'all'):'pub';
  const today=new Date();
  const dim=new Date(cy,cm+1,0).getDate();
  const first=new Date(cy,cm,1).getDay();
  const byDay={};
  const add=(it)=>{const p=String(it.dk||'').split('-').map(Number);if(p[0]!==cy||p[1]!==cm+1)return;(byDay[p[2]]=byDay[p[2]]||[]).push(it);};
  if(vw!=='priv')Object.entries(pub||{}).forEach(([id,v])=>{if(v&&v.dk)add({...v,id});});
  if(canPriv&&vw!=='pub')Object.entries(priv.items||{}).forEach(([id,v])=>{if(v&&v.dk)add({...v,id,priv:true});});
  const weeks=[];let wk=Array(7).fill(null);
  for(let d=1;d<=dim;d++){const dow=(first+d-1)%7;wk[dow]=d;if(dow===6||d===dim){weeks.push([...wk]);wk=Array(7).fill(null);}}
  const DOWS=['日','月','火','水','木','金','土'];
  return(
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,overflow:'hidden',margin:'0 18px 18px',border:'2px solid #e5e7eb',borderRadius:9}}>
      <div style={{overflowY:'auto',flex:1}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'linear-gradient(90deg,#eff6ff,#f5f3ff)',borderBottom:'2px solid #c7d2fe'}}>
          {DOWS.map((d,i)=><div key={i} style={{padding:'8px 0',textAlign:'center',fontWeight:700,fontSize:13,color:i===0?'#dc2626':i===6?'#1d4ed8':'#374151'}}>{d}</div>)}
        </div>
        {weeks.map((week,wi)=>(
          <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
            {week.map((day,di)=>{
              if(!day)return <div key={di} style={{minHeight:110,borderTop:'1px solid #e5e7eb',borderLeft:di>0?'1px solid #e5e7eb':'none',background:'#f9fafb'}}/>;
              const dkk=`${cy}-${cm+1}-${day}`;
              const isToday=day===today.getDate()&&cm===today.getMonth()&&cy===today.getFullYear();
              const isCl=isClosedDay?isClosedDay(cy,cm,day):false;
              const list=(byDay[day]||[]).sort(hubSchedSort);
              const dow=new Date(cy,cm,day).getDay();
              return(
                <div key={di} onClick={()=>onPickDay(dkk)}
                  style={{minHeight:110,padding:'5px 4px',borderTop:'1px solid #e5e7eb',borderLeft:di>0?'1px solid #e5e7eb':'none',background:isCl?(typeof CLOSED_BG!=='undefined'?CLOSED_BG:'#f3f4f6'):'white',cursor:'pointer',position:'relative'}}
                  onMouseEnter={e=>{e.currentTarget.style.background=isCl?'#e5e7eb':'#f8fafc';}} onMouseLeave={e=>{e.currentTarget.style.background=isCl?(typeof CLOSED_BG!=='undefined'?CLOSED_BG:'#f3f4f6'):'white';}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:3}}>
                    <span style={isToday?{background:'#2563eb',color:'white',borderRadius:'50%',width:21,height:21,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800}:{fontWeight:800,fontSize:14,color:dow===0?'#dc2626':dow===6?'#1d4ed8':'#111'}}>{day}</span>
                    {isCl&&<span style={{fontSize:11,color:'#9ca3af',fontWeight:800}}>休業日</span>}
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    {list.slice(0,4).map(it=>{
                      const mine=it.priv||it.uid===user.uid;
                      const c=msCol(!!it.priv,mine);
                      const tl=hubSchedTime(it);
                      return(
                        <div key={it.id} title={`${tl!=='—'?tl+' ':''}${it.title}${it.priv?'（マイスケジュール）':'（'+(it.owner||'')+'）'}${it.memo?'\n'+it.memo:''}`}
                          style={{fontSize:10.5,padding:'2px 5px',borderRadius:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                            background:it.priv?c.bg:mine?c.bg:'#f3f4f6',border:`1px solid ${c.bd}`,color:it.priv||mine?c.tx:'#374151',fontWeight:mine?700:500}}>
                          {it.priv?'🙋':''}{tl!=='—'&&<span style={{fontWeight:800,marginRight:3}}>{it.allday?'終日':it.time}</span>}{it.title}{!it.priv&&!mine&&<span style={{color:'#9ca3af',marginLeft:3}}>{String(it.owner||'').slice(0,2)}</span>}
                        </div>
                      );
                    })}
                    {list.length>4&&<div style={{fontSize:10,color:'#6b7280'}}>＋{list.length-4}件</div>}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
};
// ============================================
//  休日タブ（2026-09-19・アイデア仕様書②）
//   PC版「🏖 スタッフ休日・有給カレンダー」のスマホ版。同じキー（dayoff / pleave）を読み書きする。
//   ・月のカレンダー：自分の休日／有給に色が付き、各日に「出勤 N人」を出す（店休日は全員休み）
//   ・日をタップ → その日の休みの人と出勤人数を下に出し、そこで自分の休日／有給を入れる・外す
//   ・店舗の切り替えで、もう一方の店の休日状況も見られる（入力は自分の店だけ）
//   ・管理者（PC版と同じ4人）は「設定する人」を選んで他の人の分も入れられる
// ============================================
// ── 休日の翌月繰り越し（2026-09-20 ユーザー決定・イ案）──
//   会社の月間休日数（mholidays）より少なく取った分は翌月の枠に足す。
//   ★多く取った分は翌月から引かず「有給」扱い（2026-09-21 ユーザー決定）：枠を使い切った後に休日を入れると自動で有給になる。
//   その月の枠 = 会社の休日数 + 前月までの繰越、残り = 枠 − 取得（店休日を含む休日。有給は数えない）。
//   ★A案（2026-09-21 ユーザー決定）：繰り越した日数は翌月の一番早い休日から順に「○月繰り越し分」として充てる（carried）。
//     画面は「枠」を見せず、集計に「うち店休日N＋繰り越し休日M」、右のバッジは翌月へ回る分だけ「繰り越しN日」と出す。
//   数字の無い月で繰越は途切れる（連続して設定した月の間だけ流れる）。
//   PC のスタッフ休日カレンダー・閲覧カレンダー・スマホの休日タブで同じ計算を使う。
const calcHolidayCarry=(name,cy,cm,dayOff,isClosed,mhol)=>{
  const num=k=>{const v=(mhol||{})[k];return (v==null||v===''||isNaN(Number(v)))?null:Number(v);};
  const months=Object.keys(mhol||{}).map(k=>{const p=k.split('-').map(Number);return (p.length===2&&p[0]>2000&&p[1]>=1&&p[1]<=12&&num(k)!=null)?{y:p[0],m:p[1]-1}:null;}).filter(Boolean).sort((a,b)=>a.y-b.y||a.m-b.m);
  if(!months.length)return null;
  const taken=(y,m)=>{const dim=new Date(y,m+1,0).getDate();let o=0;for(let d=1;d<=dim;d++){if(isClosed(y,m,d)){o++;continue;}if(((dayOff||{})[`${y}-${m+1}-${d}`]||[]).includes(name))o++;}return o;};
  let carry=0,y=months[0].y,m=months[0].m,guard=0;
  while((y<cy||(y===cy&&m<cm))&&guard++<240){
    const c=num(`${y}-${m+1}`); carry=(c==null)?0:Math.max(0,carry+c-taken(y,m));   // 未設定の月で途切れる。超過はマイナスで持ち越さない（有給扱い）
    m++; if(m>11){m=0;y++;}
  }
  const company=num(`${cy}-${cm+1}`);
  const t=taken(cy,cm);
  const quota=company==null?null:company+carry;
  const over=quota==null?0:Math.max(0,t-quota);   // 枠を超えた休日の数（集計では有給に数える）
  // 繰り越し分を充てた日：この月の本人の休日（店休日を除く）を日付順に、繰越の日数だけ
  const days=[];{const dim=new Date(cy,cm+1,0).getDate();for(let d=1;d<=dim;d++){if(!isClosed(cy,cm,d)&&((dayOff||{})[`${cy}-${cm+1}-${d}`]||[]).includes(name))days.push(d);}}
  const carried=days.slice(0,Math.min(carry,days.length));
  return {carryIn:carry,company,taken:t,quota,remain:quota==null?null:Math.max(0,quota-t),over,carried,carriedN:carried.length,fromM:cm===0?12:cm};
};
// バッジの文言：翌月へ回る分だけ「繰り越しN日」。使い切っていれば何も出さない（空文字）。枠を超えた分は有給扱いと出す
const carryLabel=(c,long)=>{
  if(!c||c.quota==null)return '';
  if(c.remain>0)return long?`繰り越し${c.remain}日 →翌月へ`:`繰越${c.remain}日`;
  if(c.over>0)return `${c.over}日超過→有給扱い`;
  return '';
};
// 集計の内訳「（うち店休日N＋繰り越し休日M）」
const offBreakdown=(closedN,c)=>{const p=[];if(closedN>0)p.push(`店休日 ${closedN}`);if(c&&c.carriedN>0)p.push(`繰り越し休日 ${c.carriedN}`);return p.length?`（うち${p.join('＋')}）`:'';};
const carriedLabel=c=>c?`${c.fromM}月繰り越し分`:'';
const carryTitle=c=>c&&c.quota!=null?`会社の休日数 ${c.company}日 ＋ 前月からの繰り越し ${c.carryIn}日 ＝ ${c.quota}日。取得 ${c.taken}日（店休日を含む・有給は数えない）。繰り越し分は今月の一番早い休日から充てます。使い切った後の休日は自動で有給になります`:'';
const HolidayView=({user,vsId,viewStore,adminMode,staffH,staffS,dayOffH,dayOffS,pleaveH,pleaveS,
  closedDaysH,closedDaysS,closedDatesH,closedDatesS,overrideOpen,monthlyHolidays,onToggle,offNoteH,offNoteS,onSaveNote})=>{
  const today=new Date();
  // ★表示する店はヘッダーの帯に合わせる（2026-10-02）。ボタンが2つ並んで紛らわしかったため
  //   入力できるかの判定は今までどおり vsId（＝自分の店）で見る。
  const [store,setStore]=useState(viewStore||vsId);
  useEffect(()=>{setStore(viewStore||vsId);},[viewStore,vsId]);
  const [cur,setCur]=useState(new Date(today.getFullYear(),today.getMonth(),1));
  const [selDay,setSelDay]=useState(today.getDate());
  const [who,setWho]=useState(user.name);   // 設定する人（管理者だけ変えられる）
  const [busy,setBusy]=useState(false);
  const cy=cur.getFullYear(),cm=cur.getMonth();
  const dim=new Date(cy,cm+1,0).getDate();
  const fdow=new Date(cy,cm,1).getDay();
  const staff=(store==='honten'?staffH:staffS).filter(s=>s&&s.name&&s.badge!=='president'&&s.myNumber!==0);
  const norm=o=>Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[k,Array.isArray(v)?v:[]]));
  const offs=norm(store==='honten'?dayOffH:dayOffS);
  const leaves=norm(store==='honten'?pleaveH:pleaveS);
  const cDays=Array.isArray(store==='honten'?closedDaysH:closedDaysS)?(store==='honten'?closedDaysH:closedDaysS):[];
  const cDates=Array.isArray(store==='honten'?closedDatesH:closedDatesS)?(store==='honten'?closedDatesH:closedDatesS):[];
  const closedOn=d=>calIsClosed(new Date(cy,cm,d),cDays,cDates,overrideOpen);
  const dkOf=d=>`${cy}-${cm+1}-${d}`;
  const canEditHere=store===vsId;                 // 入力は自分の店だけ
  const target=adminMode?who:user.name;           // 誰の休日を入れるか
  const targetInStore=staff.some(s=>s.name===target);
  // 月の集計（PC版と同じく店休日はスタッフ休日に数える）
  const mine=useMemo(()=>{let o=0,l=0,cN=0;for(let d=1;d<=dim;d++){if(closedOn(d)){o++;cN++;continue;}if((offs[dkOf(d)]||[]).includes(target))o++;if((leaves[dkOf(d)]||[]).includes(target))l++;}const c=calcHolidayCarry(target,cy,cm,offs,(y,m,d)=>calIsClosed(new Date(y,m,d),cDays,cDates,overrideOpen),monthlyHolidays);if(c&&c.over>0){o-=c.over;l+=c.over;}return{o,l,cN};},[offs,leaves,cy,cm,target,cDays,cDates,overrideOpen]);
  const mhol=monthlyHolidays&&monthlyHolidays[`${cy}-${cm+1}`];
  const offNote=(store==='honten'?offNoteH:offNoteS)||{};
  const noteOf=(dk,name)=>{const v=offNote[dk+'::'+name];return typeof v==='string'?v:(v&&v.memo)||'';};
  const [memoOpen,setMemoOpen]=useState(false);
  const [memoText,setMemoText]=useState('');
  const [autoLeaveMsg,setAutoLeaveMsg]=useState('');
  useEffect(()=>{ if(!autoLeaveMsg)return; const t=setTimeout(()=>setAutoLeaveMsg(''),6000); return()=>clearTimeout(t); },[autoLeaveMsg]);
  const carry=useMemo(()=>calcHolidayCarry(target,cy,cm,offs,(y,m,d)=>calIsClosed(new Date(y,m,d),cDays,cDates,overrideOpen),monthlyHolidays),[target,cy,cm,offs,cDays,cDates,overrideOpen,monthlyHolidays]);
  const weeks=[];let wk=Array(7).fill(null);
  for(let d=1;d<=dim;d++){const dow=(fdow+d-1)%7;wk[dow]=d;if(dow===6||d===dim){weeks.push([...wk]);wk=Array(7).fill(null);}}
  const selDk=selDay?dkOf(selDay):null;
  const selClosed=selDay?closedOn(selDay):false;
  const selOffs=selDk?(offs[selDk]||[]):[], selLeaves=selDk?(leaves[selDk]||[]):[];
  const selWorking=selClosed?[]:staff.filter(s=>!selOffs.includes(s.name)&&!selLeaves.includes(s.name));
  const myState=selDk?(selOffs.includes(target)?'dayoff':selLeaves.includes(target)?'leave':''):'';
  // 休日・有給の入力は「入力モード」でまとめて（2026-09-22 ユーザー要望：タップ1つで確定は誤操作しやすい／1日ずつ確定は面倒）
  //   ✏ 休日を入力する → 種類（休日／有給／解除）を選ぶ → 日をいくつでもタップ（もう一度で取り消し）→ ✅ 確定 で一括保存
  const [editMode,setEditMode]=useState(false);
  const [editType,setEditType]=useState('dayoff');          // 'dayoff' | 'leave' | 'clear'
  const [pendDays,setPendDays]=useState({});                 // { dk: 'dayoff'|'leave'|'clear' } 未確定の選択（月をまたいでも保持）
  useEffect(()=>{ setEditMode(false); setPendDays({}); },[store,target]);   // 店や人を変えたら選択はやめる
  const pendCount=Object.keys(pendDays).length;
  const stateOf=(dk)=>((offs[dk]||[]).includes(target)?'dayoff':(leaves[dk]||[]).includes(target)?'leave':'');
  const togglePend=(dk)=>{
    // ★すでに入っている日をもう一度タップしたら「解除」（2026-09-28 ユーザー指示）。
    //   🏖 休日 のままでも、枠を使い切って自動で有給になった日を外せる。
    setPendDays(p=>{
      const n={...p};
      if(n[dk]){delete n[dk];return n;}
      const cur=stateOf(dk);
      n[dk]=(editType==='dayoff'&&(cur==='dayoff'||cur==='leave'))||(editType==='leave'&&cur==='leave')?'clear':editType;
      return n;
    });
  };
  const startEdit=()=>{ if(!canEditHere||!targetInStore)return; setEditMode(true); setPendDays({}); setEditType('dayoff'); };
  const cancelEdit=()=>{ setEditMode(false); setPendDays({}); };
  const commit=async()=>{
    if(!pendCount||busy)return;
    setBusy(true);
    let saved=0, auto=[];
    try{
      // 月ごとに「今月の枠（会社の休日数＋繰越）」を見ながら、日付順に保存する。枠を使い切ったら休日は有給として入れる（2026-09-21 ユーザー決定）
      const dks=Object.keys(pendDays).sort((x,y)=>{const a=x.split('-').map(Number),b=y.split('-').map(Number);return a[0]-b[0]||a[1]-b[1]||a[2]-b[2];});
      const takenBy={};   // 'y-m' → その月の取得数（店休日を含む）
      for(const dk of dks){
        const [y,m1,d]=dk.split('-').map(Number); const mk=y+'-'+m1;
        const c=calcHolidayCarry(target,y,m1-1,offs,(yy,mm,dd)=>calIsClosed(new Date(yy,mm,dd),cDays,cDates,overrideOpen),monthlyHolidays);
        if(takenBy[mk]==null)takenBy[mk]=c?c.taken:0;
        const quota=c&&c.quota!=null?c.quota:null;
        const cur=stateOf(dk), want=pendDays[dk];
        if(want==='dayoff'){
          if(cur==='dayoff')continue;
          if(quota!=null&&takenBy[mk]>=quota){
            if(cur==='leave')continue;                                     // すでに有給ならそのまま
            await onToggle(store,'leave',dk,target); auto.push(m1+'/'+d);  // 枠を使い切っているので有給として入れる
          }
          else { await onToggle(store,'dayoff',dk,target); takenBy[mk]++; }  // 有給だった日は onToggle が外してくれる
          saved++;
        }else if(want==='leave'){
          if(cur==='leave')continue;
          if(cur==='dayoff')takenBy[mk]--;
          await onToggle(store,'leave',dk,target); saved++;
        }else{ // clear
          if(cur==='dayoff'){ await onToggle(store,'dayoff',dk,target); takenBy[mk]--; saved++; }
          else if(cur==='leave'){ await onToggle(store,'leave',dk,target); saved++; }
        }
      }
      setAutoLeaveMsg(saved?`${saved}日を保存しました${auto.length?'。'+auto.join('・')+' は休日の枠を使い切っているので有給として入れました':''}`:'変更はありませんでした');
      setEditMode(false); setPendDays({});
    }finally{ setBusy(false); }
  };

  const Chip=({on,color,bg,children,onClick,disabled})=>(
    <button onClick={onClick} disabled={disabled}
      style={{flex:1,padding:'10px 6px',borderRadius:10,border:`2px solid ${on?color:'#e2e8f0'}`,background:on?bg:'white',color:on?color:'#64748b',fontWeight:on?900:600,fontSize:13,opacity:disabled?.5:1}}>
      {children}
    </button>
  );
  return(
    <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',background:'#f8fafc'}}>
      <div style={{padding:'8px 12px',background:'white',borderBottom:'1px solid #f1f5f9',borderTop:'3px solid #f97316',display:'flex',alignItems:'center',gap:8}}
        onTouchStart={e=>{e.currentTarget._sx=e.touches[0].clientX;e.currentTarget._sy=e.touches[0].clientY;}}
        onTouchEnd={e=>{
          const dx=e.changedTouches[0].clientX-(e.currentTarget._sx||0);
          const dy=e.changedTouches[0].clientY-(e.currentTarget._sy||0);
          e.currentTarget._sx=null;
          if(Math.abs(dx)<30||Math.abs(dy)>Math.abs(dx))return;
          setCur(new Date(cy,cm+(dx<0?1:-1),1));setSelDay(null);
        }}>
        <button onClick={()=>{setCur(new Date(cy,cm-1,1));setSelDay(null);}} style={{width:36,height:36,borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>&#8249;</button>
        <div style={{flex:1,textAlign:'center'}}>
          <div style={{fontWeight:900,fontSize:18}}>{cy}年 {cm+1}月</div>
          <div style={{fontSize:10,color:'#94a3b8'}}>🏖 スタッフ休日　← スワイプで月移動 →</div>
        </div>
        <button onClick={()=>{setCur(new Date(cy,cm+1,1));setSelDay(null);}} style={{width:36,height:36,borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>&#8250;</button>
      </div>
      {/* 今月の集計（店の切り替えはヘッダーの帯に一本化した・2026-10-02） */}
      <div style={{display:'flex',alignItems:'center',gap:6,padding:'8px 12px 0'}}>
        <span style={{padding:'5px 12px',borderRadius:8,border:`2px solid ${store==='sanda'?'#dc2626':'#1d4ed8'}`,background:store==='sanda'?'#fee2e2':'#dbeafe',color:store==='sanda'?'#991b1b':'#1e40af',fontWeight:800,fontSize:12,whiteSpace:'nowrap'}}>
          🏪 {store==='sanda'?'三田店':'本店'}{store===vsId?'':'（閲覧）'}
        </span>
        <div style={{marginLeft:'auto',textAlign:'right',fontSize:10.5,color:'#475569',lineHeight:1.5}}>
          <div><b style={{color:'#ea580c'}}>{target}</b>：🏖 {mine.o}日{offBreakdown(mine.cN,carry)?<span style={{fontWeight:500,color:'#9a3412'}}>{offBreakdown(mine.cN,carry)}</span>:null}{mine.l?`・📋 有給 ${mine.l}日`:''}</div>
          {mhol!=null&&mhol!==''&&<div style={{color:'#94a3b8'}}>会社の{cm+1}月の休日 {mhol}日</div>}
        </div>
      </div>
      {carryLabel(carry,true)&&(
        <div title={carryTitle(carry)} style={{margin:'6px 12px 0',padding:'6px 10px',borderRadius:8,background:'white',border:'1px solid #93c5fd',fontSize:11,color:carry.remain>0?'#1d4ed8':'#dc2626',fontWeight:800}}>
          {carryLabel(carry,true)}
        </div>
      )}
      {adminMode&&(
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'8px 12px 0',fontSize:11,color:'#475569'}}>
          <span style={{fontWeight:700,flexShrink:0}}>設定する人</span>
          <select value={who} onChange={e=>setWho(e.target.value)} style={{flex:1,padding:'6px 8px',borderRadius:8,border:'2px solid #e2e8f0',fontSize:16,background:'white'}}>
            {[...new Set([user.name,...staffH.map(s=>s.name),...staffS.map(s=>s.name)])].filter(Boolean).map(n=><option key={n} value={n}>{n}</option>)}
          </select>
        </div>
      )}
      {/* 休日の入力（入力モード）：まとめて選んで確定 */}
      {canEditHere&&targetInStore&&(
        editMode
          ?<div data-edit-bar style={{margin:'8px 8px 0',padding:'8px 10px',background:'#eff6ff',border:'2px solid #93c5fd',borderRadius:12}}>
            <div style={{fontSize:11,color:'#1e40af',fontWeight:700,marginBottom:6}}>✏ <b>{target}</b>{target===user.name?'（自分）':''}の休日を入力：種類を選んで、日をタップ（複数OK・もう一度で取り消し）</div>
            <div style={{display:'flex',gap:6}}>
              <Chip on={editType==='dayoff'} color="#ea580c" bg="#fff7ed" disabled={busy} onClick={()=>setEditType('dayoff')}>🏖 休日</Chip>
              <Chip on={editType==='leave'} color="#059669" bg="#d1fae5" disabled={busy} onClick={()=>setEditType('leave')}>📋 有給</Chip>
              <Chip on={editType==='clear'} color="#475569" bg="#f1f5f9" disabled={busy} onClick={()=>setEditType('clear')}>✕ 解除</Chip>
            </div>
            <div style={{display:'flex',gap:6,marginTop:8}}>
              <button onClick={commit} disabled={busy||!pendCount} style={{flex:2,padding:'11px 8px',borderRadius:10,border:'none',background:pendCount?'#1d4ed8':'#cbd5e1',color:'white',fontWeight:900,fontSize:14,opacity:busy?.6:1}}>
                {busy?'保存中…':pendCount?`✅ 確定（${pendCount}日）`:'✅ 確定（日を選んでください）'}
              </button>
              <button onClick={cancelEdit} disabled={busy} style={{flex:1,padding:'11px 8px',borderRadius:10,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:700,fontSize:13}}>やめる</button>
            </div>
            <div style={{fontSize:10,color:'#64748b',marginTop:6}}>「確定」を押すまで保存されません。確定すると PC のスタッフ休日カレンダーにもすぐ出ます。</div>
          </div>
          :<div style={{margin:'8px 8px 0',display:'flex',gap:8,alignItems:'center'}}>
            <button onClick={startEdit} style={{flex:1,padding:'10px 12px',borderRadius:10,border:'2px solid #f97316',background:'#fff7ed',color:'#c2410c',fontWeight:900,fontSize:13}}>✏ 休日を入力する（複数の日をまとめて）</button>
          </div>
      )}
      {autoLeaveMsg&&<div data-auto-leave style={{margin:'6px 8px 0',fontSize:11,fontWeight:700,color:'#065f46',background:'#d1fae5',border:'1px solid #6ee7b7',borderRadius:8,padding:'6px 9px'}}>📋 {autoLeaveMsg}</div>}

      <div style={{padding:'8px 8px 4px'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:4}}>
          {DOW.map((d,i)=><div key={d} style={{textAlign:'center',fontSize:11,fontWeight:700,color:i===0?'#ef4444':i===6?'#3b82f6':'#64748b',padding:'4px 0'}}>{d}</div>)}
        </div>
        {weeks.map((wk,wi)=>(
          <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:2}}>
            {wk.map((d,di)=>{
              if(!d)return <div key={di}/>;
              const dk=dkOf(d);
              const closed=closedOn(d);
              const isToday=d===today.getDate()&&cm===today.getMonth()&&cy===today.getFullYear();
              const isSel=d===selDay;
              const isSun=di===0,isSat=di===6,isHol=isHoliday(cy,cm,d);
              const o=offs[dk]||[],l=leaves[dk]||[];
              const meOff=o.includes(target),meLeave=l.includes(target);
              const working=closed?0:staff.filter(s=>!o.includes(s.name)&&!l.includes(s.name)).length;
              const pendT=pendDays[dk];   // 未確定の選択
              const bg=closed?CLOSED_BG:meOff?'#fff7ed':meLeave?'#d1fae5':'white';
              const bd=pendT?'2px dashed #1d4ed8':isSel?'2px solid #1d4ed8':meOff?'2px solid #f97316':meLeave?'2px solid #10b981':isToday?'2px solid #93c5fd':'2px solid #f1f5f9';
              return(
                <div key={di} onClick={()=>{setSelDay(d);setMemoOpen(false);if(editMode&&!closed&&!busy)togglePend(dk);}}
                  style={{borderRadius:10,background:pendT?'#dbeafe':bg,border:bd,boxShadow:closed?CLOSED_BAR:'none',minHeight:54,padding:'4px 2px',cursor:'pointer',position:'relative'}}>
                  <div style={{textAlign:'center',fontWeight:800,fontSize:14,color:isToday?'#1e40af':closed?CLOSED_FG:isSun||isHol?'#ef4444':isSat?'#3b82f6':'#1e293b'}}>{d}</div>

};
const MailModal=({user,onClose,onSaveEmail})=>{
  const [email,setEmail]=useState('');
  const [loaded,setLoaded]=useState(false);
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null); // {ok:bool,text}
  useEffect(()=>{(async()=>{
    const m=await sGet(STOR+'notify-emails');
    setEmail((isPlainObj(m)&&m[user.name])||'');
    setLoaded(true);
  })();},[]);
  const doSave=async(val)=>{
    if(val&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){setMsg({ok:false,text:'メールアドレスの形式が正しくありません'});return;}
    setBusy(true);setMsg(null);
    try{
      await onSaveEmail(val);
      setMsg({ok:true,text:val?'保存しました。予約の保存に失敗した時、このアドレスへ通知が届きます':'登録を削除しました'});
      setEmail(val);
    }catch(e){setMsg({ok:false,text:'保存を確認できませんでした。電波の良い場所でもう一度お試しください'});}
    setBusy(false);
  };
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:400,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={busy?undefined:onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'20px 20px 0 0',padding:'16px 18px calc(18px + env(safe-area-inset-bottom,0px))',boxShadow:'0 -8px 40px rgba(0,0,0,.25)',animation:'sheetUp .22s ease'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:900,fontSize:16,color:'#3730a3'}}>✉ 通知メール設定</div>
            <div style={{fontSize:11,color:'#94a3b8',marginTop:2}}>{user.name}さん宛の通知先（個人のアドレスでOK）</div>
          </div>
          <button onClick={onClose} disabled={busy} style={{width:32,height:32,borderRadius:'50%',background:'#f1f5f9',border:'none',fontSize:16,color:'#64748b'}}>✕</button>
        </div>
        <div style={{fontSize:12,color:'#475569',lineHeight:1.6,background:'#f8fafc',borderRadius:10,padding:'8px 12px',marginBottom:12}}>
          予約がサーバーに保存できなかった時、このアドレスへお知らせメールが届きます（通知専用。返信は不要です）。届いたらアプリで該当日を確認して、予約をし直してください。
        </div>
        {!loaded?<div style={{textAlign:'center',color:'#94a3b8',fontSize:12,padding:12}}>⏳ 読込中...</div>:(
          <React.Fragment>
            <input type="email" inputMode="email" autoComplete="email" value={email} onChange={e=>setEmail(e.target.value.trim())}
              placeholder="通知を受け取るアドレスを入力"
              style={{width:'100%',padding:'12px 14px',border:'2px solid #e2e8f0',borderRadius:10,outline:'none',fontSize:16,marginBottom:10}}/>
            {msg&&<div style={{padding:'8px 12px',borderRadius:10,fontSize:12,fontWeight:700,marginBottom:10,background:msg.ok?'#f0fdf4':'#fef2f2',border:`1.5px solid ${msg.ok?'#86efac':'#fca5a5'}`,color:msg.ok?'#15803d':'#dc2626'}}>{msg.text}</div>}
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>doSave('')} disabled={busy||!email}
                style={{padding:'12px 14px',borderRadius:12,border:'2px solid #e2e8f0',background:'white',color:'#64748b',fontWeight:700,fontSize:13}}>登録解除</button>
              <button onClick={()=>doSave(email)} disabled={busy}
                style={{flex:1,padding:'12px 0',borderRadius:12,border:'none',background:busy?'#94a3b8':'#3730a3',color:'white',fontWeight:900,fontSize:14}}>{busy?'⏳ 保存中...':'保存'}</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
};

// ── データ復旧モーダル（モバイル・ボトムシート。PC版と同じ機能：店別/全体/足す） ──
const MobileRestoreModal=({user,onClose,inspData})=>{
  const [list,setList]=useState(null);
  const [sel,setSel]=useState(null);
  const [detail,setDetail]=useState(null);
  const [detailLoading,setDetailLoading]=useState(false);
  const [drillDate,setDrillDate]=useState(null);
  const [added,setAdded]=useState({});
  const [scope,setScope]=useState(null);      // null=選択画面 / 'all'|'honten'|'sanda'=確認
  const [restoring,setRestoring]=useState(false);
  const [elapsed,setElapsed]=useState(0);
  const [done,setDone]=useState(false);
  const allowed=canRestore(user);
  useEffect(()=>{ snapList().then(a=>{ setList(a); if(a.length)setSel(a[0]); }); },[]);
  const rowSig=(r)=>[String((r&&r.name)||''),String((r&&r.time)||''),String((r&&r.carType)||'')].join('|');
  const kindLabel=(k)=>k==='daily'?'日次':k==='pre-restore'?'復旧前':k==='manual'?'手動':'自動';
  const pick=(e)=>{ setSel(e); setDetail(null); setDrillDate(null); setScope(null); setAdded({}); };
  const loadDetail=async()=>{ if(!sel)return; setDetailLoading(true); const d=await snapRead(sel.file); setDetail(d); setDetailLoading(false); };
  const doAddBack=async(date,r)=>{ await snapAddBack(date,[r]); setAdded(a=>({...a,[rowSig(r)]:true})); };
  const doRestore=async()=>{
    if(!sel||!allowed)return;
    setRestoring(true); setElapsed(0);
    const t0=Date.now(); const iv=setInterval(()=>setElapsed(Math.round((Date.now()-t0)/1000)),1000);
    if(scope==='all') await snapRestore(sel.file); else await snapRestoreStore(sel.file,scope);
    await new Promise(r=>setTimeout(r,3500)); clearInterval(iv); setDone(true); setTimeout(()=>location.reload(),1500);
  };
  const sum=(sel&&sel.summary)||{insp:0,sched:0,loaner:0,memo:0};
  const sheet={background:'white',borderRadius:'16px 16px 0 0',maxHeight:'92vh',display:'flex',flexDirection:'column',boxShadow:'0 -8px 30px rgba(0,0,0,.3)'};
  const srow=(active)=>({display:'flex',alignItems:'center',gap:9,padding:'9px 11px',border:`1px solid ${active?'#1d4ed8':'#eef2f8'}`,borderRadius:10,marginBottom:6,cursor:'pointer',background:active?'#eff4ff':'white'});
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={restoring?undefined:onClose}>
      <div style={sheet} onClick={e=>e.stopPropagation()}>
        <div style={{background:'linear-gradient(135deg,#1e3a8a,#1d4ed8)',color:'white',padding:'12px 16px',display:'flex',alignItems:'center',gap:9,borderRadius:'16px 16px 0 0',flexShrink:0}}>
          <span style={{fontSize:17}}>🕒</span>
          <div style={{flex:1}}><div style={{fontSize:15,fontWeight:800}}>データ復旧</div><div style={{fontSize:10,opacity:.85}}>保存時点を選んで戻せます</div></div>
          <button onClick={onClose} disabled={restoring} style={{background:'rgba(255,255,255,.18)',border:'none',borderRadius:'50%',width:28,height:28,color:'white',fontSize:14,cursor:restoring?'default':'pointer'}}>✕</button>
        </div>
        <div style={{overflowY:'auto',padding:'13px 14px 20px'}}>
          {!allowed ? (
            <div style={{padding:'34px 16px',textAlign:'center',color:'#64748b'}}><div style={{fontSize:28,marginBottom:8}}>🔒</div><div style={{fontWeight:700,color:'#334155'}}>この操作は許可されていません</div><div style={{fontSize:12,marginTop:6}}>復旧は担当者のみ実行できます。</div></div>
          ) : done ? (
            <div style={{padding:'40px 16px',textAlign:'center'}}><div style={{fontSize:32,marginBottom:10}}>✅</div><div style={{fontSize:15,fontWeight:800,color:'#0f9d58'}}>復旧しました</div><div style={{fontSize:12,color:'#64748b',marginTop:6}}>最新を読み込むため再読み込みします…</div></div>
          ) : restoring ? (
            <div style={{background:'#eff4ff',border:'1px solid #c7d7f5',borderRadius:12,padding:'18px 16px',textAlign:'center'}}>
              <div style={{fontSize:15,fontWeight:800,color:'#173da8'}}>復旧しています…</div>
              <div style={{fontSize:12,color:'#475569',margin:'4px 0 13px'}}>画面はそのままでお待ちください（自動で切り替わります）。</div>
              <div style={{height:9,borderRadius:999,background:'#dbe6fb',overflow:'hidden'}}><div style={{height:'100%',width:`${Math.min(95,Math.round(elapsed/90*100))}%`,background:'linear-gradient(135deg,#1e3a8a,#1d4ed8)',borderRadius:999,transition:'width 1s linear'}}/></div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,color:'#64748b',marginTop:8}}><span>経過 {elapsed}秒</span><span>目安 1〜2分</span></div>
            </div>
          ) : scope ? (
            <>
              {scope==='all' ? (
                <div style={{background:'#fdece9',border:'1px solid #f3b4ab',borderRadius:10,padding:'12px 14px'}}><div style={{fontWeight:800,color:'#d33a2c',fontSize:14,marginBottom:3}}>⚠️ 両店舗すべてが {sel&&sel.tsText} に戻ります</div><div style={{fontSize:12,color:'#475569'}}><b>本店・三田の車検・整備・代車・メモが全部</b>この時点で上書きされます。1〜2分ほどかかります。</div></div>

                <div style={{background:'#eff4ff',border:'1px solid #c7d7f5',borderRadius:10,padding:'12px 14px'}}><div style={{fontWeight:800,color:'#173da8',fontSize:14,marginBottom:3}}>{scope==='honten'?'🔵 本店':'🔴 三田店'}だけを {sel&&sel.tsText} に戻します</div><div style={{fontSize:12,color:'#475569'}}>この店の<b>整備・メモ・整備の代車だけ</b>戻します。車検と、もう片方の店は変わりません。</div></div>
