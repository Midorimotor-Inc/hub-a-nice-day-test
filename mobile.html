<script>
  // ===== 自動アップデート検知（PC版 index と同じ方式・Service Workerなし・HTTPキャッシュのみ） =====
  // iOSのホーム画面PWAはHTMLを長くキャッシュするため、開いたまま/再訪では旧版が残りがち。
  // 画面復帰時と定期に自分自身をno-storeで取得し、__APP_BUILDが変わっていれば更新バナーを表示する。
  // タップ時は cache:'reload' で新HTMLをHTTPキャッシュへ焼き直してから reload するので、確実に新版になる
  // （アプリを消したりURLを打ち直す必要はない）。本番デプロイ時は port_to_main.js が __APP_BUILD を自動更新する。
  window.__APP_BUILD='build-1791010739036';
  (function(){
    var RUNNING=window.__APP_BUILD, shown=false, checking=false;
    function runningVer(){
      try{ var s=document.querySelectorAll('script');   /* モバイルは変換結果を別scriptに入れ直すので、種類を問わず全部見る */
        for(var i=0;i<s.length;i++){ var mm=s[i].textContent.match(/(?:APP_VERSION|MOBILE_VERSION)\s*=\s*'([^']+)'/); if(mm)return mm[1]; } }catch(e){}
      return '';
    }
    function banner(){
      if(shown)return; if(!document.body){setTimeout(banner,500);return;} shown=true;   // 本文がまだ無い（CDNの読み込み待ち）なら少し待って出す。以前はここで諦めて帯が出なかった
      var b=document.createElement('div');
      b.textContent='🔄 新しいバージョンがあります（タップして更新）';
      b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#0e7490;color:#fff;text-align:center;padding:calc(14px + env(safe-area-inset-bottom,0px)) 12px 14px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 -2px 12px rgba(0,0,0,.35)';
        // ★保存がまだGASに着地していない状態でリロードすると、その保存は失われる
        //   （GASへの書き込みは10〜27秒かかる）。書き込みが残っている間は待ってから更新する。
        window.addEventListener('beforeunload',function(ev){
          if((window.__hubWriteBusy||0)>0){ev.preventDefault();ev.returnValue='';return '';}
        });
        var __waitWrite=function(cb){
          var waited=0;
          (function go(){
            if((window.__hubWriteBusy||0)>0&&waited<180000){
              b.textContent='保存中です… 完了までお待ちください（'+Math.round(waited/1000)+'秒）';
              waited+=1000;setTimeout(go,1000);return;
            }
            cb();
          })();
        };
      b.onclick=function(){__waitWrite(async function(){
        b.textContent='更新中…';
        try{await fetch(location.pathname+'?_v='+Date.now(),{cache:'reload'});}catch(e){}
        location.reload();
      });};
      document.body.appendChild(b);
    }
    async function check(){
      if(shown||checking||navigator.onLine===false)return; checking=true;
      try{
        var res=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
        if(res&&res.ok){
          var t=await res.text();
          var m=t.match(/__APP_BUILD='(build-\d+)'/);
          // ★ビルド識別子だけでなく、バージョン番号の違いでも出す（識別子の更新忘れ対策・2026-09-12）。
          var mv=t.match(/(?:APP_VERSION|MOBILE_VERSION)\s*=\s*'([^']+)'/), rv=runningVer();
          if((m&&m[1]!==RUNNING)||(mv&&rv&&mv[1]!==rv))banner();
        }
      }catch(e){}
      checking=false;
    }
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
    setTimeout(check,8000);   // 開いてすぐ（8秒）に1回。古い画面のまま使い始めないように
    setInterval(check,15*60*1000);
  })();
</script>

const fbDocId = k => { k = String(k); if (k.indexOf(STOR) !== 0) k = STOR + k; return k.replace(/\//g, '%2F'); };

// サーバー最新値 base → mutate(base) を書く。他端末と衝突したら Firestore が自動でやり直す（mutate は純関数であること）。
//   戻り値: 'ok' / 'nochange'（mutate が undefined）/ false（失敗）。書いた値は opts.out.val に入る。
const fbTxn = async (k, mutate, opts) => {
  const _o = opts || {};

  if (fbAuth && !fbUser) { console.warn('[FB] 未サインインのため書けません', k); return false; }
  try {
    const r = await fbWithTimeout(fbDb.runTransaction(async t => {
      const s = await t.get(fbDoc(k));
      const base = fbParse(s);
      if (_o.requireBase && s && s.exists && !(base && typeof base === 'object')) throw Object.assign(new Error('base broken'), { hubAbort: true });
      let val;
      try { val = mutate(base); } catch (e) { mutateErr = e; throw Object.assign(new Error('mutate failed'), { hubAbort: true }); }
      if (val === undefined) return 'nochange';
      t.set(fbDoc(k), { v: JSON.stringify(val), u: firebase.firestore.FieldValue.serverTimestamp() });
      if (_o.out) _o.out.val = val;

  } catch (e) {
    if (!(e && e.hubAbort)) fbDown();

  }
};

// ══ 顧客ファイル（PC で取り込んだ Excel）をスマホから読む／1行だけ書き戻す（v2.95・2026-09-24）══
//   置き方は PC の顧客リスト（customers.html）と同じ： cf-index → cf-{名前}-index → cf-{名前}-chunk-i。
//   スマホでするのは「見る・探す・予約する」だけ。取り込み・削除・列の編集は PC のまま。

// ══ 顧客の横断検索「索引」（v2.98・2026-09-26）══════════════════════════
//   月ファイル（cf-*）がいつでも正。索引はそこから何度でも作り直せる“探すための軽い写し”で、
//   DM の月ごと一覧にも集計にも使わない。だから消えても作り直すだけで済む。
//   中身は 氏名・車種・顧客No・電話・満了日・どのファイルの誰か だけ。
//   ★予約状況（status/入庫日）は入れない：変わるたびに索引を直す必要が無くなり、古い情報が出ない。
//   キー： cf-search-index … {built, total, chunks, files:[月...]}
//          cf-search-chunk-i … 索引の行の配列（1本 2500行・約200KB）
const CFX_CHUNK = 2500;
const cfxIndexKey = () => STOR + 'cf-search-index';
const cfxChunkKey = i => STOR + 'cf-search-chunk-' + i;
const cfxRow = (c, fileName) => ({
  n: String(c.name || ''), c: String(c.carType || ''), no: (c.no == null ? '' : c.no),
  p: [c.phoneMobile, c.phoneHome].map(v => String(v || '').trim()).filter(Boolean).join('/'),
  // ★住所も索引に入れる（2026-10-02）。PC の検索は住所も見ていたのに索引に無く、
  //   スマホだけ住所で引けなかった。索引は作り直せば増える（1行あたり十数文字）。
  a: String(c.address || ''),
  e: String(c.expiry || ''), f: String(fileName || ''), i: String(c.custId || ''),
});
// 探す時の正規化：全角半角・大小・空白・ハイフン・かっこを無視する（画面の検索と同じ規則）
const cfxNorm = s => String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/[\s　\-‐ー－()（）]/g, '');
const cfxDigits = s => String(s == null ? '' : s).normalize('NFKC').replace(/[^0-9]/g, '');
// まとめる鍵：氏名＋車種＋ナンバー＋満了日（2026-10-04 に直した）
//   ★no は【ナンバー4桁】であって顧客Noではない。no だけで鍵にしていたため、
//     同じ4桁の別人（栗﨑さんと阿部さん…）や、同じ会社の別の車（ダイナ／タイタン）まで
//     1件にまとめて隠していた。満了日まで見れば、車ごと・1台ごとに出る。
const cfxPersonKey = r => 'v:' + cfxNorm(r.n) + '/' + cfxNorm(r.c) + '/' + cfxNorm(r.no) + '/' + cfxNorm(r.e);
// 索引を読む（sGet を渡す）。無ければ null＝まだ作られていない
const cfxLoad = async (sGet) => {
  const idx = await sGet(cfxIndexKey());
  if (!idx || !Number(idx.chunks)) return null;
  const parts = await Promise.all(Array.from({ length: Number(idx.chunks) }, async (_, i) => {
    let a = await sGet(cfxChunkKey(i));
    for (let t = 0; !Array.isArray(a) && t < 2; t++) { await new Promise(r => setTimeout(r, 600 * (t + 1))); a = await sGet(cfxChunkKey(i)); }
    return Array.isArray(a) ? a : null;
  }));
  if (parts.some(p => !p)) return null;                 // 欠けている＝作り直しが要る
  return { meta: idx, rows: parts.flat() };
};
// 索引を作って書く（files は [{name, customers:[...]}]。PC の顧客リストが持っているもの）
const cfxBuild = async (files, sSet) => {
  const rows = [];
  [...files].sort((a, b) => String(b.name).localeCompare(String(a.name)))
    .forEach(f => (f.customers || []).forEach(c => { if (c && c.name) rows.push(cfxRow(c, f.name)); }));
  const chunks = [];
  for (let i = 0; i < rows.length; i += CFX_CHUNK) chunks.push(rows.slice(i, i + CFX_CHUNK));
  for (let i = 0; i < chunks.length; i++) await sSet(cfxChunkKey(i), chunks[i]);
  const meta = { built: Date.now(), total: rows.length, chunks: chunks.length, files: files.map(f => f.name) };
  await sSet(cfxIndexKey(), meta);
  return meta;
};
// 探す：ヒットした行を「人」でまとめ、新しい月を今回・それ以外を前回として返す
//   数字だけを打った時は 電話と顧客No の数字で探す（電話の下4桁だけでも出る）
const cfxSearch = (rows, q, limit) => {
  const raw = String(q || '').trim();
  if (raw.length < 1) return [];   // ★1文字でも探す（2026-10-02。PC と揃えるため）
  const nq = cfxNorm(raw), dq = cfxDigits(raw);
  const numOnly = dq.length >= 2 && cfxNorm(raw) === dq;
  const hit = r => numOnly
    ? (cfxDigits(r.p).includes(dq) || cfxDigits(r.no).includes(dq))
    : (cfxNorm(r.n).includes(nq) || cfxNorm(r.c).includes(nq) || cfxNorm(r.no).includes(nq) || cfxNorm(r.p).includes(nq) || cfxNorm(r.a).includes(nq));
  const groups = new Map();
  for (const r of rows) {
    if (!hit(r)) continue;
    const k = cfxPersonKey(r);
    const g = groups.get(k);
    if (!g) groups.set(k, { key: k, now: r, past: [] });
    else if (String(r.f) > String(g.now.f)) { g.past.unshift(g.now); g.now = r; }
    else g.past.push(r);
    if (groups.size >= (limit || 600) && !groups.has(k)) break;
  }
  return [...groups.values()].sort((a, b) => String(b.now.f).localeCompare(String(a.now.f)));
};

const cfSaveRow=async(fileName,cust)=>{

  for(let i=0;i<n;i++){

//   日付を変えても保管箱の古い行が残ると、同じ人が2件出たままになる（テスト版 辻井さんで確認）。
//   消すのは custId が同じ行だけ。氏名で消すと、本当の過去の車検履歴まで消えてしまう。

const archDropOneBooking=(arch,dk,tgt)=>{
  if(!arch||typeof arch!=='object'||Array.isArray(arch))return undefined;
  const rows=arch[dk];
  if(!Array.isArray(rows)||!rows.length)return undefined;
  const same=r=>{
    if(!r||!r.name)return false;
    if(tgt.custId)return r.custId===tgt.custId;
    if(tgt.seq!=null&&r.seq!=null)return r.seq===tgt.seq;
    return r.name===tgt.name&&String(r.no||'')===String(tgt.no||'');
  };
  let hit=false;
  const next=rows.map(r=>same(r)?(hit=true,null):r);
  return hit?{...arch,[dk]:next}:undefined;
};
const archDropSameBooking=(arch,custId,keepDk)=>{
  if(!custId||!arch||typeof arch!=='object'||Array.isArray(arch))return undefined;
  const out={};let hit=false;
  Object.keys(arch).forEach(d=>{
    const rows=Array.isArray(arch[d])?arch[d]:arch[d];
    if(d===keepDk||!Array.isArray(rows)){out[d]=rows;return;}
    const next=rows.map(r=>(r&&r.custId===custId&&r.bookingStatus!=='cancelled')?(hit=true,null):r);
    out[d]=next;
  });
  return hit?out:undefined;
};

const recomputeInspApproval=(rows,limit)=>{
  const lim=(limit!=null)?limit:6;
  const out=rows.map(r=>(r?{...r}:r));
  const active=out
    .map((r,i)=>({r,i}))
    .filter(x=>x.r&&x.r.name&&x.r.course&&x.r.bookingStatus!=='cancelled');
  active.sort((a,b)=>{
    const sa=(a.r.seq!=null)?a.r.seq:a.i;
    const sb=(b.r.seq!=null)?b.r.seq:b.i;
    return sa-sb;
  });
  let conf=0,reg=0;
  for(const {r} of active){
    const isReg=Number(r.course)===3;
    const eligible=(conf<lim)&&(!isReg||reg<3);
    if(eligible){
      delete r.pendingApproval;
      delete r.approved;
      conf++;if(isReg)reg++;
    }else if(r.approved){
      delete r.pendingApproval;
      conf++;if(isReg)reg++;
    }else{
      r.pendingApproval=true;
    }
  }
  return out;
};

//   印を出して同じ利用証を受け取る。台帳に行は増えない（同じ端末の行を共有する）。印は30分で消える。
const HUB_HANDOFF_ID=(()=>{try{return new URLSearchParams(location.search).get('hand')||'';}catch(e){return '';}})();
const hubIsPhone=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent||'');
// 印を作る／出す（hubMakeHandoff / hubTakeHandoff）は Firestore 版を認証層に置いた（2026-09-18）
// ── PC の QR コードから登録（?hand=…&reg=1・2026-09-22 ユーザー要望）──
//   PC で登録した直後（またはログイン画面の「スマホを登録」）に出す QR。スマホで読むと、この端末でその人としてサインインし、
//   通常の登録の流れ（自分専用／共有 → 完了 → ホーム画面に追加）に入る。印の中の端末情報（PC の登録一覧・端末ID）は使わない。
const HUB_HANDOFF_REG=(()=>{try{return new URLSearchParams(location.search).get('reg')==='1';}catch(e){return false;}})();
const hubSignInByHandoff=async()=>{
  if(!HUB_HANDOFF_ID||!fbAuth)return false;
  let ok=false;
  try{
    const s=await fbDb.collection('handoff').doc(HUB_HANDOFF_ID).get();
    const d=s.exists?s.data():null;
    if(d&&d.exp>Date.now()){ await fbAuth.signInWithEmailAndPassword(d.email,d.pw); ok=true; }
  }catch(e){ console.warn('[FB] QR からのサインインに失敗',e&&e.message); }
  try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}
  return ok;
};

const AuthAddScreen=({onDone,onCancel,staffH,staffS,viaHandoff})=>{
  // 流れ：email → sent → ［メールのリンクを開く＝開き直る］→ signing → kind / plan / label → done（2026-09-18・メールリンク方式）
  //   viaHandoff：PC の QR（?hand=&reg=1）でサインイン済み → 端末に誰かいてもそのまま確定へ（2026-09-22）
  const linkOpen=hubIsLinkOpen();
  const firstOnDevice=hubLive(hubLoadMine()).length===0||!!viaHandoff;
  const [step,setStep]=useState((linkOpen||(fbAuth&&firstOnDevice))?'signing':'email');
  const [email,setEmail]=useState(hubLinkEmailFromUrl());
  // 招待 QR（管理者コンソール）から来た時は 6桁を URL から受け取って入れておく（2026-09-22・メールが届かない人のため）
  const codeFromUrl=()=>{try{return (new URLSearchParams(location.search).get('code')||'').replace(/[^0-9]/g,'').slice(0,6);}catch(e){return '';}};
  const [code,setCode]=useState(codeFromUrl());            // 招待コード（6桁）
  const [kind,setKind]=useState(hubKind());
  const [pend,setPend]=useState(null);
  const [needEmail,setNeedEmail]=useState(false);
  const [label,setLabel]=useState(hubLabel());
  const [devNames,setDevNames]=useState(null);
  const [typing,setTyping]=useState(false);
  const [plan,setPlan]=useState([]);
  const [busy,setBusy]=useState(false);
  const [hand,setHand]=useState('');
  const [err,setErr]=useState('');
  const [who,setWho]=useState(null);
  const errText=r=>{
    const e=r&&r.err;
    return e==='not_allowed'?'このアドレスは登録されていません。管理者にご確認ください。'
      :e==='too_many'?'送信が続いています。しばらく待ってからお試しください。'
      :e==='bad_email'?'メールアドレスの形式が正しくありません。'
      :e==='bad_code'?'アドレスかコードが違います。'
      :e==='bad_domain'?'この画面のアドレスがまだ許可されていません（管理者：Firebase の承認済みドメインに追加してください）。'
      :e==='expired'?'このリンクは期限切れか、すでに使われています。メールアドレスを入れて、新しいリンクを受け取ってください。'
      :e==='quota'?'本日のメールリンクの送信上限（Firebase の無料枠）に達しました。管理者に招待コードを発行してもらい、アドレスとコードで登録してください。'
      :e==='offline'?'通信の状態をご確認ください。'
      :'うまくいきませんでした。もう一度お試しください。'+(r&&r.raw?'（'+r.raw+'）':'');
  };
  const startCode=async()=>{
    const mail=email.trim();
    if(mail.indexOf('@')<1){setErr('メールアドレスの形式が正しくありません。');return;}
    if(code.length!==6){setErr('招待コード（6桁）を入れてください。');return;}
    setErr('');setBusy(true);
    const r=await hubSignInWithCode(mail,code);
    setBusy(false);
    if(!r.ok){ setErr(r.err==='bad_code'?'アドレスかコードが違います。招待メールの6桁をご確認ください。':errText(r)); return; }
    await afterSignIn();
  };
  const startSend=async()=>{
    const mail=email.trim();
    if(mail.indexOf('@')<1){setErr('メールアドレスの形式が正しくありません。');return;}
    setErr('');setBusy(true);
    const r=await hubSendLink(mail);
    setBusy(false);
    if(!r.ok){ setErr(errText(r)); return; }
    setStep('sent');
  };
  const finish=(r,k,lb)=>{
    hubDropInvite();
    hubSetKind(k);
    if(lb) hubSetLabel(lb);
    const list=hubLoadMine().filter(x=>x.name!==r.name);
    list.push({uid:r.uid||'',name:r.name,myNumber:r.myNumber,store:r.store||'honten',email:r.email||'',
               isDevice:!!r.device,isAdmin:!!r.admin});
    hubSaveMine(list);
    if(fbAuth&&fbUser) hubHandoffSecret().catch(()=>{});   // 合言葉の控え（引き継ぎ・管理者のコード再招待に要る）
    if(hubLive(hubLoadMine()).filter(x=>!x.isDevice).length>1&&hubKind()==='own')hubSetKind('shared');
    hubWriteDevice();   // 管理者の端末一覧（台帳）へ
    setWho(r);setStep('done');
  };
  const needLabel=k=>k==='shared'&&!hubLabel();
  const planOf=async r=>{
    try{
      const store=(r&&r.store)==='sanda'?'sanda':'honten';
      const have=store==='sanda'?staffS:staffH;
      const fresh=await Promise.race([sGet(STOR+store+'-staff-v2'),new Promise(res=>setTimeout(()=>res(null),5000))]);
      const list=(Array.isArray(fresh)&&fresh.length)?fresh:((Array.isArray(have)&&have.length)?have:[]);
      const me=(Array.isArray(list)?list:[]).find(x=>x&&((r.uid&&x.uid===r.uid)||x.name===r.name));
      return (me&&Array.isArray(me.devPlan))?me.devPlan.filter(Boolean):[];
    }catch(e){ return []; }
  };
  const afterSignIn=async()=>{
    setBusy(true);
    const r=await hubResolveMe();
    setBusy(false);
    if(!r||!r.ok){
      setErr(errText(r||{err:'error'}));
      try{ if(fbAuth&&fbUser) await fbAuth.signOut(); }catch(e){}
      hubDropInvite(); setStep('email'); return;
    }
    if(r.device){ finish(r,'shared',r.label||r.name||''); return; }
    const pl=await planOf(r);
    if(pl.length===1){ const one=pl[0]; finish(r,one==='own'?'own':'shared',one==='own'?'':one); return; }
    if(pl.length>1){ setPend(r); setPlan(pl); setStep('plan'); return; }
    if(firstOnDevice&&!kind){setPend(r);setStep('kind');return;}
    const already=hubLive(hubLoadMine()).length>0;
    const finalKind=(already&&(kind||hubKind())==='own')?'shared':(kind||hubKind()||'shared');
    if(needLabel(finalKind)){setPend(r);setKind(finalKind);setStep('label');return;}
    finish(r,finalKind,'');
  };
  const completeLink=async(typed)=>{
    setErr('');setBusy(true);
    const r=await hubCompleteLink(typed);
    setBusy(false);
    if(r.ok){ setNeedEmail(false); await afterSignIn(); return; }
    if(r.err==='need_email'){ setNeedEmail(true); setStep('email'); return; }
    hubDropInvite(); setErr(errText(r)); setStep('email');
  };
  useEffect(()=>{
    if(step!=='signing')return;
    (async()=>{
      await fbWhenReady();
      if(!linkOpen){ if(fbUser&&firstOnDevice){ await afterSignIn(); } else setStep('email'); return; }
      await completeLink('');
    })();
  },[step]);
  // 登録が済んだら引き継ぎの印を作り、URLに付けておく。
  // ここから「ホーム画面に追加」「Safariで開く」をすると、印つきのURLが渡って登録が引き継がれる。
  useEffect(()=>{
    if(step!=='done'||hand)return;
    (async()=>{
      const h=await hubMakeHandoff();
      if(!h)return;
      setHand(h);
      try{history.replaceState(null,'',location.pathname+'?hand='+encodeURIComponent(h)+location.hash);}catch(e){}
    })();
  },[step]);
  useEffect(()=>{
    if(step!=='label'||devNames!==null)return;
    (async()=>{
      const v=await sGet(STOR+'auth-devnames');
      const list=Array.isArray(v)?v.filter(x=>x&&x.name):[];
      setDevNames(list); setTyping(list.length===0);
    })();
  },[step,devNames]);

  const IN={width:'100%',padding:'13px 14px',border:'2px solid #e5e7eb',borderRadius:11,fontSize:16,
    outline:'none',boxSizing:'border-box',background:'white'};
  const BTN=on=>({width:'100%',padding:'15px 0',marginTop:14,border:'none',borderRadius:12,fontWeight:800,fontSize:16,
    background:on?'linear-gradient(135deg,#4f46e5,#7c3aed)':'rgba(255,255,255,0.25)',color:on?'white':'rgba(255,255,255,0.6)'});
  const SUB={width:'100%',padding:'12px 0',marginTop:10,borderRadius:11,border:'2px solid rgba(255,255,255,0.4)',
    background:'transparent',color:'white',fontWeight:700,fontSize:14};
  const CARD={width:'100%',textAlign:'left',padding:'14px 15px',borderRadius:12,border:'none',background:'white',marginBottom:10};
  const LBL={color:'rgba(255,255,255,0.9)',fontSize:13,lineHeight:1.8,marginBottom:10};

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',justifyContent:'center',padding:22,
      background:UI_BG,overflowY:'auto'}}>
      <div style={{textAlign:'center',marginBottom:18}}>
        <div style={{fontSize:40,marginBottom:6}}>🔑</div>
        <div style={{color:'white',fontSize:19,fontWeight:900}}>この端末にスタッフを追加</div>
        <div style={{color:'rgba(255,255,255,0.7)',fontSize:12,marginTop:3}}>登録は端末ごとに1回だけです</div>
      </div>
      {step==='email'&&(
        <div>
          <div style={LBL}>{needEmail
            ? 'このリンクを送った時のメールアドレスを入れてください（別の端末で送ったリンクのため確認が要ります）。'
            : <>管理者に登録してもらった<b>ご自分のメールアドレス</b>を入れてください。そのアドレスにログイン用のリンクが届きます。名前や番号の入力は要りません。</>}</div>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={IN}
            placeholder="ここにメールアドレスを入力" autoComplete="off" inputMode="email"/>
          {!needEmail&&(<>
            <div style={{...LBL,marginTop:12,marginBottom:4,fontWeight:700}}>招待メールの「招待コード」（6桁）</div>
            <input type="text" value={code} onChange={e=>setCode(e.target.value.replace(/[^0-9]/g,'').slice(0,6))}
              style={{...IN,fontSize:28,letterSpacing:'0.35em',textAlign:'center',fontWeight:800}}
              placeholder="------" inputMode="numeric" autoComplete="one-time-code"/>
          </>)}
          {err&&<div style={{color:'#fecaca',fontWeight:700,fontSize:13,marginTop:8}}>{err}</div>}
          {needEmail
            ? <button style={BTN(!busy&&!!email.trim())} disabled={busy||!email.trim()} onClick={()=>completeLink(email)}>{busy?'確認中…':'確認する'}</button>
            : <>
                <button style={BTN(!busy&&!!email.trim()&&code.length===6)} disabled={busy||!email.trim()||code.length!==6} onClick={startCode}>
                  {busy?'確認中…':'登録する'}
                </button>
                <button style={SUB} disabled={busy||!email.trim()} onClick={startSend}>コードがない → ログイン用のリンクをメールで受け取る</button>
              </>}
          {onCancel&&<button style={SUB} onClick={()=>{hubDropInvite();onCancel();}}>やめる</button>}
        </div>
      )}
      {step==='sent'&&(
        <div>
          <div style={{background:'rgba(255,255,255,0.14)',border:'2px solid rgba(255,255,255,0.4)',borderRadius:12,padding:'14px 14px'}}>
            <div style={{color:'white',fontWeight:900,fontSize:16}}>📧 メールを送りました</div>
            <div style={{...LBL,marginBottom:0,marginTop:6}}><b>{email.trim()}</b> 宛に届いたメールの「ログイン」のリンクを、<b>このスマホで</b>開いてください。開くだけで登録が終わります（6桁の入力はありません）。</div>
          </div>
          <div style={{color:'rgba(255,255,255,0.6)',fontSize:11.5,lineHeight:1.7,marginTop:10}}>届かない時は迷惑メールも見てください。送信元は Firebase（noreply@hub-a-nice-day.firebaseapp.com）です。</div>
          {err&&<div style={{color:'#fecaca',fontWeight:700,fontSize:13,marginTop:8}}>{err}</div>}
          <button style={SUB} disabled={busy} onClick={startSend}>{busy?'送信中…':'メールが見つからない → 送り直す'}</button>
          <button style={SUB} onClick={()=>{setErr('');setStep('email');}}>← アドレスを入れ直す</button>
        </div>
      )}
      {step==='signing'&&(
        <div style={{textAlign:'center'}}>
          <div style={{color:'white',fontWeight:800,fontSize:16}}>確認しています…</div>
          <div style={{color:'rgba(255,255,255,0.6)',fontSize:12,marginTop:6}}>数秒で終わります</div>
          {err&&<div style={{color:'#fecaca',fontWeight:700,fontSize:13,marginTop:8}}>{err}</div>}
        </div>
      )}
      {step==='kind'&&(
        <div>
          <div style={{color:'white',fontWeight:800,fontSize:17,marginBottom:4}}>{pend&&pend.name} さん、確認できました</div>
          <div style={LBL}>最後にひとつだけ。<b>この端末はどちらですか？</b></div>
          <button style={CARD} onClick={()=>{setKind('own');finish(pend,'own','');}}>
            <div style={{fontWeight:800,fontSize:15,color:'#111827'}}>自分専用（自分のスマホ）</div>
            <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>開くだけで使えます。番号の入力も要りません。</div>
          </button>
          <button style={CARD} onClick={()=>{setKind('shared');if(needLabel('shared')){setStep('label');return;}finish(pend,'shared','');}}>
            <div style={{fontWeight:800,fontSize:15,color:'#111827'}}>みんなで使う（共有）</div>
            <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>店のタブレットなど。使う前に名前を選びます。</div>
          </button>
        </div>
      )}
      {step==='plan'&&(
        <div>
          <div style={{color:'white',fontWeight:800,fontSize:17,marginBottom:4}}>{pend&&pend.name} さん、確認できました</div>
          <div style={LBL}>いま使っているのはどちらの端末ですか？</div>
          {plan.map(x=>(
            <button key={x} style={CARD} onClick={()=>finish(pend,x==='own'?'own':'shared',x==='own'?'':x)}>
              <div style={{fontWeight:800,fontSize:15,color:'#111827'}}>{x==='own'?'個人端末':x}</div>
              <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>
                {x==='own'?'自分のスマホ、自分だけが使うPC':'店のPC・タブレット'}
              </div>
            </button>
          ))}
        </div>
      )}
      {step==='label'&&(
        <div>
          <div style={{color:'white',fontWeight:800,fontSize:17,marginBottom:4}}>この端末の名前</div>
          <div style={LBL}>みんなで使う端末なので、あとで管理者が見分けられるように名前が要ります。<br/>例：<b>共有PC1</b>、本店 受付タブレット</div>
          {devNames===null&&<div style={LBL}>読み込んでいます…</div>}
          {devNames!==null&&!typing&&devNames.map(d=>(
            <button key={d.name} style={CARD} onClick={()=>finish(pend,kind||'shared',d.name)}>
              <b style={{fontSize:15,color:'#111827'}}>{d.name}</b>
              <span style={{fontSize:12,color:'#6b7280',marginLeft:8}}>{d.store==='sanda'?'三田店':'本店'}</span>
            </button>
          ))}
          {devNames!==null&&!typing&&(
            <button style={SUB} onClick={()=>setTyping(true)}>一覧にない（自分で入力する）</button>
          )}
          {devNames!==null&&typing&&(<>
            <input type="text" value={label} onChange={e=>setLabel(e.target.value.slice(0,40))} style={IN}
              placeholder="共有PC1" autoComplete="off" autoFocus/>
            <button style={BTN(!!label.trim())} disabled={!label.trim()}
              onClick={()=>finish(pend,kind||'shared',label.trim())}>登録する</button>
          </>)}
          <div style={{...LBL,marginTop:10}}>名前は端末に1つだけです。2人目からは聞かれません。</div>
        </div>
      )}
      {step==='done'&&(
        <div>
          <div style={{background:'white',borderRadius:14,padding:'20px 16px',textAlign:'center'}}>
            <div style={{fontSize:32,marginBottom:4}}>✅</div>
            <div style={{fontWeight:900,fontSize:19,color:'#065f46'}}>{who&&who.name} さん</div>
            <div style={{fontSize:12.5,color:'#047857',marginTop:4}}>
              この端末に登録しました（{hubKind()==='own'?'自分専用':'共有'}）
            </div>
          </div>
          <div style={LBL}>次からは、開くだけで使えます。使っているうちは登録が切れることはありません。</div>
          <div style={{marginTop:10,padding:'12px 13px',background:'rgba(255,255,255,.10)',border:'1.5px solid rgba(255,255,255,.25)',borderRadius:12}}>
            <div style={{color:'white',fontWeight:800,fontSize:14}}>📲 ホーム画面に追加すると便利です</div>
            <div style={{color:'rgba(255,255,255,.8)',fontSize:12,lineHeight:1.75,marginTop:6}}>
              {hand
                ? <>この画面のまま、<b>共有ボタン（□↑）→「ホーム画面に追加」</b>。追加したアイコンから開くと、この登録がそのまま引き継がれます（30分以内）。</>
                : <>引き継ぎの準備をしています…（数秒）</>}
              <br/>※ LINEやメールの中で開いている場合は、先にメニューから<b>「Safariで開く」</b>（Androidは「ブラウザで開く」）を選んでください。
            </div>
          </div>
          <button style={BTN(true)} onClick={()=>onDone&&onDone(who)}>はじめる →</button>
        </div>
      )}
    </div>
  );
};

const LoginScreen=({onLogin,onAddAuth})=>{
  const [err,setErr]=useState('');
  const [success,setSuccess]=useState(null);
  const [staffList,setStaffList]=useState(DEFAULT_STAFF);
  const [staffLoading,setStaffLoading]=useState(true);
  useEffect(()=>{
    (async()=>{
      try{
        const [h,s]=await Promise.all([sGet(STOR+'honten-staff-v2'),sGet(STOR+'sanda-staff-v2')]);
        let all=[...(h||[]).map(st=>({...st,store:'honten'})),...(s||[]).map(st=>({...st,store:'sanda'}))].filter(st=>st.name);
        // 本人認証が必須の間は、この端末で本人確認を済ませた人だけを出す
        if(AUTH_REQUIRED){
          if(hubIsDevice()){
            all=all.filter(st=>!st.noLogin);   // 端末が認証済みなら操作する人は全員
          }else{
            const mine=new Set(hubLive(hubLoadMine()).map(m=>m.name));
            all=all.filter(st=>mine.has(st.name));
          }
        }
        if(all.length>0)setStaffList(all);
      }catch(e){}
      setStaffLoading(false);
    })();
  },[]);
  // 番号を打つ方式はやめ、名前を選ぶ（2026-09-15）。本人確認はメール＋利用証で済んでいるので、
  // 番号は「本人の証明」ではなくなった。共有端末で「誰が操作するか」を選ぶだけ。
  const doLogin=(s)=>{
    if(!s){setErr('名前を選んでください');return;}
    // 本人認証が必須の間は、この端末で本人確認を済ませた人しか入れない
    if(AUTH_REQUIRED&&!hubIsDevice()&&!hubLive(hubLoadMine()).some(m=>m.name===s.name)){
      setErr('この端末では登録されていません。下から登録してください。');return;
    }
    setErr('');
    setSuccess(s);
    // ★演出は1.6秒。8秒は現場では長すぎる（開いてから使えるまでの体感を一番損ねていた）
    setTimeout(()=>onLogin(s),1600);
  };
  if(success){
    const storeColor=success.store==='honten'?'#1d4ed8':'#dc2626';
    const storeName=success.store==='honten'?'本店':'三田店';
    return(
      <div style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'white',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:0,left:0,right:0,height:4,background:`linear-gradient(90deg,${storeColor},#6d28d9)`}}/>
        <div style={{position:'absolute',inset:0,background:storeColor,opacity:0,animation:'flash .4s ease .4s forwards',pointerEvents:'none',zIndex:0}}/>
        <div style={{position:'relative',marginBottom:24,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{position:'absolute',width:80,height:80,borderRadius:'50%',background:storeColor,opacity:0,animation:'rippleOut .8s ease .4s forwards'}}/>
          <div style={{width:80,height:80,borderRadius:'50%',background:'white',border:`3px solid ${storeColor}`,display:'flex',alignItems:'center',justifyContent:'center',position:'relative',zIndex:1,animation:'pop .8s cubic-bezier(0.34,1.56,0.64,1) .2s both, haloSettle 3.5s ease 1.5s both','--hc':storeColor}}>

const CalendarView=({inspData,closedDays,closedDates,overrideOpen,vsId,onSelectDate,mySched,privItems,uid})=>{
  // マイスケジュール：日ごとの件数（自分の公開＋自分のシークレット＋他の人の公開）
  const msCnt=useMemo(()=>{const r={};Object.values(mySched||{}).forEach(v=>{if(v&&v.dk)r[v.dk]=(r[v.dk]||0)+1;});Object.values(privItems||{}).forEach(v=>{if(v&&v.dk)r[v.dk]=(r[v.dk]||0)+1;});return r;},[mySched,privItems]);
  const today=new Date();
  const [cur,setCur]=useState(new Date(today.getFullYear(),today.getMonth(),1));
  const cy=cur.getFullYear(),cm=cur.getMonth();
  const dim=new Date(cy,cm+1,0).getDate();
  const fdow=new Date(cy,cm,1).getDay();
  const dayCnt=useMemo(()=>{
    const res={};
    for(let d=1;d<=dim;d++){
      const dk=`${cy}-${cm+1}-${d}`;
      const rows=(inspData[dk]||[]).filter(r=>r&&r.name&&!r.pendingApproval&&r.bookingStatus!=='cancelled');
      if(rows.length)res[d]={total:rows.length,courses:rows.reduce((a,r)=>{if(r.course)a[r.course]=(a[r.course]||0)+1;return a;},{})};
    }
    return res;
  },[inspData,cy,cm]);
  const weeks=[];let wk=Array(7).fill(null);
  for(let d=1;d<=dim;d++){const dow=(fdow+d-1)%7;wk[dow]=d;if(dow===6||d===dim){weeks.push([...wk]);wk=Array(7).fill(null);}}
  return(
    <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
      <div style={{padding:'10px 14px',background:'white',borderBottom:'1px solid #f1f5f9',borderTop:'3px solid #1d4ed8',display:'flex',alignItems:'center',gap:8}}
        onTouchStart={e=>{e.currentTarget._sx=e.touches[0].clientX;e.currentTarget._sy=e.touches[0].clientY;}}
        onTouchEnd={e=>{
          const dx=e.changedTouches[0].clientX-(e.currentTarget._sx||0);
          const dy=e.changedTouches[0].clientY-(e.currentTarget._sy||0);
          e.currentTarget._sx=null;
          if(Math.abs(dx)<30||Math.abs(dy)>Math.abs(dx))return;
          setCur(new Date(cy,cm+(dx<0?1:-1),1));
        }}>
        <button onClick={()=>setCur(new Date(cy,cm-1,1))} style={{width:36,height:36,borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>&#8249;</button>
        <div style={{flex:1,textAlign:'center'}}>
          <div style={{fontWeight:900,fontSize:18}}>{cy}年 {cm+1}月</div>
          <div style={{fontSize:10,color:'#94a3b8'}}>← スワイプで月移動 / タップで詳細 →</div>
        </div>
        <button onClick={()=>setCur(new Date(cy,cm+1,1))} style={{width:36,height:36,borderRadius:10,border:'2px solid #e5e7eb',background:'white',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>&#8250;</button>
      </div>
      <div style={{padding:'8px 8px 16px'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:4}}>
          {DOW.map((d,i)=><div key={d} style={{textAlign:'center',fontSize:11,fontWeight:700,color:i===0?'#ef4444':i===6?'#3b82f6':'#64748b',padding:'4px 0'}}>{d}</div>)}
        </div>
        {weeks.map((wk,wi)=>(
          <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:2}}>
            {wk.map((d,di)=>{
              if(!d)return <div key={di}/>;
              const date=new Date(cy,cm,d);
              const closed=calIsClosed(date,closedDays,closedDates,overrideOpen);
              const isToday=d===today.getDate()&&cm===today.getMonth()&&cy===today.getFullYear();
              const isSun=di===0,isSat=di===6,isHol=isHoliday(cy,cm,d);
              const info=dayCnt[d];
              return(
                <div key={di} onClick={()=>onSelectDate(`${cy}-${cm+1}-${d}`,cy,cm,d)}
                  style={{borderRadius:10,background:closed?CLOSED_BG:isToday?'#dbeafe':'white',border:isToday?'2px solid #3b82f6':'2px solid #f1f5f9',boxShadow:closed?CLOSED_BAR:info?'0 2px 6px rgba(0,0,0,.08)':'none',minHeight:58,padding:'5px 3px',cursor:closed?'default':'pointer'}}>
                  <div style={{textAlign:'center',fontWeight:800,fontSize:14,color:isToday?'#1e40af':closed?CLOSED_FG:isSun||isHol?'#ef4444':isSat?'#3b82f6':'#1e293b'}}>{d}</div>
                  {info&&!closed&&(
                    <div style={{marginTop:2}}>
                      <div style={{textAlign:'center',fontSize:9,fontWeight:800,color:isToday?'#1e40af':'#374151',marginBottom:1}}>{info.total}台</div>
                      <div style={{display:'flex',gap:1,justifyContent:'center',flexWrap:'wrap'}}>
                        {Object.entries(info.courses).map(([cid,cnt])=>{const c=COURSES.find(co=>co.id===Number(cid));return c?<span key={cid} style={{fontSize:8,fontWeight:700,padding:'0 3px',borderRadius:3,background:c.bg,color:c.color}}>{c.short}{cnt}</span>:null;})}
                      </div>
                    </div>
                  )}
                  {closed&&<div style={{textAlign:'center',fontSize:12,color:CLOSED_FG,fontWeight:900,marginTop:5,letterSpacing:0.5}}>{CLOSED_LABEL}</div>}
                  {msCnt[`${cy}-${cm+1}-${d}`]>0&&<div style={{textAlign:'center',fontSize:9,fontWeight:800,color:'#5b21b6',marginTop:2}}>📝{msCnt[`${cy}-${cm+1}-${d}`]}</div>}
                </div>
              );
            })}
          </div>
        ))}
        <div style={{marginTop:10,padding:'10px 12px',background:'white',borderRadius:12,border:'1px solid #f1f5f9',display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
          {COURSES.map(c=><span key={c.id} style={{display:'flex',alignItems:'center',gap:3,fontSize:11}}><span style={{width:12,height:12,borderRadius:2,background:c.bg,display:'inline-block'}}/><span style={{color:c.color,fontWeight:700}}>{c.name}</span></span>)}
        </div>
      </div>
    </div>
  );
};

// ============================================
//  備考・メモの追加／編集（スマホ・2026-10-03）
//   PC版と同じ {店}-memo の配列（1件 = {content}）に書く。
//   クイック項目（PCの「⚙ クイック編集」で作った定型文）はタップで1行足す／外す。
// ============================================
const MemoSheet=({dateLabel,isNew,initContent,items,onSave,onDelete,onClose})=>{
  const [content,setContent]=useState(initContent||'');
  const [busy,setBusy]=useState(false);
  const lines=String(content||'').split(String.fromCharCode(10));
  const joinLines=a=>a.join(String.fromCharCode(10));
  const empty=!String(content||'').trim();
  const box={width:'100%',padding:'10px 12px',border:'1.5px solid #d1d5db',borderRadius:10,fontSize:16,boxSizing:'border-box',minHeight:120,resize:'vertical',background:'white'};
  return (
    <div onClick={busy?undefined:onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:3000,display:'flex',alignItems:'flex-end'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'white',width:'100%',borderRadius:'18px 18px 0 0',padding:'14px 14px 20px',maxHeight:'90vh',overflowY:'auto',boxShadow:'0 -8px 40px rgba(0,0,0,.25)'}}>
        <div style={{display:'flex',alignItems:'center',marginBottom:10}}>
          <div>
            <div style={{fontWeight:900,fontSize:15,color:'#7c3aed'}}>📝 備考・メモ{isNew?'を追加':'を編集'}</div>
            <div style={{fontSize:11,color:'#94a3b8',marginTop:2}}>{dateLabel}</div>
          </div>
          <button onClick={onClose} disabled={busy}
            style={{marginLeft:'auto',border:'none',background:'#f1f5f9',borderRadius:'50%',width:32,height:32,fontSize:15,fontWeight:800,color:'#64748b'}}>✕</button>
        </div>
        {(items||[]).length>0&&(
          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
            {(items||[]).map((si,i)=>{
              const on=!!(si.text&&lines.includes(si.text));
              return (
                <button key={si.id||i}
                  onClick={()=>setContent(on?joinLines(lines.filter(l=>l!==si.text)):(String(content||'')?joinLines([String(content),si.text]):si.text))}
                  style={{padding:'7px 13px',borderRadius:20,border:'2px solid '+(on?'#10b981':'#6ee7b7'),background:on?'#d1fae5':'#ecfdf5',color:on?'#065f46':'#059669',fontSize:13,fontWeight:700}}>
                  {si.text}
                </button>
              );
            })}
          </div>
        )}
        <textarea style={box} value={content} onChange={e=>setContent(e.target.value)} maxLength={500}
          placeholder="例：部品待ち・代車は午後返却"/>
        <div style={{display:'flex',gap:8,marginTop:10}}>
          {!isNew&&(
            <button disabled={busy}
              onClick={async()=>{ if(!window.confirm('この備考・メモを消しますか？'))return; setBusy(true); try{ await onDelete(); }finally{ setBusy(false); } }}
              style={{flex:'0 0 92px',padding:'13px 0',borderRadius:12,border:'none',background:'#fee2e2',color:'#b91c1c',fontSize:14,fontWeight:800}}>🗑 削除</button>
          )}
          <button disabled={busy||empty}
            onClick={async()=>{ setBusy(true); try{ await onSave(String(content)); }finally{ setBusy(false); } }}
            style={{flex:1,padding:'13px 0',borderRadius:12,border:'none',background:'#7c3aed',color:'white',fontSize:15,fontWeight:800,opacity:(busy||empty)?0.5:1}}>
            {busy?'保存中…':'✓ 保存'}
          </button>
        </div>
      </div>
    </div>
  );
};

const DayDetailModal=({dk,y,m,d,inspData,schedDataH,schedDataS,memoDataH,memoDataS,vsId,onClose,onGoSchedule,onToggleArrived,arrivedOv,mySchedPanel,onEditMemo})=>{
  const sc=vsId==='honten'?'#1d4ed8':'#dc2626';
  const irows=(inspData[dk]||[]).filter(r=>r&&r.name&&!r.pendingApproval&&r.bookingStatus!=='cancelled');
  const sorted=[...irows.filter(r=>normStore(r.store)===vsId),...irows.filter(r=>!normStore(r.store)),...irows.filter(r=>normStore(r.store)&&normStore(r.store)!==vsId)];
  const sd=vsId==='honten'?schedDataH:schedDataS;
  const _si=k=>{let b=getBaseSlot(k);if(b==='12:30')b='未定';const i=SCHED_SLOTS.indexOf(b);return i<0?999:i;};
  const sched=Object.entries(sd[dk]||{}).filter(([,r])=>r&&r.name).sort(([a],[b])=>_si(a)-_si(b)||a.localeCompare(b));
  const memos=((vsId==='honten'?memoDataH:memoDataS)[dk]||[]);

      if((normStore(r.store)||'honten')!==vsId)return;
      dropoffs.push({r,wdk,ix:(inspData[wdk]||[]).indexOf(r)});
    });
  });
  const dow=new Date(y,m,d).getDay();
  // ★予約がゼロの日は「✎ 予約・編集」を真ん中に大きく出す（2026-10-01 ユーザー指示。
  //   右上の小さいボタンは気づきにくいという声があったため）。予約がある日は今までどおり右上。
  const emptyDay=sorted.length===0&&sched.length===0&&dropoffs.length===0;
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:200,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'20px 20px 0 0',maxHeight:'88vh',display:'flex',flexDirection:'column',boxShadow:'0 -8px 40px rgba(0,0,0,.25)'}}>
        <div style={{padding:'14px 18px 10px',borderBottom:'1px solid #f1f5f9',display:'flex',alignItems:'center',gap:8}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:900,fontSize:18,color:dow===0?'#ef4444':dow===6?'#3b82f6':'#1e293b'}}>{m+1}月{d}日（{DOW[dow]}）</div>
            <div style={{fontSize:11,color:'#94a3b8',marginTop:1}}>車検 {irows.length}台 / 整備 {sched.length}件</div>
          </div>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:'50%',background:'#f1f5f9',border:'none',fontSize:16,color:'#64748b',flexShrink:0}}>✕</button>
        </div>
        <div style={{overflowY:'auto',WebkitOverflowScrolling:'touch',flex:1,padding:'12px 16px'}}>
          {sorted.length>0&&(
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:800,fontSize:12,color:'#3730a3',marginBottom:8}}>🚗 車検</div>
              {sorted.map((r,i)=>{
                const c=COURSES.find(co=>co.id===Number(r.course));
                const isOther=normStore(r.store)&&normStore(r.store)!==vsId;
                return(
                  <div key={i} style={{padding:'9px 11px',marginBottom:5,borderRadius:10,background:isOther?'#f8fafc':'white',border:`1.5px solid ${isOther?'#e2e8f0':sc+'33'}`,borderLeft:`4px solid ${isOther?'#94a3b8':sc}`,opacity:isOther?0.75:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <span style={{fontWeight:800,fontSize:14}}>{r.name}</span>
                      {c&&<span style={{padding:'2px 7px',borderRadius:10,background:c.bg,color:c.color,fontSize:10,fontWeight:700}}>{c.name}</span>}
                      {isOther&&<span style={{fontSize:10,color:'#94a3b8',marginLeft:'auto'}}>{normStore(r.store)==='honten'?'本店':'三田店'}</span>}

                    <span style={{marginLeft:'auto',fontSize:10,fontWeight:800,color:'#9a3412',whiteSpace:'nowrap'}}>→ {wl[1]}/{wl[2]}車検 ›</span>
                  </div>
                );})}

                return(
                  <div key={i} style={{display:'flex',gap:8,padding:'7px 10px',marginBottom:4,background:'white',borderRadius:10,border:'1.5px solid #e0f2fe',borderLeft:'4px solid #0e7490'}}>
                    <span style={{fontWeight:700,fontSize:11,color:'#0e7490',width:40,flexShrink:0}}>{getBaseSlot(key)}</span>
                    <div>
                      <span style={{fontWeight:700,fontSize:13}}>{r.name}</span>
                      {r.carType&&<span style={{fontSize:11,color:'#64748b',marginLeft:5}}>{r.carType}</span>}
                      {(w||r.workType)&&<span style={{marginLeft:5,padding:'1px 5px',background:'#ccfbf1',color:'#0f766e',borderRadius:6,fontSize:10,fontWeight:700}}>{w?w.name:r.workType}</span>}
                      {r.content&&<div style={{fontSize:11,color:'#64748b',marginTop:1}}>{r.content}</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {(memos.length>0||!!onEditMemo)&&(
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:800,fontSize:12,color:'#7c3aed',marginBottom:8}}>📝 備考・メモ</div>
              {memos.map((mm,i)=>(
                <div key={i} onClick={()=>{if(onEditMemo)onEditMemo(dk,i);}}
                  style={{padding:'8px 10px',marginBottom:4,background:'#faf5ff',borderRadius:10,border:'1px solid #e9d5ff',fontSize:12,whiteSpace:'pre-wrap',display:'flex',gap:6,alignItems:'flex-start'}}>
                  <span style={{flex:1}}>{mm.content||mm.text||''}</span>
                  {onEditMemo&&<span style={{fontSize:11,color:'#a78bfa',fontWeight:800,flexShrink:0}}>✎</span>}
                </div>
              ))}
              {/* ★スマホからも足せる・直せるようにした（2026-10-03 ユーザー報告） */}
              {onEditMemo&&(
                <div onClick={()=>onEditMemo(dk,null)}
                  style={{marginTop:6,padding:'11px 0',textAlign:'center',borderRadius:12,border:'2px dashed #c4b5fd',background:'#faf5ff',color:'#6d28d9',fontWeight:800,fontSize:13}}>
                  ＋ 備考・メモを追加
                </div>
              )}
            </div>
          )}
          {emptyDay&&(
            <div>
              <div style={{textAlign:'center',color:'#94a3b8',padding:'10px 0 14px',fontSize:13}}>この日の予約はありません</div>
              <button onClick={()=>onGoSchedule(y,m,d)}
                style={{display:'block',width:'100%',padding:'16px 0',borderRadius:14,border:'none',background:sc,color:'white',fontSize:16,fontWeight:900,boxShadow:'0 3px 10px rgba(55,48,163,.3)'}}>✎ 予約・編集</button>
              <div style={{textAlign:'center',fontSize:11,color:'#94a3b8',marginTop:8}}>タップすると、この日のスケジュール画面へ移ります</div>
            </div>
          )}
          {/* ★マイスケジュールは薄紫の箱でくくる（2026-10-01 ユーザー指示）。
              下の「予約を編集」と混同しないよう、見出しに役割も書く。 */}
          {mySchedPanel&&(
            <div style={{marginTop:16,padding:12,background:'#faf5ff',border:'1.5px solid #e9d5ff',borderRadius:12}}>
              <div style={{fontWeight:800,fontSize:12,color:'#5b21b6',marginBottom:8}}>📝 マイスケジュール<span style={{fontWeight:400,color:'#a78bfa'}}> ／ 自分用のメモ</span></div>
              {mySchedPanel}
            </div>
          )}
        </div>
        {/* ★C案（2026-10-01 ユーザー決定）：予約がある日は一番下に貼り付けて、
            車検が何台あってもスクロールしても押せるようにする。予約ゼロの日は本文の真ん中に出す。 */}
        {!emptyDay&&(
          <div style={{flexShrink:0,padding:'10px 16px 14px',borderTop:'1px solid #e2e8f0',background:'rgba(255,255,255,.96)',boxShadow:'0 -4px 14px rgba(0,0,0,.08)'}}>
            <button onClick={()=>onGoSchedule(y,m,d)}
              style={{display:'block',width:'100%',padding:'16px 0',borderRadius:14,border:'none',background:sc,color:'white',fontSize:16,fontWeight:900,boxShadow:'0 3px 10px rgba(55,48,163,.3)'}}>✎ 車検・整備の予約を編集</button>
          </div>

    </div>
  );
};

// ══ 予約入力モーダル（新規/編集/削除 + 代車・レンタカー紐付け）══
// ── ① 納車日を備考へ自動で書く（2026-09-29 ユーザー要望）──────────────
//   翌日以降の納車のときだけ、入庫日の予約の備考（整備は内容）の先頭に「【10/5 納車】」を入れる。
//   当日納車に戻したら、その印は自動で消える。手で書いた文章はそのまま残す。
//   ・入庫日 ＝ 事前入庫日（entryDate）があればその日、無ければその予約が乗っている日
const DLV_NOTE_RE = /【\s*\d{1,2}\/\d{1,2}\s*納車\s*】\s*/g;
const withDeliveryNote = (entry, dk, isInsp) => {
  const e = Object.assign({}, entry || {});
  const field = isInsp ? 'note' : 'content';
  const base = String(e[field] || '').replace(DLV_NOTE_RE, '').replace(/^[ \u3000]+/, '');
  const num = s => { const p = String(s || '').split('-').map(Number); return (p.length === 3 && p[0]) ? p[0] * 10000 + p[1] * 100 + p[2] : 0; };
  const inDay = String(e.entryDate || dk || '');
  const dlv = String(e.deliveryDate || '');
  const later = !!(num(dlv) && num(inDay) && num(dlv) > num(inDay));
  if (!later) { e[field] = base; return e; }
  const p = dlv.split('-');
  e[field] = ('【' + Number(p[1]) + '/' + Number(p[2]) + ' 納車】' + (base ? ' ' + base : ''));
  return e;
};
const EditModal=({mode,initial,vsId,currentUser,staffList,loanerCars,rentalCars,loanerRes,rentalRes,lockedBy,isClosedDk,onSave,onDelete,onClose})=>{
  const isInsp=mode.type==='insp';
  // 休業日には入庫・納車を入れられない（選んだ時点で弾き、元の値に戻す）
  const closedDk=dk=>!!(isClosedDk&&isClosedDk(dk));
  const rejectIfClosed=(dk,what)=>{
    if(!closedDk(dk))return false;
    alert(`🏖 ${dkLabel(dk)} は休業日です。\n${what}日には設定できません（休業日の設定はPC版で変更できます）。`);
    return true;
  };
  const sc=isInsp?'#3730a3':'#0e7490';
  const [form,setForm]=useState(()=>{
    const base={
      ...(isInsp?blankInsp():{name:'',staff:'',carType:'',work:'',loaner:'',loanerId:null,rentalLabel:'',rentalCarId:null,shimi:'',content:'',deliveryDate:'',deliveryTime:'',deliveryNote:'',noteToDelivery:false}),
      staff:currentUser?.name||'',
      ...(initial||{}),
    };
    // 新規車検は入庫日デフォルト＝選択日(車検日)。事前入庫のときだけ手動で前の日付に変える。
    if(isInsp&&mode.isNew&&!base.entryDate)base.entryDate=mode.dk;
    return base;
  });
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState('');
  const dkParts=mode.dk.split('-').map(Number);
  const defDate=`${dkParts[0]}-${String(dkParts[1]).padStart(2,'0')}-${String(dkParts[2]).padStart(2,'0')}`;
  // 代車選択: 'keep'=変更なし / 'none'=なし / 'loaner' / 'rental'
  // ★入庫店舗（2026-10-02 ユーザー指示）。開いた時は今その予約が入っている店。
  //   車検は行の store を見る（1つのデータに両店が入っている）。整備は今開いている店がそのまま。
  const [mvStore,setMvStore]=useState(()=>(isInsp?(normStore(initial&&initial.store)||vsId):vsId));
  // ★整備は日にちと時間を変えられる（2026-10-01 ユーザー指示）。移り先をここで持つ。
  const [mvDk,setMvDk]=useState(mode.dk);
  const [mvSlot,setMvSlot]=useState(()=>getBaseSlot(mode.slot||'')||'');
  // ★車検も日を動かせるようにした（2026-10-04）。整備は日＋時間、車検は日だけ。
  const moved=!mode.isNew&&(isInsp?(mvDk!==mode.dk):(mvDk!==mode.dk||mvSlot!==(getBaseSlot(mode.slot||'')||'')));
  const [carKind,setCarKind]=useState('keep');
  // ★限定＝この車でないとダメな予約。代車スケジュールの最適化で動かさない印。
  //   最初の予約から付けられるようにする（2026-08-27にユーザーが要望）。
  const [carLocked,setCarLocked]=useState(false);
  const [carSel,setCarSel]=useState('');
  const [carFrom,setCarFrom]=useState(form.entryDate?dkToInputDate(form.entryDate):defDate);
  const [carTo,setCarTo]=useState(form.deliveryDate?dkToInputDate(form.deliveryDate):defDate);
  // 事前入庫/納車の手間削減: 貸出日=入庫日(なければ車検作業日) / 返却日=納車日(なければ車検作業日) を自動連動。
  // ＝車を預けている全期間（入庫〜納車）が代車の期間になる。手動で日付を触ったら以降は自動連動を止める。
  const manualDatesRef=useRef(false);
  useEffect(()=>{
    if(manualDatesRef.current)return;
    setCarFrom(form.entryDate?dkToInputDate(form.entryDate):defDate);
    setCarTo(form.deliveryDate?dkToInputDate(form.deliveryDate):defDate);
  },[form.entryDate,form.deliveryDate,mode.dk,carKind]);
  // 開き直した時、既に限定が付いている代車ならスイッチもONで表示する。
  // ★この画面が受け取っているのは loanerRes（現在店舗の代車）。以前ここで loanerResH /
  //   loanerResS を参照してしまい、予約画面を開いた瞬間に画面が真っ白になった（2026-08-27）。
  useEffect(()=>{
    try{
      const bk2=mode.type==='insp'?`insp-${mode.dk}-${mode.idx}`:`sched-${mode.dk}-${mode.slot}`;
      const res=loanerRes||{};
      for(const cid of Object.keys(res))for(const k of Object.keys(res[cid]||{})){
        const r=res[cid][k];
        if(r&&r.bookingKey===bk2){setCarLocked(!!r.locked);return;}
      }
    }catch(e){}
  },[mode.dk,mode.idx,mode.slot,mode.type,loanerRes]);
  const bk=isInsp?`insp-${mode.dk}-${mode.idx}`:`sched-${mode.dk}-${mode.slot}`;
  const currentLoanerLbl=getLoanerLabel(loanerRes,mode.dk,initial?.name,initial?.bookingKey||bk,loanerCars);
  // ★ボタンを「代車なし／代車あり／レンタカー」の3つにした（2026-10-01 ユーザー指示）。
  //   「変更なし」は画面から消したが、中では今までどおり keep（＝まだ触っていない）を初期値に持つ。
  //   開いた時は今の状態のボタンが光って出て、触らなければ代車も期間もそのまま動かない。
  const findCid=(res)=>{
    try{
      const r0=res||{};
      for(const cid of Object.keys(r0))for(const k of Object.keys(r0[cid]||{})){
        const r=r0[cid][k]; if(r&&r.bookingKey===(initial?.bookingKey||bk))return String(cid);
      }
    }catch(e){}
    return '';
  };
  const curCarId=findCid(loanerRes)||(initial&&initial.loanerId!=null?String(initial.loanerId):'');
  const curRentalId=findCid(rentalRes)||(initial&&initial.rentalCarId!=null?String(initial.rentalCarId):'');
  const curKind=((initial&&initial.rentalLabel)||curRentalId)?'rental':(currentLoanerLbl||curCarId)?'loaner':'none';
  const shownKind=carKind==='keep'?curKind:carKind;
  const currentBinding=currentLoanerLbl?`🚗 ${currentLoanerLbl}`:(initial?.rentalLabel||'');
  // 代車期間チェック：スケジュール期間（入庫日→納車日）と代車の貸出期間の不一致を検出（PC版と同方針：アラートのみ・手動修正）。
  const loanerMismatch=(()=>{
    const dkToNum=s=>{const p=String(s||'').split('-').map(Number);return (p.length===3&&!p.some(isNaN))?toNum(p[0],p[1]-1,p[2]):null;};
    // ★レンタカーも見る（2026-10-02）。以前は代車だけで、レンタカーは対象外だったため
    //   「スケジュールは 9/6→10/4 なのにレンタカーは 9/6 の1日だけ」でも何も言わなかった。
    let lf=null,lt=null,isRental=false;
    if(carKind==='loaner'){ lf=dkToNum(carFrom); lt=dkToNum(carTo); }
    else if(carKind==='rental'){ lf=dkToNum(carFrom); lt=dkToNum(carTo); isRental=true; }
    else if(carKind==='keep'){
      for(const cid of Object.keys(loanerRes||{})){
        const hit=Object.values(loanerRes[cid]||{}).find(r=>r&&r.bookingKey===bk);
        if(hit){ lf=toNum(hit.fy,hit.fm,hit.fd); lt=toNum(hit.ty,hit.tm,hit.td); break; }
      }
      if(lf==null)for(const cid of Object.keys(rentalRes||{})){
        const hit=Object.values(rentalRes[cid]||{}).find(r=>r&&r.bookingKey===bk);
        if(hit&&hit.fy!=null){ lf=toNum(hit.fy,hit.fm,hit.fd); lt=toNum(hit.ty??hit.fy,hit.tm??hit.fm,hit.td??hit.fd); isRental=true; break; }
      }
    }
    if(lf==null||lt==null)return null; // なし／車が未割当 → 見比べられない
    const sf=dkToNum(form.entryDate||mode.dk), st=dkToNum(form.deliveryDate||mode.dk);
    if(sf==null||st==null)return null;
    if(lf===sf&&lt===st)return null; // 一致
    return {sf,st,lf,lt,isRental};
  })();
  const mmFmt=n=>n==null?'—':`${Math.floor(n/100)%100}/${n%100}`;
  const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return{y,m0:m-1,d};};
  const availabilityOf=(kind,carId)=>{
    const from=parseD(carFrom),to=parseD(carTo);
    const fromN=toNum(from.y,from.m0,from.d),toN=toNum(to.y,to.m0,to.d);
    const res=kind==='loaner'?loanerRes:rentalRes;
    for(const r of Object.values(res?.[carId]||{})){
      if(r&&r.bookingKey!==bk&&rangesOverlap(r,fromN,toN))return r.user||'使用中';
    }
    return null;
  };
  const doSave=async()=>{
    if(!form.name){setErr('氏名を入力してください');return;}
    if(!form.carType){setErr('車種を入力してください');return;}
    if(isInsp){
      if(!Number(form.course)){setErr('コースを選択してください');return;}
      if(!form.time){setErr('入庫時間を選択してください');return;}
    }else{
      if(!form.work){setErr('作業内容を選択してください');return;}
    }
    let loanerAction=null;
    if(carKind==='none')loanerAction={kind:'none'};
    if(carKind==='loaner'||carKind==='rental'){
      if(!carSel){setErr(carKind==='loaner'?'代車を選択してください':'レンタカーを選択してください');return;}
      const from=parseD(carFrom),to=parseD(carTo);
      if(toNum(from.y,from.m0,from.d)>toNum(to.y,to.m0,to.d)){setErr('代車の期間（開始日と返却日）が逆です');return;}
      const busy=availabilityOf(carKind,carSel);
      if(busy){setErr(`その期間は使用中です（${busy}）`);return;}
      loanerAction={kind:carKind,carId:carSel,from,to,locked:carLocked};
    }
    if(loanerMismatch&&!window.confirm(`⚠ ${loanerMismatch.isRental?'レンタカー':'代車'}の期間がスケジュールと一致していません。\n\nスケジュール（入庫日→納車日）：${mmFmt(loanerMismatch.sf)}〜${mmFmt(loanerMismatch.st)}\n${loanerMismatch.isRental?'レンタカー':'代車'}の貸出期間　　　　　　：${mmFmt(loanerMismatch.lf)}〜${mmFmt(loanerMismatch.lt)}\n\nこのまま保存しますか？\n（合わせるには選び直し、不要なら「代車なし」にしてください）`))return;
    setErr('');
    // 受付は即時（モーダルはonSave側で閉じる）。サーバー保存はバックグラウンドで継続し、
    // 結果は画面上部のバナーで通知される。ここで捕まえるのは事前チェック（入庫制限等）のみ。
    // ★整備の移動：移り先を渡す。代車が付いたまま日を動かす時は、同じ車を新しい日付で付け替える
    //   （付け替えないと、代車の予約だけ元の日に取り残される）
    const outForm=isInsp
      ?{...form,store:mvStore,_dk:mvDk}                // 車検は行の store と移り先の日
      :{...form,_dk:mvDk,_slot:mvSlot,_store:mvStore};  // 整備は移り先（日・時間・店）を渡す
    if(moved&&!loanerAction&&curKind!=='none'){
      const cid=curKind==='rental'?curRentalId:curCarId;
      if(cid){
        const p=String(mvDk).split('-').map(Number);
        const d1={y:p[0],m0:p[1]-1,d:p[2]};
        loanerAction={kind:curKind,carId:cid,from:d1,to:d1,locked:carLocked};
      }
    }
    try{onSave(withDeliveryNote(outForm,mvDk,isInsp),loanerAction);}
    catch(e){setErr(String(e?.message||e));return;}
  };
  const doDelete=()=>{
    if(!window.confirm(`「${initial?.name||'この予約'}」を削除しますか？\n（紐付いた代車予約も削除されます）`))return;
    try{onDelete();}
    catch(e){setErr('削除に失敗しました: '+(e?.message||e));}
  };
  const LBL={fontSize:11,fontWeight:800,color:'#475569',display:'block',marginBottom:4};
  const INP={width:'100%',padding:'10px 12px',border:'2px solid #e2e8f0',borderRadius:10,outline:'none',background:'white'};
  const staffNames=[...new Set([...(staffList||[]).map(s=>s.name),currentUser?.name].filter(Boolean))];
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:300,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={saving?undefined:onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'20px 20px 0 0',maxHeight:'92vh',display:'flex',flexDirection:'column',boxShadow:'0 -8px 40px rgba(0,0,0,.25)',animation:'sheetUp .22s ease'}}>
        <div style={{padding:'13px 18px 10px',borderBottom:`3px solid ${sc}`,display:'flex',alignItems:'center',gap:8}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:900,fontSize:15.5,color:sc,whiteSpace:'nowrap'}}>{isInsp?'🚗 車検':'⏰ 整備'}{mode.isNew?'の新規予約':'の編集'}</div>
            <div style={{fontSize:11,color:'#94a3b8',whiteSpace:'nowrap'}}>{dkParts[1]}月{dkParts[2]}日{!isInsp&&mode.slot?` ${getBaseSlot(mode.slot)}〜`:''}</div>
          </div>
          {/* ★入庫店舗（2026-10-02 ユーザー決定・①案）。めったに使わないので小さく、行は増やさない */}
          <div style={{flexShrink:0,display:'flex',alignItems:'center',gap:4}}>
            <span style={{fontSize:9.5,fontWeight:800,color:'#64748b',lineHeight:1.15,textAlign:'center',whiteSpace:'nowrap'}}>入庫<br/>店舗</span>
            <button onClick={()=>setMvStore(p=>p==='honten'?'sanda':'honten')} disabled={saving}
              title="押すと本店⇄三田店が入れ替わります"
              style={{padding:'4px 10px',borderRadius:7,fontSize:11.5,fontWeight:800,whiteSpace:'nowrap',
                border:`2px solid ${mvStore==='sanda'?'#dc2626':'#1d4ed8'}`,
                background:mvStore==='sanda'?'#fee2e2':'#dbeafe',
                color:mvStore==='sanda'?'#991b1b':'#1e40af'}}>
              🏪 {mvStore==='sanda'?'三田店':'本店'} ▾
            </button>
          </div>
          <button onClick={onClose} disabled={saving} style={{width:30,height:30,borderRadius:'50%',background:'#f1f5f9',border:'none',fontSize:15,color:'#64748b',flexShrink:0}}>✕</button>
        </div>
        {lockedBy&&<div style={{margin:'10px 16px 0',padding:'8px 12px',background:'#fff7ed',border:'1.5px solid #fed7aa',borderRadius:10,fontSize:12,color:'#92400e',fontWeight:700}}>🔒 {lockedBy}さんが編集中の可能性があります。保存は慎重に。</div>}
        <div style={{overflowY:'auto',WebkitOverflowScrolling:'touch',flex:1,padding:'12px 16px 4px',display:'flex',flexDirection:'column',gap:12}}>
          <div>
            <label style={LBL}>氏名 *</label>
            <input value={form.name||''} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="お客様名" style={INP}/>
          </div>
          <div style={{display:'flex',gap:10}}>

const ScheduleView=({onEditMemo,otherView,inspData,schedDataH,schedDataS,memoDataH,memoDataS,loanerResH,loanerResS,loanerCarsH,loanerCarsS,vsId,initDate,onOpenEdit,onToggleArrived,arrivedOv,schedRestrictions,staffList,dayOffData,closedDays,closedDates,overrideOpen,inspLimits})=>{
  const today=new Date();
  const [ds,setDs]=useState({y:today.getFullYear(),m:today.getMonth(),d:today.getDate()});
  useEffect(()=>{if(initDate)setDs(initDate);},[initDate]);
  const {y,m,d}=ds;
  const dk=`${y}-${m+1}-${d}`;
  const sc=vsId==='honten'?'#1d4ed8':'#dc2626';
  const moveDate=dir=>{const dt=new Date(y,m,d+dir);setDs({y:dt.getFullYear(),m:dt.getMonth(),d:dt.getDate()});};
  const isToday_=y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();
  const dow=new Date(y,m,d).getDay();
  // 元配列のindexを保持したまま表示用に絞り込む（編集・代車紐付けにindexが必須）
  const allRows=(inspData[dk]||[]);
  const irows=allRows.map((r,idx)=>({r,idx})).filter(({r})=>r&&r.name&&r.bookingStatus!=='cancelled');
  const own=irows.filter(({r})=>!normStore(r.store)||normStore(r.store)===vsId);
  const other=irows.filter(({r})=>normStore(r.store)&&normStore(r.store)!==vsId);
  const sorted=[...own,...other];
  const sd=vsId==='honten'?schedDataH:schedDataS;
  const memos=((vsId==='honten'?memoDataH:memoDataS)[dk]||[]);
  const myLoanerRes=vsId==='honten'?loanerResH:loanerResS;
  const myCars=vsId==='honten'?loanerCarsH:loanerCarsS;
  const newInspIdx=(()=>{let i=0;while(i<allRows.length&&allRows[i]&&allRows[i].name)i++;return i;})();
  // 休業日は新規予約を追加できない（PC版handleOpenModalと同じ: 既存予約の編集は休業日でも開ける）
  const isHoliday=calIsClosed(new Date(y,m,d),closedDays||[],closedDates||[],overrideOpen||[]);
  // 台数制限を掛けた日で上限に達していたら車検の新規入力をブロック（制限なしの日は従来どおり7台目=承認待ち）
  const dayLimit=(inspLimits||{})[dk];
  const inspActive=allRows.filter(r=>r&&r.name&&r.bookingStatus!=='cancelled').length;
  const inspLimitFull=dayLimit!=null&&inspActive>=dayLimit;
  // ★「＋ 車検を追加」はゼロの時と一覧の下の2か所から呼ぶので、まとめ役にした（2026-10-01）
  const addInspNew=()=>{
    if(isHoliday){blockNew();return;}
    if(inspLimitFull){alert(`🚫 ${m+1}/${d} は台数制限（最大${dayLimit}台）に達しているため、車検の予約はできません。`);return;}
    onOpenEdit({type:'insp',dk,idx:newInspIdx,isNew:true});
  };
  const blockNew=()=>alert(`🏖 ${m+1}月${d}日は休業日です。\nこの日には新規の予約を追加できません（休業日の設定はPC版で変更できます）。`);
  const restr=(schedRestrictions||{})[dk];
  const [showRestr,setShowRestr]=useState(false); // 入庫制限バッジをタップした時の内容ポップアップ
  useEffect(()=>{setShowRestr(false);},[dk]);
  const restrExemptIds=restrExempt(restr);
  const restrOkWorks=WORKS.filter(w=>restrExemptIds.includes(w.id));
  const restrNgWorks=WORKS.filter(w=>!restrExemptIds.includes(w.id));
  const toMinR=t=>{const[hh,mm]=String(t).split(':').map(Number);return hh*60+mm;};
  const isSlotRestricted=slot=>{
    try{
      if(!restrHas(restr)||isSpecialSlot(slot))return false;
      const s=toMinR(slot);
      return restrCovers(restr,getBaseSlot(slot));
    }catch(e){return false;}
  };
  return(

          const dx=e.changedTouches[0].clientX-(e.currentTarget._sx||0);
          const dy=e.changedTouches[0].clientY-(e.currentTarget._sy||0);

        {(()=>{
          const storeHoliday=calIsClosed(new Date(y,m,d),closedDays||[],closedDates||[],overrideOpen||[]);
          if(storeHoliday)return null;
          const offs=(dayOffData||{})[dk]||[];
          const working=(staffList||[]).filter(s=>s&&s.name&&!offs.includes(s.name));
          if(working.length===0)return null;
          const capOf=s=>s.capabilities||getDefaultCapabilities(s.badge||'mechanic');
          const frontCount=working.filter(s=>{const c=capOf(s);return c.insp_front||c.sched_front;}).length;
          const toMinA=t=>{if(!t)return null;const mt=String(t).match(/(\d+):(\d+)/);if(!mt)return null;return parseInt(mt[1])*60+parseInt(mt[2]);};
          const myInsps=allRows.filter(r=>r&&r.name&&!r.pendingApproval&&((normStore(r.store)||'honten')===vsId));
          const insp900=myInsps.filter(r=>{const mm=toMinA(r.time);return mm!=null&&mm>=540&&mm<570;}).length;
          const insp930=myInsps.filter(r=>{const mm=toMinA(r.time);return mm!=null&&mm>=570&&mm<600;}).length;
          const day=sd[dk]||{};
          const countSlot=base=>[base,...Object.keys(day).filter(k=>k.startsWith(base+'__'))].filter(k=>day[k]&&day[k].name).length;
          const alerts=[
            {label:'9:00枠',insp:insp900,sched:countSlot('09:00')},
            {label:'9:30枠',insp:insp930,sched:countSlot('09:30')},
          ].map(a=>({...a,total:a.insp+a.sched}))
           .filter(a=>a.total>0&&a.total>=frontCount);

          return(
            <div style={{margin:'10px 12px 0',display:'flex',flexDirection:'column',gap:5}}>

                  <div key={label} style={{display:'flex',alignItems:'center',gap:7,padding:'8px 11px',background:isOver?'#fff1f2':'#fffbeb',border:`2px solid ${isOver?'#fca5a5':'#fcd34d'}`,borderRadius:10}}>

                      <div style={{fontSize:10,color:isOver?'#9f1239':'#92400e',marginTop:1,display:'flex',gap:7,flexWrap:'wrap'}}>
                        <span>🚗 車検 <b>{insp}</b></span><span>⏰ 整備 <b>{sched}</b></span><span>＝ 合計 <b>{total}</b></span>

                        {isOver&&<span style={{fontWeight:800,color:'#dc2626'}}>→ {total-frontCount}件オーバー</span>}
                      </div>
                    </div>
                  </div>

              })}
            </div>

            {dayLimit!=null&&<span style={{background:'#fee2e2',color:'#dc2626',border:'1px solid #fca5a5',borderRadius:10,padding:'1px 8px',fontSize:10,fontWeight:800}}>台数制限 最大{dayLimit}台</span>}

          </div>
          {/* ★「＋ 追加」は右端の小さいボタンをやめ、中心部に大きく出す（2026-10-01 ユーザー指示）。

                {isHoliday?'休業日です':inspLimitFull?'🚫 予約できません':'＋ 車検を追加'}</button>
            </div>
          ):
            sorted.map(({r,idx},i)=>{
              const c=COURSES.find(co=>co.id===Number(r.course));
              const isOther=normStore(r.store)&&normStore(r.store)!==vsId;
              // ★入庫済みチェック。押した直後は手元の保持を優先（古いキャッシュで点滅しないように）
              const _ovk=dk+'|'+(r.seq||r.custId||r.name);
              const _arr=(arrivedOv&&_ovk in arrivedOv)?arrivedOv[_ovk]:!!r.arrived;
              // PC版と同じ解決順（rentalLabel → 代車予約(lres) → 行が持つloaner文字列）。
              // 代車予約が無く loaner 文字列だけ持つ行があるため、r.loaner へのフォールバックは必須。
              const loaner=getLoanerLabel(myLoanerRes,dk,r.name,r.bookingKey||`insp-${dk}-${idx}`,myCars)||'';
              return(
                <div key={idx} onClick={()=>!isOther&&onOpenEdit({type:'insp',dk,idx,isNew:false})}

                    <span onClick={e=>{if(!isOther&&onToggleArrived){e.preventDefault();e.stopPropagation();onToggleArrived('insp',dk,idx);}}}

                  </div>

              );

          {sorted.length>0&&(
            <button onClick={addInspNew} disabled={isHoliday||inspLimitFull}
              style={{display:'block',width:'100%',marginTop:2,padding:'15px 0',borderRadius:14,background:'white',
                border:`2.5px dashed ${(isHoliday||inspLimitFull)?'#cbd5e1':'#a5b4fc'}`,
                color:(isHoliday||inspLimitFull)?'#94a3b8':'#3730a3',fontSize:15,fontWeight:900}}>
              {isHoliday?'休業日です':inspLimitFull?'🚫 予約できません':'＋ 車検を追加'}</button>

        </div>
        <div style={{margin:'12px 12px 0'}}>

            <span style={{fontSize:10,fontWeight:700,color:'#475569'}}>{otherView?'他の店は閲覧のみ（車検は編集できます）':'空き枠タップで追加'}</span>
            {restr&&(
              <span onClick={()=>setShowRestr(true)}
                style={{display:'flex',alignItems:'center',gap:3,padding:'2px 8px',background:'#fee2e2',border:'2px solid #ef4444',borderRadius:6,fontWeight:700,color:'#dc2626',fontSize:10}}>
                🚫 入庫制限 {restrLabels(restr).join('／')}
                <span style={{marginLeft:2,fontSize:9,color:'#b91c1c'}}>タップで内容</span>
              </span>
            )}
          </div>
          {/* 入庫制限の内容（バッジをタップで表示。PC版のホバーポップアップと同じ内容＋閉じるボタン） */}
          {restr&&showRestr&&(
            <div onClick={()=>setShowRestr(false)}
              style={{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',zIndex:9998,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>

                <div style={{fontWeight:900,fontSize:14,color:'#dc2626',marginBottom:10}}>🚫 入庫制限　{restrLabels(restr).join('　／　')}</div>

                {restrOkWorks.length===0
                  ?<div style={{fontSize:12,color:'#64748b',marginBottom:10}}>なし（すべて入庫できません）</div>

                        <span style={{display:'inline-block',padding:'2px 9px',background:'#ecfdf5',border:'1px solid #6ee7b7',borderRadius:20,fontSize:11,fontWeight:800,color:'#047857'}}>{w.name}</span>
                      </li>
                    ))}
                  </ul>}
                <div style={{fontSize:12,fontWeight:800,color:'#b91c1c',marginBottom:5}}>🚫 入庫できない作業（制限中）</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:12}}>
                  {restrNgWorks.length===0
                    ?<span style={{fontSize:12,color:'#64748b'}}>なし（すべて制限解除）</span>
                    :restrNgWorks.map(w=><span key={w.id} style={{padding:'2px 8px',background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:20,fontSize:11,fontWeight:700,color:'#b91c1c'}}>{w.name}</span>)}
                </div>
                <button onClick={()=>setShowRestr(false)}
                  style={{width:'100%',padding:'11px 0',borderRadius:10,border:'none',background:'#f1f5f9',color:'#475569',fontWeight:800,fontSize:13}}>閉じる</button>
              </div>
            </div>
          )}
          {/* 事前入庫（この日に入庫する別日の車検）を派生表示。タップで車検を開く */}
          {(()=>{
            const dos=[];
            Object.keys(inspData||{}).forEach(wdk=>{ if(wdk===dk)return;
              (inspData[wdk]||[]).forEach((r,ix)=>{ if(!r||!r.name||r.entryDate!==dk||r.bookingStatus==='cancelled')return;
                if((normStore(r.store)||'honten')!==vsId)return;
                dos.push({r,wdk,ix});
              });
            });
            if(dos.length===0)return null;
            return(
              <div style={{margin:'0 0 8px',background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:12,padding:'8px 10px'}}>
                <div style={{fontWeight:900,fontSize:12,color:'#c2410c',marginBottom:4}}>🚗 事前入庫（{dos.length}件）</div>
                {dos.map(({r,wdk,ix})=>{
                  const wl=wdk.split('-');
                  const loaner=r.rentalLabel||getLoanerLabel(myLoanerRes,wdk,r.name,r.bookingKey||`insp-${wdk}-${ix}`,myCars)||'';
                  return(
                  <div key={wdk+'-'+ix} onClick={()=>onOpenEdit({type:'insp',dk:wdk,idx:ix,isNew:false})}
                    style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap',padding:'6px 2px',borderTop:'1px dashed #fed7aa',cursor:'pointer'}}>

                    {r.carType&&<span style={{fontSize:11,color:'#64748b'}}>🚗{r.carType}</span>}
                    {loaner&&<span style={{fontSize:11,color:'#0284c7'}}>{!r.rentalLabel&&getLoanerLocked(myLoanerRes,wdk,r.name,r.bookingKey||`insp-${wdk}-${ix}`)&&'🔒 '}{loaner}</span>}

                  </div>

              </div>
            );
          })()}
          {/* 納車（この日に納車する車検・予定）を派生表示。タップで元の予約を開く。deliveryDateは任意項目 */}
          {(()=>{
            const dls=[];
            Object.keys(inspData||{}).forEach(wdk=>{
              (inspData[wdk]||[]).forEach((r,ix)=>{ if(!r||!r.name||r.deliveryDate!==dk||r.bookingStatus==='cancelled')return;
                if((normStore(r.store)||'honten')!==vsId)return;
                dls.push({r,wdk,ix,kind:'insp'});
              });
            });
            Object.keys(sd||{}).forEach(wdk=>{
              Object.keys(sd[wdk]||{}).forEach(sk=>{
                const r=sd[wdk][sk];
                if(!r||!r.name||r.deliveryDate!==dk)return;
                if(wdk===dk&&getBaseSlot(sk)===getBaseSlot(r.deliveryTime||'未定'))return; // 自分自身の枠と重なる時は出さない
                dls.push({r,wdk,sk,kind:'sched'});
              });
            });
            if(dls.length===0)return null;
            const slotIx=v=>{const i=SCHED_SLOTS.indexOf(getBaseSlot(v||'未定'));return i<0?999:i;};
            dls.sort((a,b)=>slotIx(a.r.deliveryTime)-slotIx(b.r.deliveryTime));
            return(

                {dls.map((d,di)=>{

                    ?(r.rentalLabel||getLoanerLabel(myLoanerRes,d.wdk,r.name,`insp-${d.wdk}-${d.ix}`,myCars)||'')

                  return(
                  <div key={'dl-'+d.kind+'-'+d.wdk+'-'+(d.ix??d.sk)+'-'+di}
                    onClick={()=>d.kind==='insp'?onOpenEdit({type:'insp',dk:d.wdk,idx:d.ix,isNew:false}):onOpenEdit({type:'sched',dk:d.wdk,slot:d.sk,isNew:false})}
                    style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap',padding:'6px 2px',borderTop:'1px dashed #a7f3d0',cursor:'pointer'}}>

                    {loaner&&<span style={{fontSize:11,color:'#0284c7'}}>{!r.rentalLabel&&d.kind==='insp'&&getLoanerLocked(myLoanerRes,d.wdk,r.name,`insp-${d.wdk}-${d.ix}`)&&'🔒 '}{loaner}</span>}
                    {/* ★納車日の備考（濃い字）と入庫時の備考（薄い緑・スイッチが入っている時だけ）（2026-10-02・C案） */}
