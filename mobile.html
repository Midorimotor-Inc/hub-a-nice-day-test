                      const p=drillDate.split('-').map(Number); const dw=DOWJ[new Date(p[0],p[1]-1,p[2]).getDay()];
                      return <div style={{marginTop:10,border:'1px solid #e5e7eb',borderRadius:10,padding:'10px 12px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:9}}><button onClick={()=>setDrillDate(null)} style={{width:26,height:26,borderRadius:7,border:'1px solid #d7dbe2',background:'white',color:'#64748b',fontSize:14}}>‹</button><div style={{fontSize:14,fontWeight:800}}>{p[1]}/{p[2]}（{dw}）</div><div style={{marginLeft:'auto',fontSize:11,fontWeight:700,color:'#64748b'}}>車検 {rows.length}台</div></div>
                        {missCnt>0&&<div style={{background:'#fbeed5',border:'1px solid #e6c98a',borderRadius:9,padding:'8px 10px',marginBottom:8,fontSize:11.5,color:'#7a4d06',fontWeight:700}}>⚠️ {missCnt}件が今のデータにありません。「足す」で今の予約を消さずに戻せます。</div>}
                        {rows.length===0?<div style={{fontSize:12,color:'#94a3b8'}}>予約なし</div>:
                         <div style={{display:'flex',flexDirection:'column',gap:6}}>
                           {rows.map((r,i)=>{ const isConf=r.bookingStatus==='confirmed'&&!r.pendingApproval; const here=isHere(r); const just=!!added[rowSig(r)];
                             return <div key={i} style={{border:`1px solid ${here?'#eef2f8':'#e6c98a'}`,borderRadius:9,padding:'7px 10px',display:'flex',gap:9,alignItems:'flex-start',background:here?'white':'#fffaf0'}}>
                               <div style={{fontSize:13,fontWeight:800,color:'#173da8',width:42,flexShrink:0}}>{r.time||'—'}</div>
                               <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:800}}>{r.name}</div>{r.carType&&<div style={{fontSize:11,color:'#64748b'}}>{r.carType}</div>}{r.loaner&&<div style={{fontSize:10.5,color:'#0e9d58',fontWeight:700,marginTop:1}}>🔑 {r.loaner}</div>}</div>
                               {here?(just?<span style={{fontSize:10,fontWeight:800,padding:'2px 8px',borderRadius:999,alignSelf:'center',whiteSpace:'nowrap',background:'#e4f6ec',color:'#0e9d58'}}>✓足しました</span>:<span style={{fontSize:10,fontWeight:800,padding:'2px 8px',borderRadius:999,alignSelf:'center',whiteSpace:'nowrap',background:isConf?'#e4f6ec':'#fbeed5',color:isConf?'#0e9d58':'#c9760a'}}>{isConf?'確定':r.pendingApproval?'承認待ち':'仮'}</span>):<button onClick={()=>doAddBack(drillDate,r)} style={{alignSelf:'center',flexShrink:0,fontSize:11,fontWeight:800,padding:'5px 12px',borderRadius:999,border:'none',background:'#1d4ed8',color:'white'}}>＋足す</button>}
                             </div>;
                           })}
                         </div>}
                      </div>;
                    }
                    const dates=Object.keys(insp).filter(d=>(insp[d]||[]).some(r=>r&&r.name&&r.bookingStatus!=='cancelled')).sort();
                    return <div style={{marginTop:10,border:'1px solid #e5e7eb',borderRadius:10,padding:'10px 12px'}}>
                      <div style={{fontSize:11.5,fontWeight:800,color:'#334155',marginBottom:6}}>車検予約が入っていた日（{dates.length}日分・押すと明細）</div>
                      {dates.length===0?<div style={{fontSize:12,color:'#94a3b8'}}>なし</div>:
                       <div style={{display:'flex',flexWrap:'wrap',gap:5,maxHeight:120,overflowY:'auto'}}>{dates.map(d=>{const c=(insp[d]||[]).filter(r=>r&&r.name&&r.bookingStatus!=='cancelled').length;return <button key={d} onClick={()=>setDrillDate(d)} style={{fontSize:11,background:'#eff4ff',border:'1px solid #c7d7f5',borderRadius:14,padding:'2px 8px',color:'#1e40af',fontWeight:600}}>{d}：{c}台</button>;})}</div>}
                    </div>;
                  })()}
                </>}
               </>}
            </>
          )}
        </div>
      </div>
    </div>
  );
};


// ══════════════════════════════════════════════════════════════════
//  検索（v2.95・2026-09-24）：PC のスケジュール画面の検索と同じ中身をスマホでも。
//  氏名・車種・顧客No・電話で、車検（保管箱の過去分も）・整備（両店）・顧客ファイルから探す。
// ══════════════════════════════════════════════════════════════════
const _hubNorm=s=>String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s　\-‐ー－()（）]/g,'');
const _dkNum=dk=>{const p=String(dk).split('-').map(Number);return p.length===3?p[0]*10000+p[1]*100+p[2]:0;};
const _dkLab=dk=>{const p=String(dk).split('-').map(Number);if(p.length!==3)return String(dk||'');const d=new Date(p[0],p[1]-1,p[2]);const y=p[0]!==new Date().getFullYear()?String(p[0]).slice(2)+'/':'';return`${y}${p[1]}/${p[2]}（${'日月火水木金土'[d.getDay()]}）`;};
const _storeLab=st=>(st==='sanda'||st==='三田店')?'三田店':'本店';
const SHEET={position:'fixed',inset:0,zIndex:7000,background:'white',display:'flex',flexDirection:'column'};
const sheetHeadStyle=bg=>({flexShrink:0,background:bg||UI_HEAD,color:'white',padding:'calc(env(safe-area-inset-top,0px) + 9px) 12px 9px',display:'flex',alignItems:'center',gap:8});
const XBTN={flexShrink:0,width:30,height:30,borderRadius:'50%',border:'none',background:'rgba(255,255,255,.18)',color:'white',fontSize:15};
const CHIP=(on,c)=>({padding:'5px 12px',borderRadius:16,fontSize:11.5,fontWeight:800,border:`1.5px solid ${on?(c||'#1d4ed8'):'#cbd5e1'}`,background:on?(c||'#1d4ed8'):'white',color:on?'white':'#475569'});

const FindSheet=({inspData,schedDataH,schedDataS,cfx,custBusy,onGo,onGoCust,onClose,headBg})=>{
  const [q,setQ]=useState('');
  const [tab,setTab]=useState('all');
  const inputRef=useRef(null);
  useEffect(()=>{const t=setTimeout(()=>{try{inputRef.current&&inputRef.current.focus();}catch(e){}},120);return()=>clearTimeout(t);},[]);
  const nq=_hubNorm(q);
  const hit=(...vals)=>!!nq&&vals.some(v=>v!=null&&_hubNorm(v).includes(nq));
  // 車検
  const inspHits=[];
  if(nq)Object.keys(inspData||{}).forEach(dk=>{(inspData[dk]||[]).forEach((r,ix)=>{
    if(!r||!r.name)return;
    if(hit(r.name,r.carType,r.no,r.note))inspHits.push({dk,ix,r,n:_dkNum(dk)});
  });});
  // 整備（両店）
  const schedHits=[];
  if(nq)[['honten',schedDataH],['sanda',schedDataS]].forEach(([st,sd])=>{Object.keys(sd||{}).forEach(dk=>{Object.keys(sd[dk]||{}).forEach(sk=>{
    const r=sd[dk][sk];if(!r||!r.name)return;
    if(hit(r.name,r.carType,r.content,r.work))schedHits.push({dk,sk,r,store:st,n:_dkNum(dk)});
  });});});
  // 顧客は索引（24ヶ月ぶん）から。同じ人はまとめて一番新しい月を出す
  const custHits=nq?cfxSearch(cfx||[],q,600):[];   // ★上限を上げて PC と揃える（2026-10-02）
  // ★PC と同じ出し方：人数を主に、カッコで行数（同じ人が複数の月に居るぶん）（2026-10-02）
  const custRows=custHits.reduce((a,g)=>a+1+((g.past&&g.past.length)||0),0);
  const custLabel=nq?(custRows===custHits.length?String(custHits.length):custHits.length+'件（同じ内容の重複'+(custRows-custHits.length)+'件を1つに）'):'';
  const byDate=(a,b)=>b.n-a.n;
  inspHits.sort(byDate);schedHits.sort(byDate);
  const total=inspHits.length+schedHits.length+custHits.length;
  const showI=tab==='all'||tab==='insp',showS=tab==='all'||tab==='sched',showC=tab==='all'||tab==='cust';
  const mark=t0=>{
    const t=String(t0==null?'':t0);if(!nq||!t)return t;
    const j=t.toLowerCase().normalize('NFKC').indexOf(nq);if(j<0)return t;
    return<>{t.slice(0,j)}<mark style={{background:'#fef08a',padding:'0 1px',borderRadius:3}}>{t.slice(j,j+nq.length)}</mark>{t.slice(j+nq.length)}</>;
  };
  const Pill=({c,children})=><span style={{flexShrink:0,fontSize:9.5,fontWeight:800,borderRadius:20,padding:'1px 7px',color:'white',background:c}}>{children}</span>;
  const Row=({onClick,date,pill,name,sub})=>(
    <div onClick={onClick} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',borderBottom:'1px solid #f1f5f9'}}>
      <span style={{flexShrink:0,width:74,fontSize:11,fontWeight:800,color:'#1d4ed8'}}>{date}</span>
      {pill}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13.5,fontWeight:800,color:'#111827'}}>{name}</div>
        <div style={{fontSize:10.5,color:'#64748b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sub}</div>
      </div>
    </div>
  );
  return(
    <div style={SHEET}>
      <div style={sheetHeadStyle(headBg)}>
        <span style={{fontSize:16}}>🔍</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:800}}>検索</div>
          <div style={{fontSize:10,opacity:.8}}>氏名・車種・顧客No・電話で、予約と顧客リストから探します</div>
        </div>
        <button onClick={onClose} style={XBTN}>✕</button>
      </div>
      <div style={{flexShrink:0,padding:10,borderBottom:'1px solid #e5e7eb',background:'#f8fafc'}}>
        <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)} placeholder="例：セリエ／ハイエース／1386／090"
          style={{width:'100%',boxSizing:'border-box',padding:'11px 12px',border:'2px solid #93c5fd',borderRadius:10,fontSize:16,outline:'none'}}/>
        <div style={{display:'flex',gap:5,marginTop:8,overflowX:'auto'}}>
          <button onClick={()=>setTab('all')} style={CHIP(tab==='all')}>すべて {nq?total:''}</button>
          <button onClick={()=>setTab('insp')} style={CHIP(tab==='insp','#3730a3')}>車検 {nq?inspHits.length:''}</button>
          <button onClick={()=>setTab('sched')} style={CHIP(tab==='sched','#0e7490')}>整備 {nq?schedHits.length:''}</button>
          <button onClick={()=>setTab('cust')} style={CHIP(tab==='cust','#047857')}>顧客 {custLabel}</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
        {!nq&&<div style={{padding:'34px 18px',textAlign:'center',color:'#94a3b8',fontSize:12.5,lineHeight:1.8}}>
          1文字からその場で絞り込まれます{custBusy?<><br/>（顧客リストを読み込んでいます…）</>:null}</div>}
        {!!nq&&total===0&&!custBusy&&<div style={{padding:'34px 18px',textAlign:'center',color:'#94a3b8',fontSize:12.5}}>見つかりませんでした</div>}
        {showI&&inspHits.slice(0,60).map(h=>(
          <Row key={'i'+h.dk+'-'+h.ix} onClick={()=>onGo(h.dk)} date={_dkLab(h.dk)}
            pill={<Pill c={h.r.bookingStatus==='cancelled'?'#9ca3af':'#c2410c'}>{h.r.bookingStatus==='cancelled'?'取消':'車検'}</Pill>}
            name={mark(h.r.name)}
            sub={<>{mark(h.r.carType||'')}{h.r.carType?' ・ ':''}{_storeLab(h.r.store)}{h.r.time?' ・ '+h.r.time:''}{h.r.no?' ・ No.'+h.r.no:''}</>}/>
        ))}
        {showS&&schedHits.slice(0,60).map(h=>(
          <Row key={'s'+h.store+h.dk+'-'+h.sk} onClick={()=>onGo(h.dk)} date={_dkLab(h.dk)}
            pill={<Pill c="#0e7490">整備</Pill>} name={mark(h.r.name)}
            sub={<>{mark(h.r.carType||'')}{h.r.carType?' ・ ':''}{_storeLab(h.store)} ・ {getBaseSlot(h.sk)}{h.r.work?' ・ '+h.r.work:''}</>}/>
        ))}
        {showC&&custHits.slice(0,80).map((g,i)=>(
          <Row key={'c'+g.key+'-'+i} onClick={()=>onGoCust(g.now)} date={g.now.f||''}
            pill={<Pill c="#047857">顧客</Pill>} name={mark(g.now.n)}
            sub={<>{mark(g.now.c||'')}{g.now.no!==''?' ・ No.'+g.now.no:''}{g.now.p?' ・ '+g.now.p:''}{g.past.length?' ・ 前回 '+g.past[0].f:''}</>}/>
        ))}
        {showC&&!!nq&&custBusy&&<div style={{padding:'12px 16px',fontSize:11.5,color:'#94a3b8'}}>顧客リストを読み込んでいます…</div>}
        <div style={{height:40}}/>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════════════
//  顧客（v2.98・2026-09-26）：入口は「探す」。24ヶ月ぶんの索引から横断検索し、
//  選んだ人の月ファイルだけを読んで詳細・予約に進む。
//  「月ごと（DM）」に切り替えれば、今までどおり その月に DM を出した方の一覧・絞り込み。
//  取り込み・削除・列の直しは PC の顧客リストのまま。
// ══════════════════════════════════════════════════════════════════
const CustSheet=({names,cache,busy,loadingName,cfx,cfxBusy,initCust,initMode,vsId,isClosedDk,onNeedFile,onBook,onTemp,onClose,onReload,headBg,embedded})=>{
  const [mode,setMode]=useState(initMode||'find');
  const [q,setQ]=useState('');
  const [file,setFile]=useState(()=>(initCust&&initCust._file)||(names[0]&&names[0].name)||'');
  const [filt,setFilt]=useState('all');
  const [sel,setSel]=useState(initCust||null);
  const [want,setWant]=useState(null);        // 読み込み待ちの人 {file,custId}
  const [bookDk,setBookDk]=useState('');
  const [bookOpen,setBookOpen]=useState(false);
  // 月の一覧が後から届いた時は、一番新しい月を選んでおく
  useEffect(()=>{ if(!file&&names&&names.length)setFile(names[0].name); },[names,file]);
  // 月ごとを開いたら、その月だけ読む
  useEffect(()=>{ if(mode==='month'&&file&&!cache[file])onNeedFile(file); },[mode,file,cache]);
  // 探すから選んだ人：その月が読めたら詳細を開く
  useEffect(()=>{
    if(!want)return;
    const f=cache[want.file];
    if(!f)return;
    const c=(f.customers||[]).find(x=>x&&x.custId===want.custId)||(f.customers||[]).find(x=>x&&x.name===want.name);
    setWant(null);
    if(c){setSel({...c,_file:want.file});setBookOpen(false);setBookDk('');}
    else alert('この方の行が見つかりませんでした。PC の顧客リストで取り込み直してください。');
  },[want,cache]);
  useEffect(()=>{if(initCust&&initCust._file)setFile(initCust._file);},[initCust]);

  const cur=cache[file]||{name:file,customers:null};
  const nq=_hubNorm(q);
  const monthList=(cur.customers||[]).filter(c=>{
    if(filt==='done'&&c.status!=='confirm')return false;
    if(filt==='yet'&&c.status==='confirm')return false;
    if(!nq)return true;
    return [c.name,c.carType,c.no,c.phoneHome,c.phoneMobile,c.address].some(v=>v!=null&&_hubNorm(v).includes(nq));
  });
  const hits=(mode==='find'&&cfx&&cfx.length)?cfxSearch(cfx,q,80):[];
  const st=c=>c.status==='confirm'?{t:'予約済',c:'#047857',bg:'#ecfdf5'}:c.status==='temp'?{t:'仮予約',c:'#b45309',bg:'#fffbeb'}:{t:'未予約',c:'#64748b',bg:'#f8fafc'};
  const fmtD=v=>{const s=String(v||'');const p=s.split('-');return p.length===3?`${Number(p[1])}/${Number(p[2])}`:s;};
  const phones=cfPhones(sel||{});
  const dkOfInput=v=>{const p=String(v||'').split('-').map(Number);return p.length===3&&p[0]?`${p[0]}-${p[1]}-${p[2]}`:'';};
  const bookClosed=bookDk&&isClosedDk&&isClosedDk(dkOfInput(bookDk));
  const SEG=(on)=>({flex:1,textAlign:'center',fontSize:12,fontWeight:800,padding:'8px 0',borderRadius:9,
    border:`1.5px solid ${on?'#1d4ed8':'#cbd5e1'}`,background:on?'#1d4ed8':'white',color:on?'white':'#475569'});
  const openPerson=r=>{ const f=cache[r.f]; if(f){ const c=(f.customers||[]).find(x=>x&&x.custId===r.i); if(c){setSel({...c,_file:r.f});setBookOpen(false);setBookDk('');return;} }
    setWant({file:r.f,custId:r.i,name:r.n}); onNeedFile(r.f); };
  return(
    <div style={embedded?{flex:1,display:'flex',flexDirection:'column',minHeight:0,background:'white'}:SHEET}>
      {!embedded&&(
        <div style={sheetHeadStyle(headBg)}>
          <span style={{fontSize:16}}>👥</span>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800}}>顧客リスト</div></div>
          <button onClick={onClose} style={XBTN}>✕</button>
        </div>
      )}
      {/* 探す／月ごと（DM） */}
      <div style={{flexShrink:0,display:'flex',gap:7,padding:'8px 10px',background:'#f1f5f9',borderBottom:'1px solid #e2e8f0'}}>
        <button onClick={()=>{setMode('find');setQ('');setSel(null);}} style={SEG(mode==='find')}>🔍 探す</button>
        <button onClick={()=>{setMode('month');setQ('');setSel(null);}} style={SEG(mode==='month')}>📋 月ごと（DM）</button>
      </div>

      {mode==='find'?(<>
        <div style={{flexShrink:0,padding:10,background:'#f8fafc',borderBottom:'1px solid #e2e8f0'}}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="氏名・電話・車種・No で探す"
            style={{width:'100%',boxSizing:'border-box',padding:'11px 12px',border:'2px solid #93c5fd',borderRadius:10,fontSize:16,outline:'none'}}/>
          <div style={{fontSize:10.5,color:'#64748b',marginTop:7,lineHeight:1.6}}>
            {cfxBusy?'索引を読み込んでいます…'
              :(cfx&&cfx.length)?<>電話の下4桁だけでも出ます（<b>1234</b> → 090-…-1234）<br/>{(names||[]).length}ヶ月ぶん・{cfx.length}件から探します</>
              :'索引がまだありません。PC の顧客リストで「🗂 索引を作り直す」を押してください。'}
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
          {q.trim().length<1&&<div style={{padding:'30px 18px',textAlign:'center',color:'#94a3b8',fontSize:12.5,lineHeight:1.8}}>1文字からその場で出ます</div>}
          {q.trim().length>=1&&hits.length===0&&!cfxBusy&&<div style={{padding:'30px 18px',textAlign:'center',color:'#94a3b8',fontSize:12.5}}>見つかりませんでした</div>}
          {hits.map(g=>(
            <div key={g.key} onClick={()=>openPerson(g.now)}
              style={{display:'flex',alignItems:'center',gap:9,padding:'10px 12px',borderBottom:'1px solid #f1f5f9'}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14.5,fontWeight:800,color:'#111827'}}>{g.now.n}</div>
                <div style={{fontSize:10.5,color:'#64748b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {g.now.c||'車種なし'}{g.now.no!==''?' ・ No.'+g.now.no:''}{g.now.p?' ・ '+g.now.p:''}
                </div>
                {g.now.e&&<div style={{fontSize:10,color:'#94a3b8',marginTop:1}}>満了 {g.now.e}</div>}
              </div>
              <div style={{flexShrink:0,display:'flex',flexDirection:'column',gap:3,alignItems:'flex-end'}}>
                <span style={{fontSize:10,fontWeight:800,background:'#dbeafe',color:'#1d4ed8',borderRadius:12,padding:'2px 8px'}}>{g.now.f}</span>
                {g.past.length>0&&<span style={{fontSize:9.5,fontWeight:700,background:'#f1f5f9',color:'#64748b',borderRadius:12,padding:'2px 8px'}}>前回 {g.past[0].f}</span>}
              </div>
            </div>
          ))}
          {want&&<div style={{padding:'12px 16px',fontSize:11.5,color:'#94a3b8'}}>{want.file} を読み込んでいます…</div>}
          <div style={{height:40}}/>
        </div>
      </>):(<>
        <div style={{flexShrink:0,padding:'8px 10px',background:'#f8fafc',borderBottom:'1px solid #e2e8f0'}}>
          <div style={{display:'flex',gap:5,overflowX:'auto',paddingBottom:6}}>
            {(names||[]).map(n=>(
              <button key={n.name} onClick={()=>{setFile(n.name);setSel(null);}} style={CHIP(file===n.name,'#3730a3')}>{n.name}</button>
            ))}
          </div>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="この月の中で絞り込む"
            style={{width:'100%',boxSizing:'border-box',padding:'10px 12px',border:'2px solid #c7d2fe',borderRadius:10,fontSize:16,outline:'none'}}/>
          <div style={{display:'flex',gap:5,marginTop:7,alignItems:'center'}}>
            <button onClick={()=>setFilt('all')} style={CHIP(filt==='all')}>すべて</button>
            <button onClick={()=>setFilt('yet')} style={CHIP(filt==='yet','#b45309')}>未予約</button>

  const [handPending,setHandPending]=useState(!!fbAuth||(!!HUB_HANDOFF_ID&&hubLive(hubLoadMine()).length===0));

      }catch(e){}
      setAuthMine(hubLive(hubLoadMine()));
      if(took){
        // ここから「ホーム画面に追加」できるように、新しい印（30分）をURLに付け直す
        const h=await hubMakeHandoff();
        if(h){ try{history.replaceState(null,'',location.pathname+'?hand='+encodeURIComponent(h)+location.hash);}catch(e){} }
        if(!(navigator.standalone||matchMedia('(display-mode: standalone)').matches)) setHomeHint(true);

  },[handPending]);
  // 通常のブラウザ（Safari など）で開いている間は、いつ「ホーム画面に追加」しても登録が引き継がれるように、

  useEffect(()=>{

  // 自分でログアウトした直後は自動ログインを止める（止めないと即座に入り直す）

  },[user,authMine,authAutoOff,staffH,staffS]);
  const [editMode,setEditMode]=useState(null); // {type,dk,idx?,slot?,isNew,initial,lockedBy}

  // ポーリング結果にも同じ変更を重ね続ける。これにより「保存が終わるまで予定表に出ない」
  // 「サーバーの古い応答で一瞬消えてまた出る」の両方が起きなくなる。apply は冪等
  // （サーバー値に既に反映済みなら何もしない）であること。
  const overlaysRef=useRef([]); // [{pid,key,apply(data)=>data}]
  const applyOverlays=(key,data)=>overlaysRef.current.filter(o=>o.key===key).reduce((d,o)=>{try{return o.apply(d);}catch{return d;}},data);

  const addOverlays=ovs=>{
    overlaysRef.current=[...overlaysRef.current,...ovs];

  };

      if(isPlainObj(ms))setMemoDataS(ms);
      if(isPlainObj(lh))setLoanerResH(applyOverlays(storKey('lres','honten'),lh));
      if(isPlainObj(ls))setLoanerResS(applyOverlays(storKey('lres','sanda'),ls));
      if(Array.isArray(cdh))setClosedDaysH(cdh);
      if(Array.isArray(cds))setClosedDaysS(cds);
      if(Array.isArray(cdateH))setClosedDatesH(cdateH);
      if(Array.isArray(cdateS))setClosedDatesS(cdateS);
      if(Array.isArray(ov))setOverrideOpen(ov);
      if(Array.isArray(rcars)&&rcars.length>0)setRentalCars(rcars);
      if(isPlainObj(rres))setRentalResData(applyOverlays(STOR+'rres',rres));
      if(Array.isArray(carsH)&&carsH.length>0)setLoanerCarsH(carsH);
      if(Array.isArray(carsS)&&carsS.length>0)setLoanerCarsS(carsS);
      if(isPlainObj(limits))setInspLimits(limits);
      if(isPlainObj(restr))setSchedRestrH(restr);
      if(isPlainObj(restrS))setSchedRestrS(restrS);
      if(isPlainObj(doH))setDayOffH(doH);
      if(isPlainObj(doS))setDayOffS(doS);
      if(Array.isArray(stH))setStaffH(stH);
      if(Array.isArray(stS))setStaffS(stS);
      if(isPlainObj(plH))setPleaveH(plH);
      if(isPlainObj(plS))setPleaveS(plS);
      if(isPlainObj(mhol))setMonthlyHolidays(mhol);
      if(isPlainObj(onH))setOffNoteH(onH);
      if(isPlainObj(onS))setOffNoteS(onS);
      if(isPlainObj(msch))setMySched(msch);
      if(Array.isArray(mitems))setMemoItemsRaw(mitems);
      setGasOk(FB_ON?!(window.__hubGasDown||0):true);   // Firestore では購読の失敗（fbDown）を接続状態に反映
    }catch{setGasOk(false);}
    finally{fetchBusyRef.current=false;}
    setLoading(false);
  },[]);
  // ★ログイン画面を出している間に、先にデータを取りに行く（コード入力の待ち時間を利用する）。
  //   従来はログインが終わってから取り始めていたので、その分だけ表示が遅れていた。
  useEffect(()=>{ fetchAll(true); },[]);
  useEffect(()=>{
    if(!user)return;
    fetchAll(true);
    // ★Firestore：15秒ごとの読み直しの代わりに購読する（変更があった瞬間に fetchAll が走る。読み取りは変更分だけ）
    if(FB_ON){
      //   保存直後の70秒（writeGuard）や取得中は fetchAll が素通りするので、届いた変更を捨てずに数秒後にもう一度試す
      let kickT=null;
      const kick=()=>{ clearTimeout(kickT); if(fetchBusyRef.current||writeGuardRef.current>0){ kickT=setTimeout(kick,3000); return; } fetchAll(false); };
      const un=fbLive(MOBILE_KEYS(),kick);
      return ()=>{ clearTimeout(kickT); un(); };
    }
    const timer=setInterval(()=>fetchAll(false),15000);
    return ()=>clearInterval(timer);
  },[user]);

  // 起動時チェック: 保存確認が取れる前にアプリが閉じられた予約が残っていないか、サーバーと突き合わせる。
  // 見つからなければ赤バナー＋通知メール（楽観的受付の取りこぼし防止の最後の網）。
  useEffect(()=>{
    if(!user)return;
    (async()=>{
      const stale=loadPending().filter(p=>!inflightRef.current.has(p.pid));
      if(stale.length===0)return;
      savePendingStore(loadPending().filter(p=>inflightRef.current.has(p.pid)));
      for(const p of stale){
        let ok=false;
        try{
          const key=p.type==='insp'?STOR+'insp':storKey('sched',p.store||'honten');
          const data=await sGet(key);
          if(isPlainObj(data)){
            if(p.type==='insp'){
              const r=(data[p.dk]||[])[p.idx];
              ok=p.kind==='delete'
                ?(!r||!r.name||r.name!==p.name)
                :(!!r&&r.name===p.name&&(!p.check?.time||r.time===p.check.time));
            }else{
              const day=data[p.dk]||{};
              ok=p.kind==='delete'
                ?!(day[p.slot]&&day[p.slot].name===p.name)
                :Object.keys(day).some(k=>{const r=day[k];return r&&r.name===p.name&&getBaseSlot(k)===getBaseSlot(p.slot);});
            }
          }
        }catch{}
        if(!ok){
          const label=`${p.name||'予約'}${p.name?'さん':''}の${p.type==='insp'?'車検':'整備'}予約${p.kind==='delete'?'の削除':''}`;
          upsertBanner({pid:p.pid,phase:'fail',label,detail:'前回アプリを閉じた際に保存が完了していない可能性があります。該当日を確認してください'});
          notifyFail(p,'アプリ終了により保存を確認できませんでした（起動時チェックで検出）');
        }
      }
    })();
  },[user]);

  // ── 書き込みレイヤ ──
  // 保存はサーバーの最新値を読み直してから差分適用（read-modify-write）＋読み返し検証。
  // GAS混雑時は書き込みがロック待ちタイムアウト等で「静かに失敗」することがある
  // （no-corsのため失敗を検知できない）。verifyが渡された場合は、書き込み後に
  // サーバーから読み返して自分の変更が反映されたか確認し、未反映なら最新値から
  // 作り直して再送する（最大3回）。それでも確認できなければエラーにして呼び出し側で警告。
  // （2026-07-03 代車予約の無音消失インシデント対策。PC版の読み返し検証と同じ考え方）
  const guardWrite=()=>{
    writeGuardRef.current++;
    setTimeout(()=>{writeGuardRef.current=Math.max(0,writeGuardRef.current-1);},70000);
  };
  //   ★requireBase=true のキー（insp/lres/rres など予約そのもの）は、サーバー値を読めなかった時に
  //     ローカル全文へフォールバックしない。読めない＝GASの一時失敗なので、そこでローカルを書き戻すと
  //     他端末が入れた予約を巻き添えにする（最悪、空とみなして全消し）。書かずに次の試行へ回す。
  //     （2026-07-30 追加。PC側 writeVerified の requireBase と同じ考え方）
  const writeShared=async(key,fallbackLocal,mutator,applyLocal,verify,requireBase)=>{
    guardWrite();
    let next=null;
    if(FB_ON){
      // ★Firestore：サーバー最新値を読んで変更→書く を1つのトランザクションで行う（他端末と衝突すれば自動やり直し）。
      //   書けたらその内容で確定なので読み返し検証は不要。requireBase の約束（読めない時に空とみなさない）は fbTxn が守る。
      for(let attempt=0;attempt<3;attempt++){
        const out={};
        const r=await fbTxn(key,base=>mutator(isPlainObj(base)?base:(isPlainObj(fallbackLocal)?fallbackLocal:{})),{requireBase,out});
        if(r==='ok'){ next=out.val; applyLocal(next); return next; }
        if(r==='nochange')return null;
        await new Promise(r=>setTimeout(r,1500+1500*attempt));
      }
      throw new Error('サーバーへの保存を確認できませんでした（通信または混雑）。もう一度お試しください');
    }
    for(let attempt=0;attempt<3;attempt++){
      let base=await sGet(key);
      if(!isPlainObj(base)&&requireBase){
        console.warn('[WRITE] サーバー値を読めないため書き込みを見送り',key,'attempt',attempt+1);
        await new Promise(r=>setTimeout(r,1500+1500*attempt));
        continue;
      }
      if(!isPlainObj(base))base=isPlainObj(fallbackLocal)?fallbackLocal:{};
      next=mutator(base);
      applyLocal(next);
      await sSet(key,next);
      if(!verify)return next;
      await new Promise(r=>setTimeout(r,1300));
      const echo=await sGet(key);
      if(isPlainObj(echo)&&verify(echo)){applyLocal(echo);return echo;} // 反映確認OK（他端末の変更も取り込む）
    }
    throw new Error('サーバーへの保存を確認できませんでした（通信または混雑）。もう一度お試しください');
  };
  // ── スタッフ休日（休日タブ）。PC版の StaffCalendarModal と同じデータ・同じ決まり ──
  //   ・入力したら即確定（申請→承認は無し。PC版と同じ）
  //   ・一般スタッフは自分の分だけ。管理者（canRestore の4人）は誰の分でも設定できる
  //   ・休日(dayoff)と有給(pleave)は同じ日に両方入らない（片方を入れたらもう片方から外す）
  //   ・サーバー最新値に対して氏名を足す／外すだけ（他の人の休日を巻き込まない）
  const toggleDayOff=async(store,type,dk,name)=>{
    const key=storKey(type==='leave'?'pleave':'dayoff',store);
    const other=storKey(type==='leave'?'dayoff':'pleave',store);
    const setOf=k=>k===storKey('dayoff','honten')?setDayOffH:k===storKey('dayoff','sanda')?setDayOffS:k===storKey('pleave','honten')?setPleaveH:setPleaveS;
    const curOf=k=>k===storKey('dayoff','honten')?dayOffH:k===storKey('dayoff','sanda')?dayOffS:k===storKey('pleave','honten')?pleaveH:pleaveS;
    const has=(Array.isArray(curOf(key)[dk])?curOf(key)[dk]:[]).includes(name);
    const edit=(base,add)=>{
      const arr=Array.isArray(base[dk])?base[dk]:[];
      if(add){ if(arr.includes(name))return undefined; return {...base,[dk]:[...arr,name]}; }
      if(!arr.includes(name))return undefined;
      const rest=arr.filter(n=>n!==name);
      const next={...base}; if(rest.length)next[dk]=rest; else delete next[dk];
      return next;
    };
    try{
      await writeShared(key,{},b=>edit(b,!has),v=>setOf(key)(v),null,true);
      if(!has) await writeShared(other,{},b=>edit(b,false),v=>setOf(other)(v),null,true);
      if(has) await saveOffNote(store,dk,name,'');   // 休みを外したらメモも消す
    }catch(e){
      alert('⚠️ 休日の保存がサーバーに反映されていません。\nもう一度お試しください。');
      fetchAll(true);
    }
  };
  // マイスケジュール（公開予定）の保存：サーバー最新値に対して自分の予定だけ足す／直す／消す
  const saveMySched=m=>writeShared(STOR+'mysched',{},m,v=>setMySched(v),null,true).then(()=>true).catch(()=>false);
  // 備考・メモ（2026-10-03）：{店}-memo の その日の配列に 1件 {content} を足す／直す／消す（PC版と同じ形）
  //   content が空なら その1件を消す。番号がずれている（他の端末が消した）時は足す扱いにする。
  const saveDayMemo=async(dk,idx,content)=>{
    const key=storKey('memo',vsId);
    const set=vsId==='honten'?setMemoDataH:setMemoDataS;
    const t=String(content||'').trim().slice(0,500);
    try{
      await writeShared(key,{},b=>{
        const arr=Array.isArray(b[dk])?[...b[dk]]:[];
        if(idx==null||idx<0||idx>=arr.length){ if(!t)return undefined; arr.push({content:t}); }
        else if(!t){ arr.splice(idx,1); }
        else { arr[idx]={...(arr[idx]||{}),content:t}; }
        const n={...b}; if(arr.length)n[dk]=arr; else delete n[dk]; return n;
      },v=>set(v),null,true);
      setMemoEdit(null);
    }catch(e){
      alert('⚠️ 備考・メモの保存がサーバーに反映されていません。'+String.fromCharCode(10)+'もう一度お試しください。');
      fetchAll(true);
    }
  };
  // 休日メモ（2026-09-20）：{店}-offnote の "dk::氏名" に文字列。空なら消す
  const saveOffNote=async(store,dk,name,text)=>{
    const key=storKey('offnote',store), k=dk+'::'+name, t=String(text||'').trim().slice(0,30);
    const set=store==='honten'?setOffNoteH:setOffNoteS;
    try{
      await writeShared(key,{},b=>{
        const cur=typeof b[k]==='string'?b[k]:(b[k]&&b[k].memo)||'';
        if(cur===t)return undefined;
        const n={...b}; if(t)n[k]=t; else delete n[k]; return n;
      },v=>set(v),null,true);
    }catch(e){ alert('⚠️ メモの保存がサーバーに反映されていません。\nもう一度お試しください。'); fetchAll(true); }
  };
  // 検証ヘルパ: lres/rres に指定bookingKeyの予約が「ある」「ない」を確認
  const hasBk=(res,bk)=>Object.values(res||{}).some(days=>Object.values(days||{}).some(r=>r&&r.bookingKey===bk));

  // ── 編集ロック（PC版と同じ locksキー・TTL30秒。モーダル表示中は20秒毎に延長）──
  const acquireLock=async(key,userName)=>{
    const locks=await sGet(STOR+'locks');
    const cur=isPlainObj(locks)?locks:{};
    const lk=cur[key];
    let lockedBy=null;
    if(lk&&Date.now()-lk.lockedAt<LOCK_TTL&&lk.lockedBy!==userName)lockedBy=lk.lockedBy;
    sSet(STOR+'locks',{...cur,[key]:{lockedBy:userName,lockedAt:Date.now()}});
    curLockKeyRef.current=key;
    if(lockHeartbeatRef.current)clearInterval(lockHeartbeatRef.current);
    lockHeartbeatRef.current=setInterval(async()=>{
      const l=await sGet(STOR+'locks');
      const c=isPlainObj(l)?l:{};
      sSet(STOR+'locks',{...c,[key]:{lockedBy:userName,lockedAt:Date.now()}});
    },20000);
    return lockedBy;
  };
  // ロックの所有をモーダルから切り離す（バックグラウンド保存が完了するまでハートビートは継続し、
  // 保存中に他端末が同じ枠を開いたら「編集中」警告が出るようにする）
  const detachLock=()=>{
    const key=curLockKeyRef.current;curLockKeyRef.current=null;
    const hb=lockHeartbeatRef.current;lockHeartbeatRef.current=null;
    return{key,hb};
  };
  const releaseLockHandle=async(h)=>{
    if(!h)return;
    if(h.hb)clearInterval(h.hb);
    if(!h.key)return;
    const l=await sGet(STOR+'locks');
    if(isPlainObj(l)&&l[h.key]){const c={...l};delete c[h.key];sSet(STOR+'locks',c);}
  };
  const releaseLock=async()=>releaseLockHandle(detachLock());
  useEffect(()=>()=>{if(lockHeartbeatRef.current)clearInterval(lockHeartbeatRef.current);},[]);

  // ★入庫済みチェックの切り替え（PC版と同じ arrived フラグ）。
  //   予約内容そのものは変えない、表示上の印。サーバー最新値ベースで1項目だけ書く。
  // ★押した直後の状態を20秒だけ手元で保持する（PC版と同じ）。GASは読み取りを5秒
  //   キャッシュするため、直後の取得が「まだチェック前」の古い値を返し、点いたり消えたり
  //   して見えることがある。保存が届けば自然に一致する。
  const ARRIVED_OV_MS=45000;      // 押した状態を手元で優先する時間（保存＋読み返しより十分長く）
  const ARRIVED_DEBOUNCE_MS=400;  // 連打をまとめる。最後の状態だけを1回書く。
  const [arrivedOv,setArrivedOv]=useState({});
  // ★refにも同じ値を持つ。連打の2回目が「今の表示」を即座に読むために必要
  //   （stateだけだと2回目が古い値を読み、押しても変わらない＝さらに連打になる）。
  const arrivedOvRef=useRef({});
  const arrivedStamp=useRef({});
  const markArrivedOv=useCallback((k,v)=>{
    arrivedOvRef.current={...arrivedOvRef.current,[k]:v};
    arrivedStamp.current={...arrivedStamp.current,[k]:Date.now()};
    setArrivedOv(arrivedOvRef.current);
    setTimeout(()=>{
      const ts=arrivedStamp.current[k];
      if(ts&&Date.now()-ts<ARRIVED_OV_MS-500)return; // 押し直された分は生かす
      const n={...arrivedOvRef.current};delete n[k];arrivedOvRef.current=n;setArrivedOv(n);
    },ARRIVED_OV_MS);
  },[]);
  // ★タップした瞬間に色を変えるための仕掛け。保存(GAS)は1回2〜3秒かかるので、
  //   同じ処理の中で始めると画面の描き替えが後回しになり「押したのに変わらない→
  //   もう一度押す」の連打になる（2026-08-27にユーザーが報告）。描き替えが出てから
  //   保存を始め、連打された分は最後の状態だけを1回にまとめて書く。
  const arrivedTimers=useRef({});
  const runAfterPaint=useCallback((k,fn)=>{
    const t=arrivedTimers.current;
    if(t[k])clearTimeout(t[k]);
    t[k]=setTimeout(()=>{delete t[k];requestAnimationFrame(()=>setTimeout(fn,0));},ARRIVED_DEBOUNCE_MS);
  },[]);
  const shownArrived=useCallback((k,row)=>(k in arrivedOvRef.current)?!!arrivedOvRef.current[k]:!!(row&&row.arrived),[]);
  const toggleArrived=useCallback((type,dk,idxOrSlot)=>{
    try{
      if(type==='insp'){
        const cur=(hotInsp[dk]||[])[idxOrSlot];
        if(!cur||!cur.name)return;
        const k=dk+'|'+(cur.seq||cur.custId||cur.name);
        const next=!shownArrived(k,cur); // 今の「表示」を反転（連打しても1回ごとに切り替わる）
        markArrivedOv(k,next);           // ここで即座に色が変わる
        runAfterPaint(k,()=>writeShared(STOR+'insp',hotInsp,base=>{
          const rows=[...((base[dk])||[])];
          const r=rows[idxOrSlot];
          if(!r||r.name!==cur.name)return base;           // 行がズレていたら触らない
          rows[idxOrSlot]=next?{...r,arrived:true}:(()=>{const {arrived,...rest}=r;return rest;})();
          return {...base,[dk]:rows};
        },v=>setInspData(applyOverlays(STOR+'insp',v)),null,true).catch(e=>console.warn('入庫チェックを保存できませんでした',e)));
      }else{
        const key=storKey('sched',vsId);
        const day=(vsId==='honten'?schedDataH:schedDataS)[dk]||{};
        const cur=day[idxOrSlot];
        if(!cur||!cur.name)return;
        const k=dk+'|'+(cur.name||idxOrSlot);
        const next=!shownArrived(k,cur);
        markArrivedOv(k,next);           // ここで即座に色が変わる
        runAfterPaint(k,()=>writeShared(key,(vsId==='honten'?schedDataH:schedDataS),base=>{
          const d={...((base[dk])||{})};
          const r=d[idxOrSlot];
          if(!r||r.name!==cur.name)return base;
          d[idxOrSlot]=next?{...r,arrived:true}:(()=>{const {arrived,...rest}=r;return rest;})();
          return {...base,[dk]:d};
        },v=>{ if(vsId==='honten')setSchedDataH(applyOverlays(key,v)); else setSchedDataS(applyOverlays(key,v)); },null,true).catch(e=>console.warn('入庫チェックを保存できませんでした',e)));
      }
    }catch(e){ console.warn('入庫チェックを保存できませんでした',e); }
  },[hotInsp,schedDataH,schedDataS,vsId,shownArrived,runAfterPaint,markArrivedOv]);

  const openEdit=useCallback((req)=>{
    // req: {type:'insp'|'sched', dk, idx?, slot?, isNew}
    // initial はローカルデータから即座に作れる（GAS不要）ので、まずモーダルを開く。
    // ロック取得（GAS往復）はタップ→表示の体感を悪くするため、開いた後に裏で取得して
    // 他人が編集中なら lockedBy を後付けで反映する（＝タップ即モーダル表示）。
    const key=req.type==='insp'?lockKeyOf('insp',req.dk,req.idx):lockKeyOf('sched',req.dk,null,req.slot);
    let initial;
    if(req.type==='insp'){
      initial=req.isNew?(req.initial||{}):{...((inspData[req.dk]||[])[req.idx]||{})};
    }else{
      const sd=vsId==='honten'?schedDataH:schedDataS;
      initial=req.isNew?{}:{...((sd[req.dk]||{})[req.slot]||{})};
    }
    setEditMode({...req,initial,lockedBy:null});
    acquireLock(key,user?.name||'モバイル').then(lockedBy=>{
      if(lockedBy)setEditMode(m=>(m&&m.type===req.type&&m.dk===req.dk&&m.idx===req.idx&&m.slot===req.slot)?{...m,lockedBy}:m);
    }).catch(()=>{});
  },[user,inspData,schedDataH,schedDataS,vsId]);

  // ── 顧客（v2.98）──────────────────────────────────────────────
  //   ・月の一覧（cf-index）と索引（cf-search-*）は軽いので顧客タブを開いた時に読む
  //   ・月ファイルの中身は「その月を開いた時／索引から人を選んだ時」に、その1本だけ読む
  const loadCf=useCallback(async(force)=>{
    if(cfBusy)return;
    setCfBusy(true);
    try{
      const idx=await sGet(STOR+'cf-index');
      const names=(Array.isArray(idx)?idx:[]).filter(f=>f&&f.name).sort((a,b)=>String(b.name).localeCompare(String(a.name)));
      setCfNames(names);
      if(force)setCfCache({});
      const r=await cfxLoad(sGet);
      if(r){setCfx(r.rows);setCfxMeta(r.meta);}else setCfx([]);
    }catch(e){ console.warn('[CF] 顧客リストを読めません',e&&e.message); setCfNames([]);setCfx([]); }
    finally{ setCfBusy(false); }
  },[cfBusy]);
  // 月ファイルを1本だけ読んで手元に置く
  const needCfFile=useCallback(async(name)=>{
    if(!name||cfCache[name]||cfLoadingRef.current===name)return;
    cfLoadingRef.current=name; setCfLoadingName(name);
    try{ const f=await cfLoadOne(name); if(f)setCfCache(p=>({...p,[name]:f})); }
    catch(e){ console.warn('[CF] 月ファイルを読めません',name,e&&e.message); }
    finally{ cfLoadingRef.current=null; setCfLoadingName(''); }
  },[cfCache]);
  // 顧客タブを開いたら、その時に1回だけ読む
  useEffect(()=>{ if(tab==='cust')loadCf(); },[tab,loadCf]);
  // 検索結果をタップ → その日のスケジュールを開く
  const goDay=useCallback(dk=>{
    const p=String(dk).split('-').map(Number);
    if(p.length===3&&p[0]){setSchedInitDate({y:p[0],m:p[1]-1,d:p[2]});setTab('sched');}
    setShowFind(false);setCustSheet(null);
  },[]);
  // 顧客リストの1人ぶんを、予約後の姿に直す（画面とサーバーの両方）
  const applyCustBooking=async(cust,dk,form,isTemp)=>{
    const upd={...cust,status:isTemp?'temp':'confirm',entryDate:dk,
      store:normStore(form.store)||normStore(cust.store)||vsId,
      bookingTime:form.time||'',course:Number(form.course)||0,tokuten:form.tokuten||'-',
      staff:form.staff||'',note:form.note||'',linkedInspDate:isTemp?'':dk};
    const file=cust._file;delete upd._file;
    await cfSaveRow(file,upd);
    setCfCache(prev=>prev[file]?{...prev,[file]:{...prev[file],customers:(prev[file].customers||[]).map(c=>c&&c.custId===cust.custId?upd:c)}}:prev);
    // カレンダーの予約枠（custbk）にも控えを置く。PC のリストから予約した時と同じ形
    const bkKey=String(cust.name||'').trim()+'::'+dk;
    await writeShared(STOR+'custbk',{},base=>({...base,[bkKey]:cfCustbkEntry(cust,dk,{...form,store:upd.store},!!isTemp)}),()=>{},null,true);
  };
  // 本予約：スケジュールの「＋追加」と同じ入力画面を、名前・車種・電話を入れた状態で開く
  const bookFromCust=useCallback((cust,dk,fileName)=>{
    if(isClosedDk(dk)){alert('🏖 その日は休業日です。別の日を選んでください');return;}
    if(inspLimits[dk]!=null){
      const cnt=(inspData[dk]||[]).filter(r=>r&&r.name&&r.bookingStatus!=='cancelled').length;
      if(cnt>=inspLimits[dk]){alert('🚫 その日は台数制限（最大'+inspLimits[dk]+'台）に達しているため、車検の予約はできません');return;}
    }
    const rows=(inspData[dk]||[]);
    let idx=0;while(idx<rows.length&&rows[idx]&&rows[idx].name)idx++;
    setCustSheet(null);setShowFind(false);
    openEdit({type:'insp',dk,idx,isNew:true,
      initial:{...blankInsp(),name:cust.name,carType:cust.carType||'',no:cust.no,
        course:Number(cust.course)||0,tokuten:cust.tokuten||'-',staff:cust.staff||'',note:cust.note||'',
        phone:cfPhones(cust)[0]||'',address:String(cust.address||'').trim(),
        custId:cust.custId,store:normStore(cust.store)||vsId,bookingStatus:'confirmed'},
      cust:{...cust,_file:fileName||cust._file||''}});
  },[inspData,inspLimits,vsId,isClosedDk,openEdit]);
  // 仮予約：スケジュールには載せず、顧客リストと予約枠（custbk）にだけ残す（PC のリストと同じ）
  const tempFromCust=useCallback(async(cust,dk,fileName)=>{
    const pid=Date.now()+'-'+Math.random().toString(36).slice(2,6);
    const label=cust.name+'さんの仮予約';
    setCustSheet(null);
    upsertBanner({pid,phase:'saving',label});
    try{
      await applyCustBooking({...cust,_file:fileName||cust._file||''},dk,{store:cust.store,staff:user?.name||'',time:'',course:cust.course||0,tokuten:cust.tokuten||'-',note:cust.note||''},true);
      upsertBanner({pid,phase:'done',label});setTimeout(()=>removeBanner(pid),6000);
    }catch(e){
      upsertBanner({pid,phase:'fail',label,detail:String(e&&e.message||e)});
    }
  },[user,vsId]);

  const closeEdit=useCallback(()=>{
    setEditMode(null);
    releaseLock();
  },[]);

  // 代車/レンタカーの紐付け反映。entryへのラベル書き込みと lres/rres の予約更新を行い、
  // 更新後のentryを返す（PC版 handleSaveModal の pendingLoanerData / pendingRental 処理と同じ結果になる）
  const applyLoanerAction=async(entry,action,bkFinal,userName,bkOld)=>{
    if(!action)return entry; // 変更なし
    const lresKey=storKey('lres',vsId);
    const myLres=vsId==='honten'?loanerResH:loanerResS;
    const setMyLres=vsId==='honten'?setLoanerResH:setLoanerResS;
    // ★整備を別の日・別の時間へ移した時は、古い印（bkOld）の予約も消す（2026-10-01）。
    //   消さないと代車の予約だけ元の日に取り残される。
    const cleanOwn=res=>{
      const out={};
      for(const cid of Object.keys(res||{})){
        const days={...(res[cid]||{})};
        Object.keys(days).forEach(k=>{const b=days[k]&&days[k].bookingKey;if(b===bkFinal||(bkOld&&b===bkOld))delete days[k];});
        out[cid]=days;
      }
      return out;
    };
    const colorOf=name=>RES_COLORS[[...String(name||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%RES_COLORS.length];
    if(action.kind==='none'){
      // 別キーへの独立した書き込みは並列化（GASロック側で直列化されるが、読み・検証待ちが重なる分速い）
      await Promise.all([
        writeShared(lresKey,myLres,base=>cleanOwn(base),setMyLres,echo=>!hasBk(echo,bkFinal),true),
        writeShared(STOR+'rres',rentalResData,base=>cleanOwn(base),setRentalResData,echo=>!hasBk(echo,bkFinal),true),
      ]);
      return {...entry,loaner:'',loanerId:null,rentalLabel:'',rentalCarId:null};
    }
    if(action.kind==='loaner'){
      const cars=vsId==='honten'?loanerCarsH:loanerCarsS;
      const car=cars.find(c=>String(c.id)===String(action.carId));
      const rec={
        id:Date.now(),
        fy:action.from.y,fm:action.from.m0,fd:action.from.d,
        ty:action.to.y,tm:action.to.m0,td:action.to.d,
        user:userName,color:colorOf(userName),bookingKey:bkFinal,
        carName:car?.name,carNum:car?.num,
        locked:action.locked||undefined,   // ★限定（最適化で動かさない）
      };
      await Promise.all([
        writeShared(lresKey,myLres,base=>{
          const cleaned=cleanOwn(base);
          const days={...(cleaned[action.carId]||{})};
          // ★保存キーは「年-月-日」。日だけだと別の月の同じ日で衝突する（PC側は修正済み）。
          //   別予約が居る時はサフィックスを付けて上書きを防ぐ。
          let k=`${rec.fy}-${rec.fm}-${rec.fd}`;
          if(days[k]&&days[k].id!==rec.id)k=`${k}_${rec.id}`;
          days[k]=rec;
          return{...cleaned,[action.carId]:days};
        },setMyLres,echo=>Object.values(echo[action.carId]||{}).some(r=>r&&r.id===rec.id&&r.bookingKey===bkFinal),true),
        writeShared(STOR+'rres',rentalResData,base=>cleanOwn(base),setRentalResData,echo=>!hasBk(echo,bkFinal),true),
      ]);
      return {...entry,loaner:car?`${car.name} (${car.num})`:'',loanerId:action.carId,rentalLabel:'',rentalCarId:null};
    }
    if(action.kind==='rental'){
      const rcar=(rentalCars.length?rentalCars:DEFAULT_RENTAL_CARS).find(c=>String(c.id)===String(action.carId));
      const rec={
        id:Date.now(),
        fy:action.from.y,fm:action.from.m0,fd:action.from.d,
        ty:action.to.y,tm:action.to.m0,td:action.to.d,
        user:userName,color:colorOf(userName),bookingKey:bkFinal,
      };
      await Promise.all([
        writeShared(STOR+'rres',rentalResData,base=>{
          const cleaned=cleanOwn(base);
          const days={...(cleaned[action.carId]||{})};
          days[String(rec.id)]=rec; // PC版addRentalResと同じくidをキーにする
          return{...cleaned,[action.carId]:days};
        },setRentalResData,echo=>Object.values(echo[action.carId]||{}).some(r=>r&&r.id===rec.id&&r.bookingKey===bkFinal),true),
        writeShared(lresKey,myLres,base=>cleanOwn(base),setMyLres,echo=>!hasBk(echo,bkFinal),true),
      ]);
      return {...entry,loaner:'',loanerId:null,rentalLabel:`🔑 ${rcar?rcar.name:'レンタカー'}${rcar?.num?` (${rcar.num})`:''}`,rentalCarId:action.carId};
    }
    return entry;
  };

  // 保存失敗の通知メール（GAS側の notifyFail アクションが必要。未対応デプロイでは何も送られず'ok'相当で無視される）
  const notifyFail=async(pend,detail)=>{
    const dkp=String(pend.dk||'').split('-');
    const when=dkp.length===3?`${dkp[0]}年${dkp[1]}月${dkp[2]}日`:pend.dk;
    const text=`${when} の${pend.type==='insp'?'車検':'タイムスケジュール'}${pend.kind==='delete'?'予約の削除':'予約'}「${pend.name}」（操作: ${pend.by||'不明'}）がサーバーに保存できていない可能性があります。\nアプリで該当日を確認し、登録されていなければお手数ですがもう一度操作してください。\n詳細: ${detail||'-'}`;
    const body=JSON.stringify({action:'notifyFail',apiKey:GAS_API_KEY,emailsKey:STOR+'notify-emails',user:pend.by||'',env:STOR==='hub-v8-'?'メイン':'テスト版',detail:text});
    try{await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});}
    catch{
      await new Promise(r=>setTimeout(r,1500));
      try{await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});}catch{}
    }
  };

  // 通知メールアドレスの登録（{スタッフ名:アドレス} マップを読み返し検証つきで更新）
  const saveNotifyEmail=async(email)=>{
    const name=user?.name;
    if(!name)throw new Error('ログイン情報がありません');
    await writeShared(STOR+'notify-emails',{},base=>{
      const n={...base};
      if(email)n[name]=email;else delete n[name];
      return n;
    },()=>{},echo=>email?echo[name]===email:!(name in echo));
  };

  // サーバー保存の本体（読み返し検証つき）。handleSaveから切り離されてバックグラウンドで実行される
  const saveCore=async(req,form,loanerAction)=>{
    // ★画面の中だけで使う印（_dk・_slot・_store）は保存しない（2026-10-02）
    const clean=o=>Object.fromEntries(Object.entries(o||{}).filter(([k])=>String(k).charAt(0)!==String.fromCharCode(95)));
    const userName=form.name||user?.name||'';
    if(req.type==='insp'){
      // ★車検の日を動かす（2026-10-04）。移り先の空き枠を、サーバーの最新値で決めてから書く。
      const tDk=form._dk||req.dk;
      const isMove=!req.isNew&&tDk!==req.dk;
      const occ=r=>!!(r&&r.name&&r.bookingStatus!=='cancelled');
      let idxPlace=req.idx;
      if(isMove){
        const fresh=await sGet(STOR+'insp');
        const rows0=((isPlainObj(fresh)?fresh:hotInsp)[tDk])||[];
        const f=rows0.findIndex(r=>!occ(r));
        idxPlace=f>=0?f:rows0.length;
      }
      const bkFinal=`insp-${tDk}-${idxPlace}`;
      const bkOld=`insp-${req.dk}-${req.idx}`;
      const entry=await applyLoanerAction(clean(form),loanerAction,bkFinal,userName,isMove?bkOld:'');
      let placedPending=false,placedSeq=null;
      await writeShared(STOR+'insp',hotInsp,base=>{
        const rows=((base[tDk]||[]).map(r=>r||blankInsp()));
        // 直前に他の端末がその枠を使っていたら、さらに次の空きへ逃がす（上書きで消さない）
        if(isMove&&occ(rows[idxPlace])){const f=rows.findIndex(r=>!occ(r));idxPlace=f>=0?f:rows.length;}
        while(rows.length<=idxPlace)rows.push(blankInsp());
        const prevRow=rows[idxPlace];
        // PC版と同じseq規則: アクティブ予約の編集はseq維持、新規/キャンセル枠への予約は新seq
        // （再試行時に自分の行が既に書けていた場合はseqが引き継がれるので二重にならない）
        const editingActive=!isMove&&!!(prevRow&&prevRow.name&&prevRow.bookingStatus!=='cancelled');
        const seq=editingActive?(prevRow.seq!=null?prevRow.seq:Date.now()):Date.now();
        placedSeq=seq;
        // ★カードの「入庫店舗」で選んだ店を優先する（2026-10-02）。以前は元の行の店が勝っていて変えられなかった
        //   日を動かした時は、移り先で承認を見直す（元の承認／承認待ちは引き継がない。PC版と同じ）
        const moving=isMove?{bookingKey:bkFinal,approved:undefined,pendingApproval:undefined}:{};
        rows[idxPlace]={...entry,...moving,store:normStore(entry.store)||normStore(prevRow?.store)||vsId,seq,bookingStatus:'confirmed'};
        if(isMove){delete rows[idxPlace].approved;delete rows[idxPlace].pendingApproval;}
        const dayLimit=inspLimits[tDk]??6;
        const wasPending=editingActive&&!!prevRow.pendingApproval;
        const recomputed=recomputeInspApproval(rows,dayLimit);
        placedPending=!!(recomputed[idxPlace]&&recomputed[idxPlace].pendingApproval&&!wasPending);
        const out={...base,[tDk]:recomputed};
        // 元の日の枠を空ける（空いた分だけ、その日の承認待ちが繰り上がる）
        if(isMove){
          const oldRows=[...(out[req.dk]||[])];
          if(oldRows[req.idx])oldRows[req.idx]=blankInsp();
          out[req.dk]=recomputeInspApproval(oldRows,inspLimits[req.dk]??6);
        }
        return out;
      },setInspData,echo=>{
        const r=(echo[tDk]||[])[idxPlace];
        const okNew=!!r&&r.name===entry.name&&r.seq===placedSeq;
        if(!isMove)return okNew;
        const oldR=(echo[req.dk]||[])[req.idx];
        return okNew&&!(oldR&&oldR.name);   // 移り先に入って、元の枠が空いていること
      },true);
      // ★日を動かした時のあと始末（2026-10-04）
      if(isMove){
        const _nm=String(entry.name||'').trim();
        // 保管箱（14日より前の分）に残る同じ予約を外す
        if(entry.custId){
          try{
            const _a=await sGet(STOR+'insp-arch');
            const _n=archDropSameBooking(_a,entry.custId,tDk);
            if(_n){ await sSet(STOR+'insp-arch',_n); setInspArch(_n); }
          }catch(e){}
        }
        const _hitOld=(e)=>{const f=e&&e.formData;
          if(!e||!f||String(e.dk||'')!==req.dk)return false;
          return (!!entry.custId&&f.custId===entry.custId)||(!!_nm&&String(f.name||'').trim()===_nm);};
        // 古い日のカレンダー控え（custbk）を外す。残っていると同期チェックが元の日に作り直す
        try{
          await writeShared(STOR+'custbk',{},base=>{
            const b=isPlainObj(base)?base:{};
            const drop=Object.keys(b).filter(k=>_hitOld(b[k]));
            if(drop.length===0)return undefined;
            const n={...b};drop.forEach(k=>{delete n[k];});return n;
          },()=>{},null,true);
        }catch(e){}
        // 顧客リストにも新しい日を知らせる（PC版 syncCustStatus と同じキュー）
        if(entry.custId||_nm){
          try{
            const _p=String(tDk).split('-');
            const _ed=_p.length===3?(_p[0]+'-'+String(_p[1]).padStart(2,'0')+'-'+String(_p[2]).padStart(2,'0')):tDk;
            const _upd={custId:entry.custId||'',name:_nm,no:entry.no,status:'confirm',
              entryDate:_ed,linkedInspDate:_ed,course:Number(entry.course)||0,
              store:normStore(entry.store)||vsId,staff:entry.staff||'',tokuten:entry.tokuten||'-',
              note:entry.note||'',bookingTime:entry.time||'',ts:Date.now()};
            const _cur=await sGet(STOR+'cust-updates');
            const _arr=Array.isArray(_cur)?_cur:[];
            await sSet(STOR+'cust-updates',[..._arr.filter(u=>!(u&&(
              (!!_upd.custId&&u.custId===_upd.custId)||
              (!!_nm&&u.name===_nm&&String(u.no)===String(_upd.no))))),_upd]);
          }catch(e){}
        }
      }
      if(placedPending)alert('⚠️ 1日の上限を超えたため、本店承認が必要です（通常6台／レギュラー車検3台）。この予約は承認待ちになります。');
    }else{
      // ★移り先の店（2026-10-02）。店をまたぐ時は別のキーへ書き、元の店のキーからは消す
      const tSt=form._store||vsId;
      const stMoved=!req.isNew&&tSt!==vsId;
      const sdKey=storKey('sched',tSt);
      const sd=tSt==='honten'?schedDataH:schedDataS;
      const setSd=tSt==='honten'?setSchedDataH:setSchedDataS;
      const oldKey=storKey('sched',vsId);
      const oldSd=vsId==='honten'?schedDataH:schedDataS;
      const setOldSd=vsId==='honten'?setSchedDataH:setSchedDataS;
      // ★移り先（日にち・時間）。移していない時は今までどおり req のまま（2026-10-01）
      const tDk=form._dk||req.dk, tSlot=form._slot||getBaseSlot(req.slot);
      const isMove=!req.isNew&&(stMoved||(tDk!==req.dk)||(tSlot!==getBaseSlot(req.slot)));
      // 新規と移動はサーバーの最新値で空きサブ枠を確定してから代車bookingKeyを発行する
      let slotFinal=req.slot;
      if(req.isNew||isMove){
        const fresh=await sGet(sdKey);
        const day=(isPlainObj(fresh)?fresh:sd)[tDk]||{};
        const baseSlot=req.isNew?getBaseSlot(req.slot):tSlot;
        let sub=0,k=baseSlot;
        while(day[k]&&day[k].name&&!(tDk===req.dk&&k===req.slot)){sub++;k=makeSlotKey(baseSlot,sub);}
        slotFinal=k;
      }
      const bkFinal=`sched-${tDk}-${slotFinal}`;
      const bkOld=`sched-${req.dk}-${req.slot}`;
      const entry=await applyLoanerAction(clean(form),loanerAction,bkFinal,userName,isMove?bkOld:'');
      const placedId=Date.now();
      await writeShared(sdKey,sd,base=>{
        const out={...base};
        // 移した時は元の枠を空ける（先に消してから入れる＝同じ日の中で動かしても取りこぼさない）
        //   店をまたいだ時は別のキーなので、ここでは消さない（下で元の店のキーから消す）
        if(isMove&&!stMoved){const od={...(out[req.dk]||{})};delete od[req.slot];out[req.dk]=od;}
        const day={...(out[tDk]||{})};
        // 直前に他端末で埋まった場合はさらに次の空きへ（自分の書き込み済みエントリ=placedIdは除外し、
        // 再試行時に二重登録しない。代車のbkとずれた場合もデータは壊れず表示は氏名フォールバックで追従）
        if((req.isNew||isMove)&&day[slotFinal]&&day[slotFinal].name&&day[slotFinal].id!==placedId){
          const baseSlot=getBaseSlot(slotFinal);
          let sub=0,k=baseSlot;
          while(day[k]&&day[k].name&&day[k].id!==placedId){sub++;k=makeSlotKey(baseSlot,sub);}
          slotFinal=k;
        }
        day[slotFinal]={...entry,id:placedId};
        out[tDk]=day;
        return out;
      },setSd,echo=>{
        const r=(echo[tDk]||{})[slotFinal];
        return !!r&&r.id===placedId;
      },true);
      // ★店をまたいだ時は、元の店のキーから消す（移り先に書けた後に消す＝途中で止まっても消えてなくならない）
      if(stMoved){
        await writeShared(oldKey,oldSd,base=>{
          const out={...base};const od={...(out[req.dk]||{})};delete od[req.slot];out[req.dk]=od;return out;
        },setOldSd,echo=>!((echo[req.dk]||{})[req.slot]),true);
      }
    }
  };

  // 楽観的受付: ローカルで判定できる事前チェックが通ったら即モーダルを閉じてバナー表示し、
  // サーバー保存（読み返し検証つき）はバックグラウンドで継続する。結果はバナーで通知し、
  // 失敗時は通知メール＋サーバー最新値への再同期を行う。
  const handleSave=useCallback((form,loanerAction)=>{
    const req=editMode;
    if(!req)return;
    // 休業日チェック（受付前に弾く）。新規予約は休業日に作れず、入庫日・納車日にも休業日は指定できない。
    if(req.isNew&&isClosedDk(req.dk))throw new Error(`🏖 ${dkLabel(req.dk)} は休業日です。新規予約は追加できません`);
    // 台数制限を掛けた日の上限到達（別端末が先に埋めた場合もここで弾く）
    if(req.isNew&&req.type==='insp'&&inspLimits[req.dk]!=null){
      const _lim=inspLimits[req.dk];
      const _cnt=(inspData[req.dk]||[]).filter(r=>r&&r.name&&r.bookingStatus!=='cancelled').length;
      if(_cnt>=_lim)throw new Error(`🚫 ${dkLabel(req.dk)} は台数制限（最大${_lim}台）に達しているため、車検の予約はできません`);
    }
    // ★車検の日を動かす時の確かめ（2026-10-04）
    if(req.type==='insp'&&!req.isNew&&form._dk&&form._dk!==req.dk){
      if(isClosedDk(form._dk))throw new Error(`🏖 ${dkLabel(form._dk)} は休業日です。別の日を選んでください`);
      if(inspLimits[form._dk]!=null){
        const _lim=inspLimits[form._dk];
        const _cnt=(inspData[form._dk]||[]).filter(r=>r&&r.name&&r.bookingStatus!=='cancelled').length;
        if(_cnt>=_lim)throw new Error(`🚫 ${dkLabel(form._dk)} は台数制限（最大${_lim}台）に達しているため、移せません`);
      }
    }
    if(form.entryDate&&isClosedDk(form.entryDate))throw new Error(`🏖 入庫日 ${dkLabel(form.entryDate)} は休業日です。別の日を選んでください`);
    if(form.deliveryDate&&isClosedDk(form.deliveryDate))throw new Error(`🏖 納車日 ${dkLabel(form.deliveryDate)} は休業日です。別の日を選んでください`);
    // 入庫制限チェック（PC版handleSaveModalと同じルール。受付前に弾いてモーダル内に表示する）
    if(req.type!=='insp'){
      // ★整備の移動先（form._dk / form._slot）で見る。移動していない時は今までどおり req のまま
      const _tDk=form._dk||req.dk, _tSlot=form._slot||getBaseSlot(req.slot), _tSt=form._store||vsId;
      if(_tDk!==req.dk&&isClosedDk(_tDk))throw new Error(`🏖 ${dkLabel(_tDk)} は休業日です。別の日を選んでください`);
      const restriction=schedRestrictions[_tDk];
      if(restriction){
        const toMin=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+m;};
        const slotMin=toMin(_tSlot);
        if(restrCovers(restriction,_tSlot)){
          const isExempt=restrExempt(restriction).includes(form.work);
          if(!isExempt)throw new Error(`🚫 この時間帯（${restrLabels(restriction).join('／')}）は入庫制限中です。制限解除されている作業内容のみ予約可能です`);
        }
      }
    }
    const pid=`${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
    const label=`${form.name}さんの${req.type==='insp'?'車検':'整備'}予約`;
    const pend={pid,kind:'save',type:req.type,dk:req.dk,idx:req.idx,slot:req.slot,store:vsId,name:form.name,by:user?.name||'',check:{time:form.time||'',work:form.work||''},ts:Date.now()};
    addPending(pend);inflightRef.current.add(pid);
    const lockHandle=detachLock();

    // ── 楽観オーバーレイの構築（予定表・代車表へ今すぐ反映）──
    const bkOpt=req.type==='insp'?`insp-${req.dk}-${req.idx}`:`sched-${form._dk||req.dk}-${form._slot||req.slot}`;
    const colorOf=name=>RES_COLORS[[...String(name||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%RES_COLORS.length];
    let displayEntry=Object.fromEntries(Object.entries(form||{}).filter(([k])=>String(k).charAt(0)!==String.fromCharCode(95)));
    const ovs=[];
    const rmBkOv=res=>{const out={};for(const cid of Object.keys(res||{})){const days={...(res[cid]||{})};Object.keys(days).forEach(k=>{if(days[k]?.bookingKey===bkOpt)delete days[k];});out[cid]=days;}return out;};
    if(loanerAction&&loanerAction.kind==='none'){
      displayEntry={...displayEntry,loaner:'',loanerId:null,rentalLabel:'',rentalCarId:null};
      ovs.push({pid,key:storKey('lres',vsId),apply:rmBkOv});
      ovs.push({pid,key:STOR+'rres',apply:rmBkOv});
    }
    if(loanerAction&&(loanerAction.kind==='loaner'||loanerAction.kind==='rental')){
      const isLoaner=loanerAction.kind==='loaner';
      const cars=isLoaner?(vsId==='honten'?loanerCarsH:loanerCarsS):(rentalCars.length?rentalCars:DEFAULT_RENTAL_CARS);
      const car=cars.find(c=>String(c.id)===String(loanerAction.carId));
      displayEntry=isLoaner
        ?{...displayEntry,loaner:car?`${car.name} (${car.num})`:'',loanerId:loanerAction.carId,rentalLabel:'',rentalCarId:null}
        :{...displayEntry,loaner:'',loanerId:null,rentalLabel:`🔑 ${car?car.name:'レンタカー'}${car?.num?` (${car.num})`:''}`,rentalCarId:loanerAction.carId};
      const rec={id:Date.now(),fy:loanerAction.from.y,fm:loanerAction.from.m0,fd:loanerAction.from.d,
        ty:loanerAction.to.y,tm:loanerAction.to.m0,td:loanerAction.to.d,
        user:form.name,color:colorOf(form.name),bookingKey:bkOpt,
        ...(isLoaner?{carName:car?.name,carNum:car?.num}:{})};
      ovs.push({pid,key:isLoaner?storKey('lres',vsId):STOR+'rres',apply:res=>{
        // サーバーに同bookingKeyの予約が既にあれば何もしない（冪等）
        if(Object.values(res||{}).some(days=>Object.values(days||{}).some(r=>r&&r.bookingKey===bkOpt)))return res;
        const days={...(res?.[loanerAction.carId]||{})};
        days[`opt-${rec.id}`]=rec;
        return{...res,[loanerAction.carId]:days};
      }});
    }
    if(req.type==='insp'){
      const entryOpt={...blankInsp(),...displayEntry,store:normStore(form.store)||vsId,bookingStatus:'confirmed'};
      const reflected=r=>r&&r.name===form.name&&r.time===(form.time||'')&&String(r.course)===String(form.course)&&(r.note||'')===(form.note||'');
      // ★日を動かした時は、元の日から消して移り先に出す（2026-10-04）
      const tDkI=form._dk||req.dk;
      const movedI=!req.isNew&&tDkI!==req.dk;
      const occI=r=>!!(r&&r.name&&r.bookingStatus!=='cancelled');
      ovs.push({pid,key:STOR+'insp',apply:data=>{
        const out={...data};
        if(movedI){const old=[...(out[req.dk]||[])];if(old[req.idx])old[req.idx]=blankInsp();out[req.dk]=old;}
        const rows=((out[tDkI]||[]).map(r=>r||blankInsp()));
        let i=req.idx;
        if(movedI){
          if(rows.some(reflected))return out;          // サーバー反映済みならサーバー版を尊重
          const f=rows.findIndex(r=>!occI(r));
          i=f>=0?f:rows.length;
        }
        while(rows.length<=i)rows.push(blankInsp());
        if(!movedI&&reflected(rows[i]))return data;    // サーバー反映済みならサーバー版を尊重
        rows[i]=entryOpt;
        out[tDkI]=rows;
        return out;
      }});
    }else{
      const entryOpt={...displayEntry};
      const reflected=r=>r&&r.name===form.name&&(r.work||'')===(form.work||'')&&(r.content||'')===(form.content||'');
      // ★移動した時は元の枠から消して移り先へ出す（2026-10-01）。店をまたぐ時はキーも変わる（2026-10-02）
      const tDk=form._dk||req.dk, tSlot=form._slot||getBaseSlot(req.slot), tSt=form._store||vsId;
      const stMoved=tSt!==vsId;
      const movedOpt=stMoved||(tDk!==req.dk)||(tSlot!==getBaseSlot(req.slot));
      if(stMoved){
        // 元の店のキーから消す
        ovs.push({pid,key:storKey('sched',vsId),apply:data=>{const out={...data};const od={...(out[req.dk]||{})};delete od[req.slot];out[req.dk]=od;return out;}});
      }
      ovs.push({pid,key:storKey('sched',tSt),apply:data=>{
        const out={...data};
        if(movedOpt&&!stMoved){const od={...(out[req.dk]||{})};delete od[req.slot];out[req.dk]=od;}
        const day={...(out[tDk]||{})};
        if(!movedOpt&&Object.entries(day).some(([k,r])=>reflected(r)&&getBaseSlot(k)===getBaseSlot(tSlot)))return data;
        let k2=movedOpt?tSlot:req.slot,sub=0;
        while(movedOpt&&day[k2]&&day[k2].name){sub++;k2=makeSlotKey(tSlot,sub);}
        day[k2]=entryOpt;
        out[tDk]=day;
        return out;
      }});
    }
    addOverlays(ovs);

    upsertBanner({pid,phase:'saving',label});
    setEditMode(null);
    (async()=>{
      try{
        await saveCore(req,form,loanerAction);
        if(req.cust&&req.cust._file)await applyCustBooking(req.cust,form._dk||req.dk,form,false);   // 顧客リストからの予約（v2.95。移した時はその日で）
        upsertBanner({pid,phase:'done',label});
        setTimeout(()=>removeBanner(pid),6000);
        dropOverlays(pid,75000); // GAS読み取りキャッシュ(60s)が入れ替わるまで重ね続ける
      }catch(e){
        dropOverlays(pid,0);
        upsertBanner({pid,phase:'fail',label,detail:String(e?.message||e)});
        notifyFail(pend,String(e?.message||e));
        fetchAll(true); // 楽観表示をサーバーの実際の状態に揃える
      }finally{
        removePendingStore(pid);inflightRef.current.delete(pid);
        releaseLockHandle(lockHandle);
      }
    })();
  },[editMode,user,vsId,inspData,schedDataH,schedDataS,loanerResH,loanerResS,rentalResData,rentalCars,loanerCarsH,loanerCarsS,inspLimits,schedRestrictions,isClosedDk]);

  // 削除の本体（読み返し検証つき）。バックグラウンドで実行される
  const deleteCore=async(req)=>{
    const bk=req.type==='insp'?`insp-${req.dk}-${req.idx}`:`sched-${req.dk}-${req.slot}`;
    const deletedSeq=req.initial?.seq;
    const deletedName=req.initial?.name;
    if(req.type==='insp'){
      await writeShared(STOR+'insp',hotInsp,base=>{
        const rows=((base[req.dk]||[]).map(r=>r||blankInsp()));
        if(req.idx<rows.length)rows[req.idx]=blankInsp();
        while(rows.length>0&&!rows[rows.length-1]?.name)rows.pop();
        const recomputed=recomputeInspApproval(rows,inspLimits[req.dk]??6);
        return{...base,[req.dk]:recomputed.length>0?recomputed:[]};
      },setInspData,echo=>{
        const r=(echo[req.dk]||[])[req.idx];
        return !r||!r.name||(deletedSeq!=null?r.seq!==deletedSeq:r.name!==deletedName);
      },true);
      // ★保管箱（14日より前の分）にも同じ予約があれば外す（2026-10-04）。
      //   外さないと、画面から消えても読み直すと戻ってくる。
      try{
        const _a=await sGet(STOR+'insp-arch');
        const _n=archDropOneBooking(_a,req.dk,{custId:req.initial&&req.initial.custId,seq:deletedSeq,name:deletedName,no:req.initial&&req.initial.no});
        if(_n){ await sSet(STOR+'insp-arch',_n); setInspArch(_n); }
      }catch(e){}
    }else{
      const sdKey=storKey('sched',vsId);
      const sd=vsId==='honten'?schedDataH:schedDataS;
      const setSd=vsId==='honten'?setSchedDataH:setSchedDataS;
      const deletedId=req.initial?.id;
      // ★その日のその枠を空けるだけ（2026-10-04 に直した）。
      //   以前は保存の処理から写した isMove / stMoved / tDk をそのまま参照していて、
      //   この関数には無い変数なので実行時エラーになり、整備の削除が失敗していた。
      await writeShared(sdKey,sd,base=>{
        const day={...(((base&&base[req.dk])||{}))};
        delete day[req.slot];
        return{...base,[req.dk]:day};
      },setSd,echo=>{
        const r=(echo[req.dk]||{})[req.slot];
        return !r||!r.name||(deletedId!=null?r.id!==deletedId:r.name!==deletedName);
      },true);
    }
    // bookingKeyに紐づく代車・レンタカー予約を連動削除（PC版handleDeleteModalと同じ）
    const lresKey=storKey('lres',vsId);
    const myLres=vsId==='honten'?loanerResH:loanerResS;
    const setMyLres=vsId==='honten'?setLoanerResH:setLoanerResS;
    const cleanBk=res=>{
      const out={};
      for(const cid of Object.keys(res||{})){
        const days={...(res[cid]||{})};
        Object.keys(days).forEach(k=>{if(days[k]?.bookingKey===bk)delete days[k];});
        out[cid]=days;
      }
      return out;
    };
    await Promise.all([
      writeShared(lresKey,myLres,base=>cleanBk(base),setMyLres,echo=>!hasBk(echo,bk),true),
      writeShared(STOR+'rres',rentalResData,base=>cleanBk(base),setRentalResData,echo=>!hasBk(echo,bk),true),
    ]);
  };

  // 削除も保存と同じ楽観的受付（即モーダルを閉じてバックグラウンド実行＋バナー通知）
  const handleDelete=useCallback(()=>{
    const req=editMode;
    if(!req)return;
    const nm=req.initial?.name||'';
    const pid=`${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
    const label=`${nm||'予約'}${nm?'さん':''}の${req.type==='insp'?'車検':'整備'}予約の削除`;
    const pend={pid,kind:'delete',type:req.type,dk:req.dk,idx:req.idx,slot:req.slot,store:vsId,name:nm,by:user?.name||'',check:{},ts:Date.now()};
    addPending(pend);inflightRef.current.add(pid);
    const lockHandle=detachLock();

    // 楽観オーバーレイ: 画面からは今すぐ消す（冪等: サーバー側で既に消えていれば何もしない）
    const bkDel=req.type==='insp'?`insp-${req.dk}-${req.idx}`:`sched-${req.dk}-${req.slot}`;
    const rmBkDel=res=>{const out={};for(const cid of Object.keys(res||{})){const days={...(res[cid]||{})};Object.keys(days).forEach(k=>{if(days[k]?.bookingKey===bkDel)delete days[k];});out[cid]=days;}return out;};
    const ovs=[];
    if(req.type==='insp'){
      ovs.push({pid,key:STOR+'insp',apply:data=>{
        const rows=((data[req.dk]||[]).map(r=>r||blankInsp()));
        if(!(nm&&rows[req.idx]&&rows[req.idx].name===nm))return data;
        rows[req.idx]=blankInsp();
        while(rows.length>0&&!rows[rows.length-1]?.name)rows.pop();
        return{...data,[req.dk]:rows};
      }});
    }else{
      ovs.push({pid,key:storKey('sched',vsId),apply:data=>{
        const day={...(data[req.dk]||{})};
        if(!(day[req.slot]&&day[req.slot].name===nm))return data;
        delete day[req.slot];
        return{...data,[req.dk]:day};
      }});
    }
    ovs.push({pid,key:storKey('lres',vsId),apply:rmBkDel});
    ovs.push({pid,key:STOR+'rres',apply:rmBkDel});
    addOverlays(ovs);

    upsertBanner({pid,phase:'saving',label});
    setEditMode(null);
    (async()=>{
      try{
        await deleteCore(req);
        upsertBanner({pid,phase:'done',label});
        setTimeout(()=>removeBanner(pid),6000);
        dropOverlays(pid,75000);
      }catch(e){
        dropOverlays(pid,0);
        upsertBanner({pid,phase:'fail',label,detail:String(e?.message||e)});
        notifyFail(pend,String(e?.message||e));
        fetchAll(true);
      }finally{
        removePendingStore(pid);inflightRef.current.delete(pid);
        releaseLockHandle(lockHandle);
      }
    })();
  },[editMode,user,vsId,inspData,schedDataH,schedDataS,loanerResH,loanerResS,rentalResData,inspLimits]);

  if(!user&&handPending)
    return <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:UI_BG,color:'white',fontWeight:800,fontSize:15}}>登録を引き継いでいます…</div>;
  if(!user&&(showAuthAdd||(AUTH_REQUIRED&&authMine.length===0)))
    return <AuthAddScreen staffH={staffH} staffS={staffS} viaHandoff={viaHandoff}
      onCancel={(authMine.length>0||!AUTH_REQUIRED)?()=>{setShowAuthAdd(false);setViaHandoff(false);}:null}
      onDone={()=>{setShowAuthAdd(false);setViaHandoff(false);setAuthMine(hubLive(hubLoadMine()));}}/>;
  if(!user)return <LoginScreen
    onLogin={u=>{hubUse(u.name);hubRenew(u.name);setUser(u);setFadeIn(true);}}
    onAddAuth={()=>setShowAuthAdd(true)}/>;
  const TABS=[{id:'cal',label:'カレンダー',icon:'📅'},{id:'sched',label:'スケジュール',icon:'⏰'},{id:'loaner',label:'代車',icon:'🚙'},{id:'cust',label:'顧客',icon:'👥'},{id:'off',label:'休日',icon:'🏖'}];
  const TH=uiTheme(vsId);   // 店舗ごとの色（メインは本店＝青／三田店＝赤。テスト版はオレンジ）
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',position:'relative'}}>
      {fadeIn&&<div style={{position:'absolute',inset:0,background:'white',zIndex:999,animation:'loginFadeIn 2.5s ease forwards',pointerEvents:'none'}} onAnimationEnd={()=>setFadeIn(false)}/>}
      <div style={{flexShrink:0,background:TH.head,paddingTop:'env(safe-area-inset-top,0px)'}}>
        <div style={{padding:'7px 12px',display:'flex',alignItems:'center',gap:6}}>
          <span style={{color:'white',fontSize:12,fontWeight:900,letterSpacing:'.5px',flexShrink:0,whiteSpace:'nowrap'}}>🚗 Hub</span>
          <span style={{color:'rgba(255,255,255,.45)',fontSize:9,fontWeight:700,padding:'1px 5px',border:'1px solid rgba(255,255,255,.25)',borderRadius:8}}>v{MOBILE_VERSION}</span>
          <div style={{width:6,height:6,borderRadius:'50%',background:gasOk===true?'#4ade80':gasOk===false?'#f87171':'#fbbf24',marginLeft:2}}/>
          <span style={{color:'rgba(255,255,255,.55)',fontSize:10,fontWeight:700,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.name}（{myStore==='honten'?'本店':'三田店'}）</span>
          <div style={{marginLeft:'auto',flexShrink:0,display:'flex',gap:6}}>
            <button onClick={()=>{setShowFind(true);loadCf();}} title="検索"
              style={{padding:'3px 9px',background:'rgba(255,255,255,.15)',border:'none',borderRadius:6,color:'white',fontSize:11,cursor:'pointer'}}> 🔍 </button>
            <button onClick={()=>fetchAll(true)} disabled={loading}
              style={{padding:'3px 10px',background:'rgba(255,255,255,.15)',border:'none',borderRadius:6,color:'white',fontSize:10,fontWeight:700,cursor:'pointer'}}> {loading?'⏳':'🔄'} </button>
            <button onClick={()=>setMailModal(true)}
              style={{padding:'3px 8px',background:'rgba(255,255,255,.1)',border:'none',borderRadius:6,color:'rgba(255,255,255,.7)',fontSize:10,cursor:'pointer'}}> ✉ </button>
            {canRestore(user)&&<button onClick={()=>setRestoreModal(true)} title="データ復旧"
              style={{padding:'3px 8px',background:'rgba(255,255,255,.1)',border:'none',borderRadius:6,color:'rgba(255,255,255,.7)',fontSize:10,cursor:'pointer'}}> 🕒 </button>}
            <button onClick={()=>{setAuthAutoOff(true);setUser(null);}}
              style={{padding:'3px 8px',background:'rgba(255,255,255,.1)',border:'none',borderRadius:6,color:'rgba(255,255,255,.7)',fontSize:10,cursor:'pointer'}}> ↩ </button>
          </div>
        </div>
        {/* ★店舗の切り替え（2026-10-02 ユーザー指示・A案）。バナーの色は uiTheme(vsId) が追従する */}
        <div style={{display:'flex',alignItems:'center',gap:5,padding:'0 10px 7px'}}>
          {[['honten','本店'],['sanda','三田店']].map(([id,l])=>{
            const on=vsId===id;
            return(
              <button key={id} onClick={()=>setViewStore(id)}
                style={{padding:'4px 12px',borderRadius:7,fontSize:11,fontWeight:800,
                  border:`1.5px solid ${on?'white':'rgba(255,255,255,.35)'}`,
                  background:on?'white':'rgba(255,255,255,.14)',
                  color:on?TH.acc:'rgba(255,255,255,.75)'}}>
                {on?'🏪 ':''}{l}
              </button>
            );
          })}
          {otherView&&<span style={{marginLeft:'auto',fontSize:9.5,fontWeight:800,color:'white',background:'rgba(0,0,0,.22)',borderRadius:6,padding:'2px 7px',whiteSpace:'nowrap'}}>👁 閲覧中</span>}
        </div>
        <div style={{display:'flex',alignItems:'flex-end',gap:2,padding:'0 8px',background:TH.tab}}>
          {TABS.map(t=>{
            const isActive=tab===t.id;
            return(
              <div key={t.id} onClick={()=>setTab(t.id)}
                style={{background:isActive?'white':'rgba(255,255,255,.12)',borderRadius:'10px 10px 0 0',padding:isActive?'8px 10px':'6px 8px',display:'flex',flexDirection:'column',alignItems:'center',gap:2,minWidth:isActive?54:50,cursor:'pointer',boxShadow:isActive?'0 -3px 10px rgba(0,0,0,.2)':'none',marginTop:isActive?0:4,transition:'all .15s'}}>
                <div style={{fontSize:isActive?16:13,opacity:isActive?1:.8}}>{t.icon}</div>
                <div style={{fontSize:isActive?7.5:7,fontWeight:isActive?800:400,color:isActive?TH.acc:'rgba(255,255,255,.65)',letterSpacing:'.3px'}}> {t.label} </div>
              </div>
            );
          })}
        </div>
      </div>
      {homeHint&&(
        <div style={{flexShrink:0,padding:'9px 12px',background:'#eef2ff',borderBottom:'1.5px solid #c7d2fe',display:'flex',gap:9,alignItems:'flex-start'}}>
          <span style={{fontSize:16,lineHeight:1.2}}>📲</span>
          <div style={{flex:1,fontSize:12,color:'#3730a3',lineHeight:1.65}}>
            <b>ホーム画面に追加</b>しておくと、次からアイコンをタップするだけで開けます。<br/>
            iPhone：共有ボタン（□↑）→「ホーム画面に追加」／Android：メニュー（⋮）→「ホーム画面に追加」<br/>
            <span style={{color:'#6366f1'}}>この登録はアイコンにそのまま引き継がれます（30分以内）</span>
          </div>
          <button onClick={()=>setHomeHint(false)} style={{border:'none',background:'transparent',color:'#6366f1',fontSize:16,padding:'0 2px'}}>✕</button>
        </div>
      )}
      {saveBanners.length>0&&(
        <div style={{flexShrink:0,display:'flex',flexDirection:'column',gap:4,padding:'6px 8px',background:'#f1f5f9'}}>
          {saveBanners.map(b=>{
            const st=b.phase==='saving'?{bg:'#eef2ff',bd:'#a5b4fc',fg:'#3730a3',icon:'📨'}
              :b.phase==='done'?{bg:'#f0fdf4',bd:'#86efac',fg:'#15803d',icon:'✅'}
              :{bg:'#fef2f2',bd:'#fca5a5',fg:'#dc2626',icon:'⚠️'};
            return(
              <div key={b.pid} style={{display:'flex',alignItems:'flex-start',gap:7,padding:'8px 10px',borderRadius:10,background:st.bg,border:`1.5px solid ${st.bd}`}}>
                <span style={{fontSize:13,lineHeight:1.3}}>{st.icon}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:800,color:st.fg,lineHeight:1.35}}>
                    {b.phase==='saving'&&`${b.label}を受け付けました（サーバー反映を確認中… このまま操作できます）`}
                    {b.phase==='done'&&`${b.label}を反映しました`}
                    {b.phase==='fail'&&`${b.label}が保存できていません。お手数ですが内容を確認して、もう一度操作してください`}
                  </div>
                  {b.phase==='fail'&&b.detail&&<div style={{fontSize:10,color:'#991b1b',marginTop:2,lineHeight:1.4}}>{b.detail}</div>}
                </div>
                {b.phase!=='saving'&&<button onClick={()=>removeBanner(b.pid)}
                  style={{flexShrink:0,width:22,height:22,borderRadius:'50%',border:'none',background:'rgba(0,0,0,.06)',color:st.fg,fontSize:11,fontWeight:700}}>✕</button>}
              </div>
            );
          })}
        </div>
      )}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
        {tab==='sched'&&<ScheduleView onEditMemo={(dk,idx)=>setMemoEdit({dk,idx})} otherView={otherView} inspData={inspData} schedDataH={schedDataH} schedDataS={schedDataS} memoDataH={memoDataH} memoDataS={memoDataS}
          loanerResH={loanerResH} loanerResS={loanerResS} loanerCarsH={loanerCarsH} loanerCarsS={loanerCarsS} vsId={vsId} initDate={schedInitDate} onOpenEdit={openEdit} onToggleArrived={toggleArrived} arrivedOv={arrivedOv}
          schedRestrictions={schedRestrictions}
          staffList={((vsId==='honten'?staffH:staffS).length>0?(vsId==='honten'?staffH:staffS):DEFAULT_STAFF.filter(s=>s.store===vsId)).filter(s=>s.badge!=='president'&&s.myNumber!==0)}
          dayOffData={vsId==='honten'?dayOffH:dayOffS}
          closedDays={cDays} closedDates={cDates} overrideOpen={overrideOpen} inspLimits={inspLimits}/>}
        {tab==='cal'&&<CalendarView inspData={inspData} closedDays={cDays} closedDates={cDates} overrideOpen={overrideOpen} vsId={vsId}
          mySched={mySched} privItems={myPriv.items} uid={user.uid}
          onSelectDate={(dk,y,m,d)=>setDayDetail({dk,y,m,d})}/>}
        {tab==='loaner'&&<LoanerView loanerResH={loanerResH} loanerResS={loanerResS} rentalResData={rentalResData} rentalCars={rentalCars}
          loanerCarsH={loanerCarsH} loanerCarsS={loanerCarsS} vsId={vsId}/>}
        {tab==='cust'&&<CustSheet embedded names={cfNames} cache={cfCache} busy={cfBusy} loadingName={cfLoadingName}
          cfx={cfx} cfxBusy={cfBusy&&!cfx} initCust={custSheet&&custSheet.cust||null} initMode={custSheet&&custSheet.mode||'find'}
          vsId={vsId} isClosedDk={isClosedDk} onNeedFile={needCfFile}
          onBook={bookFromCust} onTemp={tempFromCust} onReload={()=>loadCf(true)}/>}
        {tab==='off'&&<HolidayView user={user} vsId={myStore} viewStore={vsId} adminMode={canRestore(user)}
          staffH={staffH.length?staffH:DEFAULT_STAFF.filter(s=>s.store==='honten')} staffS={staffS.length?staffS:DEFAULT_STAFF.filter(s=>s.store==='sanda')}
          dayOffH={dayOffH} dayOffS={dayOffS} pleaveH={pleaveH} pleaveS={pleaveS}
          closedDaysH={closedDaysH} closedDaysS={closedDaysS} closedDatesH={closedDatesH} closedDatesS={closedDatesS} overrideOpen={overrideOpen}
          monthlyHolidays={monthlyHolidays} onToggle={toggleDayOff}
          offNoteH={offNoteH} offNoteS={offNoteS} onSaveNote={saveOffNote}/>}
      </div>
      {dayDetail&&<DayDetailModal {...dayDetail} onEditMemo={otherView?null:(dk,idx)=>setMemoEdit({dk,idx})} inspData={inspData} schedDataH={schedDataH} schedDataS={schedDataS} memoDataH={memoDataH} memoDataS={memoDataS} vsId={vsId} onToggleArrived={toggleArrived} arrivedOv={arrivedOv}
        onClose={()=>setDayDetail(null)}
        mySchedPanel={<MySchedPanel compact dk={dayDetail.dk} user={{uid:user.uid,name:user.name}} pub={mySched} savePub={saveMySched} priv={myPriv}/>}
        onGoSchedule={(y,m,d)=>{setSchedInitDate({y,m,d});setTab('sched');setDayDetail(null);}}/>}
      {memoEdit&&(()=>{
        const arr=((vsId==='honten'?memoDataH:memoDataS)[memoEdit.dk])||[];
        const isNew=memoEdit.idx==null;
        const cur=isNew?null:arr[memoEdit.idx];
        const p=String(memoEdit.dk||'').split('-').map(Number);
        const lbl=(p.length===3&&p[0])?(p[1]+'月'+p[2]+'日'):String(memoEdit.dk||'');
        const items=(Array.isArray(memoItemsRaw)?memoItemsRaw:[]).map(si=>({...si,text:si.text||si.content||si.label||''})).filter(si=>si.text);
        return <MemoSheet dateLabel={lbl} isNew={isNew} items={items}
          initContent={cur?(cur.content||cur.text||''):''}
          onSave={c=>saveDayMemo(memoEdit.dk,memoEdit.idx,c)}
          onDelete={()=>saveDayMemo(memoEdit.dk,memoEdit.idx,'')}
          onClose={()=>setMemoEdit(null)}/>;
      })()}
      {editMode&&<EditModal
        mode={editMode}
        initial={editMode.initial}
        vsId={vsId}
        currentUser={user}
        staffList={DEFAULT_STAFF.filter(s=>s.store===vsId)}
        loanerCars={vsId==='honten'?loanerCarsH:loanerCarsS}
        rentalCars={rentalCars.length?rentalCars:DEFAULT_RENTAL_CARS}
        loanerRes={vsId==='honten'?loanerResH:loanerResS}
        rentalRes={rentalResData}
        lockedBy={editMode.lockedBy}
        isClosedDk={isClosedDk}
        onSave={handleSave}
        onDelete={editMode.isNew?null:handleDelete}
        onClose={closeEdit}/>}
      {showFind&&<FindSheet inspData={inspData} schedDataH={schedDataH} schedDataS={schedDataS}
        cfx={cfx} custBusy={cfBusy&&!cfx} onGo={goDay}
        onGoCust={r=>{setShowFind(false);setCustSheet({cust:null,mode:'find'});setTab('cust');needCfFile(r.f);}}
        onClose={()=>setShowFind(false)} headBg={TH.head}/>}
      {mailModal&&<MailModal user={user} onClose={()=>setMailModal(false)} onSaveEmail={saveNotifyEmail}/>}
      {restoreModal&&<MobileRestoreModal user={user} onClose={()=>setRestoreModal(false)} inspData={inspData}/>}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
// ★JSXの変換結果を端末に覚えさせ、2回目以降は変換を丸ごと省く。
//   実測（現場のスマホ相当のCPU/回線）: 変換だけで約10秒、Babel本体(2.8MB)の取得にも約3秒。
//   覚えていればどちらも要らなくなり、開いてすぐ使える（2026-08-26にユーザーが要望）。
//   目印は __APP_BUILD。バージョンを上げるたびに変わるので、更新後は必ず作り直される。
//   壊れたキャッシュで起動できない事故を防ぐため、描画されなければ捨てて自動で読み直す。
(function(){
  var BUILD=(window.__APP_BUILD||'x');
  var KEY='hub-jsx-mobile-'+BUILD;
  var srcEl=document.getElementById('app-jsx');
  function run(code){var s=document.createElement('script');s.textContent=code;document.body.appendChild(s);}
  function compile(){
    var b=document.createElement('script');
    b.src='https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.9/babel.min.js';
    b.onload=function(){
      var code=null;
      try{code=Babel.transform(srcEl.textContent,{presets:['react']}).code;}
      catch(e){console.error('JSXの変換に失敗',e);return;}
      try{
        for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);
          if(k&&k.indexOf('hub-jsx-mobile-')===0&&k!==KEY)localStorage.removeItem(k);} // 旧版は溜めない
        localStorage.setItem(KEY,code);
      }catch(e){}
      run(code);
    };
    b.onerror=function(){console.error('Babelを読み込めませんでした');};
    document.head.appendChild(b);
  }
  var cached=null;try{cached=localStorage.getItem(KEY);}catch(e){}
  if(cached){
    run(cached);
    // 覚えていた内容が壊れていた時の保険：描画されていなければ捨てて読み直す
    setTimeout(function(){
      var root=document.getElementById('root');
      if(root&&root.children.length===0){
        try{localStorage.removeItem(KEY);}catch(e){}
        location.reload();
      }
    },8000);
    return;
  }
  compile();
})();
</script>
</body>
